<!DOCTYPE html>

<head>

      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>AI 構圖助手 V5.8.1</title>

<style>

button{

<body>

<div id="cameraArea">

    </video>

    </button>

        </span>

        V5.8.1｜消失點精準版

</div>


<script>

/* =====================================================
   DOM
===================================================== */

var video =
document.getElementById("video");

var overlay =
document.getElementById("overlay");

var ctx =
overlay.getContext("2d");

var ac =
document.getElementById("analysisCanvas");

var ax =
ac.getContext(
    "2d",
    {willReadFrequently:true}
);

var scoreEl =
document.getElementById("score");

var compositionEl =
document.getElementById("composition");

var descEl =
document.getElementById("desc");

var messageEl =
document.getElementById("message");

var zoom =
document.getElementById("zoom");

var zoomText =
document.getElementById("zoomText");


/* =====================================================
   STATE
===================================================== */

var stream = null;

var facing =
"environment";

var targetGuide =
null;

var liveGuide =
null;

var navigation =
false;

var currentScore =
0;

var lastAnalysisTime =
0;

var LIVE_INTERVAL =
450;

var liveHistory =
[];

var HISTORY_SIZE =
5;

var SMOOTH =
0.30;

var MAX_STEP =
0.055;

var completeCount =
0;


/* =====================================================
   BASIC
===================================================== */

function clamp(value,min,max){

    return Math.max(
        min,
        Math.min(max,value)
    );

}


function median(array){

    if(
        !array ||
        array.length === 0
    ){
        return 0;
    }

    var a =
    array.slice().sort(
        function(x,y){
            return x-y;
        }
    );

    var m =
    Math.floor(a.length/2);

    if(a.length % 2){
        return a[m];
    }

    return(
        a[m-1]+a[m]
    )/2;

}


function normalizeAngle(a){

    while(
        a > Math.PI/2
    ){
        a -= Math.PI;
    }

    while(
        a < -Math.PI/2
    ){
        a += Math.PI;
    }

    return a;

}


/* =====================================================
   CAMERA
===================================================== */

async function startCamera(){

    try{

        if(stream){

            stream
            .getTracks()
            .forEach(
                function(track){
                    track.stop();
                }
            );

        }

        stream =
        await navigator.mediaDevices
        .getUserMedia({

            video:{

                facingMode:{
                    ideal:facing
                },

                width:{
                    ideal:1280
                },

                height:{
                    ideal:720
                }

            },

            audio:false

        });

        video.srcObject =
        stream;

        await video.play();

        resizeOverlay();

        resetAnalysis();

    }
    catch(error){

        console.log(error);

        compositionEl.innerText =
        "相機無法開啟";

        descEl.innerText =
        "請確認 Safari 相機權限";

        messageEl.innerText =
        "❌ 無法開啟相機";

    }

}


async function changeCamera(mode){

    facing =
    mode;

    await startCamera();

}


/* =====================================================
   RESET
===================================================== */

function resetAnalysis(){

    navigation =
    false;

    targetGuide =
    null;

    liveGuide =
    null;

    liveHistory =
    [];

    completeCount =
    0;

    currentScore =
    0;

    scoreEl.innerHTML =
    '-- <small>/100</small>';

    compositionEl.innerText =
    "等待分析";

    descEl.innerText =
    "對準道路、鐵軌、走廊或街道";

    messageEl.innerText =
    "✨ 固定鏡頭後，按 AI 自動分析";

}


/* =====================================================
   AI AUTO
===================================================== */

function runAI(){

    if(
        video.readyState < 2
    ){

        messageEl.innerText =
        "⏳ 鏡頭還沒準備完成";

        return;

    }

    navigation =
    false;

    targetGuide =
    null;

    liveGuide =
    null;

    liveHistory =
    [];

    completeCount =
    0;

    currentScore =
    0;

    scoreEl.innerHTML =
    '-- <small>/100</small>';

    compositionEl.innerText =
    "AI 分析中";

    descEl.innerText =
    "正在尋找主要消失點";

    messageEl.innerText =
    "✨ 請保持手機不動...";

    var results =
    [];

    var count =
    0;

    /*
    V5.8.1
    取7幀。

    比V5.8的5幀多一點，
    讓我們有能力排除離群值。
    */

    var timer =
    setInterval(
        function(){

            var result =
            analyzePerspective();

            if(result){
                results.push(result);
            }

            count++;

            if(count >= 7){

                clearInterval(timer);

                finishAI(results);

            }

        },
        160
    );

}


/* =====================================================
   MULTI FRAME FILTER
===================================================== */

function finishAI(results){

    if(
        results.length < 3
    ){

        failAnalysis();

        return;

    }


    /*
    第一次中位數
    */

    var mx =
    median(
        results.map(
            function(r){
                return r.vx;
            }
        )
    );

    var my =
    median(
        results.map(
            function(r){
                return r.vy;
            }
        )
    );


    /*
    計算每一幀離中心多遠
    */

    var distances =
    results.map(
        function(r){

            return Math.hypot(
                r.vx-mx,
                r.vy-my
            );

        }
    );


    var medianDistance =
    median(distances);


    /*
    V5.8.1：
    排除明顯離群值。

    最低容許約4.5%畫面，
    如果整體本來就稍有波動，
    則依中位距離自動放寬。
    */

    var limit =
    Math.max(
        .045,
        medianDistance*2.5
    );


    var filtered =
    results.filter(
        function(r){

            var d =
            Math.hypot(
                r.vx-mx,
                r.vy-my
            );

            return d <= limit;

        }
    );


    if(
        filtered.length < 3
    ){

        failAnalysis();

        return;

    }


    /*
    排除離群後
    再重新算一次中心。
    */

    mx =
    median(
        filtered.map(
            function(r){
                return r.vx;
            }
        )
    );

    my =
    median(
        filtered.map(
            function(r){
                return r.vy;
            }
        )
    );


    /*
    找最接近最終中位點、
    同時信心較好的那一幀。
    */

    var best =
    null;

    var bestValue =
    Infinity;


    filtered.forEach(
        function(r){

            var d =
            Math.hypot(
                r.vx-mx,
                r.vy-my
            );

            var value =
            d -
            r.confidence*.012;

            if(
                value < bestValue
            ){

                bestValue =
                value;

                best =
                r;

            }

        }
    );


    if(!best){

        failAnalysis();

        return;

    }


    /*
    最後穩定度檢查
    */

    var spread =
    median(
        filtered.map(
            function(r){

                return Math.hypot(
                    r.vx-mx,
                    r.vy-my
                );

            }
        )
    );


    if(
        spread > .085
    ){

        failAnalysis();

        return;

    }


    compositionEl.innerText =
    "◎ 單點透視";

    descEl.innerText =
    "已找到畫面的主要消失點";


    /*
    目前點採用多幀中位數，
    而不是單一best幀。
    */

    liveGuide = {

        vx:mx,

        vy:my,

        confidence:
        best.confidence

    };


    liveHistory =
    [
        {
            vx:mx,
            vy:my
        }
    ];


    /*
    =================================================
    建議位置
    =================================================

    V5.8.1 暫時維持 V5.8 邏輯。

    這版重點不是改構圖美學，
    而是先驗證目前消失點是否抓準。
    */

    var possibleX =
    [
        1/3,
        .5,
        2/3
    ];


    var idealX =
    possibleX[0];

    var nearest =
    Infinity;


    possibleX.forEach(
        function(x){

            var d =
            Math.abs(
                mx-x
            );

            if(
                d < nearest
            ){

                nearest =
                d;

                idealX =
                x;

            }

        }
    );


    var dx =
    clamp(
        idealX-mx,
        -.10,
        .10
    );


    var dy =
    clamp(
        .40-my,
        -.10,
        .10
    );


    targetGuide = {

        vx:
        clamp(
            mx+dx,
            .12,
            .88
        ),

        vy:
        clamp(
            my+dy,
            .18,
            .72
        )

    };


    /*
    白圈鎖定
    */

    try{
        Object.freeze(
            targetGuide
        );
    }
    catch(e){}


    navigation =
    true;


    calculateScore();


    messageEl.innerText =
    "○ 白圈是建議位置，● 是目前消失點";

}


/* =====================================================
   FAIL
===================================================== */

function failAnalysis(){

    navigation =
    false;

    targetGuide =
    null;

    liveGuide =
    null;

    liveHistory =
    [];

    completeCount =
    0;

    currentScore =
    0;

    scoreEl.innerHTML =
    '-- <small>/100</small>';

    compositionEl.innerText =
    "找不到穩定透視";

    descEl.innerText =
    "目前畫面沒有明確的共同消失點";

    messageEl.innerText =
    "📱 換個角度後，再按 AI 自動";

}


/* =====================================================
   LINE TEST
===================================================== */

/*
V5.8.1 最大修改之一：

不再只看某一個pixel有沒有強邊緣。

從候選點沿著線條方向，
往前後檢查一段距離。

如果只有局部小線，
支持率會很低。

如果是道路邊線、鐵軌、
建築透視線，
沿線會持續存在強邊緣。
*/

function measureLineSupport(
    x,
    y,
    angle,
    edge,
    W,
    H,
    threshold
){

    var dx =
    Math.cos(angle);

    var dy =
    Math.sin(angle);


    var total =
    0;

    var hits =
    0;

    var weighted =
    0;


    /*
    往前後各約40pixel
    */

    for(
        var s=-40;
        s<=40;
        s+=5
    ){

        if(
            Math.abs(s) < 5
        ){
            continue;
        }


        var px =
        Math.round(
            x+dx*s
        );

        var py =
        Math.round(
            y+dy*s
        );


        if(
            px < 1 ||
            px >= W-1 ||
            py < 1 ||
            py >= H-1
        ){
            continue;
        }


        total++;


        /*
        不只看正中心pixel，
        看附近3x3有沒有強邊緣。
        */

        var localMax =
        0;


        for(
            var yy=-1;
            yy<=1;
            yy++
        ){

            for(
                var xx=-1;
                xx<=1;
                xx++
            ){

                var value =
                edge[
                    (py+yy)*W +
                    (px+xx)
                ];

                if(
                    value > localMax
                ){
                    localMax =
                    value;
                }

            }

        }


        if(
            localMax >
            threshold*.72
        ){

            hits++;

            weighted +=
            Math.min(
                2,
                localMax /
                threshold
            );

        }

    }


    if(
        total === 0
    ){
        return 0;
    }


    var hitRatio =
    hits/total;


    /*
    持續性比分散的幾個強pixel重要。
    */

    return(
        hitRatio*.72
        +
        Math.min(
            1,
            weighted/total
        )*.28
    );

}


/* =====================================================
   DISTANCE TO LINE
===================================================== */

function distanceToLine(
    px,
    py,
    line
){

    var dx =
    Math.cos(
        line.angle
    );

    var dy =
    Math.sin(
        line.angle
    );


    return Math.abs(

        (px-line.x)*(-dy)

        +

        (py-line.y)*dx

    );

}


/* =====================================================
   INTERSECTION
===================================================== */

function intersectAngleLines(
    A,
    B
){

    var adx =
    Math.cos(
        A.angle
    );

    var ady =
    Math.sin(
        A.angle
    );

    var bdx =
    Math.cos(
        B.angle
    );

    var bdy =
    Math.sin(
        B.angle
    );


    var denominator =
    adx*bdy -
    ady*bdx;


    if(
        Math.abs(
            denominator
        ) < .0001
    ){

        return null;

    }


    var dx =
    B.x-A.x;

    var dy =
    B.y-A.y;


    var t =
    (
        dx*bdy -
        dy*bdx
    )
    /
    denominator;


    return{

        x:
        A.x+t*adx,

        y:
        A.y+t*ady

    };

}


/* =====================================================
   ANALYZE PERSPECTIVE
===================================================== */

function analyzePerspective(){

    var W =
    ac.width;

    var H =
    ac.height;


    if(
        video.readyState < 2
    ){
        return null;
    }


    ax.drawImage(
        video,
        0,
        0,
        W,
        H
    );


    var image =
    ax.getImageData(
        0,
        0,
        W,
        H
    );


    var data =
    image.data;


    var gray =
    new Float32Array(
        W*H
    );


    /*
    =================================================
    灰階
    =================================================
    */

    for(
        var i=0;
        i<W*H;
        i++
    ){

        var p =
        i*4;

        gray[i] =
        data[p]*.299 +
        data[p+1]*.587 +
        data[p+2]*.114;

    }


    /*
    =================================================
    Sobel
    =================================================
    */

    var edge =
    new Float32Array(
        W*H
    );

    var direction =
    new Float32Array(
        W*H
    );

    var strengths =
    [];


    for(
        var y=1;
        y<H-1;
        y++
    ){

        for(
            var x=1;
            x<W-1;
            x++
        ){

            var index =
            y*W+x;


            var gx =

            -gray[index-W-1]
            +
            gray[index-W+1]
            -
            2*gray[index-1]
            +
            2*gray[index+1]
            -
            gray[index+W-1]
            +
            gray[index+W+1];


            var gy =

            -gray[index-W-1]
            -
            2*gray[index-W]
            -
            gray[index-W+1]
            +
            gray[index+W-1]
            +
            2*gray[index+W]
            +
            gray[index+W+1];


            var mag =
            Math.hypot(
                gx,
                gy
            );


            edge[index] =
            mag;


            direction[index] =
            normalizeAngle(

                Math.atan2(
                    gy,
                    gx
                )

                +

                Math.PI/2

            );


            strengths.push(
                mag
            );

        }

    }


    if(
        strengths.length === 0
    ){
        return null;
    }


    strengths.sort(
        function(a,b){
            return a-b;
        }
    );


    /*
    V5.8是92百分位。

    V5.8.1稍微放寬到90.5%，
    因為後面還會做長線支持檢查。

    這樣不會只剩非常亮的短邊。
    */

    var threshold =
    strengths[
        Math.floor(
            strengths.length*.905
        )
    ]
    ||
    70;


    /*
    =================================================
    候選線
    =================================================
    */

    var cell =
    10;

    var candidates =
    [];


    for(
        var cy=0;
        cy<H;
        cy+=cell
    ){

        for(
            var cx=0;
            cx<W;
            cx+=cell
        ){

            var bestMag =
            0;

            var bx =
            0;

            var by =
            0;

            var ba =
            0;


            for(
                var yy=cy;
                yy<
                Math.min(
                    cy+cell,
                    H
                );
                yy++
            ){

                for(
                    var xx=cx;
                    xx<
                    Math.min(
                        cx+cell,
                        W
                    );
                    xx++
                ){

                    var idx =
                    yy*W+xx;


                    var mag =
                    edge[idx];


                    if(
                        mag < threshold
                    ){
                        continue;
                    }


                    var angle =
                    direction[idx];


                    var absAngle =
                    Math.abs(angle);


                    /*
                    太水平不要。

                    垂直線也不要。

                    V5.8.1稍微允許
                    更接近垂直的透視線。
                    */

                    if(
                        absAngle < .14
                        ||
                        absAngle > 1.47
                    ){
                        continue;
                    }


                    if(
                        mag > bestMag
                    ){

                        bestMag =
                        mag;

                        bx =
                        xx;

                        by =
                        yy;

                        ba =
                        angle;

                    }

                }

            }


            if(
                bestMag <= 0
            ){
                continue;
            }


            /*
            =================================================
            長線支持
            =================================================
            */

            var support =
            measureLineSupport(
                bx,
                by,
                ba,
                edge,
                W,
                H,
                threshold
            );


            /*
            很短的局部線直接丟掉。
            */

            if(
                support < .20
            ){
                continue;
            }


            /*
            位置權重：

            靠近畫面底部的線，
            對道路透視通常更有價值。

            但只小幅加權，
            避免強迫所有場景都變道路。
            */

            var depthWeight =
            .85 +
            (by/H)*.30;


            candidates.push({

                x:bx,

                y:by,

                angle:ba,

                strength:
                bestMag,

                continuity:
                support,

                weight:
                bestMag *
                (
                    .45 +
                    support*1.20
                )
                *
                depthWeight

            });

        }

    }


    if(
        candidates.length < 8
    ){
        return null;
    }


    /*
    只保留品質較好的候選線。

    防止城市窗戶產生幾十條
    小斜線淹沒道路。
    */

    candidates.sort(
        function(a,b){
            return b.weight-a.weight;
        }
    );


    if(
        candidates.length > 48
    ){

        candidates =
        candidates.slice(
            0,
            48
        );

    }


    /*
    =================================================
    交點
    =================================================
    */

    var intersections =
    [];


    for(
        var a=0;
        a<candidates.length;
        a++
    ){

        for(
            var b=a+1;
            b<candidates.length;
            b++
        ){

            var A =
            candidates[a];

            var B =
            candidates[b];


            var angleDiff =
            Math.abs(

                normalizeAngle(
                    A.angle-B.angle
                )

            );


            /*
            幾乎平行
            不拿來算消失點。
            */

            if(
                angleDiff < .24
            ){
                continue;
            }


            /*
            V5.8.1：
            優先一左一右的方向。

            左邊往右上／右下，
            右邊往左上／左下，
            才比較像真正收斂。
            */

            var p =
            intersectAngleLines(
                A,
                B
            );


            if(!p){
                continue;
            }


            /*
            消失點搜尋範圍。

            V5.8.1把下限由78%
            拉高到72%。

            因為剛才測試最大的錯誤
            就是消失點被拉到路面太下面。
            */

            if(
                p.x < W*.05
                ||
                p.x > W*.95
                ||
                p.y < H*.06
                ||
                p.y > H*.72
            ){
                continue;
            }


            /*
            來源線必須分布在
            消失點左右兩側。
            */

            var opposite =
            (
                A.x < p.x
                &&
                B.x > p.x
            )
            ||
            (
                B.x < p.x
                &&
                A.x > p.x
            );


            if(!opposite){
                continue;
            }


            var spread =
            Math.abs(
                A.x-B.x
            );


            if(
                spread < W*.12
            ){
                continue;
            }


            /*
            =================================================
            V5.8.1 新權重
            =================================================

            1. 原始邊緣強度
            2. 長線持續性
            3. 左右間距
            4. 方向差
            5. 消失點高度
            */


            var lineQuality =
            Math.sqrt(
                A.weight *
                B.weight
            );


            var spreadWeight =
            clamp(
                spread/(W*.42),
                .25,
                1
            );


            var angleWeight =
            clamp(
                angleDiff/.75,
                .30,
                1
            );


            /*
            輕微偏好畫面上半部。

            注意：
            不是直接指定消失點在40%。

            只是兩個候選區品質差不多時，
            避免近景短線交點搶走第一名。
            */

            var normalizedY =
            p.y/H;


            var horizonWeight =
            1.12 -
            normalizedY*.28;


            horizonWeight =
            clamp(
                horizonWeight,
                .88,
                1.10
            );


            var weight =
            lineQuality *
            spreadWeight *
            angleWeight *
            horizonWeight;


            intersections.push({

                x:p.x,

                y:p.y,

                weight:weight

            });

        }

    }


    if(
        intersections.length < 5
    ){
        return null;
    }


    /*
    =================================================
    密度投票
    =================================================
    */

    var gridW =
    32;

    var gridH =
    24;


    var votes =
    new Float32Array(
        gridW*gridH
    );


    intersections.forEach(
        function(p){

            var gx =
            Math.floor(
                p.x/W*gridW
            );

            var gy =
            Math.floor(
                p.y/H*gridH
            );


            if(
                gx < 0 ||
                gx >= gridW ||
                gy < 0 ||
                gy >= gridH
            ){
                return;
            }


            for(
                var yy=-1;
                yy<=1;
                yy++
            ){

                for(
                    var xx=-1;
                    xx<=1;
                    xx++
                ){

                    var nx =
                    gx+xx;

                    var ny =
                    gy+yy;


                    if(
                        nx < 0 ||
                        nx >= gridW ||
                        ny < 0 ||
                        ny >= gridH
                    ){
                        continue;
                    }


                    var blurWeight =
                    1;


                    if(
                        xx !== 0 ||
                        yy !== 0
                    ){

                        blurWeight =
                        .42;

                    }


                    votes[
                        ny*gridW+nx
                    ]
                    +=
                    p.weight *
                    blurWeight;

                }

            }

        }
    );


    /*
    找最高密度區
    */

    var bestIndex =
    0;


    for(
        var v=1;
        v<votes.length;
        v++
    ){

        if(
            votes[v] >
            votes[bestIndex]
        ){

            bestIndex =
            v;

        }

    }


    var bestGX =
    bestIndex %
    gridW;


    var bestGY =
    Math.floor(
        bestIndex/gridW
    );


    /*
    收集最佳區域交點
    */

    var cluster =
    [];


    intersections.forEach(
        function(p){

            var gx =
            Math.floor(
                p.x/W*gridW
            );

            var gy =
            Math.floor(
                p.y/H*gridH
            );


            if(
                Math.abs(
                    gx-bestGX
                ) <= 1
                &&
                Math.abs(
                    gy-bestGY
                ) <= 1
            ){

                cluster.push(p);

            }

        }
    );


    if(
        cluster.length < 3
    ){
        return null;
    }


    /*
    =================================================
    加權中位數附近再精修
    =================================================
    */

    var roughX =
    median(
        cluster.map(
            function(p){
                return p.x;
            }
        )
    );

    var roughY =
    median(
        cluster.map(
            function(p){
                return p.y;
            }
        )
    );


    /*
    把離群交點再排一次。
    */

    var clusterDistances =
    cluster.map(
        function(p){

            return Math.hypot(
                p.x-roughX,
                p.y-roughY
            );

        }
    );


    var cd =
    median(
        clusterDistances
    );


    var clusterLimit =
    Math.max(
        6,
        cd*2.2
    );


    var cleanCluster =
    cluster.filter(
        function(p){

            return(
                Math.hypot(
                    p.x-roughX,
                    p.y-roughY
                )
                <=
                clusterLimit
            );

        }
    );


    if(
        cleanCluster.length < 3
    ){

        cleanCluster =
        cluster;

    }


    /*
    加權平均。

    因為此時離群值已經排掉，
    加權平均能比單純median
    更精細落在主線交會處。
    */

    var sumX =
    0;

    var sumY =
    0;

    var sumW =
    0;


    cleanCluster.forEach(
        function(p){

            var w =
            Math.sqrt(
                Math.max(
                    1,
                    p.weight
                )
            );


            sumX +=
            p.x*w;

            sumY +=
            p.y*w;

            sumW +=
            w;

        }
    );


    if(
        sumW <= 0
    ){
        return null;
    }


    var vx =
    sumX/sumW;

    var vy =
    sumY/sumW;


    /*
    =================================================
    最終線支持驗證
    =================================================
    */

    var supportingLines =
    0;

    var leftSupport =
    0;

    var rightSupport =
    0;

    var longSupport =
    0;


    candidates.forEach(
        function(line){

            var distance =
            distanceToLine(
                vx,
                vy,
                line
            );


            if(
                distance <
                W*.050
            ){

                supportingLines++;


                if(
                    line.x < vx
                ){
                    leftSupport++;
                }
                else{
                    rightSupport++;
                }


                longSupport +=
                line.continuity;

            }

        }
    );


    /*
    必須左右都有支持
    */

    if(
        supportingLines < 4
        ||
        leftSupport < 1
        ||
        rightSupport < 1
    ){

        return null;

    }


    /*
    平均長線支持太差，
    代表可能只是大量短紋理
    偶然相交。
    */

    var averageContinuity =
    longSupport /
    supportingLines;


    if(
        averageContinuity < .22
    ){

        return null;

    }


    /*
    左右平衡
    */

    var balance =
    Math.min(
        leftSupport,
        rightSupport
    )
    /
    Math.max(
        leftSupport,
        rightSupport
    );


    /*
    交點集中程度
    */

    var clusterRatio =
    cleanCluster.length /
    intersections.length;


    /*
    支持線比例
    */

    var supportRatio =
    supportingLines /
    candidates.length;


    /*
    =================================================
    Confidence

    注意：
    仍然只是辨識信心，
    不是構圖分數。
    =================================================
    */

    var confidence =

    .20

    +

    Math.min(
        .26,
        supportRatio*1.5
    )

    +

    Math.min(
        .20,
        clusterRatio*3.2
    )

    +

    Math.min(
        .18,
        averageContinuity*.42
    )

    +

    balance*.16;


    confidence =
    clamp(
        confidence,
        0,
        .98
    );


    return{

        vx:
        vx/W,

        vy:
        vy/H,

        confidence:
        confidence,

        support:
        supportingLines,

        continuity:
        averageContinuity

    };

}


/* =====================================================
   LIVE SMOOTH
===================================================== */

function smoothLive(now){

    liveHistory.push({

        vx:now.vx,

        vy:now.vy

    });


    if(
        liveHistory.length >
        HISTORY_SIZE
    ){

        liveHistory.shift();

    }


    var medianX =
    median(
        liveHistory.map(
            function(p){
                return p.vx;
            }
        )
    );


    var medianY =
    median(
        liveHistory.map(
            function(p){
                return p.vy;
            }
        )
    );


    if(!liveGuide){

        return{

            vx:medianX,

            vy:medianY,

            confidence:
            now.confidence

        };

    }


    var dx =
    medianX -
    liveGuide.vx;


    var dy =
    medianY -
    liveGuide.vy;


    var distance =
    Math.hypot(
        dx,
        dy
    );


    /*
    突然跳很遠，
    不讓畫面綠點瞬移。
    */

    if(
        distance >
        MAX_STEP
    ){

        var ratio =
        MAX_STEP /
        distance;

        dx *= ratio;
        dy *= ratio;

    }


    return{

        vx:
        liveGuide.vx +
        dx*SMOOTH,

        vy:
        liveGuide.vy +
        dy*SMOOTH,

        confidence:
        now.confidence

    };

}


/* =====================================================
   NAVIGATION
===================================================== */

function updateNavigation(){

    if(
        !navigation
        ||
        !targetGuide
    ){
        return;
    }


    var now =
    analyzePerspective();


    if(!now){

        currentScore =
        Math.max(
            0,
            currentScore-2
        );

        completeCount =
        0;

        updateScoreUI();

        messageEl.innerText =
        "⚠️ 消失點暫時不穩，慢慢移動手機";

        return;

    }


    liveGuide =
    smoothLive(now);


    calculateScore();

}


/* =====================================================
   SCORE
===================================================== */

function calculateScore(){

    if(
        !targetGuide
        ||
        !liveGuide
    ){
        return;
    }


    var dx =
    liveGuide.vx -
    targetGuide.vx;


    var dy =
    liveGuide.vy -
    targetGuide.vy;


    var distance =
    Math.hypot(
        dx,
        dy
    );


    /*
    綠點與白圈重合 = 100
    */

    var score =
    100 -
    (
        distance/.28
        *
        100
    );


    score =
    Math.round(
        clamp(
            score,
            0,
            100
        )
    );


    currentScore =
    score;


    updateScoreUI();


    /*
    連續3次接近
    才算完成
    */

    if(
        distance < .035
    ){

        completeCount++;

    }
    else{

        completeCount =
        0;

    }


    if(
        completeCount >= 3
    ){

        messageEl.innerText =
        "✅ 構圖完成，可以拍了";

        return;

    }


    var tolerance =
    .025;


    var horizontal =
    "";

    var vertical =
    "";


    if(
        dx > tolerance
    ){

        horizontal =
        "➡️ 手機往右";

    }
    else
    if(
        dx < -tolerance
    ){

        horizontal =
        "⬅️ 手機往左";

    }


    if(
        dy > tolerance
    ){

        vertical =
        "⬇️ 鏡頭稍微往下";

    }
    else
    if(
        dy < -tolerance
    ){

        vertical =
        "⬆️ 鏡頭稍微往上";

    }


    if(
        horizontal &&
        vertical
    ){

        messageEl.innerText =
        horizontal +
        "　" +
        vertical;

    }
    else
    if(horizontal){

        messageEl.innerText =
        horizontal;

    }
    else
    if(vertical){

        messageEl.innerText =
        vertical;

    }
    else{

        messageEl.innerText =
        "👌 很接近了，微調一下";

    }

}


/* =====================================================
   SCORE UI
===================================================== */

function updateScoreUI(){

    scoreEl.innerHTML =
    currentScore +
    ' <small>/100</small>';

}


/* =====================================================
   COLOR
===================================================== */

function getLiveColor(){

    if(
        currentScore >= 88
    ){
        return "#2cff67";
    }

    if(
        currentScore >= 65
    ){
        return "#ffd633";
    }

    return "#ffffff";

}


/* =====================================================
   DRAW TARGET
===================================================== */

function drawTarget(){

    if(!targetGuide){
        return;
    }


    var w =
    overlay.clientWidth;

    var h =
    overlay.clientHeight;


    var x =
    targetGuide.vx*w;

    var y =
    targetGuide.vy*h;


    ctx.save();


    ctx.strokeStyle =
    "#ffffff";

    ctx.fillStyle =
    "#ffffff";

    ctx.lineWidth =
    3;

    ctx.setLineDash([]);


    /*
    白圈
    */

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        20,
        0,
        Math.PI*2
    );

    ctx.stroke();


    /*
    外圈
    */

    ctx.globalAlpha =
    .48;

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        29,
        0,
        Math.PI*2
    );

    ctx.stroke();

    ctx.globalAlpha =
    1;


    /*
    十字
    */

    ctx.beginPath();

    ctx.moveTo(
        x-38,
        y
    );

    ctx.lineTo(
        x-24,
        y
    );


    ctx.moveTo(
        x+24,
        y
    );

    ctx.lineTo(
        x+38,
        y
    );


    ctx.moveTo(
        x,
        y-38
    );

    ctx.lineTo(
        x,
        y-24
    );


    ctx.moveTo(
        x,
        y+24
    );

    ctx.lineTo(
        x,
        y+38
    );

    ctx.stroke();


    ctx.font =
    "bold 14px -apple-system,Arial";

    ctx.textAlign =
    "center";

    ctx.fillText(
        "○ 建議位置",
        x,
        y-43
    );


    ctx.restore();

}


/* =====================================================
   DRAW LIVE
===================================================== */

function drawLive(){

    if(
        !navigation
        ||
        !liveGuide
    ){
        return;
    }


    var w =
    overlay.clientWidth;

    var h =
    overlay.clientHeight;


    var x =
    liveGuide.vx*w;

    var y =
    liveGuide.vy*h;


    var color =
    getLiveColor();


    ctx.save();


    ctx.fillStyle =
    color;

    ctx.strokeStyle =
    color;

    ctx.lineWidth =
    3;


    /*
    目前點
    */

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        8,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.beginPath();

    ctx.arc(
        x,
        y,
        15,
        0,
        Math.PI*2
    );

    ctx.stroke();


    ctx.font =
    "bold 14px -apple-system,Arial";

    ctx.textAlign =
    "center";

    ctx.fillStyle =
    color;


    ctx.fillText(
        "● 目前消失點",
        x,
        y-23
    );


    /*
    目前 → 目標
    */

    if(targetGuide){

        var tx =
        targetGuide.vx*w;

        var ty =
        targetGuide.vy*h;


        ctx.strokeStyle =
        color;

        ctx.lineWidth =
        2;

        ctx.globalAlpha =
        .85;

        ctx.setLineDash(
            [7,7]
        );


        ctx.beginPath();

        ctx.moveTo(
            x,
            y
        );

        ctx.lineTo(
            tx,
            ty
        );

        ctx.stroke();


        ctx.setLineDash([]);


        /*
        箭頭
        */

        var angle =
        Math.atan2(
            ty-y,
            tx-x
        );


        var arrowSize =
        10;


        ctx.beginPath();


        ctx.moveTo(
            tx,
            ty
        );


        ctx.lineTo(

            tx -
            Math.cos(
                angle-.55
            )*arrowSize,

            ty -
            Math.sin(
                angle-.55
            )*arrowSize

        );


        ctx.moveTo(
            tx,
            ty
        );


        ctx.lineTo(

            tx -
            Math.cos(
                angle+.55
            )*arrowSize,

            ty -
            Math.sin(
                angle+.55
            )*arrowSize

        );


        ctx.stroke();

    }


    ctx.restore();

}


/* =====================================================
   DRAW PERSPECTIVE HINT
===================================================== */

function drawPerspectiveHint(){

    if(!liveGuide){
        return;
    }


    var w =
    overlay.clientWidth;

    var h =
    overlay.clientHeight;


    var x =
    liveGuide.vx*w;

    var y =
    liveGuide.vy*h;


    ctx.save();


    ctx.strokeStyle =
    "rgba(255,255,255,.48)";

    ctx.lineWidth =
    2;

    ctx.setLineDash(
        [10,10]
    );


    /*
    左下提示線
    */

    ctx.beginPath();

    ctx.moveTo(
        x,
        y
    );

    ctx.lineTo(
        w*.08,
        h*.94
    );

    ctx.stroke();


    /*
    右下提示線
    */

    ctx.beginPath();

    ctx.moveTo(
        x,
        y
    );

    ctx.lineTo(
        w*.92,
        h*.94
    );

    ctx.stroke();


    ctx.restore();

}


/* =====================================================
   OVERLAY
===================================================== */

function resizeOverlay(){

    var rect =
    overlay.getBoundingClientRect();


    var dpr =
    window.devicePixelRatio ||
    1;


    overlay.width =
    Math.round(
        rect.width*dpr
    );


    overlay.height =
    Math.round(
        rect.height*dpr
    );


    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

}


/* =====================================================
   LOOP
===================================================== */

function loop(time){

    ctx.clearRect(
        0,
        0,
        overlay.clientWidth,
        overlay.clientHeight
    );


    drawPerspectiveHint();

    drawTarget();

    drawLive();


    if(
        navigation
        &&
        time-lastAnalysisTime >
        LIVE_INTERVAL
    ){

        lastAnalysisTime =
        time;

        updateNavigation();

    }


    requestAnimationFrame(
        loop
    );

}


/* =====================================================
   ZOOM
===================================================== */

zoom.addEventListener(
    "input",
    async function(){

        var value =
        Number(
            this.value
        );


        zoomText.innerText =
        value.toFixed(1) +
        "×";


        if(!stream){
            return;
        }


        var tracks =
        stream.getVideoTracks();


        if(
            tracks.length === 0
        ){
            return;
        }


        var track =
        tracks[0];


        if(
            !track.getCapabilities
        ){
            return;
        }


        var capabilities =
        track.getCapabilities();


        if(
            !capabilities.zoom
        ){
            return;
        }


        try{

            var actualZoom =
            clamp(
                value,
                capabilities.zoom.min,
                capabilities.zoom.max
            );


            await track
            .applyConstraints({

                advanced:[
                    {
                        zoom:
                        actualZoom
                    }
                ]

            });

        }
        catch(error){

            console.log(
                "Zoom unsupported",
                error
            );

        }

    }
);


/* =====================================================
   ERROR
===================================================== */

window.onerror =
function(
    message,
    source,
    line
){

    console.log(
        message,
        source,
        line
    );


    messageEl.innerText =
    "⚠️ 程式錯誤：" +
    message;


    return false;

};


window.addEventListener(
    "unhandledrejection",
    function(event){

        console.log(
            event.reason
        );


        messageEl.innerText =
        "⚠️ 執行錯誤，請重新整理";

    }
);


/* =====================================================
   START
===================================================== */

window.addEventListener(
    "resize",
    resizeOverlay
);


window.addEventListener(
    "orientationchange",
    function(){

        setTimeout(
            resizeOverlay,
            250
        );

    }
);


startCamera();

requestAnimationFrame(
    loop
);

</script>
