<!DOCTYPE html>

      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>AI 構圖助手 V5.8</title>

<style>

<div id="cameraArea">

        <span>倍率</span>

            id="zoom"

        <span id="zoomText">
            1.0×
        </span>

        V5.8｜單點透視辨識版
    </div>

</div>


<script>

/* =====================================================
   DOM
===================================================== */

const video =
document.getElementById("video");

const overlay =
document.getElementById("overlay");

const ctx =
overlay.getContext("2d");

const ac =
document.getElementById("analysisCanvas");

const ax =
ac.getContext(
    "2d",
    {willReadFrequently:true}
);

const scoreEl =
document.getElementById("score");

const compositionEl =
document.getElementById("composition");

const descEl =
document.getElementById("desc");

const messageEl =
document.getElementById("message");

const zoom =
document.getElementById("zoom");

const zoomText =
document.getElementById("zoomText");


/* =====================================================
   STATE
===================================================== */

let stream = null;

let facing =
"environment";


/*
AI完成第一次分析後：

targetGuide = 白色建議位置
liveGuide   = 綠色目前消失點
*/

let targetGuide =
null;

let liveGuide =
null;


let navigation =
false;

let currentScore =
0;

let lastAnalysisTime =
0;


/*
每450ms分析一次
*/

const LIVE_INTERVAL =
450;


/*
保存最近5次結果
*/

let liveHistory =
[];

const HISTORY_SIZE =
5;


/*
綠點平滑
*/

const SMOOTH =
0.28;


/*
限制單次跳動
*/

const MAX_STEP =
0.06;


/*
連續完成次數

避免一下綠一下黃
*/

let completeCount =
0;


/* =====================================================
   CAMERA
===================================================== */

async function startCamera(){

    try{

        if(stream){

            stream
            .getTracks()
            .forEach(
                track=>track.stop()
            );

        }


        stream =
        await navigator.mediaDevices
        .getUserMedia({

            video:{

                facingMode:{
                    ideal:facing
                },

                width:{
                    ideal:1280
                },

                height:{
                    ideal:720
                }

            },

            audio:false

        });


        video.srcObject =
        stream;


        await video.play();


        resizeOverlay();


        resetAnalysis();

    }
    catch(error){

        console.error(error);


        compositionEl.innerText =
        "相機無法開啟";


        descEl.innerText =
        "請確認 Safari 相機權限";


        messageEl.innerText =
        "❌ 無法開啟相機";

    }

}



async function changeCamera(mode){

    facing =
    mode;


    await startCamera();

}


/* =====================================================
   RESET
===================================================== */

function resetAnalysis(){

    navigation =
    false;

    targetGuide =
    null;

    liveGuide =
    null;

    liveHistory =
    [];

    completeCount =
    0;

    currentScore =
    0;


    scoreEl.innerHTML =
    `-- <small>/100</small>`;


    compositionEl.innerText =
    "等待分析";


    descEl.innerText =
    "對準道路、鐵軌、走廊或街道";


    messageEl.innerText =
    "✨ 固定鏡頭後，按 AI 自動分析";

}


/* =====================================================
   MEDIAN
===================================================== */

function median(array){

    if(
        !array ||
        array.length === 0
    ){

        return 0;

    }


    const a =
    array
    .slice()
    .sort(
        (x,y)=>x-y
    );


    const middle =
    Math.floor(
        a.length/2
    );


    if(
        a.length % 2
    ){

        return a[middle];

    }


    return(
        a[middle-1]
        +
        a[middle]
    )/2;

}


/* =====================================================
   CLAMP
===================================================== */

function clamp(
    value,
    min,
    max
){

    return Math.max(
        min,
        Math.min(
            max,
            value
        )
    );

}


/* =====================================================
   AI AUTO
===================================================== */

function runAI(){

    if(
        video.readyState < 2
    ){

        messageEl.innerText =
        "⏳ 鏡頭還沒準備完成";

        return;

    }


    navigation =
    false;

    targetGuide =
    null;

    liveGuide =
    null;

    liveHistory =
    [];

    completeCount =
    0;


    currentScore =
    0;


    scoreEl.innerHTML =
    `-- <small>/100</small>`;


    compositionEl.innerText =
    "AI 分析中";


    descEl.innerText =
    "正在尋找主要消失點";


    messageEl.innerText =
    "✨ 請保持手機不動...";


    /*
    V5.8

    連續分析5張畫面
    */

    const results =
    [];


    let count =
    0;


    const timer =
    setInterval(
        function(){

            const result =
            analyzePerspective();


            if(result){

                results.push(
                    result
                );

            }


            count++;


            if(
                count >= 5
            ){

                clearInterval(
                    timer
                );


                finishAI(
                    results
                );

            }

        },
        170
    );

}


/* =====================================================
   AI FINISH
===================================================== */

function finishAI(results){

    if(
        results.length < 2
    ){

        failAnalysis();

        return;

    }


    /*
    先算5張照片
    消失點中位數
    */

    const mx =
    median(
        results.map(
            r=>r.vx
        )
    );


    const my =
    median(
        results.map(
            r=>r.vy
        )
    );


    /*
    找最接近中位數的
    真實分析結果
    */

    let best =
    null;

    let bestDistance =
    Infinity;


    results.forEach(
        function(r){

            const d =
            Math.hypot(

                r.vx-mx,

                r.vy-my

            );


            if(
                d <
                bestDistance
            ){

                bestDistance =
                d;

                best =
                r;

            }

        }
    );


    if(
        !best
    ){

        failAnalysis();

        return;

    }


    /*
    多幀本身太分散，
    代表消失點不穩。
    */

    const spread =

    median(

        results.map(
            function(r){

                return Math.hypot(

                    r.vx-mx,

                    r.vy-my

                );

            }
        )

    );


    if(
        spread > .12
    ){

        failAnalysis();

        return;

    }


    /*
    V5.8：
    不再自動分 V / 倒V。

    只要左右主要線
    朝同一個點收斂，
    就叫「單點透視」。
    */

    compositionEl.innerText =
    "◎ 單點透視";


    descEl.innerText =
    "已找到畫面的主要消失點";


    /*
    綠點 =
    AI真正抓到的消失點
    */

    liveGuide = {

        vx:best.vx,

        vy:best.vy,

        confidence:
        best.confidence

    };


    liveHistory =
    [
        {
            vx:best.vx,
            vy:best.vy
        }
    ];


    /*
    ---------------------------------
    白色建議位置
    ---------------------------------

    不直接固定死在50%,40%。

    先看現在消失點比較靠近：
    左三分線
    中央
    右三分線

    再選最近的構圖位置。

    道路高度則往約40%靠。
    */


    const possibleX =
    [
        1/3,
        .5,
        2/3
    ];


    let idealX =
    possibleX[0];


    let nearest =
    Infinity;


    possibleX.forEach(
        function(x){

            const d =
            Math.abs(
                best.vx-x
            );


            if(
                d <
                nearest
            ){

                nearest =
                d;

                idealX =
                x;

            }

        }
    );


    /*
    不要要求使用者一次移太多。

    水平最多建議移10%
    垂直最多建議移10%
    */

    const dx =
    clamp(

        idealX -
        best.vx,

        -.10,

        .10

    );


    const dy =
    clamp(

        .40 -
        best.vy,

        -.10,

        .10

    );


    targetGuide = {

        vx:
        clamp(
            best.vx+dx,
            .12,
            .88
        ),

        vy:
        clamp(
            best.vy+dy,
            .18,
            .72
        )

    };


    /*
    鎖死目標。

    後面updateNavigation
    絕對不能修改它。
    */

    Object.freeze(
        targetGuide
    );


    navigation =
    true;


    calculateScore();


    messageEl.innerText =
    "○ 白圈是建議位置，● 是目前消失點";

}


/* =====================================================
   FAIL
===================================================== */

function failAnalysis(){

    navigation =
    false;

    targetGuide =
    null;

    liveGuide =
    null;

    liveHistory =
    [];

    completeCount =
    0;


    scoreEl.innerHTML =
    `-- <small>/100</small>`;


    compositionEl.innerText =
    "找不到穩定透視";


    descEl.innerText =
    "目前畫面沒有明確的共同消失點";


    messageEl.innerText =
    "📱 換個角度後，再按 AI 自動";

}


/* =====================================================
   ANALYZE PERSPECTIVE
===================================================== */

function analyzePerspective(){

    const W =
    ac.width;

    const H =
    ac.height;


    if(
        video.readyState < 2
    ){

        return null;

    }


    ax.drawImage(
        video,
        0,
        0,
        W,
        H
    );


    const image =
    ax.getImageData(
        0,
        0,
        W,
        H
    );


    const data =
    image.data;


    const gray =
    new Float32Array(
        W*H
    );


    /*
    灰階
    */

    for(
        let i=0;
        i<W*H;
        i++
    ){

        const p =
        i*4;


        gray[i] =

        data[p]*.299

        +

        data[p+1]*.587

        +

        data[p+2]*.114;

    }


    const edge =
    new Float32Array(
        W*H
    );


    const direction =
    new Float32Array(
        W*H
    );


    const strengths =
    [];


    /*
    Sobel
    */

    for(
        let y=1;
        y<H-1;
        y++
    ){

        for(
            let x=1;
            x<W-1;
            x++
        ){

            const p =
            y*W+x;


            const gx =

            -gray[p-W-1]

            +

            gray[p-W+1]

            -

            2*gray[p-1]

            +

            2*gray[p+1]

            -

            gray[p+W-1]

            +

            gray[p+W+1];


            const gy =

            -gray[p-W-1]

            -

            2*gray[p-W]

            -

            gray[p-W+1]

            +

            gray[p+W-1]

            +

            2*gray[p+W]

            +

            gray[p+W+1];


            const mag =
            Math.hypot(
                gx,
                gy
            );


            edge[p] =
            mag;


            /*
            gradient旋轉90度
            得到線條方向
            */

            direction[p] =
            normalizeAngle(

                Math.atan2(
                    gy,
                    gx
                )

                +

                Math.PI/2

            );


            strengths.push(
                mag
            );

        }

    }


    if(
        strengths.length === 0
    ){

        return null;

    }


    strengths.sort(
        (a,b)=>a-b
    );


    /*
    只取最強約8%
    */

    const threshold =

    strengths[
        Math.floor(
            strengths.length*.92
        )
    ]

    ||

    80;


    /*
    每10x10格
    取一條最強斜線
    */

    const cell =
    10;


    const candidates =
    [];


    for(
        let cy=0;
        cy<H;
        cy+=cell
    ){

        for(
            let cx=0;
            cx<W;
            cx+=cell
        ){

            let bestMag =
            0;

            let bx =
            0;

            let by =
            0;

            let ba =
            0;


            for(
                let y=cy;
                y<
                Math.min(
                    cy+cell,
                    H
                );
                y++
            ){

                for(
                    let x=cx;
                    x<
                    Math.min(
                        cx+cell,
                        W
                    );
                    x++
                ){

                    const p =
                    y*W+x;


                    const mag =
                    edge[p];


                    if(
                        mag <
                        threshold
                    ){

                        continue;

                    }


                    const angle =
                    direction[p];


                    const absAngle =
                    Math.abs(
                        angle
                    );


                    /*
                    排除：

                    太水平
                    太垂直

                    保留主要斜線
                    */

                    if(
                        absAngle < .16
                        ||
                        absAngle > 1.40
                    ){

                        continue;

                    }


                    if(
                        mag >
                        bestMag
                    ){

                        bestMag =
                        mag;

                        bx =
                        x;

                        by =
                        y;

                        ba =
                        angle;

                    }

                }

            }


            if(
                bestMag > 0
            ){

                candidates.push({

                    x:bx,

                    y:by,

                    angle:ba,

                    strength:
                    bestMag

                });

            }

        }

    }


    if(
        candidates.length <
        10
    ){

        return null;

    }


    /*
    =================================================
    消失點候選
    =================================================
    */

    const intersections =
    [];


    for(
        let i=0;
        i<candidates.length;
        i++
    ){

        for(
            let j=i+1;
            j<candidates.length;
            j++
        ){

            const A =
            candidates[i];

            const B =
            candidates[j];


            /*
            兩條線方向差太小
            不算
            */

            const angleDiff =
            Math.abs(

                normalizeAngle(

                    A.angle
                    -
                    B.angle

                )

            );


            if(
                angleDiff <
                .30
            ){

                continue;

            }


            const p =
            intersectAngleLines(
                A,
                B
            );


            if(!p){

                continue;

            }


            /*
            消失點允許區域。

            不接受太靠邊
            或畫面最下面。
            */

            if(
                p.x < W*.05
                ||
                p.x > W*.95
                ||
                p.y < H*.08
                ||
                p.y > H*.78
            ){

                continue;

            }


            /*
            兩條線最好來自
            消失點左右兩邊
            */

            const opposite =

            (
                A.x < p.x
                &&
                B.x > p.x
            )

            ||

            (
                B.x < p.x
                &&
                A.x > p.x
            );


            if(
                !opposite
            ){

                continue;

            }


            /*
            水平間距不能太小
            */

            const spread =
            Math.abs(
                A.x-B.x
            );


            if(
                spread <
                W*.13
            ){

                continue;

            }


            /*
            強線 + 大間距
            得較高權重
            */

            const weight =

            Math.sqrt(

                A.strength
                *
                B.strength

            )

            *

            Math.min(

                1,

                spread/
                (W*.45)

            )

            *

            Math.min(

                1,

                angleDiff/
                .75

            );


            intersections.push({

                x:p.x,

                y:p.y,

                weight:weight

            });

        }

    }


    if(
        intersections.length <
        5
    ){

        return null;

    }


    /*
    =================================================
    消失點密度投票
    =================================================
    */

    const gridW =
    30;

    const gridH =
    22;


    const votes =
    new Float32Array(
        gridW*gridH
    );


    intersections.forEach(
        function(p){

            const gx =
            Math.floor(
                p.x/W*gridW
            );


            const gy =
            Math.floor(
                p.y/H*gridH
            );


            if(
                gx < 0
                ||
                gx >= gridW
                ||
                gy < 0
                ||
                gy >= gridH
            ){

                return;

            }


            /*
            投票不只投一格，
            周圍也給少量分數。

            避免消失點只差幾pixel
            就被分到另一格。
            */

            for(
                let yy=-1;
                yy<=1;
                yy++
            ){

                for(
                    let xx=-1;
                    xx<=1;
                    xx++
                ){

                    const nx =
                    gx+xx;

                    const ny =
                    gy+yy;


                    if(
                        nx < 0
                        ||
                        nx >= gridW
                        ||
                        ny < 0
                        ||
                        ny >= gridH
                    ){

                        continue;

                    }


                    const distanceWeight =

                    (
                        xx === 0
                        &&
                        yy === 0
                    )

                    ?

                    1

                    :

                    .45;


                    votes[
                        ny*gridW+nx
                    ]

                    +=

                    p.weight
                    *
                    distanceWeight;

                }

            }

        }
    );


    /*
    找最高票
    */

    let bestIndex =
    0;


    for(
        let i=1;
        i<votes.length;
        i++
    ){

        if(
            votes[i] >
            votes[bestIndex]
        ){

            bestIndex =
            i;

        }

    }


    const bestGX =
    bestIndex %
    gridW;


    const bestGY =
    Math.floor(
        bestIndex/gridW
    );


    /*
    收集最高票附近
    真實交點
    */

    const cluster =
    [];


    intersections.forEach(
        function(p){

            const gx =
            Math.floor(
                p.x/W*gridW
            );


            const gy =
            Math.floor(
                p.y/H*gridH
            );


            if(
                Math.abs(
                    gx-bestGX
                ) <= 1

                &&

                Math.abs(
                    gy-bestGY
                ) <= 1
            ){

                cluster.push(
                    p
                );

            }

        }
    );


    if(
        cluster.length <
        3
    ){

        return null;

    }


    /*
    =================================================
    用中位數，不用平均數

    對錯誤交點更穩
    =================================================
    */

    const vx =
    median(
        cluster.map(
            p=>p.x
        )
    );


    const vy =
    median(
        cluster.map(
            p=>p.y
        )
    );


    /*
    消失點附近到底有多少
    候選線真正經過？
    */

    let supportingLines =
    0;


    let leftSupport =
    0;

    let rightSupport =
    0;


    candidates.forEach(
        function(line){

            const distance =
            distanceToLine(
                vx,
                vy,
                line
            );


            if(
                distance <
                W*.055
            ){

                supportingLines++;


                if(
                    line.x <
                    vx
                ){

                    leftSupport++;

                }
                else{

                    rightSupport++;

                }

            }

        }
    );


    /*
    至少左右都有線支持
    */

    if(
        supportingLines < 4
        ||
        leftSupport < 1
        ||
        rightSupport < 1
    ){

        return null;

    }


    /*
    =================================================
    信心值

    只是辨識穩定程度，
    不是照片構圖分數。
    =================================================
    */

    const supportRatio =

    supportingLines

    /

    candidates.length;


    const clusterRatio =

    cluster.length

    /

    intersections.length;


    const balance =

    Math.min(
        leftSupport,
        rightSupport
    )

    /

    Math.max(
        leftSupport,
        rightSupport
    );


    let confidence =

    .25

    +

    Math.min(
        .30,
        supportRatio*1.8
    )

    +

    Math.min(
        .25,
        clusterRatio*3
    )

    +

    balance*.18;


    confidence =
    clamp(
        confidence,
        0,
        .98
    );


    return{

        vx:
        vx/W,

        vy:
        vy/H,

        confidence:
        confidence,

        support:
        supportingLines

    };

}


/* =====================================================
   INTERSECTION
===================================================== */

function intersectAngleLines(
    A,
    B
){

    const adx =
    Math.cos(
        A.angle
    );


    const ady =
    Math.sin(
        A.angle
    );


    const bdx =
    Math.cos(
        B.angle
    );


    const bdy =
    Math.sin(
        B.angle
    );


    const denominator =

    adx*bdy

    -

    ady*bdx;


    if(
        Math.abs(
            denominator
        ) <
        .0001
    ){

        return null;

    }


    const dx =
    B.x-A.x;


    const dy =
    B.y-A.y;


    const t =

    (
        dx*bdy
        -
        dy*bdx
    )

    /

    denominator;


    return{

        x:
        A.x+t*adx,

        y:
        A.y+t*ady

    };

}


/* =====================================================
   DISTANCE TO LINE
===================================================== */

function distanceToLine(
    px,
    py,
    line
){

    const dx =
    Math.cos(
        line.angle
    );


    const dy =
    Math.sin(
        line.angle
    );


    return Math.abs(

        (px-line.x)*(-dy)

        +

        (py-line.y)*dx

    );

}


/* =====================================================
   ANGLE
===================================================== */

function normalizeAngle(a){

    while(
        a >
        Math.PI/2
    ){

        a -=
        Math.PI;

    }


    while(
        a <
        -Math.PI/2
    ){

        a +=
        Math.PI;

    }


    return a;

}


/* =====================================================
   LIVE SMOOTHING
===================================================== */

function smoothLive(now){

    liveHistory.push({

        vx:now.vx,

        vy:now.vy

    });


    if(
        liveHistory.length >
        HISTORY_SIZE
    ){

        liveHistory.shift();

    }


    /*
    最近5次中位數
    */

    const medianX =
    median(
        liveHistory.map(
            p=>p.vx
        )
    );


    const medianY =
    median(
        liveHistory.map(
            p=>p.vy
        )
    );


    if(
        !liveGuide
    ){

        return{

            vx:medianX,

            vy:medianY,

            confidence:
            now.confidence

        };

    }


    /*
    先算新舊差距
    */

    let dx =
    medianX -
    liveGuide.vx;


    let dy =
    medianY -
    liveGuide.vy;


    const distance =
    Math.hypot(
        dx,
        dy
    );


    /*
    突然跳太遠
    限制單次移動
    */

    if(
        distance >
        MAX_STEP
    ){

        const ratio =
        MAX_STEP /
        distance;


        dx *=
        ratio;


        dy *=
        ratio;

    }


    return{

        vx:

        liveGuide.vx

        +

        dx*SMOOTH,


        vy:

        liveGuide.vy

        +

        dy*SMOOTH,


        confidence:
        now.confidence

    };

}


/* =====================================================
   LIVE NAVIGATION
===================================================== */

function updateNavigation(){

    if(
        !navigation
        ||
        !targetGuide
    ){

        return;

    }


    const now =
    analyzePerspective();


    /*
    一次抓不到
    不要把綠點刪掉
    */

    if(!now){

        currentScore =
        Math.max(
            0,
            currentScore-2
        );


        completeCount =
        0;


        updateScoreUI();


        messageEl.innerText =
        "⚠️ 目前透視線不穩，慢慢移動手機";

        return;

    }


    /*
    綠點平滑後更新
    */

    liveGuide =
    smoothLive(
        now
    );


    calculateScore();

}


/* =====================================================
   SCORE
===================================================== */

function calculateScore(){

    if(
        !targetGuide
        ||
        !liveGuide
    ){

        return;

    }


    const dx =

    liveGuide.vx

    -

    targetGuide.vx;


    const dy =

    liveGuide.vy

    -

    targetGuide.vy;


    const distance =
    Math.hypot(
        dx,
        dy
    );


    /*
    V5.8：

    這才是真正的構圖分數。

    綠點和白圈完全重合 = 100

    相差約28%畫面 = 0
    */

    let score =

    100

    -

    (
        distance/.28
        *
        100
    );


    score =
    Math.round(
        clamp(
            score,
            0,
            100
        )
    );


    currentScore =
    score;


    updateScoreUI();


    /*
    完成必須連續3次
    都很接近。

    不能單幀碰到就算完成。
    */

    if(
        distance <
        .035
    ){

        completeCount++;

    }
    else{

        completeCount =
        0;

    }


    if(
        completeCount >= 3
    ){

        messageEl.innerText =
        "✅ 構圖完成，可以拍了";

        return;

    }


    /*
    導航方向
    */

    const tolerance =
    .025;


    let horizontal =
    "";


    let vertical =
    "";


    /*
    注意：

    這裡提示的是
    「手機要怎麼移」

    綠點在目標右側，
    手機往右移，
    景物通常會往左移。

    綠點在目標左側，
    手機往左移。
    */

    if(
        dx >
        tolerance
    ){

        horizontal =
        "➡️ 手機往右";

    }
    else
    if(
        dx <
        -tolerance
    ){

        horizontal =
        "⬅️ 手機往左";

    }


    /*
    綠點太低：
    手機稍微往下取景，
    景物會往畫面上方移。

    綠點太高：
    手機稍微往上取景。
    */

    if(
        dy >
        tolerance
    ){

        vertical =
        "⬇️ 鏡頭稍微往下";

    }
    else
    if(
        dy <
        -tolerance
    ){

        vertical =
        "⬆️ 鏡頭稍微往上";

    }


    if(
        horizontal
        &&
        vertical
    ){

        messageEl.innerText =

        horizontal

        +

        "　"

        +

        vertical;

    }
    else
    if(horizontal){

        messageEl.innerText =
        horizontal;

    }
    else
    if(vertical){

        messageEl.innerText =
        vertical;

    }
    else{

        messageEl.innerText =
        "👌 很接近了，微調一下";

    }

}


/* =====================================================
   SCORE UI
===================================================== */

function updateScoreUI(){

    scoreEl.innerHTML =

    currentScore

    +

    ` <small>/100</small>`;

}


/* =====================================================
   TARGET COLOR
===================================================== */

function getLiveColor(){

    if(
        currentScore >= 88
    ){

        return "#2cff67";

    }


    if(
        currentScore >= 65
    ){

        return "#ffd633";

    }


    return "#ffffff";

}


/* =====================================================
   DRAW TARGET
===================================================== */

function drawTarget(){

    if(
        !targetGuide
    ){

        return;

    }


    const w =
    overlay.clientWidth;


    const h =
    overlay.clientHeight;


    const x =
    targetGuide.vx*w;


    const y =
    targetGuide.vy*h;


    ctx.save();


    /*
    白色目標圈
    永遠固定
    */

    ctx.strokeStyle =
    "#ffffff";


    ctx.lineWidth =
    3;


    ctx.setLineDash(
        []
    );


    ctx.beginPath();


    ctx.arc(
        x,
        y,
        20,
        0,
        Math.PI*2
    );


    ctx.stroke();


    /*
    外圈
    */

    ctx.globalAlpha =
    .5;


    ctx.beginPath();


    ctx.arc(
        x,
        y,
        29,
        0,
        Math.PI*2
    );


    ctx.stroke();


    ctx.globalAlpha =
    1;


    /*
    十字
    */

    ctx.beginPath();


    ctx.moveTo(
        x-38,
        y
    );

    ctx.lineTo(
        x-24,
        y
    );


    ctx.moveTo(
        x+24,
        y
    );

    ctx.lineTo(
        x+38,
        y
    );


    ctx.moveTo(
        x,
        y-38
    );

    ctx.lineTo(
        x,
        y-24
    );


    ctx.moveTo(
        x,
        y+24
    );

    ctx.lineTo(
        x,
        y+38
    );


    ctx.stroke();


    ctx.fillStyle =
    "#fff";


    ctx.font =
    "bold 14px -apple-system,Arial";


    ctx.textAlign =
    "center";


    ctx.fillText(
        "○ 建議位置",
        x,
        y-43
    );


    ctx.restore();

}


/* =====================================================
   DRAW LIVE
===================================================== */

function drawLive(){

    if(
        !navigation
        ||
        !liveGuide
    ){

        return;

    }


    const w =
    overlay.clientWidth;


    const h =
    overlay.clientHeight;


    const x =
    liveGuide.vx*w;


    const y =
    liveGuide.vy*h;


    const color =
    getLiveColor();


    ctx.save();


    /*
    目前消失點
    */

    ctx.fillStyle =
    color;


    ctx.strokeStyle =
    color;


    ctx.lineWidth =
    3;


    ctx.beginPath();


    ctx.arc(
        x,
        y,
        8,
        0,
        Math.PI*2
    );


    ctx.fill();


    ctx.beginPath();


    ctx.arc(
        x,
        y,
        15,
        0,
        Math.PI*2
    );


    ctx.stroke();


    ctx.font =
    "bold 14px -apple-system,Arial";


    ctx.textAlign =
    "center";


    ctx.fillStyle =
    color;


    ctx.fillText(
        "● 目前消失點",
        x,
        y-23
    );


    /*
    目前點 → 目標
    */

    if(
        targetGuide
    ){

        const tx =
        targetGuide.vx*w;


        const ty =
        targetGuide.vy*h;


        ctx.strokeStyle =
        color;


        ctx.lineWidth =
        2;


        ctx.globalAlpha =
        .85;


        ctx.setLineDash(
            [7,7]
        );


        ctx.beginPath();


        ctx.moveTo(
            x,
            y
        );


        ctx.lineTo(
            tx,
            ty
        );


        ctx.stroke();


        ctx.setLineDash(
            []
        );


        /*
        箭頭
        */

        const angle =
        Math.atan2(
            ty-y,
            tx-x
        );


        const arrowSize =
        10;


        ctx.beginPath();


        ctx.moveTo(
            tx,
            ty
        );


        ctx.lineTo(

            tx
            -
            Math.cos(
                angle-.55
            )
            *
            arrowSize,

            ty
            -
            Math.sin(
                angle-.55
            )
            *
            arrowSize

        );


        ctx.moveTo(
            tx,
            ty
        );


        ctx.lineTo(

            tx
            -
            Math.cos(
                angle+.55
            )
            *
            arrowSize,

            ty
            -
            Math.sin(
                angle+.55
            )
            *
            arrowSize

        );


        ctx.stroke();

    }


    ctx.restore();

}


/* =====================================================
   DRAW PERSPECTIVE LINES
===================================================== */

function drawPerspectiveHint(){

    if(
        !liveGuide
    ){

        return;

    }


    const w =
    overlay.clientWidth;


    const h =
    overlay.clientHeight;


    const x =
    liveGuide.vx*w;


    const y =
    liveGuide.vy*h;


    ctx.save();


    ctx.strokeStyle =
    "rgba(255,255,255,.55)";


    ctx.lineWidth =
    2;


    ctx.setLineDash(
        [10,10]
    );


    /*
    只當視覺提示。

    不代表AI真的認定
    這兩條就是實體邊線。
    */


    ctx.beginPath();


    ctx.moveTo(
        x,
        y
    );


    ctx.lineTo(
        w*.08,
        h*.94
    );


    ctx.stroke();


    ctx.beginPath();


    ctx.moveTo(
        x,
        y
    );


    ctx.lineTo(
        w*.92,
        h*.94
    );


    ctx.stroke();


    ctx.restore();

}


/* =====================================================
   OVERLAY RESIZE
===================================================== */

function resizeOverlay(){

    const rect =
    overlay.getBoundingClientRect();


    const dpr =
    window.devicePixelRatio
    ||
    1;


    overlay.width =
    Math.round(
        rect.width*dpr
    );


    overlay.height =
    Math.round(
        rect.height*dpr
    );


    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

}


/* =====================================================
   LOOP
===================================================== */

function loop(time){

    ctx.clearRect(
        0,
        0,
        overlay.clientWidth,
        overlay.clientHeight
    );


    /*
    畫面順序：

    1 透視提示
    2 白色目標
    3 目前消失點
    */

    drawPerspectiveHint();

    drawTarget();

    drawLive();


    if(
        navigation
        &&
        time-lastAnalysisTime
        >
        LIVE_INTERVAL
    ){

        lastAnalysisTime =
        time;


        updateNavigation();

    }


    requestAnimationFrame(
        loop
    );

}


/* =====================================================
   ZOOM
===================================================== */

zoom.addEventListener(
    "input",
    async function(){

        const value =
        Number(
            this.value
        );


        zoomText.innerText =

        value.toFixed(1)

        +

        "×";


        if(!stream){

            return;

        }


        const tracks =
        stream.getVideoTracks();


        if(
            tracks.length === 0
        ){

            return;

        }


        const track =
        tracks[0];


        if(
            !track.getCapabilities
        ){

            return;

        }


        const capabilities =
        track.getCapabilities();


        if(
            !capabilities.zoom
        ){

            return;

        }


        try{

            const actualZoom =
            clamp(

                value,

                capabilities.zoom.min,

                capabilities.zoom.max

            );


            await track
            .applyConstraints({

                advanced:[
                    {
                        zoom:
                        actualZoom
                    }
                ]

            });

        }
        catch(error){

            console.log(
                "Zoom unsupported",
                error
            );

        }

    }
);


/* =====================================================
   ERROR
===================================================== */

window.onerror =
function(
    message,
    source,
    line
){

    console.error(
        message,
        source,
        line
    );


    messageEl.innerText =
    "⚠️ 程式錯誤：" +
    message;


    return false;

};


window.addEventListener(
    "unhandledrejection",
    function(event){

        console.error(
            event.reason
        );


        messageEl.innerText =
        "⚠️ 執行錯誤，請重新整理";

    }
);


/* =====================================================
   START
===================================================== */

window.addEventListener(
    "resize",
    resizeOverlay
);


window.addEventListener(
    "orientationchange",
    function(){

        setTimeout(
            resizeOverlay,
            250
        );

    }
);


startCamera();


requestAnimationFrame(
    loop
);

</script>
