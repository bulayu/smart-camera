<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no">

<title>構圖導航 V6.3</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    color:#fff;
    font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;
}

body{
    display:flex;
    flex-direction:column;
}

/* =========================
   CAMERA
========================= */

#cameraArea{
    position:relative;
    width:100%;
    flex:1;
    min-height:0;
    overflow:hidden;
    background:#111;
}

#video{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
}

#overlay{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
    z-index:5;
}

/* =========================
   INFO
========================= */

#info{
    position:absolute;
    top:14px;
    left:14px;
    width:275px;
    padding:13px 16px;
    border-radius:18px;
    background:rgba(0,0,0,.72);
    backdrop-filter:blur(7px);
    z-index:10;
}

#modeTitle{
    font-size:13px;
    opacity:.72;
    margin-bottom:4px;
}

#composition{
    font-size:23px;
    font-weight:800;
}

#desc{
    margin-top:5px;
    font-size:13px;
    line-height:1.45;
    opacity:.86;
}

#detectStatus{
    margin-top:7px;
    font-size:11px;
    color:#ffd400;
}

#message{
    position:absolute;
    left:50%;
    bottom:15px;
    transform:translateX(-50%);
    width:92%;
    padding:12px;
    border-radius:17px;
    background:rgba(0,0,0,.80);
    text-align:center;
    font-size:15px;
    font-weight:800;
    z-index:10;
}

#version{
    position:absolute;
    left:7px;
    bottom:3px;
    font-size:10px;
    opacity:.55;
    z-index:20;
}

/* =========================
   CONTROLS
========================= */

#controls{
    flex:0 0 auto;
    padding:
    9px 11px
    calc(11px + env(safe-area-inset-bottom));
    background:#000;
}

#modeRow,
#compositionRow{
    display:flex;
    gap:7px;
    overflow-x:auto;
    scrollbar-width:none;
}

#modeRow{
    padding-bottom:8px;
}

#compositionRow{
    padding-bottom:8px;
}

#modeRow::-webkit-scrollbar,
#compositionRow::-webkit-scrollbar{
    display:none;
}

.modeBtn{
    flex:0 0 auto;
    min-width:67px;
    padding:8px;
    border:0;
    border-radius:17px;
    background:#242424;
    color:#fff;
    font-size:12px;
    font-weight:700;
}

.modeBtn.active{
    background:#fff;
    color:#000;
}

.autoBtn.active{
    background:#ffd400;
    color:#000;
}

.modeIcon{
    display:block;
    font-size:19px;
    margin-bottom:2px;
}

.compBtn{
    flex:0 0 auto;
    padding:7px 12px;
    border-radius:17px;
    border:1px solid #444;
    background:#151515;
    color:#ddd;
    font-size:12px;
}

.compBtn.active{
    border-color:#ffd400;
    color:#ffd400;
}

#mainButton{
    width:100%;
    padding:12px;
    border:0;
    border-radius:24px;
    background:#fff;
    color:#000;
    font-size:16px;
    font-weight:800;
    margin-bottom:8px;
}

#bottomRow{
    display:flex;
    align-items:center;
    gap:7px;
}

.cameraBtn{
    flex:0 0 auto;
    padding:8px 11px;
    border:0;
    border-radius:18px;
    background:#292929;
    color:#fff;
    font-size:12px;
}

#zoomArea{
    flex:1;
    display:flex;
    align-items:center;
    gap:5px;
}

#zoom{
    flex:1;
    min-width:50px;
}

#zoomText{
    min-width:32px;
    font-size:11px;
}

#status{
    margin-top:6px;
    text-align:center;
    font-size:10px;
    opacity:.42;
}

</style>
</head>

<body>

    </video>

        <button

        </button>

        </button>

        <button

            <span class="modeIcon">🌸</span>

        </button>

        <button
        class="modeBtn"
        data-mode="pet"
        onclick="selectMode('pet',this)">
            <span class="modeIcon">🐶</span>
            寵物
        </button>

        data-mode="product"

    <div id="compositionRow"></div>


    <button
    id="mainButton"
    onclick="runComposition()">

        <button

        </button>


        <div id="zoomArea">

            id="zoom"

            step=".1"

            <span id="zoomText">

            </span>

        </div>

    </div>

</div>


<script type="module">

/* =========================================================

   ✓ 人臉偵測
   ✓ 座標轉換
   ✓ 手機移動導航
   ✓ 到位變綠

   ★ 左 / 右三分智慧選位
   ★ 臉部朝向簡易判斷
   ★ 追蹤平滑
   ★ 短暫漏抓保留人物
   ★ 完成狀態需連續穩定
   ★ 避免「完成」與「找不到臉」互跳

========================================================= */


/* =========================================================
   MEDIAPIPE
========================================================= */

    FilesetResolver

"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22-rc.20250304";


/* =========================================================

========================================================= */

const mainButton =

const zoom =
document.getElementById("zoom");

document.getElementById("zoomText");


/* =========================================================

========================================================= */

let facing="environment";

let currentMode="auto";

let currentComposition=null;


/* =========================
   FACE
========================= */

let faceDetector=null;

let detectorReady=false;

let portraitNavigation=false;

let detecting=false;

let lastVideoTime=-1;


/* =========================
   TRACKING
========================= */

let trackedFace=null;

let missingFrames=0;

let stableFrames=0;

  人臉連續漏抓多少幀後
  才真正判定人物消失
*/

const MAX_MISSING_FRAMES=12;


/*
  連續多少幀都在目標範圍內
  才顯示構圖完成
*/

const REQUIRED_STABLE_FRAMES=8;


/*
  人臉位置平滑程度

  越接近 1 越穩，
  但反應越慢。
*/

const SMOOTHING=0.72;


/* =========================
   TARGET SIDE
========================= */

let targetSide=null;

let targetLockFrames=0;


/*
  避免左右三分目標
  每幀一直跳來跳去
*/

const TARGET_LOCK_MIN=20;

/* =========================================================
   CAMERA
========================================================= */

async function startCamera(){

    try{

        messageEl.innerText=
        "📷 正在開啟相機...";


        if(stream){

            stream
            .getTracks()
            .forEach(
                track=>track.stop()
            );

        }


        stream=
        await navigator.mediaDevices
        .getUserMedia({

            video:{

                facingMode:{
                    ideal:facing
                },

                width:{
                    ideal:1280
                },

                height:{
                    ideal:720
                }

            },

            audio:false

        });


        video.srcObject=
        stream;


        await video.play();


        resizeOverlay();


        messageEl.innerText=
        "📷 對準想拍攝的畫面";

    }

    catch(error){

        console.log(error);


        if(
            error.name===
            "NotAllowedError"
        ){

            messageEl.innerText=
            "❌ 請允許網站使用相機";

        }

        else if(
            error.name===
            "NotFoundError"
        ){

            messageEl.innerText=
            "❌ 找不到可用相機";

        }

        else{

            messageEl.innerText=
            "❌ 相機無法開啟";

        }

    }

}


async function changeCamera(mode){

    facing=mode;

    resetTracking();

    await startCamera();

}


/* =========================================================
   RESET TRACKING
========================================================= */

function resetTracking(){

    trackedFace=null;

    missingFrames=0;

    stableFrames=0;

    completed=false;

    targetSide=null;

    targetLockFrames=0;

    lastVideoTime=-1;

}


/* =========================================================
   FACE DETECTOR
========================================================= */

async function initFaceDetector(){

    if(detectorReady){

        return true;

    }


    detectStatus.innerText=
    "正在載入人像辨識...";


    try{

        const vision=
        await FilesetResolver
        .forVisionTasks(

            "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22-rc.20250304/wasm"

        );


        faceDetector=
        await FaceDetector
        .createFromOptions(

            vision,

            {

                baseOptions:{

                    modelAssetPath:

                    "https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite"

                },

                runningMode:
                "VIDEO",

                minDetectionConfidence:
                0.55

            }

        );


        detectorReady=true;


        detectStatus.innerText=
        "✓ 人像辨識已就緒";


        return true;

    }

    catch(error){

        console.error(
            "Face detector error",
            error
        );


        detectStatus.innerText=
        "❌ 人像辨識載入失敗";


        messageEl.innerText=
        "❌ 辨識模組載入失敗";


        return false;

    }

}


/* =========================================================
   MODE
========================================================= */

function selectMode(
    mode,
    button
){

    portraitNavigation=false;

    resetTracking();

    currentMode=mode;


    document
    .querySelectorAll(
        ".modeBtn"
    )
    .forEach(
        b=>b.classList.remove(
            "active"
        )
    );


    if(button){

        button.classList.add(
            "active"
        );

    }


    clearOverlay();


    if(mode==="auto"){

        currentComposition=null;

        compositionRow.innerHTML="";


        modeTitle.innerText=
        "✨ 自動構圖";


        compositionEl.innerText=
        "準備";


        descEl.innerText=
        "自動場景辨識將逐步加入";


        detectStatus.innerText=
        "V6.3";


        mainButton.innerText=
        "✨ 自動構圖";


        messageEl.innerText=
        "👉 目前可測試人像智慧構圖";


        return;

    }


    const data=
    database[mode];


    modeTitle.innerText=
    data.icon+
    " "+
    data.name+
    "模式";


    buildCompositionButtons();


    selectComposition(
        data.default
    );


    if(mode==="portrait"){

        mainButton.innerText=
        "▶ 開始構圖導航";


        detectStatus.innerText=
        detectorReady
        ?
        "✓ 人像辨識已就緒"
        :
        "尚未啟動人像辨識";


        messageEl.innerText=
        "👤 對準人物後開始構圖導航";

    }

    else{

        mainButton.innerText=
        "✨ 推薦構圖";


        detectStatus.innerText=
        "手動構圖模式";


        messageEl.innerText=
        "📷 可手動選擇構圖方式";

    }

}


/* =========================================================
   BUILD COMPOSITION BUTTONS
========================================================= */

function buildCompositionButtons(){

    compositionRow.innerHTML="";


    const data=
    database[currentMode];


    data.comps.forEach(

        comp=>{

            const button=
            document.createElement(
                "button"
            );


            button.className=
            "compBtn";


            button.dataset.id=
            comp[0];


            button.innerText=
            comp[1];


            button.onclick=
            ()=>{

                portraitNavigation=false;

                resetTracking();

                selectComposition(
                    comp[0]
                );

            };


            compositionRow
            .appendChild(
                button
            );

        }

    );

}


/* =========================================================
   SELECT COMPOSITION
========================================================= */

function selectComposition(id){

    currentComposition=id;


    const data=
    database[currentMode];


    if(!data){
        return;
    }


    const comp=
    data.comps.find(
        c=>c[0]===id
    );


    if(!comp){
        return;
    }


    compositionEl.innerText=
    comp[1];


    descEl.innerText=
    comp[2];


    document
    .querySelectorAll(
        ".compBtn"
    )
    .forEach(

        button=>{

            button.classList.toggle(

                "active",

                button.dataset.id===id

            );

        }

    );


    drawComposition();

}


/* =========================================================
   MAIN
========================================================= */

async function runComposition(){

    if(
        currentMode===
        "portrait"
    ){

        const ok=
        await initFaceDetector();


        if(!ok){
            return;
        }


        resetTracking();


        currentComposition=
        "portraitThirds";


        portraitNavigation=true;


        compositionEl.innerText=
        "智慧三分人像";


        descEl.innerText=
        "正在判斷人物適合的構圖位置";


        detectStatus.innerText=
        "● 正在尋找人物";


        messageEl.innerText=
        "🔍 正在尋找人物...";


        requestAnimationFrame(
            portraitLoop
        );


        return;

    }


    if(
        currentMode===
        "auto"
    ){

        messageEl.innerText=
        "👉 V6.3 請先測試人像模式";

        return;

    }


    const data=
    database[currentMode];


    selectComposition(
        data.default
    );


    messageEl.innerText=
    "✓ 推薦："+
    compositionEl.innerText;

}


/* =========================================================
   PORTRAIT LOOP
========================================================= */

function portraitLoop(){

    if(
        !portraitNavigation ||
        currentMode!=="portrait"
    ){

        return;

    }


    if(
        video.readyState<2 ||
        !faceDetector
    ){

        requestAnimationFrame(
            portraitLoop
        );

        return;

    }


    if(
        video.currentTime===
        lastVideoTime
    ){

        requestAnimationFrame(
            portraitLoop
        );

        return;

    }


    lastVideoTime=
    video.currentTime;


    if(detecting){

        requestAnimationFrame(
            portraitLoop
        );

        return;

    }


    detecting=true;


    try{

        const result=
        faceDetector.detectForVideo(

            video,

            performance.now()

        );


        if(
            result &&
            result.detections &&
            result.detections.length>0
        ){

            missingFrames=0;


            /*
              V6.3：

              如果多人，
              暫時取最大張臉，
              當成主要人物。
            */

            const detection=
            chooseMainFace(
                result.detections
            );


            updateTrackedFace(
                detection
            );


            drawPortraitNavigation();

        }

        else{

            handleMissingFace();

        }

    }

    catch(error){

        console.log(
            "Detection error",
            error
        );

    }


    detecting=false;


    requestAnimationFrame(
        portraitLoop
    );

}


/* =========================================================
   CHOOSE MAIN FACE
========================================================= */

function chooseMainFace(
    detections
){

    let best=
    detections[0];


    let bestArea=0;


    detections.forEach(

        detection=>{

            const box=
            detection.boundingBox;


            if(!box){
                return;
            }


            const area=
            box.width*
            box.height;


            if(area>bestArea){

                bestArea=area;

                best=detection;

            }

        }

    );


    return best;

}


/* =========================================================
   UPDATE TRACKED FACE
========================================================= */

function updateTrackedFace(
    detection
){

    const box=
    detection.boundingBox;


    if(!box){
        return;
    }


    const p1=
    videoPointToScreen(
        box.originX,
        box.originY
    );


    const p2=
    videoPointToScreen(

        box.originX+
        box.width,

        box.originY+
        box.height

    );


    const newFace={

        x:
        (p1.x+p2.x)/2,

        y:
        (p1.y+p2.y)/2,

        w:
        Math.abs(
            p2.x-p1.x
        ),

        h:
        Math.abs(
            p2.y-p1.y
        ),

        direction:
        estimateFaceDirection(
            detection
        )

    };


    if(!trackedFace){

        trackedFace=
        newFace;

        return;

    }


    /*
      平滑位置
    */

    trackedFace.x=
    trackedFace.x*
    SMOOTHING+
    newFace.x*
    (1-SMOOTHING);


    trackedFace.y=
    trackedFace.y*
    SMOOTHING+
    newFace.y*
    (1-SMOOTHING);


    trackedFace.w=
    trackedFace.w*
    SMOOTHING+
    newFace.w*
    (1-SMOOTHING);


    trackedFace.h=
    trackedFace.h*
    SMOOTHING+
    newFace.h*
    (1-SMOOTHING);


    trackedFace.direction=
    newFace.direction;

}


/* =========================================================
   FACE DIRECTION

   Face Detector keypoints 可提供
   眼睛 / 鼻子等位置。

   V6.3 只做「簡易朝向估計」。

   結果：
   left
   right
   front

========================================================= */

function estimateFaceDirection(
    detection
){

    const kp=
    detection.keypoints;


    if(
        !kp ||
        kp.length<3
    ){

        return "front";

    }


    /*
      BlazeFace 常見 keypoint：

      0 右眼
      1 左眼
      2 鼻尖
    */


    const eye1=kp[0];

    const eye2=kp[1];

    const nose=kp[2];


    if(
        !eye1 ||
        !eye2 ||
        !nose
    ){

        return "front";

    }


    const eyeCenter=
    (
        eye1.x+
        eye2.x
    )/2;


    const eyeDistance=
    Math.abs(
        eye1.x-
        eye2.x
    );


    if(
        eyeDistance<
        0.001
    ){

        return "front";

    }


    const offset=
    (
        nose.x-
        eyeCenter
    )/
    eyeDistance;


    /*
      門檻先保守，
      避免正面臉亂跳。
    */


    if(offset>0.16){

        return "right";

    }


    if(offset<-0.16){

        return "left";

    }


    return "front";

}


/* =========================================================
   TARGET SELECTION
========================================================= */

function chooseTargetSide(){

    if(!trackedFace){

        return "left";

    }


    const w=
    overlay.clientWidth;


    let wanted=
    targetSide;


    /*
      朝右：

      人放左邊，
      右側留下視線空間。
    */

    if(
        trackedFace.direction===
        "right"
    ){

        wanted=
        "left";

    }


    /*
      朝左：

      人放右邊，
      左側留下視線空間。
    */

    else if(
        trackedFace.direction===
        "left"
    ){

        wanted=
        "right";

    }


    /*
      正面人物：

      不確定視線方向時，
      優先選擇距離目前人物
      較近的三分點。

      這樣不會要求使用者
      無必要地橫跨整個畫面。
    */

    else{

        const leftX=
        w/3;


        const rightX=
        w*2/3;


        const leftDistance=
        Math.abs(
            trackedFace.x-leftX
        );


        const rightDistance=
        Math.abs(
            trackedFace.x-rightX
        );


        wanted=
        leftDistance<=
        rightDistance
        ?
        "left"
        :
        "right";

    }


    /*
      第一次直接決定
    */

    if(!targetSide){

        targetSide=
        wanted;

        targetLockFrames=
        TARGET_LOCK_MIN;

        return targetSide;

    }


    /*
      鎖定期間不切換，
      防止綠圈左右跳。
    */

    if(
        targetLockFrames>0
    ){

        targetLockFrames--;

        return targetSide;

    }


    /*
      鎖定結束後，
      如果新判斷真的不同，
      才切換。
    */

    if(
        wanted!==
        targetSide
    ){

        targetSide=
        wanted;

        targetLockFrames=
        TARGET_LOCK_MIN;

        stableFrames=0;

        completed=false;

    }


    return targetSide;

}


/* =========================================================
   VIDEO → SCREEN

   因為 video 是 object-fit:cover，
   必須計算裁切後的真正座標。

========================================================= */

function videoPointToScreen(
    x,
    y
){

    const vw=
    video.videoWidth;


    const vh=
    video.videoHeight;


    const sw=
    overlay.clientWidth;


    const sh=
    overlay.clientHeight;


    if(
        !vw ||
        !vh
    ){

        return{
            x:0,
            y:0
        };

    }


    const scale=
    Math.max(

        sw/vw,

        sh/vh

    );


    const renderedW=
    vw*scale;


    const renderedH=
    vh*scale;


    const cropX=
    (
        renderedW-
        sw
    )/2;


    const cropY=
    (
        renderedH-
        sh
    )/2;


    return{

        x:
        x*scale-
        cropX,

        y:
        y*scale-
        cropY

    };

}


/* =========================================================
   DRAW PORTRAIT NAVIGATION
========================================================= */

function drawPortraitNavigation(){

    if(!trackedFace){
        return;
    }


    clearOverlay();


    const w=
    overlay.clientWidth;


    const h=
    overlay.clientHeight;


    const side=
    chooseTargetSide();


    /*
      左右三分點
    */

    const targetX=
    side==="left"
    ?
    w/3
    :
    w*2/3;


    /*
      臉部目標高度

      稍微高於純幾何 1/3，
      讓眼睛位置更自然。

      目前先維持接近 V6.2
      已成功的位置。
    */

    const targetY=
    h/3;


    /* =====================================================
       GUIDE GRID
    ===================================================== */


    ctx.save();


    ctx.strokeStyle=
    "rgba(255,212,0,.42)";


    ctx.lineWidth=
    1.5;


    ctx.setLineDash(
        [7,7]
    );


    ctx.beginPath();


    ctx.moveTo(
        w/3,
        0
    );

    ctx.lineTo(
        w/3,
        h
    );


    ctx.moveTo(
        w*2/3,
        0
    );

    ctx.lineTo(
        w*2/3,
        h
    );


    ctx.moveTo(
        0,
        h/3
    );

    ctx.lineTo(
        w,
        h/3
    );


    ctx.moveTo(
        0,
        h*2/3
    );

    ctx.lineTo(
        w,
        h*2/3
    );


    ctx.stroke();


    ctx.restore();


    /* =====================================================
       DISTANCE
    ===================================================== */


    const dx=
    targetX-
    trackedFace.x;


    const dy=
    targetY-
    trackedFace.y;


    const toleranceX=
    w*.075;


    const toleranceY=
    h*.065;


    const goodX=
    Math.abs(dx)<
    toleranceX;


    const goodY=
    Math.abs(dy)<
    toleranceY;


    const inside=
    goodX &&
    goodY;


    /* =====================================================
       STABLE COMPLETION
    ===================================================== */


    if(inside){

        stableFrames++;


        if(
            stableFrames>=
            REQUIRED_STABLE_FRAMES
        ){

            completed=true;

        }

    }

    else{

        stableFrames=
        Math.max(
            0,
            stableFrames-2
        );


        /*
          已完成後給一點容忍，
          不要稍微晃一下就解除。
        */

        if(
            completed &&
            (
                Math.abs(dx)>
                toleranceX*1.55
                ||
                Math.abs(dy)>
                toleranceY*1.55
            )
        ){

            completed=false;

            stableFrames=0;

        }

    }


    /* =====================================================
       TARGET CIRCLE
    ===================================================== */


    ctx.save();


    ctx.strokeStyle=
    "#2cff67";


    ctx.fillStyle=
    "#2cff67";


    ctx.lineWidth=
    completed
    ?
    5
    :
    4;


    ctx.beginPath();


    ctx.arc(

        targetX,

        targetY,

        completed
        ?
        30
        :
        25,

        0,

        Math.PI*2

    );


    ctx.stroke();


    ctx.beginPath();


    ctx.arc(

        targetX,

        targetY,

        5,

        0,

        Math.PI*2

    );


    ctx.fill();


    ctx.restore();


    /* =====================================================
       FACE BOX
    ===================================================== */


    const boxX=
    trackedFace.x-
    trackedFace.w/2;


    const boxY=
    trackedFace.y-
    trackedFace.h/2;


    ctx.save();


    ctx.strokeStyle=
    completed
    ?
    "#2cff67"
    :
    "#ffd400";


    ctx.lineWidth=4;


    ctx.strokeRect(

        boxX,

        boxY,

        trackedFace.w,

        trackedFace.h

    );


    ctx.restore();


    /* =====================================================
       CONNECTION
    ===================================================== */


    if(!completed){

        ctx.save();


        ctx.strokeStyle=
        "#ffd400";


        ctx.lineWidth=3;


        ctx.setLineDash(
            [7,6]
        );


        ctx.beginPath();


        ctx.moveTo(

            trackedFace.x,

            trackedFace.y

        );


        ctx.lineTo(

            targetX,

            targetY

        );


        ctx.stroke();


        ctx.restore();

    }


    /* =====================================================
       SIDE LABEL
    ===================================================== */


    ctx.save();


    ctx.font=
    "bold 13px -apple-system,Arial";


    ctx.fillStyle=
    "#2cff67";


    ctx.textAlign=
    "center";


    ctx.fillText(

        side==="left"
        ?
        "左三分"
        :
        "右三分",

        targetX,

        targetY+48

    );


    ctx.restore();


    /* =====================================================
       COMPLETE
    ===================================================== */


    if(completed){

        messageEl.innerText=
        "✓ 構圖完成";


        compositionEl.innerText=
        side==="left"
        ?
        "左三分人像"
        :
        "右三分人像";


        descEl.innerText=
        "人物已進入建議構圖位置";


        detectStatus.innerText=
        "● 位置穩定";


        return;

    }


    /* =====================================================
       NAVIGATION
    ===================================================== */


    let horizontal="";

    let vertical="";


    if(!goodX){

        if(dx>0){

            horizontal=
            "← 手機向左";

        }

        else{

            horizontal=
            "→ 手機向右";

        }

    }


    if(!goodY){

        if(dy>0){

            vertical=
            "↑ 稍微抬高";

        }

        else{

            vertical=
            "↓ 稍微降低";

        }

    }


    let text="";


    if(
        horizontal &&
        vertical
    ){

        text=
        horizontal+
        "　"+
        vertical;

    }

    else{

        text=
        horizontal ||
        vertical ||
        "保持目前位置";

    }


    messageEl.innerText=
    text;


    compositionEl.innerText=
    side==="left"
    ?
    "左三分人像"
    :
    "右三分人像";


    let directionText=
    "";


    if(
        trackedFace.direction===
        "left"
    ){

        directionText=
        "人物略朝左";

    }

    else if(
        trackedFace.direction===
        "right"
    ){

        directionText=
        "人物略朝右";

    }

    else{

        directionText=
        "人物接近正面";

    }


    descEl.innerText=
    directionText+
    "｜讓黃色框移向綠色目標";


    detectStatus.innerText=
    stableFrames>0
    ?
    "● 正在穩定位置 "+
    stableFrames+
    "/"+
    REQUIRED_STABLE_FRAMES
    :
    "● 正在追蹤人物";

}


/* =========================================================
   MISSING FACE

   V6.3 重要：

   不再一漏抓就顯示
   「找不到臉」。

========================================================= */

function handleMissingFace(){

    missingFrames++;


    /*
      短暫漏抓：

      保留上一幀人物位置。
    */

    if(
        trackedFace &&
        missingFrames<=
        MAX_MISSING_FRAMES
    ){

        drawPortraitNavigation();


        detectStatus.innerText=
        "● 持續追蹤";


        /*
          如果已完成，
          保持完成文字。
        */

        if(completed){

            messageEl.innerText=
            "✓ 構圖完成";

        }


        return;

    }


    /*
      真正連續漏抓
    */

    trackedFace=null;

    stableFrames=0;

    completed=false;

    targetSide=null;


    drawPortraitNoFace();


    compositionEl.innerText=
    "尋找人物";


    descEl.innerText=
    "請讓人物臉部清楚出現在畫面中";


    detectStatus.innerText=
    "● 等待人物";


    messageEl.innerText=
    "👤 找不到臉｜請讓人物面向鏡頭";

}

/* =========================================================
   NORMAL DRAW
========================================================= */

function clearOverlay(){

    ctx.clearRect(

        0,

        0,

        overlay.clientWidth,

        overlay.clientHeight

    );

}


function setup(){

    ctx.strokeStyle=
    "#ffd400";


    ctx.fillStyle=
    "#2cff67";


    ctx.lineWidth=
    2.5;


    ctx.setLineDash([]);

}


function target(x,y){

    ctx.save();


    ctx.strokeStyle=
    "#2cff67";


    ctx.fillStyle=
    "#2cff67";


    ctx.lineWidth=3;


    ctx.beginPath();


    ctx.arc(
        x,
        y,
        11,
        0,
        Math.PI*2
    );


    ctx.stroke();


    ctx.beginPath();


    ctx.arc(
        x,
        y,
        4,
        0,
        Math.PI*2
    );


    ctx.fill();


    ctx.restore();

}


/* =========================================================
   THIRDS
========================================================= */

function drawThirds(){

    const w=
    overlay.clientWidth;


    const h=
    overlay.clientHeight;


    setup();


    ctx.beginPath();


    ctx.moveTo(w/3,0);
    ctx.lineTo(w/3,h);


    ctx.moveTo(w*2/3,0);
    ctx.lineTo(w*2/3,h);


    ctx.moveTo(0,h/3);
    ctx.lineTo(w,h/3);


    ctx.moveTo(0,h*2/3);
    ctx.lineTo(w,h*2/3);


    ctx.stroke();


    target(
        w/3,
        h/3
    );


    target(
        w*2/3,
        h/3
    );


    target(
        w/3,
        h*2/3
    );


    target(
        w*2/3,
        h*2/3
    );

}

    overlay.clientWidth;


    const h=
    overlay.clientHeight;


    setup();


    ctx.strokeStyle=
    "#2cff67";


    ctx.lineWidth=4;


    ctx.strokeRect(

        w*.06,

        h*.06,

        w*.88,

        h*.88

    );

}


/* =========================================================
   DRAW ROUTER
========================================================= */

function drawComposition(){

    if(portraitNavigation){
        return;
    }


    clearOverlay();


    switch(
        currentComposition
    ){


        case "thirds":
        case "macroThirds":
        case "petThirds":
        case "productThirds":
        case "foodThirds":

            drawThirds();
            break;


        case "golden":

            drawGolden();
            break;


        case "leading":

            drawLeading();
            break;


        case "center":
        case "macroCenter":
        case "petCenter":
        case "productCenter":

            drawCenter();
            break;


        case "frame":

            drawFrame();
            break;


        case "perspective":

            drawPerspective();
            break;


        case "symmetry":

            drawSymmetry();
            break;


        case "diagonal":
        case "foodDiagonal":
        case "product45":

            drawDiagonal();
            break;


        case "portraitThirds":
        case "environment":
        case "lookSpace":

            drawPortraitThirds();
            break;


        case "portraitCenter":

            drawPortraitCenter();
            break;


        case "fullbody":
        case "petFull":
        case "petAction":
        case "petLook":

            drawFullBody();
            break;


        case "reflection":

            drawCenter();
            break;


        case "foodCenter":
        case "foodTop":

            drawCircle();
            break;


        case "fill":

            drawFill();
            break;


        case "negative":

            drawThirds();
            break;

    }

}


/* =========================================================
   RESIZE
========================================================= */

function resizeOverlay(){

    const rect=
    overlay.getBoundingClientRect();


    const dpr=
    window.devicePixelRatio ||
    1;


    overlay.width=
    Math.round(
        rect.width*dpr
    );


    overlay.height=
    Math.round(
        rect.height*dpr
    );


    ctx.setTransform(

        dpr,

        0,

        0,

        dpr,

        0,

        0

    );


    drawComposition();

}


window.addEventListener(
    "resize",
    resizeOverlay
);


/* =========================================================
   ZOOM
========================================================= */

zoom.addEventListener(

    "input",

    async function(){

        const value=
        Number(
            this.value
        );


        zoomText.innerText=
        value.toFixed(1)+
        "×";


        if(!stream){
            return;
        }


        const tracks=
        stream.getVideoTracks();


        if(!tracks.length){
            return;
        }


        const track=
        tracks[0];


        if(
            !track.getCapabilities
        ){
            return;
        }


        const caps=
        track.getCapabilities();


        if(!caps.zoom){
            return;
        }


        try{

            const z=
            Math.max(

                caps.zoom.min,

                Math.min(

                    caps.zoom.max,

                    value

                )

            );


            await track
            .applyConstraints({

                advanced:[
                    {
                        zoom:z
                    }
                ]

            });

        }

        catch(error){

            console.log(
                "Zoom",
                error
            );

        }

    }

);


/* =========================================================
   EXPOSE
========================================================= */

window.selectMode=
selectMode;


window.changeCamera=
changeCamera;


window.runComposition=
runComposition;


/* =========================================================
   INIT
========================================================= */

resizeOverlay();

startCamera();

</script>
