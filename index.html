<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>AI 構圖助手 V5.5</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    color:#fff;
    font-family:Arial,sans-serif;
}

#cameraArea{
    position:relative;
    width:100%;
    height:72%;
    overflow:hidden;
    background:#111;
}

video{
    position:absolute;
    width:100%;
    height:100%;
    object-fit:cover;
}

#overlay{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
}

#analysisCanvas{
    display:none;
}

#info{
    position:absolute;
    top:18px;
    left:16px;
    z-index:10;
    min-width:200px;
    background:rgba(0,0,0,.68);
    padding:13px 17px;
    border-radius:18px;
}

#score{
    font-size:40px;
    font-weight:bold;
}

#score small{
    font-size:16px;
    opacity:.7;
}

#composition{
    margin-top:5px;
    font-size:20px;
    font-weight:bold;
}

#desc{
    margin-top:5px;
    font-size:13px;
    opacity:.8;
}

#message{
    position:absolute;
    left:50%;
    bottom:20px;
    transform:translateX(-50%);
    width:90%;
    z-index:10;
    background:rgba(0,0,0,.75);
    border-radius:18px;
    padding:13px;
    text-align:center;
    font-size:16px;
    font-weight:bold;
}

#version{
    position:absolute;
    left:8px;
    bottom:5px;
    font-size:11px;
    opacity:.45;
}

#controls{
    height:28%;
    background:#000;
    padding:13px;
}

#cameraButtons{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-bottom:10px;
}

.cameraBtn{
    border:none;
    background:#292929;
    color:white;
    border-radius:22px;
    padding:10px 17px;
    font-size:15px;
}

#modes{
    display:flex;
    gap:8px;
    overflow-x:auto;
    margin-bottom:11px;
}

.mode{
    flex:none;
    border:1px solid #555;
    background:#111;
    color:#ddd;
    border-radius:25px;
    padding:10px 16px;
    font-size:15px;
}

.mode.active{
    background:#fff;
    color:#000;
    font-weight:bold;
}

#zoomRow{
    display:flex;
    align-items:center;
    gap:10px;
}

#zoom{
    flex:1;
}
</style>
</head>

<body>

<div id="cameraArea">

    <video
        id="video"
        autoplay
        playsinline
        muted>
    </video>

    <canvas id="overlay"></canvas>

    <canvas
        id="analysisCanvas"
        width="180"
        height="135">
    </canvas>

    <div id="info">

        <div id="score">
            --
            <small>/100</small>
        </div>

        <div id="composition">
            等待分析
        </div>

        <div id="desc">
            先將鏡頭對準想拍的畫面
        </div>

    </div>

    <div id="message">
        按「✨ AI 自動」分析目前畫面
    </div>

    <div id="version">
        V5.5
    </div>

</div>

<div id="controls">

    <div id="cameraButtons">

        <button
        class="cameraBtn"
        onclick="changeCamera('user')">
            🤳 前鏡頭
        </button>

        <button
        class="cameraBtn"
        onclick="changeCamera('environment')">
            📷 後鏡頭
        </button>

    </div>

    <div id="modes">

        <button
        class="mode active"
        onclick="selectMode('auto',this)">
            ✨ AI 自動
        </button>

        <button
        class="mode"
        onclick="selectMode('third',this)">
            # 三分法
        </button>

        <button
        class="mode"
        onclick="selectMode('center',this)">
            ◎ 居中
        </button>

        <button
        class="mode"
        onclick="selectMode('leading',this)">
            ↗ 引導線
        </button>

        <button
        class="mode"
        onclick="selectMode('vshape',this)">
            V 型
        </button>

    </div>

    <div id="zoomRow">

        <span>倍率</span>

        <input
        id="zoom"
        type="range"
        min="1"
        max="3"
        step="0.1"
        value="1">

        <span id="zoomText">
            1.0×
        </span>

    </div>

</div>


<script>

const video =
document.getElementById("video");

const overlay =
document.getElementById("overlay");

const ctx =
overlay.getContext("2d");

const analysisCanvas =
document.getElementById("analysisCanvas");

const actx =
analysisCanvas.getContext(
    "2d",
    {willReadFrequently:true}
);

const scoreBox =
document.getElementById("score");

const compositionBox =
document.getElementById("composition");

const descBox =
document.getElementById("desc");

const messageBox =
document.getElementById("message");

const zoomSlider =
document.getElementById("zoom");

const zoomText =
document.getElementById("zoomText");


let stream = null;

let facingMode = "environment";

let lockedMode = null;

let navigationActive = false;

let currentScore = 0;

let lastAnalysisTime = 0;

const ANALYSIS_INTERVAL = 300;



/* =========================
   CAMERA
========================= */

async function startCamera(){

    try{

        if(stream){

            stream.getTracks()
            .forEach(track=>{
                track.stop();
            });

        }

        stream =
        await navigator.mediaDevices.getUserMedia({

            video:{
                facingMode:{
                    ideal:facingMode
                },
                width:{
                    ideal:1280
                },
                height:{
                    ideal:720
                }
            },

            audio:false

        });

        video.srcObject = stream;

        await video.play();

        resizeCanvas();

        navigationActive = false;
        lockedMode = null;

        scoreBox.innerHTML =
        `-- <small>/100</small>`;

        compositionBox.innerText =
        "等待分析";

        descBox.innerText =
        "先將鏡頭對準想拍的畫面";

        messageBox.innerText =
        "按「✨ AI 自動」分析目前畫面";

    }

    catch(err){

        console.error(err);

        messageBox.innerText =
        "❌ 無法開啟鏡頭，請檢查相機權限";

    }

}


async function changeCamera(mode){

    facingMode = mode;

    await startCamera();

}



/* =========================
   MODE
========================= */

function selectMode(mode,button){

    document
    .querySelectorAll(".mode")
    .forEach(btn=>{
        btn.classList.remove("active");
    });

    button.classList.add("active");

    if(mode === "auto"){

        runAutoAnalysis();
        return;

    }

    lockedMode = mode;

    navigationActive = true;

    const result = analyzeFrame();

    currentScore =
    result[mode] || 50;

    updateModeText(mode);

    updateScore(currentScore);

}



/* =========================
   AI AUTO
========================= */

function runAutoAnalysis(){

    if(video.readyState < 2){

        messageBox.innerText =
        "鏡頭尚未準備完成";

        return;

    }

    navigationActive = false;

    lockedMode = null;

    compositionBox.innerText =
    "AI 分析中";

    descBox.innerText =
    "正在分析線條、位置與消失點";

    scoreBox.innerHTML =
    `-- <small>/100</small>`;

    messageBox.innerText =
    "✨ AI 正在判斷最佳構圖...";


    setTimeout(()=>{

        const result =
        analyzeFrame();


        console.log(
            "構圖分析結果:",
            result
        );


        let scores = {

            vshape:
            result.vshape,

            leading:
            result.leading,

            third:
            result.third,

            center:
            result.center

        };


        /*
        V5.5：
        如果 V 型非常明顯，
        額外提高優先度
        */

        if(
            result.vshape >
            72
        ){

            scores.vshape += 6;

        }


        /*
        如果左右收斂差，
        引導線略優先
        */

        if(
            result.vBalance <
            0.40
        ){

            scores.vshape -= 8;

            scores.leading += 5;

        }


        let bestMode =
        "center";

        let bestScore =
        -999;


        for(
            const mode in scores
        ){

            if(
                scores[mode] >
                bestScore
            ){

                bestScore =
                scores[mode];

                bestMode =
                mode;

            }

        }


        lockedMode =
        bestMode;

        navigationActive =
        true;

        currentScore =
        clampScore(bestScore);


        updateModeText(
            bestMode
        );


        updateScore(
            currentScore
        );


    },600);

}



/* =========================
   FRAME ANALYSIS
========================= */

function analyzeFrame(){

    const W =
    analysisCanvas.width;

    const H =
    analysisCanvas.height;


    actx.drawImage(
        video,
        0,
        0,
        W,
        H
    );


    const img =
    actx.getImageData(
        0,
        0,
        W,
        H
    );


    const data =
    img.data;


    const gray =
    new Float32Array(
        W * H
    );


    for(
        let y=0;
        y<H;
        y++
    ){

        for(
            let x=0;
            x<W;
            x++
        ){

            const i =
            (y*W+x)*4;


            gray[y*W+x] =

            data[i] * 0.299
            +
            data[i+1] * 0.587
            +
            data[i+2] * 0.114;

        }

    }


    const edge =
    new Float32Array(
        W * H
    );


    const gxMap =
    new Float32Array(
        W * H
    );


    const gyMap =
    new Float32Array(
        W * H
    );


    let totalEdge = 0;


    for(
        let y=1;
        y<H-1;
        y++
    ){

        for(
            let x=1;
            x<W-1;
            x++
        ){

            const p =
            y*W+x;


            const gx =

            -gray[p-W-1]
            +gray[p-W+1]

            -2*gray[p-1]
            +2*gray[p+1]

            -gray[p+W-1]
            +gray[p+W+1];


            const gy =

            -gray[p-W-1]
            -2*gray[p-W]
            -gray[p-W+1]

            +gray[p+W-1]
            +2*gray[p+W]
            +gray[p+W+1];


            const mag =
            Math.sqrt(
                gx*gx +
                gy*gy
            );


            edge[p] = mag;

            gxMap[p] = gx;

            gyMap[p] = gy;

            totalEdge += mag;

        }

    }


    if(totalEdge < 1){

        return{

            vshape:35,
            leading:35,
            third:35,
            center:35,
            vBalance:0

        };

    }


    const centerData =
    calculateCenterScore(
        edge,
        W,
        H,
        totalEdge
    );


    const thirdData =
    calculateThirdScore(
        edge,
        W,
        H,
        totalEdge
    );


    const vData =
    calculateVScore(
        edge,
        gxMap,
        gyMap,
        W,
        H
    );


    const leadingData =
    calculateLeadingScore(
        edge,
        gxMap,
        gyMap,
        W,
        H
    );


    return{

        center:
        centerData.score,

        third:
        thirdData.score,

        vshape:
        vData.score,

        leading:
        leadingData.score,

        vBalance:
        vData.balance

    };

}



/* =========================
   CENTER
========================= */

function calculateCenterScore(
    edge,
    W,
    H,
    total
){

    let centerEnergy = 0;

    let outerEnergy = 0;


    const cx =
    W * 0.5;

    const cy =
    H * 0.5;


    for(
        let y=0;
        y<H;
        y++
    ){

        for(
            let x=0;
            x<W;
            x++
        ){

            const e =
            edge[y*W+x];


            const nx =
            Math.abs(
                x-cx
            ) /
            (W*0.5);


            const ny =
            Math.abs(
                y-cy
            ) /
            (H*0.5);


            if(
                nx < 0.30
                &&
                ny < 0.34
            ){

                centerEnergy += e;

            }

            else{

                outerEnergy += e;

            }

        }

    }


    const centerRatio =
    centerEnergy /
    total;


    const outerRatio =
    outerEnergy /
    total;


    /*
    中央要真的夠集中，
    才給高分
    */

    let score =

    38

    +
    centerRatio * 170

    -
    outerRatio * 22;


    return{

        score:
        clampScore(score)

    };

}



/* =========================
   THIRD
========================= */

function calculateThirdScore(
    edge,
    W,
    H,
    total
){

    const points = [

        [W/3,H/3],

        [W*2/3,H/3],

        [W/3,H*2/3],

        [W*2/3,H*2/3]

    ];


    const radius =
    Math.min(
        W,
        H
    ) * 0.12;


    let bestPointEnergy = 0;


    for(
        const point of points
    ){

        let energy = 0;


        for(
            let y=0;
            y<H;
            y++
        ){

            for(
                let x=0;
                x<W;
                x++
            ){

                const dx =
                x-point[0];

                const dy =
                y-point[1];


                if(
                    dx*dx +
                    dy*dy <
                    radius*radius
                ){

                    energy +=
                    edge[y*W+x];

                }

            }

        }


        if(
            energy >
            bestPointEnergy
        ){

            bestPointEnergy =
            energy;

        }

    }


    /*
    看中心是否太強。
    如果中心太強，
    不應該硬判三分法。
    */

    let centerEnergy = 0;


    for(
        let y=
        Math.floor(H*0.36);

        y<
        Math.floor(H*0.64);

        y++
    ){

        for(
            let x=
            Math.floor(W*0.36);

            x<
            Math.floor(W*0.64);

            x++
        ){

            centerEnergy +=
            edge[y*W+x];

        }

    }


    const thirdRatio =
    bestPointEnergy /
    total;


    const centerRatio =
    centerEnergy /
    total;


    let score =

    38

    +
    thirdRatio * 210

    -
    centerRatio * 75;


    return{

        score:
        clampScore(score)

    };

}



/* =========================
   V SHAPE
========================= */

function calculateVScore(
    edge,
    gxMap,
    gyMap,
    W,
    H
){

    /*
    消失點先設定在
    中央偏下區域。
    */

    const vanishX =
    W * 0.50;

    const vanishY =
    H * 0.72;


    let leftMatch = 0;

    let rightMatch = 0;

    let leftTotal = 0;

    let rightTotal = 0;


    for(
        let y=2;
        y<H-2;
        y++
    ){

        for(
            let x=2;
            x<W-2;
            x++
        ){

            const p =
            y*W+x;


            const e =
            edge[p];


            if(e < 65)
            continue;


            /*
            只分析中下區域，
            避免天空雜訊
            */

            if(
                y <
                H*0.12
            )
            continue;


            const gx =
            gxMap[p];

            const gy =
            gyMap[p];


            /*
            邊緣方向
            */

            let angle =
            Math.atan2(
                gy,
                gx
            );


            /*
            線本身方向
            與梯度垂直
            */

            angle +=
            Math.PI/2;


            const vx =
            vanishX-x;

            const vy =
            vanishY-y;


            const targetAngle =
            Math.atan2(
                vy,
                vx
            );


            let diff =
            Math.abs(
                normalizeAngle(
                    angle -
                    targetAngle
                )
            );


            /*
            越接近消失點方向，
            得分越高
            */

            const directionMatch =
            Math.max(
                0,
                1 -
                diff /
                0.65
            );


            /*
            左邊
            */

            if(
                x <
                vanishX
            ){

                leftTotal += e;

                if(
                    directionMatch >
                    0
                ){

                    leftMatch +=
                    e *
                    directionMatch;

                }

            }


            /*
            右邊
            */

            else{

                rightTotal += e;

                if(
                    directionMatch >
                    0
                ){

                    rightMatch +=
                    e *
                    directionMatch;

                }

            }

        }

    }


    const leftRatio =
    leftTotal > 0
    ?
    leftMatch /
    leftTotal
    :
    0;


    const rightRatio =
    rightTotal > 0
    ?
    rightMatch /
    rightTotal
    :
    0;


    /*
    V 型最重要：
    左右兩邊都要有。
    */

    const weakest =
    Math.min(
        leftRatio,
        rightRatio
    );


    const strongest =
    Math.max(
        leftRatio,
        rightRatio
    );


    const balance =
    strongest > 0
    ?
    weakest /
    strongest
    :
    0;


    let score =

    34

    +
    weakest * 105

    +
    balance * 24;


    /*
    左右很不平衡，
    不該判 V 型。
    */

    if(
        balance <
        0.35
    ){

        score -= 12;

    }


    return{

        score:
        clampScore(score),

        balance:
        balance

    };

}



/* =========================
   LEADING LINE
========================= */

function calculateLeadingScore(
    edge,
    gxMap,
    gyMap,
    W,
    H
){

    const targetX =
    W * 0.50;

    const targetY =
    H * 0.48;


    let matched = 0;

    let strongEdges = 0;


    for(
        let y=0;
        y<H;
        y++
    ){

        for(
            let x=0;
            x<W;
            x++
        ){

            const p =
            y*W+x;


            const e =
            edge[p];


            if(e < 70)
            continue;


            strongEdges += e;


            const gx =
            gxMap[p];

            const gy =
            gyMap[p];


            let lineAngle =
            Math.atan2(
                gy,
                gx
            )
            +
            Math.PI/2;


            const targetAngle =
            Math.atan2(
                targetY-y,
                targetX-x
            );


            const diff =
            Math.abs(
                normalizeAngle(
                    lineAngle -
                    targetAngle
                )
            );


            const match =
            Math.max(
                0,
                1 -
                diff /
                0.78
            );


            /*
            畫面下方線條
            權重更高
            */

            const lowerWeight =
            0.65 +
            (y/H) * 0.65;


            matched +=
            e *
            match *
            lowerWeight;

        }

    }


    if(
        strongEdges <= 0
    ){

        return{
            score:35
        };

    }


    const ratio =
    matched /
    strongEdges;


    const score =

    36

    +
    ratio * 95;


    return{

        score:
        clampScore(score)

    };

}



/* =========================
   ANGLE
========================= */

function normalizeAngle(a){

    while(
        a >
        Math.PI
    ){

        a -=
        Math.PI*2;

    }


    while(
        a <
        -Math.PI
    ){

        a +=
        Math.PI*2;

    }


    /*
    線沒有前後方向，
    180度視為同方向
    */

    if(
        a >
        Math.PI/2
    ){

        a -=
        Math.PI;

    }


    if(
        a <
        -Math.PI/2
    ){

        a +=
        Math.PI;

    }


    return a;

}



/* =========================
   SCORE LIMIT
========================= */

function clampScore(v){

    return Math.round(

        Math.max(
            32,
            Math.min(
                96,
                v
            )
        )

    );

}



/* =========================
   LIVE UPDATE
========================= */

function updateLiveScore(){

    if(
        !navigationActive
        ||
        !lockedMode
    )
    return;


    const result =
    analyzeFrame();


    const newScore =
    result[lockedMode];


    if(
        newScore === undefined
    )
    return;


    currentScore =
    Math.round(

        currentScore * 0.72

        +

        newScore * 0.28

    );


    updateScore(
        currentScore
    );

}



/* =========================
   TEXT
========================= */

function updateModeText(mode){

    const names = {

        vshape:
        "V 型構圖",

        leading:
        "引導線構圖",

        third:
        "三分法",

        center:
        "居中構圖"

    };


    compositionBox.innerText =
    names[mode];


    if(mode === "vshape"){

        descBox.innerText =
        "讓左右線條朝同一消失點收斂";

        messageBox.innerText =
        "📱 移動手機，讓景物貼近白色 V 線";

    }


    else if(
        mode === "leading"
    ){

        descBox.innerText =
        "讓主要線條把視線帶向畫面內";

        messageBox.innerText =
        "📱 調整角度，讓線條朝白色方向延伸";

    }


    else if(
        mode === "third"
    ){

        descBox.innerText =
        "讓主體靠近三分線交點";

        messageBox.innerText =
        "📱 移動手機，讓主體靠近白色交點";

    }


    else if(
        mode === "center"
    ){

        descBox.innerText =
        "讓主要主體集中在中央";

        messageBox.innerText =
        "📱 將主體移入中央白框";

    }

}



/* =========================
   SCORE UI
========================= */

function updateScore(score){

    scoreBox.innerHTML =
    `${score} <small>/100</small>`;


    if(
        score >= 85
    ){

        messageBox.innerText =
        "✅ 構圖完成，可以拍了";

    }


    else if(
        score >= 72
    ){

        messageBox.innerText =
        "🟡 很接近，再微調一下";

    }

}



/* =========================
   OVERLAY
========================= */

function resizeCanvas(){

    const rect =
    overlay.getBoundingClientRect();

    const dpr =
    window.devicePixelRatio || 1;


    overlay.width =
    rect.width * dpr;

    overlay.height =
    rect.height * dpr;


    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

}


function getGuideColor(){

    if(
        currentScore >= 85
    )
    return "#35ff63";


    if(
        currentScore >= 72
    )
    return "#ffd629";


    return "rgba(255,255,255,.92)";

}



/* =========================
   V DRAW
========================= */

function drawV(){

    const w =
    overlay.clientWidth;

    const h =
    overlay.clientHeight;


    const cx =
    w * 0.5;

    const vanishY =
    h * 0.72;


    ctx.save();

    ctx.strokeStyle =
    getGuideColor();

    ctx.lineWidth = 3;

    ctx.setLineDash([
        13,
        9
    ]);


    ctx.beginPath();

    ctx.moveTo(
        w*0.10,
        h*0.18
    );

    ctx.lineTo(
        cx,
        vanishY
    );

    ctx.stroke();


    ctx.beginPath();

    ctx.moveTo(
        w*0.90,
        h*0.18
    );

    ctx.lineTo(
        cx,
        vanishY
    );

    ctx.stroke();


    ctx.setLineDash([]);


    ctx.beginPath();

    ctx.arc(
        cx,
        vanishY,
        6,
        0,
        Math.PI*2
    );

    ctx.fillStyle =
    getGuideColor();

    ctx.fill();


    ctx.restore();

}



/* =========================
   THIRD DRAW
========================= */

function drawThird(){

    const w =
    overlay.clientWidth;

    const h =
    overlay.clientHeight;


    ctx.save();

    ctx.strokeStyle =
    getGuideColor();

    ctx.fillStyle =
    getGuideColor();

    ctx.lineWidth = 2;

    ctx.setLineDash([
        10,
        8
    ]);


    for(
        let i=1;
        i<=2;
        i++
    ){

        ctx.beginPath();

        ctx.moveTo(
            w*i/3,
            0
        );

        ctx.lineTo(
            w*i/3,
            h
        );

        ctx.stroke();


        ctx.beginPath();

        ctx.moveTo(
            0,
            h*i/3
        );

        ctx.lineTo(
            w,
            h*i/3
        );

        ctx.stroke();

    }


    ctx.setLineDash([]);


    const points = [

        [w/3,h/3],

        [w*2/3,h/3],

        [w/3,h*2/3],

        [w*2/3,h*2/3]

    ];


    points.forEach(p=>{

        ctx.beginPath();

        ctx.arc(
            p[0],
            p[1],
            6,
            0,
            Math.PI*2
        );

        ctx.fill();

    });


    ctx.restore();

}



/* =========================
   CENTER DRAW
========================= */

function drawCenter(){

    const w =
    overlay.clientWidth;

    const h =
    overlay.clientHeight;


    ctx.save();

    ctx.strokeStyle =
    getGuideColor();

    ctx.lineWidth = 3;

    ctx.setLineDash([
        12,
        8
    ]);


    ctx.beginPath();

    ctx.ellipse(
        w*0.5,
        h*0.5,
        w*0.20,
        h*0.24,
        0,
        0,
        Math.PI*2
    );

    ctx.stroke();


    ctx.restore();

}



/* =========================
   LEADING DRAW
========================= */

function drawLeading(){

    const w =
    overlay.clientWidth;

    const h =
    overlay.clientHeight;


    ctx.save();

    ctx.strokeStyle =
    getGuideColor();

    ctx.lineWidth = 3;

    ctx.setLineDash([
        12,
        9
    ]);


    ctx.beginPath();

    ctx.moveTo(
        w*0.10,
        h*0.90
    );

    ctx.lineTo(
        w*0.50,
        h*0.48
    );

    ctx.stroke();


    ctx.restore();

}



/* =========================
   LOOP
========================= */

function drawLoop(time){

    ctx.clearRect(
        0,
        0,
        overlay.clientWidth,
        overlay.clientHeight
    );


    if(
        navigationActive
    ){

        if(
            lockedMode === "vshape"
        )
        drawV();


        if(
            lockedMode === "third"
        )
        drawThird();


        if(
            lockedMode === "center"
        )
        drawCenter();


        if(
            lockedMode === "leading"
        )
        drawLeading();


        if(
            time -
            lastAnalysisTime
            >
            ANALYSIS_INTERVAL
        ){

            updateLiveScore();

            lastAnalysisTime =
            time;

        }

    }


    requestAnimationFrame(
        drawLoop
    );

}



/* =========================
   ZOOM
========================= */

zoomSlider.addEventListener(
"input",
async function(){

    const value =
    Number(this.value);


    zoomText.innerText =
    value.toFixed(1)
    +
    "×";


    if(!stream)
    return;


    const track =
    stream.getVideoTracks()[0];


    if(
        !track
        ||
        !track.getCapabilities
    )
    return;


    const cap =
    track.getCapabilities();


    if(!cap.zoom)
    return;


    try{

        await track.applyConstraints({

            advanced:[
                {
                    zoom:value
                }
            ]

        });

    }

    catch(e){

        console.log(
            "此手機不支援硬體 Zoom"
        );

    }

});



window.addEventListener(
"resize",
resizeCanvas
);


startCamera();

requestAnimationFrame(
    drawLoop
);

</script>
