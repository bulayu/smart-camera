<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   user-scalable=no">

    <title>阿策智慧構圖助手 V3</title>

    <style>

        body {
            margin: 0;
            background: black;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        h2 {
            margin: 10px 0;
        }

        #status {
            font-size: 16px;
            margin: 6px;
        }

        #faceInfo {
            font-size: 17px;
            margin: 6px;
        }

        #modeInfo {
            font-size: 18px;
            margin: 6px;
        }

        #guideInfo {
            font-size: 25px;
            font-weight: bold;
            margin: 8px;
            min-height: 34px;
        }

        #scoreInfo {
            font-size: 21px;
            margin: 8px;
            min-height: 28px;
        }

        #cameraBox {
            position: relative;
            width: 100%;
            max-width: 900px;
            margin: auto;
            background: #111;
            overflow: hidden;
        }

        #camera {
            width: 100%;
            display: block;
        }

        #overlay {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .vline {
            position: absolute;
            top: 0;
            height: 100%;
            width: 2px;
            background: rgba(255,255,255,0.65);
        }

        .v1 {
            left: 33.33%;
        }

        .v2 {
            left: 66.66%;
        }

        .hline {
            position: absolute;
            left: 0;
            width: 100%;
            height: 2px;
            background: rgba(255,255,255,0.65);
        }

        .h1 {
            top: 33.33%;
        }

        .h2 {
            top: 66.66%;
        }

        #controls {
            margin: 12px 0;
        }

        button {
            font-size: 18px;
            padding: 12px 16px;
            margin: 5px 3px;
            border: none;
            border-radius: 10px;
        }

        #shutterButton {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            font-size: 28px;
        }

        #photoArea {
            margin-top: 14px;
            padding-bottom: 25px;
        }

        #photoTitle {
            margin-bottom: 8px;
        }

        #photoPreview {
            width: 180px;
            max-width: 45%;
            border-radius: 10px;
            display: none;
            border: 2px solid white;
        }

        #photoCanvas {
            display: none;
        }

    </style>
</head>


<body>

<h2>📷 阿策智慧構圖助手 V3</h2>

<div id="status">
    AI 模型載入中...
</div>

<div id="faceInfo">
    尚未偵測
</div>

<div id="modeInfo"></div>

<div id="guideInfo"></div>

<div id="scoreInfo"></div>


<div id="cameraBox">

    <video id="camera"
           autoplay
           playsinline
           muted>
    </video>

    <canvas id="overlay"></canvas>

    <div class="vline v1"></div>
    <div class="vline v2"></div>

    <div class="hline h1"></div>
    <div class="hline h2"></div>

</div>


<div id="controls">

    <button onclick="startCamera()">
        開啟相機
    </button>

    <button onclick="switchCamera()">
        🔄 切換鏡頭
    </button>

    <button id="shutterButton"
            onclick="takePhoto()">
        📸
    </button>

    <button onclick="stopCamera()">
        關閉
    </button>

</div>


<div id="photoArea">

    <div id="photoTitle">
        拍照預覽
    </div>

    <img id="photoPreview">

</div>


<canvas id="photoCanvas"></canvas>


<script type="module">

import {
    FaceDetector,
    FilesetResolver
}
from "https://unpkg.com/@mediapipe/tasks-vision@0.10.35/vision_bundle.mjs";


let detector = null;

let stream = null;

let cameraRunning = false;

let lastVideoTime = -1;

let smoothScore = 0;

let okCounter = 0;

/*
目前鏡頭

user = 前鏡頭
environment = 後鏡頭
*/
let currentFacingMode =
    "user";


const video =
    document.getElementById("camera");

const canvas =
    document.getElementById("overlay");

const ctx =
    canvas.getContext("2d");


const photoCanvas =
    document.getElementById("photoCanvas");

const photoCtx =
    photoCanvas.getContext("2d");


const photoPreview =
    document.getElementById("photoPreview");


const statusText =
    document.getElementById("status");

const faceInfo =
    document.getElementById("faceInfo");

const modeInfo =
    document.getElementById("modeInfo");

const guideInfo =
    document.getElementById("guideInfo");

const scoreInfo =
    document.getElementById("scoreInfo");


/* =========================
   載入 AI
========================= */

async function loadAI() {

    try {

        statusText.innerText =
            "正在載入 MediaPipe...";


        const resolver =
            await FilesetResolver.forVisionTasks(

                "https://unpkg.com/@mediapipe/tasks-vision@0.10.35/wasm"

            );


        statusText.innerText =
            "正在載入人臉模型...";


        detector =
            await FaceDetector.createFromOptions(

                resolver,

                {

                    baseOptions: {

                        modelAssetPath:

                        "https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite"

                    },

                    runningMode:
                        "VIDEO",

                    minDetectionConfidence:
                        0.4

                }

            );


        statusText.innerText =
            "✅ AI 已準備完成";

    }

    catch(error) {

        statusText.innerText =
            "❌ AI 模型載入失敗";

        faceInfo.innerText =
            error.name +
            "：" +
            error.message;

    }

}


/* =========================
   開啟相機
========================= */

async function startCamera() {

    if (!detector) {

        alert(
            "AI 還沒準備完成"
        );

        return;

    }


    try {

        if (stream) {

            stream
                .getTracks()
                .forEach(
                    track => track.stop()
                );

        }


        stream =
            await navigator.mediaDevices
                .getUserMedia({

                    video: {

                        facingMode: {
                            ideal:
                                currentFacingMode
                        }

                    },

                    audio:
                        false

                });


        video.srcObject =
            stream;


        await video.play();


        cameraRunning =
            true;


        lastVideoTime =
            -1;


        smoothScore =
            0;


        okCounter =
            0;


        if (
            currentFacingMode ===
            "user"
        ) {

            statusText.innerText =
                "📷 前鏡頭已開啟";

        }

        else {

            statusText.innerText =
                "📷 後鏡頭已開啟";

        }


        requestAnimationFrame(
            detectLoop
        );

    }

    catch(error) {

        statusText.innerText =
            "❌ 相機開啟失敗";

        faceInfo.innerText =
            error.name +
            "：" +
            error.message;

    }

}


/* =========================
   切換前後鏡頭
========================= */

async function switchCamera() {

    if (
        currentFacingMode ===
        "user"
    ) {

        currentFacingMode =
            "environment";

    }

    else {

        currentFacingMode =
            "user";

    }


    await startCamera();

}


/* =========================
   關閉相機
========================= */

function stopCamera() {

    cameraRunning =
        false;


    if (stream) {

        stream
            .getTracks()
            .forEach(
                track => track.stop()
            );

        stream =
            null;

    }


    video.srcObject =
        null;


    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    statusText.innerText =
        "相機已關閉";


    faceInfo.innerText =
        "尚未偵測";


    modeInfo.innerText =
        "";


    guideInfo.innerText =
        "";


    scoreInfo.innerText =
        "";

}


/* =========================
   拍照
========================= */

function takePhoto() {

    if (
        !cameraRunning ||
        video.videoWidth === 0
    ) {

        alert(
            "請先開啟相機"
        );

        return;

    }


    photoCanvas.width =
        video.videoWidth;


    photoCanvas.height =
        video.videoHeight;


    /*
    只拍原始相機畫面

    不會把綠框、三分線
    一起拍進照片
    */

    photoCtx.drawImage(
        video,
        0,
        0,
        photoCanvas.width,
        photoCanvas.height
    );


    const imageData =
        photoCanvas.toDataURL(
            "image/jpeg",
            0.92
        );


    photoPreview.src =
        imageData;


    photoPreview.style.display =
        "inline-block";


    statusText.innerText =
        "📸 拍照完成";

}


/* =========================
   AI 偵測
========================= */

function detectLoop() {

    if (!cameraRunning) {

        return;

    }


    if (
        video.readyState >= 2 &&
        video.videoWidth > 0 &&
        video.videoHeight > 0
    ) {

        if (
            video.currentTime !==
            lastVideoTime
        ) {

            lastVideoTime =
                video.currentTime;


            try {

                const result =
                    detector.detectForVideo(

                        video,

                        performance.now()

                    );


                drawResult(
                    result
                );

            }

            catch(error) {

                faceInfo.innerText =
                    "偵測錯誤：" +
                    error.message;

            }

        }

    }


    requestAnimationFrame(
        detectLoop
    );

}


/* =========================
   距離
========================= */

function getDistance(
    x1,
    y1,
    x2,
    y2
) {

    const dx =
        x2 - x1;

    const dy =
        y2 - y1;


    return Math.sqrt(
        dx * dx +
        dy * dy
    );

}


/* =========================
   平滑分數
========================= */

function updateSmoothScore(
    rawScore
) {

    if (
        smoothScore === 0
    ) {

        smoothScore =
            rawScore;

    }

    else {

        smoothScore =
            smoothScore * 0.85 +
            rawScore * 0.15;

    }


    return Math.round(
        smoothScore
    );

}


/* =========================
   方向提示
========================= */

function getDirectionText(
    dx,
    dy,
    toleranceX,
    toleranceY
) {

    let horizontal =
        "";


    let vertical =
        "";


    if (
        Math.abs(dx) >
        toleranceX
    ) {

        horizontal =
            dx > 0
            ? "往右"
            : "往左";

    }


    if (
        Math.abs(dy) >
        toleranceY
    ) {

        vertical =
            dy > 0
            ? "往下"
            : "往上";

    }


    if (
        horizontal !== "" &&
        vertical !== ""
    ) {

        return (
            horizontal +
            "、" +
            vertical
        );

    }


    return (
        horizontal ||
        vertical
    );

}


/* =========================
   畫構圖
========================= */

function drawResult(result) {

    const displayWidth =
        video.clientWidth;

    const displayHeight =
        video.clientHeight;


    if (
        canvas.width !==
        displayWidth
    ) {

        canvas.width =
            displayWidth;

    }


    if (
        canvas.height !==
        displayHeight
    ) {

        canvas.height =
            displayHeight;

    }


    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    const scaleX =
        displayWidth /
        video.videoWidth;


    const scaleY =
        displayHeight /
        video.videoHeight;


    const x1 =
        displayWidth / 3;

    const x2 =
        displayWidth * 2 / 3;

    const y1 =
        displayHeight / 3;

    const y2 =
        displayHeight * 2 / 3;


    const targetPoints = [

        {x: x1, y: y1},

        {x: x2, y: y1},

        {x: x1, y: y2},

        {x: x2, y: y2}

    ];


    for (
        const point
        of targetPoints
    ) {

        ctx.beginPath();

        ctx.arc(
            point.x,
            point.y,
            7,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            "deepskyblue";

        ctx.fill();

    }


    if (
        !result.detections ||
        result.detections.length === 0
    ) {

        faceInfo.innerText =
            "找不到人臉";

        modeInfo.innerText =
            "";

        guideInfo.innerText =
            "";

        scoreInfo.innerText =
            "";

        okCounter =
            0;

        return;

    }


    const validFaces =
        [];


    for (
        const detection
        of result.detections
    ) {

        const box =
            detection.boundingBox;


        const x =
            box.originX *
            scaleX;


        const y =
            box.originY *
            scaleY;


        const w =
            box.width *
            scaleX;


        const h =
            box.height *
            scaleY;


        if (
            w <
            displayWidth * 0.08
            ||
            h <
            displayHeight * 0.08
        ) {

            continue;

        }


        validFaces.push({

            x,
            y,
            w,
            h,

            centerX:
                x + w / 2,

            centerY:
                y + h / 2

        });

    }


    if (
        validFaces.length === 0
    ) {

        faceInfo.innerText =
            "找不到有效人臉";

        modeInfo.innerText =
            "";

        guideInfo.innerText =
            "";

        scoreInfo.innerText =
            "";

        return;

    }


    faceInfo.innerText =
        "找到人臉：" +
        validFaces.length +
        " 張";


    for (
        const face
        of validFaces
    ) {

        ctx.strokeStyle =
            "lime";


        ctx.lineWidth =
            3;


        ctx.strokeRect(
            face.x,
            face.y,
            face.w,
            face.h
        );

    }


    /* =========================
       單人模式
    ========================= */

    if (
        validFaces.length === 1
    ) {

        modeInfo.innerText =
            "👤 單人構圖模式";


        const face =
            validFaces[0];


        const centerX =
            face.centerX;


        const centerY =
            face.centerY;


        ctx.strokeStyle =
            "yellow";


        ctx.lineWidth =
            5;


        ctx.strokeRect(
            face.x,
            face.y,
            face.w,
            face.h
        );


        ctx.beginPath();


        ctx.arc(
            centerX,
            centerY,
            8,
            0,
            Math.PI * 2
        );


        ctx.fillStyle =
            "red";


        ctx.fill();


        let nearestPoint =
            targetPoints[0];


        let nearestDistance =
            getDistance(

                centerX,
                centerY,

                nearestPoint.x,
                nearestPoint.y

            );


        for (
            const point
            of targetPoints
        ) {

            const distance =
                getDistance(

                    centerX,
                    centerY,

                    point.x,
                    point.y

                );


            if (
                distance <
                nearestDistance
            ) {

                nearestDistance =
                    distance;


                nearestPoint =
                    point;

            }

        }


        const okDistance =
            Math.min(
                displayWidth,
                displayHeight
            ) * 0.18;


        const nearDistance =
            Math.min(
                displayWidth,
                displayHeight
            ) * 0.28;


        ctx.beginPath();


        ctx.arc(
            nearestPoint.x,
            nearestPoint.y,
            okDistance,
            0,
            Math.PI * 2
        );


        ctx.strokeStyle =
            "rgba(0,255,255,0.6)";


        ctx.lineWidth =
            3;


        ctx.stroke();


        ctx.beginPath();


        ctx.moveTo(
            centerX,
            centerY
        );


        ctx.lineTo(
            nearestPoint.x,
            nearestPoint.y
        );


        ctx.strokeStyle =
            "yellow";


        ctx.lineWidth =
            3;


        ctx.stroke();


        const dx =
            nearestPoint.x -
            centerX;


        const dy =
            nearestPoint.y -
            centerY;


        const message =
            getDirectionText(

                dx,
                dy,

                displayWidth * 0.10,

                displayHeight * 0.10

            );


        const maxDistance =
            Math.sqrt(

                displayWidth *
                displayWidth +

                displayHeight *
                displayHeight

            ) *
            0.45;


        let rawScore =
            100 -
            (
                nearestDistance /
                maxDistance
            ) *
            100;


        rawScore =
            Math.max(
                0,
                Math.min(
                    100,
                    rawScore
                )
            );


        const finalScore =
            updateSmoothScore(
                rawScore
            );


        if (
            nearestDistance <=
            okDistance
        ) {

            okCounter++;

        }

        else {

            okCounter =
                Math.max(
                    0,
                    okCounter - 1
                );

        }


        if (
            okCounter >= 4
        ) {

            guideInfo.innerText =
                "✅ 構圖 OK";

        }

        else if (
            nearestDistance <=
            nearDistance
        ) {

            guideInfo.innerText =
                "👍 快到了";

        }

        else {

            guideInfo.innerText =
                message === ""
                ? "👍 快到了"
                : "建議：" +
                  message;

        }


        scoreInfo.innerText =
            "構圖分數：" +
            finalScore +
            " 分";


        return;

    }


    /* =========================
       多人模式
    ========================= */

    modeInfo.innerText =
        "👥 多人合照模式：" +
        validFaces.length +
        " 人";


    let totalX =
        0;

    let totalY =
        0;


    for (
        const face
        of validFaces
    ) {

        totalX +=
            face.centerX;

        totalY +=
            face.centerY;

    }


    const groupCenterX =
        totalX /
        validFaces.length;


    const groupCenterY =
        totalY /
        validFaces.length;


    ctx.beginPath();


    ctx.arc(
        groupCenterX,
        groupCenterY,
        10,
        0,
        Math.PI * 2
    );


    ctx.fillStyle =
        "magenta";


    ctx.fill();


    const targetX =
        displayWidth *
        0.50;


    const targetY =
        displayHeight *
        0.43;


    ctx.beginPath();


    ctx.arc(
        targetX,
        targetY,
        10,
        0,
        Math.PI * 2
    );


    ctx.fillStyle =
        "cyan";


    ctx.fill();


    const groupOkDistance =
        Math.min(
            displayWidth,
            displayHeight
        ) * 0.20;


    const groupNearDistance =
        Math.min(
            displayWidth,
            displayHeight
        ) * 0.32;


    ctx.beginPath();


    ctx.arc(
        targetX,
        targetY,
        groupOkDistance,
        0,
        Math.PI * 2
    );


    ctx.strokeStyle =
        "rgba(0,255,255,0.65)";


    ctx.lineWidth =
        3;


    ctx.stroke();


    ctx.beginPath();


    ctx.moveTo(
        groupCenterX,
        groupCenterY
    );


    ctx.lineTo(
        targetX,
        targetY
    );


    ctx.strokeStyle =
        "yellow";


    ctx.lineWidth =
        3;


    ctx.stroke();


    let minX =
        Infinity;

    let minY =
        Infinity;

    let maxX =
        -Infinity;

    let maxY =
        -Infinity;


    for (
        const face
        of validFaces
    ) {

        minX =
            Math.min(
                minX,
                face.x
            );


        minY =
            Math.min(
                minY,
                face.y
            );


        maxX =
            Math.max(
                maxX,
                face.x +
                face.w
            );


        maxY =
            Math.max(
                maxY,
                face.y +
                face.h
            );

    }


    ctx.strokeStyle =
        "orange";


    ctx.lineWidth =
        4;


    ctx.strokeRect(
        minX,
        minY,
        maxX - minX,
        maxY - minY
    );


    const groupDx =
        targetX -
        groupCenterX;


    const groupDy =
        targetY -
        groupCenterY;


    const groupMessage =
        getDirectionText(

            groupDx,
            groupDy,

            displayWidth * 0.08,

            displayHeight * 0.08

        );


    const groupDistance =
        getDistance(

            groupCenterX,
            groupCenterY,

            targetX,
            targetY

        );


    const groupMaxDistance =
        Math.sqrt(

            displayWidth *
            displayWidth +

            displayHeight *
            displayHeight

        ) *
        0.50;


    let rawScore =
        100 -
        (
            groupDistance /
            groupMaxDistance
        ) *
        100;


    rawScore =
        Math.max(
            0,
            Math.min(
                100,
                rawScore
            )
        );


    const edgeMarginX =
        displayWidth *
        0.05;


    const edgeMarginY =
        displayHeight *
        0.05;


    const touchesEdge =

        minX <
        edgeMarginX

        ||

        maxX >
        displayWidth -
        edgeMarginX

        ||

        minY <
        edgeMarginY

        ||

        maxY >
        displayHeight -
        edgeMarginY;


    if (
        touchesEdge
    ) {

        rawScore -=
            10;

    }


    rawScore =
        Math.max(
            0,
            rawScore
        );


    const finalScore =
        updateSmoothScore(
            rawScore
        );


    if (
        groupDistance <=
        groupOkDistance
        &&
        !touchesEdge
    ) {

        okCounter++;

    }

    else {

        okCounter =
            Math.max(
                0,
                okCounter - 1
            );

    }


    if (
        touchesEdge
    ) {

        guideInfo.innerText =
            "⚠️ 人物太靠近畫面邊緣";

    }

    else if (
        okCounter >= 4
    ) {

        guideInfo.innerText =
            "✅ 多人構圖 OK";

    }

    else if (
        groupDistance <=
        groupNearDistance
    ) {

        guideInfo.innerText =
            "👍 快到了";

    }

    else {

        guideInfo.innerText =
            groupMessage === ""
            ? "👍 快到了"
            : "建議：" +
              groupMessage;

    }


    scoreInfo.innerText =
        "構圖分數：" +
        finalScore +
        " 分";

}


/* =========================
   HTML 按鈕
========================= */

window.startCamera =
    startCamera;

window.switchCamera =
    switchCamera;

window.takePhoto =
    takePhoto;

window.stopCamera =
    stopCamera;


/* =========================
   啟動 AI
========================= */

loadAI();

</script>

</body>

</html>
