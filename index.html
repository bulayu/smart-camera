<!DOCTYPE html>
<html lang="zh-TW">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               user-scalable=no,
               viewport-fit=cover">

<title>智慧構圖助手 V5.2</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    background: black;
    color: white;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        Arial,
        sans-serif;
    text-align: center;
}

#topBar {
    padding-top:
        max(
            8px,
            env(safe-area-inset-top)
        );

    padding-bottom: 6px;
}

#title {
    font-size: 19px;
    font-weight: 600;
}

#status {
    min-height: 18px;
    margin-top: 4px;
    font-size: 13px;
    color: #aaaaaa;
}


/* ==================================
   相機
================================== */

#cameraBox {
    position: relative;
    width: 100%;
    max-width: 900px;
    margin: auto;
    background: #111;
    overflow: hidden;
}

#camera {
    display: block;
    width: 100%;
    height: auto;
}

#overlay {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
}


/* ==================================
   按鈕
================================== */

#controls {
    padding:
        10px 4px
        calc(
            15px +
            env(safe-area-inset-bottom)
        );
}

button {
    border: none;
    border-radius: 12px;
    padding: 11px 15px;
    margin: 4px;
    font-size: 16px;
    background: #292929;
    color: white;
}

.cameraButton {
    min-width: 118px;
}

#shutterButton {
    width: 72px;
    height: 72px;
    padding: 0;
    margin: 9px 12px;
    border-radius: 50%;
    border: 4px solid white;
    background: #222;
    font-size: 29px;
}


/* ==================================
   預覽
================================== */

#photoPreview {
    display: none;
    width: 170px;
    max-width: 45%;
    margin-bottom: 20px;
    border-radius: 10px;
    border: 2px solid white;
}

#photoCanvas,
#analysisCanvas {
    display: none;
}

</style>

</head>


<body>


<div id="topBar">

    <div id="title">
        📷 智慧構圖助手
    </div>

    <div id="status">
        AI 載入中...
    </div>

</div>


<div id="cameraBox">

    <video
        id="camera"
        autoplay
        muted
        playsinline>
    </video>

    <canvas id="overlay"></canvas>

</div>


<div id="controls">

    <button
        class="cameraButton"
        onclick="openFrontCamera()">
        🤳 前鏡頭
    </button>

    <button
        class="cameraButton"
        onclick="openRearCamera()">
        📷 後鏡頭
    </button>

    <br>

    <button
        id="shutterButton"
        onclick="takePhoto()">
        📸
    </button>

    <button onclick="stopCamera()">
        關閉
    </button>

</div>


<img id="photoPreview">


<canvas id="photoCanvas"></canvas>

<canvas id="analysisCanvas"></canvas>


<script type="module">

import {

    FaceDetector,
    ObjectDetector,
    FilesetResolver

}
from
"https://unpkg.com/@mediapipe/tasks-vision@0.10.35/vision_bundle.mjs";


/* =====================================================
   AI
===================================================== */

let faceDetector = null;

let objectDetector = null;

let aiReady = false;


/* =====================================================
   相機
===================================================== */

let stream = null;

let cameraRunning = false;

let currentMode =
    "environment";

let frontDeviceId =
    "";

let rearDeviceId =
    "";

let cameraSession =
    0;


/* =====================================================
   時間
===================================================== */

let lastVideoTime =
    -1;

let lastRearAnalysis =
    0;

let lastSceneAnalysis =
    0;


/* =====================================================
   目標框
===================================================== */

let targetRect =
    null;

let smoothRect =
    null;


/* =====================================================
   OK
===================================================== */

let okCounter =
    0;

let compositionOK =
    false;


/* =====================================================
   構圖鎖定
===================================================== */

let lockedComposition =
    "";

let compositionLockUntil =
    0;

const COMPOSITION_LOCK_TIME =
    4500;


/* =====================================================
   主體左右鎖定
===================================================== */

let lockedSide =
    "";

let sideLockUntil =
    0;

const SIDE_LOCK_TIME =
    4500;


/* =====================================================
   HTML
===================================================== */

const video =
    document.getElementById(
        "camera"
    );


const overlay =
    document.getElementById(
        "overlay"
    );


const ctx =
    overlay.getContext(
        "2d"
    );


const statusText =
    document.getElementById(
        "status"
    );


const photoCanvas =
    document.getElementById(
        "photoCanvas"
    );


const photoCtx =
    photoCanvas.getContext(
        "2d"
    );


const photoPreview =
    document.getElementById(
        "photoPreview"
    );


const analysisCanvas =
    document.getElementById(
        "analysisCanvas"
    );


const analysisCtx =
    analysisCanvas.getContext(

        "2d",

        {
            willReadFrequently:
                true
        }

    );


/* =====================================================
   載入 AI
===================================================== */

async function loadAI() {

    try {

        statusText.innerText =
            "正在載入 AI...";


        const vision =
            await FilesetResolver
                .forVisionTasks(

                "https://unpkg.com/@mediapipe/tasks-vision@0.10.35/wasm"

            );


        faceDetector =
            await FaceDetector
                .createFromOptions(

                vision,

                {

                    baseOptions: {

                        modelAssetPath:

                        "https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite"

                    },

                    runningMode:
                        "VIDEO",

                    minDetectionConfidence:
                        0.55

                }

            );


        objectDetector =
            await ObjectDetector
                .createFromOptions(

                vision,

                {

                    baseOptions: {

                        modelAssetPath:

                        "https://storage.googleapis.com/mediapipe-tasks/object_detector/efficientdet_lite0_uint8.tflite"

                    },

                    runningMode:
                        "VIDEO",

                    scoreThreshold:
                        0.45,

                    maxResults:
                        6

                }

            );


        aiReady =
            true;


        statusText.innerText =
            "✅ AI 已準備完成";

    }

    catch(error) {

        console.error(
            error
        );


        statusText.innerText =
            "❌ AI 載入失敗";

    }

}


/* =====================================================
   找前後鏡頭
===================================================== */

async function prepareCameraDevices() {

    try {

        const tempStream =
            await navigator.mediaDevices
                .getUserMedia({

                    video: true,

                    audio: false

                });


        tempStream
            .getTracks()
            .forEach(

                track =>
                    track.stop()

            );


        const devices =
            await navigator.mediaDevices
                .enumerateDevices();


        const cameras =
            devices.filter(

                device =>
                    device.kind ===
                    "videoinput"

            );


        frontDeviceId =
            "";

        rearDeviceId =
            "";


        for (
            const camera
            of cameras
        ) {

            const name =
                (
                    camera.label ||
                    ""
                )
                .toLowerCase();


            if (
                !frontDeviceId
                &&
                (
                    name.includes("front")
                    ||
                    name.includes("user")
                    ||
                    name.includes("前")
                )
            ) {

                frontDeviceId =
                    camera.deviceId;

            }


            const isRear =

                name.includes("back")

                ||

                name.includes("rear")

                ||

                name.includes("environment")

                ||

                name.includes("後");


            const specialLens =

                name.includes("ultra")

                ||

                name.includes("tele")

                ||

                name.includes("zoom");


            if (
                !rearDeviceId
                &&
                isRear
                &&
                !specialLens
            ) {

                rearDeviceId =
                    camera.deviceId;

            }

        }


        if (
            !rearDeviceId
        ) {

            for (
                const camera
                of cameras
            ) {

                const name =
                    (
                        camera.label ||
                        ""
                    )
                    .toLowerCase();


                if (
                    name.includes("back")
                    ||
                    name.includes("rear")
                    ||
                    name.includes("後")
                ) {

                    rearDeviceId =
                        camera.deviceId;

                    break;

                }

            }

        }

    }

    catch(error) {

        console.log(
            error
        );

    }

}


/* =====================================================
   前鏡頭
===================================================== */

async function openFrontCamera() {

    await openCamera(
        "user"
    );

}


/* =====================================================
   後鏡頭
===================================================== */

async function openRearCamera() {

    await openCamera(
        "environment"
    );

}


/* =====================================================
   開相機
===================================================== */

async function openCamera(
    mode
) {

    if (!aiReady) {

        alert(
            "AI 還在載入，請稍等一下"
        );

        return;

    }


    if (
        !frontDeviceId
        &&
        !rearDeviceId
    ) {

        statusText.innerText =
            "正在取得相機權限...";


        await prepareCameraDevices();

    }


    cameraSession++;


    const thisSession =
        cameraSession;


    cameraRunning =
        false;


    stopCurrentStream();


    try {

        let constraints;


        if (
            mode === "user"
            &&
            frontDeviceId
        ) {

            constraints = {

                video: {

                    deviceId: {

                        exact:
                            frontDeviceId

                    }

                },

                audio:
                    false

            };

        }


        else if (
            mode === "environment"
            &&
            rearDeviceId
        ) {

            constraints = {

                video: {

                    deviceId: {

                        exact:
                            rearDeviceId

                    }

                },

                audio:
                    false

            };

        }


        else {

            constraints = {

                video: {

                    facingMode: {

                        exact:
                            mode

                    }

                },

                audio:
                    false

            };

        }


        stream =
            await navigator.mediaDevices
                .getUserMedia(
                    constraints
                );

    }

    catch(error) {

        try {

            stream =
                await navigator.mediaDevices
                    .getUserMedia({

                        video: {

                            facingMode:
                                mode

                        },

                        audio:
                            false

                    });

        }

        catch(error2) {

            statusText.innerText =
                "❌ 無法開啟相機";

            return;

        }

    }


    video.srcObject =
        stream;


    await video.play();


    currentMode =
        mode;


    cameraRunning =
        true;


    resetComposition();


    statusText.innerText =

        mode === "user"

        ?

        "🤳 前鏡頭"

        :

        "📷 後鏡頭";


    requestAnimationFrame(

        () =>
            cameraLoop(
                thisSession
            )

    );

}


/* =====================================================
   重設
===================================================== */

function resetComposition() {

    lastVideoTime =
        -1;


    lastRearAnalysis =
        0;


    lastSceneAnalysis =
        0;


    targetRect =
        null;


    smoothRect =
        null;


    okCounter =
        0;


    compositionOK =
        false;


    lockedComposition =
        "";


    compositionLockUntil =
        0;


    lockedSide =
        "";


    sideLockUntil =
        0;

}


/* =====================================================
   關閉串流
===================================================== */

function stopCurrentStream() {

    if (stream) {

        stream
            .getTracks()
            .forEach(

                track =>
                    track.stop()

            );


        stream =
            null;

    }

}


/* =====================================================
   關閉
===================================================== */

function stopCamera() {

    cameraSession++;


    cameraRunning =
        false;


    stopCurrentStream();


    video.srcObject =
        null;


    resetComposition();


    ctx.clearRect(

        0,
        0,

        overlay.width,
        overlay.height

    );


    statusText.innerText =
        "相機已關閉";

}


/* =====================================================
   主循環
===================================================== */

function cameraLoop(
    session
) {

    if (
        session !==
        cameraSession
    ) {

        return;

    }


    if (!cameraRunning) {

        return;

    }


    if (
        video.readyState >= 2
        &&
        video.videoWidth > 0
        &&
        video.videoHeight > 0
    ) {

        if (
            currentMode ===
            "user"
        ) {

            processFront();

        }

        else {

            processRear();

        }

    }


    smoothGuideRect();


    drawGuideRect();


    requestAnimationFrame(

        () =>
            cameraLoop(
                session
            )

    );

}


/* =====================================================
   前鏡頭
===================================================== */

function processFront() {

    if (
        video.currentTime ===
        lastVideoTime
    ) {

        return;

    }


    lastVideoTime =
        video.currentTime;


    let result;


    try {

        result =
            faceDetector.detectForVideo(

                video,

                performance.now()

            );

    }

    catch(error) {

        return;

    }


    if (
        !result.detections
        ||
        result.detections.length === 0
    ) {

        return;

    }


    let best =
        null;


    let bestArea =
        0;


    for (
        const detection
        of result.detections
    ) {

        const box =
            detection.boundingBox;


        const area =
            box.width *
            box.height;


        if (
            area >
            bestArea
        ) {

            bestArea =
                area;

            best =
                box;

        }

    }


    if (!best) {

        return;

    }


    const width =
        video.clientWidth;


    const height =
        video.clientHeight;


    const sx =
        width /
        video.videoWidth;


    const sy =
        height /
        video.videoHeight;


    const faceX =

        (
            best.originX +
            best.width / 2
        )
        *
        sx;


    const faceY =

        (
            best.originY +
            best.height / 2
        )
        *
        sy;


    setSideLock(
        faceX,
        width
    );


    /*
    自拍主要用三分 / 黃金
    */

    const centerDistance =

        Math.abs(
            faceX -
            width / 2
        );


    if (
        centerDistance <
        width * 0.10
    ) {

        lockedComposition =
            "golden";

    }

    else {

        lockedComposition =
            "thirds";

    }


    compositionLockUntil =

        performance.now()
        +
        COMPOSITION_LOCK_TIME;


    let centerX;


    if (
        lockedComposition ===
        "thirds"
    ) {

        centerX =

            lockedSide === "left"

            ?

            width * 0.333

            :

            width * 0.667;

    }

    else {

        centerX =

            lockedSide === "left"

            ?

            width * 0.382

            :

            width * 0.618;

    }


    targetRect = {

        x:
            centerX -
            width * 0.16,

        y:
            height * 0.12,

        width:
            width * 0.32,

        height:
            height * 0.43

    };


    const ok =

        Math.abs(
            faceX -
            centerX
        )
        <
        width * 0.12

        &&

        Math.abs(
            faceY -
            height * 0.34
        )
        <
        height * 0.16;


    updateOK(
        ok
    );

}


/* =====================================================
   後鏡頭
===================================================== */

function processRear() {

    const now =
        performance.now();


    if (
        now -
        lastRearAnalysis
        <
        300
    ) {

        return;

    }


    lastRearAnalysis =
        now;


    let result =
        null;


    try {

        result =
            objectDetector.detectForVideo(

                video,
                now

            );

    }

    catch(error) {

        console.log(
            error
        );

    }


    const subject =
        chooseMainSubject(
            result
        );


    if (subject) {

        if (
            subject.category ===
            "person"
        ) {

            processPerson(
                subject
            );

        }

        else {

            processObject(
                subject
            );

        }


        return;

    }


    processScene();

}


/* =====================================================
   選主要主體
===================================================== */

function chooseMainSubject(
    result
) {

    if (
        !result
        ||
        !result.detections
        ||
        result.detections.length === 0
    ) {

        return null;

    }


    let best =
        null;


    let bestScore =
        -Infinity;


    const frameArea =

        video.videoWidth *
        video.videoHeight;


    for (
        const detection
        of result.detections
    ) {

        const box =
            detection.boundingBox;


        if (!box) {

            continue;

        }


        const category =
            detection.categories?.[0];


        const confidence =
            category?.score || 0;


        const areaRatio =

            (
                box.width *
                box.height
            )

            /
            frameArea;


        if (
            areaRatio <
            0.012
        ) {

            continue;

        }


        const cx =

            box.originX +
            box.width / 2;


        const cy =

            box.originY +
            box.height / 2;


        const nx =

            cx /
            video.videoWidth;


        const ny =

            cy /
            video.videoHeight;


        const distance =

            Math.hypot(

                nx - 0.5,

                ny - 0.5

            );


        const personBonus =

            category?.categoryName ===
            "person"

            ?

            0.25

            :

            0;


        const score =

            areaRatio *
            3

            +

            confidence

            +

            personBonus

            -

            distance *
            0.20;


        if (
            score >
            bestScore
        ) {

            bestScore =
                score;


            best = {

                box:
                    box,

                category:
                    category?.categoryName || "",

                confidence:
                    confidence

            };

        }

    }


    return best;

}


/* =====================================================
   人物
===================================================== */

function processPerson(
    subject
) {

    const width =
        video.clientWidth;


    const height =
        video.clientHeight;


    const sx =
        width /
        video.videoWidth;


    const sy =
        height /
        video.videoHeight;


    const box =
        subject.box;


    const x =
        box.originX *
        sx;


    const y =
        box.originY *
        sy;


    const w =
        box.width *
        sx;


    const h =
        box.height *
        sy;


    const cx =
        x +
        w / 2;


    const bottom =
        y +
        h;


    const heightRatio =
        h /
        height;


    setSideLock(
        cx,
        width
    );


    /*
    人物構圖：
    自動選三分 / 黃金 / 居中
    */

    chooseSubjectComposition(

        cx,
        width,
        "person"

    );


    let centerX;


    if (
        lockedComposition ===
        "center"
    ) {

        centerX =
            width * 0.50;

    }


    else if (
        lockedComposition ===
        "golden"
    ) {

        centerX =

            lockedSide === "left"

            ?

            width * 0.382

            :

            width * 0.618;

    }


    else {

        centerX =

            lockedSide === "left"

            ?

            width * 0.333

            :

            width * 0.667;

    }


    /*
    全身
    */

    if (
        heightRatio >=
        0.52
    ) {

        targetRect = {

            x:
                centerX -
                width * 0.18,

            y:
                height * 0.07,

            width:
                width * 0.36,

            height:
                height * 0.86

        };


        const horizontalOK =

            Math.abs(
                cx -
                centerX
            )
            <
            width * 0.13;


        const headOK =

            y >
            -height * 0.03

            &&

            y <
            height * 0.26;


        const feetOK =

            bottom >
            height * 0.72

            &&

            bottom <
            height * 1.02;


        const sizeOK =

            heightRatio >
            0.48

            &&

            heightRatio <
            0.98;


        updateOK(

            horizontalOK
            &&
            headOK
            &&
            feetOK
            &&
            sizeOK

        );

    }


    /*
    半身
    */

    else if (
        heightRatio >=
        0.30
    ) {

        targetRect = {

            x:
                centerX -
                width * 0.20,

            y:
                height * 0.10,

            width:
                width * 0.40,

            height:
                height * 0.65

        };


        const ok =

            Math.abs(
                cx -
                centerX
            )
            <
            width * 0.14

            &&

            y <
            height * 0.28;


        updateOK(
            ok
        );

    }


    /*
    遠景人物
    */

    else {

        targetRect = {

            x:
                centerX -
                width * 0.17,

            y:
                height * 0.18,

            width:
                width * 0.34,

            height:
                height * 0.50

        };


        const ok =

            Math.abs(
                cx -
                centerX
            )
            <
            width * 0.15

            &&

            bottom <
            height * 0.94;


        updateOK(
            ok
        );

    }

}


/* =====================================================
   一般物件
===================================================== */

function processObject(
    subject
) {

    const width =
        video.clientWidth;


    const height =
        video.clientHeight;


    const sx =
        width /
        video.videoWidth;


    const sy =
        height /
        video.videoHeight;


    const box =
        subject.box;


    const x =
        box.originX *
        sx;


    const y =
        box.originY *
        sy;


    const w =
        box.width *
        sx;


    const h =
        box.height *
        sy;


    const cx =
        x +
        w / 2;


    const cy =
        y +
        h / 2;


    setSideLock(
        cx,
        width
    );


    chooseSubjectComposition(

        cx,
        width,
        subject.category

    );


    let centerX;


    if (
        lockedComposition ===
        "center"
    ) {

        centerX =
            width * 0.50;

    }


    else if (
        lockedComposition ===
        "thirds"
    ) {

        centerX =

            lockedSide === "left"

            ?

            width * 0.333

            :

            width * 0.667;

    }


    else {

        centerX =

            lockedSide === "left"

            ?

            width * 0.382

            :

            width * 0.618;

    }


    const livingThings = [

        "dog",
        "cat",
        "bird",
        "horse",
        "cow",
        "sheep"

    ];


    const centerY =

        livingThings.includes(
            subject.category
        )

        ?

        height * 0.43

        :

        height * 0.50;


    const guideWidth =

        Math.max(

            width * 0.25,

            Math.min(

                width * 0.42,

                w * 1.30

            )

        );


    const guideHeight =

        Math.max(

            height * 0.20,

            Math.min(

                height * 0.48,

                h * 1.30

            )

        );


    targetRect = {

        x:
            centerX -
            guideWidth / 2,

        y:
            centerY -
            guideHeight / 2,

        width:
            guideWidth,

        height:
            guideHeight

    };


    const ok =

        Math.abs(
            cx -
            centerX
        )
        <
        guideWidth * 0.48

        &&

        Math.abs(
            cy -
            centerY
        )
        <
        guideHeight * 0.55;


    updateOK(
        ok
    );

}


/* =====================================================
   明確主體構圖選擇
===================================================== */

function chooseSubjectComposition(

    cx,
    width,
    category

) {

    const now =
        performance.now();


    if (
        lockedComposition
        &&
        now <
        compositionLockUntil
    ) {

        return;

    }


    const centerDistance =

        Math.abs(
            cx -
            width / 2
        );


    const centerFriendly = [

        "car",
        "truck",
        "bus",
        "train",
        "boat",
        "airplane"
    ];


    /*
    本來就在中央，
    而且是適合置中的主體
    */

    if (
        centerDistance <
        width * 0.09

        &&

        centerFriendly.includes(
            category
        )
    ) {

        lockedComposition =
            "center";

    }


    /*
    人與動物
    優先三分
    */

    else if (
        [
            "person",
            "dog",
            "cat",
            "bird",
            "horse",
            "cow",
            "sheep"
        ]
        .includes(
            category
        )
    ) {

        lockedComposition =
            "thirds";

    }


    /*
    靠中央的普通物件
    黃金比例
    */

    else if (
        centerDistance <
        width * 0.16
    ) {

        lockedComposition =
            "golden";

    }


    /*
    其他
    三分
    */

    else {

        lockedComposition =
            "thirds";

    }


    compositionLockUntil =

        now +
        COMPOSITION_LOCK_TIME;

}


/* =====================================================
   左右鎖定
===================================================== */

function setSideLock(

    subjectX,
    width

) {

    const now =
        performance.now();


    if (
        lockedSide
        &&
        now <
        sideLockUntil
    ) {

        return;

    }


    lockedSide =

        subjectX <
        width / 2

        ?

        "left"

        :

        "right";


    sideLockUntil =

        now +
        SIDE_LOCK_TIME;

}


/* =====================================================
   風景 / 建築 / 道路分析
===================================================== */

function processScene() {

    const now =
        performance.now();


    if (
        now -
        lastSceneAnalysis
        <
        550
    ) {

        return;

    }


    lastSceneAnalysis =
        now;


    const w =
        160;


    const h =
        100;


    analysisCanvas.width =
        w;


    analysisCanvas.height =
        h;


    analysisCtx.drawImage(

        video,

        0,
        0,

        w,
        h

    );


    const image =
        analysisCtx.getImageData(

            0,
            0,
            w,
            h

        );


    const data =
        image.data;


    const gray =
        new Float32Array(
            w * h
        );


    for (
        let y = 0;
        y < h;
        y++
    ) {

        for (
            let x = 0;
            x < w;
            x++
        ) {

            const i =

                (
                    y * w +
                    x
                )
                *
                4;


            gray[
                y * w +
                x
            ] =

                data[i] *
                0.299

                +

                data[i + 1] *
                0.587

                +

                data[i + 2] *
                0.114;

        }

    }


    const width =
        video.clientWidth;


    const height =
        video.clientHeight;


    /*
    1.
    對稱
    */

    const symmetryScore =

        detectSymmetry(

            gray,
            w,
            h

        );


    /*
    2.
    引導線
    */

    const leading =

        detectLeadingLines(

            gray,
            w,
            h

        );


    /*
    3.
    V 型
    */

    const vShape =

        detectVShape(

            gray,
            w,
            h

        );


    /*
    4.
    視覺重心
    */

    const energy =

        getVisualEnergy(

            gray,
            w,
            h

        );


    const now2 =
        performance.now();


    /*
    鎖定中時，
    只維持目前構圖
    */

    if (
        lockedComposition
        &&
        now2 <
        compositionLockUntil
    ) {

        return;

    }


    /*
    =====================================
    V 型構圖優先

    需要強度真的比較高
    =====================================
    */

    if (
        vShape.strength >
        0.70
    ) {

        lockedComposition =
            "vshape";


        targetRect = {

            x:
                width *
                vShape.xRatio
                -
                width * 0.14,

            y:
                height *
                vShape.yRatio
                -
                height * 0.11,

            width:
                width * 0.28,

            height:
                height * 0.22

        };

    }


    /*
    =====================================
    引導線
    =====================================
    */

    else if (
        leading.strength >
        0.64
    ) {

        lockedComposition =
            "leading";


        targetRect = {

            x:
                width *
                leading.xRatio
                -
                width * 0.14,

            y:
                height *
                leading.yRatio
                -
                height * 0.11,

            width:
                width * 0.28,

            height:
                height * 0.22

        };

    }


    /*
    =====================================
    居中構圖
    =====================================
    */

    else if (
        symmetryScore >
        0.70
    ) {

        lockedComposition =
            "center";


        targetRect = {

            x:
                width * 0.35,

            y:
                height * 0.32,

            width:
                width * 0.30,

            height:
                height * 0.36

        };

    }


    /*
    =====================================
    黃金比例
    =====================================
    */

    else if (
        Math.abs(
            energy.left -
            energy.right
        )
        <
        (
            energy.left +
            energy.right
        )
        *
        0.12
    ) {

        lockedComposition =
            "golden";


        const centerX =

            energy.left >
            energy.right

            ?

            width * 0.382

            :

            width * 0.618;


        targetRect = {

            x:
                centerX -
                width * 0.14,

            y:
                height * 0.36,

            width:
                width * 0.28,

            height:
                height * 0.24

        };

    }


    /*
    =====================================
    三分法
    =====================================
    */

    else {

        lockedComposition =
            "thirds";


        const centerX =

            energy.left >
            energy.right

            ?

            width * 0.333

            :

            width * 0.667;


        targetRect = {

            x:
                centerX -
                width * 0.14,

            y:
                height * 0.34,

            width:
                width * 0.28,

            height:
                height * 0.24

        };

    }


    compositionLockUntil =

        now2 +
        COMPOSITION_LOCK_TIME;


    /*
    純場景暫時不強制變綠。

    因為沒有明確主體框，
    目前先提供推薦區。
    */

    compositionOK =
        false;

}


/* =====================================================
   對稱偵測
===================================================== */

function detectSymmetry(

    gray,
    w,
    h

) {

    let difference =
        0;


    let samples =
        0;


    for (
        let y = 4;
        y < h - 4;
        y += 3
    ) {

        for (
            let x = 4;
            x < w / 2;
            x += 3
        ) {

            const left =

                gray[
                    y * w +
                    x
                ];


            const right =

                gray[
                    y * w +
                    (
                        w - 1 - x
                    )
                ];


            difference +=

                Math.abs(
                    left -
                    right
                );


            samples++;

        }

    }


    const average =

        difference /
        Math.max(
            1,
            samples
        );


    /*
    越接近 1
    越對稱
    */

    const score =

        1 -
        Math.min(
            1,
            average / 70
        );


    return score;

}


/* =====================================================
   引導線偵測
===================================================== */

function detectLeadingLines(

    gray,
    w,
    h

) {

    const candidates = [

        { x: 0.30, y: 0.30 },
        { x: 0.50, y: 0.30 },
        { x: 0.70, y: 0.30 },

        { x: 0.30, y: 0.48 },
        { x: 0.50, y: 0.48 },
        { x: 0.70, y: 0.48 }

    ];


    let best =
        candidates[1];


    let bestScore =
        0;


    for (
        const c
        of candidates
    ) {

        const cx =
            c.x * w;


        const cy =
            c.y * h;


        let score =
            0;


        for (
            let baseX = 8;
            baseX < w - 8;
            baseX += 14
        ) {

            const baseY =
                h - 5;


            const steps =
                20;


            for (
                let s = 0;
                s < steps;
                s++
            ) {

                const t =

                    s /
                    (
                        steps - 1
                    );


                const x =

                    Math.round(

                        baseX +
                        (
                            cx -
                            baseX
                        )
                        *
                        t

                    );


                const y =

                    Math.round(

                        baseY +
                        (
                            cy -
                            baseY
                        )
                        *
                        t

                    );


                if (
                    x <= 1
                    ||
                    x >= w - 2
                    ||
                    y <= 1
                    ||
                    y >= h - 2
                ) {

                    continue;

                }


                const center =

                    gray[
                        y * w +
                        x
                    ];


                const gx =

                    Math.abs(

                        gray[
                            y * w +
                            x + 1
                        ]

                        -

                        gray[
                            y * w +
                            x - 1
                        ]

                    );


                const gy =

                    Math.abs(

                        gray[
                            (y + 1) *
                            w +
                            x
                        ]

                        -

                        gray[
                            (y - 1) *
                            w +
                            x
                        ]

                    );


                score +=

                    gx +
                    gy +
                    Math.abs(
                        center -
                        gray[
                            (y - 1) *
                            w +
                            x
                        ]
                    );

            }

        }


        if (
            score >
            bestScore
        ) {

            bestScore =
                score;


            best =
                c;

        }

    }


    const strength =

        Math.min(

            1,

            bestScore /
            115000

        );


    return {

        xRatio:
            best.x,

        yRatio:
            best.y,

        strength:
            strength

    };

}


/* =====================================================
   V 型偵測

   左右下方兩邊的斜線
   是否朝同一個區域收斂
===================================================== */

function detectVShape(

    gray,
    w,
    h

) {

    const candidates = [

        { x: 0.35, y: 0.35 },
        { x: 0.50, y: 0.35 },
        { x: 0.65, y: 0.35 },

        { x: 0.35, y: 0.50 },
        { x: 0.50, y: 0.50 },
        { x: 0.65, y: 0.50 }

    ];


    let best =
        candidates[1];


    let bestScore =
        0;


    for (
        const c
        of candidates
    ) {

        const cx =
            c.x * w;


        const cy =
            c.y * h;


        /*
        左下 → 匯聚點
        */

        const leftEnergy =

            sampleLineEnergy(

                gray,
                w,
                h,

                5,
                h - 5,

                cx,
                cy

            );


        /*
        右下 → 匯聚點
        */

        const rightEnergy =

            sampleLineEnergy(

                gray,
                w,
                h,

                w - 6,
                h - 5,

                cx,
                cy

            );


        /*
        V 型需要兩邊都強，
        所以取較弱的一邊。
        */

        const score =

            Math.min(

                leftEnergy,
                rightEnergy

            );


        if (
            score >
            bestScore
        ) {

            bestScore =
                score;


            best =
                c;

        }

    }


    const strength =

        Math.min(

            1,

            bestScore /
            19000

        );


    return {

        xRatio:
            best.x,

        yRatio:
            best.y,

        strength:
            strength

    };

}


/* =====================================================
   取一條線上的邊緣能量
===================================================== */

function sampleLineEnergy(

    gray,
    w,
    h,

    x1,
    y1,

    x2,
    y2

) {

    const steps =
        30;


    let energy =
        0;


    for (
        let i = 0;
        i < steps;
        i++
    ) {

        const t =

            i /
            (
                steps - 1
            );


        const x =

            Math.round(

                x1 +
                (
                    x2 -
                    x1
                )
                *
                t

            );


        const y =

            Math.round(

                y1 +
                (
                    y2 -
                    y1
                )
                *
                t

            );


        if (
            x <= 1
            ||
            x >= w - 2
            ||
            y <= 1
            ||
            y >= h - 2
        ) {

            continue;

        }


        const gx =

            Math.abs(

                gray[
                    y * w +
                    x + 1
                ]

                -

                gray[
                    y * w +
                    x - 1
                ]

            );


        const gy =

            Math.abs(

                gray[
                    (y + 1) *
                    w +
                    x
                ]

                -

                gray[
                    (y - 1) *
                    w +
                    x
                ]

            );


        energy +=
            gx + gy;

    }


    return energy;

}


/* =====================================================
   左右視覺能量
===================================================== */

function getVisualEnergy(

    gray,
    w,
    h

) {

    let leftEnergy =
        0;


    let rightEnergy =
        0;


    for (
        let y = 2;
        y < h - 2;
        y += 2
    ) {

        for (
            let x = 2;
            x < w - 2;
            x += 2
        ) {

            const center =

                gray[
                    y * w +
                    x
                ];


            const right =

                gray[
                    y * w +
                    x + 1
                ];


            const below =

                gray[
                    (y + 1) *
                    w +
                    x
                ];


            const energy =

                Math.abs(
                    center -
                    right
                )

                +

                Math.abs(
                    center -
                    below
                );


            if (
                x <
                w / 2
            ) {

                leftEnergy +=
                    energy;

            }

            else {

                rightEnergy +=
                    energy;

            }

        }

    }


    return {

        left:
            leftEnergy,

        right:
            rightEnergy

    };

}


/* =====================================================
   OK
===================================================== */

function updateOK(
    ok
) {

    if (ok) {

        okCounter++;

    }

    else {

        okCounter--;

    }


    okCounter =

        Math.max(

            0,

            Math.min(
                6,
                okCounter
            )

        );


    compositionOK =

        okCounter >= 2;

}


/* =====================================================
   平滑框
===================================================== */

function smoothGuideRect() {

    if (!targetRect) {

        return;

    }


    if (!smoothRect) {

        smoothRect = {

            x:
                targetRect.x,

            y:
                targetRect.y,

            width:
                targetRect.width,

            height:
                targetRect.height

        };


        return;

    }


    smoothRect.x =

        smoothRect.x *
        0.84

        +

        targetRect.x *
        0.16;


    smoothRect.y =

        smoothRect.y *
        0.84

        +

        targetRect.y *
        0.16;


    smoothRect.width =

        smoothRect.width *
        0.84

        +

        targetRect.width *
        0.16;


    smoothRect.height =

        smoothRect.height *
        0.84

        +

        targetRect.height *
        0.16;

}


/* =====================================================
   畫框
===================================================== */

function drawGuideRect() {

    const width =
        video.clientWidth;


    const height =
        video.clientHeight;


    overlay.width =
        width;


    overlay.height =
        height;


    ctx.clearRect(

        0,
        0,

        width,
        height

    );


    if (!smoothRect) {

        return;

    }


    let x =
        smoothRect.x;


    let y =
        smoothRect.y;


    let w =
        smoothRect.width;


    let h =
        smoothRect.height;


    x =
        Math.max(
            8,
            Math.min(
                width - w - 8,
                x
            )
        );


    y =
        Math.max(
            8,
            Math.min(
                height - h - 8,
                y
            )
        );


    ctx.strokeStyle =

        compositionOK

        ?

        "#48ff70"

        :

        "rgba(255,255,255,0.92)";


    ctx.lineWidth =

        compositionOK

        ?

        5

        :

        3;


    ctx.shadowColor =
        "rgba(0,0,0,0.75)";


    ctx.shadowBlur =
        5;


    drawCornerFrame(

        x,
        y,
        w,
        h

    );


    ctx.shadowBlur =
        0;

}


/* =====================================================
   四角框
===================================================== */

function drawCornerFrame(

    x,
    y,
    width,
    height

) {

    const corner =

        Math.min(
            width,
            height
        )
        *
        0.23;


    ctx.beginPath();


    ctx.moveTo(
        x + corner,
        y
    );

    ctx.lineTo(
        x,
        y
    );

    ctx.lineTo(
        x,
        y + corner
    );


    ctx.moveTo(
        x + width - corner,
        y
    );

    ctx.lineTo(
        x + width,
        y
    );

    ctx.lineTo(
        x + width,
        y + corner
    );


    ctx.moveTo(
        x,
        y + height - corner
    );

    ctx.lineTo(
        x,
        y + height
    );

    ctx.lineTo(
        x + corner,
        y + height
    );


    ctx.moveTo(
        x + width - corner,
        y + height
    );

    ctx.lineTo(
        x + width,
        y + height
    );

    ctx.lineTo(
        x + width,
        y + height - corner
    );


    ctx.stroke();

}


/* =====================================================
   拍照
===================================================== */

function takePhoto() {

    if (
        !cameraRunning
        ||
        video.videoWidth === 0
    ) {

        alert(
            "請先開啟相機"
        );

        return;

    }


    photoCanvas.width =
        video.videoWidth;


    photoCanvas.height =
        video.videoHeight;


    photoCtx.drawImage(

        video,

        0,
        0,

        photoCanvas.width,
        photoCanvas.height

    );


    const imageData =
        photoCanvas.toDataURL(

            "image/jpeg",

            0.94

        );


    photoPreview.src =
        imageData;


    photoPreview.style.display =
        "inline-block";


    statusText.innerText =
        "📸 拍照完成";

}
