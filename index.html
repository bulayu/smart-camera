<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#000"><title>阿策構圖助手 V9.1</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#app{position:fixed;inset:0}video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}canvas{display:none}.top{position:absolute;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none}.tag{background:#0008;backdrop-filter:blur(8px);padding:7px 10px;border-radius:12px;font-size:13px}.brand{font-weight:800}#status{position:absolute;top:64px;left:50%;transform:translateX(-50%);max-width:88%;padding:8px 12px;border-radius:14px;background:#000a;backdrop-filter:blur(8px);font-size:14px;text-align:center;display:none}#result{position:absolute;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom));padding:14px 15px;border-radius:18px;background:#000b;backdrop-filter:blur(12px);display:none}.title{font-size:20px;font-weight:800;margin-bottom:5px}.subject{font-size:14px;margin-bottom:6px}.reason{font-size:13px;line-height:1.45;opacity:.85}.confidence{font-size:12px;opacity:.6;margin-top:7px}.controls{position:absolute;left:0;right:0;bottom:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:9px;justify-content:center;background:linear-gradient(transparent,#000c)}button{border:0;border-radius:18px;min-height:48px;padding:0 18px;font-size:16px;font-weight:700;color:#fff;background:#333d}#smart{flex:1;max-width:240px;background:#fff;color:#111}#switch{width:112px}button:disabled{opacity:.45}
</style></head><body><div id="app"><video id="video" autoplay muted playsinline></video><canvas id="capture"></canvas><div class="top"><div class="tag brand">阿策構圖助手</div><div class="tag">V9.1</div></div><div id="status"></div><div id="result"><div class="title" id="rt"></div><div class="subject" id="rs"></div><div class="reason" id="rr"></div><div class="confidence" id="rc"></div></div><div class="controls"><button id="switch">切換鏡頭</button><button id="smart">智慧構圖</button></div></div><script>
const WORKER="https://smart-camera-v9.a813155.workers.dev/";
const video=document.querySelector("#video"),canvas=document.querySelector("#capture"),ctx=canvas.getContext("2d",{alpha:false}),smart=document.querySelector("#smart"),sw=document.querySelector("#switch"),statusEl=document.querySelector("#status"),result=document.querySelector("#result");let stream=null,facing="environment",busy=false;
function status(t,hold=false){statusEl.textContent=t;statusEl.style.display="block";if(!hold)setTimeout(()=>{if(statusEl.textContent===t)statusEl.style.display="none"},2200)}
async function camera(){try{if(stream)stream.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:facing},width:{ideal:1920},height:{ideal:1080}}});video.srcObject=stream;await video.play();status("相機已就緒")}catch(e){status("無法開啟相機，請確認相機權限",true)}}
function shot(){let w=video.videoWidth,h=video.videoHeight;if(!w||!h)throw Error("相機尚未就緒");let s=Math.min(1,1024/Math.max(w,h));canvas.width=Math.round(w*s);canvas.height=Math.round(h*s);if(facing==="user"){ctx.save();ctx.translate(canvas.width,0);ctx.scale(-1,1);ctx.drawImage(video,0,0,canvas.width,canvas.height);ctx.restore()}else ctx.drawImage(video,0,0,canvas.width,canvas.height);return canvas.toDataURL("image/jpeg",.72)}
function cname(x){return({thirds:"三分構圖",center:"中央構圖",symmetry:"中央對稱",leading_lines:"引導線構圖",one_point_perspective:"單點透視",negative_space:"留白構圖",landscape_thirds:"風景三分構圖",keep_current:"目前構圖已合適",user_select:"請選擇主體"})[x]||"構圖建議"}
function show(r){document.querySelector("#rt").textContent=cname(r.composition);document.querySelector("#rs").textContent=r.needs_user_select?"對準想拍的主體":"主體："+(r.subject||"未明確");document.querySelector("#rr").textContent=r.description||r.reason||"";let c=Number(r.confidence);document.querySelector("#rc").textContent=Number.isFinite(c)?"判斷信心 "+Math.round(c*100)+"%":"";result.style.display="block"}
async function analyze(){if(busy)return;busy=true;smart.disabled=sw.disabled=true;result.style.display="none";status("正在取景…",true);try{let res=await fetch(WORKER,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({image:shot()})});let d=await res.json();if(!res.ok||!d.ok){let msg=d?.detail?.error?.message||d?.detail?.message||d?.error||("HTTP "+res.status);throw Error(msg)}statusEl.style.display="none";show(d.result||{})}catch(e){console.error(e);statusEl.style.display="none";document.querySelector("#rt").textContent="無法取得構圖建議";document.querySelector("#rs").textContent="";document.querySelector("#rr").textContent=String(e.message||e);document.querySelector("#rc").textContent="請確認 API 額度、Worker 設定與網路";result.style.display="block"}finally{busy=false;smart.disabled=sw.disabled=false}}
smart.onclick=analyze;sw.onclick=async()=>{facing=facing==="environment"?"user":"environment";result.style.display="none";await camera()};
(async()=>{if(!navigator.mediaDevices?.getUserMedia){status("請使用 HTTPS 開啟此頁面",true);return}await camera()})();
</script></body></html>
