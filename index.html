<!DOCTYPE html>
<html lang="zh-TW">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               user-scalable=no,
               viewport-fit=cover">

<title>智慧構圖助手 V5.0</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    background: black;
    color: white;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        Arial,
        sans-serif;

    text-align: center;
}

#topBar {
    padding-top:
        max(
            8px,
            env(safe-area-inset-top)
        );

    padding-bottom: 6px;
}

#title {
    font-size: 19px;
    font-weight: 600;
}

#status {
    min-height: 18px;
    margin-top: 4px;

    font-size: 13px;

    color: #aaaaaa;
}


/* =========================
   相機
========================= */

#cameraBox {
    position: relative;

    width: 100%;
    max-width: 900px;

    margin: auto;

    background: #111;

    overflow: hidden;
}

#camera {
    display: block;

    width: 100%;
    height: auto;
}

#overlay {
    position: absolute;

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    pointer-events: none;
}


/* =========================
   按鈕
========================= */

#controls {
    padding:
        10px 4px
        calc(
            15px +
            env(safe-area-inset-bottom)
        );
}

button {
    border: none;

    border-radius: 12px;

    padding: 11px 15px;

    margin: 4px;

    font-size: 16px;

    background: #292929;
    color: white;
}

.cameraButton {
    min-width: 118px;
}

#shutterButton {
    width: 72px;
    height: 72px;

    padding: 0;

    margin: 9px 12px;

    border-radius: 50%;

    border: 4px solid white;

    background: #222;

    font-size: 29px;
}


/* =========================
   拍照預覽
========================= */

#photoPreview {
    display: none;

    width: 170px;
    max-width: 45%;

    margin-bottom: 20px;

    border-radius: 10px;

    border: 2px solid white;
}

#photoCanvas,
#analysisCanvas {
    display: none;
}

</style>

</head>


<body>


<div id="topBar">

    <div id="title">
        📷 智慧構圖助手
    </div>

    <div id="status">
        AI 載入中...
    </div>

</div>


<div id="cameraBox">

    <video
        id="camera"
        autoplay
        muted
        playsinline>
    </video>

    <canvas id="overlay"></canvas>

</div>


<div id="controls">

    <button
        class="cameraButton"
        onclick="openFrontCamera()">
        🤳 前鏡頭
    </button>

    <button
        class="cameraButton"
        onclick="openRearCamera()">
        📷 後鏡頭
    </button>

    <br>

    <button
        id="shutterButton"
        onclick="takePhoto()">
        📸
    </button>

    <button onclick="stopCamera()">
        關閉
    </button>

</div>


<img id="photoPreview">


<canvas id="photoCanvas"></canvas>

<canvas id="analysisCanvas"></canvas>



<script type="module">

import {

    FaceDetector,
    ObjectDetector,
    FilesetResolver

}
from
"https://unpkg.com/@mediapipe/tasks-vision@0.10.35/vision_bundle.mjs";


/* =====================================================
   AI
===================================================== */

let faceDetector = null;

let objectDetector = null;

let aiReady = false;


/* =====================================================
   相機
===================================================== */

let stream = null;

let cameraRunning = false;

let currentMode =
    "environment";

let frontDeviceId =
    "";

let rearDeviceId =
    "";

let cameraSession =
    0;


/* =====================================================
   分析時間
===================================================== */

let lastVideoTime =
    -1;

let lastRearAnalysis =
    0;


/* =====================================================
   AI 推薦目標位置
===================================================== */

let targetX =
    null;

let targetY =
    null;


/*
目標框平滑位置
*/
let smoothTargetX =
    null;

let smoothTargetY =
    null;


/*
目前主體位置
*/
let subjectX =
    null;

let subjectY =
    null;


/*
避免 AI 一直換構圖法
*/
let lockedComposition =
    "";

let lockUntil =
    0;


/*
4 秒內盡量保持同一構圖
*/
const LOCK_TIME =
    4000;


/*
接近目標時
變綠色
*/
let okCounter =
    0;

let compositionOK =
    false;


/* =====================================================
   HTML
===================================================== */

const video =
    document.getElementById(
        "camera"
    );


const overlay =
    document.getElementById(
        "overlay"
    );


const ctx =
    overlay.getContext(
        "2d"
    );


const statusText =
    document.getElementById(
        "status"
    );


const photoCanvas =
    document.getElementById(
        "photoCanvas"
    );


const photoCtx =
    photoCanvas.getContext(
        "2d"
    );


const photoPreview =
    document.getElementById(
        "photoPreview"
    );


const analysisCanvas =
    document.getElementById(
        "analysisCanvas"
    );


const analysisCtx =
    analysisCanvas.getContext(

        "2d",

        {
            willReadFrequently:
                true
        }

    );


/* =====================================================
   載入 AI
===================================================== */

async function loadAI() {

    try {

        statusText.innerText =
            "正在載入 AI...";


        const vision =
            await FilesetResolver
                .forVisionTasks(

                "https://unpkg.com/@mediapipe/tasks-vision@0.10.35/wasm"

            );


        /*
        前鏡頭：
        人臉辨識
        */

        faceDetector =
            await FaceDetector
                .createFromOptions(

                vision,

                {

                    baseOptions: {

                        modelAssetPath:

                        "https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite"

                    },

                    runningMode:
                        "VIDEO",

                    minDetectionConfidence:
                        0.55

                }

            );


        /*
        後鏡頭：
        物件辨識
        */

        objectDetector =
            await ObjectDetector
                .createFromOptions(

                vision,

                {

                    baseOptions: {

                        modelAssetPath:

                        "https://storage.googleapis.com/mediapipe-tasks/object_detector/efficientdet_lite0_uint8.tflite"

                    },

                    runningMode:
                        "VIDEO",

                    scoreThreshold:
                        0.48,

                    maxResults:
                        5

                }

            );


        aiReady =
            true;


        statusText.innerText =
            "✅ AI 已準備完成";

    }

    catch(error) {

        console.error(
            error
        );


        statusText.innerText =
            "❌ AI 載入失敗";

    }

}


/* =====================================================
   找真正前後鏡頭
===================================================== */

async function prepareCameraDevices() {

    try {

        const tempStream =
            await navigator.mediaDevices
                .getUserMedia({

                    video: true,

                    audio: false

                });


        tempStream
            .getTracks()
            .forEach(

                track =>
                    track.stop()

            );


        const devices =
            await navigator.mediaDevices
                .enumerateDevices();


        const cameras =
            devices.filter(

                device =>
                    device.kind ===
                    "videoinput"

            );


        frontDeviceId =
            "";

        rearDeviceId =
            "";


        for (
            const camera
            of cameras
        ) {

            const name =
                (
                    camera.label ||
                    ""
                )
                .toLowerCase();


            /*
            前鏡頭
            */

            if (
                !frontDeviceId
                &&
                (
                    name.includes(
                        "front"
                    )
                    ||
                    name.includes(
                        "user"
                    )
                    ||
                    name.includes(
                        "前"
                    )
                )
            ) {

                frontDeviceId =
                    camera.deviceId;

            }


            /*
            後鏡頭
            */

            const isRear =

                name.includes(
                    "back"
                )

                ||

                name.includes(
                    "rear"
                )

                ||

                name.includes(
                    "environment"
                )

                ||

                name.includes(
                    "後"
                );


            /*
            優先一般鏡頭，
            不優先超廣角或望遠
            */

            const specialLens =

                name.includes(
                    "ultra"
                )

                ||

                name.includes(
                    "tele"
                )

                ||

                name.includes(
                    "zoom"
                );


            if (
                !rearDeviceId
                &&
                isRear
                &&
                !specialLens
            ) {

                rearDeviceId =
                    camera.deviceId;

            }

        }


        /*
        找不到普通後鏡頭時，
        再找任何後鏡頭
        */

        if (
            !rearDeviceId
        ) {

            for (
                const camera
                of cameras
            ) {

                const name =
                    (
                        camera.label ||
                        ""
                    )
                    .toLowerCase();


                if (
                    name.includes("back")
                    ||
                    name.includes("rear")
                    ||
                    name.includes("後")
                ) {

                    rearDeviceId =
                        camera.deviceId;

                    break;

                }

            }

        }

    }

    catch(error) {

        console.log(
            error
        );

    }

}


/* =====================================================
   前鏡頭
===================================================== */

async function openFrontCamera() {

    await openCamera(
        "user"
    );

}


/* =====================================================
   後鏡頭
===================================================== */

async function openRearCamera() {

    await openCamera(
        "environment"
    );

}


/* =====================================================
   開啟相機
===================================================== */

async function openCamera(
    mode
) {

    if (!aiReady) {

        alert(
            "AI 還在載入，請稍等一下"
        );

        return;

    }


    if (
        !frontDeviceId
        &&
        !rearDeviceId
    ) {

        statusText.innerText =
            "正在取得相機權限...";


        await prepareCameraDevices();

    }


    cameraSession++;


    const thisSession =
        cameraSession;


    cameraRunning =
        false;


    stopCurrentStream();


    try {

        let constraints;


        if (
            mode === "user"
            &&
            frontDeviceId
        ) {

            constraints = {

                video: {

                    deviceId: {

                        exact:
                            frontDeviceId

                    }

                },

                audio: false

            };

        }


        else if (
            mode === "environment"
            &&
            rearDeviceId
        ) {

            constraints = {

                video: {

                    deviceId: {

                        exact:
                            rearDeviceId

                    }

                },

                audio: false

            };

        }


        else {

            constraints = {

                video: {

                    facingMode: {

                        exact:
                            mode

                    }

                },

                audio: false

            };

        }


        stream =
            await navigator.mediaDevices
                .getUserMedia(
                    constraints
                );

    }

    catch(error) {

        try {

            stream =
                await navigator.mediaDevices
                    .getUserMedia({

                        video: {

                            facingMode:
                                mode

                        },

                        audio:
                            false

                    });

        }

        catch(error2) {

            statusText.innerText =
                "❌ 無法開啟相機";

            return;

        }

    }


    video.srcObject =
        stream;


    await video.play();


    currentMode =
        mode;


    cameraRunning =
        true;


    resetComposition();


    statusText.innerText =

        mode === "user"

        ?

        "🤳 前鏡頭"

        :

        "📷 後鏡頭";


    requestAnimationFrame(

        () =>
            cameraLoop(
                thisSession
            )

    );

}


/* =====================================================
   重設
===================================================== */

function resetComposition() {

    lastVideoTime =
        -1;


    lastRearAnalysis =
        0;


    targetX =
        null;


    targetY =
        null;


    smoothTargetX =
        null;


    smoothTargetY =
        null;


    subjectX =
        null;


    subjectY =
        null;


    lockedComposition =
        "";


    lockUntil =
        0;


    okCounter =
        0;


    compositionOK =
        false;

}


/* =====================================================
   停止相機串流
===================================================== */

function stopCurrentStream() {

    if (stream) {

        stream
            .getTracks()
            .forEach(

                track =>
                    track.stop()

            );


        stream =
            null;

    }

}


/* =====================================================
   關閉
===================================================== */

function stopCamera() {

    cameraSession++;


    cameraRunning =
        false;


    stopCurrentStream();


    video.srcObject =
        null;


    resetComposition();


    ctx.clearRect(

        0,
        0,

        overlay.width,
        overlay.height

    );


    statusText.innerText =
        "相機已關閉";

}


/* =====================================================
   主循環
===================================================== */

function cameraLoop(
    session
) {

    if (
        session !==
        cameraSession
    ) {

        return;

    }


    if (!cameraRunning) {

        return;

    }


    if (
        video.readyState >= 2
        &&
        video.videoWidth > 0
        &&
        video.videoHeight > 0
    ) {

        if (
            currentMode ===
            "user"
        ) {

            processFrontCamera();

        }

        else {

            processRearCamera();

        }

    }


    drawTarget();


    requestAnimationFrame(

        () =>
            cameraLoop(
                session
            )

    );

}


/* =====================================================
   前鏡頭

   人像優先使用：
   三分法 / 黃金比例
===================================================== */

function processFrontCamera() {

    if (
        video.currentTime ===
        lastVideoTime
    ) {

        return;

    }


    lastVideoTime =
        video.currentTime;


    let result;


    try {

        result =
            faceDetector
                .detectForVideo(

                video,

                performance.now()

            );

    }

    catch(error) {

        return;

    }


    if (
        !result.detections
        ||
        result.detections.length === 0
    ) {

        return;

    }


    /*
    最大的人臉
    */

    let best =
        null;


    let bestArea =
        0;


    for (
        const detection
        of result.detections
    ) {

        const box =
            detection.boundingBox;


        const area =
            box.width *
            box.height;


        if (
            area >
            bestArea
        ) {

            bestArea =
                area;


            best =
                box;

        }

    }


    if (!best) {

        return;

    }


    const width =
        video.clientWidth;


    const height =
        video.clientHeight;


    const sx =
        width /
        video.videoWidth;


    const sy =
        height /
        video.videoHeight;


    subjectX =

        (
            best.originX +
            best.width / 2
        )

        *
        sx;


    subjectY =

        (
            best.originY +
            best.height / 2
        )

        *
        sy;


    /*
    人像：
    AI 自動決定三分或黃金比例
    */

    selectPortraitComposition(

        width,
        height

    );


    updateOKState(

        width,
        height

    );

}


/* =====================================================
   人像構圖選擇
===================================================== */

function selectPortraitComposition(

    width,
    height

) {

    const now =
        performance.now();


    /*
    鎖定期間不一直換
    */

    if (
        now <
        lockUntil
        &&
        lockedComposition
    ) {

        applyLockedComposition(

            width,
            height

        );

        return;

    }


    /*
    主體靠近中央：

    改用黃金比例，
    讓移動量不要太大。
    */

    const centerDistance =
        Math.abs(

            subjectX -
            width / 2

        );


    if (
        centerDistance <
        width * 0.12
    ) {

        lockedComposition =
            "golden";

    }

    else {

        lockedComposition =
            "thirds";

    }


    lockUntil =
        now +
        LOCK_TIME;


    applyLockedComposition(

        width,
        height

    );

}


/* =====================================================
   套用已鎖定的構圖
===================================================== */

function applyLockedComposition(

    width,
    height

) {

    /*
    ======================
    三分法
    ======================
    */

    if (
        lockedComposition ===
        "thirds"
    ) {

        targetX =

            subjectX <
            width / 2

            ?

            width * 0.333

            :

            width * 0.667;


        targetY =
            height *
            0.38;

    }


    /*
    ======================
    黃金比例
    ======================
    */

    else if (
        lockedComposition ===
        "golden"
    ) {

        targetX =

            subjectX <
            width / 2

            ?

            width * 0.382

            :

            width * 0.618;


        targetY =
            height *
            0.40;

    }


    /*
    ======================
    居中
    ======================
    */

    else if (
        lockedComposition ===
        "center"
    ) {

        targetX =
            width *
            0.50;


        targetY =
            height *
            0.48;

    }


    /*
    ======================
    引導線
    ======================
    */

    else if (
        lockedComposition ===
        "leading"
    ) {

        /*
        targetX / targetY
        已由場景分析算好
        */

    }


    /*
    平滑目標框
    */

    smoothTarget();

}


/* =====================================================
   後鏡頭
===================================================== */

function processRearCamera() {

    const now =
        performance.now();


    /*
    約每 350ms 分析一次
    */

    if (
        now -
        lastRearAnalysis
        <
        350
    ) {

        return;

    }


    lastRearAnalysis =
        now;


    let result =
        null;


    try {

        result =
            objectDetector
                .detectForVideo(

                video,
                now

            );

    }

    catch(error) {

        console.log(
            error
        );

    }


    const object =
        chooseMainObject(
            result
        );


    /*
    有明確物件
    */

    if (object) {

        processDetectedObject(
            object
        );

        return;

    }


    /*
    沒有物件：
    做場景構圖分析
    */

    analyzeSceneComposition();

}


/* =====================================================
   選主要物件
===================================================== */

function chooseMainObject(
    result
) {

    if (
        !result
        ||
        !result.detections
        ||
        result.detections.length === 0
    ) {

        return null;

    }


    const frameArea =

        video.videoWidth *
        video.videoHeight;


    let best =
        null;


    let bestScore =
        -Infinity;


    for (
        const detection
        of result.detections
    ) {

        const box =
            detection.boundingBox;


        if (!box) {

            continue;

        }


        const category =
            detection.categories?.[0];


        const confidence =
            category?.score || 0;


        const areaRatio =

            (
                box.width *
                box.height
            )

            /

            frameArea;


        /*
        太小的東西忽略
        */

        if (
            areaRatio <
            0.018
        ) {

            continue;

        }


        const cx =

            box.originX +
            box.width / 2;


        const cy =

            box.originY +
            box.height / 2;


        const nx =

            cx /
            video.videoWidth;


        const ny =

            cy /
            video.videoHeight;


        const centerDistance =

            Math.hypot(

                nx - 0.5,

                ny - 0.5

            );


        const score =

            areaRatio *
            3

            +

            confidence

            -

            centerDistance *
            0.25;


        if (
            score >
            bestScore
        ) {

            bestScore =
                score;


            best = {

                box:
                    box,

                category:
                    category?.categoryName || ""

            };

        }

    }


    return best;

}


/* =====================================================
   有辨識到主體
===================================================== */

function processDetectedObject(
    object
) {

    const width =
        video.clientWidth;


    const height =
        video.clientHeight;


    const sx =
        width /
        video.videoWidth;


    const sy =
        height /
        video.videoHeight;


    const box =
        object.box;


    subjectX =

        (
            box.originX +
            box.width / 2
        )

        *
        sx;


    subjectY =

        (
            box.originY +
            box.height / 2
        )

        *
        sy;


    const now =
        performance.now();


    /*
    還在鎖定期間
    */

    if (
        now <
        lockUntil
        &&
        lockedComposition
    ) {

        applyLockedComposition(

            width,
            height

        );


        updateOKState(

            width,
            height

        );


        return;

    }


    /*
    =====================================
    判斷是否適合居中
    =====================================
    */

    const centered =

        Math.abs(

            subjectX -
            width / 2

        )

        <
        width *
        0.08;


    /*
    建築、車、船等
    如果本來就在中央附近，
    優先使用居中構圖。
    */

    const centerFriendly = [

        "car",
        "truck",
        "bus",
        "boat",
        "train",
        "airplane"

    ];


    if (
        centered
        &&
        centerFriendly.includes(
            object.category
        )
    ) {

        lockedComposition =
            "center";

    }


    /*
    人與動物：
    優先三分法
    */

    else if (
        [
            "person",
            "dog",
            "cat",
            "bird",
            "horse",
            "cow",
            "sheep"
        ]
        .includes(
            object.category
        )
    ) {

        lockedComposition =
            "thirds";

    }


    /*
    其他物體：
    黃金比例
    */

    else {

        lockedComposition =
            "golden";

    }


    lockUntil =
        now +
        LOCK_TIME;


    applyLockedComposition(

        width,
        height

    );


    updateOKState(

        width,
        height

    );

}


/* =====================================================
   場景分析

   自動判斷：

   1. 居中
   2. 引導線
   3. 黃金比例
===================================================== */

function analyzeSceneComposition() {

    if (
        video.videoWidth === 0
        ||
        video.videoHeight === 0
    ) {

        return;

    }


    const w =
        160;


    const h =
        100;


    analysisCanvas.width =
        w;


    analysisCanvas.height =
        h;


    analysisCtx.drawImage(

        video,

        0,
        0,

        w,
        h

    );


    const image =
        analysisCtx.getImageData(

            0,
            0,

            w,
            h

        );


    const data =
        image.data;


    const gray =
        new Float32Array(
            w * h
        );


    /*
    灰階
    */

    for (
        let y = 0;
        y < h;
        y++
    ) {

        for (
            let x = 0;
            x < w;
            x++
        ) {

            const i =

                (
                    y * w +
                    x
                )

                *
                4;


            gray[
                y * w +
                x
            ] =

                data[i] *
                0.299

                +

                data[i + 1] *
                0.587

                +

                data[i + 2] *
                0.114;

        }

    }


    /*
    =====================================
    1. 左右對稱分析
    =====================================
    */

    let symmetryDifference =
        0;


    let symmetrySamples =
        0;


    for (
        let y = 5;
        y < h - 5;
        y += 3
    ) {

        for (
            let x = 5;
            x < w / 2;
            x += 3
        ) {

            const left =

                gray[
                    y * w +
                    x
                ];


            const mirrorX =
                w - 1 - x;


            const right =

                gray[
                    y * w +
                    mirrorX
                ];


            symmetryDifference +=

                Math.abs(

                    left -
                    right

                );


            symmetrySamples++;

        }

    }


    const averageSymmetryDifference =

        symmetryDifference /
        Math.max(
            1,
            symmetrySamples
        );


    /*
    數字越小
    越左右對稱
    */

    const isSymmetric =

        averageSymmetryDifference
        <
        30;


    /*
    =====================================
    2. 引導線 / V 型分析
    =====================================
    */

    const leading =
        detectLeadingLines(

            gray,
            w,
            h

        );


    const now =
        performance.now();


    if (
        now <
        lockUntil
        &&
        lockedComposition
    ) {

        /*
        引導線模式的 target
        已經算好
        */

        if (
            lockedComposition !==
            "leading"
        ) {

            applyLockedComposition(

                video.clientWidth,
                video.clientHeight

            );

        }


        return;

    }


    /*
    =====================================
    強烈左右對稱
    → 居中構圖
    =====================================
    */

    if (
        isSymmetric
    ) {

        lockedComposition =
            "center";


        targetX =
            video.clientWidth *
            0.50;


        targetY =
            video.clientHeight *
            0.48;

    }


    /*
    =====================================
    有強烈引導線
    → 引導線構圖
    =====================================
    */

    else if (
        leading.strength >
        0.60
    ) {

        lockedComposition =
            "leading";


        targetX =

            video.clientWidth

            *

            leading.xRatio;


        targetY =

            video.clientHeight

            *

            leading.yRatio;

    }


    /*
    =====================================
    一般風景
    → 黃金比例
    =====================================
    */

    else {

        lockedComposition =
            "golden";


        /*
        分析左右哪邊細節比較多
        */

        const energy =
            getVisualEnergy(

                gray,
                w,
                h

            );


        targetX =

            energy.left >
            energy.right

            ?

            video.clientWidth *
            0.382

            :

            video.clientWidth *
            0.618;


        targetY =
            video.clientHeight *
            0.45;

    }


    lockUntil =
        now +
        LOCK_TIME;


    smoothTarget();

}


/* =====================================================
   簡易引導線分析

   找左右兩側
   是否有線條朝某個區域集中。

   不是完整電腦視覺 Hough Transform，
   但可先做 Web 原型。
===================================================== */

function detectLeadingLines(

    gray,
    w,
    h

) {

    /*
    候選匯聚點
    */

    const candidates = [

        {
            x: 0.35,
            y: 0.35
        },

        {
            x: 0.50,
            y: 0.35
        },

        {
            x: 0.65,
            y: 0.35
        },

        {
            x: 0.35,
            y: 0.50
        },

        {
            x: 0.50,
            y: 0.50
        },

        {
            x: 0.65,
            y: 0.50
        }

    ];


    let bestCandidate =
        candidates[1];


    let bestScore =
        0;


    for (
        const candidate
        of candidates
    ) {

        const cx =
            candidate.x *
            w;


        const cy =
            candidate.y *
            h;


        let score =
            0;


        let samples =
            0;


        /*
        從畫面下半部
        朝候選點取樣
        */

        for (
            let baseX = 10;
            baseX < w - 10;
            baseX += 12
        ) {

            const baseY =
                h - 8;


            const steps =
                20;


            let lineEnergy =
                0;


            for (
                let s = 0;
                s < steps;
                s++
            ) {

                const t =
                    s /
                    (
                        steps - 1
                    );


                const x =
                    Math.round(

                        baseX +
                        (
                            cx -
                            baseX
                        )
                        *
                        t

                    );


                const y =
                    Math.round(

                        baseY +
                        (
                            cy -
                            baseY
                        )
                        *
                        t

                    );


                if (
                    x <= 1
                    ||
                    x >= w - 2
                    ||
                    y <= 1
                    ||
                    y >= h - 2
                ) {

                    continue;

                }


                const center =

                    gray[
                        y * w +
                        x
                    ];


                const left =

                    gray[
                        y * w +
                        x - 1
                    ];


                const right =

                    gray[
                        y * w +
                        x + 1
                    ];


                const above =

                    gray[
                        (y - 1) *
                        w +
                        x
                    ];


                const below =

                    gray[
                        (y + 1) *
                        w +
                        x
                    ];


                lineEnergy +=

                    Math.abs(
                        center -
                        left
                    )

                    +

                    Math.abs(
                        center -
                        right
                    )

                    +

                    Math.abs(
                        center -
                        above
                    )

                    +

                    Math.abs(
                        center -
                        below
                    );


                samples++;

            }


            score +=
                lineEnergy;

        }


        if (
            score >
            bestScore
        ) {

            bestScore =
                score;


            bestCandidate =
                candidate;

        }

    }


    /*
    正規化成大約 0~1
    */

    const normalized =

        Math.min(

            1,

            bestScore /
            130000

        );


    return {

        xRatio:
            bestCandidate.x,

        yRatio:
            bestCandidate.y,

        strength:
            normalized

    };

}


/* =====================================================
   左右視覺能量
===================================================== */

function getVisualEnergy(

    gray,
    w,
    h

) {

    let leftEnergy =
        0;


    let rightEnergy =
        0;


    for (
        let y = 2;
        y < h - 2;
        y += 2
    ) {

        for (
            let x = 2;
            x < w - 2;
            x += 2
        ) {

            const center =

                gray[
                    y * w +
                    x
                ];


            const right =

                gray[
                    y * w +
                    x + 1
                ];


            const below =

                gray[
                    (y + 1) *
                    w +
                    x
                ];


            const energy =

                Math.abs(
                    center -
                    right
                )

                +

                Math.abs(
                    center -
                    below
                );


            if (
                x <
                w / 2
            ) {

                leftEnergy +=
                    energy;

            }

            else {

                rightEnergy +=
                    energy;

            }

        }

    }


    return {

        left:
            leftEnergy,

        right:
            rightEnergy

    };

}


/* =====================================================
   平滑目標框位置
===================================================== */

function smoothTarget() {

    if (
        targetX === null
        ||
        targetY === null
    ) {

        return;

    }


    if (
        smoothTargetX === null
    ) {

        smoothTargetX =
            targetX;


        smoothTargetY =
            targetY;

    }

    else {

        smoothTargetX =

            smoothTargetX *
            0.86

            +

            targetX *
            0.14;


        smoothTargetY =

            smoothTargetY *
            0.86

            +

            targetY *
            0.14;

    }

}


/* =====================================================
   判斷主體是否已進推薦區
===================================================== */

function updateOKState(

    width,
    height

) {

    smoothTarget();


    if (
        subjectX === null
        ||
        subjectY === null
        ||
        targetX === null
        ||
        targetY === null
    ) {

        compositionOK =
            false;

        return;

    }


    const distance =

        Math.hypot(

            subjectX -
            targetX,

            subjectY -
            targetY

        );


    /*
    容許範圍稍微放寬
    不要太難對準
    */

    const tolerance =

        Math.min(
            width,
            height
        )

        *
        0.17;


    if (
        distance <
        tolerance
    ) {

        okCounter++;

    }

    else {

        okCounter =
            Math.max(

                0,

                okCounter - 1

            );

    }


    compositionOK =

        okCounter >=
        3;

}


/* =====================================================
   畫唯一的提示：
   AI 建議主體位置
===================================================== */

function drawTarget() {

    const width =
        video.clientWidth;


    const height =
        video.clientHeight;


    overlay.width =
        width;


    overlay.height =
        height;


    ctx.clearRect(

        0,
        0,

        width,
        height

    );


    if (
        smoothTargetX === null
        ||
        smoothTargetY === null
    ) {

        return;

    }


    /*
    目標框大小

    比之前大一點，
    比較容易使用。
    */

    const boxWidth =

        Math.max(

            70,

            Math.min(
                width,
                height
            )

            *
            0.22

        );


    const boxHeight =

        boxWidth *
        0.85;


    const left =

        smoothTargetX -
        boxWidth / 2;


    const top =

        smoothTargetY -
        boxHeight / 2;


    /*
    白色：
    AI 建議位置

    綠色：
    已符合構圖
    */

    ctx.strokeStyle =

        compositionOK

        ?

        "#46ff73"

        :

        "rgba(255,255,255,0.92)";


    ctx.lineWidth =

        compositionOK
        ? 5
        : 3;


    ctx.shadowColor =
        "rgba(0,0,0,0.8)";


    ctx.shadowBlur =
        6;


    /*
    不畫完整死框，
    改成四個角。

    會比較像相機 UI。
    */

    drawCornerFrame(

        left,
        top,

        boxWidth,
        boxHeight

    );


    ctx.shadowBlur =
        0;

}


/* =====================================================
   四角目標框
===================================================== */

function drawCornerFrame(

    x,
    y,

    width,
    height

) {

    const corner =

        Math.min(
            width,
            height
        )

        *
        0.28;


    ctx.beginPath();


    /*
    左上
    */

    ctx.moveTo(
        x + corner,
        y
    );

    ctx.lineTo(
        x,
        y
    );

    ctx.lineTo(
        x,
        y + corner
    );


    /*
    右上
    */

    ctx.moveTo(
        x + width - corner,
        y
    );

    ctx.lineTo(
        x + width,
        y
    );

    ctx.lineTo(
        x + width,
        y + corner
    );


    /*
    左下
    */

    ctx.moveTo(
        x,
        y + height - corner
    );

    ctx.lineTo(
        x,
        y + height
    );

    ctx.lineTo(
        x + corner,
        y + height
    );


    /*
    右下
    */

    ctx.moveTo(
        x + width - corner,
        y + height
    );

    ctx.lineTo(
        x + width,
        y + height
    );

    ctx.lineTo(
        x + width,
        y + height - corner
    );


    ctx.stroke();

}


/* =====================================================
   拍照
===================================================== */

function takePhoto() {

    if (
        !cameraRunning
        ||
        video.videoWidth === 0
    ) {

        alert(
            "請先開啟相機"
        );

        return;

    }


    photoCanvas.width =
        video.videoWidth;


    photoCanvas.height =
        video.videoHeight;


    /*
    拍出乾淨照片

    AI 目標框不會被拍進去
    */

    photoCtx.drawImage(

        video,

        0,
        0,

        photoCanvas.width,
        photoCanvas.height

    );


    const imageData =
        photoCanvas.toDataURL(

            "image/jpeg",

            0.94

        );


    photoPreview.src =
        imageData;


    photoPreview.style.display =
        "inline-block";


    statusText.innerText =
        "📸 拍照完成";

}


/* =====================================================
   HTML
===================================================== */

window.openFrontCamera =
    openFrontCamera;


window.openRearCamera =
    openRearCamera;


window.takePhoto =
    takePhoto;


window.stopCamera =
    stopCamera;


/* =====================================================
   啟動
===================================================== */

loadAI();

</script>
