<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, user-scalable=no">

    <title>阿策智慧構圖助手</title>

    <style>
        body {
            margin: 0;
            background: black;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        h2 {
            margin: 10px 0;
        }

        #status,
        #faceInfo {
            margin: 8px;
            font-size: 18px;
        }

        #cameraBox {
            position: relative;
            width: 100%;
            max-width: 900px;
            margin: auto;
            background: #111;
        }

        #camera {
            width: 100%;
            display: block;
        }

        #overlay {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .vline {
            position: absolute;
            top: 0;
            height: 100%;
            width: 2px;
            background: rgba(255,255,255,0.7);
            pointer-events: none;
        }

        .v1 {
            left: 33.33%;
        }

        .v2 {
            left: 66.66%;
        }

        .hline {
            position: absolute;
            left: 0;
            width: 100%;
            height: 2px;
            background: rgba(255,255,255,0.7);
            pointer-events: none;
        }

        .h1 {
            top: 33.33%;
        }

        .h2 {
            top: 66.66%;
        }

        button {
            font-size: 18px;
            padding: 12px 20px;
            margin: 10px 5px;
            border: none;
            border-radius: 10px;
        }
    </style>
</head>

<body>

<h2>📷 阿策智慧構圖助手</h2>

<div id="status">
    AI 模型載入中...
</div>

<div id="faceInfo">
    尚未偵測
</div>

<div id="cameraBox">

    <video id="camera"
           autoplay
           playsinline
           muted>
    </video>

    <canvas id="overlay"></canvas>

    <div class="vline v1"></div>
    <div class="vline v2"></div>

    <div class="hline h1"></div>
    <div class="hline h2"></div>

</div>

<button onclick="startCamera()">開啟前鏡頭</button>
<button onclick="stopCamera()">關閉相機</button>

<script type="module">

import {
    FaceDetector,
    FilesetResolver
}
from "https://unpkg.com/@mediapipe/tasks-vision@0.10.35/vision_bundle.mjs";


let detector = null;
let stream = null;
let running = false;


const video =
    document.getElementById("camera");

const canvas =
    document.getElementById("overlay");

const ctx =
    canvas.getContext("2d");

const statusText =
    document.getElementById("status");

const faceInfo =
    document.getElementById("faceInfo");


/* =========================
   載入 AI
========================= */

async function loadAI() {

    try {

        const resolver =
            await FilesetResolver.forVisionTasks(
                "https://unpkg.com/@mediapipe/tasks-vision@0.10.35/wasm"
            );

        detector =
            await FaceDetector.createFromOptions(
                resolver,
                {
                    baseOptions: {
                        modelAssetPath:
                        "https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/latest/blaze_face_short_range.tflite"
                    },

                    runningMode: "VIDEO",

                    minDetectionConfidence: 0.4
                }
            );

        statusText.innerText =
            "✅ AI 已準備完成";

    }

    catch(error) {

        statusText.innerText =
            "❌ AI 模型載入失敗";

        faceInfo.innerText =
            error.name + "：" + error.message;
    }
}


/* =========================
   開啟相機
========================= */

async function startCamera() {

    if (!detector) {

        alert("AI 還沒載入完成");

        return;
    }

    try {

        stream =
            await navigator.mediaDevices.getUserMedia({
                video: {
                    facingMode: "user"
                },
                audio: false
            });

        video.srcObject = stream;

        await video.play();

        running = true;

        statusText.innerText =
            "📷 相機已開啟";

        detectLoop();

    }

    catch(error) {

        statusText.innerText =
            "相機錯誤";

        faceInfo.innerText =
            error.message;
    }
}


/* =========================
   關閉相機
========================= */

function stopCamera() {

    running = false;

    if (stream) {

        stream.getTracks().forEach(
            track => track.stop()
        );

        stream = null;
    }

    video.srcObject = null;

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    statusText.innerText =
        "相機已關閉";

    faceInfo.innerText =
        "尚未偵測";
}


/* =========================
   人臉偵測
========================= */

function detectLoop() {

    if (!running) {
        return;
    }

    if (video.readyState >= 2) {

        const result =
            detector.detectForVideo(
                video,
                performance.now()
            );

        const displayWidth =
            video.clientWidth;

        const displayHeight =
            video.clientHeight;

        canvas.width =
            displayWidth;

        canvas.height =
            displayHeight;

        ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

        const scaleX =
            displayWidth / video.videoWidth;

        const scaleY =
            displayHeight / video.videoHeight;


        if (result.detections &&
            result.detections.length > 0) {

            faceInfo.innerText =
                "找到人臉：" +
                result.detections.length +
                " 張";

            for (const detection of result.detections) {

                const box =
                    detection.boundingBox;

                const x =
                    box.originX * scaleX;

                const y =
                    box.originY * scaleY;

                const w =
                    box.width * scaleX;

                const h =
                    box.height * scaleY;


                // 綠色人臉框
                ctx.strokeStyle =
                    "lime";

                ctx.lineWidth =
                    4;

                ctx.strokeRect(
                    x,
                    y,
                    w,
                    h
                );


                // 紅色中心點
                const centerX =
                    x + w / 2;

                const centerY =
                    y + h / 2;

                ctx.beginPath();

                ctx.arc(
                    centerX,
                    centerY,
                    8,
                    0,
                    Math.PI * 2
                );

                ctx.fillStyle =
                    "red";

                ctx.fill();
            }

        }

        else {

            faceInfo.innerText =
                "找不到人臉";
        }
    }

    requestAnimationFrame(
        detectLoop
    );
}


window.startCamera =
    startCamera;

window.stopCamera =
    stopCamera;


/* 網頁開啟就先載入 AI */
loadAI();

</script>

</body>
</html>
