<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   user-scalable=no">

    <title>阿策智慧構圖助手</title>

    <style>

        body {
            margin: 0;
            background: black;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        h2 {
            margin: 10px 0;
        }

        #status {
            font-size: 18px;
            margin: 8px;
        }

        #faceInfo {
            font-size: 20px;
            margin: 8px;
            min-height: 30px;
        }

        #cameraBox {
            position: relative;
            width: 100%;
            max-width: 900px;
            margin: auto;
            background: #111;
            overflow: hidden;
        }

        #camera {
            width: 100%;
            display: block;
        }

        #overlay {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        /* 三分法直線 */
        .vline {
            position: absolute;
            top: 0;
            height: 100%;
            width: 2px;
            background: rgba(255,255,255,0.75);
            pointer-events: none;
        }

        .v1 {
            left: 33.33%;
        }

        .v2 {
            left: 66.66%;
        }

        /* 三分法橫線 */
        .hline {
            position: absolute;
            left: 0;
            width: 100%;
            height: 2px;
            background: rgba(255,255,255,0.75);
            pointer-events: none;
        }

        .h1 {
            top: 33.33%;
        }

        .h2 {
            top: 66.66%;
        }

        button {
            font-size: 18px;
            padding: 12px 18px;
            margin: 10px 4px;
            border: none;
            border-radius: 10px;
        }

    </style>
</head>


<body>

<h2>📷 阿策智慧構圖助手</h2>

<div id="status">
    AI 模型載入中...
</div>

<div id="faceInfo">
    尚未偵測
</div>


<div id="cameraBox">

    <video id="camera"
           autoplay
           playsinline
           muted>
    </video>

    <!-- AI 畫人臉框 -->
    <canvas id="overlay"></canvas>

    <!-- 三分法 -->
    <div class="vline v1"></div>
    <div class="vline v2"></div>

    <div class="hline h1"></div>
    <div class="hline h2"></div>

</div>


<button onclick="startCamera()">
    開啟前鏡頭
</button>

<button onclick="stopCamera()">
    關閉相機
</button>


<script type="module">

/* =====================================
   1. 載入 MediaPipe
===================================== */

import {
    FaceDetector,
    FilesetResolver
}
from "https://unpkg.com/@mediapipe/tasks-vision@0.10.35/vision_bundle.mjs";


/* =====================================
   2. 變數
===================================== */

let detector = null;

let stream = null;

let cameraRunning = false;

let lastVideoTime = -1;


/* =====================================
   3. 找到網頁上的元件
===================================== */

const video =
    document.getElementById("camera");

const canvas =
    document.getElementById("overlay");

const ctx =
    canvas.getContext("2d");

const statusText =
    document.getElementById("status");

const faceInfo =
    document.getElementById("faceInfo");


/* =====================================
   4. 載入 AI 模型
===================================== */

async function loadAI() {

    try {

        statusText.innerText =
            "正在載入 MediaPipe...";


        const resolver =
            await FilesetResolver.forVisionTasks(

                "https://unpkg.com/@mediapipe/tasks-vision@0.10.35/wasm"

            );


        statusText.innerText =
            "正在載入人臉模型...";


        detector =
            await FaceDetector.createFromOptions(

                resolver,

                {

                    baseOptions: {

                        modelAssetPath:

                        "https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite"

                    },

                    runningMode:
                        "VIDEO",

                    minDetectionConfidence:
                        0.4

                }

            );


        statusText.innerText =
            "✅ AI 已準備完成";

    }

    catch(error) {

        statusText.innerText =
            "❌ AI 模型載入失敗";

        faceInfo.innerText =
            error.name +
            "：" +
            error.message;

        console.error(error);

    }

}


/* =====================================
   5. 開啟前鏡頭
===================================== */

async function startCamera() {

    if (detector == null) {

        alert(
            "AI 還沒準備完成，請稍等一下"
        );

        return;

    }


    try {

        /* 如果相機已經開過，先關閉 */

        if (stream) {

            stream
                .getTracks()
                .forEach(
                    track => track.stop()
                );

        }


        stream =
            await navigator.mediaDevices
                .getUserMedia({

                    video: {

                        facingMode:
                            "user"

                    },

                    audio:
                        false

                });


        video.srcObject =
            stream;


        await video.play();


        cameraRunning =
            true;


        lastVideoTime =
            -1;


        statusText.innerText =
            "📷 相機已開啟";


        requestAnimationFrame(
            detectLoop
        );

    }

    catch(error) {

        statusText.innerText =
            "❌ 相機開啟失敗";

        faceInfo.innerText =
            error.name +
            "：" +
            error.message;

    }

}


/* =====================================
   6. 關閉相機
===================================== */

function stopCamera() {

    cameraRunning =
        false;


    if (stream) {

        stream
            .getTracks()
            .forEach(
                track => track.stop()
            );

        stream =
            null;

    }


    video.srcObject =
        null;


    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    statusText.innerText =
        "相機已關閉";


    faceInfo.innerText =
        "尚未偵測";

}


/* =====================================
   7. AI 人臉偵測
===================================== */

function detectLoop() {

    if (!cameraRunning) {

        return;

    }


    if (
        video.readyState >= 2 &&
        video.videoWidth > 0 &&
        video.videoHeight > 0
    ) {

        /*
        只有影片真的進入下一個畫面
        才重新做 AI 偵測
        */

        if (
            video.currentTime !==
            lastVideoTime
        ) {

            lastVideoTime =
                video.currentTime;


            try {

                const result =
                    detector.detectForVideo(

                        video,

                        performance.now()

                    );


                drawResult(
                    result
                );

            }

            catch(error) {

                faceInfo.innerText =
                    "偵測錯誤：" +
                    error.message;

            }

        }

    }


    requestAnimationFrame(
        detectLoop
    );

}


/* =====================================
   8. 畫人臉框
===================================== */

function drawResult(result) {

    /*
    手機畫面實際顯示的大小
    */

    const displayWidth =
        video.clientWidth;

    const displayHeight =
        video.clientHeight;


    /*
    Canvas 跟手機畫面一樣大
    */

    if (
        canvas.width !==
        displayWidth
    ) {

        canvas.width =
            displayWidth;

    }


    if (
        canvas.height !==
        displayHeight
    ) {

        canvas.height =
            displayHeight;

    }


    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /*
    AI 使用的是原始影片解析度，
    所以要換算成手機顯示尺寸
    */

    const scaleX =
        displayWidth /
        video.videoWidth;


    const scaleY =
        displayHeight /
        video.videoHeight;


    /* 沒找到臉 */

    if (
        !result.detections ||
        result.detections.length === 0
    ) {

        faceInfo.innerText =
            "找不到人臉";

        return;

    }


    /* 找到臉 */

    faceInfo.innerText =
        "找到人臉：" +
        result.detections.length +
        " 張";


    for (
        const detection
        of result.detections
    ) {

        const box =
            detection.boundingBox;


        const x =
            box.originX *
            scaleX;


        const y =
            box.originY *
            scaleY;


        const w =
            box.width *
            scaleX;


        const h =
            box.height *
            scaleY;


        /* -----------------
           綠色人臉框
        ------------------ */

        ctx.strokeStyle =
            "lime";


        ctx.lineWidth =
            4;


        ctx.strokeRect(
            x,
            y,
            w,
            h
        );


        /* -----------------
           計算人臉中心
        ------------------ */

        const centerX =
            x +
            w / 2;


        const centerY =
            y +
            h / 2;


        /* -----------------
           紅色中心點
        ------------------ */

        ctx.beginPath();


        ctx.arc(
            centerX,
            centerY,
            8,
            0,
            Math.PI * 2
        );


        ctx.fillStyle =
            "red";


        ctx.fill();

    }

}


/* =====================================
   9. 讓 HTML 按鈕能呼叫
===================================== */

window.startCamera =
    startCamera;


window.stopCamera =
    stopCamera;


/* =====================================
   10. 網頁打開後載入 AI
===================================== */

loadAI();

</script>

</body>

</html>
