<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no">

<title>AI 構圖助手 V6.0</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    color:#fff;
    font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;
}

body{
    display:flex;
    flex-direction:column;
}

/* =========================
   CAMERA
========================= */

#cameraArea{
    position:relative;
    width:100%;
    flex:1;
    min-height:0;
    background:#111;
    overflow:hidden;
}

#video{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
}

#overlay{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
    z-index:5;
}

/* =========================
   INFO
========================= */

#info{
    position:absolute;
    top:16px;
    left:15px;
    width:260px;
    padding:15px 17px;
    border-radius:20px;
    background:rgba(0,0,0,.72);
    backdrop-filter:blur(6px);
    z-index:10;
}

#modeTitle{
    font-size:14px;
    opacity:.70;
    margin-bottom:5px;
}

#composition{
    font-size:25px;
    font-weight:800;
}

#desc{
    margin-top:7px;
    font-size:14px;
    line-height:1.45;
    opacity:.85;
}

#message{
    position:absolute;
    left:50%;
    bottom:15px;
    transform:translateX(-50%);
    width:92%;
    padding:13px;
    border-radius:18px;
    background:rgba(0,0,0,.78);
    text-align:center;
    font-size:15px;
    font-weight:700;
    z-index:10;
}

#version{
    position:absolute;
    left:8px;
    bottom:4px;
    font-size:11px;
    opacity:.65;
    z-index:20;
}

/* =========================
   CONTROLS
========================= */

#controls{
    flex:0 0 auto;
    padding:
    10px
    12px
    calc(12px + env(safe-area-inset-bottom));
    background:#000;
}

/* =========================
   MODES
========================= */

#modeRow{
    display:flex;
    gap:7px;
    overflow-x:auto;
    padding-bottom:9px;
    scrollbar-width:none;
}

#modeRow::-webkit-scrollbar{
    display:none;
}

.modeBtn{
    flex:0 0 auto;
    min-width:73px;
    padding:9px 9px;
    border:none;
    border-radius:18px;
    background:#242424;
    color:#fff;
    font-size:13px;
    font-weight:700;
}

.modeBtn.active{
    background:#fff;
    color:#000;
}

.modeIcon{
    display:block;
    font-size:20px;
    margin-bottom:3px;
}

/* =========================
   COMPOSITION CHIPS
========================= */

#compositionRow{
    display:flex;
    gap:7px;
    overflow-x:auto;
    padding-bottom:9px;
    scrollbar-width:none;
}

#compositionRow::-webkit-scrollbar{
    display:none;
}

.compBtn{
    flex:0 0 auto;
    padding:8px 13px;
    border-radius:18px;
    border:1px solid #444;
    background:#151515;
    color:#ddd;
    font-size:13px;
}

.compBtn.active{
    border-color:#ffd400;
    color:#ffd400;
}

/* =========================
   AI BUTTON
========================= */

#aiButton{
    width:100%;
    padding:13px;
    border:none;
    border-radius:25px;
    background:#fff;
    color:#000;
    font-size:17px;
    font-weight:800;
    margin-bottom:9px;
}

/* =========================
   CAMERA BUTTONS
========================= */

#bottomRow{
    display:flex;
    align-items:center;
    gap:8px;
}

.cameraBtn{
    flex:0 0 auto;
    padding:9px 13px;
    background:#292929;
    color:#fff;
    border:none;
    border-radius:20px;
    font-size:13px;
}

#zoomArea{
    flex:1;
    display:flex;
    align-items:center;

}

    flex:1;

}

#zoomText{

    min-width:34px;
}

#status{
    margin-top:7px;
    text-align:center;
    font-size:11px;
    opacity:.40;
}

</style>
</head>

========================= -->

<!-- =========================
     CONTROLS

        </button>

            <input

            min="1"
            max="3"
            step=".1"
            value="1">

                1.0×
            </span>

        </div>

    </div>


    <div id="status">
        V6.0｜六大拍攝模式架構版
    </div>

</div>


<script>

/* =========================================================

 AI 構圖助手 V6.0

 六大拍攝模式架構版

 模式：

 1. 風景
 2. 街景
 3. 人像
 4. 夜景
 5. 室內
 6. 美食


 V6.0 目標：

 不再把道路消失點當成整個 App 核心。

 改為：

 拍攝模式
 ↓
 構圖知識庫
 ↓
 場景分析
 ↓
 選擇構圖
 ↓
 畫輔助線
 ↓
 未來加入手機移動導航


 V6.0：

 目前先完成：

 ✓ 六大模式
 ✓ 每個模式獨立構圖法
 ✓ 構圖模板
 ✓ 輔助線
 ✓ 相機
 ✓ 前後鏡頭
 ✓ Zoom

 下一階段：

 V6.1
 加入場景辨識與自動構圖選擇

========================================================= */


/* =========================================================
 DOM
========================================================= */

var video =
document.getElementById("video");

var overlay =
document.getElementById("overlay");

var ctx =
overlay.getContext("2d");

var cameraArea =
document.getElementById("cameraArea");

var modeTitle =
document.getElementById("modeTitle");

var compositionEl =
document.getElementById("composition");

var descEl =
document.getElementById("desc");

var messageEl =
document.getElementById("message");

var compositionRow =
document.getElementById("compositionRow");

var zoom =
document.getElementById("zoom");

var zoomText =
document.getElementById("zoomText");


/* =========================================================
 STATE
========================================================= */

var stream = null;

var facing =
"environment";

var currentMode =
"landscape";

var currentComposition =
"thirds";


/* =========================================================
 COMPOSITION DATABASE
========================================================= */

var modeDatabase = {


/* =========================

landscape:{

    name:"風景",

    default:"thirds",

    compositions:[

        {

        },

        },

        {

        }

},


/* =========================

========================= */

street:{

    name:"街景",

    default:"leading",

    compositions:[

        {
            id:"leading",
            name:"引導線",
            desc:"利用道路與建築線條把視線帶向主體"
        },

        {
            id:"perspective",

        },

portrait:{

        },

            desc:"保留頭頂與腳部空間，避免關節位置被裁切"
        },

night:{

        }

},


/* =========================

========================= */

indoor:{

    icon:"🏠",

    name:"室內",

    default:"symmetry",

    compositions:[

        {
            id:"symmetry",

            desc:"保持左右平衡，適合室內空間與建築"
        },

        {

food:{

        },

        }

}

};


/* =========================================================
 CAMERA
========================================================= */

async function startCamera(){

    try{

        messageEl.innerText =
        "📷 正在開啟相機...";


        if(stream){

            stream
            .getTracks()
            .forEach(
                function(track){
                    track.stop();
                }
            );

        }


        if(
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia
        ){

            throw new Error(
                "getUserMedia 不支援"
            );

        }


        stream =
        await navigator.mediaDevices
        .getUserMedia({

            video:{

                facingMode:{
                    ideal:facing
                },

                width:{
                    ideal:1280
                },

                height:{
                    ideal:720
                }

            },

            audio:false

        });


        video.srcObject =
        stream;


        await video.play();


        resizeOverlay();


        messageEl.innerText =
        "✨ 選擇拍攝模式，再按 AI 構圖建議";

    }

    catch(error){

        console.log(
            "Camera error:",
            error
        );


        var name =
        error && error.name
        ?
        error.name
        :
        "UnknownError";


        if(name==="NotAllowedError"){

            messageEl.innerText =
            "❌ 請允許網站使用相機";

        }

        else if(name==="NotFoundError"){

            messageEl.innerText =
            "❌ 找不到可用相機";

        }

        else if(name==="NotReadableError"){

            messageEl.innerText =
            "❌ 相機可能被其他程式占用";

        }

        else{

            messageEl.innerText =
            "❌ 相機錯誤："+name;

        }

    }

}


async function changeCamera(mode){

    facing =
    mode;

    await startCamera();

}


/* =========================================================
 MODE
========================================================= */

function selectMode(
    mode,
    button
){

    currentMode =
    mode;


    var buttons =
    document.querySelectorAll(
        ".modeBtn"
    );


    buttons.forEach(
        function(btn){

            btn.classList
            .remove("active");

        }
    );


    if(button){

        button.classList
        .add("active");

    }


    var data =
    modeDatabase[mode];


    currentComposition =
    data.default;


    modeTitle.innerText =
    data.icon+
    " "+
    data.name+
    "模式";


    buildCompositionButtons();


    selectComposition(
        currentComposition
    );


    messageEl.innerText =
    "✨ "+
    data.name+
    "模式｜按 AI 取得構圖建議";

}


/* =========================================================
 BUILD COMPOSITION BUTTONS
========================================================= */

function buildCompositionButtons(){

    compositionRow.innerHTML =
    "";


    var data =
    modeDatabase[currentMode];


    data.compositions
    .forEach(
        function(comp){

            var button =
            document.createElement(
                "button"
            );


            button.className =
            "compBtn";


            button.innerText =
            comp.name;


            button.dataset.id =
            comp.id;


            button.onclick =
            function(){

                selectComposition(
                    comp.id
                );

            };


            compositionRow
            .appendChild(
                button
            );

        }
    );

}


/* =========================================================
 SELECT COMPOSITION
========================================================= */

function selectComposition(id){

    currentComposition =
    id;


    var data =
    modeDatabase[currentMode];


    var comp =
    data.compositions.find(
        function(c){
            return c.id===id;
        }
    );


    if(!comp){
        return;
    }


    compositionEl.innerText =
    comp.name;


    descEl.innerText =
    comp.desc;


    var buttons =
    document.querySelectorAll(
        ".compBtn"
    );


    buttons.forEach(
        function(btn){

            if(
                btn.dataset.id===id
            ){

                btn.classList
                .add("active");

            }

            else{

                btn.classList
                .remove("active");

            }

        }
    );


    drawComposition();

}


/* =========================================================
 AI

 V6.0：

 這裡先建立「決策入口」。

 現在會依照模式選擇預設推薦。

 V6.1 開始，
 這裡會接真正的畫面分析。
========================================================= */

function runAI(){

    var data =
    modeDatabase[currentMode];


    var recommendation =
    data.default;


    /*
    V6.0 先採模式預設構圖。

    未來 V6.1：

    analyzeScene()
        ↓
    detectSubject()
        ↓
    detectLines()
        ↓
    detectHorizon()
        ↓
    compositionDecision()
    */


    selectComposition(
        recommendation
    );


    var comp =
    data.compositions.find(
        function(c){
            return c.id===
            recommendation;
        }
    );


    messageEl.innerText =
    "✨ AI 建議："+
    comp.name+
    "｜依照黃色輔助線調整畫面";

}


/* =========================================================
 DRAW
========================================================= */

function clearOverlay(){

    ctx.clearRect(
        0,
        0,
        overlay.clientWidth,
        overlay.clientHeight
    );

}


/* =========================================================
 COMMON DRAW SETTINGS
========================================================= */

function setupGuide(){

    ctx.strokeStyle =
    "#ffd400";

    ctx.fillStyle =
    "#2cff67";

    ctx.lineWidth =
    2.5;

    ctx.setLineDash([]);

}


/* =========================================================
 THIRDS
========================================================= */

function drawThirds(){

    var w =
    overlay.clientWidth;

    var h =
    overlay.clientHeight;


    setupGuide();


    ctx.beginPath();


    ctx.moveTo(
        w/3,
        0
    );

    ctx.lineTo(
        w/3,
        h
    );


    ctx.moveTo(
        w*2/3,
        0
    );

    ctx.lineTo(
        w*2/3,
        h
    );


    ctx.moveTo(
        0,
        h/3
    );

    ctx.lineTo(
        w,
        h/3
    );


    ctx.moveTo(
        0,
        h*2/3
    );

    ctx.lineTo(
        w,
        h*2/3
    );


    ctx.stroke();


    drawTarget(
        w/3,
        h/3
    );

    drawTarget(
        w*2/3,
        h/3
    );

    drawTarget(
        w/3,
        h*2/3
    );

    drawTarget(
        w*2/3,
        h*2/3
    );

}


/* =========================================================
 GOLDEN RATIO
========================================================= */

function drawGolden(){

    var w =
    overlay.clientWidth;

    var h =
    overlay.clientHeight;


    setupGuide();


    var x1 =
    w*.382;

    var x2 =
    w*.618;

    var y1 =
    h*.382;

    var y2 =
    h*.618;


    ctx.beginPath();


    ctx.moveTo(
        x1,
        0
    );

    ctx.lineTo(
        x1,
        h
    );


    ctx.moveTo(
        x2,
        0
    );

    ctx.lineTo(
        x2,
        h
    );


    ctx.moveTo(
        0,
        y1
    );

    ctx.lineTo(
        w,
        y1
    );


    ctx.moveTo(
        0,
        y2
    );

    ctx.lineTo(
        w,
        y2
    );


    ctx.stroke();


    drawTarget(
        x1,
        y1
    );

    drawTarget(
        x2,
        y1
    );

}


/* =========================================================
 CENTER
========================================================= */

function drawCenter(){

    var w =
    overlay.clientWidth;

    var h =
    overlay.clientHeight;


    setupGuide();


    ctx.beginPath();


    ctx.moveTo(
        w/2,
        0
    );

    ctx.lineTo(
        w/2,
        h
    );


    ctx.moveTo(
        0,
        h/2
    );

    ctx.lineTo(
        w,
        h/2
    );


    ctx.stroke();


    drawTarget(
        w/2,
        h/2
    );

}


/* =========================================================
 SYMMETRY
========================================================= */

function drawSymmetry(){

    var w =
    overlay.clientWidth;

    var h =
    overlay.clientHeight;


    setupGuide();


    ctx.lineWidth =
    3;


    ctx.beginPath();

    ctx.moveTo(
        w/2,
        0
    );

    ctx.lineTo(
        w/2,
        h
    );

    ctx.stroke();


    ctx.setLineDash(
        [8,8]
    );


    ctx.beginPath();

    ctx.moveTo(
        w*.20,
        h*.20
    );

    ctx.lineTo(
        w*.20,
        h*.80
    );


    ctx.moveTo(
        w*.80,
        h*.20
    );

    ctx.lineTo(
        w*.80,
        h*.80
    );

    ctx.stroke();


    ctx.setLineDash([]);

}


/* =========================================================
 LEADING LINES
========================================================= */

function drawLeading(){

    var w =
    overlay.clientWidth;

    var h =
    overlay.clientHeight;


    setupGuide();


    var targetX =
    w*.50;

    var targetY =
    h*.40;


    ctx.lineWidth =
    4;


    ctx.beginPath();


    ctx.moveTo(
        w*.08,
        h
    );

    ctx.lineTo(
        targetX,
        targetY
    );


    ctx.moveTo(
        w*.92,
        h
    );

    ctx.lineTo(
        targetX,
        targetY
    );


    ctx.stroke();


    drawTarget(
        targetX,
        targetY
    );

}


/* =========================================================
 PERSPECTIVE
========================================================= */

function drawPerspective(){

    var w =
    overlay.clientWidth;

    var h =
    overlay.clientHeight;


    setupGuide();


    var vx =
    w*.50;

    var vy =
    h*.42;


    ctx.lineWidth =
    3;


    var starts = [

        [0,h],
        [w*.25,h],
        [w*.75,h],
        [w,h],

        [0,h*.65],
        [w,h*.65]

    ];


    ctx.beginPath();


    starts.forEach(
        function(p){

            ctx.moveTo(
                p[0],
                p[1]
            );

            ctx.lineTo(
                vx,
                vy
            );

        }
    );


    ctx.stroke();


    drawTarget(
        vx,
        vy
    );

}


/* =========================================================
 DIAGONAL
========================================================= */

function drawDiagonal(){

    var w =
    overlay.clientWidth;

    var h =
    overlay.clientHeight;


    setupGuide();


    ctx.lineWidth =
    3;


    ctx.beginPath();

    ctx.moveTo(
        0,
        h
    );

    ctx.lineTo(
        w,
        0
    );

    ctx.stroke();


    drawTarget(
        w*.62,

    );

}


/* =========================================================
 FRAME
========================================================= */

function drawFrame(){

    var w =
    overlay.clientWidth;

    var h =
    overlay.clientHeight;


    setupGuide();


    ctx.lineWidth =
    3;


    var marginX =
    w*.12;

    var marginY =
    h*.13;


    ctx.strokeRect(
        marginX,
        marginY,
        w-marginX*2,
        h-marginY*2
    );


    drawTarget(
        w/2,
        h/2
    );

}

 PORTRAIT THIRDS

function drawPortraitThirds(){

        h*.085,

/* =========================================================
 CENTER PORTRAIT
========================================================= */

function drawCenterPortrait(){

    var w =
    overlay.clientWidth;

    overlay.clientHeight;

    ctx.strokeStyle =
    "#2cff67";

    ctx.lineWidth =
    3;


    ctx.beginPath();

        w*.50,
        h*.31,
        w*.11,
        h*.09,
        0,
        0,
        Math.PI*2
    );

    ctx.stroke();


    ctx.beginPath();

    ctx.moveTo(
        w*.50,
        h*.40
    );

    ctx.lineTo(
        w*.50,

    );

/* =========================================================
 HEADROOM
========================================================= */

function drawHeadroom(){

    var w =
    overlay.clientWidth;

    var h =
    overlay.clientHeight;


    setupGuide();


    ctx.setLineDash(
        [8,7]
    );


    ctx.beginPath();

    ctx.moveTo(
        0,
        h*.28
    );

    ctx.lineTo(
        w,
        h*.28
    );

    ctx.stroke();


    ctx.setLineDash([]);


    ctx.strokeStyle =
    "#2cff67";

    ctx.strokeRect(
        w*.18,
        h*.30,
        w*.25,
        h*.43
    );


    /* 視線方向 */

    ctx.beginPath();

    ctx.moveTo(
        w*.43,
        h*.38
    );

    ctx.lineTo(
        w*.75,
        h*.38
    );

    ctx.stroke();


    drawArrowHead(
        w*.75,
        h*.38,
        "right"
    );

}

 FULL BODY

    ctx.moveTo(

        h*.10
    );

        h*.10
    );


    ctx.moveTo(
        0,

    );

        h*.90
    );

}

 ENVIRONMENT PORTRAIT

 REFLECTION

    );

 FOOD CENTER

 FOOD THIRDS

/* =========================================================
 FOOD DIAGONAL
========================================================= */

function drawFoodDiagonal(){

    var w =
    overlay.clientWidth;

    var h =
    overlay.clientHeight;


    setupGuide();


    ctx.lineWidth =
    3;


    ctx.beginPath();

    ctx.moveTo(
        w*.10,
        h*.82
    );

    ctx.lineTo(
        w*.90,
        h*.18
    );

    var points = [

        [w*.25,h*.70],

            ctx.beginPath();

/* =========================================================
 FOOD TOP
========================================================= */

function drawFoodTop(){

    var w =
    overlay.clientWidth;

    overlay.clientHeight;

/* =========================================================
 FILL FRAME
========================================================= */

function drawFill(){

    overlay.clientWidth;

    var h =
    overlay.clientHeight;


    setupGuide();


    ctx.strokeStyle =
    "#2cff67";

    ctx.lineWidth =

        w*.06,

    "bold 15px -apple-system,Arial";

        "靠近主體填滿畫面",

    );

}


/* =========================================================
 TARGET
========================================================= */

function drawTarget(x,y){

    ctx.save();


    ctx.strokeStyle =
    "#2cff67";

    ctx.fillStyle =
    "#2cff67";

    ctx.lineWidth =
    3;


    ctx.beginPath();

    ctx.arc(
        x,
        y,
        12,
        0,
        Math.PI*2
    );

    ctx.stroke();


    ctx.beginPath();

    ctx.arc(
        x,
        y,
        4,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.restore();

}


/* =========================================================
 ARROW
========================================================= */

function drawArrowHead(
    x,
    y,
    direction
){

    ctx.save();


    ctx.fillStyle =
    "#2cff67";


    ctx.beginPath();


    if(direction==="right"){

        ctx.moveTo(
            x,
            y
        );

        ctx.lineTo(
            x-13,
            y-8
        );

        ctx.lineTo(
            x-13,
            y+8
        );

    }


    ctx.closePath();

    ctx.fill();


    ctx.restore();

}

 DRAW SELECTED COMPOSITION

/* =========================================================
 RESIZE
========================================================= */

function resizeOverlay(){

    var rect =
    overlay.getBoundingClientRect();


    var dpr =
    window.devicePixelRatio ||
    1;


    overlay.width =
    Math.round(
        rect.width*dpr
    );


    overlay.height =
    Math.round(
        rect.height*dpr
    );


    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );


    drawComposition();

}


window.addEventListener(
    "resize",
    resizeOverlay
);


/* =========================================================
 ZOOM
========================================================= */

zoom.addEventListener(
    "input",
    async function(){

        var value =
        Number(
            this.value
        );


        zoomText.innerText =
        value.toFixed(1)+
        "×";


        if(!stream){
            return;
        }


        var tracks =
        stream.getVideoTracks();


        if(
            tracks.length===0
        ){
            return;
        }


        var track =
        tracks[0];


        if(
            !track.getCapabilities
        ){
            return;
        }


        var capabilities =
        track.getCapabilities();


        if(
            !capabilities.zoom
        ){
            return;
        }


        try{

            var actualZoom =
            Math.max(
                capabilities.zoom.min,
                Math.min(
                    capabilities.zoom.max,
                    value
                )
            );


            await track.applyConstraints({

                advanced:[
                    {
                        zoom:
                        actualZoom
                    }
                ]

            });

        }

        catch(error){

            console.log(
                "Zoom unsupported",
                error
            );

        }

    }
);


/* =========================================================
 INIT
========================================================= */

function init(){

    buildCompositionButtons();


    selectComposition(
        modeDatabase[
            currentMode
        ].default
    );


    resizeOverlay();


    startCamera();

}


init();
