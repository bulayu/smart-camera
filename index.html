<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>阿策構圖助手 V7.0</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#fff}#app{position:fixed;inset:0;background:#000}video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#111}canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.top{position:absolute;top:max(12px,env(safe-area-inset-top));left:18px;right:18px;height:58px;border-radius:28px;background:rgba(20,20,20,.72);backdrop-filter:blur(10px);display:flex;align-items:center;padding:0 18px;gap:12px;font-weight:800;z-index:5}.top .sep{opacity:.35}.top #state{margin-left:auto;color:#ffd400;font-size:14px}.hint{position:absolute;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:5;background:rgba(20,20,20,.82);padding:10px 18px;border-radius:24px;font-weight:800;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis}.bar{position:absolute;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:6;background:rgba(28,28,28,.86);border:1px solid rgba(255,255,255,.12);border-radius:30px;padding:7px;display:flex;gap:5px;align-items:center;box-shadow:0 8px 25px #0008}.bar button{border:0;border-radius:22px;background:#333;color:#fff;font-weight:800;font-size:15px;padding:11px 14px;white-space:nowrap}.bar button.primary{background:#fff;color:#222}.bar button:active{transform:scale(.96)}#zoomBtn{min-width:46px}.version{position:absolute;left:12px;bottom:calc(76px + env(safe-area-inset-bottom));font-size:12px;opacity:.55;z-index:4}.toast{position:absolute;left:50%;top:90px;transform:translateX(-50%);background:#b3261e;padding:8px 13px;border-radius:18px;z-index:20;display:none;font-size:13px}.legend{position:absolute;right:14px;top:84px;z-index:4;font-size:12px;background:#0008;border-radius:16px;padding:7px 10px}.legend b{color:#39e67d}.legend i{font-style:normal;color:white}@media(orientation:landscape){.bar{bottom:14px}.hint{bottom:76px}.version{bottom:62px}.top{height:50px}}
</style>
</head><body><div id="app">
<video id="video" autoplay playsinline muted></video><canvas id="overlay"></canvas>
<div class="top"><span id="mode">🤖 AI</span><span class="sep">|</span><span id="composition">等待分析</span><span id="state">● 待機</span></div>
<div class="legend"><i>白框＝目前</i>　<b>綠框＝建議</b></div>
<div id="hint" class="hint">按「✨ 智慧構圖」開始</div>
<div class="version">V7.0</div><div id="toast" class="toast"></div>
<div class="bar"><button id="modeBtn" class="primary">⚙️ 自動</button><button id="smartBtn">✨ 智慧構圖</button><button id="cameraBtn">📷 後鏡</button><button id="zoomBtn">1×</button></div>
</div>
<script type="module">
import {FaceDetector,FilesetResolver} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22-rc.20250304";
const video=document.querySelector('#video'),canvas=document.querySelector('#overlay'),ctx=canvas.getContext('2d');
const hint=document.querySelector('#hint'),modeEl=document.querySelector('#mode'),compEl=document.querySelector('#composition'),stateEl=document.querySelector('#state');
const cameraBtn=document.querySelector('#cameraBtn'),smartBtn=document.querySelector('#smartBtn'),zoomBtn=document.querySelector('#zoomBtn'),toast=document.querySelector('#toast');
let stream=null,facing='environment',zoom=1,detector=null,running=false,lastVideoTime=-1,lastDetect=0,tracked=null,sceneBox=null,targetBox=null,composition='';
let analysisCanvas=document.createElement('canvas'),ac=analysisCanvas.getContext('2d',{willReadFrequently:true});
function msg(s){hint.textContent=s} function showError(s){toast.textContent=s;toast.style.display='block';setTimeout(()=>toast.style.display='none',3500)}
function resize(){const d=Math.min(devicePixelRatio||1,2);canvas.width=innerWidth*d;canvas.height=innerHeight*d;canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';ctx.setTransform(d,0,0,d,0,0)} addEventListener('resize',resize);resize();
async function initAI(){try{const vision=await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22-rc.20250304/wasm');detector=await FaceDetector.createFromOptions(vision,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/latest/blaze_face_short_range.tflite',delegate:'GPU'},runningMode:'VIDEO',minDetectionConfidence:.45});}catch(e){console.warn(e)}}
async function startCamera(nextFacing=facing){facing=nextFacing; running=false; if(stream){stream.getTracks().forEach(t=>t.stop());stream=null} video.srcObject=null; await new Promise(r=>setTimeout(r,120));
 try{stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:facing},width:{ideal:1280},height:{ideal:720}}});video.srcObject=stream;await video.play();cameraBtn.textContent=facing==='environment'?'📷 後鏡':'🤳 前鏡';zoom=1;zoomBtn.textContent='1×';resetAnalysis();running=true;requestAnimationFrame(loop)}catch(e){console.error(e);showError('相機開啟失敗，請確認 Safari 相機權限與 HTTPS');msg('無法開啟相機')}}
function resetAnalysis(){tracked=null;sceneBox=null;targetBox=null;composition='';compEl.textContent='等待分析';stateEl.textContent='● 待機';clear()}
cameraBtn.onclick=async()=>{stateEl.textContent='● 切換鏡頭';msg('正在切換鏡頭…');await startCamera(facing==='environment'?'user':'environment');msg('按「✨ 智慧構圖」開始')};
zoomBtn.onclick=async()=>{zoom=zoom>=3?1:zoom+.5;zoomBtn.textContent=zoom.toFixed(zoom%1?1:0)+'×';const track=stream?.getVideoTracks()[0],caps=track?.getCapabilities?.();if(caps?.zoom){const z=Math.min(caps.zoom.max,Math.max(caps.zoom.min,zoom));try{await track.applyConstraints({advanced:[{zoom:z}]})}catch{}}else video.style.transform=`scale(${zoom})`;};
function clear(){ctx.clearRect(0,0,innerWidth,innerHeight)}
function videoRectToScreen(b){const vw=video.videoWidth,vh=video.videoHeight,sw=innerWidth,sh=innerHeight;if(!vw||!vh)return null;const s=Math.max(sw/vw,sh/vh),rw=vw*s,rh=vh*s,cx=(rw-sw)/2,cy=(rh-sh)/2;return{x:b.x*s-cx,y:b.y*s-cy,w:b.width*s,h:b.height*s}}
function smooth(a,b,k=.25){if(!a)return b;return{x:a.x+(b.x-a.x)*k,y:a.y+(b.y-a.y)*k,w:a.w+(b.w-a.w)*k,h:a.h+(b.h-a.h)*k}}
function drawRounded(x,y,w,h,r,color,dash=[]){ctx.save();ctx.strokeStyle=color;ctx.lineWidth=3;ctx.setLineDash(dash);ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.stroke();ctx.restore()}
function draw(){clear();if(!targetBox)return;drawRounded(targetBox.x,targetBox.y,targetBox.w,targetBox.h,18,'#39e67d',[10,7]);if(sceneBox)drawRounded(sceneBox.x,sceneBox.y,sceneBox.w,sceneBox.h,14,'white');}
function center(b){return{x:b.x+b.w/2,y:b.y+b.h/2}}
function navigation(){if(!sceneBox||!targetBox)return;const a=center(sceneBox),b=center(targetBox),dx=b.x-a.x,dy=b.y-a.y,tolX=Math.max(26,targetBox.w*.22),tolY=Math.max(26,targetBox.h*.22);const okX=Math.abs(dx)<tolX,okY=Math.abs(dy)<tolY;const sizeOK=Math.abs(sceneBox.w-targetBox.w)<targetBox.w*.45;
 if(okX&&okY&&sizeOK){stateEl.textContent='✓ 到位';msg('✓ 構圖完成｜可拍照');return}stateEl.textContent='● 導航中';let s=[];if(!okX)s.push(dx>0?'→ 往右':'← 往左');if(!okY)s.push(dy>0?'↓ 往下':'↑ 往上');if(!sizeOK)s.push(sceneBox.w<targetBox.w?'靠近一點':'退後一點');msg(s.join('　')||'微調位置')}
function choosePortraitTarget(face){const w=innerWidth,h=innerHeight,cx=face.x+face.w/2;const side=cx<w/2?'left':'right';const tw=Math.min(w*.30,face.w*1.15),th=Math.min(h*.30,face.h*1.35);const tx=side==='left'?w*.67-tw/2:w*.33-tw/2;return{x:tx,y:h*.30-th/2,w:tw,h:th}}
function analyzeScene(){analysisCanvas.width=96;analysisCanvas.height=128;ac.drawImage(video,0,0,96,128);const im=ac.getImageData(0,0,96,128).data;let sx=0,sy=0,wt=0;for(let y=2;y<126;y+=2)for(let x=2;x<94;x+=2){let i=(y*96+x)*4,ix=(y*96+x+1)*4,iy=((y+1)*96+x)*4;let l=.299*im[i]+.587*im[i+1]+.114*im[i+2],lx=.299*im[ix]+.587*im[ix+1]+.114*im[ix+2],ly=.299*im[iy]+.587*im[iy+1]+.114*im[iy+2],g=Math.abs(l-lx)+Math.abs(l-ly);if(g>28){sx+=x*g;sy+=y*g;wt+=g}}let nx=wt?sx/wt/96:.5,ny=wt?sy/wt/128:.5;nx=Math.max(.2,Math.min(.8,nx));ny=Math.max(.25,Math.min(.75,ny));const w=innerWidth,h=innerHeight,bw=w*.25,bh=h*.18;sceneBox={x:nx*w-bw/2,y:ny*h-bh/2,w:bw,h:bh};
 const thirds=[{x:w/3,y:h/3},{x:2*w/3,y:h/3},{x:w/3,y:2*h/3},{x:2*w/3,y:2*h/3},{x:w/2,y:h/2}];let best=thirds[0],bd=1e9;for(const p of thirds){const d=(p.x-(nx*w))**2+(p.y-(ny*h))**2;if(d<bd){bd=d;best=p}}targetBox={x:best.x-bw/2,y:best.y-bh/2,w:bw,h:bh};composition=(best.x===w/2)?'中央構圖':'三分構圖';modeEl.textContent='🏞️ 風景';compEl.textContent=composition;stateEl.textContent='● 已分析';}
smartBtn.onclick=()=>{resetAnalysis();stateEl.textContent='● AI分析';msg('正在分析畫面…');setTimeout(()=>{if(tracked){sceneBox={...tracked};targetBox=choosePortraitTarget(tracked);modeEl.textContent='👤 人像';compEl.textContent='環境人像';stateEl.textContent='● 已分析';}else analyzeScene();draw();navigation()},250)};
async function loop(t){if(!running)return;if(video.readyState>=2&&detector&&video.currentTime!==lastVideoTime&&t-lastDetect>90){lastVideoTime=video.currentTime;lastDetect=t;try{const r=detector.detectForVideo(video,performance.now());if(r.detections?.length){const b=r.detections[0].boundingBox,s=videoRectToScreen({x:b.originX,y:b.originY,width:b.width,height:b.height});if(s){const pad=Math.max(s.w,s.h)*.22;tracked=smooth(tracked,{x:s.x-pad,y:s.y-pad,w:s.w+pad*2,h:s.h+pad*2},.28);if(composition==='環境人像'){sceneBox={...tracked};targetBox=choosePortraitTarget(tracked)}}}else tracked=null}catch(e){}}
 if(targetBox){draw();navigation()}requestAnimationFrame(loop)}
await Promise.all([initAI(),startCamera('environment')]);
</script></body></html>
