<!DOCTYPE html>
<html lang="zh-TW">
<head>

content="width=device-width,
initial-scale=1,

<title>構圖導航 V6.2</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    color:#fff;
    font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;
}

body{
    display:flex;
    flex-direction:column;
}

/* =========================
   CAMERA
========================= */

#cameraArea{
    position:relative;
    width:100%;
    flex:1;
    min-height:0;
    overflow:hidden;
    background:#111;
}

#video{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
}

#overlay{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
    z-index:5;
}

/* =========================
   INFO
========================= */

#info{
    position:absolute;
    top:14px;
    left:14px;
    width:265px;
    padding:13px 16px;
    border-radius:18px;
    background:rgba(0,0,0,.72);
    backdrop-filter:blur(7px);
    z-index:10;
}

#modeTitle{
    font-size:13px;
    opacity:.72;
    margin-bottom:4px;
}

#composition{
    font-size:23px;
    font-weight:800;
}

#desc{
    margin-top:5px;
    font-size:13px;
    line-height:1.45;
    opacity:.86;
}

#detectStatus{
    margin-top:7px;
    font-size:11px;
    color:#ffd400;
}

/* =========================
   MESSAGE
========================= */

#message{
    position:absolute;
    left:50%;
    bottom:15px;
    transform:translateX(-50%);
    width:92%;
    padding:12px;
    border-radius:17px;
    background:rgba(0,0,0,.80);
    text-align:center;
    font-size:15px;
    font-weight:800;
    z-index:10;
}

#version{
    position:absolute;
    left:7px;
    bottom:3px;
    font-size:10px;
    opacity:.55;
    z-index:20;
}

/* =========================
   CONTROLS
========================= */

#controls{
    flex:0 0 auto;
    padding:
    9px 11px
    calc(11px + env(safe-area-inset-bottom));
    background:#000;
}

#modeRow,
#compositionRow{
    display:flex;
    gap:7px;
    overflow-x:auto;
    scrollbar-width:none;
}

#modeRow{
    padding-bottom:8px;
}

#compositionRow{
    padding-bottom:8px;
}

#modeRow::-webkit-scrollbar,
#compositionRow::-webkit-scrollbar{
    display:none;
}

/* =========================
   MODE BUTTON
========================= */

.modeBtn{
    flex:0 0 auto;
    min-width:67px;
    padding:8px;
    border:0;
    border-radius:17px;
    background:#242424;
    color:#fff;
    font-size:12px;
    font-weight:700;
}

.modeBtn.active{
    background:#fff;
    color:#000;
}

.autoBtn.active{
    background:#ffd400;
    color:#000;
}

.modeIcon{
    display:block;
    font-size:19px;
    margin-bottom:2px;
}

/* =========================
   COMPOSITION BUTTON
========================= */

.compBtn{
    flex:0 0 auto;
    padding:7px 12px;
    border-radius:17px;
    border:1px solid #444;
    background:#151515;
    color:#ddd;
    font-size:12px;
}

.compBtn.active{
    border-color:#ffd400;
    color:#ffd400;
}

/* =========================
   MAIN BUTTON
========================= */

#mainButton{
    width:100%;
    padding:12px;
    border:0;
    border-radius:24px;
    background:#fff;
    color:#000;
    font-size:16px;
    font-weight:800;
    margin-bottom:8px;
}

/* =========================
   CAMERA CONTROL
========================= */

#bottomRow{
    display:flex;
    align-items:center;
    gap:7px;
}

.cameraBtn{
    flex:0 0 auto;
    padding:8px 11px;
    border:0;
    border-radius:18px;
    background:#292929;
    color:#fff;
    font-size:12px;
}

#zoomArea{
    flex:1;
    display:flex;
    align-items:center;
    gap:5px;
}

#zoom{
    flex:1;
    min-width:50px;
}

#zoomText{
    min-width:32px;
    font-size:11px;
}

#status{
    margin-top:6px;
    text-align:center;
    font-size:10px;
    opacity:.42;
}

</style>

/* =========================================================
   CAMERA
========================================================= */

async function startCamera(){

    try{

        messageEl.innerText=
        "📷 正在開啟相機...";


        if(stream){

            stream
            .getTracks()
            .forEach(
                track=>track.stop()
            );

        }


        stream=
        await navigator.mediaDevices
        .getUserMedia({

            video:{

                facingMode:{
                    ideal:facing
                },

                width:{
                    ideal:1280
                },

                height:{
                    ideal:720
                }

            },

            audio:false

        });


        video.srcObject=
        stream;


        await video.play();


        resizeOverlay();


        messageEl.innerText=
        "📷 對準想拍攝的畫面";


    }
    catch(error){

        console.log(error);


        if(
            error.name===
            "NotAllowedError"
        ){

            messageEl.innerText=
            "❌ 請允許網站使用相機";

        }

        else if(
            error.name===
            "NotFoundError"
        ){

            messageEl.innerText=
            "❌ 找不到可用相機";

        }

        else{

            messageEl.innerText=
            "❌ 相機無法開啟";

        }

    }

}


async function changeCamera(mode){

    facing=mode;

    latestFace=null;

    await startCamera();

}


/* =========================================================
   MEDIAPIPE INIT
========================================================= */

async function initFaceDetector(){

    if(detectorReady){
        return true;
    }


    detectStatus.innerText=
    "正在載入人像辨識...";


    try{

        const vision=
        await FilesetResolver
        .forVisionTasks(

            "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22-rc.20250304/wasm"

        );


        faceDetector=
        await FaceDetector
        .createFromOptions(

            vision,

            {

                baseOptions:{

                    modelAssetPath:

                    "https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite"

                },

                runningMode:"VIDEO",

                minDetectionConfidence:
                0.55

            }

        );


        detectorReady=true;


        detectStatus.innerText=
        "✓ 人像辨識已就緒";


        return true;

    }

    catch(error){

        console.error(
            "Face detector error",
            error
        );


        detectStatus.innerText=
        "❌ 人像辨識載入失敗";


        messageEl.innerText=
        "❌ 辨識模組載入失敗";


        return false;

    }

}


/* =========================================================
   SELECT MODE
========================================================= */

function selectMode(
    mode,
    button
){

    portraitNavigation=false;

    latestFace=null;

    currentMode=mode;


    document
    .querySelectorAll(
        ".modeBtn"
    )
    .forEach(
        b=>b.classList.remove(
            "active"
        )
    );


    if(button){

        button.classList.add(
            "active"
        );

    }


    clearOverlay();


    if(mode==="auto"){

        currentComposition=null;

        compositionRow.innerHTML="";

        modeTitle.innerText=
        "✨ 自動構圖";

        compositionEl.innerText=
        "準備";

        descEl.innerText=
        "自動場景辨識將逐步加入";

        detectStatus.innerText=
        "V6.2";

        mainButton.innerText=
        "✨ 自動構圖";

        messageEl.innerText=
        "👉 目前可先測試人像構圖導航";

        return;

    }


    const data=
    database[mode];


    modeTitle.innerText=
    data.icon+
    " "+
    data.name+
    "模式";


    buildCompositionButtons();


    selectComposition(
        data.default
    );


    if(mode==="portrait"){

        mainButton.innerText=
        "▶ 開始構圖導航";

        detectStatus.innerText=
        detectorReady
        ?
        "✓ 人像辨識已就緒"
        :
        "尚未啟動人像辨識";

        messageEl.innerText=
        "👤 對準一個人後按「開始構圖導航」";

    }

    else{

        mainButton.innerText=
        "✨ 推薦構圖";

        detectStatus.innerText=
        "手動構圖模式";

        messageEl.innerText=
        "📷 可手動選擇構圖方式";

    }

}


/* =========================================================
   BUILD BUTTONS
========================================================= */

function buildCompositionButtons(){

    compositionRow.innerHTML="";


    const data=
    database[currentMode];


    data.comps.forEach(
        comp=>{

            const button=
            document.createElement(
                "button"
            );


            button.className=
            "compBtn";


            button.dataset.id=
            comp[0];


            button.innerText=
            comp[1];


            button.onclick=
            ()=>{

                portraitNavigation=false;

                selectComposition(
                    comp[0]
                );

            };


            compositionRow
            .appendChild(
                button
            );

        }
    );

}


/* =========================================================
   SELECT COMPOSITION
========================================================= */

function selectComposition(id){

    currentComposition=id;


    const data=
    database[currentMode];


    if(!data){
        return;
    }


    const comp=
    data.comps.find(
        c=>c[0]===id
    );


    if(!comp){
        return;
    }


    compositionEl.innerText=
    comp[1];


    descEl.innerText=
    comp[2];


    document
    .querySelectorAll(
        ".compBtn"
    )
    .forEach(
        button=>{

            button.classList.toggle(

                "active",

                button.dataset.id===id

            );

        }
    );


    drawComposition();

}


/* =========================================================
   MAIN BUTTON
========================================================= */

async function runComposition(){

    if(currentMode==="portrait"){

        const ok=
        await initFaceDetector();


        if(!ok){
            return;
        }


        currentComposition=
        "portraitThirds";


        portraitNavigation=true;


        compositionEl.innerText=
        "三分人像導航";


        descEl.innerText=
        "移動手機，讓臉部進入綠色目標圈";


        messageEl.innerText=
        "🔍 正在尋找人物...";


        requestAnimationFrame(
            portraitLoop
        );


        return;

    }


    if(currentMode==="auto"){

        messageEl.innerText=
        "👉 V6.2 請先測試「人像」模式";

        return;

    }


    const data=
    database[currentMode];


    selectComposition(
        data.default
    );


    messageEl.innerText=
    "✓ 推薦："+
    compositionEl.innerText;

}


/* =========================================================
   PORTRAIT LOOP
========================================================= */

async function portraitLoop(){

    if(
        !portraitNavigation ||
        currentMode!=="portrait"
    ){

        return;

    }


    if(
        video.readyState<2 ||
        !faceDetector
    ){

        requestAnimationFrame(
            portraitLoop
        );

        return;

    }


    if(
        video.currentTime===
        lastVideoTime
    ){

        requestAnimationFrame(
            portraitLoop
        );

        return;

    }


    lastVideoTime=
    video.currentTime;


    if(detecting){

        requestAnimationFrame(
            portraitLoop
        );

        return;

    }


    detecting=true;


    try{

        const result=
        faceDetector.detectForVideo(

            video,

            performance.now()

        );


        if(
            result &&
            result.detections &&
            result.detections.length>0
        ){

            latestFace=
            result.detections[0];


            drawPortraitNavigation(
                latestFace
            );

        }

        else{

            latestFace=null;


            drawPortraitNoFace();


            messageEl.innerText=
            "👤 找不到臉｜請讓人物面向鏡頭";

        }

    }

    catch(error){

        console.log(
            "Detection error",
            error
        );

    }


    detecting=false;


    requestAnimationFrame(
        portraitLoop
    );

}


/* =========================================================
   VIDEO → SCREEN COORDINATE

   video 使用 object-fit:cover

   所以不能直接把原始座標乘畫面大小。

   必須計算 cover crop。

========================================================= */

function videoPointToScreen(
    x,
    y
){

    const vw=
    video.videoWidth;

    const vh=
    video.videoHeight;


    const sw=
    overlay.clientWidth;

    const sh=
    overlay.clientHeight;


    if(
        !vw ||
        !vh
    ){

        return {
            x:0,
            y:0
        };

    }


    const scale=
    Math.max(
        sw/vw,
        sh/vh
    );


    const renderedW=
    vw*scale;

    const renderedH=
    vh*scale;


    const cropX=
    (renderedW-sw)/2;

    const cropY=
    (renderedH-sh)/2;


    let screenX=
    x*scale-cropX;

    let screenY=
    y*scale-cropY;


    /*
       前鏡 Safari 顯示可能有鏡像差異。

       這裡先依目前 video 顯示座標處理。
    */


    return{

        x:screenX,

        y:screenY

    };

}


/* =========================================================
   PORTRAIT NAVIGATION
========================================================= */

function drawPortraitNavigation(
    detection
){

    clearOverlay();


    const box=
    detection.boundingBox;


    if(!box){
        return;
    }


    const p1=
    videoPointToScreen(
        box.originX,
        box.originY
    );


    const p2=
    videoPointToScreen(
        box.originX+
        box.width,
        box.originY+
        box.height
    );


    const faceX=
    (p1.x+p2.x)/2;


    const faceY=
    (p1.y+p2.y)/2;


    const faceW=
    Math.abs(
        p2.x-p1.x
    );


    const faceH=
    Math.abs(
        p2.y-p1.y
    );


    const w=
    overlay.clientWidth;


    const h=
    overlay.clientHeight;


    /*
       V6.2：

       人像三分法先採左上三分點。

       後續 V6.3 再根據
       人物朝向決定左三分或右三分。
    */


    const targetX=
    w/3;


    const targetY=
    h/3;


    /* =========================
       三分線
    ========================= */


    ctx.save();


    ctx.strokeStyle=
    "rgba(255,212,0,.50)";


    ctx.lineWidth=1.5;


    ctx.setLineDash(
        [7,7]
    );


    ctx.beginPath();


    ctx.moveTo(
        w/3,
        0
    );

    ctx.lineTo(
        w/3,
        h
    );


    ctx.moveTo(
        w*2/3,
        0
    );

    ctx.lineTo(
        w*2/3,
        h
    );


    ctx.moveTo(
        0,
        h/3
    );

    ctx.lineTo(
        w,
        h/3
    );


    ctx.moveTo(
        0,
        h*2/3
    );

    ctx.lineTo(
        w,
        h*2/3
    );


    ctx.stroke();


    ctx.restore();


    /* =========================
       DISTANCE
    ========================= */


    const dx=
    targetX-faceX;


    const dy=
    targetY-faceY;


    const toleranceX=
    w*.075;


    const toleranceY=
    h*.065;


    const goodX=
    Math.abs(dx)<
    toleranceX;


    const goodY=
    Math.abs(dy)<
    toleranceY;


    const completed=
    goodX &&
    goodY;


    /* =========================
       TARGET
    ========================= */


    ctx.save();


    ctx.strokeStyle=
    completed
    ?
    "#2cff67"
    :
    "#2cff67";


    ctx.lineWidth=4;


    ctx.beginPath();


    ctx.arc(

        targetX,

        targetY,

        25,

        0,

        Math.PI*2

    );


    ctx.stroke();


    ctx.beginPath();


    ctx.arc(

        targetX,

        targetY,

        5,

        0,

        Math.PI*2

    );


    ctx.fillStyle=
    "#2cff67";


    ctx.fill();


    ctx.restore();


    /* =========================
       FACE BOX
    ========================= */


    ctx.save();


    ctx.strokeStyle=
    completed
    ?
    "#2cff67"
    :
    "#ffd400";


    ctx.lineWidth=4;


    ctx.strokeRect(

        p1.x,

        p1.y,

        faceW,

        faceH

    );


    ctx.restore();


    /* =========================
       CONNECTOR
    ========================= */


    if(!completed){

        ctx.save();


        ctx.strokeStyle=
        "#ffd400";


        ctx.lineWidth=3;


        ctx.setLineDash(
            [7,6]
        );


        ctx.beginPath();


        ctx.moveTo(
            faceX,
            faceY
        );


        ctx.lineTo(
            targetX,
            targetY
        );


        ctx.stroke();


        ctx.restore();

    }


    /* =========================
       NAVIGATION TEXT
    ========================= */


    if(completed){

        messageEl.innerText=
        "✓ 構圖完成";


        compositionEl.innerText=
        "構圖完成";


        descEl.innerText=
        "人物已進入建議位置";


        detectStatus.innerText=
        "● 位置穩定";

        return;

    }


    let horizontal="";

    let vertical="";


    /*
       注意：

       我們是在告訴使用者
       「手機要怎麼移」

       不是人物要怎麼移。

       畫面中的臉若需要往左，
       通常手機需要往右。

       V6.2 先用畫面導航語意，
       下一輪實機測試後再校正方向。
    */


    if(!goodX){

        if(dx>0){

            horizontal=
            "← 手機向左";

        }

        else{

            horizontal=
            "→ 手機向右";

        }

    }


    if(!goodY){

        if(dy>0){

            vertical=
            "↑ 稍微抬高";

        }

        else{

            vertical=
            "↓ 稍微降低";

        }

    }


    let text="";


    if(
        horizontal &&
        vertical
    ){

        text=
        horizontal+
        "　"+
        vertical;

    }

    else{

        text=
        horizontal ||
        vertical;

    }


    messageEl.innerText=
    text;


    compositionEl.innerText=
    "三分人像";


    descEl.innerText=
    "讓黃色人物框移向綠色目標";


    detectStatus.innerText=
    "● 正在追蹤人物";

}


/* =========================================================
   NO FACE

/* =========================================================
   NORMAL DRAW
========================================================= */

function clearOverlay(){

    ctx.clearRect(

        0,

        0,

        overlay.clientWidth,

        overlay.clientHeight

    );

}


function setup(){

    ctx.strokeStyle=
    "#ffd400";


    ctx.fillStyle=
    "#2cff67";


    ctx.lineWidth=
    2.5;


    ctx.setLineDash([]);

}


function target(x,y){

    ctx.save();


    ctx.strokeStyle=
    "#2cff67";


    ctx.fillStyle=
    "#2cff67";


    ctx.lineWidth=3;


    ctx.beginPath();


    ctx.arc(
        x,
        y,
        11,
        0,
        Math.PI*2
    );


    ctx.stroke();


    ctx.beginPath();


    ctx.arc(
        x,
        y,
        4,
        0,
        Math.PI*2
    );


    ctx.fill();


    ctx.restore();

}


/* =========================================================
   THIRDS
========================================================= */

function drawThirds(){

    const w=
    overlay.clientWidth;


    const h=
    overlay.clientHeight;


    setup();


    ctx.beginPath();


    ctx.moveTo(w/3,0);
    ctx.lineTo(w/3,h);


    ctx.moveTo(w*2/3,0);
    ctx.lineTo(w*2/3,h);


    ctx.moveTo(0,h/3);
    ctx.lineTo(w,h/3);


    ctx.moveTo(0,h*2/3);
    ctx.lineTo(w,h*2/3);


    ctx.stroke();


    target(
        w/3,
        h/3
    );


    target(
        w*2/3,
        h/3
    );


    target(
        w/3,
        h*2/3
    );


    target(
        w*2/3,
        h*2/3
    );

}


/* =========================================================
   CENTER
========================================================= */

function drawCenter(){

    const w=
    overlay.clientWidth;


    const h=
    overlay.clientHeight;


    setup();


    ctx.beginPath();


    ctx.moveTo(
        w/2,
        0
    );


    ctx.lineTo(
        w/2,
        h
    );


    ctx.moveTo(
        0,
        h/2
    );


    ctx.lineTo(
        w,
        h/2
    );


    ctx.stroke();


    target(
        w/2,
        h/2
    );

}


/* =========================================================
   LEADING
========================================================= */

function drawLeading(){

    const w=
    overlay.clientWidth;


    const h=
    overlay.clientHeight;


    setup();


    const vx=
    w*.5;


    const vy=
    h*.4;


    ctx.lineWidth=4;


    ctx.beginPath();


    ctx.moveTo(
        w*.08,
        h
    );


    ctx.lineTo(
        vx,
        vy
    );


    ctx.moveTo(
        w*.92,
        h
    );


    ctx.lineTo(
        vx,
        vy
    );


    ctx.stroke();


    target(
        vx,
        vy
    );

}


/* =========================================================
   PERSPECTIVE
========================================================= */

function drawPerspective(){

    const w=
    overlay.clientWidth;


    const h=
    overlay.clientHeight;


    setup();


    const vx=
    w*.5;


    const vy=
    h*.42;


    const starts=[

        [0,h],

        [w*.25,h],

        [w*.75,h],

        [w,h],

        [0,h*.65],

        [w,h*.65]

    ];


    ctx.beginPath();


    starts.forEach(
        p=>{

            ctx.moveTo(
                p[0],
                p[1]
            );


            ctx.lineTo(
                vx,
                vy
            );

        }
    );


    ctx.stroke();


    target(
        vx,
        vy
    );

}


/* =========================================================
   SYMMETRY
========================================================= */

function drawSymmetry(){

    const w=
    overlay.clientWidth;


    const h=
    overlay.clientHeight;


    setup();


    ctx.lineWidth=3;


    ctx.beginPath();


    ctx.moveTo(
        w/2,
        0
    );


    ctx.lineTo(
        w/2,
        h
    );


    ctx.stroke();


    ctx.setLineDash(
        [8,8]
    );


    ctx.beginPath();


    ctx.moveTo(
        w*.2,
        h*.2
    );


    ctx.lineTo(
        w*.2,
        h*.8
    );


    ctx.moveTo(
        w*.8,
        h*.2
    );


    ctx.lineTo(
        w*.8,
        h*.8
    );


    ctx.stroke();


    ctx.setLineDash([]);

}


/* =========================================================
   DIAGONAL
========================================================= */

function drawDiagonal(){

    const w=
    overlay.clientWidth;


    const h=
    overlay.clientHeight;


    setup();


    ctx.beginPath();


    ctx.moveTo(
        0,
        h
    );


    ctx.lineTo(
        w,
        0
    );


    ctx.stroke();


    target(
        w*.62,
        h*.38
    );

}


/* =========================================================
   FRAME
========================================================= */

function drawFrame(){

    const w=
    overlay.clientWidth;


    const h=
    overlay.clientHeight;


    setup();


    ctx.strokeRect(

        w*.12,

        h*.13,

        w*.76,

        h*.74

    );


    target(
        w/2,
        h/2
    );

}


/* =========================================================
   PORTRAIT TEMPLATE
========================================================= */

function drawPortraitThirds(){

    drawThirds();


    const w=
    overlay.clientWidth;


    const h=
    overlay.clientHeight;


    ctx.save();


    ctx.strokeStyle=
    "#2cff67";


    ctx.lineWidth=3;


    ctx.beginPath();


    ctx.ellipse(

        w*.34,

        h*.32,

        w*.10,

        h*.08,

        0,

        0,

        Math.PI*2

    );


    ctx.stroke();


    ctx.restore();

}


function drawPortraitCenter(){

    drawCenter();

}


function drawFullBody(){

    const w=
    overlay.clientWidth;


    const h=
    overlay.clientHeight;


    setup();


    ctx.strokeStyle=
    "#2cff67";


    ctx.strokeRect(

        w*.36,

        h*.10,

        w*.28,

        h*.80

    );

}


/* =========================================================
   FOOD / PRODUCT / MACRO
========================================================= */

function drawCircle(){

    const w=
    overlay.clientWidth;


    const h=
    overlay.clientHeight;


    setup();


    ctx.strokeStyle=
    "#2cff67";


    ctx.lineWidth=3;


    ctx.beginPath();


    ctx.arc(

        w*.5,

        h*.5,

        Math.min(w,h)*.23,

        0,

        Math.PI*2

    );


    ctx.stroke();


    target(
        w*.5,
        h*.5
    );

}


function drawFill(){

    const w=
    overlay.clientWidth;


    const h=
    overlay.clientHeight;


    setup();


    ctx.strokeStyle=
    "#2cff67";


    ctx.lineWidth=4;


    ctx.strokeRect(

        w*.06,

        h*.06,

        w*.88,

        h*.88

    );

}


/* =========================================================
   GOLDEN
========================================================= */

function drawGolden(){

    const w=
    overlay.clientWidth;


    const h=
    overlay.clientHeight;


    setup();


    ctx.beginPath();


    ctx.moveTo(
        w*.382,
        0
    );


    ctx.lineTo(
        w*.382,
        h
    );


    ctx.moveTo(
        w*.618,
        0
    );


    ctx.lineTo(
        w*.618,
        h
    );


    ctx.moveTo(
        0,
        h*.382
    );


    ctx.lineTo(
        w,
        h*.382
    );


    ctx.moveTo(
        0,
        h*.618
    );


    ctx.lineTo(
        w,
        h*.618
    );


    ctx.stroke();

}


/* =========================================================
   DRAW ROUTER
========================================================= */

function drawComposition(){

    if(portraitNavigation){
        return;
    }


    clearOverlay();


    switch(
        currentComposition
    ){


        case "thirds":
        case "macroThirds":
        case "petThirds":
        case "productThirds":
        case "foodThirds":

            drawThirds();
            break;


        case "golden":

            drawGolden();
            break;


        case "leading":

            drawLeading();
            break;


        case "center":
        case "macroCenter":
        case "petCenter":
        case "productCenter":

            drawCenter();
            break;


        case "frame":

            drawFrame();
            break;


        case "perspective":

            drawPerspective();
            break;


        case "symmetry":

            drawSymmetry();
            break;


        case "diagonal":
        case "foodDiagonal":
        case "product45":

            drawDiagonal();
            break;


        case "portraitThirds":
        case "environment":
        case "lookSpace":

            drawPortraitThirds();
            break;


        case "portraitCenter":

            drawPortraitCenter();
            break;


        case "fullbody":
        case "petFull":
        case "petAction":
        case "petLook":

            drawFullBody();
            break;


        case "reflection":

            drawCenter();
            break;


        case "foodCenter":
        case "foodTop":

            drawCircle();
            break;


        case "fill":

            drawFill();
            break;


        case "negative":

            drawThirds();
            break;

    }

}


/* =========================================================
   RESIZE
========================================================= */

function resizeOverlay(){

    const rect=
    overlay.getBoundingClientRect();


    const dpr=
    window.devicePixelRatio ||
    1;


    overlay.width=
    Math.round(
        rect.width*dpr
    );


    overlay.height=
    Math.round(
        rect.height*dpr
    );


    ctx.setTransform(

        dpr,

        0,

        0,

        dpr,

        0,

        0

    );


    drawComposition();

}


window.addEventListener(
    "resize",
    resizeOverlay
);


/* =========================================================
   ZOOM
========================================================= */

zoom.addEventListener(

    "input",

    async function(){

        const value=
        Number(
            this.value
        );


        zoomText.innerText=
        value.toFixed(1)+
        "×";


        if(!stream){
            return;
        }


        const tracks=
        stream.getVideoTracks();


        if(!tracks.length){
            return;
        }


        const track=
        tracks[0];


        if(
            !track.getCapabilities
        ){
            return;
        }


        const caps=
        track.getCapabilities();


        if(!caps.zoom){
            return;
        }


        try{

            const z=
            Math.max(

                caps.zoom.min,

                Math.min(

                    caps.zoom.max,

                    value

                )

            );


            await track
            .applyConstraints({

                advanced:[
                    {
                        zoom:z
                    }
                ]

            });

        }

        catch(error){

            console.log(
                "Zoom",
                error
            );

        }

    }

);

window.selectMode=
selectMode;
