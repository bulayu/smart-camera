<script>

/* =========================================================
   AI 構圖助手 V5.8.5
   道路走廊驗證版

   V5.8.5 核心：

   1. Sobel 邊緣
   2. 區域方向線
   3. 全局 VP 搜尋
   4. 左右共同支持
   5. 中近景深證據
   6. 地平線軟約束
   7. NEW：道路走廊驗證
   8. NEW：遠窄 → 中寬 → 近更寬
   9. NEW：左右兩側必須共同形成 V 型
   10. 多幀中位數穩定

========================================================= */


/* =========================================================
   DOM
========================================================= */

var video =
document.getElementById("video");

var overlay =
document.getElementById("overlay");

var ctx =
overlay.getContext("2d");

var analysisCanvas =
document.getElementById("analysisCanvas");

var ax =
analysisCanvas.getContext(
    "2d",
    {willReadFrequently:true}
);

var scoreEl =
document.getElementById("score");

var compositionEl =
document.getElementById("composition");

var descEl =
document.getElementById("desc");

var messageEl =
document.getElementById("message");

var zoom =
document.getElementById("zoom");

var zoomText =
document.getElementById("zoomText");


/* =========================================================
   STATE
========================================================= */

var stream = null;
var facing = "environment";
var detectedPoint = null;
var analyzing = false;
var confidence = 0;


/* =========================================================
   CONSTANTS
========================================================= */

var AW = 240;
var AH = 180;
var CELL = 10;


/* =========================================================
   UTIL
========================================================= */

function clamp(v,min,max){

    return Math.max(
        min,
        Math.min(max,v)
    );

}


function median(arr){

    if(!arr || arr.length===0){
        return 0;
    }

    var a =
    arr.slice().sort(
        function(x,y){
            return x-y;
        }
    );

    var m =
    Math.floor(a.length/2);

    if(a.length%2){
        return a[m];
    }

    return(
        a[m-1]+a[m]
    )/2;

}


function angleDifference(a,b){

    var d =
    Math.abs(a-b);

    while(d>Math.PI){
        d-=Math.PI;
    }

    if(d>Math.PI/2){
        d=Math.PI-d;
    }

    return Math.abs(d);

}


function lineDistance(
    px,
    py,
    line
){

    var dx =
    Math.cos(line.angle);

    var dy =
    Math.sin(line.angle);

    return Math.abs(
        (px-line.x)*(-dy)
        +
        (py-line.y)*dx
    );

}


/* =========================================================
   CAMERA
   保留 V5.8.4.1 相機診斷
========================================================= */

async function startCamera(){

    try{

        messageEl.innerText =
        "📷 正在開啟相機...";


        if(stream){

            stream
            .getTracks()
            .forEach(
                function(track){
                    track.stop();
                }
            );

        }


        stream = null;


        if(
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia
        ){

            throw new Error(
                "getUserMedia 不支援"
            );

        }


        stream =
        await navigator.mediaDevices
        .getUserMedia({

            video:{

                facingMode:{
                    ideal:facing
                },

                width:{
                    ideal:1280
                },

                height:{
                    ideal:720
                }

            },

            audio:false

        });


        video.srcObject =
        stream;


        await video.play();


        resizeOverlay();

        resetAnalysis();

    }
    catch(error){

        console.log(
            "Camera error:",
            error
        );


        var errorName =
        error && error.name
        ?
        error.name
        :
        "UnknownError";


        var errorMessage =
        error && error.message
        ?
        error.message
        :
        "";


        compositionEl.innerText =
        "相機無法開啟";


        if(
            errorName ===
            "NotAllowedError"
        ){

            descEl.innerText =
            "相機權限被拒絕";

            messageEl.innerText =
            "❌ NotAllowedError｜請允許網站使用相機";

        }
        else
        if(
            errorName ===
            "NotFoundError"
        ){

            descEl.innerText =
            "找不到可用相機";

            messageEl.innerText =
            "❌ NotFoundError｜找不到鏡頭";

        }
        else
        if(
            errorName ===
            "NotReadableError"
        ){

            descEl.innerText =
            "相機可能被其他程式占用";

            messageEl.innerText =
            "❌ NotReadableError｜請關閉其他相機程式";

        }
        else
        if(
            errorName ===
            "OverconstrainedError"
        ){

            descEl.innerText =
            "相機規格限制無法套用";

            messageEl.innerText =
            "❌ OverconstrainedError｜鏡頭限制不相容";

        }
        else
        if(
            errorName ===
            "SecurityError"
        ){

            descEl.innerText =
            "瀏覽器安全限制";

            messageEl.innerText =
            "❌ SecurityError｜請確認使用 HTTPS";

        }
        else{

            descEl.innerText =
            errorName +
            (
                errorMessage
                ?
                "｜"+errorMessage
                :
                ""
            );

            messageEl.innerText =
            "❌ 相機錯誤："+errorName;

        }

    }

}


async function changeCamera(mode){

    facing = mode;

    await startCamera();

}


/* =========================================================
   RESET
========================================================= */

function resetAnalysis(){

    detectedPoint = null;

    analyzing = false;

    confidence = 0;

    scoreEl.innerHTML =
    '-- <small>%</small>';

    compositionEl.innerText =
    "等待分析";

    descEl.innerText =
    "尋找真正的景深收斂點";

    messageEl.innerText =
    "✨ 固定鏡頭後，按 AI 自動分析";

}


/* =========================================================
   RUN AI
========================================================= */

function runAI(){

    if(analyzing){
        return;
    }


    if(video.readyState<2){

        messageEl.innerText =
        "⏳ 鏡頭還沒準備完成";

        return;

    }


    analyzing = true;

    detectedPoint = null;

    scoreEl.innerHTML =
    '-- <small>%</small>';

    compositionEl.innerText =
    "AI 分析中";

    descEl.innerText =
    "正在確認道路走廊與景深收斂";

    messageEl.innerText =
    "🔍 尋找真正消失點...";


    var results = [];

    var frame = 0;


    var timer =
    setInterval(
        function(){

            var result =
            analyzeDepthVanishingPoint();

            if(result){
                results.push(result);
            }

            frame++;


            if(frame>=7){

                clearInterval(timer);

                analyzing = false;

                finishAnalysis(results);

            }

        },
        165
    );

}


/* =========================================================
   MULTI FRAME
========================================================= */

function finishAnalysis(results){

    if(results.length<3){

        failAnalysis();

        return;

    }


    var mx =
    median(
        results.map(
            function(r){
                return r.vx;
            }
        )
    );


    var my =
    median(
        results.map(
            function(r){
                return r.vy;
            }
        )
    );


    var distances =
    results.map(
        function(r){

            return Math.hypot(
                r.vx-mx,
                r.vy-my
            );

        }
    );


    var md =
    median(distances);


    var limit =
    Math.max(
        .035,
        md*2.15
    );


    var filtered =
    results.filter(
        function(r){

            return(
                Math.hypot(
                    r.vx-mx,
                    r.vy-my
                )
                <=limit
            );

        }
    );


    if(filtered.length<3){

        failAnalysis();

        return;

    }


    mx =
    median(
        filtered.map(
            function(r){
                return r.vx;
            }
        )
    );


    my =
    median(
        filtered.map(
            function(r){
                return r.vy;
            }
        )
    );


    var conf =
    median(
        filtered.map(
            function(r){
                return r.confidence;
            }
        )
    );


    var corridor =
    median(
        filtered.map(
            function(r){
                return r.corridor || 0;
            }
        )
    );


    var spread =
    median(
        filtered.map(
            function(r){

                return Math.hypot(
                    r.vx-mx,
                    r.vy-my
                );

            }
        )
    );


    var stability =
    clamp(
        1-spread/.10,
        0,
        1
    );


    conf =
    conf*.76
    +
    stability*.24;


    detectedPoint = {

        vx:mx,
        vy:my

    };


    confidence =
    Math.round(
        clamp(
            conf*100,
            0,
            99
        )
    );


    scoreEl.innerHTML =
    confidence+
    ' <small>%</small>';


    compositionEl.innerText =
    "◎ 單點透視";


    if(corridor>.60){

        descEl.innerText =
        "AI 找到道路走廊主要收斂點";

    }
    else{

        descEl.innerText =
        "AI 找到景深主要收斂點";

    }


    messageEl.innerText =
    "🎯 檢查綠色 AI 消失點位置";

}


/* =========================================================
   FAIL
========================================================= */

function failAnalysis(){

    detectedPoint = null;

    confidence = 0;

    scoreEl.innerHTML =
    '-- <small>%</small>';

    compositionEl.innerText =
    "無法確認消失點";

    descEl.innerText =
    "目前沒有穩定的道路景深收斂";

    messageEl.innerText =
    "📱 稍微調整畫面，再按 AI 自動分析";

}


/* =========================================================
   ORIENTATION SUPPORT
========================================================= */

function orientationSupport(
    x,
    y,
    angle,
    magnitude,
    edgeAngle,
    threshold
){

    var dx =
    Math.cos(angle);

    var dy =
    Math.sin(angle);

    var hit = 0;
    var total = 0;


    for(
        var s=-28;
        s<=28;
        s+=7
    ){

        if(Math.abs(s)<2){
            continue;
        }


        var px =
        Math.round(
            x+dx*s
        );

        var py =
        Math.round(
            y+dy*s
        );


        if(
            px<2 ||
            px>=AW-2 ||
            py<2 ||
            py>=AH-2
        ){
            continue;
        }


        total++;


        var found = false;


        for(
            var oy=-1;
            oy<=1 && !found;
            oy++
        ){

            for(
                var ox=-1;
                ox<=1;
                ox++
            ){

                var id =
                (py+oy)*AW+
                (px+ox);


                if(
                    magnitude[id]
                    <
                    threshold*.58
                ){
                    continue;
                }


                var diff =
                angleDifference(
                    edgeAngle[id],
                    angle
                );


                if(diff<.24){

                    found = true;

                    break;

                }

            }

        }


        if(found){
            hit++;
        }

    }


    if(total===0){
        return 0;
    }


    return hit/total;

}


/* =========================================================
   EXTRACT LINES
========================================================= */

function extractLines(
    magnitude,
    edgeAngle,
    threshold
){

    var lines = [];


    for(
        var cy=0;
        cy<AH;
        cy+=CELL
    ){

        for(
            var cx=0;
            cx<AW;
            cx+=CELL
        ){

            var local = [];


            for(
                var y=cy;
                y<Math.min(cy+CELL,AH);
                y++
            ){

                for(
                    var x=cx;
                    x<Math.min(cx+CELL,AW);
                    x++
                ){

                    var id =
                    y*AW+x;


                    if(
                        magnitude[id]
                        <
                        threshold
                    ){
                        continue;
                    }


                    var a =
                    edgeAngle[id];


                    /*
                    水平線對 VP 幫助低
                    */

                    if(
                        Math.abs(a)<.10
                    ){
                        continue;
                    }


                    /*
                    垂直線容易是樹幹、柱子
                    */

                    if(
                        Math.abs(a)>1.46
                    ){
                        continue;
                    }


                    local.push({

                        x:x,
                        y:y,
                        angle:a,
                        mag:magnitude[id]

                    });

                }

            }


            if(local.length===0){
                continue;
            }


            local.sort(
                function(a,b){
                    return b.mag-a.mag;
                }
            );


            var selected = [];


            for(
                var k=0;
                k<local.length;
                k++
            ){

                var item =
                local[k];

                var different = true;


                for(
                    var q=0;
                    q<selected.length;
                    q++
                ){

                    if(
                        angleDifference(
                            item.angle,
                            selected[q].angle
                        )
                        <
                        .18
                    ){

                        different = false;

                        break;

                    }

                }


                if(!different){
                    continue;
                }


                var support =
                orientationSupport(
                    item.x,
                    item.y,
                    item.angle,
                    magnitude,
                    edgeAngle,
                    threshold
                );


                if(support<.16){
                    continue;
                }


                item.support =
                support;


                selected.push(item);


                if(selected.length>=2){
                    break;
                }

            }


            for(
                var n=0;
                n<selected.length;
                n++
            ){

                var L =
                selected[n];


                var strength =
                clamp(
                    L.mag/
                    (threshold*2.2),
                    .45,
                    1.15
                );


                var continuity =
                .55+
                L.support*.65;


                var depthSource =
                .72+
                (L.y/AH)*.38;


                /*
                下半部略加權
                */

                if(
                    L.y/AH>.55
                ){

                    depthSource *=
                    1.06;

                }


                L.weight =
                strength*
                continuity*
                depthSource;


                L.regionX =
                Math.floor(
                    L.x/(AW/6)
                );


                L.regionY =
                Math.floor(
                    L.y/(AH/5)
                );


                lines.push(L);

            }

        }

    }


    return lines;

}


/* =========================================================
   V5.8.5
   ROAD CORRIDOR VALIDATION

   真正道路 / 步道透視：

            VP
           /  \
          /    \
         /      \
        /        \

   從 VP 往下：

   遠處：窄
   中段：較寬
   近處：更寬

========================================================= */

function corridorValidation(
    vx,
    vy,
    accepted
){

    /*
    三個垂直景深層：

    far    VP下方 10~32%
    middle 32~58%
    near   58~100%
    */

    var bands = {

        far:{
            left:[],
            right:[]
        },

        middle:{
            left:[],
            right:[]
        },

        near:{
            left:[],
            right:[]
        }

    };


    var availableHeight =
    Math.max(
        1,
        AH-vy
    );


    for(
        var i=0;
        i<accepted.length;
        i++
    ){

        var item =
        accepted[i];

        var L =
        item.line;


        /*
        只看 VP 下方
        */

        if(
            L.y<=vy+
            availableHeight*.08
        ){
            continue;
        }


        /*
        這條線仍必須大致指向 VP
        */

        var dist =
        lineDistance(
            vx,
            vy,
            L
        );


        if(
            dist>AW*.060
        ){
            continue;
        }


        var rel =
        (L.y-vy)/
        availableHeight;


        var band;


        if(rel<.32){

            band =
            bands.far;

        }
        else
        if(rel<.58){

            band =
            bands.middle;

        }
        else{

            band =
            bands.near;

        }


        /*
        左側線
        */

        if(
            L.x <
            vx-AW*.025
        ){

            band.left.push({

                line:L,
                vote:item.vote,
                distance:
                vx-L.x

            });

        }


        /*
        右側線
        */

        if(
            L.x >
            vx+AW*.025
        ){

            band.right.push({

                line:L,
                vote:item.vote,
                distance:
                L.x-vx

            });

        }

    }


    /*
    每一層估算左右張開程度
    */

    function bandInfo(band){

        if(
            band.left.length===0 ||
            band.right.length===0
        ){

            return null;

        }


        /*
        使用中位數而不是最外側，
        避免一根樹枝把走廊拉很寬。
        */

        var leftDistances =
        band.left.map(
            function(o){
                return o.distance;
            }
        );


        var rightDistances =
        band.right.map(
            function(o){
                return o.distance;
            }
        );


        var leftD =
        median(leftDistances);


        var rightD =
        median(rightDistances);


        var width =
        leftD+
        rightD;


        var leftVote = 0;
        var rightVote = 0;


        for(
            var i=0;
            i<band.left.length;
            i++
        ){

            leftVote +=
            band.left[i].vote;

        }


        for(
            var j=0;
            j<band.right.length;
            j++
        ){

            rightVote +=
            band.right[j].vote;

        }


        var balance =
        Math.min(
            leftVote,
            rightVote
        )
        /
        Math.max(
            leftVote,
            rightVote,
            .0001
        );


        return{

            width:width,

            leftD:leftD,

            rightD:rightD,

            balance:balance,

            leftCount:
            band.left.length,

            rightCount:
            band.right.length

        };

    }


    var far =
    bandInfo(
        bands.far
    );


    var middle =
    bandInfo(
        bands.middle
    );


    var near =
    bandInfo(
        bands.near
    );


    /*
    有幾層同時存在左右邊
    */

    var validBands = 0;

    if(far){
        validBands++;
    }

    if(middle){
        validBands++;
    }

    if(near){
        validBands++;
    }


    /*
    完全不像走廊
    */

    if(validBands<2){

        return{

            score:.30,

            validBands:
            validBands,

            expansion:.30,

            bilateral:.30

        };

    }


    /*
    =====================================================
    遠窄 → 中寬 → 近寬

    不要求完美單調，
    因為實景可能有：
    樹
    車
    路牌
    草叢
    =====================================================
    */

    var expansion =
    .50;


    if(
        far &&
        middle &&
        near
    ){

        var grow1 =
        middle.width/
        Math.max(
            far.width,
            1
        );


        var grow2 =
        near.width/
        Math.max(
            middle.width,
            1
        );


        var totalGrow =
        near.width/
        Math.max(
            far.width,
            1
        );


        var s1 =
        clamp(
            (grow1-.85)/.75,
            0,
            1
        );


        var s2 =
        clamp(
            (grow2-.85)/.75,
            0,
            1
        );


        var s3 =
        clamp(
            (totalGrow-1.15)/1.40,
            0,
            1
        );


        expansion =
        .20+
        s1*.25+
        s2*.25+
        s3*.30;

    }
    else
    if(
        middle &&
        near
    ){

        var growMN =
        near.width/
        Math.max(
            middle.width,
            1
        );


        expansion =
        clamp(
            .35+
            (growMN-1)*.60,
            .25,
            .85
        );

    }
    else
    if(
        far &&
        middle
    ){

        var growFM =
        middle.width/
        Math.max(
            far.width,
            1
        );


        expansion =
        clamp(
            .32+
            (growFM-1)*.55,
            .25,
            .78
        );

    }


    /*
    =====================================================
    左右平衡

    真正道路不一定完全置中，
    所以只要求左右都有，
    不要求完全對稱。
    =====================================================
    */

    var balances = [];


    if(far){
        balances.push(
            far.balance
        );
    }


    if(middle){
        balances.push(
            middle.balance
        );
    }


    if(near){
        balances.push(
            near.balance
        );
    }


    var bilateral =
    median(balances);


    bilateral =
    clamp(
        bilateral,
        .20,
        1
    );


    /*
    =====================================================
    近景寬度

    真道路 / 走廊到了畫面下方，
    通常應該有一定張開程度。

    避免只是一小撮樹枝。
    =====================================================
    */

    var widthScore =
    .45;


    if(near){

        widthScore =
        clamp(
            near.width/
            (AW*.48),
            .25,
            1
        );

    }
    else
    if(middle){

        widthScore =
        clamp(
            middle.width/
            (AW*.32),
            .25,
            .82
        );

    }


    /*
    層數完整度
    */

    var bandScore =
    validBands/3;


    /*
    最終道路走廊信心
    */

    var score =

    expansion*.42

    +

    bilateral*.22

    +

    widthScore*.20

    +

    bandScore*.16;


    score =
    clamp(
        score,
        .20,
        1
    );


    return{

        score:score,

        validBands:
        validBands,

        expansion:
        expansion,

        bilateral:
        bilateral,

        widthScore:
        widthScore

    };

}


/* =========================================================
   CANDIDATE VP SCORE
========================================================= */

function scoreCandidateVP(
    vx,
    vy,
    lines
){

    var regionBest = {};


    for(
        var i=0;
        i<lines.length;
        i++
    ){

        var L =
        lines[i];


        /*
        VP 上方太遠的線不要
        */

        var below =
        L.y-vy;


        if(
            below <
            -AH*.03
        ){
            continue;
        }


        var dist =
        lineDistance(
            vx,
            vy,
            L
        );


        if(
            dist>
            AW*.065
        ){
            continue;
        }


        var toVP =
        Math.atan2(
            vy-L.y,
            vx-L.x
        );


        while(
            toVP>Math.PI/2
        ){
            toVP-=Math.PI;
        }


        while(
            toVP<-Math.PI/2
        ){
            toVP+=Math.PI;
        }


        var ad =
        angleDifference(
            toVP,
            L.angle
        );


        if(ad>.27){
            continue;
        }


        var distanceScore =
        1-
        clamp(
            dist/(AW*.065),
            0,
            1
        );


        distanceScore *=
        distanceScore;


        var angleScore =
        1-
        clamp(
            ad/.27,
            0,
            1
        );


        var radial =
        Math.hypot(
            L.x-vx,
            L.y-vy
        );


        var radialScore =
        clamp(
            radial/(AW*.34),
            .25,
            1
        );


        var vote =
        L.weight
        *
        (
            .35+
            distanceScore*.65
        )
        *
        (
            .45+
            angleScore*.55
        )
        *
        radialScore;


        var key =
        L.regionX+
        "_"+
        L.regionY;


        if(
            !regionBest[key] ||
            vote>
            regionBest[key].vote
        ){

            regionBest[key] = {

                line:L,
                vote:vote

            };

        }

    }


    var accepted = [];


    for(
        var key in regionBest
    ){

        accepted.push(
            regionBest[key]
        );

    }


    if(
        accepted.length<4
    ){

        return null;

    }


    var total = 0;

    var leftWeight = 0;
    var rightWeight = 0;

    var nearWeight = 0;
    var middleWeight = 0;
    var farWeight = 0;

    var minX = 9999;
    var maxX = -9999;

    var lowerMinX = 9999;
    var lowerMaxX = -9999;

    var upperMinX = 9999;
    var upperMaxX = -9999;


    for(
        var a=0;
        a<accepted.length;
        a++
    ){

        var item =
        accepted[a];

        var L =
        item.line;

        var vote =
        item.vote;


        total += vote;


        minX =
        Math.min(
            minX,
            L.x
        );


        maxX =
        Math.max(
            maxX,
            L.x
        );


        if(
            L.x<
            vx-AW*.025
        ){

            leftWeight +=
            vote;

        }
        else
        if(
            L.x>
            vx+AW*.025
        ){

            rightWeight +=
            vote;

        }


        var relativeY =
        (L.y-vy)/
        Math.max(
            1,
            AH-vy
        );


        if(
            relativeY>.58
        ){

            nearWeight +=
            vote;


            lowerMinX =
            Math.min(
                lowerMinX,
                L.x
            );


            lowerMaxX =
            Math.max(
                lowerMaxX,
                L.x
            );

        }
        else
        if(
            relativeY>.25
        ){

            middleWeight +=
            vote;

        }
        else{

            farWeight +=
            vote;


            upperMinX =
            Math.min(
                upperMinX,
                L.x
            );


            upperMaxX =
            Math.max(
                upperMaxX,
                L.x
            );

        }

    }


    /*
    左右都要有
    */

    if(
        leftWeight<=0 ||
        rightWeight<=0
    ){

        return null;

    }


    /*
    中近段不能太少
    */

    if(
        nearWeight+
        middleWeight
        <
        total*.30
    ){

        return null;

    }


    var balance =
    Math.min(
        leftWeight,
        rightWeight
    )
    /
    Math.max(
        leftWeight,
        rightWeight
    );


    var horizontalSpan =
    maxX-minX;


    var spanScore =
    clamp(
        horizontalSpan/
        (AW*.62),
        .15,
        1
    );


    var bandCount = 0;


    if(farWeight>0){
        bandCount++;
    }

    if(middleWeight>0){
        bandCount++;
    }

    if(nearWeight>0){
        bandCount++;
    }


    var verticalScore =
    bandCount/3;


    /*
    基本近寬遠窄
    */

    var narrowingScore =
    .62;


    if(
        lowerMaxX>
        lowerMinX
        &&
        upperMaxX>
        upperMinX
    ){

        var lowerWidth =
        lowerMaxX-
        lowerMinX;


        var upperWidth =
        upperMaxX-
        upperMinX;


        if(
            lowerWidth>
            AW*.12
        ){

            var ratio =
            upperWidth/
            lowerWidth;


            narrowingScore =
            clamp(
                1-ratio*.75,
                .25,
                1
            );

        }

    }
    else
    if(
        nearWeight>0 &&
        middleWeight>0
    ){

        narrowingScore =
        .78;

    }


    /*
    景深證據
    */

    var depthEvidence =
    (
        nearWeight*1.26
        +
        middleWeight*1.02
        +
        farWeight*.36
    )
    /
    Math.max(
        total,
        .0001
    );


    depthEvidence =
    clamp(
        depthEvidence,
        .32,
        1.16
    );


    /*
    X 邊緣降權
    */

    var nx =
    vx/AW;


    var edgePenalty = 1;


    if(
        nx<.13 ||
        nx>.87
    ){

        edgePenalty =
        .72;

    }
    else
    if(
        nx<.20 ||
        nx>.80
    ){

        edgePenalty =
        .88;

    }


    /*
    =====================================================
    地平線約束

    V5.8.5 比 V5.8.4.1 稍微放鬆，
    因為現在道路走廊本身會驗證真假。

    不希望單純靠 Y 高度決定答案。
    =====================================================
    */

    var ny =
    vy/AH;


    var horizonPenalty =
    1;


    if(ny<.18){

        horizonPenalty =
        .48;

    }
    else
    if(ny<.26){

        horizonPenalty =
        .67;

    }
    else
    if(ny<.33){

        horizonPenalty =
        .84;

    }


    var lowPenalty = 1;


    if(ny>.74){

        lowPenalty =
        .58;

    }
    else
    if(ny>.67){

        lowPenalty =
        .80;

    }


    /*
    =====================================================
    V5.8.5
    真正道路走廊驗證
    =====================================================
    */

    var corridor =
    corridorValidation(
        vx,
        vy,
        accepted
    );


    /*
    corridor.score：

    1.0 = 非常像道路 V 型
    0.2 = 很不像

    不直接乘 score，
    否則弱道路可能被判死。

    使用 0.42 ~ 1.18 的倍率。
    */

    var corridorFactor =
    .42+
    corridor.score*.76;


    /*
    如果有完整三層：
    遠 / 中 / 近
    再小幅獎勵。
    */

    if(
        corridor.validBands===3
        &&
        corridor.expansion>.58
    ){

        corridorFactor *=
        1.08;

    }


    /*
    如果只有兩層，
    不判死，但不能拿滿分。
    */

    if(
        corridor.validBands<2
    ){

        corridorFactor *=
        .72;

    }


    var bilateral =
    Math.sqrt(
        leftWeight*
        rightWeight
    );


    var score =
    bilateral
    *
    (
        .40+
        balance*.60
    )
    *
    (
        .42+
        spanScore*.58
    )
    *
    (
        .48+
        verticalScore*.52
    )
    *
    (
        .50+
        narrowingScore*.50
    )
    *
    depthEvidence
    *
    edgePenalty
    *
    horizonPenalty
    *
    lowPenalty
    *
    corridorFactor;


    return{

        score:score,

        accepted:
        accepted,

        balance:
        balance,

        spanScore:
        spanScore,

        verticalScore:
        verticalScore,

        narrowingScore:
        narrowingScore,

        depthEvidence:
        depthEvidence,

        corridorScore:
        corridor.score,

        corridor:
        corridor

    };

}


/* =========================================================
   LINE INTERSECTION
========================================================= */

function lineIntersection(A,B){

    var dx1 =
    Math.cos(A.angle);

    var dy1 =
    Math.sin(A.angle);

    var dx2 =
    Math.cos(B.angle);

    var dy2 =
    Math.sin(B.angle);


    var denominator =
    dx1*dy2-
    dy1*dx2;


    if(
        Math.abs(denominator)
        <
        .00001
    ){

        return null;

    }


    var rx =
    B.x-A.x;

    var ry =
    B.y-A.y;


    var t =
    (
        rx*dy2-
        ry*dx2
    )
    /
    denominator;


    return{

        x:
        A.x+
        t*dx1,

        y:
        A.y+
        t*dy1

    };

}


/* =========================================================
   REFINE VP
========================================================= */

function refineVP(
    vx,
    vy,
    accepted
){

    var left = [];
    var right = [];


    for(
        var i=0;
        i<accepted.length;
        i++
    ){

        var L =
        accepted[i].line;


        if(
            lineDistance(
                vx,
                vy,
                L
            )
            >
            AW*.055
        ){
            continue;
        }


        if(
            L.x<
            vx-AW*.02
        ){

            left.push(L);

        }
        else
        if(
            L.x>
            vx+AW*.02
        ){

            right.push(L);

        }

    }


    var points = [];


    for(
        var a=0;
        a<left.length;
        a++
    ){

        for(
            var b=0;
            b<right.length;
            b++
        ){

            var ad =
            angleDifference(
                left[a].angle,
                right[b].angle
            );


            if(ad<.16){
                continue;
            }


            var p =
            lineIntersection(
                left[a],
                right[b]
            );


            if(!p){
                continue;
            }


            if(
                Math.abs(
                    p.x-vx
                )
                >
                AW*.10
                ||
                Math.abs(
                    p.y-vy
                )
                >
                AH*.10
            ){

                continue;

            }


            points.push(p);

        }

    }


    if(points.length<2){

        return{
            x:vx,
            y:vy
        };

    }


    var mx =
    median(
        points.map(
            function(p){
                return p.x;
            }
        )
    );


    var my =
    median(
        points.map(
            function(p){
                return p.y;
            }
        )
    );


    var dx =
    mx-vx;

    var dy =
    my-vy;


    var d =
    Math.hypot(
        dx,
        dy
    );


    var maxStep =
    AW*.045;


    if(d>maxStep){

        var s =
        maxStep/d;

        dx*=s;
        dy*=s;

    }


    return{

        x:vx+dx,
        y:vy+dy

    };

}


/* =========================================================
   MAIN ANALYSIS
========================================================= */

function analyzeDepthVanishingPoint(){

    if(video.readyState<2){
        return null;
    }


    ax.drawImage(
        video,
        0,
        0,
        AW,
        AH
    );


    var image =
    ax.getImageData(
        0,
        0,
        AW,
        AH
    );


    var data =
    image.data;


    var gray =
    new Float32Array(
        AW*AH
    );


    /*
    GRAYSCALE
    */

    for(
        var i=0;
        i<AW*AH;
        i++
    ){

        var p=i*4;


        gray[i] =
        data[p]*.299
        +
        data[p+1]*.587
        +
        data[p+2]*.114;

    }


    /*
    SOBEL
    */

    var magnitude =
    new Float32Array(
        AW*AH
    );


    var edgeAngle =
    new Float32Array(
        AW*AH
    );


    var values = [];


    for(
        var y=1;
        y<AH-1;
        y++
    ){

        for(
            var x=1;
            x<AW-1;
            x++
        ){

            var id =
            y*AW+x;


            var gx =

            -gray[id-AW-1]
            +
            gray[id-AW+1]

            -

            2*gray[id-1]
            +
            2*gray[id+1]

            -

            gray[id+AW-1]
            +
            gray[id+AW+1];


            var gy =

            -gray[id-AW-1]
            -
            2*gray[id-AW]
            -
            gray[id-AW+1]

            +

            gray[id+AW-1]
            +
            2*gray[id+AW]
            +
            gray[id+AW+1];


            var mag =
            Math.hypot(
                gx,
                gy
            );


            magnitude[id] =
            mag;


            var a =
            Math.atan2(
                gy,
                gx
            )
            +
            Math.PI/2;


            while(
                a>Math.PI/2
            ){
                a-=Math.PI;
            }


            while(
                a<-Math.PI/2
            ){
                a+=Math.PI;
            }


            edgeAngle[id] =
            a;


            values.push(mag);

        }

    }


    if(values.length===0){
        return null;
    }


    values.sort(
        function(a,b){
            return a-b;
        }
    );


    var threshold =
    values[
        Math.floor(
            values.length*.895
        )
    ];


    if(
        !threshold ||
        threshold<16
    ){

        return null;

    }


    /*
    LINE EXTRACTION
    */

    var lines =
    extractLines(
        magnitude,
        edgeAngle,
        threshold
    );


    if(lines.length<8){
        return null;
    }


    /*
    =====================================================
    VP 粗搜尋

    V5.8.5 不再把搜尋高度限制太死。

    讓：
    線收斂
    +
    道路走廊

    共同決定 VP。
    =====================================================
    */

    var best = null;


    for(
        var gy=AH*.14;
        gy<=AH*.74;
        gy+=8
    ){

        for(
            var gx=AW*.07;
            gx<=AW*.93;
            gx+=8
        ){

            var result =
            scoreCandidateVP(
                gx,
                gy,
                lines
            );


            if(!result){
                continue;
            }


            if(
                !best ||
                result.score>
                best.score
            ){

                best = {

                    x:gx,
                    y:gy,

                    score:
                    result.score,

                    result:
                    result

                };

            }

        }

    }


    if(!best){
        return null;
    }


    /*
    =====================================================
    細搜尋
    =====================================================
    */

    var fineBest =
    best;


    for(
        var fy=
        best.y-12;
        fy<=best.y+12;
        fy+=2
    ){

        if(
            fy<AH*.10 ||
            fy>AH*.77
        ){
            continue;
        }


        for(
            var fx=
            best.x-12;
            fx<=best.x+12;
            fx+=2
        ){

            if(
                fx<AW*.04 ||
                fx>AW*.96
            ){
                continue;
            }


            var fine =
            scoreCandidateVP(
                fx,
                fy,
                lines
            );


            if(!fine){
                continue;
            }


            if(
                fine.score>
                fineBest.score
            ){

                fineBest = {

                    x:fx,
                    y:fy,

                    score:
                    fine.score,

                    result:
                    fine

                };

            }

        }

    }


    /*
    =====================================================
    INTERSECTION REFINE
    =====================================================
    */

    var refined =
    refineVP(
        fineBest.x,
        fineBest.y,
        fineBest.result.accepted
    );


    var vx =
    clamp(
        refined.x,
        AW*.04,
        AW*.96
    );


    var vy =
    clamp(
        refined.y,
        AH*.09,
        AH*.78
    );


    /*
    精修後重新驗證
    */

    var finalCheck =
    scoreCandidateVP(
        vx,
        vy,
        lines
    );


    if(!finalCheck){

        vx =
        fineBest.x;

        vy =
        fineBest.y;

        finalCheck =
        fineBest.result;

    }
    else{

        /*
        如果精修後的道路走廊分數
        明顯比 fineBest 更差，
        不接受精修。

        避免交點精修把 VP
        又拉回樹冠。
        */

        if(
            finalCheck.corridorScore
            <
            fineBest.result.corridorScore-.12
        ){

            vx =
            fineBest.x;

            vy =
            fineBest.y;

            finalCheck =
            fineBest.result;

        }

    }


    /*
    =====================================================
    CONFIDENCE

    注意：
    仍是「辨識信心」
    不是照片美感分數。
    =====================================================
    */

    var balance =
    finalCheck.balance;


    var span =
    finalCheck.spanScore;


    var vertical =
    finalCheck.verticalScore;


    var narrowing =
    finalCheck.narrowingScore;


    var depth =
    clamp(
        finalCheck.depthEvidence,
        0,
        1
    );


    var corridor =
    clamp(
        finalCheck.corridorScore,
        0,
        1
    );


    /*
    V5.8.5：
    corridor 正式進 confidence。
    */

    var conf =

    .12

    +

    balance*.18

    +

    span*.14

    +

    vertical*.12

    +

    narrowing*.13

    +

    depth*.12

    +

    corridor*.19;


    conf =
    clamp(
        conf,
        .20,
        .97
    );


    return{

        vx:
        vx/AW,

        vy:
        vy/AH,

        confidence:
        conf,

        corridor:
        corridor

    };

}


/* =========================================================
   DRAW POINT
========================================================= */

function drawDetectedPoint(){

    if(!detectedPoint){
        return;
    }


    var w =
    overlay.clientWidth;

    var h =
    overlay.clientHeight;


    var x =
    detectedPoint.vx*w;

    var y =
    detectedPoint.vy*h;


    ctx.save();


    ctx.strokeStyle =
    "#2cff67";

    ctx.fillStyle =
    "#2cff67";

    ctx.lineWidth =
    4;

    ctx.setLineDash([]);


    /*
    外圈
    */

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        25,
        0,
        Math.PI*2
    );

    ctx.stroke();


    /*
    中心
    */

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        9,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
    十字
    */

    ctx.lineWidth =
    3;

    ctx.beginPath();


    ctx.moveTo(
        x-43,
        y
    );

    ctx.lineTo(
        x-30,
        y
    );


    ctx.moveTo(
        x+30,
        y
    );

    ctx.lineTo(
        x+43,
        y
    );


    ctx.moveTo(
        x,
        y-43
    );

    ctx.lineTo(
        x,
        y-30
    );


    ctx.moveTo(
        x,
        y+30
    );

    ctx.lineTo(
        x,
        y+43
    );


    ctx.stroke();


    /*
    LABEL
    */

    ctx.font =
    "bold 16px -apple-system,Arial";

    ctx.textAlign =
    "center";

    ctx.fillStyle =
    "#2cff67";


    ctx.fillText(
        "● AI 消失點",
        x,
        y-50
    );


    ctx.restore();

}


/* =========================================================
   RESIZE
========================================================= */

function resizeOverlay(){

    var rect =
    overlay.getBoundingClientRect();


    var dpr =
    window.devicePixelRatio ||
    1;


    overlay.width =
    Math.round(
        rect.width*dpr
    );


    overlay.height =
    Math.round(
        rect.height*dpr
    );


    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

}


/* =========================================================
   DRAW LOOP
========================================================= */

function loop(){

    ctx.clearRect(
        0,
        0,
        overlay.clientWidth,
        overlay.clientHeight
    );


    drawDetectedPoint();


    requestAnimationFrame(
        loop
    );

}


/* =========================================================
   ZOOM
========================================================= */

zoom.addEventListener(
    "input",
    async function(){

        var value =
        Number(
            this.value
        );


        zoomText.innerText =
        value.toFixed(1)+
        "×";


        if(!stream){
            return;
        }


        var tracks =
        stream.getVideoTracks();


        if(tracks.length===0){
            return;
        }


        var track =
        tracks[0];


        if(
            !track.getCapabilities
        ){
            return;
        }


        var capabilities =
        track.getCapabilities();


        if(
            !capabilities.zoom
        ){
            return;
        }


        try{

            var actualZoom =
            clamp(
                value,
                capabilities.zoom.min,
                capabilities.zoom.max
            );


            await track.applyConstraints({

                advanced:[
                    {
                        zoom:
                        actualZoom
                    }
                ]

            });

        }
        catch(error){

            console.log(
                "Zoom unsupported",
                error
            );

        }

    }
);


/* =========================================================
   ERROR
========================================================= */

window.onerror =
function(
    message,
    source,
    line
){

    console.log(
        message,
        source,
        line
    );


    messageEl.innerText =
    "⚠️ 程式錯誤："+
    message+
    "｜第"+
    line+
    "行";


    return false;

};


window.addEventListener(
    "unhandledrejection",
    function(event){

        console.log(
            event.reason
        );


        messageEl.innerText =
        "⚠️ 執行錯誤，請重新整理";

    }
);


/* =========================================================
   EVENTS
========================================================= */

window.addEventListener(
    "resize",
    resizeOverlay
);


window.addEventListener(
    "orientationchange",
    function(){

        setTimeout(
            resizeOverlay,
            250
        );

    }
);


/* =========================================================
   START
========================================================= */

startCamera();

requestAnimationFrame(
    loop
);

</script>
