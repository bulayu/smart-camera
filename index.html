<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AI 載入測試</title>

    <style>
        body {
            background: black;
            color: white;
            text-align: center;
            font-family: Arial;
            padding-top: 50px;
        }

        #status {
            font-size: 24px;
            margin: 20px;
        }

        #detail {
            font-size: 16px;
            color: #ccc;
            padding: 20px;
            word-break: break-all;
        }
    </style>
</head>

<body>

<h2>阿策 AI 測試</h2>

<div id="status">
    AI 載入中...
</div>

<div id="detail"></div>


<script type="module">

const status =
    document.getElementById("status");

const detail =
    document.getElementById("detail");


try {

    status.innerText =
        "正在下載 MediaPipe...";

    const vision =
        await import(
            "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/+esm"
        );

    status.innerText =
        "MediaPipe 已下載，正在啟動...";

    const {
        FilesetResolver
    } = vision;

    const resolver =
        await FilesetResolver.forVisionTasks(
            "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm"
        );

    status.innerText =
        "✅ AI 基礎載入成功";

    detail.innerText =
        "MediaPipe 可以在這支手機上執行。";

}

catch(error) {

    status.innerText =
        "❌ AI 載入失敗";

    detail.innerText =
        String(error);

    console.error(error);
}

</script>

</body>

</html>
