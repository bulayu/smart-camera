<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000">
<title>阿策構圖助手 V9.2</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif}
#app{position:fixed;inset:0}video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#111}
canvas{display:none}.top{position:absolute;top:max(16px,env(safe-area-inset-top));left:18px;right:18px;display:flex;justify-content:space-between;pointer-events:none}
.pill{padding:10px 15px;border-radius:18px;background:rgba(20,20,20,.76);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(12px);font-weight:800}
#status{display:none;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(82vw,340px);padding:18px;border-radius:20px;background:rgba(18,18,18,.9);text-align:center;border:1px solid rgba(255,255,255,.15)}
#status b{font-size:19px;display:block;margin-bottom:6px}#status small{color:#ccc;line-height:1.45}
#card{display:none;position:absolute;left:18px;right:18px;bottom:calc(98px + env(safe-area-inset-bottom));padding:18px;border-radius:24px;background:rgba(18,18,18,.9);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(16px)}
#title{font-size:21px;font-weight:900;margin-bottom:8px}#summary{font-size:16px;line-height:1.45}#detail{font-size:14px;line-height:1.5;color:#d5d5d5;margin-top:9px}
#tech{font-size:12px;color:#aaa;margin-top:10px;padding-top:9px;border-top:1px solid rgba(255,255,255,.14)}
.badge{display:inline-block;margin-right:7px;padding:5px 8px;border-radius:9px;background:rgba(81,229,139,.16);color:#51e58b;font-size:14px}
.controls{position:absolute;left:18px;right:18px;bottom:max(18px,env(safe-area-inset-bottom));display:flex;gap:10px}
button{border:0;border-radius:20px;padding:15px 18px;font-size:17px;font-weight:900}#flip{width:34%;color:#fff;background:rgba(35,35,35,.9);border:1px solid rgba(255,255,255,.16)}#smart{flex:1;background:#fff;color:#111}button:disabled{opacity:.55}
</style>
</head>
<body><div id="app">
<video id="video" playsinline autoplay muted></video><canvas id="shot"></canvas>
<div class="top"><div class="pill">阿策構圖助手</div><div class="pill">V9.2</div></div>
<div id="status"><b id="st">準備本機模型</b><small id="ss"></small></div>
<div id="card"><div id="title"></div><div id="summary"></div><div id="detail"></div><div id="tech"></div></div>
<div class="controls"><button id="flip">切換鏡頭</button><button id="smart">智慧構圖</button></div>
</div>
<script type="module">
const MODEL="HuggingFaceTB/SmolVLM-256M-Instruct";
const video=document.querySelector("#video"),canvas=document.querySelector("#shot"),flip=document.querySelector("#flip"),smart=document.querySelector("#smart");
const status=document.querySelector("#status"),st=document.querySelector("#st"),ss=document.querySelector("#ss"),card=document.querySelector("#card");
const title=document.querySelector("#title"),summary=document.querySelector("#summary"),detail=document.querySelector("#detail"),tech=document.querySelector("#tech");
let facing="environment",stream=null,pipe=null,loading=null;
function show(a,b=""){st.textContent=a;ss.textContent=b;status.style.display="block"} function hide(){status.style.display="none"}
async function camera(){if(stream)stream.getTracks().forEach(x=>x.stop());try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facing},width:{ideal:1280},height:{ideal:1280}},audio:false});video.srcObject=stream;await video.play()}catch(e){show("無法開啟相機","請確認 Safari 相機權限與 HTTPS。")}}
flip.onclick=async()=>{facing=facing==="environment"?"user":"environment";card.style.display="none";await camera()};
async function model(){
 if(pipe)return pipe;if(loading)return loading;
 loading=(async()=>{if(!("gpu" in navigator))throw new Error("目前瀏覽器沒有可用的 WebGPU。");
 show("正在準備本機模型","第一次使用會下載模型；之後由瀏覽器快取。");smart.disabled=true;
 const m=await import("https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1");m.env.allowLocalModels=false;
 pipe=await m.pipeline("image-to-text",MODEL,{device:"webgpu",dtype:"q4"});smart.disabled=false;hide();return pipe
 })().catch(e=>{loading=null;smart.disabled=false;throw e});return loading
}
function snap(){const w=video.videoWidth,h=video.videoHeight;if(!w||!h)throw new Error("相機尚未準備完成");const s=Math.min(1,640/Math.max(w,h));canvas.width=Math.round(w*s);canvas.height=Math.round(h*s);canvas.getContext("2d").drawImage(video,0,0,canvas.width,canvas.height);return new Promise((r,j)=>canvas.toBlob(b=>b?r(b):j(new Error("無法擷取畫面")),"image/jpeg",.82))}
function clean(x){return String(x||"").replace(/<[^>]*>/g," ").replace(/\s+/g," ").trim()}
function decide(d){const t=d.toLowerCase(),p=/person|people|man|woman|boy|girl|child|human|standing|sitting|portrait/.test(t),g=/people|two people|group|family|couple/.test(t),r=/road|street|path|walkway|corridor|hallway|stair|stairs|tunnel/.test(t),n=/tree|forest|mountain|sea|ocean|lake|sky|landscape|park|garden/.test(t),b=/building|architecture|room|interior|house|window|door/.test(t);
 if(p)return{a:g?"多人／群像":"人物主體",b:g?"群像三分構圖":"人物三分構圖",c:"人物是主要視覺重點，優先於背景線條。"};
 if(r)return{a:"縱深空間",b:"引導線構圖",c:"畫面具有道路、走道、樓梯或明顯延伸結構。"};
 if(n)return{a:"自然／戶外",b:"三分構圖",c:"以景物層次與天空／地景比例作為主要構圖依據。"};
 if(b)return{a:"室內／建築",b:"中央或三分構圖",c:"先以空間主體與建築結構建立穩定畫面。"};
 return{a:"主體不明確",b:"先選擇主體",c:"目前沒有足夠明確的攝影主體。"};
}
smart.onclick=async()=>{card.style.display="none";try{const p=await model();show("正在取景…","使用手機本機模型判讀，不呼叫付費 API。");const blob=await snap(),url=URL.createObjectURL(blob),t0=performance.now();let res;try{res=await p(url,{max_new_tokens:55})}finally{URL.revokeObjectURL(url)}
 let txt=Array.isArray(res)&&res[0]?(res[0].generated_text||res[0].text||""):(res?.generated_text||res?.text||"");txt=clean(txt);const c=decide(txt),sec=((performance.now()-t0)/1000).toFixed(1);
 title.innerHTML='<span class="badge">'+c.a+"</span>"+c.b;summary.textContent=c.c;detail.textContent=txt?"本機模型看到："+txt:"本機模型沒有產生可用描述。";tech.textContent="SmolVLM 256M｜本機推論 "+sec+" 秒｜付費 API：0 次";hide();card.style.display="block"
 }catch(e){hide();title.textContent="本機模型無法啟動";summary.textContent=e?.message||String(e);detail.textContent="V9.2 是網頁端可行性實驗；若 iPhone Safari 的 WebGPU 或記憶體不足，正式 App 會改用原生本機推論。";tech.textContent="V9.2｜本機視覺模型實驗";card.style.display="block"}};
camera();
</script></body></html>
