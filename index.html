<!DOCTYPE html>
<html lang="zh-TW">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               user-scalable=no,
               viewport-fit=cover">

<title>智慧構圖助手 V4.0</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: black;
    color: white;
    font-family: -apple-system,
                 BlinkMacSystemFont,
                 Arial,
                 sans-serif;
    text-align: center;
}

body {
    overflow-x: hidden;
}

#topBar {
    padding-top: max(8px, env(safe-area-inset-top));
    padding-bottom: 7px;
    background: black;
}

#title {
    font-size: 19px;
    font-weight: 600;
}

#status {
    margin-top: 4px;
    min-height: 18px;
    font-size: 13px;
    color: #aaaaaa;
}


/* =========================
   相機區
========================= */

#cameraBox {
    position: relative;

    width: 100%;
    max-width: 900px;

    margin: auto;

    background: #111;

    overflow: hidden;
}

#camera {
    display: block;

    width: 100%;
    height: auto;

    background: #111;
}

#overlay {
    position: absolute;

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    pointer-events: none;
}


/* =========================
   控制區
========================= */

#controls {
    padding: 10px 5px
             calc(14px + env(safe-area-inset-bottom));
}

button {
    border: 0;
    border-radius: 12px;

    margin: 4px;

    padding: 11px 15px;

    font-size: 16px;

    background: #292929;
    color: white;
}

.cameraButton {
    min-width: 118px;
}

#shutterButton {
    width: 72px;
    height: 72px;

    border-radius: 50%;

    padding: 0;

    margin: 8px 12px;

    font-size: 29px;

    border: 4px solid white;

    background: #222;
}


/* =========================
   預覽
========================= */

#photoPreview {
    display: none;

    width: 160px;
    max-width: 42%;

    margin: 8px 0 18px 0;

    border-radius: 9px;

    border: 2px solid white;
}

#photoCanvas,
#analysisCanvas {
    display: none;
}

</style>

</head>


<body>


<div id="topBar">

    <div id="title">
        📷 智慧構圖助手
    </div>

    <div id="status">
        AI 載入中...
    </div>

</div>


<div id="cameraBox">

    <video
        id="camera"
        autoplay
        muted
        playsinline>
    </video>

    <canvas id="overlay"></canvas>

</div>


<div id="controls">

    <button
        class="cameraButton"
        onclick="openFrontCamera()">
        🤳 前鏡頭
    </button>

    <button
        class="cameraButton"
        onclick="openRearCamera()">
        📷 後鏡頭
    </button>

    <br>

    <button
        id="shutterButton"
        onclick="takePhoto()">
        📸
    </button>

    <button onclick="stopCamera()">
        關閉
    </button>

</div>


<img id="photoPreview">


<canvas id="photoCanvas"></canvas>
<canvas id="analysisCanvas"></canvas>


<script type="module">

import {
    FaceDetector,
    ObjectDetector,
    FilesetResolver
}
from "https://unpkg.com/@mediapipe/tasks-vision@0.10.35/vision_bundle.mjs";


/* =====================================================
   AI
===================================================== */

let faceDetector = null;

let objectDetector = null;

let aiReady = false;


/* =====================================================
   相機
===================================================== */

let stream = null;

let cameraRunning = false;


/*
user = 前鏡頭
environment = 後鏡頭
*/
let currentMode = "environment";


let frontDeviceId = "";
let rearDeviceId = "";


/*
避免切鏡頭之後
舊的動畫循環繼續執行
*/
let cameraSession = 0;


/* =====================================================
   AI 執行控制
===================================================== */

let lastVideoTime = -1;

let lastObjectDetectTime = 0;

let lastSceneAnalysisTime = 0;


/*
手機目標框的位置
做平滑處理，
避免不停晃動。
*/
let smoothTargetX = null;
let smoothTargetY = null;


/*
目前是否已接近推薦位置
*/
let targetOK = false;


/* =====================================================
   HTML
===================================================== */

const video =
    document.getElementById("camera");


const overlay =
    document.getElementById("overlay");


const ctx =
    overlay.getContext("2d");


const statusText =
    document.getElementById("status");


const photoCanvas =
    document.getElementById("photoCanvas");


const photoCtx =
    photoCanvas.getContext("2d");


const photoPreview =
    document.getElementById("photoPreview");


const analysisCanvas =
    document.getElementById("analysisCanvas");


const analysisCtx =
    analysisCanvas.getContext(
        "2d",
        {
            willReadFrequently: true
        }
    );


/* =====================================================
   載入 AI
===================================================== */

async function loadAI() {

    try {

        statusText.innerText =
            "正在載入 AI...";


        const vision =
            await FilesetResolver.forVisionTasks(

                "https://unpkg.com/@mediapipe/tasks-vision@0.10.35/wasm"

            );


        /*
        =============================
        人臉 AI
        前鏡頭使用
        =============================
        */

        faceDetector =
            await FaceDetector.createFromOptions(

                vision,

                {

                    baseOptions: {

                        modelAssetPath:

                        "https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite"

                    },

                    runningMode:
                        "VIDEO",

                    minDetectionConfidence:
                        0.55

                }

            );


        /*
        =============================
        物件 AI
        後鏡頭使用
        =============================
        */

        objectDetector =
            await ObjectDetector.createFromOptions(

                vision,

                {

                    baseOptions: {

                        modelAssetPath:

                        "https://storage.googleapis.com/mediapipe-tasks/object_detector/efficientdet_lite0_uint8.tflite"

                    },

                    runningMode:
                        "VIDEO",

                    scoreThreshold:
                        0.48,

                    maxResults:
                        5

                }

            );


        aiReady =
            true;


        statusText.innerText =
            "✅ AI 已準備完成";

    }

    catch(error) {

        console.error(error);


        statusText.innerText =
            "❌ AI 載入失敗";

    }

}


/* =====================================================
   取得手機真正鏡頭
===================================================== */

async function prepareCameraDevices() {

    try {

        /*
        先要求一次權限
        */

        const tempStream =
            await navigator.mediaDevices
                .getUserMedia({

                    video: true,

                    audio: false

                });


        tempStream
            .getTracks()
            .forEach(
                track =>
                    track.stop()
            );


        const devices =
            await navigator.mediaDevices
                .enumerateDevices();


        const cameras =
            devices.filter(

                device =>
                    device.kind ===
                    "videoinput"

            );


        frontDeviceId =
            "";


        rearDeviceId =
            "";


        /*
        先找正常前 / 後鏡頭
        */

        for (
            const camera
            of cameras
        ) {

            const name =
                (
                    camera.label ||
                    ""
                )
                .toLowerCase();


            if (
                !frontDeviceId
                &&
                (
                    name.includes("front")
                    ||
                    name.includes("user")
                    ||
                    name.includes("前")
                )
            ) {

                frontDeviceId =
                    camera.deviceId;

            }


            const isRear =

                name.includes("back")

                ||

                name.includes("rear")

                ||

                name.includes("environment")

                ||

                name.includes("後");


            const specialLens =

                name.includes("ultra")

                ||

                name.includes("tele")

                ||

                name.includes("zoom");


            /*
            優先一般後鏡頭，
            不優先超廣角 / 望遠
            */

            if (
                !rearDeviceId
                &&
                isRear
                &&
                !specialLens
            ) {

                rearDeviceId =
                    camera.deviceId;

            }

        }


        /*
        如果找不到一般後鏡頭，
        找任意後鏡頭
        */

        if (
            !rearDeviceId
        ) {

            for (
                const camera
                of cameras
            ) {

                const name =
                    (
                        camera.label ||
                        ""
                    )
                    .toLowerCase();


                if (
                    name.includes("back")
                    ||
                    name.includes("rear")
                    ||
                    name.includes("後")
                ) {

                    rearDeviceId =
                        camera.deviceId;

                    break;

                }

            }

        }

    }

    catch(error) {

        console.log(
            error
        );

    }

}


/* =====================================================
   前鏡頭
===================================================== */

async function openFrontCamera() {

    currentMode =
        "user";


    await openCamera(
        "user"
    );

}


/* =====================================================
   後鏡頭
===================================================== */

async function openRearCamera() {

    currentMode =
        "environment";


    await openCamera(
        "environment"
    );

}


/* =====================================================
   開相機
===================================================== */

async function openCamera(mode) {

    if (!aiReady) {

        alert(
            "AI 還在載入，請稍等一下"
        );

        return;

    }


    if (
        !frontDeviceId
        &&
        !rearDeviceId
    ) {

        statusText.innerText =
            "正在取得相機權限...";


        await prepareCameraDevices();

    }


    /*
    舊循環失效
    */

    cameraSession++;


    const thisSession =
        cameraSession;


    cameraRunning =
        false;


    stopCurrentStream();


    try {

        let constraints;


        if (
            mode === "user"
            &&
            frontDeviceId
        ) {

            constraints = {

                video: {

                    deviceId: {

                        exact:
                            frontDeviceId

                    }

                },

                audio:
                    false

            };

        }


        else if (
            mode === "environment"
            &&
            rearDeviceId
        ) {

            constraints = {

                video: {

                    deviceId: {

                        exact:
                            rearDeviceId

                    }

                },

                audio:
                    false

            };

        }


        else {

            constraints = {

                video: {

                    facingMode: {

                        exact:
                            mode

                    }

                },

                audio:
                    false

            };

        }


        stream =
            await navigator.mediaDevices
                .getUserMedia(
                    constraints
                );

    }

    catch(error) {

        /*
        deviceId / exact 失敗時
        自動退回 facingMode
        */

        try {

            stream =
                await navigator.mediaDevices
                    .getUserMedia({

                        video: {

                            facingMode:
                                mode

                        },

                        audio:
                            false

                    });

        }

        catch(error2) {

            statusText.innerText =
                "❌ 無法開啟相機";

            return;

        }

    }


    video.srcObject =
        stream;


    await video.play();


    currentMode =
        mode;


    cameraRunning =
        true;


    lastVideoTime =
        -1;


    lastObjectDetectTime =
        0;


    lastSceneAnalysisTime =
        0;


    smoothTargetX =
        null;


    smoothTargetY =
        null;


    targetOK =
        false;


    statusText.innerText =

        mode === "user"

        ? "🤳 前鏡頭"

        : "📷 後鏡頭";


    requestAnimationFrame(

        () =>
            cameraLoop(
                thisSession
            )

    );

}


/* =====================================================
   停止串流
===================================================== */

function stopCurrentStream() {

    if (stream) {

        stream
            .getTracks()
            .forEach(
                track =>
                    track.stop()
            );


        stream =
            null;

    }

}


/* =====================================================
   關閉
===================================================== */

function stopCamera() {

    cameraSession++;


    cameraRunning =
        false;


    stopCurrentStream();


    video.srcObject =
        null;


    ctx.clearRect(
        0,
        0,
        overlay.width,
        overlay.height
    );


    statusText.innerText =
        "相機已關閉";


    smoothTargetX =
        null;


    smoothTargetY =
        null;

}


/* =====================================================
   主循環
===================================================== */

function cameraLoop(
    session
) {

    if (
        session !==
        cameraSession
    ) {

        return;

    }


    if (!cameraRunning) {

        return;

    }


    if (
        video.readyState >= 2
        &&
        video.videoWidth > 0
        &&
        video.videoHeight > 0
    ) {

        /*
        前鏡頭
        */

        if (
            currentMode ===
            "user"
        ) {

            processFrontCamera();

        }


        /*
        後鏡頭
        */

        else {

            processRearCamera();

        }

    }


    drawTarget();


    requestAnimationFrame(

        () =>
            cameraLoop(
                session
            )

    );

}


/* =====================================================
   前鏡頭

   只偵測臉，
   不畫人臉框。

   AI 找到臉之後，
   只計算推薦構圖位置。
===================================================== */

function processFrontCamera() {

    if (
        video.currentTime ===
        lastVideoTime
    ) {

        return;

    }


    lastVideoTime =
        video.currentTime;


    let result;


    try {

        result =
            faceDetector.detectForVideo(

                video,

                performance.now()

            );

    }

    catch(error) {

        return;

    }


    if (
        !result.detections
        ||
        result.detections.length === 0
    ) {

        /*
        沒有人時，
        手機框先放中央偏上。
        */

        setSmoothTarget(
            video.clientWidth * 0.50,
            video.clientHeight * 0.38,
            false
        );


        return;

    }


    /*
    找最大的人臉
    */

    let bestFace =
        null;


    let bestArea =
        0;


    for (
        const detection
        of result.detections
    ) {

        const box =
            detection.boundingBox;


        const area =
            box.width *
            box.height;


        if (
            area >
            bestArea
        ) {

            bestArea =
                area;


            bestFace =
                box;

        }

    }


    if (!bestFace) {

        return;

    }


    const width =
        video.clientWidth;


    const height =
        video.clientHeight;


    const scaleX =
        width /
        video.videoWidth;


    const scaleY =
        height /
        video.videoHeight;


    const faceX =

        (
            bestFace.originX
            +
            bestFace.width / 2
        )

        *
        scaleX;


    const faceY =

        (
            bestFace.originY
            +
            bestFace.height / 2
        )

        *
        scaleY;


    /*
    =============================
    人像推薦位置

    人臉靠左 → 左上三分
    人臉靠右 → 右上三分
    =============================
    */

    const targetX =

        faceX <
        width / 2

        ?

        width * 0.34

        :

        width * 0.66;


    const targetY =
        height *
        0.34;


    /*
    判斷人物是否已接近目標
    */

    const distance =

        Math.hypot(

            faceX -
            targetX,

            faceY -
            targetY

        );


    const tolerance =

        Math.min(
            width,
            height
        )

        *
        0.14;


    const ok =
        distance <
        tolerance;


    setSmoothTarget(

        targetX,
        targetY,
        ok

    );

}


/* =====================================================
   後鏡頭

   1. 先找常見物件
   2. 有物件 → 用物件構圖
   3. 沒物件 → 自動畫面分析
===================================================== */

function processRearCamera() {

    const now =
        performance.now();


    /*
    Object Detector 是同步運算，
    不需要每一 frame 都跑。

    約每 300ms 一次即可。
    */

    if (
        now -
        lastObjectDetectTime
        <
        300
    ) {

        return;

    }


    lastObjectDetectTime =
        now;


    let result =
        null;


    try {

        result =
            objectDetector.detectForVideo(

                video,

                now

            );

    }

    catch(error) {

        console.log(error);

    }


    const subject =
        chooseMainSubject(
            result
        );


    /*
    =============================
    找到主要物件
    =============================
    */

    if (subject) {

        composeForObject(
            subject
        );


        return;

    }


    /*
    =============================
    沒找到物件

    改用畫面視覺分析
    =============================
    */

    analyzeScene();

}


/* =====================================================
   從 AI 辨識結果中
   選一個最像「主角」的物件
===================================================== */

function chooseMainSubject(
    result
) {

    if (
        !result
        ||
        !result.detections
        ||
        result.detections.length === 0
    ) {

        return null;

    }


    let best =
        null;


    let bestScore =
        -Infinity;


    for (
        const detection
        of result.detections
    ) {

        const box =
            detection.boundingBox;


        if (!box) {

            continue;

        }


        const category =
            detection.categories?.[0];


        const confidence =
            category?.score || 0;


        /*
        面積越大，
        越可能是主要拍攝主體
        */

        const area =
            box.width *
            box.height;


        const frameArea =
            video.videoWidth *
            video.videoHeight;


        const areaRatio =
            area /
            frameArea;


        /*
        太小的物件忽略
        */

        if (
            areaRatio <
            0.015
        ) {

            continue;

        }


        /*
        距離畫面中心
        */

        const centerX =
            box.originX +
            box.width / 2;


        const centerY =
            box.originY +
            box.height / 2;


        const nx =
            centerX /
            video.videoWidth;


        const ny =
            centerY /
            video.videoHeight;


        const centerDistance =

            Math.hypot(

                nx - 0.5,

                ny - 0.5

            );


        /*
        主角評分：

        面積
        +
        AI 信心
        +
        不要離畫面太遠
        */

        const score =

            areaRatio * 3

            +

            confidence

            -

            centerDistance * 0.35;


        if (
            score >
            bestScore
        ) {

            bestScore =
                score;


            best = {

                box:
                    box,

                category:
                    category?.categoryName || "",

                confidence:
                    confidence

            };

        }

    }


    return best;

}


/* =====================================================
   物件構圖
===================================================== */

function composeForObject(
    subject
) {

    const width =
        video.clientWidth;


    const height =
        video.clientHeight;


    const scaleX =
        width /
        video.videoWidth;


    const scaleY =
        height /
        video.videoHeight;


    const box =
        subject.box;


    const subjectX =

        (
            box.originX
            +
            box.width / 2
        )

        *
        scaleX;


    const subjectY =

        (
            box.originY
            +
            box.height / 2
        )

        *
        scaleY;


    /*
    ==================================
    推薦位置

    主體目前偏左 →
    放左三分點

    主體目前偏右 →
    放右三分點

    這樣手機框不會突然跨過
    整個畫面跑到另一側。
    ==================================
    */

    let targetX;


    if (
        subjectX <
        width / 2
    ) {

        targetX =
            width * 0.34;

    }

    else {

        targetX =
            width * 0.66;

    }


    /*
    人、動物等主體
    稍微放高一些。

    一般物件則接近中間三分區。
    */

    const upperSubjects = [

        "person",
        "dog",
        "cat",
        "bird",
        "horse",
        "sheep",
        "cow"
    ];


    const targetY =

        upperSubjects.includes(
            subject.category
        )

        ?

        height * 0.38

        :

        height * 0.50;


    /*
    是否已經接近 AI 推薦位置
    */

    const distance =

        Math.hypot(

            subjectX -
            targetX,

            subjectY -
            targetY

        );


    const tolerance =

        Math.min(
            width,
            height
        )

        *
        0.15;


    const ok =
        distance <
        tolerance;


    setSmoothTarget(

        targetX,
        targetY,
        ok

    );

}


/* =====================================================
   找不到物件時：
   自動畫面主體分析

   將畫面縮小，
   找「細節 / 明暗變化」
   比較集中的區域。

   不需要知道那是山、
   建築還是花。
===================================================== */

function analyzeScene() {

    const now =
        performance.now();


    if (
        now -
        lastSceneAnalysisTime
        <
        400
    ) {

        return;

    }


    lastSceneAnalysisTime =
        now;


    if (
        video.videoWidth === 0
        ||
        video.videoHeight === 0
    ) {

        return;

    }


    const w =
        120;


    const h =
        80;


    analysisCanvas.width =
        w;


    analysisCanvas.height =
        h;


    analysisCtx.drawImage(

        video,

        0,
        0,

        w,
        h

    );


    const image =
        analysisCtx.getImageData(

            0,
            0,

            w,
            h

        );


    const data =
        image.data;


    /*
    灰階
    */

    const gray =
        new Float32Array(
            w * h
        );


    for (
        let y = 0;
        y < h;
        y++
    ) {

        for (
            let x = 0;
            x < w;
            x++
        ) {

            const i =
                (
                    y * w +
                    x
                ) *
                4;


            gray[
                y * w +
                x
            ] =

                data[i] *
                0.299

                +

                data[i + 1] *
                0.587

                +

                data[i + 2] *
                0.114;

        }

    }


    /*
    把畫面切成 3 × 3。

    找細節最多的區塊。
    */

    const cols =
        3;


    const rows =
        3;


    let bestCol =
        1;


    let bestRow =
        1;


    let bestEnergy =
        -1;


    for (
        let row = 0;
        row < rows;
        row++
    ) {

        for (
            let col = 0;
            col < cols;
            col++
        ) {

            const startX =
                Math.floor(
                    col *
                    w /
                    cols
                );


            const endX =
                Math.floor(
                    (col + 1) *
                    w /
                    cols
                );


            const startY =
                Math.floor(
                    row *
                    h /
                    rows
                );


            const endY =
                Math.floor(
                    (row + 1) *
                    h /
                    rows
                );


            let energy =
                0;


            for (
                let y = startY + 1;
                y < endY - 1;
                y += 2
            ) {

                for (
                    let x = startX + 1;
                    x < endX - 1;
                    x += 2
                ) {

                    const center =
                        gray[
                            y * w +
                            x
                        ];


                    const right =
                        gray[
                            y * w +
                            x + 1
                        ];


                    const below =
                        gray[
                            (y + 1) *
                            w +
                            x
                        ];


                    energy +=

                        Math.abs(
                            center -
                            right
                        )

                        +

                        Math.abs(
                            center -
                            below
                        );

                }

            }


            /*
            讓中央區不要太容易
            一直被選中。

            稍微鼓勵三分構圖。
            */

            if (
                col === 1
                &&
                row === 1
            ) {

                energy *=
                    0.80;

            }


            if (
                energy >
                bestEnergy
            ) {

                bestEnergy =
                    energy;


                bestCol =
                    col;


                bestRow =
                    row;

            }

        }

    }


    const width =
        video.clientWidth;


    const height =
        video.clientHeight;


    /*
    如果主要視覺在左側，
    推薦左三分。

    在右側，
    推薦右三分。
    */

    let targetX;


    if (
        bestCol === 0
    ) {

        targetX =
            width * 0.34;

    }

    else if (
        bestCol === 2
    ) {

        targetX =
            width * 0.66;

    }

    else {

        /*
        中央主體時，
        選距離目前細節較近的一側。
        */

        targetX =
            width * 0.50;

    }


    let targetY;


    if (
        bestRow === 0
    ) {

        targetY =
            height * 0.34;

    }

    else if (
        bestRow === 2
    ) {

        targetY =
            height * 0.66;

    }

    else {

        targetY =
            height * 0.50;

    }


    /*
    純場景分析沒有明確物件中心，
    因此不直接判定綠色。

    保持白色推薦框。
    */

    setSmoothTarget(

        targetX,
        targetY,
        false

    );

}


/* =====================================================
   平滑手機框

   避免 AI 每次分析後
   框框突然跳位置
===================================================== */

function setSmoothTarget(
    x,
    y,
    ok
) {

    if (
        smoothTargetX ===
        null
    ) {

        smoothTargetX =
            x;


        smoothTargetY =
            y;

    }

    else {

        /*
        90% 舊位置
        10% 新位置

        所以移動會很柔和
        */

        smoothTargetX =

            smoothTargetX *
            0.90

            +

            x *
            0.10;


        smoothTargetY =

            smoothTargetY *
            0.90

            +

            y *
            0.10;

    }


    targetOK =
        ok;

}


/* =====================================================
   畫唯一的 AI 提示

   只畫：
   「手機輪廓」

   不畫其他任何線或框。
===================================================== */

function drawTarget() {

    const width =
        video.clientWidth;


    const height =
        video.clientHeight;


    overlay.width =
        width;


    overlay.height =
        height;


    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    if (
        smoothTargetX ===
        null
        ||
        smoothTargetY ===
        null
    ) {

        return;

    }


    /*
    手機框大小依螢幕自動調整
    */

    const phoneWidth =

        Math.max(

            42,

            Math.min(
                width,
                height
            )
            *
            0.13

        );


    const phoneHeight =
        phoneWidth *
        1.85;


    let x =
        smoothTargetX -
        phoneWidth / 2;


    let y =
        smoothTargetY -
        phoneHeight / 2;


    /*
    不讓手機框跑出畫面
    */

    const margin =
        10;


    x =
        Math.max(

            margin,

            Math.min(

                width -
                phoneWidth -
                margin,

                x

            )

        );


    y =
        Math.max(

            margin,

            Math.min(

                height -
                phoneHeight -
                margin,

                y

            )

        );


    /*
    白色 =
    推薦位置

    綠色 =
    主體已接近推薦位置
    */

    ctx.strokeStyle =

        targetOK

        ?

        "#46ff73"

        :

        "rgba(255,255,255,0.95)";


    ctx.lineWidth =
        targetOK
        ? 5
        : 4;


    ctx.shadowColor =
        "rgba(0,0,0,0.7)";


    ctx.shadowBlur =
        6;


    /*
    手機外框
    */

    roundRect(

        ctx,

        x,
        y,

        phoneWidth,
        phoneHeight,

        phoneWidth *
        0.16

    );


    ctx.stroke();


    /*
    上方聽筒
    */

    ctx.beginPath();


    ctx.moveTo(

        x +
        phoneWidth *
        0.36,

        y +
        phoneHeight *
        0.08

    );


    ctx.lineTo(

        x +
        phoneWidth *
        0.64,

        y +
        phoneHeight *
        0.08

    );


    ctx.lineWidth =
        3;


    ctx.stroke();


    /*
    下方 Home 圓圈

    做成舊式手機符號，
    看起來更像「手機框」。
    */

    ctx.beginPath();


    ctx.arc(

        x +
        phoneWidth / 2,

        y +
        phoneHeight *
        0.91,

        phoneWidth *
        0.07,

        0,

        Math.PI * 2

    );


    ctx.lineWidth =
        2.5;


    ctx.stroke();


    /*
    清除陰影設定
    */

    ctx.shadowBlur =
        0;

}


/* =====================================================
   圓角矩形
===================================================== */

function roundRect(
    context,
    x,
    y,
    width,
    height,
    radius
) {

    radius =
        Math.min(

            radius,

            width / 2,

            height / 2

        );


    context.beginPath();


    context.moveTo(
        x + radius,
        y
    );


    context.lineTo(
        x + width - radius,
        y
    );


    context.quadraticCurveTo(

        x + width,
        y,

        x + width,
        y + radius

    );


    context.lineTo(
        x + width,
        y + height - radius
    );


    context.quadraticCurveTo(

        x + width,
        y + height,

        x + width - radius,
        y + height

    );


    context.lineTo(
        x + radius,
        y + height
    );


    context.quadraticCurveTo(

        x,
        y + height,

        x,
        y + height - radius

    );


    context.lineTo(
        x,
        y + radius
    );


    context.quadraticCurveTo(

        x,
        y,

        x + radius,
        y

    );


    context.closePath();

}


/* =====================================================
   拍照
===================================================== */

function takePhoto() {

    if (
        !cameraRunning
        ||
        video.videoWidth === 0
    ) {

        alert(
            "請先開啟相機"
        );

        return;

    }


    photoCanvas.width =
        video.videoWidth;


    photoCanvas.height =
        video.videoHeight;


    /*
    只拍原始照片。

    AI 手機框不會出現在照片裡。
    */

    photoCtx.drawImage(

        video,

        0,
        0,

        photoCanvas.width,
        photoCanvas.height

    );


    const imageData =
        photoCanvas.toDataURL(

            "image/jpeg",

            0.94

        );


    photoPreview.src =
        imageData;


    photoPreview.style.display =
        "inline-block";


    statusText.innerText =
        "📸 拍照完成";

}


/* =====================================================
   HTML 按鈕
===================================================== */

window.openFrontCamera =
    openFrontCamera;


window.openRearCamera =
    openRearCamera;


window.takePhoto =
    takePhoto;


window.stopCamera =
    stopCamera;


/* =====================================================
   啟動
===================================================== */

loadAI();

</script>
