<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>AI 構圖助手 V5.7</title>

<style>

*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    color:white;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial;
}

#cameraArea{
    position:relative;
    height:72%;
    width:100%;
    overflow:hidden;
    background:#111;
}

video{
    position:absolute;
    width:100%;
    height:100%;
    object-fit:cover;
}

#overlay{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
}

#analysisCanvas{
    display:none;
}

#info{
    position:absolute;
    top:18px;
    left:16px;

    z-index:10;

    min-width:225px;

    padding:14px 18px;

    background:rgba(0,0,0,.72);

    border-radius:20px;
}

#score{
    font-size:42px;
    font-weight:750;
}

#score small{
    font-size:16px;
    opacity:.7;
}

#composition{
    font-size:21px;
    font-weight:700;
    margin-top:4px;
}

#desc{
    font-size:13px;
    opacity:.85;
    margin-top:6px;
}

#message{
    position:absolute;

    bottom:18px;
    left:50%;

    transform:translateX(-50%);

    width:90%;

    padding:14px;

    background:rgba(0,0,0,.78);

    border-radius:18px;

    text-align:center;

    font-size:16px;
    font-weight:700;

    z-index:10;
}

#version{
    position:absolute;
    left:8px;
    bottom:5px;
    opacity:.55;
    font-size:11px;
}

#controls{
    height:28%;
    padding:13px;
    background:#000;
}

#cameraButtons{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-bottom:11px;
}

button{
    color:white;
    border:none;
}

.cameraBtn{
    padding:10px 18px;
    background:#292929;
    border-radius:23px;
    font-size:15px;
}

#modes{
    display:flex;
    gap:8px;
    overflow-x:auto;
    margin-bottom:12px;
}

.mode{
    flex:none;
    padding:10px 16px;

    border:1px solid #555;

    background:#111;
    color:#ddd;

    border-radius:24px;

    font-size:15px;
}

.mode.active{
    background:white;
    color:black;
    font-weight:bold;
}

#zoomRow{
    display:flex;
    gap:10px;
    align-items:center;
}

#zoom{
    flex:1;
}

</style>
</head>

<body>

<div id="cameraArea">

<video
id="video"
autoplay
playsinline
muted>
</video>

<canvas id="overlay"></canvas>

<canvas
id="analysisCanvas"
width="240"
height="180">
</canvas>


<div id="info">

<div id="score">
--
<small>/100</small>
</div>

<div id="composition">
等待分析
</div>

<div id="desc">
先固定鏡頭，再按 AI 自動
</div>

</div>


<div id="message">
✨ 按 AI 自動分析目前畫面
</div>


<div id="version">
V5.7
</div>

</div>


<div id="controls">

<div id="cameraButtons">

<button
class="cameraBtn"
onclick="changeCamera('user')">
🤳 前鏡頭
</button>

<button
class="cameraBtn"
onclick="changeCamera('environment')">
📷 後鏡頭
</button>

</div>


<div id="modes">

<button
class="mode active"
onclick="runAI(this)">
✨ AI 自動
</button>

<button
class="mode"
onclick="manualMode('v',this)">
V 型
</button>

<button
class="mode"
onclick="manualMode('inverseV',this)">
▽ 倒 V
</button>

<button
class="mode"
onclick="manualMode('leading',this)">
↗ 引導線
</button>

</div>


<div id="zoomRow">

<span>倍率</span>

<input
id="zoom"
type="range"
min="1"
max="3"
step=".1"
value="1">

<span id="zoomText">
1.0×
</span>

</div>

</div>


<script>

/* =========================================
   DOM
========================================= */

const video =
document.getElementById("video");

const overlay =
document.getElementById("overlay");

const ctx =
overlay.getContext("2d");

const ac =
document.getElementById("analysisCanvas");

const ax =
ac.getContext(
    "2d",
    {willReadFrequently:true}
);

const scoreEl =
document.getElementById("score");

const compositionEl =
document.getElementById("composition");

const descEl =
document.getElementById("desc");

const messageEl =
document.getElementById("message");

const zoom =
document.getElementById("zoom");

const zoomText =
document.getElementById("zoomText");


/* =========================================
   STATE
========================================= */

let stream = null;

let facing =
"environment";

let navigation =
false;

let lockedMode =
null;


/*
這是關鍵：

AI分析完成後，
targetGuide 就鎖住。

之後不再每幀亂改消失點。
*/

let targetGuide = null;


/*
目前畫面重新分析結果
只拿來算「距離目標多遠」
*/

let liveGuide = null;


let currentScore =
0;


let lastLiveAnalysis =
0;


const LIVE_INTERVAL =
450;


/* =========================================
   CAMERA
========================================= */

async function startCamera(){

try{

    if(stream){

        stream
        .getTracks()
        .forEach(t=>t.stop());

    }


    stream =
    await navigator.mediaDevices
    .getUserMedia({

        video:{

            facingMode:{
                ideal:facing
            },

            width:{
                ideal:1280
            },

            height:{
                ideal:720
            }

        },

        audio:false

    });


    video.srcObject =
    stream;


    await video.play();


    resizeOverlay();


    resetAnalysis();

}

catch(error){

    console.error(error);

    messageEl.innerText =
    "❌ 相機無法開啟";

}

}


async function changeCamera(mode){

    facing =
    mode;

    await startCamera();

}


function resetAnalysis(){

    navigation =
    false;

    lockedMode =
    null;

    targetGuide =
    null;

    liveGuide =
    null;

    currentScore =
    0;


    scoreEl.innerHTML =
    `-- <small>/100</small>`;


    compositionEl.innerText =
    "等待分析";


    descEl.innerText =
    "先固定鏡頭，再按 AI 自動";


    messageEl.innerText =
    "✨ 按 AI 自動分析目前畫面";

}


/* =========================================
   BUTTON
========================================= */

function activateButton(button){

    document
    .querySelectorAll(".mode")
    .forEach(b=>{

        b.classList.remove(
            "active"
        );

    });


    button.classList.add(
        "active"
    );

}


/* =========================================
   AI AUTO
========================================= */

function runAI(button){

    activateButton(
        button
    );


    if(
        video.readyState < 2
    ){

        messageEl.innerText =
        "鏡頭還沒準備完成";

        return;

    }


    navigation =
    false;


    targetGuide =
    null;


    compositionEl.innerText =
    "AI 分析中";


    descEl.innerText =
    "尋找真正的主要透視線";


    scoreEl.innerHTML =
    `-- <small>/100</small>`;


    messageEl.innerText =
    "✨ 請保持手機不動...";


    /*
    連續取3幀

    避免只靠單幀雜訊
    */

    const results = [];


    let count =
    0;


    const timer =
    setInterval(()=>{

        const result =
        analyzePerspective();


        if(result){

            results.push(
                result
            );

        }


        count++;


        if(
            count >= 3
        ){

            clearInterval(
                timer
            );


            finishAI(
                results
            );

        }

    },180);

}


/* =========================================
   FINISH AI
========================================= */

function finishAI(results){

    if(
        results.length === 0
    ){

        failPerspective();

        return;

    }


    /*
    找信心最高的那一幀
    */

    results.sort(
        (a,b)=>
        b.confidence -
        a.confidence
    );


    const best =
    results[0];


    if(
        best.confidence < .38
    ){

        failPerspective();

        return;

    }


    /*
    ★ 鎖定目標
    */

    targetGuide =
    JSON.parse(
        JSON.stringify(best)
    );


    liveGuide =
    best;


    lockedMode =
    best.type;


    navigation =
    true;


    /*
    初始構圖分數

    注意：
    confidence不是構圖分數
    */

    currentScore =
    72;


    updateModeUI();


    updateScoreUI();

}


/* =========================================
   FAIL
========================================= */

function failPerspective(){

    navigation =
    false;

    lockedMode =
    null;

    targetGuide =
    null;


    scoreEl.innerHTML =
    `-- <small>/100</small>`;


    compositionEl.innerText =
    "未找到明確透視";


    descEl.innerText =
    "這個畫面不適合硬套 V 型";


    messageEl.innerText =
    "📱 換個角度，或改用三分法／居中";

}


/* =========================================
   MANUAL
========================================= */

function manualMode(
    mode,
    button
){

    activateButton(
        button
    );


    const result =
    analyzePerspective();


    if(!result){

        failPerspective();

        return;

    }


    targetGuide =
    JSON.parse(
        JSON.stringify(result)
    );


    liveGuide =
    result;


    lockedMode =
    mode;


    /*
    手動倒V/V，
    仍使用實景偵測出的線
    */

    targetGuide.type =
    mode;


    navigation =
    true;


    currentScore =
    70;


    updateModeUI();

    updateScoreUI();

}


/* =========================================
   PERSPECTIVE ANALYSIS
========================================= */

function analyzePerspective(){

    const W =
    ac.width;

    const H =
    ac.height;


    /*
    object-fit:cover 在分析Canvas
    這裡先簡化為完整video。
    */

    ax.drawImage(
        video,
        0,
        0,
        W,
        H
    );


    const img =
    ax.getImageData(
        0,
        0,
        W,
        H
    );


    const data =
    img.data;


    const gray =
    new Float32Array(
        W*H
    );


    for(
        let i=0;
        i<W*H;
        i++
    ){

        const p =
        i*4;


        gray[i] =

        data[p]*.299

        +

        data[p+1]*.587

        +

        data[p+2]*.114;

    }


    /*
    Sobel + 方向
    */

    const edge =
    new Float32Array(
        W*H
    );


    const direction =
    new Float32Array(
        W*H
    );


    let strengths =
    [];


    for(
        let y=1;
        y<H-1;
        y++
    ){

        for(
            let x=1;
            x<W-1;
            x++
        ){

            const p =
            y*W+x;


            const gx =

            -gray[p-W-1]

            +

            gray[p-W+1]

            -

            2*gray[p-1]

            +

            2*gray[p+1]

            -

            gray[p+W-1]

            +

            gray[p+W+1];


            const gy =

            -gray[p-W-1]

            -

            2*gray[p-W]

            -

            gray[p-W+1]

            +

            gray[p+W-1]

            +

            2*gray[p+W]

            +

            gray[p+W+1];


            const mag =
            Math.hypot(
                gx,
                gy
            );


            edge[p] =
            mag;


            /*
            線方向 =
            gradient + 90°
            */

            direction[p] =
            normalizeAngle(

                Math.atan2(
                    gy,
                    gx
                )

                +

                Math.PI/2

            );


            strengths.push(
                mag
            );

        }

    }


    /*
    自動閾值：

    不再寫死90。
    取最強約8%的邊緣。
    */

    strengths.sort(
        (a,b)=>a-b
    );


    const threshold =
    strengths[
        Math.floor(
            strengths.length*.92
        )
    ] || 80;


    /*
    不再把每個pixel當一條線。

    將畫面切成小格，
    每格只留一條最強斜線。
    */

    const cell =
    10;


    let candidates =
    [];


    for(
        let cy=0;
        cy<H;
        cy+=cell
    ){

        for(
            let cx=0;
            cx<W;
            cx+=cell
        ){

            let bestMag =
            0;

            let bx =
            0;

            let by =
            0;

            let ba =
            0;


            for(
                let y=cy;
                y<
                Math.min(
                    cy+cell,
                    H
                );
                y++
            ){

                for(
                    let x=cx;
                    x<
                    Math.min(
                        cx+cell,
                        W
                    );
                    x++
                ){

                    const p =
                    y*W+x;


                    const mag =
                    edge[p];


                    if(
                        mag <
                        threshold
                    )
                    continue;


                    const a =
                    direction[p];


                    /*
                    排除近水平
                    與近垂直
                    */

                    const aa =
                    Math.abs(a);


                    if(
                        aa < .18
                        ||
                        aa > 1.38
                    )
                    continue;


                    if(
                        mag >
                        bestMag
                    ){

                        bestMag =
                        mag;

                        bx =
                        x;

                        by =
                        y;

                        ba =
                        a;

                    }

                }

            }


            if(
                bestMag > 0
            ){

                candidates.push({

                    x:bx,

                    y:by,

                    angle:ba,

                    strength:
                    bestMag

                });

            }

        }

    }


    if(
        candidates.length <
        8
    ){

        return null;

    }


    /*
    ★ 消失點投票

    不先猜左/右，
    直接讓候選線延伸，
    對合理交點投票。
    */

    const gridW =
    24;

    const gridH =
    18;


    const votes =
    new Float32Array(
        gridW*gridH
    );


    const pairs =
    [];


    for(
        let i=0;
        i<candidates.length;
        i++
    ){

        for(
            let j=i+1;
            j<candidates.length;
            j++
        ){

            const A =
            candidates[i];


            const B =
            candidates[j];


            /*
            方向至少有差異
            */

            let diff =
            Math.abs(
                normalizeAngle(
                    A.angle -
                    B.angle
                )
            );


            if(
                diff < .32
            )
            continue;


            const p =
            intersectAngleLines(
                A,
                B
            );


            if(!p)
            continue;


            /*
            消失點限制在畫面內，
            並排除最底下25%。

            這就是V5.6道路
            抓到黃線附近的重要修正。
            */

            if(
                p.x < 0
                ||
                p.x > W
                ||
                p.y < H*.10
                ||
                p.y > H*.76
            )
            continue;


            /*
            兩條線最好來自
            消失點左右兩側。
            */

            const opposite =

            (
                A.x < p.x
                &&
                B.x > p.x
            )

            ||

            (
                B.x < p.x
                &&
                A.x > p.x
            );


            if(!opposite)
            continue;


            /*
            線必須從交點向外張開
            */

            const spread =
            Math.abs(
                A.x-B.x
            );


            if(
                spread <
                W*.12
            )
            continue;


            const gx =
            Math.floor(
                p.x/W*gridW
            );


            const gy =
            Math.floor(
                p.y/H*gridH
            );


            if(
                gx<0 ||
                gx>=gridW ||
                gy<0 ||
                gy>=gridH
            )
            continue;


            const weight =

            Math.sqrt(
                A.strength*
                B.strength
            )

            *

            Math.min(
                1,
                spread/(W*.5)
            );


            votes[
                gy*gridW+gx
            ] +=
            weight;


            pairs.push({

                x:p.x,

                y:p.y,

                weight:weight,

                A:A,

                B:B

            });

        }

    }


    if(
        pairs.length < 4
    ){

        return null;

    }


    /*
    找票數最高區域
    */

    let bestIndex =
    0;


    for(
        let i=1;
        i<votes.length;
        i++
    ){

        if(
            votes[i] >
            votes[bestIndex]
        ){

            bestIndex =
            i;

        }

    }


    const bgx =
    bestIndex %
    gridW;


    const bgy =
    Math.floor(
        bestIndex/gridW
    );


    /*
    收集附近交點
    */

    let cluster =
    [];


    for(
        const p
        of pairs
    ){

        const gx =
        Math.floor(
            p.x/W*gridW
        );


        const gy =
        Math.floor(
            p.y/H*gridH
        );


        if(
            Math.abs(
                gx-bgx
            ) <= 1
            &&
            Math.abs(
                gy-bgy
            ) <= 1
        ){

            cluster.push(
                p
            );

        }

    }


    if(
        cluster.length < 3
    ){

        return null;

    }


    /*
    加權消失點
    */

    let sx =
    0;

    let sy =
    0;

    let sw =
    0;


    for(
        const p
        of cluster
    ){

        sx +=
        p.x*p.weight;

        sy +=
        p.y*p.weight;

        sw +=
        p.weight;

    }


    const vx =
    sx/sw;


    const vy =
    sy/sw;


    /*
    找最能代表左右兩側的線。
    */

    let bestLeft =
    null;

    let bestRight =
    null;

    let bestLeftScore =
    0;

    let bestRightScore =
    0;


    for(
        const c
        of candidates
    ){

        const d =
        distanceToLine(
            vx,
            vy,
            c
        );


        /*
        必須真的接近消失點
        */

        if(
            d >
            W*.055
        )
        continue;


        const verticalDistance =
        Math.abs(
            c.y-vy
        );


        const horizontalDistance =
        Math.abs(
            c.x-vx
        );


        /*
        太靠近消失點的短線
        不適合當主透視線。
        */

        if(
            horizontalDistance <
            W*.12
            &&
            verticalDistance <
            H*.12
        )
        continue;


        const score =

        c.strength

        *

        (
            1 +
            verticalDistance/H
        )

        *

        (
            1 +
            horizontalDistance/W
        );


        if(
            c.x < vx
        ){

            if(
                score >
                bestLeftScore
            ){

                bestLeftScore =
                score;

                bestLeft =
                c;

            }

        }

        else{

            if(
                score >
                bestRightScore
            ){

                bestRightScore =
                score;

                bestRight =
                c;

            }

        }

    }


    if(
        !bestLeft
        ||
        !bestRight
    ){

        return null;

    }


    /*
    判斷 V 或倒V。

    如果主要線的外端
    在消失點下方，
    就是道路常見的倒V/透視。

    如果外端在上方，
    就是V型。
    */

    const avgY =

    (
        bestLeft.y
        +
        bestRight.y
    )
    /2;


    let type;


    if(
        avgY >
        vy
    ){

        type =
        "inverseV";

    }

    else{

        type =
        "v";

    }


    /*
    信心值

    這不是構圖分數。
    */

    const concentration =
    cluster.length /
    pairs.length;


    const sideBalance =

    Math.min(
        bestLeftScore,
        bestRightScore
    )

    /

    Math.max(
        bestLeftScore,
        bestRightScore
    );


    let confidence =

    .25

    +

    Math.min(
        .40,
        concentration*2.5
    )

    +

    sideBalance*.30;


    /*
    道路這種消失點通常
    在中上區，比下方合理。
    */

    if(
        vy <
        H*.65
    ){

        confidence +=
        .08;

    }


    confidence =
    Math.max(
        0,
        Math.min(
            .98,
            confidence
        )
    );


    return{

        type:type,

        confidence:
        confidence,

        vx:
        vx/W,

        vy:
        vy/H,

        left:{

            x:
            bestLeft.x/W,

            y:
            bestLeft.y/H

        },

        right:{

            x:
            bestRight.x/W,

            y:
            bestRight.y/H

        }

    };

}


/* =========================================
   LINE INTERSECTION
========================================= */

function intersectAngleLines(
    A,
    B
){

    const adx =
    Math.cos(A.angle);

    const ady =
    Math.sin(A.angle);


    const bdx =
    Math.cos(B.angle);

    const bdy =
    Math.sin(B.angle);


    const den =

    adx*bdy

    -

    ady*bdx;


    if(
        Math.abs(den) <
        .0001
    ){

        return null;

    }


    const dx =
    B.x-A.x;


    const dy =
    B.y-A.y;


    const t =

    (
        dx*bdy

        -

        dy*bdx
    )

    /
    den;


    return{

        x:
        A.x +
        t*adx,

        y:
        A.y +
        t*ady

    };

}


/* =========================================
   DISTANCE POINT -> LINE
========================================= */

function distanceToLine(
    px,
    py,
    line
){

    const dx =
    Math.cos(
        line.angle
    );


    const dy =
    Math.sin(
        line.angle
    );


    return Math.abs(

        (px-line.x)*(-dy)

        +

        (py-line.y)*dx

    );

}


/* =========================================
   ANGLE
========================================= */

function normalizeAngle(a){

    while(
        a >
        Math.PI/2
    ){

        a -=
        Math.PI;

    }


    while(
        a <
        -Math.PI/2
    ){

        a +=
        Math.PI;

    }


    return a;

}


/* =========================================
   LIVE NAVIGATION
========================================= */

function updateNavigation(){

    if(
        !navigation
        ||
        !targetGuide
    ){

        return;

    }


    const now =
    analyzePerspective();


    if(!now){

        currentScore =
        Math.max(
            35,
            currentScore-4
        );


        updateScoreUI();

        return;

    }


    liveGuide =
    now;


    /*
    ★ 目標消失點永遠不動。

    這裡只比較：
    現在偵測點 vs 鎖定目標。
    */

    const dx =

    now.vx -
    targetGuide.vx;


    const dy =

    now.vy -
    targetGuide.vy;


    const distance =
    Math.sqrt(
        dx*dx +
        dy*dy
    );


    /*
    線方向差
    */

    const leftAngleTarget =
    Math.atan2(

        targetGuide.left.y -
        targetGuide.vy,

        targetGuide.left.x -
        targetGuide.vx

    );


    const leftAngleNow =
    Math.atan2(

        now.left.y -
        now.vy,

        now.left.x -
        now.vx

    );


    const rightAngleTarget =
    Math.atan2(

        targetGuide.right.y -
        targetGuide.vy,

        targetGuide.right.x -
        targetGuide.vx

    );


    const rightAngleNow =
    Math.atan2(

        now.right.y -
        now.vy,

        now.right.x -
        now.vx

    );


    const angleError =

    (
        Math.abs(
            normalizeAngle(
                leftAngleNow -
                leftAngleTarget
            )
        )

        +

        Math.abs(
            normalizeAngle(
                rightAngleNow -
                rightAngleTarget
            )
        )

    ) / 2;


    /*
    構圖完成度：

    消失點位置 + 線角度

    不再用辨識confidence當分數。
    */

    let score =

    100

    -

    distance*180

    -

    angleError*35;


    /*
    即使剛分析完，
    也不要隨便直接94。
    */

    score =
    Math.max(
        35,
        Math.min(
            96,
            score
        )
    );


    currentScore =
    Math.round(

        currentScore*.65

        +

        score*.35

    );


    updateScoreUI();


    updateDirection(
        dx,
        dy
    );

}


/* =========================================
   NAVIGATION TEXT
========================================= */

function updateDirection(
    dx,
    dy
){

    if(
        currentScore >= 88
    ){

        messageEl.innerText =
        "✅ 構圖完成，可以拍了";

        return;

    }


    /*
    現在消失點在目標右邊：
    使用者需要稍往右取景，
    讓景物在畫面中相對往左。
    */

    if(
        Math.abs(dx) >
        Math.abs(dy)
    ){

        if(
            dx > .035
        ){

            messageEl.innerText =
            "➡️ 手機稍微往右移";

        }

        else if(
            dx < -.035
        ){

            messageEl.innerText =
            "⬅️ 手機稍微往左移";

        }

        else{

            messageEl.innerText =
            "🟡 左右位置接近，微調角度";

        }

    }

    else{

        if(
            dy > .035
        ){

            messageEl.innerText =
            "⬆️ 鏡頭稍微抬高";

        }

        else if(
            dy < -.035
        ){

            messageEl.innerText =
            "⬇️ 鏡頭稍微降低";

        }

        else{

            messageEl.innerText =
            "🟡 很接近，再微調一下";

        }

    }

}


/* =========================================
   UI
========================================= */

function updateModeUI(){

    if(
        lockedMode ===
        "inverseV"
    ){

        compositionEl.innerText =
        "▽ 倒 V・透視";


        descEl.innerText =
        "左右線條往遠方消失點收斂";

    }

    else if(
        lockedMode === "v"
    ){

        compositionEl.innerText =
        "V 型構圖";


        descEl.innerText =
        "左右線條往下方集中";

    }

    else if(
        lockedMode ===
        "leading"
    ){

        compositionEl.innerText =
        "引導線構圖";


        descEl.innerText =
        "利用線條將視線帶向主體";

    }


    messageEl.innerText =
    "🔒 目標已鎖定，開始導航";

}


function updateScoreUI(){

    scoreEl.innerHTML =

    `${currentScore}
    <small>/100</small>`;


    if(
        currentScore >= 88
    ){

        messageEl.innerText =
        "✅ 構圖完成，可以拍了";

    }

}


/* =========================================
   DRAW
========================================= */

function resizeOverlay(){

    const rect =
    overlay.getBoundingClientRect();


    const dpr =
    window.devicePixelRatio || 1;


    overlay.width =
    rect.width*dpr;


    overlay.height =
    rect.height*dpr;


    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

}


function guideColor(){

    if(
        currentScore >= 88
    ){

        return "#25ff62";

    }


    if(
        currentScore >= 75
    ){

        return "#ffd428";

    }


    return "rgba(255,255,255,.95)";

}


/* =========================================
   DRAW LOCKED TARGET
========================================= */

function drawTarget(){

    if(!targetGuide)
    return;


    const w =
    overlay.clientWidth;


    const h =
    overlay.clientHeight;


    const vx =
    targetGuide.vx*w;


    const vy =
    targetGuide.vy*h;


    const left =
    extendFromPoint(

        vx,
        vy,

        targetGuide.left.x*w,

        targetGuide.left.y*h,

        4

    );


    const right =
    extendFromPoint(

        vx,
        vy,

        targetGuide.right.x*w,

        targetGuide.right.y*h,

        4

    );


    ctx.save();


    ctx.strokeStyle =
    guideColor();


    ctx.fillStyle =
    guideColor();


    ctx.lineWidth =
    3;


    ctx.setLineDash([
        13,
        9
    ]);


    /*
    左目標線
    */

    ctx.beginPath();

    ctx.moveTo(
        vx,
        vy
    );

    ctx.lineTo(
        left.x,
        left.y
    );

    ctx.stroke();


    /*
    右目標線
    */

    ctx.beginPath();

    ctx.moveTo(
        vx,
        vy
    );

    ctx.lineTo(
        right.x,
        right.y
    );

    ctx.stroke();


    ctx.setLineDash([]);


    /*
    ★ 這個點是鎖死的，
    不會再亂跑
    */

    ctx.beginPath();

    ctx.arc(
        vx,
        vy,
        7,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.lineWidth =
    2;


    ctx.beginPath();

    ctx.arc(
        vx,
        vy,
        15,
        0,
        Math.PI*2
    );

    ctx.stroke();


    ctx.font =
    "bold 14px Arial";


    ctx.textAlign =
    "center";


    ctx.fillText(
        "目標消失點",
        vx,
        vy-22
    );


    ctx.restore();

}


function extendFromPoint(
    x1,
    y1,
    x2,
    y2,
    scale
){

    return{

        x:
        x1 +
        (x2-x1)*scale,

        y:
        y1 +
        (y2-y1)*scale

    };

}


/* =========================================
   LOOP
========================================= */

function loop(time){

    ctx.clearRect(
        0,
        0,
        overlay.clientWidth,
        overlay.clientHeight
    );


    if(
        navigation
        &&
        targetGuide
    ){

        drawTarget();


        if(
            time -
            lastLiveAnalysis
            >
            LIVE_INTERVAL
        ){

            updateNavigation();


            lastLiveAnalysis =
            time;

        }

    }


    requestAnimationFrame(
        loop
    );

}


/* =========================================
   ZOOM
========================================= */

zoom.addEventListener(
"input",
async function(){

    const value =
    Number(
        this.value
    );


    zoomText.innerText =
    value.toFixed(1)
    +
    "×";


    if(!stream)
    return;


    const track =
    stream
    .getVideoTracks()[0];


    if(
        !track
        ||
        !track.getCapabilities
    )
    return;


    const cap =
    track.getCapabilities();


    if(!cap.zoom)
    return;


    try{

        await track.applyConstraints({

            advanced:[
                {
                    zoom:value
                }
            ]

        });

    }

    catch(error){

        console.log(
            "Zoom unsupported"
        );

    }

});


window.addEventListener(
    "resize",
    resizeOverlay
);


startCamera();


requestAnimationFrame(
    loop
);

</script>
