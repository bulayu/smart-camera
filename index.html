<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   user-scalable=no">

    <title>阿策智慧構圖助手</title>

    <style>
        body {
            margin: 0;
            background: black;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        h2 {
            margin: 10px 0;
        }

        #status {
            font-size: 18px;
            margin: 10px;
        }

        #cameraBox {
            position: relative;
            width: 100%;
            max-width: 900px;
            margin: auto;
            overflow: hidden;
            background: #111;
        }

        #camera {
            width: 100%;
            display: block;
        }

        #overlay {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        /* 三分法直線 */
        .vline {
            position: absolute;
            top: 0;
            height: 100%;
            width: 2px;
            background: rgba(255,255,255,0.65);
            pointer-events: none;
        }

        .v1 {
            left: 33.33%;
        }

        .v2 {
            left: 66.66%;
        }

        /* 三分法橫線 */
        .hline {
            position: absolute;
            left: 0;
            width: 100%;
            height: 2px;
            background: rgba(255,255,255,0.65);
            pointer-events: none;
        }

        .h1 {
            top: 33.33%;
        }

        .h2 {
            top: 66.66%;
        }

        button {
            font-size: 18px;
            padding: 12px 20px;
            margin: 10px 5px;
            border: none;
            border-radius: 10px;
        }

        #faceInfo {
            font-size: 20px;
            margin: 10px;
            min-height: 30px;
        }
    </style>
</head>


<body>

<h2>📷 阿策智慧構圖助手</h2>

<div id="status">
    AI 模型載入中...
</div>

<div id="faceInfo">
    尚未偵測
</div>

<div id="cameraBox">

    <video id="camera"
           autoplay
           playsinline
           muted>
    </video>

    <!-- AI 畫框用 -->
    <canvas id="overlay"></canvas>

    <!-- 三分法 -->
    <div class="vline v1"></div>
    <div class="vline v2"></div>

    <div class="hline h1"></div>
    <div class="hline h2"></div>

</div>

<button onclick="startCamera()">
    開啟後鏡頭
</button>

<button onclick="stopCamera()">
    關閉相機
</button>


<script type="module">

import vision from
"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/+esm";

const {
    FaceDetector,
    FilesetResolver
} = vision;


let faceDetector = null;
let stream = null;
let cameraRunning = false;

const video =
    document.getElementById("camera");

const canvas =
    document.getElementById("overlay");

const ctx =
    canvas.getContext("2d");

const statusText =
    document.getElementById("status");

const faceInfo =
    document.getElementById("faceInfo");


/* =========================
   載入 AI 人臉模型
========================= */

async function loadAI() {

    try {

        const filesetResolver =
            await FilesetResolver.forVisionTasks(
                "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm"
            );

        faceDetector =
            await FaceDetector.createFromOptions(
                filesetResolver,
                {
                    baseOptions: {
                        modelAssetPath:
                        "https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/latest/blaze_face_short_range.tflite"
                    },

                    runningMode: "VIDEO",

                    minDetectionConfidence: 0.5
                }
            );

        statusText.innerText =
            "AI 已準備完成";

    }

    catch(error) {

        statusText.innerText =
            "AI 載入失敗：" + error.message;

        console.log(error);
    }
}


/* =========================
   開啟手機相機
========================= */

async function startCamera() {

    if (!faceDetector) {

        alert("AI 還在載入，請等一下再按");

        return;
    }

    try {

        if (stream) {
            stopCamera();
        }

        stream =
            await navigator.mediaDevices.getUserMedia({
                video: {
                    facingMode: {
                        ideal: "environment"
                    }
                },

                audio: false
            });


        video.srcObject = stream;

        await video.play();


        canvas.width =
            video.videoWidth;

        canvas.height =
            video.videoHeight;


        cameraRunning = true;

        statusText.innerText =
            "相機已開啟";

        detectFace();

    }

    catch(error) {

        statusText.innerText =
            "無法開啟相機：" + error.message;

    }
}


/* =========================
   關閉相機
========================= */

function stopCamera() {

    cameraRunning = false;

    if (stream) {

        stream.getTracks().forEach(
            track => track.stop()
        );

        stream = null;
    }

    video.srcObject = null;

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    statusText.innerText =
        "相機已關閉";

    faceInfo.innerText =
        "尚未偵測";
}


/* =========================
   人臉偵測
========================= */

function detectFace() {

    if (!cameraRunning) {
        return;
    }


    if (video.readyState >= 2) {

        const now =
            performance.now();


        const result =
            faceDetector.detectForVideo(
                video,
                now
            );


        ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );


        if (result.detections.length > 0) {

            faceInfo.innerText =
                "找到人臉：" +
                result.detections.length +
                " 張";


            for (const detection of result.detections) {

                const box =
                    detection.boundingBox;


                /* 人臉框 */
                ctx.strokeStyle =
                    "lime";

                ctx.lineWidth = 6;

                ctx.strokeRect(
                    box.originX,
                    box.originY,
                    box.width,
                    box.height
                );


                /* 人臉中心 */
                const centerX =
                    box.originX +
                    box.width / 2;

                const centerY =
                    box.originY +
                    box.height / 2;


                ctx.beginPath();

                ctx.arc(
                    centerX,
                    centerY,
                    10,
                    0,
                    Math.PI * 2
                );

                ctx.fillStyle =
                    "red";

                ctx.fill();
            }

        }

        else {

            faceInfo.innerText =
                "找不到人臉";
        }
    }


    requestAnimationFrame(
        detectFace
    );
}


/* 讓 HTML 按鈕可以呼叫 */
window.startCamera =
    startCamera;

window.stopCamera =
    stopCamera;


/* 網頁開啟時先載入 AI */
loadAI();

</script>

</body>
</html>
