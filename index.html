content="width=device-width,

<title>AI 構圖助手 V5.6</title>

<style>

    box-sizing:border-box;
}

    margin:0;
    width:100%;
    height:100%;

}

<body>


<div id="cameraArea">

    <video
        id="video"
        autoplay
        playsinline
        muted>
    </video>

    <canvas id="overlay"></canvas>

    <canvas
        id="analysisCanvas"
        width="200"
        height="150">
    </canvas>


    <div id="info">

        <div id="score">
            --

        </div>

        </div>

    </div>

    </div>

</div>

        </button>

            ◎ 居中
        </button>

            class="mode"
            onclick="selectMode('leading',this)">
            ↗ 引導線
        </button>

        <button
            class="mode"
            onclick="selectMode('vshape',this)">
            V 型
        </button>

        <span>倍率</span>

        <input
            id="zoom"
            type="range"

        <span id="zoomText">

        </span>

</div>



<script>

const video =
document.getElementById("video");

const overlay =
document.getElementById("overlay");

const ctx =
overlay.getContext("2d");

const analysisCanvas =
document.getElementById("analysisCanvas");

const actx =
analysisCanvas.getContext(
    "2d",
    {willReadFrequently:true}
);

const scoreBox =
document.getElementById("score");

const compositionBox =
document.getElementById("composition");

const descBox =
document.getElementById("desc");

const messageBox =
document.getElementById("message");

const zoomSlider =
document.getElementById("zoom");

const zoomText =
document.getElementById("zoomText");


let stream = null;

let facingMode =
"environment";


let lockedMode =
null;


let navigationActive =
false;


let currentScore =
0;


let lastAnalysisTime =
0;


const ANALYSIS_INTERVAL =
350;


/*
V5.6：

偵測到的 V 資料

不是固定 V
*/

let detectedV = {

    valid:false,

    vx:0.5,

    vy:0.55,

    leftStart:{
        x:0.15,
        y:0.85
    },

    rightStart:{
        x:0.85,
        y:0.85
    },

    confidence:0

};



/* ===================================
   CAMERA
=================================== */

async function startCamera(){

    try{

        if(stream){

            stream
            .getTracks()
            .forEach(track=>{

                track.stop();

            });

        }


        stream =
        await navigator.mediaDevices
        .getUserMedia({

            video:{

                facingMode:{
                    ideal:facingMode
                },

                width:{
                    ideal:1280
                },

                height:{
                    ideal:720
                }

            },

            audio:false

        });


        video.srcObject =
        stream;


        await video.play();


        resizeCanvas();


        navigationActive =
        false;


        lockedMode =
        null;


        scoreBox.innerHTML =
        `-- <small>/100</small>`;


        compositionBox.innerText =
        "等待分析";


        descBox.innerText =
        "將鏡頭對準想拍的畫面";


        messageBox.innerText =
        "按「✨ AI 自動」分析構圖";

    }

    catch(err){

        console.error(err);

        messageBox.innerText =
        "❌ 無法開啟鏡頭";

    }

}



async function changeCamera(mode){

    facingMode =
    mode;

    await startCamera();

}



/* ===================================
   MODE
=================================== */

function selectMode(mode,button){

    document
    .querySelectorAll(".mode")
    .forEach(btn=>{

        btn.classList.remove(
            "active"
        );

    });


    button.classList.add(
        "active"
    );


    if(mode === "auto"){

        runAutoAnalysis();

        return;

    }


    lockedMode =
    mode;


    navigationActive =
    true;


    const result =
    analyzeFrame();


    currentScore =
    result[mode] || 40;


    updateModeText(
        mode
    );


    updateScore(
        currentScore
    );

}



/* ===================================
   AI AUTO
=================================== */

function runAutoAnalysis(){

    if(
        video.readyState < 2
    ){

        messageBox.innerText =
        "鏡頭尚未準備完成";

        return;

    }


    navigationActive =
    false;


    lockedMode =
    null;


    compositionBox.innerText =
    "AI 分析中";


    descBox.innerText =
    "正在尋找主體、線條與消失點";


    scoreBox.innerHTML =
    `-- <small>/100</small>`;


    messageBox.innerText =
    "✨ 分析目前場景...";


    setTimeout(()=>{

        const result =
        analyzeFrame();


        /*
        V5.6：

        V 型必須有真正有效的
        消失點才能參加競爭
        */

        let vScore =
        result.vshape;


        if(
            !result.vValid
        ){

            vScore -= 18;

        }


        const scores = {

            vshape:
            vScore,

            leading:
            result.leading,

            third:
            result.third,

            center:
            result.center

        };


        console.log(
            "V5.6 scores",
            scores
        );


        let bestMode =
        "center";


        let bestScore =
        -999;


        for(
            const mode in scores
        ){

            if(
                scores[mode] >
                bestScore
            ){

                bestMode =
                mode;

                bestScore =
                scores[mode];

            }

        }


        lockedMode =
        bestMode;


        navigationActive =
        true;


        currentScore =
        clampScore(
            bestScore
        );


        updateModeText(
            bestMode
        );


        updateScore(
            currentScore
        );


    },650);

}



/* ===================================
   FRAME
=================================== */

function analyzeFrame(){

    const W =
    analysisCanvas.width;


    const H =
    analysisCanvas.height;


    actx.drawImage(
        video,
        0,
        0,
        W,
        H
    );


    const image =
    actx.getImageData(
        0,
        0,
        W,
        H
    );


    const data =
    image.data;


    const gray =
    new Float32Array(
        W*H
    );


    /*
    GRAYSCALE
    */

    for(
        let y=0;
        y<H;
        y++
    ){

        for(
            let x=0;
            x<W;
            x++
        ){

            const i =
            (y*W+x)*4;


            gray[y*W+x] =

                data[i] * .299

                +

                data[i+1] * .587

                +

                data[i+2] * .114;

        }

    }



    /*
    SOBEL
    */

    const edge =
    new Float32Array(
        W*H
    );


    const gxMap =
    new Float32Array(
        W*H
    );


    const gyMap =
    new Float32Array(
        W*H
    );


    let totalEdge =
    0;


    for(
        let y=1;
        y<H-1;
        y++
    ){

        for(
            let x=1;
            x<W-1;
            x++
        ){

            const p =
            y*W+x;


            const gx =

            -gray[p-W-1]

            +

            gray[p-W+1]

            -

            2*gray[p-1]

            +

            2*gray[p+1]

            -

            gray[p+W-1]

            +

            gray[p+W+1];


            const gy =

            -gray[p-W-1]

            -

            2*gray[p-W]

            -

            gray[p-W+1]

            +

            gray[p+W-1]

            +

            2*gray[p+W]

            +

            gray[p+W+1];


            const magnitude =
            Math.sqrt(
                gx*gx +
                gy*gy
            );


            edge[p] =
            magnitude;


            gxMap[p] =
            gx;


            gyMap[p] =
            gy;


            totalEdge +=
            magnitude;

        }

    }



    /*
    V5.6
    真正估計消失點
    */

    const vData =
    findVanishingPoint(

        edge,

        gxMap,

        gyMap,

        W,

        H

    );


    detectedV =
    vData;



    const centerScore =
    calculateCenter(

        edge,
        W,
        H,
        totalEdge

    );


    const thirdScore =
    calculateThird(

        edge,
        W,
        H,
        totalEdge

    );


    const leadingScore =
    calculateLeading(

        edge,
        gxMap,
        gyMap,
        W,
        H

    );


    return{

        center:
        centerScore,

        third:
        thirdScore,

        leading:
        leadingScore,

        vshape:
        vData.score,

        vValid:
        vData.valid

    };

}



/* ===================================
   VANISHING POINT
=================================== */

function findVanishingPoint(
    edge,
    gxMap,
    gyMap,
    W,
    H
){

    /*
    抽出候選斜線
    */

    let leftLines = [];

    let rightLines = [];


    for(
        let y=5;
        y<H-5;
        y+=2
    ){

        for(
            let x=5;
            x<W-5;
            x+=2
        ){

            const p =
            y*W+x;


            const strength =
            edge[p];


            if(
                strength < 90
            )
            continue;


            /*
            Sobel梯度
            ↓
            換算成線的方向
            */

            const gradientAngle =
            Math.atan2(
                gyMap[p],
                gxMap[p]
            );


            let lineAngle =
            gradientAngle
            +
            Math.PI/2;


            lineAngle =
            normalizeLineAngle(
                lineAngle
            );


            /*
            太水平或太垂直
            不拿來判 V
            */

            const abs =
            Math.abs(
                lineAngle
            );


            if(
                abs < 0.25
                ||
                abs > 1.30
            )
            continue;


            /*
            方向向量
            */

            const dx =
            Math.cos(
                lineAngle
            );


            const dy =
            Math.sin(
                lineAngle
            );


            const line = {

                x:x,

                y:y,

                dx:dx,

                dy:dy,

                strength:
                strength

            };


            /*
            \ 方向
            */

            if(
                lineAngle > 0
            ){

                leftLines.push(
                    line
                );

            }


            /*
            / 方向
            */

            else{

                rightLines.push(
                    line
                );

            }

        }

    }



    /*
    只保留較強的線
    避免手機太慢
    */

    leftLines.sort(
        (a,b)=>
        b.strength-a.strength
    );


    rightLines.sort(
        (a,b)=>
        b.strength-a.strength
    );


    leftLines =
    leftLines.slice(
        0,
        55
    );


    rightLines =
    rightLines.slice(
        0,
        55
    );



    /*
    左右線交點
    */

    let intersections = [];


    for(
        const L of leftLines
    ){

        for(
            const R of rightLines
        ){

            const pt =
            lineIntersection(
                L,
                R
            );


            if(!pt)
            continue;


            /*
            交點不能離畫面太誇張
            */

            if(
                pt.x < -W*.15
                ||
                pt.x > W*1.15
                ||
                pt.y < H*.05
                ||
                pt.y > H*.95
            )
            continue;


            intersections.push({

                x:pt.x,

                y:pt.y,

                weight:
                Math.sqrt(
                    L.strength *
                    R.strength
                ),

                L:L,

                R:R

            });

        }

    }



    /*
    沒有足夠交點
    */

    if(
        intersections.length <
        8
    ){

        return defaultV();

    }



    /*
    找交點最密集區域

    使用格子投票
    */

    const COLS =
    10;


    const ROWS =
    10;


    let grid =
    new Array(
        COLS*ROWS
    ).fill(0);


    for(
        const p
        of intersections
    ){

        let gx =
        Math.floor(
            p.x/W*COLS
        );


        let gy =
        Math.floor(
            p.y/H*ROWS
        );


        gx =
        Math.max(
            0,
            Math.min(
                COLS-1,
                gx
            )
        );


        gy =
        Math.max(
            0,
            Math.min(
                ROWS-1,
                gy
            )
        );


        grid[
            gy*COLS+gx
        ] +=
        p.weight;

    }



    let bestIndex =
    0;


    for(
        let i=1;
        i<grid.length;
        i++
    ){

        if(
            grid[i] >
            grid[bestIndex]
        ){

            bestIndex =
            i;

        }

    }



    const bestGX =
    bestIndex % COLS;


    const bestGY =
    Math.floor(
        bestIndex/COLS
    );



    /*
    收集最佳區附近交點
    */

    let cluster = [];


    for(
        const p
        of intersections
    ){

        const gx =
        Math.floor(
            p.x/W*COLS
        );


        const gy =
        Math.floor(
            p.y/H*ROWS
        );


        if(
            Math.abs(
                gx-bestGX
            ) <= 1
            &&
            Math.abs(
                gy-bestGY
            ) <= 1
        ){

            cluster.push(
                p
            );

        }

    }



    if(
        cluster.length <
        6
    ){

        return defaultV();

    }



    /*
    加權平均交點
    */

    let sumX = 0;

    let sumY = 0;

    let sumWeight = 0;


    for(
        const p
        of cluster
    ){

        sumX +=
        p.x *
        p.weight;


        sumY +=
        p.y *
        p.weight;


        sumWeight +=
        p.weight;

    }


    const vx =
    sumX /
    sumWeight;


    const vy =
    sumY /
    sumWeight;



    /*
    看左右有多少不同線
    真正支持這個交點
    */

    let leftSupport = 0;

    let rightSupport = 0;


    let leftStartX = 0;

    let leftStartY = 0;

    let rightStartX = 0;

    let rightStartY = 0;


    let leftWeight = 0;

    let rightWeight = 0;


    for(
        const L
        of leftLines
    ){

        const d =
        distancePointToInfiniteLine(
            vx,
            vy,
            L
        );


        if(
            d < W*.075
        ){

            leftSupport++;


            leftStartX +=
            L.x *
            L.strength;


            leftStartY +=
            L.y *
            L.strength;


            leftWeight +=
            L.strength;

        }

    }


    for(
        const R
        of rightLines
    ){

        const d =
        distancePointToInfiniteLine(
            vx,
            vy,
            R
        );


        if(
            d < W*.075
        ){

            rightSupport++;


            rightStartX +=
            R.x *
            R.strength;


            rightStartY +=
            R.y *
            R.strength;


            rightWeight +=
            R.strength;

        }

    }



    /*
    左右兩邊都必須存在
    */

    const weakest =
    Math.min(
        leftSupport,
        rightSupport
    );


    const strongest =
    Math.max(
        leftSupport,
        rightSupport
    );


    const balance =
    strongest > 0
    ?
    weakest/strongest
    :
    0;



    /*
    交點集中程度
    */

    const concentration =

    cluster.length
    /
    intersections.length;



    /*
    V 型可信度
    */

    let confidence =

        weakest * 0.055

        +

        balance * 0.32

        +

        Math.min(
            concentration*3,
            0.30
        );


    confidence =
    Math.max(
        0,
        Math.min(
            1,
            confidence
        )
    );



    /*
    必須左右都有一定線數
    且不能嚴重失衡
    */

    const valid =

        leftSupport >= 4

        &&

        rightSupport >= 4

        &&

        balance >= .32

        &&

        confidence >= .42;



    let score =

        35

        +

        confidence * 60;



    if(!valid){

        score -= 12;

    }



    /*
    導航線起點
    */

    let lsx =
    W*.15;

    let lsy =
    H*.82;


    let rsx =
    W*.85;

    let rsy =
    H*.82;


    if(
        leftWeight > 0
    ){

        lsx =
        leftStartX /
        leftWeight;


        lsy =
        leftStartY /
        leftWeight;

    }


    if(
        rightWeight > 0
    ){

        rsx =
        rightStartX /
        rightWeight;


        rsy =
        rightStartY /
        rightWeight;

    }



    return{

        valid:valid,

        score:
        clampScore(
            score
        ),

        vx:
        vx/W,

        vy:
        vy/H,

        leftStart:{

            x:
            lsx/W,

            y:
            lsy/H

        },

        rightStart:{

            x:
            rsx/W,

            y:
            rsy/H

        },

        confidence:
        confidence

    };

}



/* ===================================
   DEFAULT V
=================================== */

function defaultV(){

    return{

        valid:false,

        score:32,

        vx:.5,

        vy:.55,

        leftStart:{
            x:.15,
            y:.82
        },

        rightStart:{
            x:.85,
            y:.82
        },

        confidence:0

    };

}



/* ===================================
   LINE INTERSECTION
=================================== */

function lineIntersection(
    a,
    b
){

    const denominator =

        a.dx*b.dy

        -

        a.dy*b.dx;


    if(
        Math.abs(
            denominator
        ) < .0001
    ){

        return null;

    }


    const rx =
    b.x-a.x;


    const ry =
    b.y-a.y;


    const t =

    (
        rx*b.dy

        -

        ry*b.dx

    )
    /
    denominator;


    return{

        x:
        a.x +
        t*a.dx,

        y:
        a.y +
        t*a.dy

    };

}



/* ===================================
   DISTANCE TO LINE
=================================== */

function distancePointToInfiniteLine(
    px,
    py,
    line
){

    const nx =
    -line.dy;


    const ny =
    line.dx;


    return Math.abs(

        (px-line.x)*nx

        +

        (py-line.y)*ny

    );

}



/* ===================================
   ANGLE
=================================== */

function normalizeLineAngle(a){

    while(
        a > Math.PI/2
    ){

        a -= Math.PI;

    }


    while(
        a < -Math.PI/2
    ){

        a += Math.PI;

    }


    return a;

}



/* ===================================
   CENTER
=================================== */

function calculateCenter(
    edge,
    W,
    H,
    total
){

    if(total <= 0)
    return 35;


    let center =
    0;


    let outer =
    0;


    for(
        let y=0;
        y<H;
        y++
    ){

        for(
            let x=0;
            x<W;
            x++
        ){

            const e =
            edge[y*W+x];


            if(

                x > W*.34

                &&

                x < W*.66

                &&

                y > H*.30

                &&

                y < H*.70

            ){

                center +=
                e;

            }

            else{

                outer +=
                e;

            }

        }

    }


    const ratio =
    center /
    total;


    /*
    V5.6降低居中
    因雜亂場景容易誤判
    */

    return clampScore(

        38

        +

        ratio*150

        -

        (outer/total)*15

    );

}



/* ===================================
   THIRD
=================================== */

function calculateThird(
    edge,
    W,
    H,
    total
){

    if(total <= 0)
    return 35;


    const points = [

        [W/3,H/3],

        [W*2/3,H/3],

        [W/3,H*2/3],

        [W*2/3,H*2/3]

    ];


    const radius =
    Math.min(
        W,
        H
    )*.11;


    let best =
    0;


    for(
        const point
        of points
    ){

        let energy =
        0;


        for(
            let y=0;
            y<H;
            y++
        ){

            for(
                let x=0;
                x<W;
                x++
            ){

                const dx =
                x-point[0];


                const dy =
                y-point[1];


                if(
                    dx*dx +
                    dy*dy <
                    radius*radius
                ){

                    energy +=
                    edge[y*W+x];

                }

            }

        }


        best =
        Math.max(
            best,
            energy
        );

    }


    const ratio =
    best /
    total;


    return clampScore(

        38

        +

        ratio*230

    );

}



/* ===================================
   LEADING LINE
=================================== */

function calculateLeading(
    edge,
    gxMap,
    gyMap,
    W,
    H
){

    let strong =
    0;


    let diagonal =
    0;


    for(
        let y=0;
        y<H;
        y++
    ){

        for(
            let x=0;
            x<W;
            x++
        ){

            const p =
            y*W+x;


            const e =
            edge[p];


            if(
                e < 80
            )
            continue;


            strong +=
            e;


            let angle =
            Math.atan2(
                gyMap[p],
                gxMap[p]
            )
            +
            Math.PI/2;


            angle =
            normalizeLineAngle(
                angle
            );


            const a =
            Math.abs(
                angle
            );


            /*
            斜線
            */

            if(
                a > .25
                &&
                a < 1.25
            ){

                /*
                下方線條權重較高
                */

                const weight =

                .7
                +
                y/H*.6;


                diagonal +=
                e*weight;

            }

        }

    }


    if(
        strong <= 0
    )
    return 35;


    const ratio =
    diagonal /
    strong;


    return clampScore(

        36

        +

        ratio*62

    );

}



/* ===================================
   SCORE LIMIT
=================================== */

function clampScore(v){

    return Math.round(

        Math.max(
            30,
            Math.min(
                96,
                v
            )
        )

    );

}



/* ===================================
   LIVE SCORE
=================================== */

function updateLiveScore(){

    if(
        !navigationActive
        ||
        !lockedMode
    )
    return;


    const result =
    analyzeFrame();


    let newScore =
    result[lockedMode];


    if(
        newScore === undefined
    )
    return;


    /*
    如果目前鎖定V型
    但V消失點失效
    分數快速下降
    */

    if(
        lockedMode === "vshape"
        &&
        !result.vValid
    ){

        newScore =
        Math.min(
            newScore,
            48
        );

    }


    currentScore =

    Math.round(

        currentScore*.70

        +

        newScore*.30

    );


    updateScore(
        currentScore
    );

}

   TEXT
=================================== */

    }

    ){

    }

        mode === "third"
    ){

/* ===================================
   SCORE UI
=================================== */

function updateScore(score){

    scoreBox.innerHTML =

    `${score} <small>/100</small>`;


    if(
        score >= 85
    ){

        messageBox.innerText =
        "✅ 構圖完成，可以拍了";

    }


    else if(
        score >= 72
    ){

        messageBox.innerText =
        "🟡 很接近，再微調一下";

    }


    else{

        if(
            lockedMode ===
            "vshape"
        ){

            messageBox.innerText =
            "📱 尋找更明顯的左右收斂線條";

        }

    }

}



/* ===================================
   CANVAS
=================================== */

function resizeCanvas(){

    const rect =
    overlay.getBoundingClientRect();


    const dpr =
    window.devicePixelRatio || 1;


    overlay.width =
    rect.width*dpr;


    overlay.height =
    rect.height*dpr;


    ctx.setTransform(

        dpr,
        0,
        0,
        dpr,
        0,
        0

    );

}



/* ===================================
   GUIDE COLOR
=================================== */

function getGuideColor(){

    if(
        currentScore >= 85
    ){

        return "#28ff62";

    }


    if(
        currentScore >= 72
    ){

        return "#ffd429";

    }


    return "rgba(255,255,255,.92)";

}



/* ===================================
   V DRAW
=================================== */

function drawDetectedV(){

    if(
        !detectedV.valid
    ){

        return;

    }


    const w =
    overlay.clientWidth;


    const h =
    overlay.clientHeight;


    /*
    分析Canvas座標
    轉成螢幕座標
    */

    const vx =
    detectedV.vx*w;


    const vy =
    detectedV.vy*h;


    let lx =
    detectedV.leftStart.x*w;


    let ly =
    detectedV.leftStart.y*h;


    let rx =
    detectedV.rightStart.x*w;


    let ry =
    detectedV.rightStart.y*h;



    /*
    為了讓導航線容易看，
    從交點向兩側延伸
    */

    const leftVectorX =
    lx-vx;


    const leftVectorY =
    ly-vy;


    const rightVectorX =
    rx-vx;


    const rightVectorY =
    ry-vy;


    lx =
    vx +
    leftVectorX*2.1;


    ly =
    vy +
    leftVectorY*2.1;


    rx =
    vx +
    rightVectorX*2.1;


    ry =
    vy +
    rightVectorY*2.1;



    ctx.save();


    ctx.strokeStyle =
    getGuideColor();


    ctx.fillStyle =
    getGuideColor();


    ctx.lineWidth =
    3;


    ctx.setLineDash([
        13,
        9
    ]);



    /*
    左實景線
    */

    ctx.beginPath();

    ctx.moveTo(
        lx,
        ly
    );

    ctx.lineTo(
        vx,
        vy
    );

    ctx.stroke();



    /*
    右實景線
    */

    ctx.beginPath();

    ctx.moveTo(
        rx,
        ry
    );

    ctx.lineTo(
        vx,
        vy
    );

    ctx.stroke();



    /*
    消失點
    */

    ctx.setLineDash([]);


    ctx.beginPath();

    ctx.arc(
        vx,
        vy,
        7,
        0,
        Math.PI*2
    );

    ctx.fill();



    /*
    消失點外圈
    */

    ctx.lineWidth =
    2;


    ctx.beginPath();

    ctx.arc(
        vx,
        vy,
        14,
        0,
        Math.PI*2
    );

    ctx.stroke();


    ctx.font =
    "bold 14px Arial";


    ctx.textAlign =
    "center";


    ctx.fillText(
        "消失點",
        vx,
        vy-20
    );


    ctx.restore();

}



/* ===================================
   THIRD
=================================== */

function drawThird(){

    const w =
    overlay.clientWidth;


    const h =
    overlay.clientHeight;


    ctx.save();


    ctx.strokeStyle =
    getGuideColor();


    ctx.fillStyle =
    getGuideColor();


    ctx.lineWidth =
    2;


    ctx.setLineDash([
        10,
        8
    ]);


    for(
        let i=1;
        i<=2;
        i++
    ){

        ctx.beginPath();

        ctx.moveTo(
            w*i/3,
            0
        );

        ctx.lineTo(
            w*i/3,
            h
        );

        ctx.stroke();


        ctx.beginPath();

        ctx.moveTo(
            0,
            h*i/3
        );

        ctx.lineTo(
            w,
            h*i/3
        );

        ctx.stroke();

    }


    ctx.setLineDash([]);


    const points = [

        [w/3,h/3],

        [w*2/3,h/3],

        [w/3,h*2/3],

        [w*2/3,h*2/3]

    ];


    for(
        const p
        of points
    ){

        ctx.beginPath();

        ctx.arc(
            p[0],
            p[1],
            5,
            0,
            Math.PI*2
        );

        ctx.fill();

    }


    ctx.restore();

}



/* ===================================
   CENTER
=================================== */

function drawCenter(){

    const w =
    overlay.clientWidth;


    const h =
    overlay.clientHeight;


    ctx.save();


    ctx.strokeStyle =
    getGuideColor();


    ctx.lineWidth =
    3;


    ctx.setLineDash([
        12,
        8
    ]);


    ctx.beginPath();


    ctx.ellipse(

        w*.5,

        h*.5,

        w*.20,

        h*.23,

        0,

        0,

        Math.PI*2

    );


    ctx.stroke();


    ctx.restore();

}



/* ===================================
   LEADING
=================================== */

function drawLeading(){

    const w =
    overlay.clientWidth;


    const h =
    overlay.clientHeight;


    ctx.save();


    ctx.strokeStyle =
    getGuideColor();


    ctx.lineWidth =
    3;


    ctx.setLineDash([
        12,
        9
    ]);


    /*
    V5.6 引導線先維持提示線
    V5.7再改成實景線追蹤
    */

    ctx.beginPath();


    ctx.moveTo(
        w*.10,
        h*.88
    );


    ctx.lineTo(
        w*.55,
        h*.45
    );


    ctx.stroke();


    ctx.restore();

}



/* ===================================
   DRAW LOOP
=================================== */

function drawLoop(time){

    ctx.clearRect(

        0,
        0,

        overlay.clientWidth,

        overlay.clientHeight

    );


    if(
        navigationActive
    ){

        if(
            lockedMode ===
            "vshape"
        ){

            drawDetectedV();

        }


        if(
            lockedMode ===
            "third"
        ){

            drawThird();

        }


        if(
            lockedMode ===
            "center"
        ){

            drawCenter();

        }


        if(
            lockedMode ===
            "leading"
        ){

            drawLeading();

        }



        if(
            time -
            lastAnalysisTime
            >
            ANALYSIS_INTERVAL
        ){

            updateLiveScore();


            lastAnalysisTime =
            time;

        }

    }


    requestAnimationFrame(
        drawLoop
    );

}



/* ===================================
   ZOOM
=================================== */

zoomSlider.addEventListener(
"input",
async function(){

    const value =
    Number(
        this.value
    );


    zoomText.innerText =

    value.toFixed(1)
    +
    "×";


    if(!stream)
    return;


    const track =
    stream
    .getVideoTracks()[0];


    if(
        !track
        ||
        !track.getCapabilities
    )
    return;


    const cap =
    track.getCapabilities();


    if(!cap.zoom)
    return;


    try{

        await track
        .applyConstraints({

            advanced:[
                {
                    zoom:value
                }
            ]

        });

    }

    catch(e){

        console.log(
            "Zoom unsupported"
        );

    }

});



window.addEventListener(
    "resize",
    resizeCanvas
);



startCamera();


requestAnimationFrame(
    drawLoop
);

</script>
