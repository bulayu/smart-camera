<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>AI 構圖助手 V5.8.2</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

#cameraArea{
    position:relative;
    width:100%;
    height:72%;
    background:#111;
    overflow:hidden;
}

#video{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
}

#overlay{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
    z-index:5;
}

#analysisCanvas{
    display:none;
}

#info{
    position:absolute;
    top:18px;
    left:16px;
    width:245px;
    padding:16px 17px;
    border-radius:20px;
    background:rgba(0,0,0,.74);
    z-index:10;
}

#score{
    font-size:43px;
    font-weight:750;
    line-height:1;
}

#score small{
    font-size:17px;
    opacity:.65;
}

#composition{
    margin-top:12px;
    font-size:21px;
    font-weight:750;
}

#desc{
    margin-top:6px;
    font-size:14px;
    line-height:1.4;
    opacity:.85;
}

#message{
    position:absolute;
    left:50%;
    bottom:18px;
    transform:translateX(-50%);
    width:92%;
    padding:14px;
    border-radius:18px;
    background:rgba(0,0,0,.80);
    text-align:center;
    font-size:16px;
    font-weight:700;
    z-index:10;
}

#version{
    position:absolute;
    left:8px;
    bottom:5px;
    font-size:11px;
    opacity:.72;
    z-index:20;
}

#controls{
    height:28%;
    padding:13px;
    background:#000;
}

#cameraButtons{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-bottom:11px;
}

button{
    color:#fff;
    border:none;
}

.cameraBtn{
    padding:10px 18px;
    background:#292929;
    border-radius:23px;
    font-size:15px;
}

#aiButton{
    width:100%;
    padding:13px;
    margin-bottom:13px;
    background:#fff;
    color:#000;
    border-radius:25px;
    font-size:17px;
    font-weight:bold;
}

#zoomRow{
    display:flex;
    gap:10px;
    align-items:center;
}

#zoom{
    flex:1;
}

#status{
    margin-top:15px;
    text-align:center;
    font-size:12px;
    opacity:.45;
}
</style>
</head>

<body>

<div id="cameraArea">

    <video id="video"
           autoplay
           playsinline
           muted></video>

    <canvas id="overlay"></canvas>

    <canvas id="analysisCanvas"
            width="240"
            height="180"></canvas>

    <div id="info">

        <div id="score">
            -- <small>%</small>
        </div>

        <div id="composition">
            等待分析
        </div>

        <div id="desc">
            對準道路、鐵軌、走廊或街道
        </div>

    </div>

    <div id="message">
        ✨ 固定鏡頭後，按 AI 自動分析
    </div>

    <div id="version">
        V5.8.2
    </div>

</div>


<div id="controls">

    <div id="cameraButtons">

        <button class="cameraBtn"
                onclick="changeCamera('user')">
            🤳 前鏡頭
        </button>

        <button class="cameraBtn"
                onclick="changeCamera('environment')">
            📷 後鏡頭
        </button>

    </div>

    <button id="aiButton"
            onclick="runAI()">
        ✨ AI 自動分析
    </button>

    <div id="zoomRow">

        <span>倍率</span>

        <input id="zoom"
               type="range"
               min="1"
               max="3"
               step=".1"
               value="1">

        <span id="zoomText">
            1.0×
        </span>

    </div>

    <div id="status">
        V5.8.2｜遠端收斂版
    </div>

</div>


<script>

/* =========================================================
   V5.8.2
   遠端收斂版

   目的：
   這版暫時不做最佳構圖導航。
   只驗證「真正消失點」。

   核心：
   1. Sobel 找線
   2. 不讓整張圖所有線自由投票
   3. 尋找左右兩側向遠方共同收斂
   4. 強化畫面中央 / 遠端候選
   5. 排除近景、單側建築物假交點
   6. 7幀中位數穩定
========================================================= */


/* =========================================================
   DOM
========================================================= */

var video =
document.getElementById("video");

var overlay =
document.getElementById("overlay");

var ctx =
overlay.getContext("2d");

var analysisCanvas =
document.getElementById("analysisCanvas");

var ax =
analysisCanvas.getContext(
    "2d",
    {willReadFrequently:true}
);

var scoreEl =
document.getElementById("score");

var compositionEl =
document.getElementById("composition");

var descEl =
document.getElementById("desc");

var messageEl =
document.getElementById("message");

var zoom =
document.getElementById("zoom");

var zoomText =
document.getElementById("zoomText");


/* =========================================================
   STATE
========================================================= */

var stream =
null;

var facing =
"environment";

var detectedPoint =
null;

var analyzing =
false;

var confidence =
0;


/* =========================================================
   UTIL
========================================================= */

function clamp(v,min,max){

    return Math.max(
        min,
        Math.min(max,v)
    );

}


function median(arr){

    if(
        !arr ||
        arr.length === 0
    ){
        return 0;
    }

    var copy =
    arr.slice().sort(
        function(a,b){
            return a-b;
        }
    );

    var middle =
    Math.floor(
        copy.length/2
    );

    if(
        copy.length % 2
    ){
        return copy[middle];
    }

    return(
        copy[middle-1]
        +
        copy[middle]
    )/2;

}


function angleDifference(a,b){

    var d =
    Math.abs(a-b);

    while(
        d > Math.PI
    ){
        d -= Math.PI;
    }

    if(
        d > Math.PI/2
    ){
        d =
        Math.PI-d;
    }

    return Math.abs(d);

}


/* =========================================================
   CAMERA
========================================================= */

async function startCamera(){

    try{

        if(stream){

            stream
            .getTracks()
            .forEach(
                function(track){
                    track.stop();
                }
            );

        }

        stream =
        await navigator.mediaDevices
        .getUserMedia({

            video:{

                facingMode:{
                    ideal:facing
                },

                width:{
                    ideal:1280
                },

                height:{
                    ideal:720
                }

            },

            audio:false

        });

        video.srcObject =
        stream;

        await video.play();

        resizeOverlay();

        resetAnalysis();

    }
    catch(error){

        console.log(error);

        compositionEl.innerText =
        "相機無法開啟";

        descEl.innerText =
        "請確認 Safari 相機權限";

        messageEl.innerText =
        "❌ 無法開啟相機";

    }

}


async function changeCamera(mode){

    facing =
    mode;

    await startCamera();

}


/* =========================================================
   RESET
========================================================= */

function resetAnalysis(){

    detectedPoint =
    null;

    analyzing =
    false;

    confidence =
    0;

    scoreEl.innerHTML =
    '-- <small>%</small>';

    compositionEl.innerText =
    "等待分析";

    descEl.innerText =
    "對準道路、鐵軌、走廊或街道";

    messageEl.innerText =
    "✨ 固定鏡頭後，按 AI 自動分析";

}


/* =========================================================
   RUN AI
========================================================= */

function runAI(){

    if(analyzing){
        return;
    }

    if(
        video.readyState < 2
    ){

        messageEl.innerText =
        "⏳ 鏡頭還沒準備完成";

        return;

    }

    analyzing =
    true;

    detectedPoint =
    null;

    confidence =
    0;

    scoreEl.innerHTML =
    '-- <small>%</small>';

    compositionEl.innerText =
    "AI 分析中";

    descEl.innerText =
    "正在尋找遠方收斂區";

    messageEl.innerText =
    "🔍 尋找左右線條共同收斂的位置...";


    var results =
    [];

    var frame =
    0;


    var timer =
    setInterval(
        function(){

            var result =
            analyzeVanishingPoint();

            if(result){
                results.push(result);
            }

            frame++;


            if(
                frame >= 7
            ){

                clearInterval(timer);

                analyzing =
                false;

                finishAnalysis(
                    results
                );

            }

        },
        170
    );

}


/* =========================================================
   MULTI FRAME
========================================================= */

function finishAnalysis(results){

    if(
        results.length < 3
    ){

        failAnalysis();

        return;

    }


    var mx =
    median(
        results.map(
            function(r){
                return r.vx;
            }
        )
    );


    var my =
    median(
        results.map(
            function(r){
                return r.vy;
            }
        )
    );


    /*
    先看各幀距離中位點多遠
    */

    var distances =
    results.map(
        function(r){

            return Math.hypot(
                r.vx-mx,
                r.vy-my
            );

        }
    );


    var md =
    median(distances);


    /*
    排除跳到建築物側邊的幀
    */

    var limit =
    Math.max(
        .035,
        md*2.2
    );


    var filtered =
    results.filter(
        function(r){

            return(
                Math.hypot(
                    r.vx-mx,
                    r.vy-my
                )
                <= limit
            );

        }
    );


    if(
        filtered.length < 3
    ){

        failAnalysis();

        return;

    }


    mx =
    median(
        filtered.map(
            function(r){
                return r.vx;
            }
        )
    );


    my =
    median(
        filtered.map(
            function(r){
                return r.vy;
            }
        )
    );


    var conf =
    median(
        filtered.map(
            function(r){
                return r.confidence;
            }
        )
    );


    detectedPoint = {

        vx:mx,

        vy:my

    };


    confidence =
    Math.round(
        clamp(
            conf*100,
            0,
            99
        )
    );


    scoreEl.innerHTML =
    confidence +
    ' <small>%</small>';


    compositionEl.innerText =
    "◎ 單點透視";


    descEl.innerText =
    "AI 找到遠方主要收斂點";


    messageEl.innerText =
    "🎯 只看綠色 AI 消失點是否正確";

}


/* =========================================================
   FAIL
========================================================= */

function failAnalysis(){

    detectedPoint =
    null;

    confidence =
    0;

    scoreEl.innerHTML =
    '-- <small>%</small>';

    compositionEl.innerText =
    "無法確認消失點";

    descEl.innerText =
    "左右線條沒有穩定共同收斂";

    messageEl.innerText =
    "📱 稍微調整畫面，再按 AI 自動分析";

}


/* =========================================================
   LINE INTERSECTION
========================================================= */

function lineIntersection(A,B){

    var dx1 =
    Math.cos(
        A.angle
    );

    var dy1 =
    Math.sin(
        A.angle
    );

    var dx2 =
    Math.cos(
        B.angle
    );

    var dy2 =
    Math.sin(
        B.angle
    );


    var denominator =
    dx1*dy2 -
    dy1*dx2;


    if(
        Math.abs(
            denominator
        ) < .00001
    ){
        return null;
    }


    var rx =
    B.x-A.x;

    var ry =
    B.y-A.y;


    var t =
    (
        rx*dy2 -
        ry*dx2
    )
    /
    denominator;


    return{

        x:
        A.x+t*dx1,

        y:
        A.y+t*dy1

    };

}


/* =========================================================
   LINE POINT DISTANCE
========================================================= */

function pointLineDistance(
    px,
    py,
    line
){

    var dx =
    Math.cos(
        line.angle
    );

    var dy =
    Math.sin(
        line.angle
    );


    return Math.abs(

        (px-line.x)*(-dy)

        +

        (py-line.y)*dx

    );

}


/* =========================================================
   ANALYSIS
========================================================= */

function analyzeVanishingPoint(){

    var W =
    analysisCanvas.width;

    var H =
    analysisCanvas.height;


    if(
        video.readyState < 2
    ){
        return null;
    }


    ax.drawImage(
        video,
        0,
        0,
        W,
        H
    );


    var image =
    ax.getImageData(
        0,
        0,
        W,
        H
    );


    var data =
    image.data;


    var gray =
    new Float32Array(
        W*H
    );


    /*
    =====================================================
    GRAYSCALE
    =====================================================
    */

    for(
        var i=0;
        i<W*H;
        i++
    ){

        var p =
        i*4;

        gray[i] =
        data[p]*.299
        +
        data[p+1]*.587
        +
        data[p+2]*.114;

    }


    /*
    =====================================================
    SOBEL
    =====================================================
    */

    var magnitude =
    new Float32Array(
        W*H
    );

    var lineAngle =
    new Float32Array(
        W*H
    );

    var values =
    [];


    for(
        var y=1;
        y<H-1;
        y++
    ){

        for(
            var x=1;
            x<W-1;
            x++
        ){

            var idx =
            y*W+x;


            var gx =

            -gray[idx-W-1]
            +
            gray[idx-W+1]

            -

            2*gray[idx-1]
            +
            2*gray[idx+1]

            -

            gray[idx+W-1]
            +
            gray[idx+W+1];


            var gy =

            -gray[idx-W-1]
            -
            2*gray[idx-W]
            -
            gray[idx-W+1]

            +

            gray[idx+W-1]
            +
            2*gray[idx+W]
            +
            gray[idx+W+1];


            var mag =
            Math.hypot(
                gx,
                gy
            );


            magnitude[idx] =
            mag;


            /*
            Sobel方向是法線，
            +90度得到邊緣線方向
            */

            var angle =
            Math.atan2(
                gy,
                gx
            )
            +
            Math.PI/2;


            while(
                angle > Math.PI/2
            ){
                angle -= Math.PI;
            }


            while(
                angle < -Math.PI/2
            ){
                angle += Math.PI;
            }


            lineAngle[idx] =
            angle;


            values.push(
                mag
            );

        }

    }


    if(
        values.length === 0
    ){
        return null;
    }


    values.sort(
        function(a,b){
            return a-b;
        }
    );


    /*
    取最強約8.5%的邊緣
    */

    var threshold =
    values[
        Math.floor(
            values.length*.915
        )
    ];


    if(
        !threshold ||
        threshold < 20
    ){
        return null;
    }


    /*
    =====================================================
    候選透視線

    V5.8.2關鍵：
    不再把整張圖最長的線都留下。

    我們找「位置 + 方向」是否像是
    指向畫面遠方中央區域。
    =====================================================
    */

    var candidates =
    [];

    var cell =
    8;


    /*
    消失點大多不會在最底部。

    先建立一個較寬鬆的遠方區域：
    x = 18% ~ 82%
    y = 18% ~ 68%

    注意：
    這不是直接指定消失點，
    只是排除明顯不合理的側邊交點。
    */


    for(
        var cy=0;
        cy<H;
        cy+=cell
    ){

        for(
            var cx=0;
            cx<W;
            cx+=cell
        ){

            var bestMag =
            0;

            var bx =
            0;

            var by =
            0;

            var ba =
            0;


            for(
                var yy=cy;
                yy<
                Math.min(
                    cy+cell,
                    H
                );
                yy++
            ){

                for(
                    var xx=cx;
                    xx<
                    Math.min(
                        cx+cell,
                        W
                    );
                    xx++
                ){

                    var id =
                    yy*W+xx;


                    if(
                        magnitude[id]
                        <
                        threshold
                    ){
                        continue;
                    }


                    var angle =
                    lineAngle[id];


                    /*
                    排除近水平線。
                    */

                    if(
                        Math.abs(angle)
                        <
                        .12
                    ){
                        continue;
                    }


                    /*
                    完全垂直的建築線
                    不適合判斷水平景深消失點。
                    */

                    if(
                        Math.abs(angle)
                        >
                        1.46
                    ){
                        continue;
                    }


                    if(
                        magnitude[id]
                        >
                        bestMag
                    ){

                        bestMag =
                        magnitude[id];

                        bx =
                        xx;

                        by =
                        yy;

                        ba =
                        angle;

                    }

                }

            }


            if(
                bestMag <= 0
            ){
                continue;
            }


            /*
            =================================================
            方向預測

            從目前線條延伸，
            看它在較上方是否朝中央靠近。

            這是V5.8.2核心。
            =================================================
            */

            var dirX =
            Math.cos(ba);

            var dirY =
            Math.sin(ba);


            /*
            我們需要知道哪個方向是「往上」。
            */

            if(
                dirY > 0
            ){

                dirX =
                -dirX;

                dirY =
                -dirY;

            }


            /*
            如果幾乎沒有垂直分量，
            無法推測遠方。
            */

            if(
                Math.abs(dirY)
                <
                .10
            ){
                continue;
            }


            /*
            把這條線延伸到
            畫面40%高度附近。

            看預測X會落在哪。
            */

            var testY =
            H*.42;


            var t =
            (
                testY-by
            )
            /
            dirY;


            var projectedX =
            bx +
            dirX*t;


            /*
            投影位置跑太遠，
            很可能是局部斜線。
            */

            if(
                projectedX
                <
                -W*.15
                ||
                projectedX
                >
                W*1.15
            ){
                continue;
            }


            /*
            =================================================
            收斂方向判斷

            左半邊的線，
            往遠方應該偏向右。

            右半邊的線，
            往遠方應該偏向左。
            =================================================
            */

            var centerX =
            W*.5;


            var towardCenter =
            false;


            if(
                bx < centerX
                &&
                projectedX > bx
            ){

                towardCenter =
                true;

            }


            if(
                bx > centerX
                &&
                projectedX < bx
            ){

                towardCenter =
                true;

            }


            /*
            靠近正中央的線例外，
            允許近乎垂直。
            */

            if(
                Math.abs(
                    bx-centerX
                )
                <
                W*.10
            ){

                towardCenter =
                true;

            }


            if(!towardCenter){
                continue;
            }


            /*
            越靠近畫面下方的透視線
            幾何判斷力越強。

            但不像5.8.1那樣直接
            大幅增加長線權重。
            */

            var depth =
            .75
            +
            (
                by/H
            )*.35;


            candidates.push({

                x:bx,

                y:by,

                angle:ba,

                strength:
                bestMag,

                projectedX:
                projectedX,

                weight:
                bestMag*depth

            });

        }

    }


    if(
        candidates.length < 8
    ){
        return null;
    }


    /*
    不讓窗戶數量無限增加。
    */

    candidates.sort(
        function(a,b){
            return b.weight-a.weight;
        }
    );


    if(
        candidates.length > 60
    ){

        candidates =
        candidates.slice(
            0,
            60
        );

    }


    /*
    =====================================================
    分左右
    =====================================================
    */

    var leftLines =
    [];

    var rightLines =
    [];


    candidates.forEach(
        function(line){

            if(
                line.x < W*.48
            ){

                leftLines.push(
                    line
                );

            }
            else
            if(
                line.x > W*.52
            ){

                rightLines.push(
                    line
                );

            }

        }
    );


    if(
        leftLines.length < 2
        ||
        rightLines.length < 2
    ){

        return null;

    }


    /*
    =====================================================
    左右配對交點

    只有「左側線 + 右側線」才能投票。

    這直接解決5.8.1：
    同一棟右側建築物的兩條線
    自己產生假消失點。
    =====================================================
    */

    var intersections =
    [];


    for(
        var a=0;
        a<leftLines.length;
        a++
    ){

        for(
            var b=0;
            b<rightLines.length;
            b++
        ){

            var L =
            leftLines[a];

            var R =
            rightLines[b];


            var p =
            lineIntersection(
                L,
                R
            );


            if(!p){
                continue;
            }


            /*
            =================================================
            遠端候選區

            x不能跑到建築物側面。
            y不能落到非常近的路面。
            =================================================
            */

            if(
                p.x < W*.16
                ||
                p.x > W*.84
                ||
                p.y < H*.12
                ||
                p.y > H*.68
            ){

                continue;

            }


            /*
            左右線來源必須有足夠距離。
            */

            var sourceSpread =
            R.x-L.x;


            if(
                sourceSpread <
                W*.18
            ){

                continue;

            }


            /*
            兩條線不能近乎平行。
            */

            var ad =
            angleDifference(
                L.angle,
                R.angle
            );


            if(
                ad < .18
            ){
                continue;
            }


            /*
            =================================================
            真正的「遠端收斂」

            交點必須大致位於
            兩條來源線的上方。

            道路 / 鐵軌 / 街道
            都應該符合。
            =================================================
            */

            var averageSourceY =
            (
                L.y+R.y
            )/2;


            if(
                p.y >
                averageSourceY
                +
                H*.06
            ){

                continue;

            }


            /*
            =================================================
            中央性

            不是強迫正中央。

            但當兩個候選品質接近時，
            中央遠方交點優先於
            左右建築物上的假交點。
            =================================================
            */

            var nx =
            p.x/W;


            var centerDistance =
            Math.abs(
                nx-.5
            );


            var centerWeight =
            1 -
            clamp(
                centerDistance/.42,
                0,
                .65
            );


            /*
            =================================================
            遠端高度權重

            0.28~0.55通常比0.65的
            近景交點更像真正遠方。

            只作輕度偏好。
            =================================================
            */

            var ny =
            p.y/H;


            var horizonWeight =
            1;


            if(
                ny > .58
            ){

                horizonWeight =
                .70;

            }
            else
            if(
                ny > .50
            ){

                horizonWeight =
                .88;

            }


            /*
            來源線左右越分開，
            對透視判斷越可靠。
            */

            var spreadWeight =
            clamp(
                sourceSpread/(W*.55),
                .35,
                1
            );


            /*
            方向差太小可信度較低。
            */

            var angleWeight =
            clamp(
                ad/.70,
                .30,
                1
            );


            var baseWeight =
            Math.sqrt(
                L.weight*
                R.weight
            );


            var weight =
            baseWeight
            *
            (
                .55 +
                centerWeight*.45
            )
            *
            horizonWeight
            *
            spreadWeight
            *
            angleWeight;


            intersections.push({

                x:p.x,

                y:p.y,

                weight:weight

            });

        }

    }


    if(
        intersections.length < 5
    ){
        return null;
    }


    /*
    =====================================================
    2D 密度投票

    找「很多左右線共同指向的小區域」，
    而不是單一最強交點。
    =====================================================
    */

    var gridW =
    36;

    var gridH =
    27;


    var votes =
    new Float32Array(
        gridW*gridH
    );


    intersections.forEach(
        function(p){

            var gx =
            Math.floor(
                p.x/W*gridW
            );

            var gy =
            Math.floor(
                p.y/H*gridH
            );


            if(
                gx < 0 ||
                gx >= gridW ||
                gy < 0 ||
                gy >= gridH
            ){
                return;
            }


            /*
            小範圍模糊投票
            */

            for(
                var yy=-1;
                yy<=1;
                yy++
            ){

                for(
                    var xx=-1;
                    xx<=1;
                    xx++
                ){

                    var nx =
                    gx+xx;

                    var ny =
                    gy+yy;


                    if(
                        nx < 0 ||
                        nx >= gridW ||
                        ny < 0 ||
                        ny >= gridH
                    ){
                        continue;
                    }


                    var blur =
                    1;


                    if(
                        xx !== 0 ||
                        yy !== 0
                    ){

                        blur =
                        .38;

                    }


                    votes[
                        ny*gridW+nx
                    ]
                    +=
                    p.weight*blur;

                }

            }

        }
    );


    /*
    找最高投票格
    */

    var bestIndex =
    0;


    for(
        var i2=1;
        i2<votes.length;
        i2++
    ){

        if(
            votes[i2]
            >
            votes[bestIndex]
        ){

            bestIndex =
            i2;

        }

    }


    var bestGX =
    bestIndex %
    gridW;


    var bestGY =
    Math.floor(
        bestIndex/gridW
    );


    /*
    =====================================================
    收集附近交點
    =====================================================
    */

    var cluster =
    [];


    intersections.forEach(
        function(p){

            var gx =
            Math.floor(
                p.x/W*gridW
            );

            var gy =
            Math.floor(
                p.y/H*gridH
            );


            if(
                Math.abs(
                    gx-bestGX
                ) <= 1
                &&
                Math.abs(
                    gy-bestGY
                ) <= 1
            ){

                cluster.push(p);

            }

        }
    );


    if(
        cluster.length < 3
    ){
        return null;
    }


    /*
    =====================================================
    Cluster中位數
    =====================================================
    */

    var mx =
    median(
        cluster.map(
            function(p){
                return p.x;
            }
        )
    );


    var my =
    median(
        cluster.map(
            function(p){
                return p.y;
            }
        )
    );


    /*
    =====================================================
    再次排除cluster離群
    =====================================================
    */

    var clusterDistances =
    cluster.map(
        function(p){

            return Math.hypot(
                p.x-mx,
                p.y-my
            );

        }
    );


    var cmd =
    median(
        clusterDistances
    );


    var clusterLimit =
    Math.max(
        5,
        cmd*2.0
    );


    var clean =
    cluster.filter(
        function(p){

            return(
                Math.hypot(
                    p.x-mx,
                    p.y-my
                )
                <=
                clusterLimit
            );

        }
    );


    if(
        clean.length < 3
    ){

        clean =
        cluster;

    }


    /*
    =====================================================
    最終加權中心
    =====================================================
    */

    var sumX =
    0;

    var sumY =
    0;

    var sumW =
    0;


    clean.forEach(
        function(p){

            var w =
            Math.sqrt(
                Math.max(
                    1,
                    p.weight
                )
            );


            sumX +=
            p.x*w;

            sumY +=
            p.y*w;

            sumW +=
            w;

        }
    );


    if(
        sumW <= 0
    ){
        return null;
    }


    var vx =
    sumX/sumW;

    var vy =
    sumY/sumW;


    /*
    =====================================================
    最終左右支持驗證

    消失點附近必須真的同時有：
    左側透視線支持
    +
    右側透視線支持
    =====================================================
    */

    var leftSupport =
    0;

    var rightSupport =
    0;


    leftLines.forEach(
        function(line){

            var d =
            pointLineDistance(
                vx,
                vy,
                line
            );


            if(
                d < W*.055
            ){

                leftSupport++;

            }

        }
    );


    rightLines.forEach(
        function(line){

            var d =
            pointLineDistance(
                vx,
                vy,
                line
            );


            if(
                d < W*.055
            ){

                rightSupport++;

            }

        }
    );


    if(
        leftSupport < 1
        ||
        rightSupport < 1
    ){

        return null;

    }


    /*
    =====================================================
    信心值

    注意：
    這不是構圖分數。

    只是「AI對這個消失點有多確定」。
    =====================================================
    */

    var clusterRatio =
    clean.length /
    intersections.length;


    var balance =
    Math.min(
        leftSupport,
        rightSupport
    )
    /
    Math.max(
        leftSupport,
        rightSupport
    );


    var supportTotal =
    leftSupport +
    rightSupport;


    var supportScore =
    clamp(
        supportTotal/12,
        0,
        1
    );


    var densityScore =
    clamp(
        clusterRatio*.10*10,
        0,
        1
    );


    /*
    多數正常結果會落在
    約55~95%
    */

    var conf =
    .35
    +
    supportScore*.25
    +
    balance*.18
    +
    densityScore*.17;


    /*
    如果消失點非常靠左右，
    稍降信心。
    */

    var centerDistance =
    Math.abs(
        vx/W-.5
    );


    if(
        centerDistance > .30
    ){

        conf -= .10;

    }


    conf =
    clamp(
        conf,
        .20,
        .98
    );


    return{

        vx:
        clamp(
            vx/W,
            .05,
            .95
        ),

        vy:
        clamp(
            vy/H,
            .08,
            .75
        ),

        confidence:
        conf,

        leftSupport:
        leftSupport,

        rightSupport:
        rightSupport

    };

}


/* =========================================================
   DRAW
========================================================= */

function drawDetectedPoint(){

    if(!detectedPoint){
        return;
    }


    var w =
    overlay.clientWidth;

    var h =
    overlay.clientHeight;


    var x =
    detectedPoint.vx*w;

    var y =
    detectedPoint.vy*h;


    ctx.save();


    /*
    大外圈
    */

    ctx.strokeStyle =
    "#2cff67";

    ctx.fillStyle =
    "#2cff67";

    ctx.lineWidth =
    4;

    ctx.setLineDash([]);


    ctx.beginPath();

    ctx.arc(
        x,
        y,
        25,
        0,
        Math.PI*2
    );

    ctx.stroke();


    /*
    中心點
    */

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        9,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
    十字
    */

    ctx.lineWidth =
    3;


    ctx.beginPath();

    ctx.moveTo(
        x-43,
        y
    );

    ctx.lineTo(
        x-30,
        y
    );


    ctx.moveTo(
        x+30,
        y
    );

    ctx.lineTo(
        x+43,
        y
    );


    ctx.moveTo(
        x,
        y-43
    );

    ctx.lineTo(
        x,
        y-30
    );


    ctx.moveTo(
        x,
        y+30
    );

    ctx.lineTo(
        x,
        y+43
    );


    ctx.stroke();


    /*
    標籤
    */

    ctx.font =
    "bold 16px -apple-system,Arial";

    ctx.textAlign =
    "center";

    ctx.fillStyle =
    "#2cff67";


    ctx.fillText(
        "● AI 消失點",
        x,
        y-50
    );


    ctx.restore();

}


/* =========================================================
   RESIZE
========================================================= */

function resizeOverlay(){

    var rect =
    overlay.getBoundingClientRect();


    var dpr =
    window.devicePixelRatio ||
    1;


    overlay.width =
    Math.round(
        rect.width*dpr
    );


    overlay.height =
    Math.round(
        rect.height*dpr
    );


    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

}


/* =========================================================
   LOOP
========================================================= */

function loop(){

    ctx.clearRect(
        0,
        0,
        overlay.clientWidth,
        overlay.clientHeight
    );


    drawDetectedPoint();


    requestAnimationFrame(
        loop
    );

}


/* =========================================================
   ZOOM
========================================================= */

zoom.addEventListener(
    "input",
    async function(){

        var value =
        Number(
            this.value
        );


        zoomText.innerText =
        value.toFixed(1)
        +
        "×";


        if(!stream){
            return;
        }


        var tracks =
        stream.getVideoTracks();


        if(
            tracks.length === 0
        ){
            return;
        }


        var track =
        tracks[0];


        if(
            !track.getCapabilities
        ){
            return;
        }


        var capabilities =
        track.getCapabilities();


        if(
            !capabilities.zoom
        ){
            return;
        }


        try{

            var actualZoom =
            clamp(
                value,
                capabilities.zoom.min,
                capabilities.zoom.max
            );


            await track.applyConstraints({

                advanced:[
                    {
                        zoom:
                        actualZoom
                    }
                ]

            });

        }
        catch(error){

            console.log(
                "Zoom unsupported",
                error
            );

        }

    }
);


/* =========================================================
   ERROR HANDLING
========================================================= */

window.onerror =
function(
    message,
    source,
    line
){

    console.log(
        message,
        source,
        line
    );


    messageEl.innerText =
    "⚠️ 程式錯誤：" +
    message;


    return false;

};


window.addEventListener(
    "unhandledrejection",
    function(event){

        console.log(
            event.reason
        );


        messageEl.innerText =
        "⚠️ 執行錯誤，請重新整理";

    }
);


/* =========================================================
   EVENTS
========================================================= */

window.addEventListener(
    "resize",
    resizeOverlay
);


window.addEventListener(
    "orientationchange",
    function(){

        setTimeout(
            resizeOverlay,
            250
        );

    }
);


/* =========================================================
   START
========================================================= */

startCamera();

requestAnimationFrame(
    loop
);

</script>
