<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>AI 構圖助手 V5.4</title>

<style>

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    color:#fff;
    font-family:Arial,sans-serif;
}

#cameraArea{
    position:relative;
    width:100%;
    height:72%;
    overflow:hidden;
    background:#111;
}

video{
    position:absolute;
    width:100%;
    height:100%;
    object-fit:cover;
}

#overlay{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
}

#analysisCanvas{
    display:none;
}

#info{
    position:absolute;
    top:18px;
    left:16px;
    z-index:10;

    min-width:190px;

    background:rgba(0,0,0,.68);

    padding:13px 17px;

    border-radius:18px;
}

#score{
    font-size:40px;
    font-weight:bold;
}

#score small{
    font-size:16px;
    opacity:.7;
}

#composition{
    margin-top:5px;
    font-size:20px;
    font-weight:bold;
}

#desc{
    margin-top:5px;
    font-size:13px;
    opacity:.8;
}

#message{
    position:absolute;

    left:50%;
    bottom:20px;

    transform:translateX(-50%);

    width:90%;

    z-index:10;

    background:rgba(0,0,0,.75);

    border-radius:18px;

    padding:13px;

    text-align:center;

    font-size:16px;
    font-weight:bold;
}

#version{
    position:absolute;
    left:8px;
    bottom:5px;

    font-size:11px;
    opacity:.45;
}

#controls{
    height:28%;
    background:#000;
    padding:13px;
}

#cameraButtons{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-bottom:10px;
}

.cameraBtn{
    border:none;
    background:#292929;
    color:white;

    border-radius:22px;

    padding:10px 17px;

    font-size:15px;
}

#modes{
    display:flex;
    gap:8px;

    overflow-x:auto;

    margin-bottom:11px;
}

.mode{
    flex:none;

    border:1px solid #555;

    background:#111;
    color:#ddd;

    border-radius:25px;

    padding:10px 16px;

    font-size:15px;
}

.mode.active{
    background:#fff;
    color:#000;
    font-weight:bold;
}

#zoomRow{
    display:flex;
    align-items:center;
    gap:10px;
}

#zoom{
    flex:1;
}

</style>
</head>


<body>


<div id="cameraArea">

    <video
        id="video"
        autoplay
        playsinline
        muted>
    </video>


    <canvas id="overlay"></canvas>

    <canvas
        id="analysisCanvas"
        width="160"
        height="120">
    </canvas>


    <div id="info">

        <div id="score">
            --
            <small>/100</small>
        </div>

        <div id="composition">
            等待分析
        </div>

        <div id="desc">
            先將鏡頭對準想拍的畫面
        </div>

    </div>


    <div id="message">
        按「✨ AI 自動」分析目前畫面
    </div>


    <div id="version">
        V5.4
    </div>

</div>



<div id="controls">

    <div id="cameraButtons">

        <button
        class="cameraBtn"
        onclick="changeCamera('user')">

            🤳 前鏡頭

        </button>


        <button
        class="cameraBtn"
        onclick="changeCamera('environment')">

            📷 後鏡頭

        </button>

    </div>


    <div id="modes">

        <button
        class="mode active"
        id="autoBtn"
        onclick="selectMode('auto',this)">

            ✨ AI 自動

        </button>


        <button
        class="mode"
        onclick="selectMode('third',this)">

            # 三分法

        </button>


        <button
        class="mode"
        onclick="selectMode('center',this)">

            ◎ 居中

        </button>


        <button
        class="mode"
        onclick="selectMode('leading',this)">

            ↗ 引導線

        </button>


        <button
        class="mode"
        onclick="selectMode('vshape',this)">

            V 型

        </button>

    </div>


    <div id="zoomRow">

        <span>倍率</span>

        <input
        id="zoom"
        type="range"
        min="1"
        max="3"
        step="0.1"
        value="1">

        <span id="zoomText">
            1.0×
        </span>

    </div>

</div>


<script>

const video =
document.getElementById("video");

const overlay =
document.getElementById("overlay");

const ctx =
overlay.getContext("2d");

const analysisCanvas =
document.getElementById("analysisCanvas");

const actx =
analysisCanvas.getContext(
    "2d",
    {willReadFrequently:true}
);

const scoreBox =
document.getElementById("score");

const compositionBox =
document.getElementById("composition");

const descBox =
document.getElementById("desc");

const messageBox =
document.getElementById("message");

const zoomSlider =
document.getElementById("zoom");

const zoomText =
document.getElementById("zoomText");


let stream = null;

let facingMode = "environment";

/*
目前鎖定的構圖
*/
let lockedMode = null;

/*
是否進入導航
*/
let navigationActive = false;

/*
目前動態分數
*/
let currentScore = 0;

/*
每隔多久分析一次
*/
let lastAnalysisTime = 0;

const ANALYSIS_INTERVAL = 280;



/* =====================================
   CAMERA
===================================== */

async function startCamera(){

    try{

        if(stream){

            stream.getTracks()
            .forEach(track=>{
                track.stop();
            });

        }

        stream =
        await navigator.mediaDevices
        .getUserMedia({

            video:{
                facingMode:{
                    ideal:facingMode
                },

                width:{
                    ideal:1280
                },

                height:{
                    ideal:720
                }
            },

            audio:false

        });


        video.srcObject = stream;

        await video.play();

        resizeCanvas();


        navigationActive = false;
        lockedMode = null;

        scoreBox.innerHTML =
        `-- <small>/100</small>`;

        compositionBox.innerText =
        "等待分析";

        descBox.innerText =
        "先將鏡頭對準想拍的畫面";

        messageBox.innerText =
        "按「✨ AI 自動」分析目前畫面";

    }

    catch(err){

        console.error(err);

        messageBox.innerText =
        "❌ 無法開啟鏡頭，請檢查相機權限";

    }

}



async function changeCamera(mode){

    facingMode = mode;

    await startCamera();

}



/* =====================================
   MODE
===================================== */

function selectMode(mode,button){

    document
    .querySelectorAll(".mode")
    .forEach(btn=>{

        btn.classList.remove("active");

    });


    button.classList.add("active");


    if(mode === "auto"){

        runAutoAnalysis();

        return;

    }


    lockedMode = mode;

    navigationActive = true;

    updateModeText(mode);

}



/* =====================================
   AI AUTO
===================================== */

function runAutoAnalysis(){

    if(
        video.readyState < 2
    ){

        messageBox.innerText =
        "鏡頭尚未準備完成";

        return;

    }


    navigationActive = false;

    lockedMode = null;


    compositionBox.innerText =
    "AI 分析中";

    descBox.innerText =
    "正在分析畫面線條與位置";

    scoreBox.innerHTML =
    `-- <small>/100</small>`;

    messageBox.innerText =
    "✨ 分析目前畫面...";


    setTimeout(()=>{

        const result =
        analyzeFrame();


        const scores = {

            vshape:
            result.vshape,

            leading:
            result.leading,

            third:
            result.third,

            center:
            result.center

        };


        let bestMode =
        "center";

        let bestScore =
        -1;


        for(
            const mode in scores
        ){

            if(
                scores[mode] >
                bestScore
            ){

                bestScore =
                scores[mode];

                bestMode =
                mode;

            }

        }


        lockedMode =
        bestMode;

        navigationActive =
        true;

        currentScore =
        bestScore;


        updateModeText(
            bestMode
        );


        updateScore(
            bestScore
        );


    },650);

}



/* =====================================
   真實畫面分析
===================================== */

function analyzeFrame(){

    const W =
    analysisCanvas.width;

    const H =
    analysisCanvas.height;


    actx.drawImage(
        video,
        0,
        0,
        W,
        H
    );


    const img =
    actx.getImageData(
        0,
        0,
        W,
        H
    );


    const data =
    img.data;


    /*
    轉灰階
    */

    const gray =
    new Float32Array(
        W * H
    );


    for(
        let y=0;
        y<H;
        y++
    ){

        for(
            let x=0;
            x<W;
            x++
        ){

            const i =
            (y*W+x)*4;


            gray[y*W+x] =

                data[i] * 0.299 +

                data[i+1] * 0.587 +

                data[i+2] * 0.114;

        }

    }


    /*
    Sobel 邊緣
    */

    const edge =
    new Float32Array(
        W * H
    );


    let totalEdge = 0;


    for(
        let y=1;
        y<H-1;
        y++
    ){

        for(
            let x=1;
            x<W-1;
            x++
        ){

            const p =
            y*W+x;


            const gx =

            -gray[p-W-1]
            +
            gray[p-W+1]

            -

            2*gray[p-1]
            +
            2*gray[p+1]

            -

            gray[p+W-1]
            +
            gray[p+W+1];


            const gy =

            -gray[p-W-1]

            -
            2*gray[p-W]

            -
            gray[p-W+1]

            +

            gray[p+W-1]

            +
            2*gray[p+W]

            +
            gray[p+W+1];


            const mag =
            Math.sqrt(
                gx*gx +
                gy*gy
            );


            edge[p] =
            mag;


            totalEdge +=
            mag;

        }

    }


    /*
    避免全黑畫面
    */

    if(
        totalEdge < 1
    ){

        return{

            vshape:40,
            leading:40,
            third:40,
            center:40

        };

    }


    const centerScore =
    calculateCenterScore(
        edge,
        W,
        H,
        totalEdge
    );


    const thirdScore =
    calculateThirdScore(
        edge,
        W,
        H,
        totalEdge
    );


    const vScore =
    calculateVScore(
        edge,
        W,
        H,
        totalEdge
    );


    const leadingScore =
    calculateLeadingScore(
        edge,
        W,
        H,
        totalEdge
    );


    return{

        center:
        centerScore,

        third:
        thirdScore,

        vshape:
        vScore,

        leading:
        leadingScore

    };

}



/* =====================================
   居中構圖分數
===================================== */

function calculateCenterScore(
    edge,
    W,
    H,
    total
){

    let inside = 0;


    const cx =
    W * 0.5;

    const cy =
    H * 0.5;


    const rx =
    W * 0.22;

    const ry =
    H * 0.28;


    for(
        let y=0;
        y<H;
        y++
    ){

        for(
            let x=0;
            x<W;
            x++
        ){

            const dx =
            (x-cx)/rx;

            const dy =
            (y-cy)/ry;


            if(
                dx*dx +
                dy*dy <
                1
            ){

                inside +=
                edge[y*W+x];

            }

        }

    }


    const ratio =
    inside /
    total;


    return clampScore(
        45 +
        ratio * 220
    );

}



/* =====================================
   三分法
===================================== */

function calculateThirdScore(
    edge,
    W,
    H,
    total
){

    const points = [

        [
            W/3,
            H/3
        ],

        [
            W*2/3,
            H/3
        ],

        [
            W/3,
            H*2/3
        ],

        [
            W*2/3,
            H*2/3
        ]

    ];


    let energy = 0;


    const radius =
    Math.min(
        W,
        H
    ) * 0.13;


    for(
        let y=0;
        y<H;
        y++
    ){

        for(
            let x=0;
            x<W;
            x++
        ){

            for(
                const p
                of points
            ){

                const dx =
                x-p[0];

                const dy =
                y-p[1];


                if(
                    dx*dx +
                    dy*dy <
                    radius*radius
                ){

                    energy +=
                    edge[y*W+x];

                    break;

                }

            }

        }

    }


    const ratio =
    energy /
    total;


    return clampScore(
        40 +
        ratio * 160
    );

}



/* =====================================
   V 型
===================================== */

function calculateVScore(
    edge,
    W,
    H,
    total
){

    let energy = 0;

    let zoneTotal = 0;


    /*
    理想 V 消失點
    */

    const vanishX =
    W * 0.5;

    const vanishY =
    H * 0.76;


    /*
    左右起點
    */

    const leftX =
    W * 0.12;

    const rightX =
    W * 0.88;

    const topY =
    H * 0.18;


    const tolerance =
    W * 0.08;


    for(
        let y=0;
        y<H;
        y++
    ){

        for(
            let x=0;
            x<W;
            x++
        ){

            const e =
            edge[y*W+x];


            if(
                e < 55
            )
            continue;


            zoneTotal += e;


            const d1 =
            pointLineDistance(

                x,
                y,

                leftX,
                topY,

                vanishX,
                vanishY

            );


            const d2 =
            pointLineDistance(

                x,
                y,

                rightX,
                topY,

                vanishX,
                vanishY

            );


            if(
                d1 <
                tolerance
                ||
                d2 <
                tolerance
            ){

                energy +=
                e;

            }

        }

    }


    if(
        zoneTotal < 1
    )
    return 40;


    const ratio =
    energy /
    zoneTotal;


    return clampScore(
        38 +
        ratio * 120
    );

}



/* =====================================
   引導線
===================================== */

function calculateLeadingScore(
    edge,
    W,
    H,
    total
){

    let lowerEnergy = 0;

    let centerEnergy = 0;


    for(
        let y=0;
        y<H;
        y++
    ){

        for(
            let x=0;
            x<W;
            x++
        ){

            const e =
            edge[y*W+x];


            /*
            下半部
            */

            if(
                y >
                H * 0.55
            ){

                lowerEnergy +=
                e;

            }


            /*
            中央深處
            */

            if(

                y >
                H*0.30
                &&

                y <
                H*0.72
                &&

                x >
                W*0.32
                &&

                x <
                W*0.68

            ){

                centerEnergy +=
                e;

            }

        }

    }


    const ratio =

    (
        lowerEnergy * 0.55
        +
        centerEnergy
    )
    /
    total;


    return clampScore(
        38 +
        ratio * 90
    );

}



/* =====================================
   點到線距離
===================================== */

function pointLineDistance(
    px,
    py,
    x1,
    y1,
    x2,
    y2
){

    const A =
    px-x1;

    const B =
    py-y1;

    const C =
    x2-x1;

    const D =
    y2-y1;


    const dot =
    A*C +
    B*D;


    const len =
    C*C +
    D*D;


    let param =
    dot /
    len;


    param =
    Math.max(
        0,
        Math.min(
            1,
            param
        )
    );


    const xx =
    x1 +
    param*C;


    const yy =
    y1 +
    param*D;


    const dx =
    px-xx;

    const dy =
    py-yy;


    return Math.sqrt(
        dx*dx +
        dy*dy
    );

}



/* =====================================
   分數範圍
===================================== */

function clampScore(v){

    return Math.round(

        Math.max(
            35,
            Math.min(
                96,
                v
            )
        )

    );

}



/* =====================================
   動態更新
===================================== */

function updateLiveScore(){

    if(
        !navigationActive
        ||
        !lockedMode
    )
    return;


    const result =
    analyzeFrame();


    let score =
    result[lockedMode];


    if(
        score === undefined
    )
    return;


    /*
    做一點平滑，
    避免數字跳太快
    */

    currentScore =
    Math.round(

        currentScore * 0.65
        +
        score * 0.35

    );


    updateScore(
        currentScore
    );

}



/* =====================================
   更新文字
===================================== */

function updateModeText(mode){

    const names = {

        vshape:
        "V 型構圖",

        leading:
        "引導線構圖",

        third:
        "三分法",

        center:
        "居中構圖"

    };


    compositionBox.innerText =
    names[mode];


    if(
        mode === "vshape"
    ){

        descBox.innerText =
        "讓場景線條靠近白色 V 虛線";

        messageBox.innerText =
        "📱 移動手機，讓實景線條貼近 V 線";

    }


    else if(
        mode === "third"
    ){

        descBox.innerText =
        "將主要景物靠近三分線交點";

        messageBox.innerText =
        "📱 移動手機，讓主體靠近白色交點";

    }


    else if(
        mode === "center"
    ){

        descBox.innerText =
        "將主要主體放入中央區域";

        messageBox.innerText =
        "📱 將主要主體移到中央";

    }


    else if(
        mode === "leading"
    ){

        descBox.innerText =
        "讓線條引導視線進入畫面";

        messageBox.innerText =
        "📱 調整角度，讓線條朝中央延伸";

    }

}



/* =====================================
   SCORE
===================================== */

function updateScore(score){

    scoreBox.innerHTML =
    `${score} <small>/100</small>`;


    if(
        score >= 85
    ){

        messageBox.innerText =
        "✅ 構圖完成，可以拍了";

    }


    else if(
        score >= 72
    ){

        messageBox.innerText =
        "🟡 很接近，再微調一下";

    }

}



/* =====================================
   OVERLAY DRAW
===================================== */

function resizeCanvas(){

    const rect =
    overlay.getBoundingClientRect();

    const dpr =
    window.devicePixelRatio || 1;


    overlay.width =
    rect.width * dpr;

    overlay.height =
    rect.height * dpr;


    ctx.setTransform(

        dpr,
        0,
        0,
        dpr,
        0,
        0

    );

}



function getGuideColor(){

    if(
        currentScore >= 85
    )
    return "#35ff63";


    if(
        currentScore >= 72
    )
    return "#ffd629";


    return "rgba(255,255,255,.92)";

}



/* V 型 */

function drawV(){

    const w =
    overlay.clientWidth;

    const h =
    overlay.clientHeight;


    const cx =
    w * 0.5;

    const bottomY =
    h * 0.76;

    const topY =
    h * 0.18;


    ctx.save();

    ctx.strokeStyle =
    getGuideColor();

    ctx.lineWidth =
    3;

    ctx.setLineDash([
        13,
        9
    ]);


    ctx.beginPath();

    ctx.moveTo(
        w*0.12,
        topY
    );

    ctx.lineTo(
        cx,
        bottomY
    );

    ctx.stroke();


    ctx.beginPath();

    ctx.moveTo(
        w*0.88,
        topY
    );

    ctx.lineTo(
        cx,
        bottomY
    );

    ctx.stroke();


    ctx.restore();

}



/* 三分法 */

function drawThird(){

    const w =
    overlay.clientWidth;

    const h =
    overlay.clientHeight;


    ctx.save();

    ctx.strokeStyle =
    getGuideColor();

    ctx.fillStyle =
    getGuideColor();

    ctx.lineWidth =
    2;

    ctx.setLineDash([
        10,
        8
    ]);


    for(
        let i=1;
        i<=2;
        i++
    ){

        ctx.beginPath();

        ctx.moveTo(
            w*i/3,
            0
        );

        ctx.lineTo(
            w*i/3,
            h
        );

        ctx.stroke();


        ctx.beginPath();

        ctx.moveTo(
            0,
            h*i/3
        );

        ctx.lineTo(
            w,
            h*i/3
        );

        ctx.stroke();

    }


    ctx.setLineDash([]);


    const points = [

        [w/3,h/3],

        [w*2/3,h/3],

        [w/3,h*2/3],

        [w*2/3,h*2/3]

    ];


    points.forEach(p=>{

        ctx.beginPath();

        ctx.arc(
            p[0],
            p[1],
            6,
            0,
            Math.PI*2
        );

        ctx.fill();

    });


    ctx.restore();

}



/* 居中 */

function drawCenter(){

    const w =
    overlay.clientWidth;

    const h =
    overlay.clientHeight;


    ctx.save();

    ctx.strokeStyle =
    getGuideColor();

    ctx.lineWidth =
    3;

    ctx.setLineDash([
        12,
        8
    ]);


    ctx.beginPath();

    ctx.ellipse(

        w*0.5,
        h*0.5,

        w*0.20,
        h*0.24,

        0,
        0,
        Math.PI*2

    );

    ctx.stroke();


    ctx.restore();

}



/* 引導線 */

function drawLeading(){

    const w =
    overlay.clientWidth;

    const h =
    overlay.clientHeight;


    ctx.save();

    ctx.strokeStyle =
    getGuideColor();

    ctx.lineWidth =
    3;

    ctx.setLineDash([
        12,
        9
    ]);


    ctx.beginPath();

    ctx.moveTo(
        w*0.08,
        h*0.90
    );

    ctx.lineTo(
        w*0.50,
        h*0.52
    );

    ctx.stroke();


    ctx.beginPath();

    ctx.moveTo(
        w*0.92,
        h*0.90
    );

    ctx.lineTo(
        w*0.50,
        h*0.52
    );

    ctx.stroke();


    ctx.restore();

}



/* =====================================
   主循環
===================================== */

function drawLoop(time){

    ctx.clearRect(
        0,
        0,
        overlay.clientWidth,
        overlay.clientHeight
    );


    if(
        navigationActive
    ){

        if(
            lockedMode === "vshape"
        )
        drawV();


        if(
            lockedMode === "third"
        )
        drawThird();


        if(
            lockedMode === "center"
        )
        drawCenter();


        if(
            lockedMode === "leading"
        )
        drawLeading();


        if(
            time -
            lastAnalysisTime
            >
            ANALYSIS_INTERVAL
        ){

            updateLiveScore();

            lastAnalysisTime =
            time;

        }

    }


    requestAnimationFrame(
        drawLoop
    );

}



/* =====================================
   ZOOM
===================================== */

zoomSlider.addEventListener(
"input",
async function(){

    const value =
    Number(
        this.value
    );


    zoomText.innerText =
    value.toFixed(1)
    +
    "×";


    if(
        !stream
    )
    return;


    const track =
    stream
    .getVideoTracks()[0];


    if(
        !track
        ||
        !track.getCapabilities
    )
    return;


    const cap =
    track.getCapabilities();


    if(
        !cap.zoom
    )
    return;


    try{

        await track.applyConstraints({

            advanced:[
                {
                    zoom:value
                }
            ]

        });

    }

    catch(e){

        console.log(
            "此手機不支援硬體Zoom"
        );

    }

});



window.addEventListener(
"resize",
resizeCanvas
);



startCamera();

requestAnimationFrame(
    drawLoop
);

</script>
