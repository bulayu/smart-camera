<!DOCTYPE html>
<html lang="zh-TW">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               user-scalable=no,
               viewport-fit=cover">

<title>智慧構圖助手 V4.1</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    background: black;
    color: white;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        Arial,
        sans-serif;

    text-align: center;
}

#topBar {
    padding-top:
        max(
            8px,
            env(safe-area-inset-top)
        );

    padding-bottom: 6px;
}

#title {
    font-size: 19px;
    font-weight: 600;
}

#status {
    min-height: 18px;
    margin-top: 4px;
    font-size: 13px;
    color: #aaaaaa;
}


/* =========================
   相機
========================= */

#cameraBox {

    position: relative;

    width: 100%;
    max-width: 900px;

    margin: auto;

    overflow: hidden;

    background: #111;
}

#camera {

    display: block;

    width: 100%;
    height: auto;
}

#overlay {

    position: absolute;

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    pointer-events: none;
}


/* =========================
   按鈕
========================= */

#controls {

    padding:

        10px 4px

        calc(
            15px +
            env(safe-area-inset-bottom)
        );
}

button {

    border: none;

    border-radius: 12px;

    margin: 4px;

    padding: 11px 15px;

    font-size: 16px;

    background: #292929;

    color: white;
}

.cameraButton {
    min-width: 118px;
}

#shutterButton {

    width: 72px;
    height: 72px;

    padding: 0;

    margin: 9px 12px;

    border-radius: 50%;

    border: 4px solid white;

    background: #222;

    font-size: 29px;
}


/* =========================
   照片預覽
========================= */

#photoPreview {

    display: none;

    width: 170px;
    max-width: 45%;

    margin-bottom: 20px;

    border:

        2px solid white;

    border-radius: 10px;
}

#photoCanvas,
#analysisCanvas {

    display: none;
}

</style>

</head>


<body>


<div id="topBar">

    <div id="title">
        📷 智慧構圖助手
    </div>

    <div id="status">
        AI 載入中...
    </div>

</div>


<div id="cameraBox">

    <video
        id="camera"
        autoplay
        muted
        playsinline>
    </video>

    <canvas id="overlay"></canvas>

</div>


<div id="controls">

    <button
        class="cameraButton"
        onclick="openFrontCamera()">
        🤳 前鏡頭
    </button>

    <button
        class="cameraButton"
        onclick="openRearCamera()">
        📷 後鏡頭
    </button>

    <br>

    <button
        id="shutterButton"
        onclick="takePhoto()">
        📸
    </button>

    <button onclick="stopCamera()">
        關閉
    </button>

</div>


<img id="photoPreview">


<canvas id="photoCanvas"></canvas>

<canvas id="analysisCanvas"></canvas>



<script type="module">

import {

    FaceDetector,
    ObjectDetector,
    FilesetResolver

}
from
"https://unpkg.com/@mediapipe/tasks-vision@0.10.35/vision_bundle.mjs";


/* =====================================================
   AI
===================================================== */

let faceDetector = null;

let objectDetector = null;

let aiReady = false;


/* =====================================================
   相機
===================================================== */

let stream = null;

let cameraRunning = false;


/*
user = 前鏡頭

environment = 後鏡頭
*/
let currentMode =
    "environment";


let frontDeviceId =
    "";

let rearDeviceId =
    "";


/*
避免切換鏡頭後
舊程式還繼續跑
*/
let cameraSession =
    0;


/* =====================================================
   AI 分析
===================================================== */

let lastVideoTime =
    -1;


let lastObjectDetectTime =
    0;


let lastSceneAnalysisTime =
    0;


/* =====================================================
   AI 鎖定

   防止推薦位置一直跳
===================================================== */

let lockedType =
    "";

let lockedTargetXRatio =
    null;

let lockedTargetYRatio =
    null;

let lockUntil =
    0;


const LOCK_TIME =
    3000;


/* =====================================================
   主體位置平滑
===================================================== */

let smoothSubjectX =
    null;

let smoothSubjectY =
    null;


/* =====================================================
   手機導航圖示位置
===================================================== */

let navPhoneX =
    null;

let navPhoneY =
    null;


let smoothNavPhoneX =
    null;

let smoothNavPhoneY =
    null;


/*
連續幾次符合，
才變綠色。

避免一下白一下綠。
*/
let okCounter =
    0;

let compositionOK =
    false;


/* =====================================================
   HTML
===================================================== */

const video =
    document.getElementById(
        "camera"
    );


const overlay =
    document.getElementById(
        "overlay"
    );


const ctx =
    overlay.getContext(
        "2d"
    );


const statusText =
    document.getElementById(
        "status"
    );


const photoCanvas =
    document.getElementById(
        "photoCanvas"
    );


const photoCtx =
    photoCanvas.getContext(
        "2d"
    );


const photoPreview =
    document.getElementById(
        "photoPreview"
    );


const analysisCanvas =
    document.getElementById(
        "analysisCanvas"
    );


const analysisCtx =
    analysisCanvas.getContext(

        "2d",

        {
            willReadFrequently:
                true
        }

    );


/* =====================================================
   載入 AI
===================================================== */

async function loadAI() {

    try {

        statusText.innerText =
            "正在載入 AI...";


        const vision =
            await FilesetResolver
                .forVisionTasks(

                "https://unpkg.com/@mediapipe/tasks-vision@0.10.35/wasm"

            );


        /*
        前鏡頭：
        人臉
        */

        faceDetector =
            await FaceDetector
                .createFromOptions(

                vision,

                {

                    baseOptions: {

                        modelAssetPath:

                        "https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite"

                    },

                    runningMode:
                        "VIDEO",

                    minDetectionConfidence:
                        0.55

                }

            );


        /*
        後鏡頭：
        常見物件辨識
        */

        objectDetector =
            await ObjectDetector
                .createFromOptions(

                vision,

                {

                    baseOptions: {

                        modelAssetPath:

                        "https://storage.googleapis.com/mediapipe-tasks/object_detector/efficientdet_lite0_uint8.tflite"

                    },

                    runningMode:
                        "VIDEO",

                    scoreThreshold:
                        0.48,

                    maxResults:
                        5

                }

            );


        aiReady =
            true;


        statusText.innerText =
            "✅ AI 已準備完成";

    }

    catch(error) {

        console.error(
            error
        );


        statusText.innerText =
            "❌ AI 載入失敗";

    }

}


/* =====================================================
   取得真正的前後鏡頭
===================================================== */

async function prepareCameraDevices() {

    try {

        /*
        Safari 先要求一次權限
        */

        const tempStream =
            await navigator.mediaDevices
                .getUserMedia({

                    video: true,

                    audio: false

                });


        tempStream
            .getTracks()
            .forEach(

                track =>
                    track.stop()

            );


        const devices =
            await navigator.mediaDevices
                .enumerateDevices();


        const cameras =
            devices.filter(

                device =>
                    device.kind ===
                    "videoinput"

            );


        frontDeviceId =
            "";

        rearDeviceId =
            "";


        /*
        找前後鏡頭
        */

        for (
            const camera
            of cameras
        ) {

            const name =
                (
                    camera.label ||
                    ""
                )
                .toLowerCase();


            /*
            前鏡頭
            */

            if (
                !frontDeviceId
                &&
                (
                    name.includes(
                        "front"
                    )

                    ||

                    name.includes(
                        "user"
                    )

                    ||

                    name.includes(
                        "前"
                    )
                )
            ) {

                frontDeviceId =
                    camera.deviceId;

            }


            /*
            後鏡頭
            */

            const isRear =

                name.includes(
                    "back"
                )

                ||

                name.includes(
                    "rear"
                )

                ||

                name.includes(
                    "environment"
                )

                ||

                name.includes(
                    "後"
                );


            /*
            不優先選
            超廣角 / 望遠
            */

            const specialLens =

                name.includes(
                    "ultra"
                )

                ||

                name.includes(
                    "tele"
                )

                ||

                name.includes(
                    "zoom"
                );


            if (
                !rearDeviceId
                &&
                isRear
                &&
                !specialLens
            ) {

                rearDeviceId =
                    camera.deviceId;

            }

        }


        /*
        找不到普通後鏡頭時，
        找任何後鏡頭
        */

        if (
            !rearDeviceId
        ) {

            for (
                const camera
                of cameras
            ) {

                const name =
                    (
                        camera.label ||
                        ""
                    )
                    .toLowerCase();


                if (
                    name.includes(
                        "back"
                    )

                    ||

                    name.includes(
                        "rear"
                    )

                    ||

                    name.includes(
                        "後"
                    )
                ) {

                    rearDeviceId =
                        camera.deviceId;

                    break;

                }

            }

        }

    }

    catch(error) {

        console.log(
            error
        );

    }

}


/* =====================================================
   前鏡頭
===================================================== */

async function openFrontCamera() {

    await openCamera(
        "user"
    );

}


/* =====================================================
   後鏡頭
===================================================== */

async function openRearCamera() {

    await openCamera(
        "environment"
    );

}


/* =====================================================
   開啟相機
===================================================== */

async function openCamera(
    mode
) {

    if (!aiReady) {

        alert(
            "AI 還在載入，請稍等一下"
        );

        return;

    }


    /*
    第一次取得鏡頭清單
    */

    if (
        !frontDeviceId
        &&
        !rearDeviceId
    ) {

        statusText.innerText =
            "正在取得相機權限...";


        await prepareCameraDevices();

    }


    cameraSession++;


    const thisSession =
        cameraSession;


    cameraRunning =
        false;


    stopCurrentStream();


    try {

        let constraints;


        /*
        前鏡頭
        */

        if (
            mode ===
            "user"
            &&
            frontDeviceId
        ) {

            constraints = {

                video: {

                    deviceId: {

                        exact:
                            frontDeviceId

                    }

                },

                audio: false

            };

        }


        /*
        後鏡頭
        */

        else if (
            mode ===
            "environment"
            &&
            rearDeviceId
        ) {

            constraints = {

                video: {

                    deviceId: {

                        exact:
                            rearDeviceId

                    }

                },

                audio: false

            };

        }


        else {

            constraints = {

                video: {

                    facingMode: {

                        exact:
                            mode

                    }

                },

                audio: false

            };

        }


        stream =
            await navigator.mediaDevices
                .getUserMedia(
                    constraints
                );

    }

    catch(error) {

        /*
        exact 失敗
        改一般 facingMode
        */

        try {

            stream =
                await navigator.mediaDevices
                    .getUserMedia({

                        video: {

                            facingMode:
                                mode

                        },

                        audio:
                            false

                    });

        }

        catch(error2) {

            statusText.innerText =
                "❌ 無法開啟相機";

            return;

        }

    }


    video.srcObject =
        stream;


    await video.play();


    currentMode =
        mode;


    cameraRunning =
        true;


    /*
    重設 AI 狀態
    */

    resetNavigation();


    statusText.innerText =

        mode ===
        "user"

        ?

        "🤳 前鏡頭"

        :

        "📷 後鏡頭";


    requestAnimationFrame(

        () =>
            cameraLoop(
                thisSession
            )

    );

}


/* =====================================================
   重設導航
===================================================== */

function resetNavigation() {

    lastVideoTime =
        -1;


    lastObjectDetectTime =
        0;


    lastSceneAnalysisTime =
        0;


    lockedType =
        "";


    lockedTargetXRatio =
        null;


    lockedTargetYRatio =
        null;


    lockUntil =
        0;


    smoothSubjectX =
        null;


    smoothSubjectY =
        null;


    navPhoneX =
        null;


    navPhoneY =
        null;


    smoothNavPhoneX =
        null;


    smoothNavPhoneY =
        null;


    okCounter =
        0;


    compositionOK =
        false;

}


/* =====================================================
   停止串流
===================================================== */

function stopCurrentStream() {

    if (stream) {

        stream
            .getTracks()
            .forEach(

                track =>
                    track.stop()

            );


        stream =
            null;

    }

}


/* =====================================================
   關閉相機
===================================================== */

function stopCamera() {

    cameraSession++;


    cameraRunning =
        false;


    stopCurrentStream();


    video.srcObject =
        null;


    ctx.clearRect(

        0,
        0,

        overlay.width,
        overlay.height

    );


    resetNavigation();


    statusText.innerText =
        "相機已關閉";

}


/* =====================================================
   主循環
===================================================== */

function cameraLoop(
    session
) {

    /*
    切換鏡頭後，
    舊循環停止
    */

    if (
        session !==
        cameraSession
    ) {

        return;

    }


    if (!cameraRunning) {

        return;

    }


    if (
        video.readyState >= 2
        &&
        video.videoWidth > 0
        &&
        video.videoHeight > 0
    ) {

        /*
        前鏡頭
        */

        if (
            currentMode ===
            "user"
        ) {

            processFrontCamera();

        }


        /*
        後鏡頭
        */

        else {

            processRearCamera();

        }

    }


    /*
    不論 AI 是否正在分析，
    每一 frame 都把導航畫好
    */

    drawNavigation();


    requestAnimationFrame(

        () =>
            cameraLoop(
                session
            )

    );

}


/* =====================================================
   前鏡頭人物構圖
===================================================== */

function processFrontCamera() {

    if (
        video.currentTime ===
        lastVideoTime
    ) {

        return;

    }


    lastVideoTime =
        video.currentTime;


    let result;


    try {

        result =
            faceDetector
                .detectForVideo(

                video,

                performance.now()

            );

    }

    catch(error) {

        return;

    }


    if (
        !result.detections
        ||
        result.detections.length ===
        0
    ) {

        return;

    }


    /*
    找最大的人臉
    */

    let bestFace =
        null;


    let bestArea =
        0;


    for (
        const detection
        of result.detections
    ) {

        const box =
            detection.boundingBox;


        const area =
            box.width *
            box.height;


        if (
            area >
            bestArea
        ) {

            bestArea =
                area;


            bestFace =
                box;

        }

    }


    if (!bestFace) {

        return;

    }


    const width =
        video.clientWidth;


    const height =
        video.clientHeight;


    const scaleX =
        width /
        video.videoWidth;


    const scaleY =
        height /
        video.videoHeight;


    const subjectX =

        (
            bestFace.originX
            +
            bestFace.width / 2
        )

        *
        scaleX;


    const subjectY =

        (
            bestFace.originY
            +
            bestFace.height / 2
        )

        *
        scaleY;


    /*
    鎖定人物推薦構圖點
    */

    ensureCompositionTarget(

        "person",

        subjectX,
        subjectY,

        width,
        height

    );


    updateNavigation(

        subjectX,
        subjectY,

        width,
        height

    );

}


/* =====================================================
   後鏡頭
===================================================== */

function processRearCamera() {

    const now =
        performance.now();


    /*
    每 300ms
    做一次物件辨識
    */

    if (
        now -
        lastObjectDetectTime
        <
        300
    ) {

        return;

    }


    lastObjectDetectTime =
        now;


    let result =
        null;


    try {

        result =
            objectDetector
                .detectForVideo(

                video,
                now

            );

    }

    catch(error) {

        console.log(
            error
        );

    }


    /*
    選主要拍攝主體
    */

    const subject =
        chooseMainSubject(
            result
        );


    if (subject) {

        processObjectSubject(
            subject
        );

        return;

    }


    /*
    找不到常見物件，
    用畫面視覺重心判斷
    */

    analyzeScene();

}


/* =====================================================
   選主要物件
===================================================== */

function chooseMainSubject(
    result
) {

    if (
        !result
        ||
        !result.detections
        ||
        result.detections.length ===
        0
    ) {

        return null;

    }


    let best =
        null;


    let bestScore =
        -Infinity;


    const frameArea =

        video.videoWidth
        *
        video.videoHeight;


    for (
        const detection
        of result.detections
    ) {

        const box =
            detection.boundingBox;


        if (!box) {

            continue;

        }


        const category =
            detection
                .categories?.[0];


        const confidence =
            category?.score || 0;


        const area =

            box.width
            *
            box.height;


        const areaRatio =

            area /
            frameArea;


        /*
        太小的東西不當主角
        */

        if (
            areaRatio <
            0.018
        ) {

            continue;

        }


        const cx =

            box.originX
            +
            box.width / 2;


        const cy =

            box.originY
            +
            box.height / 2;


        const nx =

            cx /
            video.videoWidth;


        const ny =

            cy /
            video.videoHeight;


        const centerDistance =

            Math.hypot(

                nx - 0.5,

                ny - 0.5

            );


        /*
        評分：
        大物件
        高信心
        靠近中心

        比較容易成為主體
        */

        const score =

            areaRatio *
            3.2

            +

            confidence

            -

            centerDistance *
            0.28;


        if (
            score >
            bestScore
        ) {

            bestScore =
                score;


            best = {

                box:
                    box,

                category:
                    category
                        ?.categoryName
                    ||
                    ""

            };

        }

    }


    return best;

}


/* =====================================================
   處理物件主體
===================================================== */

function processObjectSubject(
    subject
) {

    const width =
        video.clientWidth;


    const height =
        video.clientHeight;


    const scaleX =
        width /
        video.videoWidth;


    const scaleY =
        height /
        video.videoHeight;


    const box =
        subject.box;


    const subjectX =

        (
            box.originX
            +
            box.width / 2
        )

        *
        scaleX;


    const subjectY =

        (
            box.originY
            +
            box.height / 2
        )

        *
        scaleY;


    ensureCompositionTarget(

        subject.category,

        subjectX,
        subjectY,

        width,
        height

    );


    updateNavigation(

        subjectX,
        subjectY,

        width,
        height

    );

}


/* =====================================================
   鎖定 AI 推薦構圖位置

   這就是 V4.1 最重要的地方。

   選定之後不會每一幀亂換。
===================================================== */

function ensureCompositionTarget(

    type,

    subjectX,
    subjectY,

    width,
    height

) {

    const now =
        performance.now();


    /*
    同一類主體，
    保持鎖定
    */

    if (
        lockedType ===
        type
        &&
        now <
        lockUntil
    ) {

        return;

    }


    /*
    新的構圖目標
    */

    lockedType =
        type;


    lockUntil =
        now +
        LOCK_TIME;


    /*
    =============================
    水平位置
    =============================

    主體在哪一側，
    就使用最近的三分位置。

    這樣不會叫你
    從左邊大幅移到右邊。
    */

    if (
        subjectX <
        width / 2
    ) {

        lockedTargetXRatio =
            0.34;

    }

    else {

        lockedTargetXRatio =
            0.66;

    }


    /*
    =============================
    垂直位置
    =============================
    */

    const upperSubjects = [

        "person",
        "dog",
        "cat",
        "bird",
        "horse",
        "cow",
        "sheep"

    ];


    if (
        upperSubjects.includes(
            type
        )
    ) {

        /*
        人與動物
        主體稍高
        */

        lockedTargetYRatio =
            0.36;

    }

    else {

        /*
        汽車、物品等
        靠近中央
        */

        lockedTargetYRatio =
            0.50;

    }

}


/* =====================================================
   計算「手機圖示」應該在哪裡

   核心概念：

   subjectX - targetX

   代表目前相機
   與最佳構圖之間的差距。

   我們把這個差距
   轉成手機圖示的位置。
===================================================== */

function updateNavigation(

    subjectX,
    subjectY,

    width,
    height

) {

    /*
    平滑主體位置
    */

    if (
        smoothSubjectX ===
        null
    ) {

        smoothSubjectX =
            subjectX;


        smoothSubjectY =
            subjectY;

    }

    else {

        smoothSubjectX =

            smoothSubjectX *
            0.72

            +

            subjectX *
            0.28;


        smoothSubjectY =

            smoothSubjectY *
            0.72

            +

            subjectY *
            0.28;

    }


    /*
    AI 要主體最後位於哪裡
    */

    const desiredSubjectX =

        width *
        lockedTargetXRatio;


    const desiredSubjectY =

        height *
        lockedTargetYRatio;


    /*
    主體目前與最佳構圖
    差多少
    */

    const errorX =

        smoothSubjectX
        -
        desiredSubjectX;


    const errorY =

        smoothSubjectY
        -
        desiredSubjectY;


    /*
    目標框固定在畫面上方中央。

    小手機圖示
    圍繞它移動。
    */

    const targetBoxX =
        width *
        0.50;


    const targetBoxY =
        height *
        0.27;


    /*
    放大導引距離。

    主體差一點，
    手機圖示會明顯看得出方向。
    */

    const navigationGain =
        1.15;


    navPhoneX =

        targetBoxX

        +

        errorX *
        navigationGain;


    navPhoneY =

        targetBoxY

        +

        errorY *
        navigationGain;


    /*
    手機圖示做平滑
    */

    if (
        smoothNavPhoneX ===
        null
    ) {

        smoothNavPhoneX =
            navPhoneX;


        smoothNavPhoneY =
            navPhoneY;

    }

    else {

        smoothNavPhoneX =

            smoothNavPhoneX *
            0.72

            +

            navPhoneX *
            0.28;


        smoothNavPhoneY =

            smoothNavPhoneY *
            0.72

            +

            navPhoneY *
            0.28;

    }


    /*
    判斷是不是已經構圖成功
    */

    const errorDistance =

        Math.hypot(

            errorX,
            errorY

        );


    const tolerance =

        Math.min(
            width,
            height
        )

        *
        0.10;


    if (
        errorDistance <
        tolerance
    ) {

        okCounter++;

    }

    else {

        okCounter =
            Math.max(

                0,

                okCounter - 1

            );

    }


    /*
    連續符合 4 次才算 OK
    */

    compositionOK =

        okCounter >=
        4;

}


/* =====================================================
   找不到物件時：
   自動尋找畫面的主要視覺區域
===================================================== */

function analyzeScene() {

    const now =
        performance.now();


    if (
        now -
        lastSceneAnalysisTime
        <
        500
    ) {

        return;

    }


    lastSceneAnalysisTime =
        now;


    if (
        video.videoWidth ===
        0
        ||
        video.videoHeight ===
        0
    ) {

        return;

    }


    const w =
        120;


    const h =
        80;


    analysisCanvas.width =
        w;


    analysisCanvas.height =
        h;


    analysisCtx.drawImage(

        video,

        0,
        0,

        w,
        h

    );


    const image =
        analysisCtx
            .getImageData(

            0,
            0,

            w,
            h

        );


    const data =
        image.data;


    const gray =
        new Float32Array(
            w * h
        );


    /*
    RGB → 灰階
    */

    for (
        let y = 0;
        y < h;
        y++
    ) {

        for (
            let x = 0;
            x < w;
            x++
        ) {

            const i =

                (
                    y * w +
                    x
                )

                *
                4;


            gray[
                y * w +
                x
            ] =

                data[i] *
                0.299

                +

                data[i + 1] *
                0.587

                +

                data[i + 2] *
                0.114;

        }

    }


    /*
    5 × 5 區塊

    比之前 3 × 3
    更精細一點
    */

    const cols =
        5;


    const rows =
        5;


    let bestCol =
        2;


    let bestRow =
        2;


    let bestEnergy =
        -1;


    for (
        let row = 0;
        row < rows;
        row++
    ) {

        for (
            let col = 0;
            col < cols;
            col++
        ) {

            const startX =

                Math.floor(

                    col *
                    w /
                    cols

                );


            const endX =

                Math.floor(

                    (col + 1) *
                    w /
                    cols

                );


            const startY =

                Math.floor(

                    row *
                    h /
                    rows

                );


            const endY =

                Math.floor(

                    (row + 1) *
                    h /
                    rows

                );


            let energy =
                0;


            for (
                let y =
                    startY + 1;

                y <
                endY - 1;

                y += 2
            ) {

                for (
                    let x =
                        startX + 1;

                    x <
                    endX - 1;

                    x += 2
                ) {

                    const center =

                        gray[
                            y * w +
                            x
                        ];


                    const right =

                        gray[
                            y * w +
                            x + 1
                        ];


                    const below =

                        gray[
                            (y + 1) *
                            w +
                            x
                        ];


                    energy +=

                        Math.abs(

                            center -
                            right

                        )

                        +

                        Math.abs(

                            center -
                            below

                        );

                }

            }


            /*
            中央區稍微降低權重，
            鼓勵構圖不要全部正中央
            */

            if (
                col === 2
                &&
                row === 2
            ) {

                energy *=
                    0.82;

            }


            if (
                energy >
                bestEnergy
            ) {

                bestEnergy =
                    energy;


                bestCol =
                    col;


                bestRow =
                    row;

            }

        }

    }


    const width =
        video.clientWidth;


    const height =
        video.clientHeight;


    /*
    畫面主要視覺區的中心
    */

    const subjectX =

        width *

        (
            bestCol +
            0.5
        )

        /
        cols;


    const subjectY =

        height *

        (
            bestRow +
            0.5
        )

        /
        rows;


    /*
    風景也鎖定 3 秒，
    不讓目標一直跳。
    */

    const now2 =
        performance.now();


    if (
        lockedType !==
        "scene"

        ||

        now2 >=
        lockUntil
    ) {

        lockedType =
            "scene";


        lockUntil =
            now2 +
            LOCK_TIME;


        lockedTargetXRatio =

            subjectX <
            width / 2

            ?

            0.34

            :

            0.66;


        /*
        風景主視覺
        先使用較自然的中間位置
        */

        if (
            subjectY <
            height / 2
        ) {

            lockedTargetYRatio =
                0.36;

        }

        else {

            lockedTargetYRatio =
                0.64;

        }

    }


    updateNavigation(

        subjectX,
        subjectY,

        width,
        height

    );

}


/* =====================================================
   畫 AI 導航

   畫面上只會有：

   ① 目標長方框
   ② 小手機圖示

   不畫其他任何輔助線。
===================================================== */

function drawNavigation() {

    const width =
        video.clientWidth;


    const height =
        video.clientHeight;


    overlay.width =
        width;


    overlay.height =
        height;


    ctx.clearRect(

        0,
        0,

        width,
        height

    );


    /*
    還沒有分析到東西時
    不亂畫
    */

    if (
        smoothNavPhoneX ===
        null
        ||
        smoothNavPhoneY ===
        null
    ) {

        return;

    }


    /*
    ===========================
    AI 最佳位置框
    ===========================
    */

    const targetX =
        width *
        0.50;


    const targetY =
        height *
        0.27;


    const boxWidth =

        Math.max(

            64,

            Math.min(
                width,
                height
            )
            *
            0.18

        );


    const boxHeight =
        boxWidth *
        1.35;


    const boxLeft =

        targetX -
        boxWidth / 2;


    const boxTop =

        targetY -
        boxHeight / 2;


    /*
    構圖成功：
    綠色。

    尚未成功：
    白色。
    */

    if (
        compositionOK
    ) {

        ctx.strokeStyle =
            "#43ff6b";

    }

    else {

        ctx.strokeStyle =
            "rgba(255,255,255,0.95)";

    }


    ctx.lineWidth =
        compositionOK
        ? 5
        : 4;


    ctx.shadowColor =
        "rgba(0,0,0,0.8)";


    ctx.shadowBlur =
        5;


    roundRect(

        ctx,

        boxLeft,
        boxTop,

        boxWidth,
        boxHeight,

        10

    );


    ctx.stroke();


    /*
    ===========================
    現在的手機位置
    ===========================
    */

    const phoneWidth =

        Math.max(

            28,

            Math.min(
                width,
                height
            )
            *
            0.075

        );


    const phoneHeight =
        phoneWidth *
        1.65;


    /*
    避免手機圖示跑出螢幕
    */

    const margin =
        phoneWidth;


    let phoneX =

        Math.max(

            margin,

            Math.min(

                width -
                margin,

                smoothNavPhoneX

            )

        );


    let phoneY =

        Math.max(

            margin,

            Math.min(

                height -
                margin,

                smoothNavPhoneY

            )

        );


    /*
    構圖成功後，
    手機圖示也變綠
    */

    ctx.strokeStyle =

        compositionOK

        ?

        "#43ff6b"

        :

        "#ffd84a";


    ctx.lineWidth =
        4;


    const phoneLeft =

        phoneX -
        phoneWidth / 2;


    const phoneTop =

        phoneY -
        phoneHeight / 2;


    /*
    手機外框
    */

    roundRect(

        ctx,

        phoneLeft,
        phoneTop,

        phoneWidth,
        phoneHeight,

        phoneWidth *
        0.16

    );


    ctx.stroke();


    /*
    手機上方聽筒
    */

    ctx.beginPath();


    ctx.moveTo(

        phoneLeft +
        phoneWidth *
        0.32,

        phoneTop +
        phoneHeight *
        0.10

    );


    ctx.lineTo(

        phoneLeft +
        phoneWidth *
        0.68,

        phoneTop +
        phoneHeight *
        0.10

    );


    ctx.lineWidth =
        2.5;


    ctx.stroke();


    /*
    手機下面圓鈕
    */

    ctx.beginPath();


    ctx.arc(

        phoneX,

        phoneTop +
        phoneHeight *
        0.89,

        phoneWidth *
        0.07,

        0,

        Math.PI * 2

    );


    ctx.lineWidth =
        2;


    ctx.stroke();


    ctx.shadowBlur =
        0;

}


/* =====================================================
   圓角矩形
===================================================== */

function roundRect(

    context,

    x,
    y,

    width,
    height,

    radius

) {

    radius =
        Math.min(

            radius,

            width / 2,

            height / 2

        );


    context.beginPath();


    context.moveTo(

        x + radius,
        y

    );


    context.lineTo(

        x + width - radius,
        y

    );


    context.quadraticCurveTo(

        x + width,
        y,

        x + width,
        y + radius

    );


    context.lineTo(

        x + width,
        y + height - radius

    );


    context.quadraticCurveTo(

        x + width,
        y + height,

        x + width - radius,
        y + height

    );


    context.lineTo(

        x + radius,
        y + height

    );


    context.quadraticCurveTo(

        x,
        y + height,

        x,
        y + height - radius

    );


    context.lineTo(

        x,
        y + radius

    );


    context.quadraticCurveTo(

        x,
        y,

        x + radius,
        y

    );


    context.closePath();

}


/* =====================================================
   拍照
===================================================== */

function takePhoto() {

    if (
        !cameraRunning
        ||
        video.videoWidth ===
        0
    ) {

        alert(
            "請先開啟相機"
        );

        return;

    }


    photoCanvas.width =
        video.videoWidth;


    photoCanvas.height =
        video.videoHeight;


    /*
    只拍原始畫面。

    長方框與手機圖示
    不會拍進照片。
    */

    photoCtx.drawImage(

        video,

        0,
        0,

        photoCanvas.width,
        photoCanvas.height

    );


    const imageData =
        photoCanvas.toDataURL(

            "image/jpeg",

            0.94

        );


    photoPreview.src =
        imageData;


    photoPreview.style.display =
        "inline-block";


    statusText.innerText =
        "📸 拍照完成";

}


/* =====================================================
   HTML 按鈕
===================================================== */

window.openFrontCamera =
    openFrontCamera;


window.openRearCamera =
    openRearCamera;


window.takePhoto =
    takePhoto;


window.stopCamera =
    stopCamera;


/* =====================================================
   開始
===================================================== */

loadAI();
