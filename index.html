<!DOCTYPE html>
<html lang="zh-TW">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               user-scalable=no">

<title>阿策智慧構圖助手 V3.1</title>

<style>

body {
    margin: 0;
    background: black;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

h2 {
    margin: 8px 0;
    font-size: 22px;
}

#status {
    font-size: 15px;
    margin: 5px;
}

#faceInfo {
    font-size: 16px;
    margin: 5px;
}

#modeInfo {
    font-size: 18px;
    margin: 5px;
}

#guideInfo {
    font-size: 25px;
    font-weight: bold;
    min-height: 34px;
    margin: 6px;
}

#scoreInfo {
    font-size: 20px;
    min-height: 26px;
    margin: 5px;
}

#cameraBox {
    position: relative;
    width: 100%;
    max-width: 900px;
    margin: auto;
    background: #111;
    overflow: hidden;
}

#camera {
    width: 100%;
    display: block;
}

#overlay {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
}

.guideLine {
    position: absolute;
    background: rgba(255,255,255,0.60);
    pointer-events: none;
}

.vline {
    top: 0;
    height: 100%;
    width: 1px;
}

.v1 {
    left: 33.33%;
}

.v2 {
    left: 66.66%;
}

.hline {
    left: 0;
    width: 100%;
    height: 1px;
}

.h1 {
    top: 33.33%;
}

.h2 {
    top: 66.66%;
}

#controls {
    padding: 8px 4px;
}

button {
    font-size: 17px;
    padding: 11px 14px;
    margin: 4px 2px;
    border: none;
    border-radius: 10px;
}

select {
    font-size: 16px;
    padding: 10px;
    width: 92%;
    max-width: 500px;
    margin: 5px;
    border-radius: 8px;
}

#shutterButton {
    width: 68px;
    height: 68px;
    border-radius: 50%;
    font-size: 27px;
}

#photoArea {
    padding: 10px 0 25px 0;
}

#photoPreview {
    width: 180px;
    max-width: 46%;
    display: none;
    border-radius: 10px;
    border: 2px solid white;
}

#photoCanvas,
#analysisCanvas {
    display: none;
}

</style>

</head>


<body>

<h2>📷 阿策智慧構圖助手 V3.1</h2>

<div id="status">
    AI 模型載入中...
</div>

<div id="faceInfo"></div>

<div id="modeInfo"></div>

<div id="guideInfo"></div>

<div id="scoreInfo"></div>


<div id="cameraBox">

    <video
        id="camera"
        autoplay
        playsinline
        muted>
    </video>

    <canvas id="overlay"></canvas>

    <div class="guideLine vline v1"></div>
    <div class="guideLine vline v2"></div>

    <div class="guideLine hline h1"></div>
    <div class="guideLine hline h2"></div>

</div>


<div id="controls">

    <button onclick="startCamera()">
        開啟相機
    </button>

    <br>

    <select
        id="cameraSelect"
        onchange="changeCamera()">

        <option value="">
            尚未取得鏡頭
        </option>

    </select>

    <br>

    <button
        id="shutterButton"
        onclick="takePhoto()">
        📸
    </button>

    <button onclick="stopCamera()">
        關閉
    </button>

</div>


<div id="photoArea">

    <div>
        拍照預覽
    </div>

    <br>

    <img id="photoPreview">

</div>


<canvas id="photoCanvas"></canvas>

<canvas id="analysisCanvas"></canvas>


<script type="module">

import {
    FaceDetector,
    FilesetResolver
}
from "https://unpkg.com/@mediapipe/tasks-vision@0.10.35/vision_bundle.mjs";


/* =====================================================
   全域變數
===================================================== */

let detector = null;

let stream = null;

let cameraRunning = false;

let lastVideoTime = -1;

let smoothScore = 0;

let okCounter = 0;

let currentDeviceId = "";

let currentCameraLabel = "";

let isRearCamera = false;

let lastLandscapeAnalysis = 0;

let smoothHorizonY = null;


/* =====================================================
   HTML 元件
===================================================== */

const video =
    document.getElementById("camera");

const overlay =
    document.getElementById("overlay");

const ctx =
    overlay.getContext("2d");


const photoCanvas =
    document.getElementById("photoCanvas");

const photoCtx =
    photoCanvas.getContext("2d");


const analysisCanvas =
    document.getElementById("analysisCanvas");

const analysisCtx =
    analysisCanvas.getContext(
        "2d",
        {
            willReadFrequently: true
        }
    );


const cameraSelect =
    document.getElementById("cameraSelect");


const photoPreview =
    document.getElementById("photoPreview");


const statusText =
    document.getElementById("status");


const faceInfo =
    document.getElementById("faceInfo");


const modeInfo =
    document.getElementById("modeInfo");


const guideInfo =
    document.getElementById("guideInfo");


const scoreInfo =
    document.getElementById("scoreInfo");


/* =====================================================
   載入 MediaPipe
===================================================== */

async function loadAI() {

    try {

        statusText.innerText =
            "正在載入 MediaPipe...";


        const resolver =
            await FilesetResolver.forVisionTasks(

                "https://unpkg.com/@mediapipe/tasks-vision@0.10.35/wasm"

            );


        statusText.innerText =
            "正在載入人臉模型...";


        detector =
            await FaceDetector.createFromOptions(

                resolver,

                {

                    baseOptions: {

                        modelAssetPath:

                        "https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite"

                    },

                    runningMode:
                        "VIDEO",

                    minDetectionConfidence:
                        0.4

                }

            );


        statusText.innerText =
            "✅ AI 已準備完成";

    }

    catch(error) {

        statusText.innerText =
            "❌ AI 模型載入失敗";

        faceInfo.innerText =
            error.message;

    }

}


/* =====================================================
   第一次開啟相機
===================================================== */

async function startCamera() {

    try {

        if (!detector) {

            alert(
                "AI 還在載入，請稍等一下"
            );

            return;

        }


        stopCurrentStream();


        /*
        第一次先用 video:true
        取得 Safari 相機權限
        */

        stream =
            await navigator.mediaDevices
                .getUserMedia({

                    video: true,

                    audio: false

                });


        video.srcObject =
            stream;


        await video.play();


        cameraRunning =
            true;


        lastVideoTime =
            -1;


        smoothScore =
            0;


        okCounter =
            0;


        smoothHorizonY =
            null;


        statusText.innerText =
            "📷 相機已開啟";


        await loadCameraList();


        updateCurrentCameraInfo();


        requestAnimationFrame(
            detectLoop
        );

    }

    catch(error) {

        statusText.innerText =
            "❌ 相機開啟失敗";

        faceInfo.innerText =
            error.name +
            "：" +
            error.message;

    }

}


/* =====================================================
   取得手機所有攝影機
===================================================== */

async function loadCameraList() {

    try {

        const devices =
            await navigator.mediaDevices
                .enumerateDevices();


        const cameras =
            devices.filter(

                device =>
                    device.kind ===
                    "videoinput"

            );


        cameraSelect.innerHTML =
            "";


        cameras.forEach(

            (camera, index) => {

                const option =
                    document.createElement(
                        "option"
                    );


                option.value =
                    camera.deviceId;


                option.text =
                    camera.label ||
                    "Camera " +
                    (index + 1);


                cameraSelect.appendChild(
                    option
                );

            }

        );


        const track =
            stream
                .getVideoTracks()[0];


        const settings =
            track.getSettings();


        if (settings.deviceId) {

            currentDeviceId =
                settings.deviceId;


            cameraSelect.value =
                settings.deviceId;

        }


        updateCurrentCameraInfo();

    }

    catch(error) {

        statusText.innerText =
            "取得鏡頭清單失敗：" +
            error.message;

    }

}


/* =====================================================
   使用者選擇真正的攝影鏡頭
===================================================== */

async function changeCamera() {

    const deviceId =
        cameraSelect.value;


    if (!deviceId) {

        return;

    }


    try {

        cameraRunning =
            false;


        stopCurrentStream();


        stream =
            await navigator.mediaDevices
                .getUserMedia({

                    video: {

                        deviceId: {

                            exact:
                                deviceId

                        }

                    },

                    audio:
                        false

                });


        video.srcObject =
            stream;


        await video.play();


        currentDeviceId =
            deviceId;


        cameraRunning =
            true;


        lastVideoTime =
            -1;


        smoothScore =
            0;


        okCounter =
            0;


        smoothHorizonY =
            null;


        updateCurrentCameraInfo();


        statusText.innerText =
            "📷 使用：" +
            currentCameraLabel;


        requestAnimationFrame(
            detectLoop
        );

    }

    catch(error) {

        statusText.innerText =
            "❌ 切換鏡頭失敗：" +
            error.message;

    }

}


/* =====================================================
   判斷目前是前鏡頭還是後鏡頭
===================================================== */

function updateCurrentCameraInfo() {

    const index =
        cameraSelect.selectedIndex;


    if (
        index >= 0 &&
        cameraSelect.options[index]
    ) {

        currentCameraLabel =
            cameraSelect
                .options[index]
                .text;

    }


    const lower =
        currentCameraLabel
            .toLowerCase();


    /*
    iPhone Safari 通常會提供類似：

    Front Camera
    Back Camera
    Back Dual Wide Camera
    */

    isRearCamera =

        lower.includes("back")

        ||

        lower.includes("rear")

        ||

        lower.includes("environment")

        ||

        lower.includes("後");


    /*
    名稱真的判斷不到時，
    使用 track facingMode
    */

    try {

        const track =
            stream
                .getVideoTracks()[0];


        const settings =
            track.getSettings();


        if (
            settings.facingMode ===
            "environment"
        ) {

            isRearCamera =
                true;

        }


        if (
            settings.facingMode ===
            "user"
        ) {

            isRearCamera =
                false;

        }

    }

    catch(e) {

    }

}


/* =====================================================
   關閉目前串流
===================================================== */

function stopCurrentStream() {

    if (stream) {

        stream
            .getTracks()
            .forEach(

                track =>
                    track.stop()

            );

        stream =
            null;

    }

}


/* =====================================================
   關閉相機
===================================================== */

function stopCamera() {

    cameraRunning =
        false;


    stopCurrentStream();


    video.srcObject =
        null;


    ctx.clearRect(
        0,
        0,
        overlay.width,
        overlay.height
    );


    statusText.innerText =
        "相機已關閉";


    faceInfo.innerText =
        "";


    modeInfo.innerText =
        "";


    guideInfo.innerText =
        "";


    scoreInfo.innerText =
        "";

}


/* =====================================================
   拍照

   拍的是乾淨照片，
   不會把綠框和構圖線拍進去
===================================================== */

function takePhoto() {

    if (
        !cameraRunning ||
        video.videoWidth === 0
    ) {

        alert(
            "請先開啟相機"
        );

        return;

    }


    photoCanvas.width =
        video.videoWidth;


    photoCanvas.height =
        video.videoHeight;


    photoCtx.drawImage(

        video,

        0,
        0,

        photoCanvas.width,
        photoCanvas.height

    );


    const imageData =
        photoCanvas.toDataURL(
            "image/jpeg",
            0.94
        );


    photoPreview.src =
        imageData;


    photoPreview.style.display =
        "inline-block";


    statusText.innerText =
        "📸 拍照完成";

}


/* =====================================================
   AI 即時循環
===================================================== */

function detectLoop() {

    if (!cameraRunning) {

        return;

    }


    if (
        video.readyState >= 2 &&
        video.videoWidth > 0 &&
        video.videoHeight > 0
    ) {

        if (
            video.currentTime !==
            lastVideoTime
        ) {

            lastVideoTime =
                video.currentTime;


            try {

                const result =
                    detector.detectForVideo(

                        video,

                        performance.now()

                    );


                drawResult(
                    result
                );

            }

            catch(error) {

                console.log(
                    error
                );

            }

        }

    }


    requestAnimationFrame(
        detectLoop
    );

}


/* =====================================================
   距離
===================================================== */

function getDistance(
    x1,
    y1,
    x2,
    y2
) {

    const dx =
        x2 - x1;


    const dy =
        y2 - y1;


    return Math.sqrt(
        dx * dx +
        dy * dy
    );

}


/* =====================================================
   平滑分數
===================================================== */

function updateSmoothScore(
    score
) {

    if (
        smoothScore === 0
    ) {

        smoothScore =
            score;

    }

    else {

        smoothScore =
            smoothScore * 0.85 +
            score * 0.15;

    }


    return Math.round(
        smoothScore
    );

}


/* =====================================================
   移動方向
===================================================== */

function getDirectionText(
    dx,
    dy,
    toleranceX,
    toleranceY
) {

    let horizontal =
        "";


    let vertical =
        "";


    if (
        Math.abs(dx) >
        toleranceX
    ) {

        horizontal =
            dx > 0
            ? "往右"
            : "往左";

    }


    if (
        Math.abs(dy) >
        toleranceY
    ) {

        vertical =
            dy > 0
            ? "往下"
            : "往上";

    }


    if (
        horizontal &&
        vertical
    ) {

        return (
            horizontal +
            "、" +
            vertical
        );

    }


    return (
        horizontal ||
        vertical
    );

}


/* =====================================================
   主畫面處理
===================================================== */

function drawResult(result) {

    const displayWidth =
        video.clientWidth;


    const displayHeight =
        video.clientHeight;


    overlay.width =
        displayWidth;


    overlay.height =
        displayHeight;


    ctx.clearRect(
        0,
        0,
        displayWidth,
        displayHeight
    );


    const scaleX =
        displayWidth /
        video.videoWidth;


    const scaleY =
        displayHeight /
        video.videoHeight;


    /*
    整理有效人臉
    */

    const validFaces =
        [];


    if (result.detections) {

        for (
            const detection
            of result.detections
        ) {

            const box =
                detection.boundingBox;


            const x =
                box.originX *
                scaleX;


            const y =
                box.originY *
                scaleY;


            const w =
                box.width *
                scaleX;


            const h =
                box.height *
                scaleY;


            /*
            太小的誤判先忽略
            */

            if (
                w <
                displayWidth * 0.08

                ||

                h <
                displayHeight * 0.08
            ) {

                continue;

            }


            validFaces.push({

                x,
                y,
                w,
                h,

                centerX:
                    x + w / 2,

                centerY:
                    y + h / 2

            });

        }

    }


    /*
    有人物
    */

    if (
        validFaces.length > 0
    ) {

        drawPeopleComposition(

            validFaces,

            displayWidth,

            displayHeight

        );

        return;

    }


    /*
    沒人物 + 後鏡頭
    ↓
    自動風景構圖
    */

    if (isRearCamera) {

        drawLandscapeComposition(

            displayWidth,

            displayHeight

        );

        return;

    }


    /*
    前鏡頭沒有人
    */

    faceInfo.innerText =
        "";


    modeInfo.innerText =
        "👤 人像構圖模式";


    guideInfo.innerText =
        "等待人物進入畫面";


    scoreInfo.innerText =
        "";

}


/* =====================================================
   人像 / 多人構圖
===================================================== */

function drawPeopleComposition(
    faces,
    width,
    height
) {

    faceInfo.innerText =
        "偵測到人物：" +
        faces.length +
        " 人";


    /*
    每張臉綠框
    */

    for (
        const face
        of faces
    ) {

        ctx.strokeStyle =
            "lime";


        ctx.lineWidth =
            3;


        ctx.strokeRect(
            face.x,
            face.y,
            face.w,
            face.h
        );

    }


    /*
    =================================
    單人
    =================================
    */

    if (
        faces.length === 1
    ) {

        modeInfo.innerText =
            "👤 單人構圖模式";


        const face =
            faces[0];


        const points = [

            {
                x: width / 3,
                y: height / 3
            },

            {
                x: width * 2 / 3,
                y: height / 3
            },

            {
                x: width / 3,
                y: height * 2 / 3
            },

            {
                x: width * 2 / 3,
                y: height * 2 / 3
            }

        ];


        let target =
            points[0];


        let distance =
            getDistance(

                face.centerX,
                face.centerY,

                target.x,
                target.y

            );


        for (
            const point
            of points
        ) {

            const d =
                getDistance(

                    face.centerX,
                    face.centerY,

                    point.x,
                    point.y

                );


            if (
                d < distance
            ) {

                distance =
                    d;


                target =
                    point;

            }

        }


        ctx.beginPath();


        ctx.arc(
            target.x,
            target.y,
            8,
            0,
            Math.PI * 2
        );


        ctx.fillStyle =
            "deepskyblue";


        ctx.fill();


        ctx.beginPath();


        ctx.arc(
            face.centerX,
            face.centerY,
            8,
            0,
            Math.PI * 2
        );


        ctx.fillStyle =
            "red";


        ctx.fill();


        ctx.beginPath();


        ctx.moveTo(
            face.centerX,
            face.centerY
        );


        ctx.lineTo(
            target.x,
            target.y
        );


        ctx.strokeStyle =
            "yellow";


        ctx.lineWidth =
            3;


        ctx.stroke();


        const okDistance =
            Math.min(
                width,
                height
            ) * 0.18;


        const nearDistance =
            Math.min(
                width,
                height
            ) * 0.28;


        const dx =
            target.x -
            face.centerX;


        const dy =
            target.y -
            face.centerY;


        const direction =
            getDirectionText(

                dx,
                dy,

                width * 0.10,

                height * 0.10

            );


        let rawScore =
            100 -
            (
                distance /
                (
                    Math.sqrt(
                        width * width +
                        height * height
                    )
                    *
                    0.45
                )
            )
            *
            100;


        rawScore =
            Math.max(
                0,
                Math.min(
                    100,
                    rawScore
                )
            );


        const score =
            updateSmoothScore(
                rawScore
            );


        if (
            distance <=
            okDistance
        ) {

            okCounter++;

        }

        else {

            okCounter =
                Math.max(
                    0,
                    okCounter - 1
                );

        }


        if (
            okCounter >= 4
        ) {

            guideInfo.innerText =
                "✅ 構圖 OK";

        }

        else if (
            distance <=
            nearDistance
        ) {

            guideInfo.innerText =
                "👍 快到了";

        }

        else {

            guideInfo.innerText =
                direction
                ? "建議：" +
                  direction
                : "👍 快到了";

        }


        scoreInfo.innerText =
            "構圖分數：" +
            score +
            " 分";


        return;

    }


    /*
    =================================
    多人
    =================================
    */

    modeInfo.innerText =
        "👥 多人合照模式：" +
        faces.length +
        " 人";


    let totalX =
        0;


    let totalY =
        0;


    let minX =
        Infinity;


    let minY =
        Infinity;


    let maxX =
        -Infinity;


    let maxY =
        -Infinity;


    for (
        const face
        of faces
    ) {

        totalX +=
            face.centerX;


        totalY +=
            face.centerY;


        minX =
            Math.min(
                minX,
                face.x
            );


        minY =
            Math.min(
                minY,
                face.y
            );


        maxX =
            Math.max(
                maxX,
                face.x +
                face.w
            );


        maxY =
            Math.max(
                maxY,
                face.y +
                face.h
            );

    }


    const groupX =
        totalX /
        faces.length;


    const groupY =
        totalY /
        faces.length;


    const targetX =
        width *
        0.50;


    const targetY =
        height *
        0.43;


    ctx.strokeStyle =
        "orange";


    ctx.lineWidth =
        4;


    ctx.strokeRect(

        minX,
        minY,

        maxX - minX,

        maxY - minY

    );


    ctx.beginPath();


    ctx.arc(
        groupX,
        groupY,
        9,
        0,
        Math.PI * 2
    );


    ctx.fillStyle =
        "magenta";


    ctx.fill();


    ctx.beginPath();


    ctx.arc(
        targetX,
        targetY,
        9,
        0,
        Math.PI * 2
    );


    ctx.fillStyle =
        "cyan";


    ctx.fill();


    ctx.beginPath();


    ctx.moveTo(
        groupX,
        groupY
    );


    ctx.lineTo(
        targetX,
        targetY
    );


    ctx.strokeStyle =
        "yellow";


    ctx.lineWidth =
        3;


    ctx.stroke();


    const distance =
        getDistance(

            groupX,
            groupY,

            targetX,
            targetY

        );


    const okDistance =
        Math.min(
            width,
            height
        ) *
        0.20;


    const nearDistance =
        Math.min(
            width,
            height
        ) *
        0.32;


    const edgeMargin =
        width *
        0.05;


    const touchesEdge =

        minX <
        edgeMargin

        ||

        maxX >
        width -
        edgeMargin;


    const dx =
        targetX -
        groupX;


    const dy =
        targetY -
        groupY;


    const direction =
        getDirectionText(

            dx,
            dy,

            width * 0.08,

            height * 0.08

        );


    let rawScore =
        100 -
        (
            distance /
            (
                Math.sqrt(
                    width * width +
                    height * height
                )
                *
                0.50
            )
        )
        *
        100;


    if (
        touchesEdge
    ) {

        rawScore -=
            10;

    }


    rawScore =
        Math.max(
            0,
            Math.min(
                100,
                rawScore
            )
        );


    const score =
        updateSmoothScore(
            rawScore
        );


    if (
        distance <=
        okDistance
        &&
        !touchesEdge
    ) {

        okCounter++;

    }

    else {

        okCounter =
            Math.max(
                0,
                okCounter - 1
            );

    }


    if (
        touchesEdge
    ) {

        guideInfo.innerText =
            "⚠️ 人物太靠近畫面邊緣";

    }

    else if (
        okCounter >= 4
    ) {

        guideInfo.innerText =
            "✅ 多人構圖 OK";

    }

    else if (
        distance <=
        nearDistance
    ) {

        guideInfo.innerText =
            "👍 快到了";

    }

    else {

        guideInfo.innerText =
            direction
            ? "建議：" +
              direction
            : "👍 快到了";

    }


    scoreInfo.innerText =
        "構圖分數：" +
        score +
        " 分";

}


/* =====================================================
   風景構圖
===================================================== */

function drawLandscapeComposition(
    width,
    height
) {

    faceInfo.innerText =
        "";


    modeInfo.innerText =
        "🏞️ 智慧風景構圖";


    /*
    不需要每一個 frame
    都分析風景。

    每 250ms 分析一次即可。
    */

    const now =
        performance.now();


    if (
        now -
        lastLandscapeAnalysis
        >
        250
    ) {

        lastLandscapeAnalysis =
            now;


        const result =
            detectHorizon();


        if (result) {

            if (
                smoothHorizonY ===
                null
            ) {

                smoothHorizonY =
                    result.y;

            }

            else {

                smoothHorizonY =

                    smoothHorizonY *
                    0.80

                    +

                    result.y *
                    0.20;

            }

        }

    }


    if (
        smoothHorizonY ===
        null
    ) {

        guideInfo.innerText =
            "正在分析風景...";


        scoreInfo.innerText =
            "";

        return;

    }


    /*
    原始分析 Canvas
    是 90 像素高。

    換算成手機畫面座標。
    */

    const horizonY =
        (
            smoothHorizonY /
            analysisCanvas.height
        )
        *
        height;


    /*
    畫偵測到的地平線
    */

    ctx.beginPath();


    ctx.moveTo(
        0,
        horizonY
    );


    ctx.lineTo(
        width,
        horizonY
    );


    ctx.strokeStyle =
        "#00ffff";


    ctx.lineWidth =
        4;


    ctx.stroke();


    /*
    找最接近的上下三分線
    */

    const upperThird =
        height /
        3;


    const lowerThird =
        height *
        2 /
        3;


    let targetY;


    if (
        Math.abs(
            horizonY -
            upperThird
        )
        <
        Math.abs(
            horizonY -
            lowerThird
        )
    ) {

        targetY =
            upperThird;

    }

    else {

        targetY =
            lowerThird;

    }


    /*
    目標線
    */

    ctx.beginPath();


    ctx.moveTo(
        0,
        targetY
    );


    ctx.lineTo(
        width,
        targetY
    );


    ctx.strokeStyle =
        "yellow";


    ctx.lineWidth =
        3;


    ctx.stroke();


    const distance =
        Math.abs(
            horizonY -
            targetY
        );


    const okDistance =
        height *
        0.07;


    const nearDistance =
        height *
        0.14;


    /*
    分數
    */

    let rawScore =
        100 -
        (
            distance /
            (
                height *
                0.40
            )
        )
        *
        100;


    rawScore =
        Math.max(
            0,
            Math.min(
                100,
                rawScore
            )
        );


    const score =
        updateSmoothScore(
            rawScore
        );


    /*
    注意：

    如果地平線太下面，
    為了把地平線往上移，
    相機應往下壓。

    如果地平線太上面，
    相機應往上抬。
    */

    if (
        distance <=
        okDistance
    ) {

        okCounter++;

    }

    else {

        okCounter =
            Math.max(
                0,
                okCounter - 1
            );

    }


    if (
        okCounter >= 4
    ) {

        guideInfo.innerText =
            "✅ 風景構圖 OK";

    }

    else if (
        distance <=
        nearDistance
    ) {

        guideInfo.innerText =
            "👍 地平線快到三分線";

    }

    else if (
        horizonY >
        targetY
    ) {

        guideInfo.innerText =
            "建議：鏡頭稍微往下";

    }

    else {

        guideInfo.innerText =
            "建議：鏡頭稍微往上";

    }


    scoreInfo.innerText =
        "風景構圖分數：" +
        score +
        " 分";

}


/* =====================================================
   偵測風景水平線 / 地平線

   原理：
   將相機畫面縮小，
   比較每一列上下亮度差異。

   差異最大的水平區域，
   很可能是天空 / 山 / 海 /
   建築與背景的交界。
===================================================== */

function detectHorizon() {

    if (
        video.videoWidth === 0 ||
        video.videoHeight === 0
    ) {

        return null;

    }


    /*
    小尺寸分析可以大幅降低手機負擔
    */

    const w =
        160;


    const h =
        90;


    analysisCanvas.width =
        w;


    analysisCanvas.height =
        h;


    analysisCtx.drawImage(

        video,

        0,
        0,

        w,
        h

    );


    const imageData =
        analysisCtx.getImageData(

            0,
            0,

            w,
            h

        );


    const data =
        imageData.data;


    const gray =
        new Float32Array(
            w * h
        );


    /*
    RGB → 灰階
    */

    for (
        let y = 0;
        y < h;
        y++
    ) {

        for (
            let x = 0;
            x < w;
            x++
        ) {

            const index =
                (
                    y * w +
                    x
                )
                *
                4;


            const r =
                data[index];


            const g =
                data[index + 1];


            const b =
                data[index + 2];


            gray[
                y * w +
                x
            ] =

                r * 0.299

                +

                g * 0.587

                +

                b * 0.114;

        }

    }


    let bestY =
        h / 2;


    let bestScore =
        -1;


    /*
    不檢查最上面和最下面，
    避免邊框誤判。
    */

    const startY =
        Math.floor(
            h * 0.18
        );


    const endY =
        Math.floor(
            h * 0.82
        );


    for (
        let y = startY;
        y < endY;
        y++
    ) {

        let score =
            0;


        /*
        每隔兩個像素取樣，
        降低 CPU 負擔
        */

        for (
            let x = 4;
            x < w - 4;
            x += 2
        ) {

            const above =
                gray[
                    (y - 2) *
                    w +
                    x
                ];


            const below =
                gray[
                    (y + 2) *
                    w +
                    x
                ];


            score +=
                Math.abs(
                    below -
                    above
                );

        }


        /*
        稍微偏好接近三分線的位置，
        避免小物件誤判。
        */

        const upperThird =
            h /
            3;


        const lowerThird =
            h *
            2 /
            3;


        const distThird =
            Math.min(

                Math.abs(
                    y -
                    upperThird
                ),

                Math.abs(
                    y -
                    lowerThird
                )

            );


        const bonus =
            1 +
            (
                1 -
                distThird /
                h
            )
            *
            0.15;


        score *=
            bonus;


        if (
            score >
            bestScore
        ) {

            bestScore =
                score;


            bestY =
                y;

        }

    }


    return {

        y:
            bestY,

        strength:
            bestScore

    };

}
