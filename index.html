<!DOCTYPE html>
<html lang="zh-TW">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               user-scalable=no">

<title>iPhone 鏡頭測試</title>

<style>

body {
    margin: 0;
    background: black;
    color: white;
    font-family: Arial;
    text-align: center;
}

h2 {
    margin: 15px;
}

video {
    width: 100%;
    max-width: 800px;
    background: #222;
}

select {
    font-size: 18px;
    padding: 10px;
    margin: 10px;
    width: 90%;
    max-width: 400px;
}

button {
    font-size: 18px;
    padding: 12px 20px;
    margin: 10px;
}

#status {
    margin: 10px;
    font-size: 18px;
}

</style>

</head>


<body>

<h2>📷 iPhone 鏡頭測試</h2>

<div id="status">
請先開啟相機
</div>

<video
    id="camera"
    autoplay
    playsinline
    muted>
</video>

<br>

<button onclick="startCamera()">
    開啟相機
</button>

<br>

<select
    id="cameraSelect"
    onchange="changeCamera()">

    <option value="">
        尚未取得鏡頭
    </option>

</select>


<script>

let stream = null;

const video =
    document.getElementById("camera");

const cameraSelect =
    document.getElementById("cameraSelect");

const statusText =
    document.getElementById("status");


/* =========================
   第一次開啟相機
========================= */

async function startCamera() {

    try {

        /*
        先要求一次相機權限
        */

        stream =
            await navigator.mediaDevices
                .getUserMedia({

                    video: true,

                    audio: false

                });


        video.srcObject =
            stream;


        await video.play();


        statusText.innerText =
            "✅ 相機已開啟";


        /*
        有權限之後
        才能正確取得鏡頭清單
        */

        await loadCameraList();

    }

    catch(error) {

        statusText.innerText =
            "❌ 相機錯誤：" +
            error.message;

    }

}


/* =========================
   取得所有攝影機
========================= */

async function loadCameraList() {

    try {

        const devices =
            await navigator.mediaDevices
                .enumerateDevices();


        const cameras =
            devices.filter(

                device =>
                    device.kind ===
                    "videoinput"

            );


        cameraSelect.innerHTML =
            "";


        cameras.forEach(
            (camera, index) => {

                const option =
                    document.createElement(
                        "option"
                    );


                option.value =
                    camera.deviceId;


                /*
                Safari 有提供名稱就顯示名稱

                沒名稱就顯示
                Camera 1、2、3...
                */

                option.text =
                    camera.label ||
                    "Camera " +
                    (index + 1);


                cameraSelect.appendChild(
                    option
                );

            }
        );


        statusText.innerText =
            "找到 " +
            cameras.length +
            " 個攝影鏡頭";


        /*
        找目前使用中的鏡頭
        */

        const track =
            stream
                .getVideoTracks()[0];


        const settings =
            track.getSettings();


        if (
            settings.deviceId
        ) {

            cameraSelect.value =
                settings.deviceId;

        }

    }

    catch(error) {

        statusText.innerText =
            "取得鏡頭清單失敗：" +
            error.message;

    }

}


/* =========================
   切換指定鏡頭
========================= */

async function changeCamera() {

    const deviceId =
        cameraSelect.value;


    if (!deviceId) {

        return;

    }


    try {

        /*
        先關閉舊鏡頭
        */

        if (stream) {

            stream
                .getTracks()
                .forEach(

                    track =>
                        track.stop()

                );

        }


        /*
        指定真正的 deviceId

        exact =
        一定要使用這顆鏡頭
        */

        stream =
            await navigator.mediaDevices
                .getUserMedia({

                    video: {

                        deviceId: {
                            exact:
                                deviceId
                        }

                    },

                    audio:
                        false

                });


        video.srcObject =
            stream;


        await video.play();


        const selectedText =
            cameraSelect
                .options[
                    cameraSelect.selectedIndex
                ]
                .text;


        statusText.innerText =
            "📷 使用：" +
            selectedText;

    }

    catch(error) {

        statusText.innerText =
            "❌ 切換失敗：" +
            error.message;

    }

}


window.startCamera =
    startCamera;

window.changeCamera =
    changeCamera;

</script>

</body>

</html>
