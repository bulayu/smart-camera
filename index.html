<!DOCTYPE html>
<html lang="zh-TW">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               user-scalable=no,
               viewport-fit=cover">

<title>智慧構圖助手 V4.2</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    background: black;
    color: white;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        Arial,
        sans-serif;

    text-align: center;
}

#topBar {

    padding-top:
        max(
            8px,
            env(safe-area-inset-top)
        );

    padding-bottom: 6px;
}

#title {

    font-size: 19px;
    font-weight: 600;
}

#status {

    min-height: 18px;

    margin-top: 4px;

    font-size: 13px;

    color: #aaaaaa;
}


/* ======================
   相機
====================== */

#cameraBox {

    position: relative;

    width: 100%;
    max-width: 900px;

    margin: auto;

    overflow: hidden;

    background: #111;
}

#camera {

    display: block;

    width: 100%;
    height: auto;
}

#overlay {

    position: absolute;

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    pointer-events: none;
}


/* ======================
   控制
====================== */

#controls {

    padding:

        10px 4px

        calc(
            15px +
            env(safe-area-inset-bottom)
        );
}

button {

    border: none;

    border-radius: 12px;

    padding: 11px 15px;

    margin: 4px;

    font-size: 16px;

    background: #292929;
    color: white;
}

.cameraButton {

    min-width: 118px;
}

#shutterButton {

    width: 72px;
    height: 72px;

    border-radius: 50%;

    padding: 0;

    margin: 9px 12px;

    border: 4px solid white;

    font-size: 29px;

    background: #222;
}


/* ======================
   照片
====================== */

#photoPreview {

    display: none;

    width: 170px;
    max-width: 45%;

    margin-bottom: 20px;

    border-radius: 10px;

    border: 2px solid white;
}

#photoCanvas,
#analysisCanvas {

    display: none;
}

</style>

</head>


<body>


<div id="topBar">

    <div id="title">
        📷 智慧構圖助手
    </div>

    <div id="status">
        AI 載入中...
    </div>

</div>


<div id="cameraBox">

    <video
        id="camera"
        autoplay
        muted
        playsinline>
    </video>

    <canvas id="overlay"></canvas>

</div>


<div id="controls">

    <button
        class="cameraButton"
        onclick="openFrontCamera()">
        🤳 前鏡頭
    </button>

    <button
        class="cameraButton"
        onclick="openRearCamera()">
        📷 後鏡頭
    </button>

    <br>

    <button
        id="shutterButton"
        onclick="takePhoto()">
        📸
    </button>

    <button onclick="stopCamera()">
        關閉
    </button>

</div>


<img id="photoPreview">


<canvas id="photoCanvas"></canvas>

<canvas id="analysisCanvas"></canvas>



<script type="module">

import {

    FaceDetector,
    ObjectDetector,
    FilesetResolver

}
from
"https://unpkg.com/@mediapipe/tasks-vision@0.10.35/vision_bundle.mjs";


/* =====================================================
   AI
===================================================== */

let faceDetector = null;

let objectDetector = null;

let aiReady = false;


/* =====================================================
   相機
===================================================== */

let stream = null;

let cameraRunning = false;

let currentMode =
    "environment";

let frontDeviceId =
    "";

let rearDeviceId =
    "";

let cameraSession =
    0;


/* =====================================================
   分析時間
===================================================== */

let lastVideoTime =
    -1;

let lastObjectTime =
    0;

let lastSceneTime =
    0;


/* =====================================================
   AI 主體
===================================================== */

let smoothSubjectX =
    null;

let smoothSubjectY =
    null;


/* =====================================================
   推薦構圖位置
===================================================== */

let desiredXRatio =
    0.5;

let desiredYRatio =
    0.45;


/*
推薦位置鎖定

避免一下左邊
一下右邊
*/
let lockedType =
    "";

let lockUntil =
    0;

const LOCK_TIME =
    3500;


/* =====================================================
   導航手機
===================================================== */

let navX =
    null;

let navY =
    null;

let smoothNavX =
    null;

let smoothNavY =
    null;


/* =====================================================
   OK
===================================================== */

let okCounter =
    0;

let compositionOK =
    false;


/* =====================================================
   HTML
===================================================== */

const video =
    document.getElementById(
        "camera"
    );

const overlay =
    document.getElementById(
        "overlay"
    );

const ctx =
    overlay.getContext(
        "2d"
    );

const statusText =
    document.getElementById(
        "status"
    );

const photoCanvas =
    document.getElementById(
        "photoCanvas"
    );

const photoCtx =
    photoCanvas.getContext(
        "2d"
    );

const photoPreview =
    document.getElementById(
        "photoPreview"
    );

const analysisCanvas =
    document.getElementById(
        "analysisCanvas"
    );

const analysisCtx =
    analysisCanvas.getContext(

        "2d",

        {
            willReadFrequently:
                true
        }

    );


/* =====================================================
   AI 載入
===================================================== */

async function loadAI() {

    try {

        statusText.innerText =
            "正在載入 AI...";


        const vision =
            await FilesetResolver
                .forVisionTasks(

                "https://unpkg.com/@mediapipe/tasks-vision@0.10.35/wasm"

            );


        /*
        人臉 AI
        */

        faceDetector =
            await FaceDetector
                .createFromOptions(

                vision,

                {

                    baseOptions: {

                        modelAssetPath:

                        "https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite"

                    },

                    runningMode:
                        "VIDEO",

                    minDetectionConfidence:
                        0.55

                }

            );


        /*
        物件 AI
        */

        objectDetector =
            await ObjectDetector
                .createFromOptions(

                vision,

                {

                    baseOptions: {

                        modelAssetPath:

                        "https://storage.googleapis.com/mediapipe-tasks/object_detector/efficientdet_lite0_uint8.tflite"

                    },

                    runningMode:
                        "VIDEO",

                    scoreThreshold:
                        0.48,

                    maxResults:
                        5

                }

            );


        aiReady =
            true;


        statusText.innerText =
            "✅ AI 已準備完成";

    }

    catch(error) {

        console.error(
            error
        );


        statusText.innerText =
            "❌ AI 載入失敗";

    }

}


/* =====================================================
   找前後鏡頭
===================================================== */

async function prepareCameraDevices() {

    try {

        const tempStream =
            await navigator.mediaDevices
                .getUserMedia({

                    video: true,

                    audio: false

                });


        tempStream
            .getTracks()
            .forEach(

                track =>
                    track.stop()

            );


        const devices =
            await navigator.mediaDevices
                .enumerateDevices();


        const cameras =
            devices.filter(

                device =>
                    device.kind ===
                    "videoinput"

            );


        frontDeviceId =
            "";

        rearDeviceId =
            "";


        for (
            const camera
            of cameras
        ) {

            const name =
                (
                    camera.label ||
                    ""
                )
                .toLowerCase();


            if (
                !frontDeviceId
                &&
                (
                    name.includes("front")
                    ||
                    name.includes("user")
                    ||
                    name.includes("前")
                )
            ) {

                frontDeviceId =
                    camera.deviceId;

            }


            const isRear =

                name.includes("back")

                ||

                name.includes("rear")

                ||

                name.includes("environment")

                ||

                name.includes("後");


            const specialLens =

                name.includes("ultra")

                ||

                name.includes("tele")

                ||

                name.includes("zoom");


            if (
                !rearDeviceId
                &&
                isRear
                &&
                !specialLens
            ) {

                rearDeviceId =
                    camera.deviceId;

            }

        }


        /*
        找不到普通後鏡頭
        就選任何後鏡頭
        */

        if (
            !rearDeviceId
        ) {

            for (
                const camera
                of cameras
            ) {

                const name =
                    (
                        camera.label ||
                        ""
                    )
                    .toLowerCase();


                if (
                    name.includes("back")
                    ||
                    name.includes("rear")
                    ||
                    name.includes("後")
                ) {

                    rearDeviceId =
                        camera.deviceId;

                    break;

                }

            }

        }

    }

    catch(error) {

        console.log(
            error
        );

    }

}


/* =====================================================
   前鏡頭
===================================================== */

async function openFrontCamera() {

    await openCamera(
        "user"
    );

}


/* =====================================================
   後鏡頭
===================================================== */

async function openRearCamera() {

    await openCamera(
        "environment"
    );

}


/* =====================================================
   開啟相機
===================================================== */

async function openCamera(
    mode
) {

    if (!aiReady) {

        alert(
            "AI 還在載入，請稍等一下"
        );

        return;

    }


    if (
        !frontDeviceId
        &&
        !rearDeviceId
    ) {

        statusText.innerText =
            "正在取得相機權限...";


        await prepareCameraDevices();

    }


    cameraSession++;


    const thisSession =
        cameraSession;


    cameraRunning =
        false;


    stopCurrentStream();


    try {

        let constraints;


        if (
            mode === "user"
            &&
            frontDeviceId
        ) {

            constraints = {

                video: {

                    deviceId: {

                        exact:
                            frontDeviceId

                    }

                },

                audio:
                    false

            };

        }


        else if (
            mode === "environment"
            &&
            rearDeviceId
        ) {

            constraints = {

                video: {

                    deviceId: {

                        exact:
                            rearDeviceId

                    }

                },

                audio:
                    false

            };

        }


        else {

            constraints = {

                video: {

                    facingMode: {

                        exact:
                            mode

                    }

                },

                audio:
                    false

            };

        }


        stream =
            await navigator.mediaDevices
                .getUserMedia(
                    constraints
                );

    }

    catch(error) {

        try {

            stream =
                await navigator.mediaDevices
                    .getUserMedia({

                        video: {

                            facingMode:
                                mode

                        },

                        audio:
                            false

                    });

        }

        catch(error2) {

            statusText.innerText =
                "❌ 無法開啟相機";

            return;

        }

    }


    video.srcObject =
        stream;


    await video.play();


    currentMode =
        mode;


    cameraRunning =
        true;


    resetNavigation();


    statusText.innerText =

        mode === "user"

        ?

        "🤳 前鏡頭"

        :

        "📷 後鏡頭";


    requestAnimationFrame(

        () =>
            cameraLoop(
                thisSession
            )

    );

}


/* =====================================================
   重設
===================================================== */

function resetNavigation() {

    lastVideoTime =
        -1;


    lastObjectTime =
        0;


    lastSceneTime =
        0;


    smoothSubjectX =
        null;


    smoothSubjectY =
        null;


    navX =
        null;


    navY =
        null;


    smoothNavX =
        null;


    smoothNavY =
        null;


    lockedType =
        "";


    lockUntil =
        0;


    okCounter =
        0;


    compositionOK =
        false;

}


/* =====================================================
   關閉串流
===================================================== */

function stopCurrentStream() {

    if (stream) {

        stream
            .getTracks()
            .forEach(

                track =>
                    track.stop()

            );


        stream =
            null;

    }

}


/* =====================================================
   關閉
===================================================== */

function stopCamera() {

    cameraSession++;


    cameraRunning =
        false;


    stopCurrentStream();


    video.srcObject =
        null;


    ctx.clearRect(

        0,
        0,

        overlay.width,
        overlay.height

    );


    resetNavigation();


    statusText.innerText =
        "相機已關閉";

}


/* =====================================================
   主循環
===================================================== */

function cameraLoop(
    session
) {

    if (
        session !==
        cameraSession
    ) {

        return;

    }


    if (!cameraRunning) {

        return;

    }


    if (
        video.readyState >= 2
        &&
        video.videoWidth > 0
        &&
        video.videoHeight > 0
    ) {

        if (
            currentMode ===
            "user"
        ) {

            processFront();

        }

        else {

            processRear();

        }

    }


    drawNavigation();


    requestAnimationFrame(

        () =>
            cameraLoop(
                session
            )

    );

}


/* =====================================================
   前鏡頭
===================================================== */

function processFront() {

    if (
        video.currentTime ===
        lastVideoTime
    ) {

        return;

    }


    lastVideoTime =
        video.currentTime;


    let result;


    try {

        result =
            faceDetector.detectForVideo(

                video,

                performance.now()

            );

    }

    catch(error) {

        return;

    }


    if (
        !result.detections
        ||
        result.detections.length === 0
    ) {

        return;

    }


    /*
    最大臉
    */

    let best =
        null;

    let bestArea =
        0;


    for (
        const detection
        of result.detections
    ) {

        const box =
            detection.boundingBox;


        const area =
            box.width *
            box.height;


        if (
            area >
            bestArea
        ) {

            bestArea =
                area;


            best =
                box;

        }

    }


    if (!best) {

        return;

    }


    const width =
        video.clientWidth;


    const height =
        video.clientHeight;


    const sx =
        width /
        video.videoWidth;


    const sy =
        height /
        video.videoHeight;


    const subjectX =

        (
            best.originX +
            best.width / 2
        )

        *
        sx;


    const subjectY =

        (
            best.originY +
            best.height / 2
        )

        *
        sy;


    setTarget(

        "person",

        subjectX,
        subjectY,

        width,
        height

    );


    updateNavigation(

        subjectX,
        subjectY,

        width,
        height

    );

}


/* =====================================================
   後鏡頭
===================================================== */

function processRear() {

    const now =
        performance.now();


    if (
        now -
        lastObjectTime
        <
        300
    ) {

        return;

    }


    lastObjectTime =
        now;


    let result =
        null;


    try {

        result =
            objectDetector.detectForVideo(

                video,
                now

            );

    }

    catch(error) {

        console.log(
            error
        );

    }


    const subject =
        chooseMainSubject(
            result
        );


    if (subject) {

        processObject(
            subject
        );

        return;

    }


    analyzeScene();

}


/* =====================================================
   選主體
===================================================== */

function chooseMainSubject(
    result
) {

    if (
        !result
        ||
        !result.detections
        ||
        result.detections.length === 0
    ) {

        return null;

    }


    let best =
        null;


    let bestScore =
        -Infinity;


    const frameArea =

        video.videoWidth
        *
        video.videoHeight;


    for (
        const detection
        of result.detections
    ) {

        const box =
            detection.boundingBox;


        if (!box) {

            continue;

        }


        const category =
            detection.categories?.[0];


        const confidence =
            category?.score || 0;


        const areaRatio =

            (
                box.width *
                box.height
            )

            /

            frameArea;


        if (
            areaRatio <
            0.018
        ) {

            continue;

        }


        const cx =

            box.originX +
            box.width / 2;


        const cy =

            box.originY +
            box.height / 2;


        const nx =

            cx /
            video.videoWidth;


        const ny =

            cy /
            video.videoHeight;


        const distance =

            Math.hypot(

                nx - 0.5,

                ny - 0.5

            );


        const score =

            areaRatio *
            3

            +

            confidence

            -

            distance *
            0.25;


        if (
            score >
            bestScore
        ) {

            bestScore =
                score;


            best = {

                box:
                    box,

                category:
                    category?.categoryName || ""

            };

        }

    }


    return best;

}


/* =====================================================
   物件
===================================================== */

function processObject(
    subject
) {

    const width =
        video.clientWidth;


    const height =
        video.clientHeight;


    const sx =
        width /
        video.videoWidth;


    const sy =
        height /
        video.videoHeight;


    const box =
        subject.box;


    const subjectX =

        (
            box.originX +
            box.width / 2
        )

        *
        sx;


    const subjectY =

        (
            box.originY +
            box.height / 2
        )

        *
        sy;


    setTarget(

        subject.category,

        subjectX,
        subjectY,

        width,
        height

    );


    updateNavigation(

        subjectX,
        subjectY,

        width,
        height

    );

}


/* =====================================================
   選最佳構圖點
===================================================== */

function setTarget(

    type,

    subjectX,
    subjectY,

    width,
    height

) {

    const now =
        performance.now();


    /*
    還在鎖定期間
    不亂改
    */

    if (
        lockedType === type
        &&
        now <
        lockUntil
    ) {

        return;

    }


    lockedType =
        type;


    lockUntil =
        now +
        LOCK_TIME;


    /*
    水平：
    左邊主體 → 左三分
    右邊主體 → 右三分
    */

    if (
        subjectX <
        width / 2
    ) {

        desiredXRatio =
            0.34;

    }

    else {

        desiredXRatio =
            0.66;

    }


    /*
    垂直不要太激進。

    這版全部控制在
    畫面中央附近。
    */

    const portraitTypes = [

        "person",
        "dog",
        "cat",
        "bird",
        "horse",
        "cow",
        "sheep"

    ];


    if (
        portraitTypes.includes(
            type
        )
    ) {

        desiredYRatio =
            0.42;

    }

    else {

        desiredYRatio =
            0.50;

    }

}


/* =====================================================
   V4.2 核心導航

   注意：

   這裡算的是
   「手機應該往哪個方向微調」

   不是把主體位置
   直接搬成手機位置。
===================================================== */

function updateNavigation(

    subjectX,
    subjectY,

    width,
    height

) {

    /*
    平滑 AI 主體
    */

    if (
        smoothSubjectX === null
    ) {

        smoothSubjectX =
            subjectX;


        smoothSubjectY =
            subjectY;

    }

    else {

        smoothSubjectX =

            smoothSubjectX *
            0.75

            +

            subjectX *
            0.25;


        smoothSubjectY =

            smoothSubjectY *
            0.75

            +

            subjectY *
            0.25;

    }


    /*
    AI 希望主體最後在哪
    */

    const desiredX =

        width *
        desiredXRatio;


    const desiredY =

        height *
        desiredYRatio;


    /*
    主體誤差
    */

    const errorX =

        smoothSubjectX -
        desiredX;


    const errorY =

        smoothSubjectY -
        desiredY;


    /*
    導航目標框
    永遠固定畫面中央偏上。

    使用者不用追著框跑。
    */

    const centerX =
        width * 0.50;


    const centerY =
        height * 0.32;


    /*
    =================================================
    水平導航

    主體在建議位置右邊 →
    手機應往右轉 / 右移。

    所以直接使用 errorX。
    =================================================
    */

    const maxHorizontal =

        width *
        0.30;


    let guideX =
        errorX *
        0.85;


    guideX =
        Math.max(

            -maxHorizontal,

            Math.min(

                maxHorizontal,

                guideX

            )

        );


    /*
    =================================================
    垂直導航

    這就是 V4.2 最大改變。

    垂直最大只允許畫面高度 6%。

    就算 AI 認為差很多，
    也不會叫你大幅低頭拍地板。
    =================================================
    */

    const maxVertical =

        height *
        0.06;


    /*
    小誤差才給垂直提示。

    如果垂直差距太大，
    視為拍攝場景本身不同，
    不強迫使用者猛抬 / 猛低鏡頭。
    */

    let guideY =
        0;


    const verticalDeadZone =

        height *
        0.06;


    const verticalLimit =

        height *
        0.20;


    if (
        Math.abs(errorY)
        >
        verticalDeadZone

        &&

        Math.abs(errorY)
        <
        verticalLimit
    ) {

        guideY =
            errorY *
            0.25;

    }


    guideY =
        Math.max(

            -maxVertical,

            Math.min(

                maxVertical,

                guideY

            )

        );


    /*
    最終手機圖示位置
    */

    navX =

        centerX +
        guideX;


    navY =

        centerY +
        guideY;


    /*
    平滑
    */

    if (
        smoothNavX === null
    ) {

        smoothNavX =
            navX;


        smoothNavY =
            navY;

    }

    else {

        smoothNavX =

            smoothNavX *
            0.70

            +

            navX *
            0.30;


        smoothNavY =

            smoothNavY *
            0.70

            +

            navY *
            0.30;

    }


    /*
    ============================
    OK 判斷

    水平比較重要。

    垂直放寬很多。
    ============================
    */

    const horizontalOK =

        Math.abs(errorX)
        <
        width * 0.09;


    const verticalOK =

        Math.abs(errorY)
        <
        height * 0.18;


    if (
        horizontalOK
        &&
        verticalOK
    ) {

        okCounter++;

    }

    else {

        okCounter =
            Math.max(

                0,

                okCounter - 1

            );

    }


    compositionOK =

        okCounter >= 4;

}


/* =====================================================
   無物件時：
   風景視覺重心
===================================================== */

function analyzeScene() {

    const now =
        performance.now();


    if (
        now -
        lastSceneTime
        <
        500
    ) {

        return;

    }


    lastSceneTime =
        now;


    if (
        video.videoWidth === 0
        ||
        video.videoHeight === 0
    ) {

        return;

    }


    const w =
        120;


    const h =
        80;


    analysisCanvas.width =
        w;


    analysisCanvas.height =
        h;


    analysisCtx.drawImage(

        video,

        0,
        0,

        w,
        h

    );


    const image =
        analysisCtx.getImageData(

            0,
            0,

            w,
            h

        );


    const data =
        image.data;


    const gray =
        new Float32Array(
            w * h
        );


    for (
        let y = 0;
        y < h;
        y++
    ) {

        for (
            let x = 0;
            x < w;
            x++
        ) {

            const i =

                (
                    y * w +
                    x
                )

                *
                4;


            gray[
                y * w +
                x
            ] =

                data[i] *
                0.299

                +

                data[i + 1] *
                0.587

                +

                data[i + 2] *
                0.114;

        }

    }


    /*
    找畫面細節最明顯區
    */

    const cols =
        5;

    const rows =
        5;


    let bestCol =
        2;

    let bestRow =
        2;

    let bestEnergy =
        -1;


    for (
        let row = 0;
        row < rows;
        row++
    ) {

        for (
            let col = 0;
            col < cols;
            col++
        ) {

            const startX =
                Math.floor(
                    col * w / cols
                );


            const endX =
                Math.floor(
                    (col + 1) * w / cols
                );


            const startY =
                Math.floor(
                    row * h / rows
                );


            const endY =
                Math.floor(
                    (row + 1) * h / rows
                );


            let energy =
                0;


            for (
                let y = startY + 1;
                y < endY - 1;
                y += 2
            ) {

                for (
                    let x = startX + 1;
                    x < endX - 1;
                    x += 2
                ) {

                    const center =
                        gray[
                            y * w + x
                        ];


                    const right =
                        gray[
                            y * w + x + 1
                        ];


                    const below =
                        gray[
                            (y + 1) * w + x
                        ];


                    energy +=

                        Math.abs(
                            center - right
                        )

                        +

                        Math.abs(
                            center - below
                        );

                }

            }


            if (
                col === 2
                &&
                row === 2
            ) {

                energy *=
                    0.82;

            }


            if (
                energy >
                bestEnergy
            ) {

                bestEnergy =
                    energy;


                bestCol =
                    col;


                bestRow =
                    row;

            }

        }

    }


    const width =
        video.clientWidth;


    const height =
        video.clientHeight;


    const subjectX =

        width *

        (
            bestCol + 0.5
        )

        /
        cols;


    const subjectY =

        height *

        (
            bestRow + 0.5
        )

        /
        rows;


    /*
    風景導航：
    主要以左右為主。

    垂直直接靠近中央，
    不叫使用者往地板拍。
    */

    const now2 =
        performance.now();


    if (
        lockedType !== "scene"
        ||
        now2 >= lockUntil
    ) {

        lockedType =
            "scene";


        lockUntil =
            now2 +
            LOCK_TIME;


        if (
            subjectX <
            width / 2
        ) {

            desiredXRatio =
                0.34;

        }

        else {

            desiredXRatio =
                0.66;

        }


        desiredYRatio =
            0.50;

    }


    updateNavigation(

        subjectX,
        subjectY,

        width,
        height

    );

}


/* =====================================================
   畫導航
===================================================== */

function drawNavigation() {

    const width =
        video.clientWidth;


    const height =
        video.clientHeight;


    overlay.width =
        width;


    overlay.height =
        height;


    ctx.clearRect(

        0,
        0,

        width,
        height

    );


    if (
        smoothNavX === null
        ||
        smoothNavY === null
    ) {

        return;

    }


    /*
    ======================
    固定目標框
    ======================
    */

    const targetX =
        width * 0.50;


    const targetY =
        height * 0.32;


    const boxWidth =

        Math.max(

            72,

            Math.min(
                width,
                height
            )

            *
            0.20

        );


    const boxHeight =

        boxWidth *
        1.30;


    const boxLeft =

        targetX -
        boxWidth / 2;


    const boxTop =

        targetY -
        boxHeight / 2;


    ctx.strokeStyle =

        compositionOK

        ?

        "#48ff70"

        :

        "rgba(255,255,255,0.95)";


    ctx.lineWidth =

        compositionOK
        ? 5
        : 4;


    ctx.shadowColor =
        "rgba(0,0,0,0.8)";


    ctx.shadowBlur =
        5;


    roundRect(

        ctx,

        boxLeft,
        boxTop,

        boxWidth,
        boxHeight,

        11

    );


    ctx.stroke();


    /*
    ======================
    黃色手機
    ======================
    */

    const phoneWidth =

        Math.max(

            28,

            Math.min(
                width,
                height
            )

            *
            0.075

        );


    const phoneHeight =

        phoneWidth *
        1.65;


    let px =
        smoothNavX;


    let py =
        smoothNavY;


    /*
    不讓圖示跑出去
    */

    px =
        Math.max(

            phoneWidth,

            Math.min(

                width -
                phoneWidth,

                px

            )

        );


    py =
        Math.max(

            phoneHeight,

            Math.min(

                height -
                phoneHeight,

                py

            )

        );


    ctx.strokeStyle =

        compositionOK

        ?

        "#48ff70"

        :

        "#ffd84a";


    ctx.lineWidth =
        4;


    const left =

        px -
        phoneWidth / 2;


    const top =

        py -
        phoneHeight / 2;


    roundRect(

        ctx,

        left,
        top,

        phoneWidth,
        phoneHeight,

        phoneWidth *
        0.16

    );


    ctx.stroke();


    /*
    聽筒
    */

    ctx.beginPath();


    ctx.moveTo(

        left +
        phoneWidth * 0.32,

        top +
        phoneHeight * 0.10

    );


    ctx.lineTo(

        left +
        phoneWidth * 0.68,

        top +
        phoneHeight * 0.10

    );


    ctx.lineWidth =
        2.5;


    ctx.stroke();


    /*
    Home 圓圈
    */

    ctx.beginPath();


    ctx.arc(

        px,

        top +
        phoneHeight * 0.89,

        phoneWidth * 0.07,

        0,

        Math.PI * 2

    );


    ctx.lineWidth =
        2;


    ctx.stroke();


    ctx.shadowBlur =
        0;

}


/* =====================================================
   圓角矩形
===================================================== */

function roundRect(

    context,

    x,
    y,

    width,
    height,

    radius

) {

    radius =
        Math.min(

            radius,

            width / 2,

            height / 2

        );


    context.beginPath();


    context.moveTo(
        x + radius,
        y
    );


    context.lineTo(
        x + width - radius,
        y
    );


    context.quadraticCurveTo(

        x + width,
        y,

        x + width,
        y + radius

    );


    context.lineTo(
        x + width,
        y + height - radius
    );


    context.quadraticCurveTo(

        x + width,
        y + height,

        x + width - radius,
        y + height

    );


    context.lineTo(
        x + radius,
        y + height
    );


    context.quadraticCurveTo(

        x,
        y + height,

        x,
        y + height - radius

    );


    context.lineTo(
        x,
        y + radius
    );


    context.quadraticCurveTo(

        x,
        y,

        x + radius,
        y

    );


    context.closePath();

}


/* =====================================================
   拍照
===================================================== */

function takePhoto() {

    if (
        !cameraRunning
        ||
        video.videoWidth === 0
    ) {

        alert(
            "請先開啟相機"
        );

        return;

    }


    photoCanvas.width =
        video.videoWidth;


    photoCanvas.height =
        video.videoHeight;


    photoCtx.drawImage(

        video,

        0,
        0,

        photoCanvas.width,
        photoCanvas.height

    );


    const imageData =
        photoCanvas.toDataURL(

            "image/jpeg",

            0.94

        );


    photoPreview.src =
        imageData;


    photoPreview.style.display =
        "inline-block";


    statusText.innerText =
        "📸 拍照完成";

}
