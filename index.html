/* =========================================================
   CAMERA
========================================================= */

async function startCamera(){

    try{

        messageEl.innerText=
        "📷 正在開啟相機...";


        if(stream){

            stream
            .getTracks()
            .forEach(
                track=>track.stop()
            );

        }


        stream=
        await navigator.mediaDevices
        .getUserMedia({

            video:{

                facingMode:{
                    ideal:facing
                },

                width:{
                    ideal:1280
                },

                height:{
                    ideal:720
                }

            },

            audio:false

        });


        video.srcObject=
        stream;


        await video.play();


        resizeOverlay();


        messageEl.innerText=
        "📷 對準想拍攝的畫面";

    }

    catch(error){

        console.log(error);


        if(
            error.name===
            "NotAllowedError"
        ){

            messageEl.innerText=
            "❌ 請允許網站使用相機";

        }

        else if(
            error.name===
            "NotFoundError"
        ){

            messageEl.innerText=
            "❌ 找不到可用相機";

        }

        else{

            messageEl.innerText=
            "❌ 相機無法開啟";

        }

    }

}


async function changeCamera(mode){

    facing=mode;

    portraitNavigation=false;

    resetTracking();

    await startCamera();

}

    trackedFace=null;

    lastVideoTime=-1;

}


/* =========================================================
   FACE DETECTOR
========================================================= */

async function initFaceDetector(){

    if(detectorReady){

        return true;

    }


    miniStatus.innerText=
    "載入中…";


    try{

        const vision=
        await FilesetResolver
        .forVisionTasks(

            "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22-rc.20250304/wasm"

        );


        faceDetector=
        await FaceDetector
        .createFromOptions(

            vision,

            {

                baseOptions:{

                    modelAssetPath:

                    "https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite"

                },

                runningMode:
                "VIDEO",

                minDetectionConfidence:
                0.45

            }

        );


        personDetector=
        await ObjectDetector.createFromOptions(
            vision,
            {
                baseOptions:{
                    modelAssetPath:
                    "https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite0/int8/1/efficientdet_lite0.tflite"
                },
                runningMode:"VIDEO",
                scoreThreshold:0.35,
                maxResults:3
            }
        );


        detectorReady=true;


        miniStatus.innerText=
        "● 已就緒";


        return true;

    }

    catch(error){

        console.error(
            "Face detector error",
            error
        );


        miniStatus.innerText=
        "載入失敗";


        messageEl.innerText=
        "❌ 人像辨識模組載入失敗";


        return false;

    }

}

    );

        currentComposition=null;

        compositionRow.innerHTML="";

        return;

    miniMode.innerText=
    data.icon+
    " "+
    data.name;


    buildCompositionButtons();


    selectComposition(
        data.default
    );


    if(mode==="portrait"){

        mainButton.innerText=

        detectorReady

        "● 已就緒"
        :

        "👤 對準人物後開始構圖導航";

    }

    else{

    }

}

function buildCompositionButtons(){

/* =========================================================
   SELECT COMPOSITION
========================================================= */

function selectComposition(id){

    currentComposition=id;


    const data=
    database[currentMode];


    if(!data){
        return;
    }


    const comp=
    data.comps.find(
        c=>c[0]===id
    );


    if(!comp){
        return;
    }


    miniComposition.innerText=
    comp[1];


    document
    .querySelectorAll(
        ".compBtn"
    )
    .forEach(

        button=>{

            button.classList.toggle(

                "active",

                button.dataset.id===id

            );

        }

    );


    drawComposition();

}


/* =========================================================
   MAIN
========================================================= */

async function runComposition(){

    if(
        currentMode===
        "portrait"
    ){

        const ok=
        await initFaceDetector();


        if(!ok){
            return;
        }


        /*
           每次重新按開始：

           解除上一次左右鎖定，
           下一張臉重新決定。
        */

        resetTracking();


        /*
           V6.4：
           保留使用者目前選擇的人像構圖。
           三分人像 = 左右目標鎖定導航
           中央人像 = 中央目標導航
        */

        if(
            currentComposition!=="portraitThirds" &&
            currentComposition!=="portraitCenter"
        ){
            currentComposition="portraitThirds";
        }


        portraitNavigation=true;


        miniComposition.innerText=
        currentComposition==="portraitCenter"
        ?
        "中央定位中"
        :
        "選擇位置中";


        miniStatus.innerText=
        "● 分析中";


        messageEl.innerText=
        "👤 保持人物在畫面中";


        requestAnimationFrame(
            portraitLoop
        );


        return;

    }


    if(
        currentMode===
        "auto"
    ){

        messageEl.innerText=
        "👉 V6.3.2 請先測試人像模式";


        return;

    }


    const data=
    database[currentMode];


    selectComposition(
        data.default
    );


    messageEl.innerText=
    "✓ 推薦："+
    miniComposition.innerText;

}


/* =========================================================
   PORTRAIT LOOP
========================================================= */

function portraitLoop(){

    if(
        !portraitNavigation ||
        currentMode!=="portrait"
    ){

        return;

    }


    if(
        video.readyState<2 ||
        !faceDetector
    ){

        requestAnimationFrame(
            portraitLoop
        );

        return;

    }


    if(
        video.currentTime===
        lastVideoTime
    ){

        requestAnimationFrame(
            portraitLoop
        );

        return;

    }


    lastVideoTime=
    video.currentTime;


    if(detecting){

        requestAnimationFrame(
            portraitLoop
        );

        return;

    }


    detecting=true;


    try{

        const now=performance.now();
        const result=faceDetector.detectForVideo(video, now);

        if(result && result.detections && result.detections.length>0){

            missingFrames=0;
            trackingSource="face";

            const detection=chooseMainFace(result.detections);
            updateTrackedFace(detection);

            if(!lockedTargetSide && trackedFace){
                if(currentComposition==="portraitCenter"){
                    lockedTargetSide="center";
                    targetReason="portrait-center";
                    stableStartTime=null;
                    completed=false;
                    miniComposition.innerText="中央人像";
                    miniStatus.innerText="● 已鎖定";
                }else{
                    lockTargetSide();
                }
            }

            drawPortraitNavigation();

        }else{

            /* V6.4.2：臉抓不到時，立即嘗試人物偵測。
               只取 person 類別中最大的主體，並以人物上半部估算頭部位置。 */
            let person=null;
            if(personDetector){
                const objectResult=personDetector.detectForVideo(video, now);
                person=chooseMainPerson(objectResult && objectResult.detections ? objectResult.detections : []);
            }

            if(person){
                missingFrames=0;
                trackingSource="person";
                updateTrackedFromPerson(person);

                if(!lockedTargetSide && trackedFace){
                    if(currentComposition==="portraitCenter"){
                        lockedTargetSide="center";
                        targetReason="portrait-center-person";
                        miniComposition.innerText="中央人像";
                    }else{
                        /* 遠距只看到人物時沒有可靠臉朝向，先鎖最近三分線 */
                        const w=overlay.clientWidth;
                        lockedTargetSide=Math.abs(trackedFace.x-w/3) <= Math.abs(trackedFace.x-w*2/3) ? "left" : "right";
                        targetReason="person-nearest-third";
                    }
                    stableStartTime=null;
                    completed=false;
                }

                drawPortraitNavigation();
                miniStatus.innerText="● 人物追蹤";
            }else{
                handleMissingFace();
            }
        }

    catch(error){

        console.log(
            "Detection error",
            error
        );

    }


    detecting=false;


    requestAnimationFrame(
        portraitLoop
    );

}


/* =========================================================
   MAIN FACE
========================================================= */

function chooseMainFace(
    detections
){

    let best=
    detections[0];


    let bestArea=0;


    detections.forEach(

        detection=>{

            const box=
            detection.boundingBox;


            if(!box){
                return;
            }


            const area=
            box.width*
            box.height;


            if(area>bestArea){

                bestArea=area;

                best=detection;

            }

        }

    );


    return best;

}


/* =========================================================
   V6.4.2 PERSON FALLBACK
========================================================= */

function chooseMainPerson(detections){
    let best=null;
    let bestArea=0;
    detections.forEach(d=>{
        const cat=d.categories && d.categories[0];
        const name=(cat && (cat.categoryName || cat.displayName) || "").toLowerCase();
        if(name!=="person") return;
        const b=d.boundingBox;
        if(!b) return;
        const area=b.width*b.height;
        if(area>bestArea){ bestArea=area; best=d; }
    });
    return best;
}

function updateTrackedFromPerson(detection){
    const b=detection.boundingBox;
    if(!b) return;

    /* EfficientDet 給的是整個人物框。構圖導航仍需要「頭部錨點」，
       所以用人物框上方約 18% 的位置估算頭部中心。 */
    const headX=b.originX+b.width*0.50;
    const headY=b.originY+b.height*0.18;
    const headW=Math.max(24,b.width*0.24);
    const headH=Math.max(24,b.height*0.18);
    const p1=videoPointToScreen(headX-headW/2,headY-headH/2);
    const p2=videoPointToScreen(headX+headW/2,headY+headH/2);
    const nf={
        x:(p1.x+p2.x)/2, y:(p1.y+p2.y)/2,
        w:Math.abs(p2.x-p1.x), h:Math.abs(p2.y-p1.y), direction:"front"
    };
    if(!trackedFace){ trackedFace=nf; return; }
    const a=0.58;
    trackedFace.x=trackedFace.x*a+nf.x*(1-a);
    trackedFace.y=trackedFace.y*a+nf.y*(1-a);
    trackedFace.w=trackedFace.w*a+nf.w*(1-a);
    trackedFace.h=trackedFace.h*a+nf.h*(1-a);
}


/* =========================================================
   TRACK FACE
========================================================= */

function updateTrackedFace(
    detection
){

    const box=
    detection.boundingBox;


    if(!box){
        return;
    }


    const p1=
    videoPointToScreen(

        box.originX,

        box.originY

    );


    const p2=
    videoPointToScreen(

        box.originX+
        box.width,

        box.originY+
        box.height

    );


    const newFace={

        x:
        (p1.x+p2.x)/2,

        y:
        (p1.y+p2.y)/2,

        w:
        Math.abs(
            p2.x-p1.x
        ),

        h:
        Math.abs(
            p2.y-p1.y
        ),

        direction:
        estimateFaceDirection(
            detection
        )

    };


    if(!trackedFace){

        trackedFace=
        newFace;

        return;

    }


    trackedFace.x=
    trackedFace.x*
    SMOOTHING+
    newFace.x*
    (1-SMOOTHING);


    trackedFace.y=
    trackedFace.y*
    SMOOTHING+
    newFace.y*
    (1-SMOOTHING);


    trackedFace.w=
    trackedFace.w*
    SMOOTHING+
    newFace.w*
    (1-SMOOTHING);


    trackedFace.h=
    trackedFace.h*
    SMOOTHING+
    newFace.h*
    (1-SMOOTHING);


    /*
       朝向仍持續更新，
       但 V6.3.2 不再使用它
       重新切換目標。
    */

    trackedFace.direction=
    newFace.direction;

}


/* =========================================================
   FACE DIRECTION
========================================================= */

function estimateFaceDirection(
    detection
){

    const kp=
    detection.keypoints;


    if(
        !kp ||
        kp.length<3
    ){

        return "front";

    }


    const eye1=
    kp[0];


    const eye2=
    kp[1];


    const nose=
    kp[2];


    if(
        !eye1 ||
        !eye2 ||
        !nose
    ){

        return "front";

    }


    const eyeCenter=
    (
        eye1.x+
        eye2.x
    )/2;


    const eyeDistance=
    Math.abs(
        eye1.x-
        eye2.x
    );


    if(
        eyeDistance<
        .001
    ){

        return "front";

    }


    const offset=
    (
        nose.x-
        eyeCenter
    )/
    eyeDistance;


    if(offset>.16){

        return "right";

    }


    if(offset<-.16){

        return "left";

    }


    return "front";

}


/* =========================================================
   V6.3.2 LOCK TARGET

   這個函式只會在
   lockedTargetSide === null
   時執行。

========================================================= */

function lockTargetSide(){

    if(
        lockedTargetSide ||
        !trackedFace
    ){

        return;

    }


    const w=
    overlay.clientWidth;


    /*
       1. 有明確臉部方向時：

       人朝右：
       人放左三分，
       右邊留空間。

       人朝左：
       人放右三分，
       左邊留空間。
    */


    if(
        trackedFace.direction===
        "right"
    ){

        lockedTargetSide=
        "left";


        targetReason=
        "face-right";

    }


    else if(
        trackedFace.direction===
        "left"
    ){

        lockedTargetSide=
        "right";


        targetReason=
        "face-left";

    }


    /*
       2. 正面人物：

       選擇距離目前人物
       最近的三分位置。

       這樣手機不用大幅移動。
    */

    else{

        const leftX=
        w/3;


        const rightX=
        w*2/3;


        const leftDistance=
        Math.abs(
            trackedFace.x-
            leftX
        );


        const rightDistance=
        Math.abs(
            trackedFace.x-
            rightX
        );


        if(
            leftDistance<=
            rightDistance
        ){

            lockedTargetSide=
            "left";


            targetReason=
            "nearest-left";

        }

        else{

            lockedTargetSide=
            "right";


            targetReason=
            "nearest-right";

        }

    }


    /*
       一旦到這裡：

       lockedTargetSide
       就不會再改。

       除非：
       重新按開始、
       切換模式、
       切換相機。
    */


    stableStartTime=
    null;


    completed=
    false;


    miniComposition.innerText=
    lockedTargetSide===
    "left"
    ?
    "左三分"
    :
    "右三分";


    miniStatus.innerText=
    "● 已鎖定";

}


/* =========================================================
   VIDEO → SCREEN
========================================================= */

function videoPointToScreen(
    x,
    y
){

    const vw=
    video.videoWidth;


    const vh=
    video.videoHeight;


    const sw=
    overlay.clientWidth;


    const sh=
    overlay.clientHeight;


    if(
        !vw ||
        !vh
    ){

        return{
            x:0,
            y:0
        };

    }


    const scale=
    Math.max(

        sw/vw,

        sh/vh

    );


    const renderedW=
    vw*scale;


    const renderedH=
    vh*scale;


    const cropX=
    (
        renderedW-
        sw
    )/2;


    const cropY=
    (
        renderedH-
        sh
    )/2;


    return{

        x:
        x*scale-
        cropX,

        y:
        y*scale-
        cropY

    };

}


/* =========================================================
   PORTRAIT NAVIGATION
========================================================= */

function drawPortraitNavigation(){

    if(
        !trackedFace ||
        !lockedTargetSide
    ){

        return;

    }


    clearOverlay();


    const w=
    overlay.clientWidth;


    const h=
    overlay.clientHeight;


    /*
       V6.3.2：

       這裡不再呼叫
       chooseTargetSide()。

       直接使用鎖定值。
    */

    const side=
    lockedTargetSide;


    /*
       V6.4 TARGET

       三分人像：
       維持 V6.3.2 左 / 右三分鎖定。

       中央人像：
       水平固定中央；
       垂直仍放在約上三分位置，
       讓人物臉部不會落到畫面正中央過低。
    */

    const isCenterPortrait=
    currentComposition==="portraitCenter" ||
    side==="center";


    const targetX=
    isCenterPortrait
    ?
    w/2
    :
    (
        side==="left"
        ?
        w/3
        :
        w*2/3
    );


    const targetY=
    isCenterPortrait
    ?
    h*.34
    :
    h/3;


    /* =====================================================
       GUIDE GRID
    ===================================================== */

    ctx.save();


    ctx.strokeStyle=
    "rgba(255,212,0,.42)";


    ctx.lineWidth=
    1.5;


    ctx.setLineDash(
        [7,7]
    );


    ctx.beginPath();


    if(isCenterPortrait){

        /* 中央人像：中央軸＋眼睛高度參考線 */

        ctx.moveTo(
            w/2,
            0
        );

        ctx.lineTo(
            w/2,
            h
        );


        ctx.moveTo(
            0,
            targetY
        );

        ctx.lineTo(
            w,
            targetY
        );

    }

    else{

        /* 三分人像：保留完整三分格 */

        ctx.moveTo(
            w/3,
            0
        );

        ctx.lineTo(
            w/3,
            h
        );


        ctx.moveTo(
            w*2/3,
            0
        );

        ctx.lineTo(
            w*2/3,
            h
        );


        ctx.moveTo(
            0,
            h/3
        );

        ctx.lineTo(
            w,
            h/3
        );


        ctx.moveTo(
            0,
            h*2/3
        );

        ctx.lineTo(
            w,
            h*2/3
        );

    }


    ctx.stroke();


    ctx.restore();


    /* =====================================================
       DISTANCE
    ===================================================== */

    const dx=
    targetX-
    trackedFace.x;


    const dy=
    targetY-
    trackedFace.y;


    const toleranceX=
    w*.075;


    const toleranceY=
    h*.065;


    const goodX=
    Math.abs(dx)<
    toleranceX;


    const goodY=
    Math.abs(dy)<
    toleranceY;


    const inside=
    goodX &&
    goodY;


    /* =====================================================
       STABILITY TIMER
    ===================================================== */

    const now=
    performance.now();


    let stableElapsed=0;


    if(inside){

        if(
            stableStartTime===
            null
        ){

            stableStartTime=
            now;

        }


        stableElapsed=
        now-
        stableStartTime;


        if(
            stableElapsed>=
            REQUIRED_STABLE_MS
        ){

            completed=
            true;

        }

    }

    else{

        if(!completed){

            stableStartTime=
            null;

            stableElapsed=
            0;

        }


        if(
            completed &&
            (
                Math.abs(dx)>
                toleranceX*
                COMPLETE_RELEASE_MULTIPLIER
                ||
                Math.abs(dy)>
                toleranceY*
                COMPLETE_RELEASE_MULTIPLIER
            )
        ){

            completed=
            false;


            stableStartTime=
            null;


            stableElapsed=
            0;

        }

    }


    /* =====================================================
       GREEN TARGET
    ===================================================== */

    ctx.save();


    ctx.strokeStyle=
    "#2cff67";


    ctx.fillStyle=
    "#2cff67";


    ctx.lineWidth=
    completed
    ?
    5
    :
    4;


    ctx.beginPath();


    ctx.arc(

        targetX,

        targetY,

        completed
        ?
        30
        :
        25,

        0,

        Math.PI*2

    );


    ctx.stroke();


    ctx.beginPath();


    ctx.arc(

        targetX,

        targetY,

        5,

        0,

        Math.PI*2

    );


    ctx.fill();


    ctx.restore();


    /* =====================================================
       FACE BOX
    ===================================================== */

    const boxX=
    trackedFace.x-
    trackedFace.w/2;


    const boxY=
    trackedFace.y-
    trackedFace.h/2;


    ctx.save();


    /*
       黃色 = 人物目前位置

       綠色 = 已經完成

       這樣使用者比較容易分辨
       「人物」和「目標」。
    */

    ctx.strokeStyle=
    completed
    ?
    "#2cff67"
    :
    "#ffd400";


    ctx.lineWidth=
    4;


    ctx.strokeRect(

        boxX,

        boxY,

        trackedFace.w,

        trackedFace.h

    );


    ctx.restore();


    /* =====================================================
       CONNECTION
    ===================================================== */

    if(
        !completed &&
        !inside
    ){

        ctx.save();


        ctx.strokeStyle=
        "#ffd400";


        ctx.lineWidth=
        3;


        ctx.setLineDash(
            [7,6]
        );


        ctx.beginPath();


        ctx.moveTo(

            trackedFace.x,

            trackedFace.y

        );


        ctx.lineTo(

            targetX,

            targetY

        );


        ctx.stroke();


        ctx.restore();

    }


    /* =====================================================
       TARGET LABEL
    ===================================================== */

    ctx.save();


    ctx.font=
    "bold 13px -apple-system,Arial";


    ctx.fillStyle=
    "#2cff67";


    ctx.textAlign=
    "center";


    ctx.fillText(

        isCenterPortrait
        ?
        "中央"
        :
        (
            side==="left"
            ?
            "左三分"
            :
            "右三分"
        ),

        targetX,

        targetY+48

    );


    ctx.restore();


    /* =====================================================
       MINI BAR
    ===================================================== */

    miniMode.innerText=
    "👤 人像";


    miniComposition.innerText=
    isCenterPortrait
    ?
    "中央人像"
    :
    (
        side==="left"
        ?
        "左三分"
        :
        "右三分"
    );


    /* =====================================================
       COMPLETE
    ===================================================== */

    if(completed){

        miniStatus.innerText=
        "● 穩定";


        messageEl.innerText=
        "✓ 構圖完成";


        return;

    }


    /* =====================================================
       COUNTDOWN
    ===================================================== */

    if(inside){

        const stableStep = Math.min(8, Math.max(1, Math.floor((stableElapsed / REQUIRED_STABLE_MS) * 8) + 1));


        miniStatus.innerText=
        "● 穩定中";


        messageEl.innerText=
        "● 正在穩定位置 "+ stableStep + "/8";


        return;

    }


    /* =====================================================
       NAVIGATION
    ===================================================== */

    miniStatus.innerText=
    "● 追蹤中";


    let horizontal="";

    let vertical="";


    if(!goodX){

        if(dx>0){

            horizontal=
            "← 手機向左";

        }

        else{

            horizontal=
            "→ 手機向右";

        }

    }


    if(!goodY){

        if(dy>0){

            vertical=
            "↑ 稍微抬高";

        }

        else{

            vertical=
            "↓ 稍微降低";

        }

    }


    let text="";


    if(
        horizontal &&
        vertical
    ){

        text=
        horizontal+
        "　"+
        vertical;

    }

    else{

        text=
        horizontal ||
        vertical ||
        "保持目前位置";

    }


    messageEl.innerText=
    text;

}


/* =========================================================
   MISSING FACE
========================================================= */

function handleMissingFace(){

    missingFrames++;


    /*
       短暫漏抓：

       保留：
       - 人物位置
       - 左右目標鎖定

       絕對不重新選邊。
    */

    if(
        trackedFace &&
        missingFrames<=
        MAX_MISSING_FRAMES
    ){

        if(!completed){

            stableStartTime=
            null;

        }


        drawPortraitNavigation();


        miniStatus.innerText=
        "● 追蹤保持";


        if(completed){

            messageEl.innerText=
            "✓ 構圖完成";

        }


        return;

    }


    /*
       人臉真的消失：

       V6.3.2 仍然保留
       lockedTargetSide。

       因為這一次構圖目標
       已經決定，不應因漏抓
       就換到另一側。
    */


    trackedFace=
    null;


    stableStartTime=
    null;


    completed=
    false;


    drawPortraitNoFace();


    miniMode.innerText=
    "👤 人像";


    miniComposition.innerText=
    lockedTargetSide
    ?
    (
        lockedTargetSide==="center"
        ?
        "中央人像"
        :
        (
            lockedTargetSide==="left"
            ?
            "左三分"
            :
            "右三分"
        )
    )
    :
    "尋找人物";


    miniStatus.innerText=
    "● 等待";


    messageEl.innerText=
    "👤 暫時找不到人物｜保持人物在畫面中";

}


/* =========================================================
   NO FACE
========================================================= */

function drawPortraitNoFace(){

    clearOverlay();


    const w=
    overlay.clientWidth;


    const h=
    overlay.clientHeight;


    ctx.save();


    ctx.strokeStyle=
    "#2cff67";


    ctx.lineWidth=
    3;


    ctx.setLineDash(
        [8,7]
    );


    /*
       已經鎖定：

       只顯示鎖定的那一側。

       還沒鎖定：

       左右都顯示。
    */


    if(
        lockedTargetSide===
        "left"
    ){

        ctx.beginPath();


        ctx.arc(

            w/3,

            h/3,

            25,

            0,

            Math.PI*2

        );


        ctx.stroke();

    }


    else if(
        lockedTargetSide===
        "center"
    ){

        ctx.beginPath();


        ctx.arc(

            w/2,

            h*.34,

            25,

            0,

            Math.PI*2

        );


        ctx.stroke();

    }


    else if(
        lockedTargetSide===
        "right"
    ){

        ctx.beginPath();


        ctx.arc(

            w*2/3,

            h/3,

            25,

            0,

            Math.PI*2

        );


        ctx.stroke();

    }


    else{

        ctx.beginPath();


        ctx.arc(

            w/3,

            h/3,

            25,

            0,

            Math.PI*2

        );


        ctx.stroke();


        ctx.beginPath();


        ctx.arc(

            w*2/3,

            h/3,

            25,

            0,

            Math.PI*2

        );


        ctx.stroke();

    }


    ctx.restore();

}


/* =========================================================
   BASIC DRAW
========================================================= */

function clearOverlay(){

    ctx.clearRect(

        0,

        0,

        overlay.clientWidth,

        overlay.clientHeight

    );

}


function setup(){

    ctx.strokeStyle=
    "#ffd400";


    ctx.fillStyle=
    "#2cff67";


    ctx.lineWidth=
    2.5;


    ctx.setLineDash([]);

}


function target(x,y){

    ctx.save();


    ctx.strokeStyle=
    "#2cff67";


    ctx.fillStyle=
    "#2cff67";


    ctx.lineWidth=
    3;


    ctx.beginPath();


    ctx.arc(

        x,

        y,

        11,

        0,

        Math.PI*2

    );


    ctx.stroke();


    ctx.beginPath();


    ctx.arc(

        x,

        y,

        4,

        0,

        Math.PI*2

    );


    ctx.fill();


    ctx.restore();

}


/* =========================================================
   THIRDS
========================================================= */

function drawThirds(){

    const w=
    overlay.clientWidth;


    const h=
    overlay.clientHeight;


    setup();


    ctx.beginPath();


    ctx.moveTo(
        w/3,
        0
    );

    ctx.lineTo(
        w/3,
        h
    );


    ctx.moveTo(
        w*2/3,
        0
    );

    ctx.lineTo(
        w*2/3,
        h
    );


    ctx.moveTo(
        0,
        h/3
    );

    ctx.lineTo(
        w,
        h/3
    );


    ctx.moveTo(
        0,
        h*2/3
    );

    ctx.lineTo(
        w,
        h*2/3
    );


    ctx.stroke();


    target(
        w/3,
        h/3
    );


    target(
        w*2/3,
        h/3
    );


    target(
        w/3,
        h*2/3
    );


    target(
        w*2/3,
        h*2/3
    );

}


/* =========================================================
   GOLDEN
========================================================= */

function drawGolden(){

    const w=
    overlay.clientWidth;


    const h=
    overlay.clientHeight;


    setup();


    ctx.beginPath();


    ctx.moveTo(
        w*.382,
        0
    );

    ctx.lineTo(
        w*.382,
        h
    );


    ctx.moveTo(
        w*.618,
        0
    );

    ctx.lineTo(
        w*.618,
        h
    );


    ctx.moveTo(
        0,
        h*.382
    );

    ctx.lineTo(
        w,
        h*.382
    );


    ctx.moveTo(
        0,
        h*.618
    );

    ctx.lineTo(
        w,
        h*.618
    );


    ctx.stroke();

}


/* =========================================================
   CENTER
========================================================= */

function drawCenter(){

    const w=
    overlay.clientWidth;


    const h=
    overlay.clientHeight;


    setup();


    ctx.beginPath();


    ctx.moveTo(
        w/2,
        0
    );

    ctx.lineTo(
        w/2,
        h
    );


    ctx.moveTo(
        0,
        h/2
    );

    ctx.lineTo(
        w,
        h/2
    );


    ctx.stroke();


    target(
        w/2,
        h/2
    );

}


/* =========================================================
   LEADING
========================================================= */

function drawLeading(){

    const w=
    overlay.clientWidth;


    const h=
    overlay.clientHeight;


    setup();


    const vx=
    w*.5;


    const vy=
    h*.4;


    ctx.lineWidth=
    4;


    ctx.beginPath();


    ctx.moveTo(
        w*.08,
        h
    );

    ctx.lineTo(
        vx,
        vy
    );


    ctx.moveTo(
        w*.92,
        h
    );

    ctx.lineTo(
        vx,
        vy
    );


    ctx.stroke();


    target(
        vx,
        vy
    );

}


/* =========================================================
   PERSPECTIVE
========================================================= */

function drawPerspective(){

    const w=
    overlay.clientWidth;


    const h=
    overlay.clientHeight;


    setup();


    const vx=
    w*.5;


    const vy=
    h*.42;


    const starts=[

        [0,h],

        [w*.25,h],

        [w*.75,h],

        [w,h],

        [0,h*.65],

        [w,h*.65]

    ];


    ctx.beginPath();


    starts.forEach(

        p=>{

            ctx.moveTo(
                p[0],
                p[1]
            );


            ctx.lineTo(
                vx,
                vy
            );

        }

    );


    ctx.stroke();


    target(
        vx,
        vy
    );

}


/* =========================================================
   SYMMETRY
========================================================= */

function drawSymmetry(){

    const w=
    overlay.clientWidth;


    const h=
    overlay.clientHeight;


    setup();


    ctx.lineWidth=
    3;


    ctx.beginPath();


    ctx.moveTo(
        w/2,
        0
    );

    ctx.lineTo(
        w/2,
        h
    );


    ctx.stroke();


    ctx.setLineDash(
        [8,8]
    );


    ctx.beginPath();


    ctx.moveTo(
        w*.2,
        h*.2
    );

    ctx.lineTo(
        w*.2,
        h*.8
    );


    ctx.moveTo(
        w*.8,
        h*.2
    );

    ctx.lineTo(
        w*.8,
        h*.8
    );


    ctx.stroke();


    ctx.setLineDash([]);

}


/* =========================================================
   DIAGONAL
========================================================= */

function drawDiagonal(){

    const w=
    overlay.clientWidth;


    const h=
    overlay.clientHeight;


    setup();


    ctx.beginPath();


    ctx.moveTo(
        0,
        h
    );


    ctx.lineTo(
        w,
        0
    );


    ctx.stroke();


    target(
        w*.62,
        h*.38
    );

}


/* =========================================================
   FRAME
========================================================= */

function drawFrame(){

    const w=
    overlay.clientWidth;


    const h=
    overlay.clientHeight;


    setup();


    ctx.strokeRect(

        w*.12,

        h*.13,

        w*.76,

        h*.74

    );


    target(
        w/2,
        h/2
    );

}


/* =========================================================
   PORTRAIT TEMPLATES
========================================================= */

function drawPortraitThirds(){

    drawThirds();

}


function drawPortraitCenter(){

    drawCenter();

}


function drawFullBody(){

    const w=
    overlay.clientWidth;


    const h=
    overlay.clientHeight;


    setup();


    ctx.strokeStyle=
    "#2cff67";


    ctx.strokeRect(

        w*.36,

        h*.10,

        w*.28,

        h*.80

    );

}


/* =========================================================
   CIRCLE
========================================================= */

function drawCircle(){

    const w=
    overlay.clientWidth;


    const h=
    overlay.clientHeight;


    setup();


    ctx.strokeStyle=
    "#2cff67";


    ctx.lineWidth=
    3;


    ctx.beginPath();


    ctx.arc(

        w*.5,

        h*.5,

        Math.min(
            w,
            h
        )*.23,

        0,

        Math.PI*2

    );


    ctx.stroke();


    target(
        w*.5,
        h*.5
    );

}


/* =========================================================
   FILL
========================================================= */

function drawFill(){

    const w=
    overlay.clientWidth;


    const h=
    overlay.clientHeight;


    setup();


    ctx.strokeStyle=
    "#2cff67";


    ctx.lineWidth=
    4;


    ctx.strokeRect(

        w*.06,

        h*.06,

        w*.88,

        h*.88

    );

}


/* =========================================================
   DRAW ROUTER
========================================================= */

function drawComposition(){

    if(portraitNavigation){
        return;
    }


    clearOverlay();


    switch(
        currentComposition
    ){


        case "thirds":
        case "macroThirds":
        case "petThirds":
        case "productThirds":
        case "foodThirds":

            drawThirds();
            break;


        case "golden":

            drawGolden();
            break;


        case "leading":

            drawLeading();
            break;


        case "center":
        case "macroCenter":
        case "petCenter":
        case "productCenter":

            drawCenter();
            break;


        case "frame":

            drawFrame();
            break;


        case "perspective":

            drawPerspective();
            break;


        case "symmetry":

            drawSymmetry();
            break;


        case "diagonal":
        case "foodDiagonal":
        case "product45":

            drawDiagonal();
            break;


        case "portraitThirds":
        case "environment":
        case "lookSpace":

            drawPortraitThirds();
            break;


        case "portraitCenter":

            drawPortraitCenter();
            break;


        case "fullbody":
        case "petFull":
        case "petAction":
        case "petLook":

            drawFullBody();
            break;


        case "reflection":

            drawCenter();
            break;


        case "foodCenter":
        case "foodTop":

            drawCircle();
            break;


        case "fill":

            drawFill();
            break;


        case "negative":

            drawThirds();
            break;

    }

}


/* =========================================================
   RESIZE
========================================================= */

function resizeOverlay(){

    const rect=
    overlay.getBoundingClientRect();


    const dpr=
    window.devicePixelRatio ||
    1;


    overlay.width=
    Math.round(
        rect.width*dpr
    );


    overlay.height=
    Math.round(
        rect.height*dpr
    );


    ctx.setTransform(

        dpr,

        0,

        0,

        dpr,

        0,

        0

    );


    drawComposition();

}


window.addEventListener(
    "resize",
    resizeOverlay
);


/* =========================================================
   ZOOM
========================================================= */

zoom.addEventListener(

    "input",

    async function(){

        const value=
        Number(
            this.value
        );


        zoomText.innerText=
        value.toFixed(1)+
        "×";


        if(!stream){
            return;
        }


        const tracks=
        stream.getVideoTracks();


        if(!tracks.length){
            return;
        }


        const track=
        tracks[0];


        if(
            !track.getCapabilities
        ){

            return;

        }


        const caps=
        track.getCapabilities();


        if(!caps.zoom){
            return;
        }


        try{

            const z=
            Math.max(

                caps.zoom.min,

                Math.min(

                    caps.zoom.max,

                    value

                )

            );


            await track
            .applyConstraints({

                advanced:[
                    {
                        zoom:z
                    }
                ]

            });

        }

        catch(error){

            console.log(
                "Zoom",
                error
            );

        }

    }

);


/* =========================================================
   EXPOSE
========================================================= */

window.selectMode=
selectMode;


window.changeCamera=
changeCamera;


window.runComposition=
runComposition;


/* =========================================================
   INIT
========================================================= */

resizeOverlay();

startCamera();

</script>
