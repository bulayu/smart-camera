<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   user-scalable=no">

    <title>阿策智慧構圖助手 V2.2</title>

    <style>

        body {
            margin: 0;
            background: black;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        h2 {
            margin: 10px 0;
        }

        #status {
            font-size: 16px;
            margin: 6px;
        }

        #faceInfo {
            font-size: 17px;
            margin: 6px;
        }

        #guideInfo {
            font-size: 26px;
            font-weight: bold;
            margin: 8px;
            min-height: 36px;
        }

        #scoreInfo {
            font-size: 22px;
            margin: 8px;
            min-height: 30px;
        }

        #cameraBox {
            position: relative;
            width: 100%;
            max-width: 900px;
            margin: auto;
            background: #111;
            overflow: hidden;
        }

        #camera {
            width: 100%;
            display: block;
        }

        #overlay {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .vline {
            position: absolute;
            top: 0;
            height: 100%;
            width: 2px;
            background: rgba(255,255,255,0.75);
            pointer-events: none;
        }

        .v1 {
            left: 33.33%;
        }

        .v2 {
            left: 66.66%;
        }

        .hline {
            position: absolute;
            left: 0;
            width: 100%;
            height: 2px;
            background: rgba(255,255,255,0.75);
            pointer-events: none;
        }

        .h1 {
            top: 33.33%;
        }

        .h2 {
            top: 66.66%;
        }

        button {
            font-size: 18px;
            padding: 12px 18px;
            margin: 10px 4px;
            border: none;
            border-radius: 10px;
        }

    </style>
</head>


<body>

<h2>📷 阿策智慧構圖助手 V2.2</h2>

<div id="status">
    AI 模型載入中...
</div>

<div id="faceInfo">
    尚未偵測
</div>

<div id="guideInfo">
</div>

<div id="scoreInfo">
</div>


<div id="cameraBox">

    <video id="camera"
           autoplay
           playsinline
           muted>
    </video>

    <canvas id="overlay"></canvas>

    <div class="vline v1"></div>
    <div class="vline v2"></div>

    <div class="hline h1"></div>
    <div class="hline h2"></div>

</div>


<button onclick="startCamera()">
    開啟前鏡頭
</button>

<button onclick="stopCamera()">
    關閉相機
</button>


<script type="module">

import {
    FaceDetector,
    FilesetResolver
}
from "https://unpkg.com/@mediapipe/tasks-vision@0.10.35/vision_bundle.mjs";


let detector = null;

let stream = null;

let cameraRunning = false;

let lastVideoTime = -1;

let smoothScore = 0;

let okCounter = 0;


const video =
    document.getElementById("camera");

const canvas =
    document.getElementById("overlay");

const ctx =
    canvas.getContext("2d");

const statusText =
    document.getElementById("status");

const faceInfo =
    document.getElementById("faceInfo");

const guideInfo =
    document.getElementById("guideInfo");

const scoreInfo =
    document.getElementById("scoreInfo");


/* =========================
   載入 AI
========================= */

async function loadAI() {

    try {

        statusText.innerText =
            "正在載入 MediaPipe...";


        const resolver =
            await FilesetResolver.forVisionTasks(
                "https://unpkg.com/@mediapipe/tasks-vision@0.10.35/wasm"
            );


        statusText.innerText =
            "正在載入人臉模型...";


        detector =
            await FaceDetector.createFromOptions(
                resolver,
                {
                    baseOptions: {
                        modelAssetPath:
                        "https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite"
                    },

                    runningMode:
                        "VIDEO",

                    minDetectionConfidence:
                        0.4
                }
            );


        statusText.innerText =
            "✅ AI 已準備完成";

    }

    catch(error) {

        statusText.innerText =
            "❌ AI 模型載入失敗";

        faceInfo.innerText =
            error.name +
            "：" +
            error.message;

    }

}


/* =========================
   開啟相機
========================= */

async function startCamera() {

    if (detector == null) {

        alert(
            "AI 還沒準備完成，請稍等一下"
        );

        return;

    }


    try {

        if (stream) {

            stream
                .getTracks()
                .forEach(
                    track => track.stop()
                );

        }


        stream =
            await navigator.mediaDevices
                .getUserMedia({

                    video: {
                        facingMode:
                            "user"
                    },

                    audio:
                        false

                });


        video.srcObject =
            stream;


        await video.play();


        cameraRunning =
            true;


        lastVideoTime =
            -1;


        smoothScore =
            0;


        okCounter =
            0;


        statusText.innerText =
            "📷 相機已開啟";


        requestAnimationFrame(
            detectLoop
        );

    }

    catch(error) {

        statusText.innerText =
            "❌ 相機開啟失敗";

        faceInfo.innerText =
            error.name +
            "：" +
            error.message;

    }

}


/* =========================
   關閉相機
========================= */

function stopCamera() {

    cameraRunning =
        false;


    if (stream) {

        stream
            .getTracks()
            .forEach(
                track => track.stop()
            );

        stream =
            null;

    }


    video.srcObject =
        null;


    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    statusText.innerText =
        "相機已關閉";


    faceInfo.innerText =
        "尚未偵測";


    guideInfo.innerText =
        "";


    scoreInfo.innerText =
        "";


    okCounter =
        0;

}


/* =========================
   AI 偵測循環
========================= */

function detectLoop() {

    if (!cameraRunning) {
        return;
    }


    if (
        video.readyState >= 2 &&
        video.videoWidth > 0 &&
        video.videoHeight > 0
    ) {

        if (
            video.currentTime !==
            lastVideoTime
        ) {

            lastVideoTime =
                video.currentTime;


            try {

                const result =
                    detector.detectForVideo(
                        video,
                        performance.now()
                    );


                drawResult(
                    result
                );

            }

            catch(error) {

                faceInfo.innerText =
                    "偵測錯誤：" +
                    error.message;

            }

        }

    }


    requestAnimationFrame(
        detectLoop
    );

}


/* =========================
   距離計算
========================= */

function getDistance(
    x1,
    y1,
    x2,
    y2
) {

    const dx =
        x2 - x1;

    const dy =
        y2 - y1;


    return Math.sqrt(
        dx * dx +
        dy * dy
    );

}


/* =========================
   畫面處理
========================= */

function drawResult(result) {

    const displayWidth =
        video.clientWidth;

    const displayHeight =
        video.clientHeight;


    if (
        canvas.width !==
        displayWidth
    ) {

        canvas.width =
            displayWidth;

    }


    if (
        canvas.height !==
        displayHeight
    ) {

        canvas.height =
            displayHeight;

    }


    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    const scaleX =
        displayWidth /
        video.videoWidth;


    const scaleY =
        displayHeight /
        video.videoHeight;


    /* =========================
       三分點
    ========================= */

    const x1 =
        displayWidth / 3;

    const x2 =
        displayWidth * 2 / 3;

    const y1 =
        displayHeight / 3;

    const y2 =
        displayHeight * 2 / 3;


    const targetPoints = [

        {x: x1, y: y1},

        {x: x2, y: y1},

        {x: x1, y: y2},

        {x: x2, y: y2}

    ];


    for (
        const point
        of targetPoints
    ) {

        ctx.beginPath();

        ctx.arc(
            point.x,
            point.y,
            8,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            "deepskyblue";

        ctx.fill();

    }


    /* =========================
       沒有偵測結果
    ========================= */

    if (
        !result.detections ||
        result.detections.length === 0
    ) {

        faceInfo.innerText =
            "找不到人臉";

        guideInfo.innerText =
            "";

        scoreInfo.innerText =
            "";

        okCounter =
            0;

        return;

    }


    /* =========================
       整理有效人臉
    ========================= */

    const validFaces =
        [];


    for (
        const detection
        of result.detections
    ) {

        const box =
            detection.boundingBox;


        const x =
            box.originX *
            scaleX;


        const y =
            box.originY *
            scaleY;


        const w =
            box.width *
            scaleX;


        const h =
            box.height *
            scaleY;


        /*
        過小人臉過濾：
        人臉寬度小於畫面 8%
        或高度小於畫面 8%
        就先忽略
        */

        if (
            w <
            displayWidth * 0.08
            ||
            h <
            displayHeight * 0.08
        ) {

            continue;

        }


        validFaces.push({
            detection: detection,
            x: x,
            y: y,
            w: w,
            h: h,
            area: w * h
        });

    }


    /* =========================
       過濾後沒有有效人臉
    ========================= */

    if (
        validFaces.length === 0
    ) {

        faceInfo.innerText =
            "找不到有效人臉";

        guideInfo.innerText =
            "";

        scoreInfo.innerText =
            "";

        okCounter =
            0;

        return;

    }


    faceInfo.innerText =
        "找到人臉：" +
        validFaces.length +
        " 張";


    /* =========================
       找最大張臉
    ========================= */

    let mainFace =
        validFaces[0];


    for (
        const face
        of validFaces
    ) {

        if (
            face.area >
            mainFace.area
        ) {

            mainFace =
                face;

        }

    }


    /* =========================
       所有人臉都畫綠框
    ========================= */

    for (
        const face
        of validFaces
    ) {

        ctx.strokeStyle =
            "lime";


        ctx.lineWidth =
            3;


        ctx.strokeRect(
            face.x,
            face.y,
            face.w,
            face.h
        );

    }


    /* =========================
       主要人物中心
    ========================= */

    const centerX =
        mainFace.x +
        mainFace.w / 2;


    const centerY =
        mainFace.y +
        mainFace.h / 2;


    /* 主要人物框加粗 */

    ctx.strokeStyle =
        "yellow";


    ctx.lineWidth =
        5;


    ctx.strokeRect(
        mainFace.x,
        mainFace.y,
        mainFace.w,
        mainFace.h
    );


    /* 紅色中心點 */

    ctx.beginPath();


    ctx.arc(
        centerX,
        centerY,
        8,
        0,
        Math.PI * 2
    );


    ctx.fillStyle =
        "red";


    ctx.fill();


    /* =========================
       找最近三分點
    ========================= */

    let nearestPoint =
        targetPoints[0];


    let nearestDistance =
        getDistance(
            centerX,
            centerY,
            nearestPoint.x,
            nearestPoint.y
        );


    for (
        const point
        of targetPoints
    ) {

        const distance =
            getDistance(
                centerX,
                centerY,
                point.x,
                point.y
            );


        if (
            distance <
            nearestDistance
        ) {

            nearestDistance =
                distance;


            nearestPoint =
                point;

        }

    }


    /* =========================
       舒適判定範圍
    ========================= */

    const okDistance =
        Math.min(
            displayWidth,
            displayHeight
        ) * 0.18;


    const nearDistance =
        Math.min(
            displayWidth,
            displayHeight
        ) * 0.28;


    /* =========================
       畫 OK 圈
    ========================= */

    ctx.beginPath();

    ctx.arc(
        nearestPoint.x,
        nearestPoint.y,
        okDistance,
        0,
        Math.PI * 2
    );

    ctx.strokeStyle =
        "rgba(0,255,255,0.6)";

    ctx.lineWidth =
        3;

    ctx.stroke();


    /* =========================
       黃色引導線
    ========================= */

    ctx.beginPath();

    ctx.moveTo(
        centerX,
        centerY
    );

    ctx.lineTo(
        nearestPoint.x,
        nearestPoint.y
    );

    ctx.strokeStyle =
        "yellow";

    ctx.lineWidth =
        3;

    ctx.stroke();


    /* =========================
       方向判定
    ========================= */

    const dx =
        nearestPoint.x -
        centerX;


    const dy =
        nearestPoint.y -
        centerY;


    const directionToleranceX =
        displayWidth *
        0.10;


    const directionToleranceY =
        displayHeight *
        0.10;


    let horizontal =
        "";


    let vertical =
        "";


    if (
        Math.abs(dx) >
        directionToleranceX
    ) {

        horizontal =
            dx > 0
            ? "往右"
            : "往左";

    }


    if (
        Math.abs(dy) >
        directionToleranceY
    ) {

        vertical =
            dy > 0
            ? "往下"
            : "往上";

    }


    /* =========================
       分數計算
    ========================= */

    const maxDistance =
        Math.sqrt(
            displayWidth *
            displayWidth +
            displayHeight *
            displayHeight
        ) *
        0.45;


    let rawScore =
        100 -
        (
            nearestDistance /
            maxDistance
        ) *
        100;


    if (
        rawScore < 0
    ) {

        rawScore =
            0;

    }


    if (
        rawScore > 100
    ) {

        rawScore =
            100;

    }


    if (
        smoothScore === 0
    ) {

        smoothScore =
            rawScore;

    }

    else {

        smoothScore =
            smoothScore * 0.85 +
            rawScore * 0.15;

    }


    const finalScore =
        Math.round(
            smoothScore
        );


    /* =========================
       OK 緩衝
    ========================= */

    if (
        nearestDistance <=
        okDistance
    ) {

        okCounter++;

    }

    else {

        okCounter =
            Math.max(
                0,
                okCounter - 1
            );

    }


    /* =========================
       顯示提示
    ========================= */

    if (
        okCounter >= 4
    ) {

        guideInfo.innerText =
            "✅ 構圖 OK";

    }

    else if (
        nearestDistance <=
        nearDistance
    ) {

        guideInfo.innerText =
            "👍 快到了";

    }

    else {

        let message =
            "";


        if (
            horizontal !== ""
        ) {

            message +=
                horizontal;

        }


        if (
            vertical !== ""
        ) {

            if (
                message !== ""
            ) {

                message +=
                    "、";

            }


            message +=
                vertical;

        }


        if (
            message === ""
        ) {

            guideInfo.innerText =
                "👍 快到了";

        }

        else {

            guideInfo.innerText =
                "建議：" +
                message;

        }

    }


    scoreInfo.innerText =
        "構圖分數：" +
        finalScore +
        " 分";

}


/* =========================
   HTML 按鈕
========================= */

window.startCamera =
    startCamera;


window.stopCamera =
    stopCamera;


/* =========================
   啟動
========================= */

loadAI();

</script>

</body>

</html>
