<script>

/* =========================================================

 AI 構圖助手 V5.8.8

 道路底部入口鎖定版


 V5.8.6 問題：

 中段樹枝
 灌木
 樹幹斜線

 都可能直接成為道路候選。


 V5.8.8：

 ① Sobel 邊緣

 ② 只在畫面底部尋找道路種子

 ③ 左種子必須向右上延伸
    右種子必須向左上延伸

 ④ 從種子開始往上追蹤

 ⑤ 每一層只接受：
    - 距離預測位置近
    - 方向相近
    - 有足夠邊緣強度

 ⑥ 形成道路點群

 ⑦ Robust regression 擬合左右邊界

 ⑧ 左右擬合線交會 = VP


 DEBUG：

 白點 = 實際道路追蹤證據
 黃線 = 擬合道路邊界
 綠點 = VP

========================================================= */


/* =========================================================
 DOM
========================================================= */

var video =
document.getElementById("video");

var overlay =
document.getElementById("overlay");

var ctx =
overlay.getContext("2d");

var analysisCanvas =
document.getElementById("analysisCanvas");

var ax =
analysisCanvas.getContext(
    "2d",
    {willReadFrequently:true}
);

var scoreEl =
document.getElementById("score");

var compositionEl =
document.getElementById("composition");

var descEl =
document.getElementById("desc");

var messageEl =
document.getElementById("message");

var zoom =
document.getElementById("zoom");

var zoomText =
document.getElementById("zoomText");

var debugEl =
document.getElementById("debug");


/* =========================================================
 STATE
========================================================= */

var stream = null;

var facing =
"environment";

var analyzing =
false;

var detectedPoint =
null;

var debugResult =
null;


/* =========================================================
 ANALYSIS SIZE
========================================================= */

var AW = 240;
var AH = 180;


/* =========================================================
 UTIL
========================================================= */

function clamp(v,min,max){

    return Math.max(
        min,
        Math.min(max,v)
    );

}


function median(arr){

    if(
        !arr ||
        arr.length===0
    ){
        return 0;
    }

    var a =
    arr.slice().sort(
        function(x,y){
            return x-y;
        }
    );

    var m =
    Math.floor(
        a.length/2
    );

    if(a.length%2){
        return a[m];
    }

    return(
        a[m-1]+a[m]
    )/2;

}


function angleDifference(a,b){

    var d =
    Math.abs(a-b);

    while(d>Math.PI){
        d-=Math.PI;
    }

    if(d>Math.PI/2){
        d=Math.PI-d;
    }

    return Math.abs(d);

}


/* =========================================================
 CAMERA
========================================================= */

async function startCamera(){

    try{

        messageEl.innerText =
        "📷 正在開啟相機...";


        if(stream){

            stream
            .getTracks()
            .forEach(
                function(track){
                    track.stop();
                }
            );

        }


        stream = null;


        if(
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia
        ){

            throw new Error(
                "getUserMedia 不支援"
            );

        }


        stream =
        await navigator.mediaDevices
        .getUserMedia({

            video:{

                facingMode:{
                    ideal:facing
                },

                width:{
                    ideal:1280
                },

                height:{
                    ideal:720
                }

            },

            audio:false

        });


        video.srcObject =
        stream;


        await video.play();


        resizeOverlay();

        resetAnalysis();

    }
    catch(error){

        console.log(
            "Camera error:",
            error
        );


        var name =
        error && error.name
        ?
        error.name
        :
        "UnknownError";


        compositionEl.innerText =
        "相機無法開啟";


        if(
            name==="NotAllowedError"
        ){

            descEl.innerText =
            "相機權限被拒絕";

            messageEl.innerText =
            "❌ NotAllowedError｜請允許網站使用相機";

        }

        else if(
            name==="NotFoundError"
        ){

            descEl.innerText =
            "找不到可用相機";

            messageEl.innerText =
            "❌ NotFoundError｜找不到鏡頭";

        }

        else if(
            name==="NotReadableError"
        ){

            descEl.innerText =
            "相機可能被其他程式占用";

            messageEl.innerText =
            "❌ NotReadableError｜相機無法讀取";

        }

        else{

            descEl.innerText =
            name;

            messageEl.innerText =
            "❌ 相機錯誤："+name;

        }

    }

}


async function changeCamera(mode){

    facing =
    mode;

    await startCamera();

}


/* =========================================================
 RESET
========================================================= */

function resetAnalysis(){

    analyzing =
    false;

    detectedPoint =
    null;

    debugResult =
    null;


    scoreEl.innerHTML =
    '-- <small>%</small>';


    compositionEl.innerText =
    "等待分析";


    descEl.innerText =
    "先鎖定道路底部入口，再向上追蹤";


    messageEl.innerText =
    "✨ 固定鏡頭後，按 AI 自動分析";


    debugEl.innerText =
    "L:--｜R:--";

}


/* =========================================================
 RUN AI
========================================================= */

function runAI(){

    if(analyzing){
        return;
    }


    if(video.readyState<2){

        messageEl.innerText =
        "⏳ 鏡頭還沒準備完成";

        return;

    }


    analyzing =
    true;

    detectedPoint =
    null;

    debugResult =
    null;


    scoreEl.innerHTML =
    '-- <small>%</small>';


    compositionEl.innerText =
    "追蹤道路邊界";


    descEl.innerText =
    "從畫面底部向遠方追蹤";


    messageEl.innerText =
    "🔍 鎖定道路底部左右入口...";


    var results = [];

    var frame = 0;


    var timer =
    setInterval(
        function(){

            var r =
            analyzeRoad();

            if(r){
                results.push(r);
            }

            frame++;


            if(frame>=7){

                clearInterval(timer);

                analyzing =
                false;

                finishAnalysis(
                    results
                );

            }

        },
        170
    );

}


/* =========================================================
 FINISH
========================================================= */

function finishAnalysis(results){

    if(results.length<3){

        failAnalysis(
            "找不到穩定的左右道路"
        );

        return;

    }


    var mx =
    median(
        results.map(
            function(r){
                return r.vx;
            }
        )
    );


    var my =
    median(
        results.map(
            function(r){
                return r.vy;
            }
        )
    );


    var distances =
    results.map(
        function(r){

            return Math.hypot(
                r.vx-mx,
                r.vy-my
            );

        }
    );


    var md =
    median(distances);


    var limit =
    Math.max(
        .035,
        md*2.0
    );


    var filtered =
    results.filter(
        function(r){

            return(
                Math.hypot(
                    r.vx-mx,
                    r.vy-my
                )
                <=limit
            );

        }
    );


    if(filtered.length<3){

        failAnalysis(
            "道路交點不穩定"
        );

        return;

    }


    mx =
    median(
        filtered.map(
            function(r){
                return r.vx;
            }
        )
    );


    my =
    median(
        filtered.map(
            function(r){
                return r.vy;
            }
        )
    );


    /*
    找最接近多幀中位數的一幀
    當 DEBUG 顯示。
    */

    var best =
    filtered[0];

    var bestD =
    999;


    for(
        var i=0;
        i<filtered.length;
        i++
    ){

        var d =
        Math.hypot(
            filtered[i].vx-mx,
            filtered[i].vy-my
        );


        if(d<bestD){

            bestD =
            d;

            best =
            filtered[i];

        }

    }


    detectedPoint = {

        vx:mx,
        vy:my

    };


    debugResult = {

        leftPoints:
        best.leftPoints,

        rightPoints:
        best.rightPoints,

        leftLine:
        best.leftLine,

        rightLine:
        best.rightLine,

        leftSeed:
        best.leftSeed,

        rightSeed:
        best.rightSeed

    };


    var spread =
    median(
        filtered.map(
            function(r){

                return Math.hypot(
                    r.vx-mx,
                    r.vy-my
                );

            }
        )
    );


    var stability =
    clamp(
        1-spread/.09,
        0,
        1
    );


    var base =
    median(
        filtered.map(
            function(r){
                return r.confidence;
            }
        )
    );


    var confidence =
    Math.round(
        clamp(
            (
                base*.72+
                stability*.28
            )*100,
            0,
            90
        )
    );


    scoreEl.innerHTML =
    confidence+
    ' <small>%</small>';


    compositionEl.innerText =
    "◎ 道路單點透視";


    descEl.innerText =
    "藍點＝底部入口｜白點＝追蹤證據｜黃線＝驗證邊界";


    messageEl.innerText =
    "🔎 檢查藍點是否落在道路底部左右入口";


    debugEl.innerText =
    "L:"+
    best.leftPoints.length+
    "｜R:"+
    best.rightPoints.length;

}


/* =========================================================
 FAIL
========================================================= */

function failAnalysis(reason){

    detectedPoint =
    null;

    debugResult =
    null;


    scoreEl.innerHTML =
    '-- <small>%</small>';


    compositionEl.innerText =
    "道路追蹤不足";


    descEl.innerText =
    reason;


    messageEl.innerText =
    "📱 調整畫面後重新分析";


    debugEl.innerText =
    "L:0｜R:0";

}


/* =========================================================
 EDGE MAP
========================================================= */

function buildEdges(){

    ax.drawImage(
        video,
        0,
        0,
        AW,
        AH
    );


    var image =
    ax.getImageData(
        0,
        0,
        AW,
        AH
    );


    var data =
    image.data;


    var gray =
    new Float32Array(
        AW*AH
    );


    for(
        var i=0;
        i<AW*AH;
        i++
    ){

        var p =
        i*4;


        gray[i] =
        data[p]*.299+
        data[p+1]*.587+
        data[p+2]*.114;

    }


    /*
    輕度平滑。

    主要壓制：
    葉子
    草
    磁磚細紋
    */

    var smooth =
    new Float32Array(
        AW*AH
    );


    for(
        var y=2;
        y<AH-2;
        y++
    ){

        for(
            var x=2;
            x<AW-2;
            x++
        ){

            var id =
            y*AW+x;


            smooth[id] =
            (
                gray[id]*4+
                gray[id-1]+
                gray[id+1]+
                gray[id-AW]+
                gray[id+AW]
            )/8;

        }

    }


    var magnitude =
    new Float32Array(
        AW*AH
    );


    var angle =
    new Float32Array(
        AW*AH
    );


    var values = [];


    for(
        var yy=2;
        yy<AH-2;
        yy++
    ){

        for(
            var xx=2;
            xx<AW-2;
            xx++
        ){

            var id2 =
            yy*AW+xx;


            var gx =

            -smooth[id2-AW-1]
            +
            smooth[id2-AW+1]

            -

            2*smooth[id2-1]
            +
            2*smooth[id2+1]

            -

            smooth[id2+AW-1]
            +
            smooth[id2+AW+1];


            var gy =

            -smooth[id2-AW-1]
            -
            2*smooth[id2-AW]
            -
            smooth[id2-AW+1]

            +

            smooth[id2+AW-1]
            +
            2*smooth[id2+AW]
            +
            smooth[id2+AW+1];


            var mag =
            Math.hypot(
                gx,
                gy
            );


            magnitude[id2] =
            mag;


            var a =
            Math.atan2(
                gy,
                gx
            )
            +
            Math.PI/2;


            while(
                a>Math.PI/2
            ){
                a-=Math.PI;
            }


            while(
                a<-Math.PI/2
            ){
                a+=Math.PI;
            }


            angle[id2] =
            a;


            values.push(mag);

        }

    }


    if(values.length===0){
        return null;
    }


    values.sort(
        function(a,b){
            return a-b;
        }
    );


    var threshold =
    values[
        Math.floor(
            values.length*.895
        )
    ];


    if(
        !threshold ||
        threshold<12
    ){
        return null;
    }


    return{

        magnitude:
        magnitude,

        angle:
        angle,

        threshold:
        threshold

    };

}


/* =========================================================
 LINE PROJECTION
========================================================= */

function projectXAtY(
    x,
    y,
    angle,
    targetY
){

    var dx =
    Math.cos(angle);

    var dy =
    Math.sin(angle);


    if(
        Math.abs(dy)<.05
    ){
        return null;
    }


    var t =
    (targetY-y)/dy;


    return(
        x+dx*t
    );

}


/* =========================================================
 FIND BOTTOM SEEDS

 最重要的 V5.8.8 改動。

 道路線不能從樹冠開始。

 種子只能出現在：
 AH * 0.65 ~ AH * 0.96

 左種子：
 來源位於左側，
 往上必須向右收。

 右種子：
 來源位於右側，
 往上必須向左收。
========================================================= */

function findSeeds(
    magnitude,
    angle,
    threshold
){

    var left = [];

    var right = [];


    var startY =
    Math.floor(
        AH*.70
    );


    var endY =
    Math.floor(
        AH*.96
    );


    var center =
    AW*.50;


    for(
        var y=startY;
        y<=endY;
        y+=3
    ){

        for(
            var x=4;
            x<AW-4;
            x+=3
        ){

            var id =
            y*AW+x;


            if(
                magnitude[id]
                <
                threshold*.90
            ){
                continue;
            }


            var a =
            angle[id];


            var absA =
            Math.abs(a);


            /*
            排除：

            太水平的磁磚橫線
            太垂直的柱子/樹幹
            */

            if(
                absA<.18 ||
                absA>1.36
            ){
                continue;
            }


            /*
            投影到畫面較上方，
            看是不是往中心收。
            */

            var targetY =
            AH*.40;


            var px =
            projectXAtY(
                x,
                y,
                a,
                targetY
            );


            if(
                px===null ||
                !isFinite(px)
            ){
                continue;
            }


            /*
            左道路種子
            */

            if(
                x<
                center-AW*.055
            ){

                if(
                    px>
                    x+AW*.025
                    &&
                    px<
                    AW*.75
                ){

                    left.push({

                        x:x,
                        y:y,
                        angle:a,

                        mag:
                        magnitude[id],

                        projectedX:
                        px

                    });

                }

            }


            /*
            右道路種子
            */

            else if(
                x>
                center+AW*.055
            ){

                if(
                    px<
                    x-AW*.025
                    &&
                    px>
                    AW*.25
                ){

                    right.push({

                        x:x,
                        y:y,
                        angle:a,

                        mag:
                        magnitude[id],

                        projectedX:
                        px

                    });

                }

            }

        }

    }


    return{

        left:
        selectSeeds(
            left,
            "left"
        ),

        right:
        selectSeeds(
            right,
            "right"
        )

    };

}


/* =========================================================
 SEED SELECTION

 不只是找最亮。

 優先：
 1. 來源低
 2. 來源離中央適中
 3. 投影後往中心
 4. 不在極端畫面邊緣
========================================================= */

function selectSeeds(
    seeds,
    side
){

    if(seeds.length===0){
        return [];
    }


    var center =
    AW*.50;


    for(
        var i=0;
        i<seeds.length;
        i++
    ){

        var S =
        seeds[i];


        var depth =
        clamp(
            (
                S.y-
                AH*.62
            )
            /
            (
                AH*.34
            ),
            0,
            1
        );


        var sourceDistance =
        Math.abs(
            S.x-center
        );


        /*
        道路邊界通常不是：
        正中央，也不是畫面最外側。
        */

        var positionScore =
        1-
        clamp(
            Math.abs(
                sourceDistance-
                AW*.27
            )
            /
            (AW*.30),
            0,
            1
        );


        var convergence =
        Math.abs(
            S.projectedX-
            S.x
        );


        var convergenceScore =
        clamp(
            convergence/
            (AW*.22),
            .15,
            1
        );


        S.score =
        (
            .45+
            depth*.55
        )
        *
        (
            .45+
            positionScore*.55
        )
        *
        (
            .55+
            convergenceScore*.45
        );

    }


    seeds.sort(
        function(a,b){
            return b.score-a.score;
        }
    );


    /*
    避免同一條粗邊緣
    產生一大堆重複種子。
    */

    var selected = [];


    for(
        var j=0;
        j<seeds.length;
        j++
    ){

        var S2 =
        seeds[j];


        var tooClose =
        false;


        for(
            var k=0;
            k<selected.length;
            k++
        ){

            var D =
            selected[k];


            if(
                Math.hypot(
                    S2.x-D.x,
                    S2.y-D.y
                )
                <
                12
                &&
                angleDifference(
                    S2.angle,
                    D.angle
                )
                <
                .16
            ){

                tooClose =
                true;

                break;

            }

        }


        if(tooClose){
            continue;
        }


        selected.push(S2);


        /*
        每側最多測 8 個種子
        */

        if(
            selected.length>=8
        ){
            break;
        }

    }


    return selected;

}


/* =========================================================
 FIND EDGE NEAR PREDICTION

 在某一個 y 層附近，
 尋找最符合預測道路位置的邊緣。
========================================================= */

function findEdgeNear(
    targetX,
    targetY,
    expectedAngle,
    side,
    magnitude,
    edgeAngle,
    threshold,
    radius
){

    var best =
    null;


    var minX =
    Math.max(
        2,
        Math.floor(
            targetX-radius
        )
    );


    var maxX =
    Math.min(
        AW-3,
        Math.ceil(
            targetX+radius
        )
    );


    var minY =
    Math.max(
        2,
        Math.floor(
            targetY-2
        )
    );


    var maxY =
    Math.min(
        AH-3,
        Math.ceil(
            targetY+2
        )
    );


    for(
        var y=minY;
        y<=maxY;
        y++
    ){

        for(
            var x=minX;
            x<=maxX;
            x++
        ){

            var id =
            y*AW+x;


            var mag =
            magnitude[id];


            if(
                mag<
                threshold*.58
            ){
                continue;
            }


            var a =
            edgeAngle[id];


            var absA =
            Math.abs(a);


            if(
                absA<.13 ||
                absA>1.42
            ){
                continue;
            }


            /*
            與目前道路方向不能差太多。
            */

            var ad =
            angleDifference(
                a,
                expectedAngle
            );


            if(
                ad>.30
            ){
                continue;
            }


            /*
            再確認方向確實往中心。
            */

            var upperX =
            projectXAtY(
                x,
                y,
                a,
                Math.max(
                    AH*.32,
                    y-25
                )
            );


            if(
                upperX===null ||
                !isFinite(upperX)
            ){
                continue;
            }


            if(
                side==="left"
            ){

                if(
                    upperX<=x
                ){
                    continue;
                }

            }
            else{

                if(
                    upperX>=x
                ){
                    continue;
                }

            }


            var distance =
            Math.abs(
                x-targetX
            );


            var distanceScore =
            1-
            clamp(
                distance/
                radius,
                0,
                1
            );


            var angleScore =
            1-
            clamp(
                ad/.30,
                0,
                1
            );


            var magScore =
            clamp(
                mag/
                (threshold*2.2),
                .2,
                1
            );


            var score =

            distanceScore*.48

            +

            angleScore*.32

            +

            magScore*.20;


            if(
                !best ||
                score>best.score
            ){

                best = {

                    x:x,
                    y:y,
                    angle:a,
                    score:score,
                    mag:mag

                };

            }

        }

    }


    return best;

}


/* =========================================================
 TRACE FROM SEED

 從近景往上追。

 每次只上移 5 pixel。

 找不到時可以短暫跳過，
 但不能連續失聯太久。
========================================================= */

function traceSeed(
    seed,
    side,
    magnitude,
    edgeAngle,
    threshold
){

    var points = [];


    points.push({

        x:seed.x,
        y:seed.y,
        angle:seed.angle

    });


    var currentX =
    seed.x;

    var currentY =
    seed.y;

    var currentAngle =
    seed.angle;


    var misses = 0;


    /*
    追到畫面約 35% 高度。

    不追進樹冠最上方。
    */

    var minY =
    AH*.34;


    while(
        currentY>minY
    ){

        var nextY =
        currentY-5;


        /*
        依照目前方向預測下一層 X。
        */

        var predictedX =
        projectXAtY(
            currentX,
            currentY,
            currentAngle,
            nextY
        );


        if(
            predictedX===null ||
            !isFinite(predictedX)
        ){
            break;
        }


        /*
        越往遠方，
        道路變細，
        搜尋半徑稍微縮小。
        */

        var relative =
        nextY/AH;


        var radius =
        relative>.65
        ?
        10
        :
        relative>.48
        ?
        8
        :
        6;


        var found =
        findEdgeNear(
            predictedX,
            nextY,
            currentAngle,
            side,
            magnitude,
            edgeAngle,
            threshold,
            radius
        );


        if(found){

            points.push({

                x:found.x,
                y:found.y,
                angle:found.angle

            });


            /*
            位置稍微平滑。
            */

            currentX =
            found.x;


            currentY =
            found.y;


            /*
            方向不能突然被樹枝帶走。

            新方向只佔 25%。
            */

            var newAngle =
            currentAngle*.75+
            found.angle*.25;


            /*
            如果正負跨過 ±90 的表示問題，
            直接使用 found。
            */

            if(
                angleDifference(
                    currentAngle,
                    found.angle
                )
                >.45
            ){

                newAngle =
                found.angle;

            }


            currentAngle =
            newAngle;


            misses = 0;

        }

        else{

            misses++;


            /*
            可以允許 2 層找不到。
            */

            if(
                misses>2
            ){
                break;
            }


            currentX =
            predictedX;

            currentY =
            nextY;

        }

    }


    return points;

}


/* =========================================================
 LINE FIT

 我們用：

 x = a*y + b

 因為道路接近垂直時，
 這比 y = mx+b 更穩定。
========================================================= */

function fitLine(points){

    if(
        !points ||
        points.length<4
    ){
        return null;
    }


    var sumY = 0;
    var sumX = 0;
    var sumYY = 0;
    var sumYX = 0;


    var n =
    points.length;


    for(
        var i=0;
        i<n;
        i++
    ){

        var p =
        points[i];


        sumY +=
        p.y;

        sumX +=
        p.x;

        sumYY +=
        p.y*p.y;

        sumYX +=
        p.y*p.x;

    }


    var denominator =
    n*sumYY-
    sumY*sumY;


    if(
        Math.abs(
            denominator
        )
        <
        .00001
    ){
        return null;
    }


    var a =
    (
        n*sumYX-
        sumY*sumX
    )
    /
    denominator;


    var b =
    (
        sumX-
        a*sumY
    )
    /
    n;


    /*
    residual
    */

    var errors = [];


    for(
        var j=0;
        j<n;
        j++
    ){

        var expected =
        a*points[j].y+
        b;


        errors.push(
            Math.abs(
                points[j].x-
                expected
            )
        );

    }


    var error =
    median(errors);


    return{

        a:a,
        b:b,
        error:error

    };

}


/* =========================================================
 ROBUST FIT

 第一輪 fit 後，
 把偏離太大的點拿掉再 fit。
========================================================= */

function robustFit(points){

    var first =
    fitLine(points);


    if(!first){
        return null;
    }


    var limit =
    Math.max(
        3.5,
        first.error*2.2
    );


    var filtered =
    points.filter(
        function(p){

            var expected =
            first.a*p.y+
            first.b;


            return(
                Math.abs(
                    p.x-expected
                )
                <=limit
            );

        }
    );


    if(
        filtered.length<4
    ){
        return null;
    }


    var second =
    fitLine(filtered);


    if(!second){
        return null;
    }


    second.points =
    filtered;


    return second;

}


/* =========================================================
 TRACE QUALITY
========================================================= */

function traceQuality(
    fit,
    originalPoints
){

    if(!fit){
        return 0;
    }


    var countScore =
    clamp(
        fit.points.length/12,
        0,
        1
    );


    var minY = 999;
    var maxY = -999;


    for(
        var i=0;
        i<fit.points.length;
        i++
    ){

        minY =
        Math.min(
            minY,
            fit.points[i].y
        );

        maxY =
        Math.max(
            maxY,
            fit.points[i].y
        );

    }


    var verticalSpan =
    maxY-minY;


    var spanScore =
    clamp(
        verticalSpan/
        (AH*.42),
        0,
        1
    );


    var errorScore =
    1-
    clamp(
        fit.error/7,
        0,
        1
    );


    /*
    保留下來的點比例。
    */

    var keepScore =
    clamp(
        fit.points.length/
        Math.max(
            originalPoints.length,
            1
        ),
        0,
        1
    );


    return(

        countScore*.30

        +

        spanScore*.30

        +

        errorScore*.25

        +

        keepScore*.15

    );

}


/* =========================================================
 FIND BEST TRACE
========================================================= */

function findBestTrace(
    seeds,
    side,
    magnitude,
    edgeAngle,
    threshold
){

    var best =
    null;


    for(
        var i=0;
        i<seeds.length;
        i++
    ){

        var points =
        traceSeed(
            seeds[i],
            side,
            magnitude,
            edgeAngle,
            threshold
        );


        /*
        太短直接淘汰
        */

        if(
            points.length<5
        ){
            continue;
        }


        var fit =
        robustFit(points);


        if(!fit){
            continue;
        }


        /*
        左線 x=a*y+b：

        y 越大 = 越近。

        左道路：
        近處 x 應更小，
        所以 a 應為負。

        右道路：
        近處 x 應更大，
        所以 a 應為正。
        */

        if(
            side==="left"
            &&
            fit.a>=-.025
        ){
            continue;
        }


        if(
            side==="right"
            &&
            fit.a<=.025
        ){
            continue;
        }


        var quality =
        traceQuality(
            fit,
            points
        );


        /*
        種子本身的分數也保留少量。
        */

        quality =
        quality*.85+
        seeds[i].score*.15;


        if(
            !best ||
            quality>best.quality
        ){

            best = {

                seed:
                seeds[i],

                points:
                fit.points,

                fit:
                fit,

                quality:
                quality

            };

        }

    }


    return best;

}


/* =========================================================
 INTERSECTION OF FITTED LINES

 left:
 x = a1*y+b1

 right:
 x = a2*y+b2

 a1*y+b1 =
 a2*y+b2
========================================================= */

function fittedIntersection(
    left,
    right
){

    var denominator =
    left.a-right.a;


    if(
        Math.abs(
            denominator
        )
        <
        .00001
    ){
        return null;
    }


    var y =
    (
        right.b-left.b
    )
    /
    denominator;


    var x =
    left.a*y+
    left.b;


    return{

        x:x,
        y:y

    };

}


/* =========================================================
 ROAD GEOMETRY VALIDATION
========================================================= */

function validateRoadGeometry(
    left,
    right,
    vp
){

    if(!vp){
        return null;
    }


    /*
    VP 寬鬆範圍。
    */

    if(
        vp.x<
        AW*.08 ||
        vp.x>
        AW*.92
    ){
        return null;
    }


    if(
        vp.y<
        AH*.15 ||
        vp.y>
        AH*.68
    ){
        return null;
    }


    /*
    在近景比較左右道路寬度。
    */

    var yNear =
    AH*.88;


    var yMiddle =
    AH*.60;


    var leftNear =
    left.a*yNear+
    left.b;


    var rightNear =
    right.a*yNear+
    right.b;


    var leftMiddle =
    left.a*yMiddle+
    left.b;


    var rightMiddle =
    right.a*yMiddle+
    right.b;


    var nearWidth =
    rightNear-leftNear;


    var middleWidth =
    rightMiddle-leftMiddle;


    /*
    必須真的有道路寬度。
    */

    if(
        nearWidth<
        AW*.15
    ){
        return null;
    }


    /*
    遠處應比近處窄。
    */

    if(
        middleWidth>=
        nearWidth*.94
    ){
        return null;
    }


    /*
    中段也不能交叉。
    */

    if(
        middleWidth<=0
    ){
        return null;
    }


    var narrowing =
    1-
    clamp(
        middleWidth/
        nearWidth,
        0,
        1
    );


    var widthScore =
    clamp(
        nearWidth/
        (AW*.55),
        .2,
        1
    );


    return{

        nearWidth:
        nearWidth,

        middleWidth:
        middleWidth,

        narrowing:
        narrowing,

        widthScore:
        widthScore

    };

}



/* =========================================================
 V5.8.8 ROAD PAIR LOCK

 1. 左右邊界不再各自選最高分後直接配對
 2. 建立多組 L/R trace 後一起驗證
 3. 檢查底部入口、道路寬度、逐層收斂
 4. 禁止 X 型交叉後再張開
 5. 通過驗證後才允許產生黃線與 VP
========================================================= */

function xOnLine(line,y){
    return line.a*y + line.b;
}

function validateRoadPair(leftTrace,rightTrace){

    if(!leftTrace || !rightTrace){
        return null;
    }

    var L = leftTrace.fit;
    var R = rightTrace.fit;

    var ys = [
        AH*.90,
        AH*.78,
        AH*.66,
        AH*.54
    ];

    var widths = [];

    for(var i=0;i<ys.length;i++){

        var lx = xOnLine(L,ys[i]);
        var rx = xOnLine(R,ys[i]);
        var width = rx-lx;

        if(!isFinite(lx) || !isFinite(rx) || width<=0){
            return null;
        }

        widths.push(width);
    }

    var nearLeft  = xOnLine(L,AH*.92);
    var nearRight = xOnLine(R,AH*.92);
    var nearWidth = nearRight-nearLeft;

    if(
        nearLeft < -AW*.08 ||
        nearRight > AW*1.08
    ){
        return null;
    }

    if(
        nearWidth < AW*.20 ||
        nearWidth > AW*1.05
    ){
        return null;
    }

    if(
        nearLeft > AW*.47 ||
        nearRight < AW*.53
    ){
        return null;
    }

    /*
    由近到遠必須大致變窄。
    允許 6% 誤差，但禁止重新張開。
    */
    for(var j=1;j<widths.length;j++){

        if(widths[j] > widths[j-1]*1.06){
            return null;
        }

        if(widths[j] < AW*.035){
            return null;
        }
    }

    var vp = fittedIntersection(L,R);

    if(!vp){
        return null;
    }

    if(
        vp.x < AW*.10 ||
        vp.x > AW*.90 ||
        vp.y < AH*.18 ||
        vp.y > AH*.67
    ){
        return null;
    }

    /*
    VP 要接近道路中軸，避免樹枝斜線把交點拉走。
    */
    var yCheck = AH*.58;

    var centerX =
        (
            xOnLine(L,yCheck)+
            xOnLine(R,yCheck)
        )/2;

    var centerError =
        Math.abs(vp.x-centerX);

    if(centerError > AW*.20){
        return null;
    }

    var shrink =
        1-clamp(
            widths[3]/Math.max(widths[0],1),
            0,
            1
        );

    var symmetry =
        1-clamp(
            centerError/(AW*.20),
            0,
            1
        );

    return{
        vp:vp,
        nearWidth:nearWidth,
        widths:widths,
        shrink:shrink,
        symmetry:symmetry
    };
}


function collectTraceCandidates(
    seeds,
    side,
    magnitude,
    edgeAngle,
    threshold
){

    var list = [];

    for(var i=0;i<seeds.length;i++){

        var points =
        traceSeed(
            seeds[i],
            side,
            magnitude,
            edgeAngle,
            threshold
        );

        if(points.length<5){
            continue;
        }

        var fit = robustFit(points);

        if(!fit){
            continue;
        }

        if(
            side==="left" &&
            fit.a>=-.025
        ){
            continue;
        }

        if(
            side==="right" &&
            fit.a<=.025
        ){
            continue;
        }

        var quality =
            traceQuality(fit,points)*.85+
            seeds[i].score*.15;

        list.push({
            seed:seeds[i],
            points:fit.points,
            fit:fit,
            quality:quality
        });
    }

    list.sort(function(a,b){
        return b.quality-a.quality;
    });

    return list.slice(0,6);
}


function findBestRoadPair(
    leftSeeds,
    rightSeeds,
    magnitude,
    edgeAngle,
    threshold
){

    var leftList =
    collectTraceCandidates(
        leftSeeds,
        "left",
        magnitude,
        edgeAngle,
        threshold
    );

    var rightList =
    collectTraceCandidates(
        rightSeeds,
        "right",
        magnitude,
        edgeAngle,
        threshold
    );

    if(
        leftList.length===0 ||
        rightList.length===0
    ){
        return null;
    }

    var best = null;

    for(var i=0;i<leftList.length;i++){

        for(var j=0;j<rightList.length;j++){

            var L = leftList[i];
            var R = rightList[j];

            if(L.seed.x>=R.seed.x){
                continue;
            }

            var seedWidth =
                R.seed.x-L.seed.x;

            if(
                seedWidth<AW*.18 ||
                seedWidth>AW*.95
            ){
                continue;
            }

            var pair =
                validateRoadPair(L,R);

            if(!pair){
                continue;
            }

            var fitError =
                (L.fit.error+R.fit.error)/2;

            var fitScore =
                1-clamp(fitError/7,0,1);

            var traceScore =
                (L.quality+R.quality)/2;

            var pairScore =
                traceScore*.46+
                fitScore*.18+
                pair.shrink*.20+
                pair.symmetry*.16;

            if(
                !best ||
                pairScore>best.score
            ){
                best = {
                    left:L,
                    right:R,
                    geometry:pair,
                    vp:pair.vp,
                    score:pairScore
                };
            }
        }
    }

    return best;
}


/* =========================================================
 MAIN ANALYSIS
========================================================= */

function analyzeRoad(){

    if(video.readyState<2){
        return null;
    }

    var edges = buildEdges();

    if(!edges){
        return null;
    }

    /*
    STEP 1
    只在畫面底部尋找左右道路入口。
    */
    var seeds =
    findSeeds(
        edges.magnitude,
        edges.angle,
        edges.threshold
    );

    if(
        seeds.left.length===0 ||
        seeds.right.length===0
    ){
        return null;
    }

    /*
    STEP 2
    V5.8.8：L/R 候選必須成對驗證。
    */
    var roadPair =
    findBestRoadPair(
        seeds.left,
        seeds.right,
        edges.magnitude,
        edges.angle,
        edges.threshold
    );

    if(!roadPair){
        return null;
    }

    var leftTrace  = roadPair.left;
    var rightTrace = roadPair.right;
    var vp         = roadPair.vp;
    var geometry   = roadPair.geometry;

    var traceScore =
        (leftTrace.quality+rightTrace.quality)/2;

    var fitError =
        (leftTrace.fit.error+rightTrace.fit.error)/2;

    var fitScore =
        1-clamp(
            fitError/7,
            0,
            1
        );

    var confidence =
        .12+
        traceScore*.38+
        fitScore*.18+
        geometry.shrink*.18+
        geometry.symmetry*.14;

    confidence =
    clamp(
        confidence,
        .25,
        .90
    );

    return{
        vx:vp.x/AW,
        vy:vp.y/AH,
        confidence:confidence,

        leftPoints:leftTrace.points,
        rightPoints:rightTrace.points,

        leftLine:leftTrace.fit,
        rightLine:rightTrace.fit,

        leftSeed:leftTrace.seed,
        rightSeed:rightTrace.seed
    };
}


/* =========================================================
 DRAW POINTS
========================================================= */

function drawTrackedPoints(
    points,
    label
){

    if(!points){
        return;
    }


    var w =
    overlay.clientWidth;

    var h =
    overlay.clientHeight;


    ctx.save();


    ctx.fillStyle =
    "#ffffff";


    for(
        var i=0;
        i<points.length;
        i++
    ){

        var x =
        points[i].x/AW*w;


        var y =
        points[i].y/AH*h;


        ctx.beginPath();

        ctx.arc(
            x,
            y,
            3.2,
            0,
            Math.PI*2
        );

        ctx.fill();

    }


    /*
    第一個點標 L/R
    */

    if(points.length){

        var first =
        points[0];


        ctx.fillStyle =
        "#ffffff";

        ctx.font =
        "bold 14px -apple-system,Arial";


        ctx.fillText(
            label,
            first.x/AW*w+8,
            first.y/AH*h-8
        );

    }


    ctx.restore();

}


/* =========================================================
 DRAW FITTED LINE
========================================================= */

function drawFittedLine(
    line,
    label
){

    if(!line){
        return;
    }


    var w =
    overlay.clientWidth;

    var h =
    overlay.clientHeight;


    /*
    畫線範圍：

    從畫面底部
    到 VP 附近。

    DEBUG 時直接畫完整擬合。
    */

    var yBottom =
    AH*.98;


    var yTop =
    AH*.30;


    var xBottom =
    line.a*yBottom+
    line.b;


    var xTop =
    line.a*yTop+
    line.b;


    ctx.save();


    ctx.strokeStyle =
    "#ffd400";

    ctx.lineWidth =
    4;

    ctx.setLineDash([]);


    ctx.beginPath();


    ctx.moveTo(
        xBottom/AW*w,
        yBottom/AH*h
    );


    ctx.lineTo(
        xTop/AW*w,
        yTop/AH*h
    );


    ctx.stroke();


    ctx.fillStyle =
    "#ffd400";

    ctx.font =
    "bold 15px -apple-system,Arial";


    ctx.fillText(
        label,
        xBottom/AW*w+8,
        yBottom/AH*h-10
    );


    ctx.restore();

}


/* =========================================================
 DRAW VP
========================================================= */

function drawVP(){

    if(!detectedPoint){
        return;
    }


    var w =
    overlay.clientWidth;

    var h =
    overlay.clientHeight;


    var x =
    detectedPoint.vx*w;

    var y =
    detectedPoint.vy*h;


    ctx.save();


    ctx.strokeStyle =
    "#2cff67";

    ctx.fillStyle =
    "#2cff67";

    ctx.lineWidth =
    4;

    ctx.setLineDash([]);


    ctx.beginPath();

    ctx.arc(
        x,
        y,
        25,
        0,
        Math.PI*2
    );

    ctx.stroke();


    ctx.beginPath();

    ctx.arc(
        x,
        y,
        9,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.lineWidth =
    3;


    ctx.beginPath();


    ctx.moveTo(
        x-43,
        y
    );

    ctx.lineTo(
        x-30,
        y
    );


    ctx.moveTo(
        x+30,
        y
    );

    ctx.lineTo(
        x+43,
        y
    );


    ctx.moveTo(
        x,
        y-43
    );

    ctx.lineTo(
        x,
        y-30
    );


    ctx.moveTo(
        x,
        y+30
    );

    ctx.lineTo(
        x,
        y+43
    );


    ctx.stroke();


    ctx.font =
    "bold 16px -apple-system,Arial";

    ctx.textAlign =
    "center";


    ctx.fillText(
        "● AI 消失點",
        x,
        y-50
    );


    ctx.restore();

}



/* =========================================================
 DRAW BOTTOM ENTRY SEEDS

 藍點 = V5.8.8 最終採用的道路底部左右入口
========================================================= */

function drawSeed(seed,label){

    if(!seed){
        return;
    }

    var w = overlay.clientWidth;
    var h = overlay.clientHeight;

    var x = seed.x/AW*w;
    var y = seed.y/AH*h;

    ctx.save();

    ctx.fillStyle = "#00a8ff";
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 2;

    ctx.beginPath();
    ctx.arc(
        x,
        y,
        7,
        0,
        Math.PI*2
    );
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = "#00a8ff";
    ctx.font =
        "bold 14px -apple-system,Arial";

    ctx.fillText(
        label+" Seed",
        x+10,
        y-10
    );

    ctx.restore();
}


/* =========================================================
 DRAW DEBUG
========================================================= */

function drawDebug(){

    if(!debugResult){
        return;
    }


    /*
    黃線先畫。
    */

    drawFittedLine(
        debugResult.leftLine,
        "L"
    );


    drawFittedLine(
        debugResult.rightLine,
        "R"
    );


    /*
    V5.8.8：藍點先標出真正採用的道路底部入口。
    */
    drawSeed(
        debugResult.leftSeed,
        "L"
    );

    drawSeed(
        debugResult.rightSeed,
        "R"
    );


    /*
    再畫真正追蹤點。

    白點在黃線上方，
    比較容易看清楚。
    */

    drawTrackedPoints(
        debugResult.leftPoints,
        "L"
    );


    drawTrackedPoints(
        debugResult.rightPoints,
        "R"
    );

}


/* =========================================================
 RESIZE
========================================================= */

function resizeOverlay(){

    var rect =
    overlay.getBoundingClientRect();


    var dpr =
    window.devicePixelRatio ||
    1;


    overlay.width =
    Math.round(
        rect.width*dpr
    );


    overlay.height =
    Math.round(
        rect.height*dpr
    );


    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

}


/* =========================================================
 DRAW LOOP
========================================================= */

function loop(){

    ctx.clearRect(
        0,
        0,
        overlay.clientWidth,
        overlay.clientHeight
    );


    drawDebug();

    drawVP();


    requestAnimationFrame(
        loop
    );

}


/* =========================================================
 ZOOM
========================================================= */

zoom.addEventListener(
    "input",
    async function(){

        var value =
        Number(
            this.value
        );


        zoomText.innerText =
        value.toFixed(1)+
        "×";


        /*
        改倍率後舊結果無效。
        */

        detectedPoint =
        null;

        debugResult =
        null;


        scoreEl.innerHTML =
        '-- <small>%</small>';


        compositionEl.innerText =
        "倍率已變更";


        descEl.innerText =
        "請重新執行 AI 分析";


        if(!stream){
            return;
        }


        var tracks =
        stream.getVideoTracks();


        if(
            tracks.length===0
        ){
            return;
        }


        var track =
        tracks[0];


        if(
            !track.getCapabilities
        ){
            return;
        }


        var capabilities =
        track.getCapabilities();


        if(
            !capabilities.zoom
        ){
            return;
        }


        try{

            var actualZoom =
            clamp(
                value,
                capabilities.zoom.min,
                capabilities.zoom.max
            );


            await track.applyConstraints({

                advanced:[
                    {
                        zoom:
                        actualZoom
                    }
                ]

            });

        }
        catch(error){

            console.log(
                "Zoom unsupported",
                error
            );

        }

    }
);


/* =========================================================
 ERROR
========================================================= */

window.onerror =
function(
    message,
    source,
    line
){

    console.log(
        message,
        source,
        line
    );


    messageEl.innerText =
    "⚠️ 程式錯誤："+
    message+
    "｜第"+
    line+
    "行";


    return false;

};


window.addEventListener(
    "unhandledrejection",
    function(event){

        console.log(
            event.reason
        );


        messageEl.innerText =
        "⚠️ 執行錯誤，請重新整理";

    }
);


/* =========================================================
 EVENTS
========================================================= */

window.addEventListener(
    "resize",
    resizeOverlay
);


window.addEventListener(
    "orientationchange",
    function(){

        setTimeout(
            resizeOverlay,
            250
        );

    }
);


/* =========================================================
 START
========================================================= */

startCamera();

requestAnimationFrame(
    loop
);

</script>
