<!DOCTYPE html>
<html lang="zh-TW">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               user-scalable=no">

<title>阿策智慧構圖助手 V3.2</title>

<style>

body {
    margin: 0;
    background: black;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

h2 {
    margin: 8px 0;
    font-size: 22px;
}

#status {
    font-size: 15px;
    margin: 5px;
}

#faceInfo {
    font-size: 16px;
    margin: 5px;
}

#modeInfo {
    font-size: 19px;
    margin: 5px;
    font-weight: bold;
}

#guideInfo {
    font-size: 25px;
    font-weight: bold;
    min-height: 34px;
    margin: 6px;
}

#scoreInfo {
    font-size: 20px;
    min-height: 26px;
    margin: 5px;
}

#cameraBox {
    position: relative;
    width: 100%;
    max-width: 900px;
    margin: auto;
    background: #111;
    overflow: hidden;
}

#camera {
    width: 100%;
    display: block;
}

#overlay {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
}

.guideLine {
    position: absolute;
    background: rgba(255,255,255,0.6);
    pointer-events: none;
}

.vline {
    top: 0;
    height: 100%;
    width: 1px;
}

.v1 {
    left: 33.33%;
}

.v2 {
    left: 66.66%;
}

.hline {
    left: 0;
    width: 100%;
    height: 1px;
}

.h1 {
    top: 33.33%;
}

.h2 {
    top: 66.66%;
}

#controls {
    padding: 8px 4px;
}

button {
    font-size: 17px;
    padding: 11px 14px;
    margin: 4px 2px;
    border: none;
    border-radius: 10px;
}

.cameraButton {
    min-width: 120px;
}

#shutterButton {
    width: 68px;
    height: 68px;
    border-radius: 50%;
    font-size: 27px;
}

#photoArea {
    padding: 10px 0 25px 0;
}

#photoPreview {
    width: 180px;
    max-width: 46%;
    display: none;
    border-radius: 10px;
    border: 2px solid white;
}

#photoCanvas,
#analysisCanvas {
    display: none;
}

</style>

</head>


<body>

<h2>📷 阿策智慧構圖助手 V3.2</h2>

<div id="status">
    AI 模型載入中...
</div>

<div id="faceInfo"></div>

<div id="modeInfo"></div>

<div id="guideInfo"></div>

<div id="scoreInfo"></div>


<div id="cameraBox">

    <video
        id="camera"
        autoplay
        playsinline
        muted>
    </video>

    <canvas id="overlay"></canvas>

    <div class="guideLine vline v1"></div>
    <div class="guideLine vline v2"></div>

    <div class="guideLine hline h1"></div>
    <div class="guideLine hline h2"></div>

</div>


<div id="controls">

    <button
        class="cameraButton"
        onclick="openFrontCamera()">
        🤳 前鏡頭
    </button>

    <button
        class="cameraButton"
        onclick="openRearCamera()">
        📷 後鏡頭
    </button>

    <br>

    <button
        id="shutterButton"
        onclick="takePhoto()">
        📸
    </button>

    <button onclick="stopCamera()">
        關閉
    </button>

</div>


<div id="photoArea">

    <div>
        拍照預覽
    </div>

    <br>

    <img id="photoPreview">

</div>


<canvas id="photoCanvas"></canvas>

<canvas id="analysisCanvas"></canvas>


<script type="module">

import {
    FaceDetector,
    FilesetResolver
}
from "https://unpkg.com/@mediapipe/tasks-vision@0.10.35/vision_bundle.mjs";


/* =========================
   全域變數
========================= */

let detector = null;

let stream = null;

let cameraRunning = false;

let lastVideoTime = -1;

let smoothScore = 0;

let okCounter = 0;

let smoothHorizonY = null;

let lastLandscapeAnalysis = 0;


/*
user = 前鏡頭
environment = 後鏡頭

這次不再看鏡頭名稱
*/
let currentFacingMode = "user";


const video =
    document.getElementById("camera");

const overlay =
    document.getElementById("overlay");

const ctx =
    overlay.getContext("2d");

const photoCanvas =
    document.getElementById("photoCanvas");

const photoCtx =
    photoCanvas.getContext("2d");

const analysisCanvas =
    document.getElementById("analysisCanvas");

const analysisCtx =
    analysisCanvas.getContext(
        "2d",
        {
            willReadFrequently: true
        }
    );

const photoPreview =
    document.getElementById("photoPreview");

const statusText =
    document.getElementById("status");

const faceInfo =
    document.getElementById("faceInfo");

const modeInfo =
    document.getElementById("modeInfo");

const guideInfo =
    document.getElementById("guideInfo");

const scoreInfo =
    document.getElementById("scoreInfo");


/* =========================
   載入 AI
========================= */

async function loadAI() {

    try {

        statusText.innerText =
            "正在載入 MediaPipe...";


        const resolver =
            await FilesetResolver.forVisionTasks(

                "https://unpkg.com/@mediapipe/tasks-vision@0.10.35/wasm"

            );


        detector =
            await FaceDetector.createFromOptions(

                resolver,

                {

                    baseOptions: {

                        modelAssetPath:

                        "https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite"

                    },

                    runningMode:
                        "VIDEO",

                    /*
                    提高一點，
                    減少風景被誤認成人臉
                    */
                    minDetectionConfidence:
                        0.60

                }

            );


        statusText.innerText =
            "✅ AI 已準備完成";

    }

    catch(error) {

        statusText.innerText =
            "❌ AI 載入失敗";

        faceInfo.innerText =
            error.message;

    }

}


/* =========================
   前鏡頭
========================= */

async function openFrontCamera() {

    currentFacingMode =
        "user";


    await openCamera();

}


/* =========================
   後鏡頭
========================= */

async function openRearCamera() {

    currentFacingMode =
        "environment";


    await openCamera();

}


/* =========================
   開啟指定鏡頭
========================= */

async function openCamera() {

    if (!detector) {

        alert(
            "AI 還在載入，請稍等一下"
        );

        return;

    }


    stopCurrentStream();


    try {

        /*
        先用 exact

        要求 Safari
        一定使用前或後鏡頭
        */

        stream =
            await navigator.mediaDevices
                .getUserMedia({

                    video: {

                        facingMode: {

                            exact:
                                currentFacingMode

                        }

                    },

                    audio:
                        false

                });

    }

    catch(error) {

        /*
        如果某些 iPhone
        不接受 exact，

        再退回 ideal
        */

        try {

            stream =
                await navigator.mediaDevices
                    .getUserMedia({

                        video: {

                            facingMode:

                                currentFacingMode

                        },

                        audio:
                            false

                    });

        }

        catch(error2) {

            statusText.innerText =
                "❌ 無法開啟相機：" +
                error2.message;

            return;

        }

    }


    video.srcObject =
        stream;


    await video.play();


    cameraRunning =
        true;


    lastVideoTime =
        -1;


    smoothScore =
        0;


    okCounter =
        0;


    smoothHorizonY =
        null;


    if (
        currentFacingMode ===
        "environment"
    ) {

        statusText.innerText =
            "📷 後鏡頭已開啟";


        /*
        後鏡頭一開啟，
        先直接顯示風景模式。

        如果之後真的偵測到人，
        程式會自動切成人像模式。
        */

        faceInfo.innerText =
            "";


        modeInfo.innerText =
            "🏞️ 智慧風景構圖";


        guideInfo.innerText =
            "正在分析畫面...";


        scoreInfo.innerText =
            "";

    }

    else {

        statusText.innerText =
            "🤳 前鏡頭已開啟";


        modeInfo.innerText =
            "👤 人像構圖模式";


        guideInfo.innerText =
            "等待人物進入畫面";


        scoreInfo.innerText =
            "";

    }


    requestAnimationFrame(
        detectLoop
    );

}


/* =========================
   關閉目前鏡頭
========================= */

function stopCurrentStream() {

    if (stream) {

        stream
            .getTracks()
            .forEach(
                track =>
                    track.stop()
            );

        stream =
            null;

    }

}


/* =========================
   關閉相機
========================= */

function stopCamera() {

    cameraRunning =
        false;


    stopCurrentStream();


    video.srcObject =
        null;


    ctx.clearRect(
        0,
        0,
        overlay.width,
        overlay.height
    );


    statusText.innerText =
        "相機已關閉";


    faceInfo.innerText =
        "";


    modeInfo.innerText =
        "";


    guideInfo.innerText =
        "";


    scoreInfo.innerText =
        "";

}


/* =========================
   拍照
========================= */

function takePhoto() {

    if (
        !cameraRunning ||
        video.videoWidth === 0
    ) {

        alert(
            "請先開啟相機"
        );

        return;

    }


    photoCanvas.width =
        video.videoWidth;


    photoCanvas.height =
        video.videoHeight;


    photoCtx.drawImage(

        video,

        0,
        0,

        photoCanvas.width,
        photoCanvas.height

    );


    const imageData =
        photoCanvas.toDataURL(
            "image/jpeg",
            0.94
        );


    photoPreview.src =
        imageData;


    photoPreview.style.display =
        "inline-block";


    statusText.innerText =
        "📸 拍照完成";

}


/* =========================
   即時偵測
========================= */

function detectLoop() {

    if (!cameraRunning) {

        return;

    }


    if (
        video.readyState >= 2 &&
        video.videoWidth > 0 &&
        video.videoHeight > 0
    ) {

        if (
            video.currentTime !==
            lastVideoTime
        ) {

            lastVideoTime =
                video.currentTime;


            try {

                const result =
                    detector.detectForVideo(

                        video,

                        performance.now()

                    );


                drawResult(
                    result
                );

            }

            catch(error) {

                console.log(error);

            }

        }

    }


    requestAnimationFrame(
        detectLoop
    );

}


/* =========================
   距離
========================= */

function getDistance(
    x1,
    y1,
    x2,
    y2
) {

    const dx =
        x2 - x1;

    const dy =
        y2 - y1;


    return Math.sqrt(
        dx * dx +
        dy * dy
    );

}


/* =========================
   分數平滑
========================= */

function updateSmoothScore(score) {

    if (
        smoothScore === 0
    ) {

        smoothScore =
            score;

    }

    else {

        smoothScore =
            smoothScore * 0.85 +
            score * 0.15;

    }


    return Math.round(
        smoothScore
    );

}


/* =========================
   方向
========================= */

function getDirectionText(
    dx,
    dy,
    toleranceX,
    toleranceY
) {

    let horizontal = "";

    let vertical = "";


    if (
        Math.abs(dx) >
        toleranceX
    ) {

        horizontal =
            dx > 0
            ? "往右"
            : "往左";

    }


    if (
        Math.abs(dy) >
        toleranceY
    ) {

        vertical =
            dy > 0
            ? "往下"
            : "往上";

    }


    if (
        horizontal &&
        vertical
    ) {

        return (
            horizontal +
            "、" +
            vertical
        );

    }


    return (
        horizontal ||
        vertical
    );

}


/* =========================
   主畫面處理
========================= */

function drawResult(result) {

    const width =
        video.clientWidth;


    const height =
        video.clientHeight;


    overlay.width =
        width;


    overlay.height =
        height;


    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    const scaleX =
        width /
        video.videoWidth;


    const scaleY =
        height /
        video.videoHeight;


    const validFaces =
        [];


    if (result.detections) {

        for (
            const detection
            of result.detections
        ) {

            const box =
                detection.boundingBox;


            const x =
                box.originX *
                scaleX;


            const y =
                box.originY *
                scaleY;


            const w =
                box.width *
                scaleX;


            const h =
                box.height *
                scaleY;


            /*
            比之前更嚴格，
            避免戶外物件被當成臉
            */

            if (
                w <
                width * 0.10

                ||

                h <
                height * 0.10
            ) {

                continue;

            }


            validFaces.push({

                x,
                y,
                w,
                h,

                centerX:
                    x + w / 2,

                centerY:
                    y + h / 2

            });

        }

    }


    /*
    有真的偵測到人物
    */

    if (
        validFaces.length > 0
    ) {

        drawPeopleComposition(

            validFaces,

            width,

            height

        );

        return;

    }


    /*
    後鏡頭沒有人物

    一律進入風景模式
    */

    if (
        currentFacingMode ===
        "environment"
    ) {

        drawLandscapeComposition(

            width,
            height

        );

        return;

    }


    /*
    前鏡頭沒有人
    */

    faceInfo.innerText =
        "";


    modeInfo.innerText =
        "👤 人像構圖模式";


    guideInfo.innerText =
        "等待人物進入畫面";


    scoreInfo.innerText =
        "";

}


/* =========================
   人像構圖
========================= */

function drawPeopleComposition(
    faces,
    width,
    height
) {

    faceInfo.innerText =
        "偵測到人物：" +
        faces.length +
        " 人";


    for (
        const face
        of faces
    ) {

        ctx.strokeStyle =
            "lime";


        ctx.lineWidth =
            3;


        ctx.strokeRect(
            face.x,
            face.y,
            face.w,
            face.h
        );

    }


    /*
    單人
    */

    if (
        faces.length === 1
    ) {

        modeInfo.innerText =
            "👤 單人構圖模式";


        const face =
            faces[0];


        const points = [

            {
                x: width / 3,
                y: height / 3
            },

            {
                x: width * 2 / 3,
                y: height / 3
            },

            {
                x: width / 3,
                y: height * 2 / 3
            },

            {
                x: width * 2 / 3,
                y: height * 2 / 3
            }

        ];


        let target =
            points[0];


        let distance =
            getDistance(

                face.centerX,
                face.centerY,

                target.x,
                target.y

            );


        for (
            const point
            of points
        ) {

            const d =
                getDistance(

                    face.centerX,
                    face.centerY,

                    point.x,
                    point.y

                );


            if (
                d < distance
            ) {

                distance = d;

                target = point;

            }

        }


        ctx.beginPath();

        ctx.arc(
            target.x,
            target.y,
            8,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            "deepskyblue";

        ctx.fill();


        ctx.beginPath();

        ctx.arc(
            face.centerX,
            face.centerY,
            8,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            "red";

        ctx.fill();


        ctx.beginPath();

        ctx.moveTo(
            face.centerX,
            face.centerY
        );

        ctx.lineTo(
            target.x,
            target.y
        );

        ctx.strokeStyle =
            "yellow";

        ctx.lineWidth =
            3;

        ctx.stroke();


        const okDistance =
            Math.min(
                width,
                height
            ) * 0.18;


        const nearDistance =
            Math.min(
                width,
                height
            ) * 0.28;


        const dx =
            target.x -
            face.centerX;


        const dy =
            target.y -
            face.centerY;


        const direction =
            getDirectionText(

                dx,
                dy,

                width * 0.10,

                height * 0.10

            );


        let rawScore =
            100 -
            (
                distance /
                (
                    Math.sqrt(
                        width * width +
                        height * height
                    )
                    *
                    0.45
                )
            )
            *
            100;


        rawScore =
            Math.max(
                0,
                Math.min(
                    100,
                    rawScore
                )
            );


        const score =
            updateSmoothScore(
                rawScore
            );


        if (
            distance <=
            okDistance
        ) {

            okCounter++;

        }

        else {

            okCounter =
                Math.max(
                    0,
                    okCounter - 1
                );

        }


        if (
            okCounter >= 4
        ) {

            guideInfo.innerText =
                "✅ 構圖 OK";

        }

        else if (
            distance <=
            nearDistance
        ) {

            guideInfo.innerText =
                "👍 快到了";

        }

        else {

            guideInfo.innerText =
                direction
                ? "建議：" + direction
                : "👍 快到了";

        }


        scoreInfo.innerText =
            "構圖分數：" +
            score +
            " 分";


        return;

    }


    /*
    多人
    */

    modeInfo.innerText =
        "👥 多人合照模式：" +
        faces.length +
        " 人";


    let totalX = 0;

    let totalY = 0;


    for (
        const face
        of faces
    ) {

        totalX +=
            face.centerX;

        totalY +=
            face.centerY;

    }


    const groupX =
        totalX /
        faces.length;


    const groupY =
        totalY /
        faces.length;


    const targetX =
        width * 0.50;


    const targetY =
        height * 0.43;


    ctx.beginPath();

    ctx.arc(
        groupX,
        groupY,
        9,
        0,
        Math.PI * 2
    );

    ctx.fillStyle =
        "magenta";

    ctx.fill();


    ctx.beginPath();

    ctx.arc(
        targetX,
        targetY,
        9,
        0,
        Math.PI * 2
    );

    ctx.fillStyle =
        "cyan";

    ctx.fill();


    ctx.beginPath();

    ctx.moveTo(
        groupX,
        groupY
    );

    ctx.lineTo(
        targetX,
        targetY
    );

    ctx.strokeStyle =
        "yellow";

    ctx.lineWidth =
        3;

    ctx.stroke();


    const distance =
        getDistance(

            groupX,
            groupY,

            targetX,
            targetY

        );


    const okDistance =
        Math.min(
            width,
            height
        ) * 0.20;


    let rawScore =
        100 -
        distance /
        (
            Math.sqrt(
                width * width +
                height * height
            ) *
            0.50
        ) *
        100;


    rawScore =
        Math.max(
            0,
            Math.min(
                100,
                rawScore
            )
        );


    const score =
        updateSmoothScore(
            rawScore
        );


    if (
        distance <=
        okDistance
    ) {

        guideInfo.innerText =
            "✅ 多人構圖 OK";

    }

    else {

        const direction =
            getDirectionText(

                targetX -
                groupX,

                targetY -
                groupY,

                width * 0.08,

                height * 0.08

            );


        guideInfo.innerText =
            "建議：" +
            direction;

    }


    scoreInfo.innerText =
        "構圖分數：" +
        score +
        " 分";

}


/* =========================
   風景構圖
========================= */

function drawLandscapeComposition(
    width,
    height
) {

    faceInfo.innerText =
        "";


    /*
    這行現在一定會出現
    */

    modeInfo.innerText =
        "🏞️ 智慧風景構圖";


    const now =
        performance.now();


    if (
        now -
        lastLandscapeAnalysis >
        250
    ) {

        lastLandscapeAnalysis =
            now;


        const result =
            detectHorizon();


        if (result) {

            if (
                smoothHorizonY ===
                null
            ) {

                smoothHorizonY =
                    result.y;

            }

            else {

                smoothHorizonY =
                    smoothHorizonY *
                    0.80
                    +
                    result.y *
                    0.20;

            }

        }

    }


    if (
        smoothHorizonY ===
        null
    ) {

        guideInfo.innerText =
            "正在分析風景...";


        scoreInfo.innerText =
            "";

        return;

    }


    const horizonY =
        (
            smoothHorizonY /
            analysisCanvas.height
        ) *
        height;


    /*
    青色：
    程式判斷的水平分界
    */

    ctx.beginPath();

    ctx.moveTo(
        0,
        horizonY
    );

    ctx.lineTo(
        width,
        horizonY
    );

    ctx.strokeStyle =
        "cyan";

    ctx.lineWidth =
        4;

    ctx.stroke();


    const upperThird =
        height / 3;


    const lowerThird =
        height * 2 / 3;


    const targetY =

        Math.abs(
            horizonY -
            upperThird
        )

        <

        Math.abs(
            horizonY -
            lowerThird
        )

        ?

        upperThird

        :

        lowerThird;


    /*
    黃色：
    建議三分線
    */

    ctx.beginPath();

    ctx.moveTo(
        0,
        targetY
    );

    ctx.lineTo(
        width,
        targetY
    );

    ctx.strokeStyle =
        "yellow";

    ctx.lineWidth =
        3;

    ctx.stroke();


    const distance =
        Math.abs(
            horizonY -
            targetY
        );


    const okDistance =
        height *
        0.07;


    const nearDistance =
        height *
        0.14;


    let rawScore =
        100 -
        distance /
        (
            height *
            0.40
        ) *
        100;


    rawScore =
        Math.max(
            0,
            Math.min(
                100,
                rawScore
            )
        );


    const score =
        updateSmoothScore(
            rawScore
        );


    if (
        distance <=
        okDistance
    ) {

        okCounter++;

    }

    else {

        okCounter =
            Math.max(
                0,
                okCounter - 1
            );

    }


    if (
        okCounter >= 4
    ) {

        guideInfo.innerText =
            "✅ 風景構圖 OK";

    }

    else if (
        distance <=
        nearDistance
    ) {

        guideInfo.innerText =
            "👍 地平線快到三分線";

    }

    else if (
        horizonY >
        targetY
    ) {

        guideInfo.innerText =
            "建議：鏡頭稍微往下";

    }

    else {

        guideInfo.innerText =
            "建議：鏡頭稍微往上";

    }


    scoreInfo.innerText =
        "風景構圖分數：" +
        score +
        " 分";

}


/* =========================
   找水平分界
========================= */

function detectHorizon() {

    if (
        video.videoWidth === 0 ||
        video.videoHeight === 0
    ) {

        return null;

    }


    const w =
        160;


    const h =
        90;


    analysisCanvas.width =
        w;


    analysisCanvas.height =
        h;


    analysisCtx.drawImage(

        video,

        0,
        0,

        w,
        h

    );


    const image =
        analysisCtx.getImageData(

            0,
            0,
            w,
            h

        );


    const data =
        image.data;


    const gray =
        new Float32Array(
            w * h
        );


    for (
        let y = 0;
        y < h;
        y++
    ) {

        for (
            let x = 0;
            x < w;
            x++
        ) {

            const i =
                (
                    y * w +
                    x
                ) * 4;


            gray[
                y * w + x
            ] =

                data[i] *
                0.299

                +

                data[i + 1] *
                0.587

                +

                data[i + 2] *
                0.114;

        }

    }


    let bestY =
        h / 2;


    let bestScore =
        -1;


    const startY =
        Math.floor(
            h * 0.18
        );


    const endY =
        Math.floor(
            h * 0.82
        );


    for (
        let y = startY;
        y < endY;
        y++
    ) {

        let score =
            0;


        for (
            let x = 4;
            x < w - 4;
            x += 2
        ) {

            const above =
                gray[
                    (y - 2) *
                    w +
                    x
                ];


            const below =
                gray[
                    (y + 2) *
                    w +
                    x
                ];


            score +=
                Math.abs(
                    below -
                    above
                );

        }


        if (
            score >
            bestScore
        ) {

            bestScore =
                score;


            bestY =
                y;

        }

    }


    return {

        y:
            bestY

    };

}
