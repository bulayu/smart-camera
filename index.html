<script>

/* =========================================
   DOM
========================================= */

const video =
document.getElementById("video");

const overlay =
document.getElementById("overlay");

const ctx =
overlay.getContext("2d");

const ac =
document.getElementById("analysisCanvas");

const ax =
ac.getContext(
    "2d",
    {willReadFrequently:true}
);

const scoreEl =
document.getElementById("score");

const compositionEl =
document.getElementById("composition");

const descEl =
document.getElementById("desc");

const messageEl =
document.getElementById("message");

const zoom =
document.getElementById("zoom");

const zoomText =
document.getElementById("zoomText");


/* =========================================
   STATE
========================================= */

let stream = null;

let facing =
"environment";

let navigation =
false;

let lockedMode =
null;


/*
白色目標：
AI第一次分析完成後鎖定。
*/

let targetGuide = null;


/*
綠色目前位置：
導航期間重新分析。
*/

let liveGuide = null;


let currentScore =
0;


let lastLiveAnalysis =
0;


/*
不要分析太快。

450ms一次，
避免手機負擔太重。
*/

const LIVE_INTERVAL =
450;


/*
V5.7.2 防抖。

保留最近5次有效偵測。
*/

let liveHistory = [];

const LIVE_HISTORY_SIZE =
5;


/*
限制綠點單次最大移動量。

避免突然飛走。
*/

const MAX_LIVE_STEP =
0.055;


/*
平滑比例。

數字越小越穩，
但反應越慢。
*/

const LIVE_SMOOTH =
0.32;


/* =========================================
   CAMERA
========================================= */

async function startCamera(){

try{

    if(stream){

        stream
        .getTracks()
        .forEach(
            t=>t.stop()
        );
    }


    stream =
    await navigator.mediaDevices
    .getUserMedia({

        video:{

            facingMode:{
                ideal:facing
            },

            width:{
                ideal:1280
            },

            height:{
                ideal:720
            }

        },

        audio:false

    });


    video.srcObject =
    stream;


    await video.play();


    resizeOverlay();


    resetAnalysis();

}
catch(error){

    console.error(error);

    messageEl.innerText =
    "❌ 相機無法開啟";

    compositionEl.innerText =
    "相機錯誤";

    descEl.innerText =
    "請確認 Safari 已允許相機權限";

}

}



async function changeCamera(mode){

    facing =
    mode;

    await startCamera();

}



/* =========================================
   RESET
========================================= */

function resetAnalysis(){

    navigation =
    false;

    lockedMode =
    null;

    targetGuide =
    null;

    liveGuide =
    null;

    liveHistory =
    [];

    currentScore =
    0;


    scoreEl.innerHTML =
    `-- <small>/100</small>`;


    compositionEl.innerText =
    "等待分析";


    descEl.innerText =
    "先固定鏡頭，再按 AI 自動";


    messageEl.innerText =
    "✨ 按 AI 自動分析目前畫面";

}



/* =========================================
   BUTTON
========================================= */

function activateButton(button){

    document
    .querySelectorAll(".mode")
    .forEach(b=>{

        b.classList.remove(
            "active"
        );

    });


    button.classList.add(
        "active"
    );

}



/* =========================================
   AI AUTO
========================================= */

function runAI(button){

    activateButton(
        button
    );


    if(
        video.readyState < 2
    ){

        messageEl.innerText =
        "鏡頭還沒準備完成";

        return;
    }


    navigation =
    false;


    targetGuide =
    null;

    liveGuide =
    null;

    liveHistory =
    [];


    compositionEl.innerText =
    "AI 分析中";


    descEl.innerText =
    "尋找穩定的主要透視線";


    scoreEl.innerHTML =
    `-- <small>/100</small>`;


    messageEl.innerText =
    "✨ 請保持手機不動...";


    /*
    V5.7.2：
    從3幀增加為5幀。
    */

    const results = [];

    let count =
    0;


    const timer =
    setInterval(()=>{

        const result =
        analyzePerspective();


        if(result){

            results.push(
                result
            );

        }


        count++;


        if(
            count >= 5
        ){

            clearInterval(
                timer
            );


            finishAI(
                results
            );

        }

    },150);

}



/* =========================================
   MEDIAN
========================================= */

function median(values){

    if(
        !values ||
        values.length === 0
    ){

        return 0;

    }


    const sorted =
    values
    .slice()
    .sort(
        (a,b)=>a-b
    );


    const middle =
    Math.floor(
        sorted.length/2
    );


    if(
        sorted.length % 2
    ){

        return sorted[
            middle
        ];

    }


    return(
        sorted[middle-1]
        +
        sorted[middle]
    )/2;

}



/* =========================================
   FINISH AI
========================================= */

function finishAI(results){

    if(
        results.length < 2
    ){

        failPerspective();

        return;
    }


    /*
    V5.7.2：
    不再只挑 confidence 最高的單幀。

    先找5幀的中位消失點，
    再選最接近中位位置的結果。

    這樣比較不會被單幀雜訊騙走。
    */


    const medianX =
    median(
        results.map(
            r=>r.vx
        )
    );


    const medianY =
    median(
        results.map(
            r=>r.vy
        )
    );


    let best =
    null;


    let bestDistance =
    Infinity;


    results.forEach(r=>{

        const d =
        Math.hypot(

            r.vx -
            medianX,

            r.vy -
            medianY

        );


        if(
            d <
            bestDistance
        ){

            bestDistance =
            d;

            best =
            r;

        }

    });


    if(
        !best ||
        best.confidence < .32
    ){

        failPerspective();

        return;
    }


    /*
    判斷構圖類型後鎖住。

    AI導航途中不再切換模式。
    */

    lockedMode =
    best.type;


    /*
    ★ V5.7.2 最大修改

    targetGuide 不再等於
    「目前的消失點」。

    目前消失點 = liveGuide。

    目標消失點則放在
    畫面理想構圖區。

    這樣才會真的有：
    綠點 → 白圈
    的導航意義。
    */


    let targetX =
    .50;


    let targetY =
    .40;


    if(
        lockedMode ===
        "v"
    ){

        /*
        V型構圖的匯聚點
        可以稍低一些。
        */

        targetY =
        .58;

    }


    if(
        lockedMode ===
        "inverseV"
    ){

        /*
        道路 / 走廊透視
        消失點通常放在
        中上區域。
        */

        targetY =
        .40;

    }


    /*
    白色目標線的方向，
    保留第一次穩定分析的
    左右線幾何。
    */

    targetGuide = {

        type:
        lockedMode,

        confidence:
        best.confidence,

        vx:
        targetX,

        vy:
        targetY,

        left:{
            x:
            best.left.x,

            y:
            best.left.y
        },

        right:{
            x:
            best.right.x,

            y:
            best.right.y
        }

    };


    /*
    目標資料硬鎖。
    */

    Object.freeze(
        targetGuide.left
    );

    Object.freeze(
        targetGuide.right
    );

    Object.freeze(
        targetGuide
    );


    /*
    現在位置 =
    AI分析當下真正消失點。
    */

    liveGuide =
    JSON.parse(
        JSON.stringify(best)
    );


    liveHistory =
    [
        JSON.parse(
            JSON.stringify(best)
        )
    ];


    navigation =
    true;


    /*
    一開始就依距離算分數，
    不再拿 confidence 當分數。
    */

    updateNavigationScore();


    updateModeUI();


    messageEl.innerText =
    "🔒 白圈是目標，移動手機讓綠點靠近白圈";

}



/* =========================================
   FAIL
========================================= */

function failPerspective(){

    navigation =
    false;

    targetGuide =
    null;

    liveGuide =
    null;

    liveHistory =
    [];


    currentScore =
    0;


    scoreEl.innerHTML =
    `-- <small>/100</small>`;


    compositionEl.innerText =
    "未找到明確透視";


    descEl.innerText =
    "請對準道路、走廊或明顯收斂線";


    messageEl.innerText =
    "📱 換個角度，再按 AI 自動";

}



/* =========================================
   MODE UI
========================================= */

function updateModeUI(){

    if(
        lockedMode ===
        "inverseV"
    ){

        compositionEl.innerText =
        "▽ 倒 V・透視";


        descEl.innerText =
        "讓綠色目前點移向白色目標點";

    }
    else
    if(
        lockedMode ===
        "v"
    ){

        compositionEl.innerText =
        "V 型構圖";


        descEl.innerText =
        "讓綠色目前點移向白色目標點";

    }
    else{

        compositionEl.innerText =
        "引導線";


        descEl.innerText =
        "沿著畫面提示調整";

    }

}



/* =========================================
   MANUAL MODE
========================================= */

function manualMode(
    mode,
    button
){

    activateButton(
        button
    );


    navigation =
    false;

    liveGuide =
    null;

    liveHistory =
    [];


    lockedMode =
    mode;


    if(
        mode ===
        "v"
    ){

        targetGuide = {

            type:"v",

            vx:.50,
            vy:.58,

            confidence:1,

            left:{
                x:.18,
                y:.15
            },

            right:{
                x:.82,
                y:.15
            }

        };


        compositionEl.innerText =
        "V 型構圖";


        descEl.innerText =
        "手動構圖模板";


        messageEl.innerText =
        "V 型構圖模板";

    }
    else
    if(
        mode ===
        "inverseV"
    ){

        targetGuide = {

            type:"inverseV",

            vx:.50,
            vy:.40,

            confidence:1,

            left:{
                x:.08,
                y:.95
            },

            right:{
                x:.92,
                y:.95
            }

        };


        compositionEl.innerText =
        "▽ 倒 V・透視";


        descEl.innerText =
        "道路、走廊、鐵軌透視";


        messageEl.innerText =
        "倒 V 透視模板";

    }
    else{

        targetGuide =
        null;


        compositionEl.innerText =
        "引導線";


        descEl.innerText =
        "功能後續加入";


        messageEl.innerText =
        "↗ 引導線模式";

    }


    currentScore =
    70;


    updateScoreUI();

}



/* =========================================
   ANALYZE PERSPECTIVE
========================================= */

function analyzePerspective(){

    const W =
    ac.width;

    const H =
    ac.height;


    if(
        video.readyState < 2
    ){

        return null;

    }


    ax.drawImage(
        video,
        0,
        0,
        W,
        H
    );


    const image =
    ax.getImageData(
        0,
        0,
        W,
        H
    );


    const data =
    image.data;


    const gray =
    new Float32Array(
        W*H
    );


    for(
        let i=0;
        i<W*H;
        i++
    ){

        const p =
        i*4;


        gray[i] =

        data[p]*.299

        +

        data[p+1]*.587

        +

        data[p+2]*.114;

    }


    const edge =
    new Float32Array(
        W*H
    );


    const direction =
    new Float32Array(
        W*H
    );


    const strengths =
    [];


    /*
    Sobel
    */

    for(
        let y=1;
        y<H-1;
        y++
    ){

        for(
            let x=1;
            x<W-1;
            x++
        ){

            const p =
            y*W+x;


            const gx =

            -gray[p-W-1]

            +

            gray[p-W+1]

            -

            2*gray[p-1]

            +

            2*gray[p+1]

            -

            gray[p+W-1]

            +

            gray[p+W+1];


            const gy =

            -gray[p-W-1]

            -

            2*gray[p-W]

            -

            gray[p-W+1]

            +

            gray[p+W-1]

            +

            2*gray[p+W]

            +

            gray[p+W+1];


            const mag =
            Math.hypot(
                gx,
                gy
            );


            edge[p] =
            mag;


            /*
            Sobel gradient方向
            旋轉90度 =
            真正線方向。
            */

            direction[p] =
            normalizeAngle(

                Math.atan2(
                    gy,
                    gx
                )

                +

                Math.PI/2

            );


            strengths.push(
                mag
            );

        }

    }


    strengths.sort(
        (a,b)=>a-b
    );


    /*
    只取較強的8%邊緣。
    */

    const threshold =
    strengths[
        Math.floor(
            strengths.length*.92
        )
    ] || 80;



    /*
    每10x10區塊
    只取最強的斜線候選。
    */

    const cell =
    10;


    const candidates =
    [];


    for(
        let cy=0;
        cy<H;
        cy+=cell
    ){

        for(
            let cx=0;
            cx<W;
            cx+=cell
        ){

            let bestMag =
            0;

            let bx =
            0;

            let by =
            0;

            let ba =
            0;


            for(
                let y=cy;
                y<
                Math.min(
                    cy+cell,
                    H
                );
                y++
            ){

                for(
                    let x=cx;
                    x<
                    Math.min(
                        cx+cell,
                        W
                    );
                    x++
                ){

                    const p =
                    y*W+x;


                    const mag =
                    edge[p];


                    if(
                        mag <
                        threshold
                    )
                    continue;


                    const a =
                    direction[p];


                    /*
                    排除近水平
                    與近垂直。
                    */

                    const aa =
                    Math.abs(a);


                    if(
                        aa < .18
                        ||
                        aa > 1.38
                    )
                    continue;


                    if(
                        mag >
                        bestMag
                    ){

                        bestMag =
                        mag;

                        bx =
                        x;

                        by =
                        y;

                        ba =
                        a;

                    }

                }

            }


            if(
                bestMag > 0
            ){

                candidates.push({

                    x:bx,

                    y:by,

                    angle:ba,

                    strength:
                    bestMag

                });

            }

        }

    }


    if(
        candidates.length <
        8
    ){

        return null;

    }



    /*
    消失點投票。
    */

    const gridW =
    24;

    const gridH =
    18;


    const votes =
    new Float32Array(
        gridW*gridH
    );


    const pairs =
    [];


    for(
        let i=0;
        i<candidates.length;
        i++
    ){

        for(
            let j=i+1;
            j<candidates.length;
            j++
        ){

            const A =
            candidates[i];

            const B =
            candidates[j];


            let diff =
            Math.abs(

                normalizeAngle(

                    A.angle
                    -
                    B.angle

                )

            );


            if(
                diff < .32
            )
            continue;


            const p =
            intersectAngleLines(
                A,
                B
            );


            if(!p)
            continue;


            /*
            消失點必須在畫面內，
            排除最底下24%。
            */

            if(
                p.x < 0
                ||
                p.x > W
                ||
                p.y < H*.10
                ||
                p.y > H*.76
            )
            continue;


            /*
            兩條線分居交點左右。
            */

            const opposite =

            (
                A.x < p.x
                &&
                B.x > p.x
            )

            ||

            (
                B.x < p.x
                &&
                A.x > p.x
            );


            if(!opposite)
            continue;


            const spread =
            Math.abs(
                A.x-B.x
            );


            if(
                spread <
                W*.12
            )
            continue;


            const gx =
            Math.floor(

                p.x/W
                *
                gridW

            );


            const gy =
            Math.floor(

                p.y/H
                *
                gridH

            );


            if(
                gx < 0
                ||
                gx >= gridW
                ||
                gy < 0
                ||
                gy >= gridH
            )
            continue;


            const weight =

            Math.sqrt(

                A.strength
                *
                B.strength

            )

            *

            Math.min(

                1,

                spread/
                (W*.45)

            );


            votes[
                gy*gridW+gx
            ] +=
            weight;


            pairs.push({

                x:p.x,

                y:p.y,

                weight:weight

            });

        }

    }


    if(
        pairs.length <
        4
    ){

        return null;

    }



    /*
    找投票最高區。
    */

    let bestIndex =
    0;


    for(
        let i=1;
        i<votes.length;
        i++
    ){

        if(
            votes[i] >
            votes[bestIndex]
        ){

            bestIndex =
            i;

        }

    }


    const bestGX =
    bestIndex %
    gridW;


    const bestGY =
    Math.floor(
        bestIndex/gridW
    );



    /*
    收集附近交點。
    */

    const cluster =
    [];


    pairs.forEach(p=>{

        const gx =
        Math.floor(
            p.x/W*gridW
        );


        const gy =
        Math.floor(
            p.y/H*gridH
        );


        if(
            Math.abs(
                gx-bestGX
            ) <= 1

            &&

            Math.abs(
                gy-bestGY
            ) <= 1
        ){

            cluster.push(
                p
            );

        }

    });


    if(
        cluster.length <
        3
    ){

        return null;

    }



    /*
    加權平均消失點。
    */

    let sumX =
    0;

    let sumY =
    0;

    let sumWeight =
    0;


    cluster.forEach(p=>{

        sumX +=
        p.x*p.weight;


        sumY +=
        p.y*p.weight;


        sumWeight +=
        p.weight;

    });


    const vx =
    sumX/sumWeight;


    const vy =
    sumY/sumWeight;



    /*
    找通過消失點附近
    最有代表性的左右線。
    */

    let bestLeft =
    null;

    let bestRight =
    null;


    let bestLeftScore =
    0;

    let bestRightScore =
    0;


    candidates.forEach(line=>{

        const distance =
        distanceToLine(
            vx,
            vy,
            line
        );


        if(
            distance >
            W*.06
        )
        return;


        const horizontal =
        Math.abs(
            line.x-vx
        );


        const vertical =
        Math.abs(
            line.y-vy
        );


        if(
            horizontal <
            W*.10
            &&
            vertical <
            H*.10
        )
        return;


        const s =

        line.strength

        *

        (
            1+
            horizontal/W
        )

        *

        (
            1+
            vertical/H
        );


        if(
            line.x <
            vx
        ){

            if(
                s >
                bestLeftScore
            ){

                bestLeftScore =
                s;

                bestLeft =
                line;

            }

        }
        else{

            if(
                s >
                bestRightScore
            ){

                bestRightScore =
                s;

                bestRight =
                line;

            }

        }

    });


    if(
        !bestLeft
        ||
        !bestRight
    ){

        return null;

    }



    /*
    V / 倒V判斷。

    左右線主要部分
    在消失點下方 =
    道路、走廊式倒V透視。
    */

    const avgY =

    (
        bestLeft.y
        +
        bestRight.y
    )/2;


    const type =

    avgY >
    vy

    ?

    "inverseV"

    :

    "v";



    /*
    confidence =
    辨識可靠度。

    注意：
    這不是構圖分數。
    */

    const concentration =

    cluster.length

    /

    pairs.length;


    const sideBalance =

    Math.min(

        bestLeftScore,

        bestRightScore

    )

    /

    Math.max(

        bestLeftScore,

        bestRightScore

    );


    let confidence =

    .25

    +

    Math.min(
        .40,
        concentration*2.5
    )

    +

    sideBalance*.30;


    if(
        vy <
        H*.65
    ){

        confidence +=
        .08;

    }


    confidence =
    Math.max(

        0,

        Math.min(
            .98,
            confidence
        )

    );


    return{

        type:type,

        confidence:
        confidence,

        vx:
        vx/W,

        vy:
        vy/H,

        left:{

            x:
            bestLeft.x/W,

            y:
            bestLeft.y/H

        },

        right:{

            x:
            bestRight.x/W,

            y:
            bestRight.y/H

        }

    };

}



/* =========================================
   LINE INTERSECTION
========================================= */

function intersectAngleLines(
    A,
    B
){

    const adx =
    Math.cos(
        A.angle
    );


    const ady =
    Math.sin(
        A.angle
    );


    const bdx =
    Math.cos(
        B.angle
    );


    const bdy =
    Math.sin(
        B.angle
    );


    const den =

    adx*bdy

    -

    ady*bdx;


    if(
        Math.abs(den) <
        .0001
    ){

        return null;

    }


    const dx =
    B.x-A.x;


    const dy =
    B.y-A.y;


    const t =

    (
        dx*bdy

        -

        dy*bdx
    )

    /

    den;


    return{

        x:
        A.x +
        t*adx,

        y:
        A.y +
        t*ady

    };

}



/* =========================================
   DISTANCE POINT -> LINE
========================================= */

function distanceToLine(
    px,
    py,
    line
){

    const dx =
    Math.cos(
        line.angle
    );


    const dy =
    Math.sin(
        line.angle
    );


    return Math.abs(

        (px-line.x)*(-dy)

        +

        (py-line.y)*dx

    );

}



/* =========================================
   ANGLE
========================================= */

function normalizeAngle(a){

    while(
        a >
        Math.PI/2
    ){

        a -=
        Math.PI;

    }


    while(
        a <
        -Math.PI/2
    ){

        a +=
        Math.PI;

    }


    return a;

}



/* =========================================
   V5.7.2 LIVE 防抖
========================================= */

function smoothLiveGuide(now){

    /*
    保存最近5次。
    */

    liveHistory.push(

        JSON.parse(
            JSON.stringify(now)
        )

    );


    if(
        liveHistory.length >
        LIVE_HISTORY_SIZE
    ){

        liveHistory.shift();

    }


    /*
    用中位數消除突然跳點。
    */

    const stable = {

        type:
        lockedMode,

        confidence:
        median(
            liveHistory.map(
                r=>r.confidence
            )
        ),

        vx:
        median(
            liveHistory.map(
                r=>r.vx
            )
        ),

        vy:
        median(
            liveHistory.map(
                r=>r.vy
            )
        ),

        left:{

            x:
            median(
                liveHistory.map(
                    r=>r.left.x
                )
            ),

            y:
            median(
                liveHistory.map(
                    r=>r.left.y
                )
            )

        },

        right:{

            x:
            median(
                liveHistory.map(
                    r=>r.right.x
                )
            ),

            y:
            median(
                liveHistory.map(
                    r=>r.right.y
                )
            )

        }

    };


    /*
    第一次直接使用。
    */

    if(
        !liveGuide
    ){

        return stable;

    }


    /*
    限制綠點每次最多移動多少。

    防止突然從畫面左邊
    飛到右邊。
    */

    let dx =
    stable.vx -
    liveGuide.vx;


    let dy =
    stable.vy -
    liveGuide.vy;


    const distance =
    Math.hypot(
        dx,
        dy
    );


    if(
        distance >
        MAX_LIVE_STEP
    ){

        const ratio =
        MAX_LIVE_STEP /
        distance;


        dx *=
        ratio;


        dy *=
        ratio;

    }


    /*
    再做一次平滑。
    */

    stable.vx =

    liveGuide.vx

    +

    dx*LIVE_SMOOTH;


    stable.vy =

    liveGuide.vy

    +

    dy*LIVE_SMOOTH;


    stable.left.x =

    liveGuide.left.x

    +

    (
        stable.left.x
        -
        liveGuide.left.x
    )
    *
    LIVE_SMOOTH;


    stable.left.y =

    liveGuide.left.y

    +

    (
        stable.left.y
        -
        liveGuide.left.y
    )
    *
    LIVE_SMOOTH;


    stable.right.x =

    liveGuide.right.x

    +

    (
        stable.right.x
        -
        liveGuide.right.x
    )
    *
    LIVE_SMOOTH;


    stable.right.y =

    liveGuide.right.y

    +

    (
        stable.right.y
        -
        liveGuide.right.y
    )
    *
    LIVE_SMOOTH;


    return stable;

}



/* =========================================
   LIVE NAVIGATION
========================================= */

function updateNavigation(){

    if(
        !navigation
        ||
        !targetGuide
    ){

        return;

    }


    const now =
    analyzePerspective();


    if(!now){

        /*
        單次抓不到，
        不要立刻把綠點清掉。

        保留上一個位置。
        */

        currentScore =
        Math.max(
            20,
            currentScore-2
        );


        updateScoreUI();

        return;

    }


    /*
    AI已經選好模式。

    導航途中如果單幀
    被判成另一種構圖，
    不要立刻跳模式。
    */

    if(
        now.type !==
        lockedMode
    ){

        /*
        仍然可以使用它的
        消失點位置，

        但type強制維持
        原本鎖定模式。
        */

        now.type =
        lockedMode;

    }


    /*
    ★ 防抖後才給 liveGuide。
    */

    liveGuide =
    smoothLiveGuide(
        now
    );


    updateNavigationScore();

}



/* =========================================
   SCORE
========================================= */

function updateNavigationScore(){

    if(
        !targetGuide
        ||
        !liveGuide
    ){

        return;

    }


    /*
    真正構圖分數：

    現在消失點
    與
    白色目標點
    的距離。
    */

    const dx =

    liveGuide.vx

    -

    targetGuide.vx;


    const dy =

    liveGuide.vy

    -

    targetGuide.vy;


    const distance =
    Math.hypot(
        dx,
        dy
    );


    /*
    約距離0.35時接近0分，
    越靠近目標越高。
    */

    currentScore =
    Math.round(

        100

        -

        Math.min(
            100,
            distance/.35*100
        )

    );


    currentScore =
    Math.max(
        0,
        Math.min(
            100,
            currentScore
        )
    );


    updateScoreUI();


    /*
    導航提示。
    */

    const tolerance =
    .035;


    if(
        Math.abs(dx) <
        tolerance

        &&

        Math.abs(dy) <
        tolerance
    ){

        messageEl.innerText =
        "✅ 兩點重合，構圖完成，可以拍了";

        return;

    }


    /*
    dx > 0：
    綠點在白圈右側。

    畫面導航直接告訴使用者
    往哪邊調。
    */

    let horizontal =
    "";


    let vertical =
    "";


    if(
        dx >
        tolerance
    ){

        horizontal =
        "⬅️ 往左調";

    }
    else
    if(
        dx <
        -tolerance
    ){

        horizontal =
        "➡️ 往右調";

    }


    if(
        dy >
        tolerance
    ){

        vertical =
        "⬆️ 往上調";

    }
    else
    if(
        dy <
        -tolerance
    ){

        vertical =
        "⬇️ 往下調";

    }


    if(
        horizontal
        &&
        vertical
    ){

        messageEl.innerText =

        horizontal

        +

        "　"

        +

        vertical;

    }
    else{

        messageEl.innerText =

        horizontal

        ||

        vertical

        ||

        "微調手機";

    }

}



/* =========================================
   SCORE UI
========================================= */

function updateScoreUI(){

    scoreEl.innerHTML =

    `${currentScore} <small>/100</small>`;

}



/* =========================================
   RESIZE
========================================= */

function resizeOverlay(){

    const rect =
    overlay.getBoundingClientRect();


    const dpr =
    window.devicePixelRatio
    ||
    1;


    overlay.width =
    Math.round(
        rect.width*dpr
    );


    overlay.height =
    Math.round(
        rect.height*dpr
    );


    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

}



/* =========================================
   DRAW TARGET GUIDE
========================================= */

function drawTargetGuide(){

    if(
        !targetGuide
    ){

        return;

    }


    const w =
    overlay.clientWidth;


    const h =
    overlay.clientHeight;


    const vx =
    targetGuide.vx*w;


    const vy =
    targetGuide.vy*h;


    /*
    白色目標線。

    依構圖類型畫，
    不讓它跟liveGuide跑。
    */

    let leftEnd;

    let rightEnd;


    if(
        targetGuide.type ===
        "inverseV"
    ){

        leftEnd = {
            x:w*.06,
            y:h*.94
        };


        rightEnd = {
            x:w*.94,
            y:h*.94
        };

    }
    else{

        leftEnd = {
            x:w*.12,
            y:h*.10
        };


        rightEnd = {
            x:w*.88,
            y:h*.10
        };

    }


    ctx.save();


    /*
    白色虛線。
    */

    ctx.strokeStyle =
    "rgba(255,255,255,.95)";


    ctx.lineWidth =
    3;


    ctx.setLineDash(
        [12,9]
    );


    ctx.beginPath();

    ctx.moveTo(
        vx,
        vy
    );

    ctx.lineTo(
        leftEnd.x,
        leftEnd.y
    );

    ctx.stroke();


    ctx.beginPath();

    ctx.moveTo(
        vx,
        vy
    );

    ctx.lineTo(
        rightEnd.x,
        rightEnd.y
    );

    ctx.stroke();



    /*
    白色目標圈。
    */

    ctx.setLineDash(
        []
    );


    ctx.strokeStyle =
    "#ffffff";


    ctx.lineWidth =
    3;


    ctx.beginPath();


    ctx.arc(
        vx,
        vy,
        18,
        0,
        Math.PI*2
    );


    ctx.stroke();



    /*
    白色十字。
    */

    ctx.beginPath();


    ctx.moveTo(
        vx-28,
        vy
    );


    ctx.lineTo(
        vx-20,
        vy
    );


    ctx.moveTo(
        vx+20,
        vy
    );


    ctx.lineTo(
        vx+28,
        vy
    );


    ctx.moveTo(
        vx,
        vy-28
    );


    ctx.lineTo(
        vx,
        vy-20
    );


    ctx.moveTo(
        vx,
        vy+20
    );


    ctx.lineTo(
        vx,
        vy+28
    );


    ctx.stroke();



    ctx.font =
    "bold 14px -apple-system,Arial";


    ctx.textAlign =
    "center";


    ctx.fillStyle =
    "#fff";


    ctx.fillText(
        "○ 目標",
        vx,
        vy-34
    );


    ctx.restore();

}



/* =========================================
   DRAW LIVE GUIDE
========================================= */

function drawLiveGuide(){

    if(
        !navigation
        ||
        !liveGuide
    ){

        return;

    }


    const w =
    overlay.clientWidth;


    const h =
    overlay.clientHeight;


    const x =
    liveGuide.vx*w;


    const y =
    liveGuide.vy*h;


    ctx.save();


    /*
    綠色目前點。
    */

    ctx.fillStyle =
    "#2cff67";


    ctx.strokeStyle =
    "#2cff67";


    ctx.lineWidth =
    2;


    ctx.beginPath();


    ctx.arc(
        x,
        y,
        7,
        0,
        Math.PI*2
    );


    ctx.fill();



    ctx.beginPath();


    ctx.arc(
        x,
        y,
        13,
        0,
        Math.PI*2
    );


    ctx.stroke();



    ctx.font =
    "bold 14px -apple-system,Arial";


    ctx.textAlign =
    "center";


    ctx.fillStyle =
    "#2cff67";


    ctx.fillText(
        "● 目前",
        x,
        y-20
    );



    /*
    從目前點連到目標點。

    使用者一眼就知道
    綠點要往哪裡去。
    */

    if(
        targetGuide
    ){

        const tx =
        targetGuide.vx*w;


        const ty =
        targetGuide.vy*h;


        ctx.strokeStyle =
        "rgba(44,255,103,.75)";


        ctx.lineWidth =
        2;


        ctx.setLineDash(
            [6,7]
        );


        ctx.beginPath();


        ctx.moveTo(
            x,
            y
        );


        ctx.lineTo(
            tx,
            ty
        );


        ctx.stroke();


        ctx.setLineDash(
            []
        );

    }


    ctx.restore();

}



/* =========================================
   DRAW LOOP
========================================= */

function drawLoop(time){

    ctx.clearRect(
        0,
        0,
        overlay.clientWidth,
        overlay.clientHeight
    );


    drawTargetGuide();


    drawLiveGuide();


    /*
    只有導航狀態
    才重新分析目前畫面。

    targetGuide完全不改。
    */

    if(
        navigation

        &&

        time -
        lastLiveAnalysis
        >
        LIVE_INTERVAL
    ){

        lastLiveAnalysis =
        time;


        updateNavigation();

    }


    requestAnimationFrame(
        drawLoop
    );

}



/* =========================================
   ZOOM
========================================= */

zoom.addEventListener(
    "input",
    async function(){

        const value =
        Number(
            this.value
        );


        zoomText.innerText =
        value.toFixed(1)
        +
        "×";


        if(
            !stream
        ){

            return;

        }


        const track =
        stream
        .getVideoTracks()[0];


        if(
            !track
            ||
            !track.getCapabilities
        ){

            return;

        }


        const capabilities =
        track.getCapabilities();


        if(
            !capabilities.zoom
        ){

            return;

        }


        try{

            const actualZoom =
            Math.min(

                capabilities.zoom.max,

                Math.max(

                    capabilities.zoom.min,

                    value

                )

            );


            await track
            .applyConstraints({

                advanced:[
                    {
                        zoom:
                        actualZoom
                    }
                ]

            });

        }
        catch(error){

            console.log(
                "zoom not supported",
                error
            );

        }

    }
);



/* =========================================
   ERROR DISPLAY
========================================= */

window.onerror =
function(
    message,
    source,
    line
){

    console.error(
        message,
        source,
        line
    );


    messageEl.innerText =
    "⚠️ 程式錯誤：" +
    message;


    return false;

};



window.addEventListener(
    "unhandledrejection",
    function(event){

        console.error(
            event.reason
        );


        messageEl.innerText =
        "⚠️ 執行錯誤，請重新整理";

    }
);



/* =========================================
   START
========================================= */

window.addEventListener(
    "resize",
    resizeOverlay
);


window.addEventListener(
    "orientationchange",
    function(){

        setTimeout(
            resizeOverlay,
            250
        );

    }
);


startCamera();


requestAnimationFrame(
    drawLoop
);

</script>
