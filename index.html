<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>MediaPipe 測試</title>

    <style>
        body {
            background: black;
            color: white;
            font-family: Arial;
            text-align: center;
            padding-top: 50px;
        }

        #status {
            font-size: 24px;
            margin: 20px;
        }

        #detail {
            font-size: 16px;
            padding: 20px;
            word-break: break-all;
        }
    </style>

    <script
        type="module"
        src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/vision_bundle.mjs"
        crossorigin="anonymous">
    </script>

</head>

<body>

<h2>阿策 AI 測試</h2>

<div id="status">
    MediaPipe 載入中...
</div>

<div id="detail">
</div>

<script type="module">

const status =
    document.getElementById("status");

const detail =
    document.getElementById("detail");

try {

    const module =
        await import(
            "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/vision_bundle.mjs"
        );

    status.innerText =
        "✅ MediaPipe 程式載入成功";

    detail.innerText =
        "下一步可以開始載入人臉模型";

    console.log(module);

}

catch(error) {

    status.innerText =
        "❌ MediaPipe 載入失敗";

    detail.innerText =
        error.name + "：" + error.message;
}

</script>

</body>
</html>
