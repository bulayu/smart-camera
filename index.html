        V5.8.6｜道路邊界鎖定／除錯版
    </div>

</div>


<script>

/* =========================================================

 AI 構圖助手 V5.8.6

 道路邊界鎖定 / 除錯版


 這一版核心改變：

 V5.8.5：

 候選 VP
 ↓
 看下面像不像道路


 V5.8.6：

 先找畫面下方斜向長邊
 ↓
 分成 LEFT / RIGHT
 ↓
 建立左右道路線群
 ↓
 左右線群交點
 ↓
 VP


 DEBUG：

 黃色實線 = 選中的道路邊界

 黃色虛線 = 邊界延長

 綠色 = VP

========================================================= */


/* =========================================================
 DOM
========================================================= */

var video =
document.getElementById("video");

var overlay =
document.getElementById("overlay");

var ctx =
overlay.getContext("2d");

var analysisCanvas =
document.getElementById("analysisCanvas");

var ax =
analysisCanvas.getContext(
    "2d",
    {willReadFrequently:true}
);

var scoreEl =
document.getElementById("score");

var compositionEl =
document.getElementById("composition");

var descEl =
document.getElementById("desc");

var messageEl =
document.getElementById("message");

var zoom =
document.getElementById("zoom");

var zoomText =
document.getElementById("zoomText");

var debugEl =
document.getElementById("debug");


/* =========================================================
 STATE
========================================================= */

var stream = null;

var facing =
"environment";

var analyzing =
false;

var detectedPoint =
null;

var debugResult =
null;


/* =========================================================
 ANALYSIS SIZE
========================================================= */

var AW = 240;
var AH = 180;

var CELL = 8;


/* =========================================================
 UTIL
========================================================= */

function clamp(v,min,max){

    return Math.max(
        min,
        Math.min(max,v)
    );

}


function median(arr){

    if(
        !arr ||
        arr.length===0
    ){
        return 0;
    }

    var a =
    arr.slice().sort(
        function(x,y){
            return x-y;
        }
    );

    var m =
    Math.floor(
        a.length/2
    );

    if(a.length%2){
        return a[m];
    }

    return(
        a[m-1]+a[m]
    )/2;

}


function angleDifference(a,b){

    var d =
    Math.abs(a-b);

    while(d>Math.PI){
        d-=Math.PI;
    }

    if(d>Math.PI/2){
        d=Math.PI-d;
    }

    return Math.abs(d);

}


/* =========================================================
 CAMERA
========================================================= */

async function startCamera(){

    try{

        messageEl.innerText =
        "📷 正在開啟相機...";


        if(stream){

            stream
            .getTracks()
            .forEach(
                function(track){
                    track.stop();
                }
            );

        }


        stream = null;


        if(
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia
        ){

            throw new Error(
                "getUserMedia 不支援"
            );

        }


        stream =
        await navigator.mediaDevices
        .getUserMedia({

            video:{

                facingMode:{
                    ideal:facing
                },

                width:{
                    ideal:1280
                },

                height:{
                    ideal:720
                }

            },

            audio:false

        });


        video.srcObject =
        stream;


        await video.play();


        resizeOverlay();

        resetAnalysis();

    }
    catch(error){

        console.log(
            "Camera error:",
            error
        );


        var name =
        error && error.name
        ?
        error.name
        :
        "UnknownError";


        compositionEl.innerText =
        "相機無法開啟";


        if(
            name==="NotAllowedError"
        ){

            descEl.innerText =
            "相機權限被拒絕";

            messageEl.innerText =
            "❌ NotAllowedError｜請允許網站使用相機";

        }

        else if(
            name==="NotFoundError"
        ){

            descEl.innerText =
            "找不到可用相機";

            messageEl.innerText =
            "❌ NotFoundError｜找不到鏡頭";

        }

        else if(
            name==="NotReadableError"
        ){

            descEl.innerText =
            "相機可能被其他程式占用";

            messageEl.innerText =
            "❌ NotReadableError｜相機無法讀取";

        }

        else{

            descEl.innerText =
            name;

            messageEl.innerText =
            "❌ 相機錯誤："+name;

        }

    }

}


async function changeCamera(mode){

    facing =
    mode;

    await startCamera();

}


/* =========================================================
 RESET
========================================================= */

function resetAnalysis(){

    analyzing =
    false;

    detectedPoint =
    null;

    debugResult =
    null;


    scoreEl.innerHTML =
    '-- <small>%</small>';


    compositionEl.innerText =
    "等待分析";


    descEl.innerText =
    "先尋找左右道路邊界";


    messageEl.innerText =
    "✨ 固定鏡頭後，按 AI 自動分析";


    debugEl.innerText =
    "L:--｜R:--";

}


/* =========================================================
 RUN
========================================================= */

function runAI(){

    if(analyzing){
        return;
    }


    if(video.readyState<2){

        messageEl.innerText =
        "⏳ 鏡頭還沒準備完成";

        return;

    }


    analyzing =
    true;

    detectedPoint =
    null;

    debugResult =
    null;


    scoreEl.innerHTML =
    '-- <small>%</small>';


    compositionEl.innerText =
    "分析道路邊界";


    descEl.innerText =
    "正在尋找左右收斂線";


    messageEl.innerText =
    "🔍 鎖定道路左右邊界...";


    var results = [];

    var frame = 0;


    var timer =
    setInterval(
        function(){

            var r =
            analyzeRoad();

            if(r){
                results.push(r);
            }

            frame++;


            if(frame>=7){

                clearInterval(timer);

                analyzing =
                false;

                finishAnalysis(
                    results
                );

            }

        },
        170
    );

}


/* =========================================================
 FINISH MULTI FRAME
========================================================= */

function finishAnalysis(results){

    if(results.length<3){

        failAnalysis(
            "左右道路邊界不足"
        );

        return;

    }


    var mx =
    median(
        results.map(
            function(r){
                return r.vx;
            }
        )
    );


    var my =
    median(
        results.map(
            function(r){
                return r.vy;
            }
        )
    );


    /*
    去除明顯離群幀
    */

    var distances =
    results.map(
        function(r){

            return Math.hypot(
                r.vx-mx,
                r.vy-my
            );

        }
    );


    var md =
    median(distances);


    var limit =
    Math.max(
        .04,
        md*2.2
    );


    var filtered =
    results.filter(
        function(r){

            return(
                Math.hypot(
                    r.vx-mx,
                    r.vy-my
                )
                <=limit
            );

        }
    );


    if(filtered.length<3){

        failAnalysis(
            "道路交點不穩定"
        );

        return;

    }


    mx =
    median(
        filtered.map(
            function(r){
                return r.vx;
            }
        )
    );


    my =
    median(
        filtered.map(
            function(r){
                return r.vy;
            }
        )
    );


    /*
    找離最終 VP 最近的一幀，
    用它畫 debug 邊界。
    */

    var bestFrame =
    filtered[0];

    var bestDistance =
    999;


    for(
        var i=0;
        i<filtered.length;
        i++
    ){

        var d =
        Math.hypot(
            filtered[i].vx-mx,
            filtered[i].vy-my
        );


        if(d<bestDistance){

            bestDistance =
            d;

            bestFrame =
            filtered[i];

        }

    }


    detectedPoint = {

        vx:mx,
        vy:my

    };


    debugResult = {

        left:
        bestFrame.left,

        right:
        bestFrame.right,

        leftCount:
        bestFrame.leftCount,

        rightCount:
        bestFrame.rightCount

    };


    /*
    幀穩定度
    */

    var spread =
    median(
        filtered.map(
            function(r){

                return Math.hypot(
                    r.vx-mx,
                    r.vy-my
                );

            }
        )
    );


    var stability =
    clamp(
        1-spread/.12,
        0,
        1
    );


    var baseConfidence =
    median(
        filtered.map(
            function(r){
                return r.confidence;
            }
        )
    );


    /*
    這一版故意不讓信心太高。

    因為現在主要目的是
    驗證道路邊界抓得對不對。
    */

    var confidence =
    Math.round(
        clamp(
            (
                baseConfidence*.72+
                stability*.28
            )*100,
            0,
            92
        )
    );


    scoreEl.innerHTML =
    confidence+
    ' <small>%</small>';


    compositionEl.innerText =
    "◎ 道路單點透視";


    descEl.innerText =
    "黃色線＝AI 判定的道路邊界";


    messageEl.innerText =
    "🔎 請檢查黃色左右邊界是否抓對";


    debugEl.innerText =
    "L:"+
    bestFrame.leftCount+
    "｜R:"+
    bestFrame.rightCount;

}


/* =========================================================
 FAIL
========================================================= */

function failAnalysis(reason){

    detectedPoint =
    null;

    debugResult =
    null;


    scoreEl.innerHTML =
    '-- <small>%</small>';


    compositionEl.innerText =
    "道路邊界不足";


    descEl.innerText =
    reason ||
    "無法形成左右道路線群";


    messageEl.innerText =
    "📱 調整畫面後重新分析";


    debugEl.innerText =
    "L:0｜R:0";

}


/* =========================================================
 SOBEL
========================================================= */

function buildEdges(){

    ax.drawImage(
        video,
        0,
        0,
        AW,
        AH
    );


    var image =
    ax.getImageData(
        0,
        0,
        AW,
        AH
    );


    var data =
    image.data;


    var gray =
    new Float32Array(
        AW*AH
    );


    for(
        var i=0;
        i<AW*AH;
        i++
    ){

        var p =
        i*4;


        gray[i] =
        data[p]*.299+
        data[p+1]*.587+
        data[p+2]*.114;

    }


    /*
    先做非常小的 3 點平滑。

    目的是降低：
    葉子
    草
    磁磚小紋理

    但不能模糊道路邊界。
    */

    var smooth =
    new Float32Array(
        AW*AH
    );


    for(
        var y=1;
        y<AH-1;
        y++
    ){

        for(
            var x=1;
            x<AW-1;
            x++
        ){

            var id =
            y*AW+x;


            smooth[id] =
            (
                gray[id]*4+
                gray[id-1]+
                gray[id+1]+
                gray[id-AW]+
                gray[id+AW]
            )/8;

        }

    }


    var magnitude =
    new Float32Array(
        AW*AH
    );


    var angle =
    new Float32Array(
        AW*AH
    );


    var values = [];


    for(
        var yy=2;
        yy<AH-2;
        yy++
    ){

        for(
            var xx=2;
            xx<AW-2;
            xx++
        ){

            var id2 =
            yy*AW+xx;


            var gx =

            -smooth[id2-AW-1]
            +
            smooth[id2-AW+1]

            -

            2*smooth[id2-1]
            +
            2*smooth[id2+1]

            -

            smooth[id2+AW-1]
            +
            smooth[id2+AW+1];


            var gy =

            -smooth[id2-AW-1]
            -
            2*smooth[id2-AW]
            -
            smooth[id2-AW+1]

            +

            smooth[id2+AW-1]
            +
            2*smooth[id2+AW]
            +
            smooth[id2+AW+1];


            var mag =
            Math.hypot(
                gx,
                gy
            );


            magnitude[id2] =
            mag;


            /*
            Sobel 是法線方向。

            +90° 轉成實際邊緣方向。
            */

            var a =
            Math.atan2(
                gy,
                gx
            )
            +
            Math.PI/2;


            while(
                a>Math.PI/2
            ){
                a-=Math.PI;
            }


            while(
                a<-Math.PI/2
            ){
                a+=Math.PI;
            }


            angle[id2] =
            a;


            values.push(mag);

        }

    }


    values.sort(
        function(a,b){
            return a-b;
        }
    );


    if(values.length===0){
        return null;
    }


    /*
    稍微提高門檻。

    5.8.6 不希望把大量葉片
    都當道路線。
    */

    var threshold =
    values[
        Math.floor(
            values.length*.91
        )
    ];


    if(
        !threshold ||
        threshold<13
    ){
        return null;
    }


    return{

        magnitude:
        magnitude,

        angle:
        angle,

        threshold:
        threshold

    };

}


/* =========================================================
 LINE CONTINUITY

 沿著候選方向前後走，
 看這條線是不是真的延續。

 道路邊界：
 通常延續較長。

 葉子：
 通常很快中斷。
========================================================= */

function lineContinuity(
    x,
    y,
    a,
    magnitude,
    edgeAngle,
    threshold
){

    var dx =
    Math.cos(a);

    var dy =
    Math.sin(a);


    var hit = 0;
    var total = 0;


    /*
    比 5.8.5 看得更遠
    */

    for(
        var s=-42;
        s<=42;
        s+=6
    ){

        if(
            Math.abs(s)<4
        ){
            continue;
        }


        var px =
        Math.round(
            x+dx*s
        );


        var py =
        Math.round(
            y+dy*s
        );


        if(
            px<2 ||
            px>=AW-2 ||
            py<2 ||
            py>=AH-2
        ){
            continue;
        }


        total++;


        var found =
        false;


        /*
        5x5 小範圍找同方向邊
        */

        for(
            var oy=-2;
            oy<=2 && !found;
            oy++
        ){

            for(
                var ox=-2;
                ox<=2;
                ox++
            ){

                var id =
                (py+oy)*AW+
                (px+ox);


                if(
                    magnitude[id]
                    <
                    threshold*.55
                ){
                    continue;
                }


                if(
                    angleDifference(
                        edgeAngle[id],
                        a
                    )
                    <
                    .22
                ){

                    found =
                    true;

                    break;

                }

            }

        }


        if(found){
            hit++;
        }

    }


    if(total===0){
        return 0;
    }


    return hit/total;

}


/* =========================================================
 EXTRACT ROAD CANDIDATES

 這次只把「有可能成為道路邊界」
 的線抽出來。

 重點：
 來源要偏中下半部。
========================================================= */

function extractRoadCandidates(
    magnitude,
    edgeAngle,
    threshold
){

    var candidates = [];


    /*
    不從畫面最上面開始。

    道路線的來源應該主要存在
    中下區域。
    */

    var startY =
    Math.floor(
        AH*.38
    );


    for(
        var cy=startY;
        cy<AH;
        cy+=CELL
    ){

        for(
            var cx=0;
            cx<AW;
            cx+=CELL
        ){

            var best = null;


            for(
                var y=cy;
                y<
                Math.min(
                    cy+CELL,
                    AH
                );
                y++
            ){

                for(
                    var x=cx;
                    x<
                    Math.min(
                        cx+CELL,
                        AW
                    );
                    x++
                ){

                    var id =
                    y*AW+x;


                    var mag =
                    magnitude[id];


                    if(
                        mag<threshold
                    ){
                        continue;
                    }


                    var a =
                    edgeAngle[id];


                    var absA =
                    Math.abs(a);


                    /*
                    太水平：
                    地磚橫線、陰影。

                    太垂直：
                    樹幹、柱子。
                    */

                    if(
                        absA<.16 ||
                        absA>1.38
                    ){
                        continue;
                    }


                    if(
                        !best ||
                        mag>best.mag
                    ){

                        best = {

                            x:x,
                            y:y,
                            angle:a,
                            mag:mag

                        };

                    }

                }

            }


            if(!best){
                continue;
            }


            var continuity =
            lineContinuity(
                best.x,
                best.y,
                best.angle,
                magnitude,
                edgeAngle,
                threshold
            );


            /*
            太碎不要
            */

            if(
                continuity<.20
            ){
                continue;
            }


            best.continuity =
            continuity;


            /*
            來源越低，
            越像近景道路證據。
            */

            var depth =
            clamp(
                (
                    best.y-
                    AH*.32
                )
                /
                (
                    AH*.68
                ),
                0,
                1
            );


            /*
            強度不允許無限放大。
            */

            var strength =
            clamp(
                best.mag/
                (threshold*2.3),
                .45,
                1.10
            );


            best.weight =
            (
                .45+
                continuity*.75
            )
            *
            (
                .72+
                depth*.42
            )
            *
            strength;


            candidates.push(
                best
            );

        }

    }


    return candidates;

}


/* =========================================================
 CLASSIFY LEFT / RIGHT

 Canvas 座標：

 x →
 y ↓


 左道路邊界：

 從近處往遠處看，
 通常往「右上」走。


 右道路邊界：

 從近處往遠處看，
 通常往「左上」走。


 由於 angle 正負會受方向表示方式影響，
 不直接只看 angle 正負。

 改用候選線延伸到上方某高度後，
 看它往中心哪一側移動。
========================================================= */

function projectXAtY(
    line,
    targetY
){

    var dx =
    Math.cos(
        line.angle
    );

    var dy =
    Math.sin(
        line.angle
    );


    if(
        Math.abs(dy)<.05
    ){
        return null;
    }


    var t =
    (
        targetY-line.y
    )
    /
    dy;


    return(
        line.x+
        dx*t
    );

}


/* =========================================================
 BUILD SIDE GROUPS
========================================================= */

function buildRoadGroups(
    candidates
){

    var left = [];
    var right = [];


    var center =
    AW*.50;


    /*
    投影到約畫面 35% 高度。

    真道路邊界應該往遠方中心收。
    */

    var targetY =
    AH*.35;


    for(
        var i=0;
        i<candidates.length;
        i++
    ){

        var L =
        candidates[i];


        var projectedX =
        projectXAtY(
            L,
            targetY
        );


        if(
            projectedX===null ||
            !isFinite(projectedX)
        ){
            continue;
        }


        /*
        左側來源
        */

        if(
            L.x<
            center-AW*.035
        ){

            /*
            往上延伸後，
            必須比原位置更靠右。

            也就是向畫面中心收斂。
            */

            if(
                projectedX>
                L.x+AW*.018
            ){

                /*
                不接受非常誇張的橫跨。
                */

                if(
                    projectedX<
                    AW*1.05
                ){

                    L.projectedX =
                    projectedX;

                    left.push(L);

                }

            }

        }


        /*
        右側來源
        */

        else if(
            L.x>
            center+AW*.035
        ){

            /*
            往上後應往左收斂
            */

            if(
                projectedX<
                L.x-AW*.018
            ){

                if(
                    projectedX>
                    -AW*.05
                ){

                    L.projectedX =
                    projectedX;

                    right.push(L);

                }

            }

        }

    }


    return{

        left:left,
        right:right

    };

}


/* =========================================================
 LINE INTERSECTION
========================================================= */

function lineIntersection(A,B){

    var dx1 =
    Math.cos(A.angle);

    var dy1 =
    Math.sin(A.angle);


    var dx2 =
    Math.cos(B.angle);

    var dy2 =
    Math.sin(B.angle);


    var denominator =
    dx1*dy2-
    dy1*dx2;


    if(
        Math.abs(
            denominator
        )
        <
        .00001
    ){
        return null;
    }


    var rx =
    B.x-A.x;

    var ry =
    B.y-A.y;


    var t =
    (
        rx*dy2-
        ry*dx2
    )
    /
    denominator;


    return{

        x:
        A.x+t*dx1,

        y:
        A.y+t*dy1

    };

}


/* =========================================================
 FIND VP FROM LEFT / RIGHT GROUPS

 不選「最強的一對」。

 對多組左右線交點投票，
 再找交點群的中位數。

 這樣單根樹枝比較難霸榜。
========================================================= */

function findRoadVP(
    left,
    right
){

    var intersections = [];


    for(
        var i=0;
        i<left.length;
        i++
    ){

        for(
            var j=0;
            j<right.length;
            j++
        ){

            var A =
            left[i];

            var B =
            right[j];


            /*
            兩線方向太接近平行
            不算。
            */

            var ad =
            angleDifference(
                A.angle,
                B.angle
            );


            if(ad<.16){
                continue;
            }


            var p =
            lineIntersection(
                A,
                B
            );


            if(!p){
                continue;
            }


            /*
            VP 必須大致位於畫面遠方。

            這只是寬鬆範圍，
            不是硬鎖道路盡頭。
            */

            if(
                p.x<
                -AW*.05 ||
                p.x>
                AW*1.05
            ){
                continue;
            }


            if(
                p.y<
                AH*.10 ||
                p.y>
                AH*.70
            ){
                continue;
            }


            /*
            交點應位於兩條來源線上方。
            */

            if(
                p.y>
                Math.min(
                    A.y,
                    B.y
                )
                -
                AH*.03
            ){
                continue;
            }


            /*
            左右來源跨度。

            兩條線如果本來就靠很近，
            很可能只是中央磁磚紋理。
            */

            var sourceSpan =
            B.x-A.x;


            if(
                sourceSpan<
                AW*.12
            ){
                continue;
            }


            /*
            近景來源稍微加權。
            */

            var sourceDepth =
            (
                A.y+
                B.y
            )
            /
            (AH*2);


            var weight =
            Math.sqrt(
                A.weight*
                B.weight
            )
            *
            (
                .70+
                sourceDepth*.45
            );


            intersections.push({

                x:p.x,
                y:p.y,

                weight:weight,

                left:A,
                right:B

            });

        }

    }


    if(
        intersections.length<3
    ){
        return null;
    }


    /*
    第一輪中位數
    */

    var mx =
    median(
        intersections.map(
            function(p){
                return p.x;
            }
        )
    );


    var my =
    median(
        intersections.map(
            function(p){
                return p.y;
            }
        )
    );


    /*
    去掉離群交點
    */

    var distances =
    intersections.map(
        function(p){

            return Math.hypot(
                p.x-mx,
                p.y-my
            );

        }
    );


    var md =
    median(distances);


    var limit =
    Math.max(
        AW*.065,
        md*1.8
    );


    var good =
    intersections.filter(
        function(p){

            return(
                Math.hypot(
                    p.x-mx,
                    p.y-my
                )
                <=limit
            );

        }
    );


    if(
        good.length<2
    ){
        return null;
    }


    /*
    第二輪中位數
    */

    mx =
    median(
        good.map(
            function(p){
                return p.x;
            }
        )
    );


    my =
    median(
        good.map(
            function(p){
                return p.y;
            }
        )
    );


    /*
    找出最支持最終交點的
    左右線。

    這兩條會顯示成黃色 debug 線。
    */

    var bestPair =
    null;

    var bestScore =
    -1;


    for(
        var k=0;
        k<good.length;
        k++
    ){

        var P =
        good[k];


        var distance =
        Math.hypot(
            P.x-mx,
            P.y-my
        );


        var closeness =
        1-
        clamp(
            distance/
            (AW*.12),
            0,
            1
        );


        var score =
        P.weight*
        (
            .35+
            closeness*.65
        );


        /*
        更偏好來源在中下部的線
        */

        var sourceY =
        (
            P.left.y+
            P.right.y
        )/2;


        score *=
        (
            .75+
            (sourceY/AH)*.35
        );


        if(
            score>
            bestScore
        ){

            bestScore =
            score;

            bestPair =
            P;

        }

    }


    if(!bestPair){
        return null;
    }


    /*
    交點集中度
    */

    var spread =
    median(
        good.map(
            function(p){

                return Math.hypot(
                    p.x-mx,
                    p.y-my
                );

            }
        )
    );


    var cluster =
    clamp(
        1-spread/(AW*.16),
        0,
        1
    );


    /*
    支持比例
    */

    var support =
    clamp(
        good.length/12,
        0,
        1
    );


    /*
    左右線延續程度
    */

    var continuity =
    clamp(
        (
            bestPair.left.continuity+
            bestPair.right.continuity
        )/2,
        0,
        1
    );


    /*
    近景跨度
    */

    var span =
    bestPair.right.x-
    bestPair.left.x;


    var spanScore =
    clamp(
        span/(AW*.55),
        .15,
        1
    );


    var confidence =

    .18

    +

    cluster*.28

    +

    support*.18

    +

    continuity*.20

    +

    spanScore*.16;


    confidence =
    clamp(
        confidence,
        .25,
        .90
    );


    return{

        x:mx,
        y:my,

        left:
        bestPair.left,

        right:
        bestPair.right,

        confidence:
        confidence,

        intersectionCount:
        good.length

    };

}


/* =========================================================
 MAIN ROAD ANALYSIS
========================================================= */

function analyzeRoad(){

    if(video.readyState<2){
        return null;
    }


    var edges =
    buildEdges();


    if(!edges){
        return null;
    }


    var candidates =
    extractRoadCandidates(
        edges.magnitude,
        edges.angle,
        edges.threshold
    );


    if(
        candidates.length<6
    ){
        return null;
    }


    var groups =
    buildRoadGroups(
        candidates
    );


    /*
    至少左右各兩條候選。
    */

    if(
        groups.left.length<2 ||
        groups.right.length<2
    ){
        return null;
    }


    var vp =
    findRoadVP(
        groups.left,
        groups.right
    );


    if(!vp){
        return null;
    }


    return{

        vx:
        vp.x/AW,

        vy:
        vp.y/AH,

        confidence:
        vp.confidence,

        left:
        vp.left,

        right:
        vp.right,

        leftCount:
        groups.left.length,

        rightCount:
        groups.right.length,

        intersections:
        vp.intersectionCount

    };

}


/* =========================================================
 DRAW DEBUG ROAD LINE
========================================================= */

function drawRoadLine(
    line,
    vp,
    side
){

    if(!line){
        return;
    }


    var w =
    overlay.clientWidth;

    var h =
    overlay.clientHeight;


    /*
    Analysis coordinate → screen coordinate
    */

    var sx =
    line.x/AW*w;

    var sy =
    line.y/AH*h;


    var vx =
    vp.vx*w;

    var vy =
    vp.vy*h;


    /*
    先算線往畫面底部的交點
    */

    var dx =
    Math.cos(
        line.angle
    );

    var dy =
    Math.sin(
        line.angle
    );


    var bottomY =
    AH*.98;


    var bottomX =
    line.x;


    if(
        Math.abs(dy)>.03
    ){

        var t =
        (
            bottomY-line.y
        )/dy;


        bottomX =
        line.x+
        dx*t;

    }


    bottomX =
    clamp(
        bottomX,
        -AW*.20,
        AW*1.20
    );


    var bx =
    bottomX/AW*w;

    var by =
    bottomY/AH*h;


    ctx.save();


    /*
    黃色實線：
    從候選道路來源往近處延伸。
    */

    ctx.strokeStyle =
    "#ffd400";

    ctx.lineWidth =
    4;

    ctx.setLineDash([]);


    ctx.beginPath();

    ctx.moveTo(
        sx,
        sy
    );

    ctx.lineTo(
        bx,
        by
    );

    ctx.stroke();


    /*
    黃色虛線：
    往 VP 延伸。
    */

    ctx.lineWidth =
    2.5;

    ctx.setLineDash(
        [8,7]
    );


    ctx.beginPath();

    ctx.moveTo(
        sx,
        sy
    );

    ctx.lineTo(
        vx,
        vy
    );

    ctx.stroke();


    /*
    L / R 標籤
    */

    ctx.setLineDash([]);

    ctx.fillStyle =
    "#ffd400";

    ctx.font =
    "bold 14px -apple-system,Arial";


    ctx.fillText(
        side,
        sx+8,
        sy-8
    );


    ctx.restore();

}


/* =========================================================
 DRAW VP
========================================================= */

function drawVP(){

    if(!detectedPoint){
        return;
    }


    var w =
    overlay.clientWidth;

    var h =
    overlay.clientHeight;


    var x =
    detectedPoint.vx*w;

    var y =
    detectedPoint.vy*h;


    ctx.save();


    ctx.strokeStyle =
    "#2cff67";

    ctx.fillStyle =
    "#2cff67";

    ctx.lineWidth =
    4;

    ctx.setLineDash([]);


    /*
    圓
    */

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        25,
        0,
        Math.PI*2
    );

    ctx.stroke();


    /*
    中心
    */

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        9,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
    十字
    */

    ctx.lineWidth =
    3;

    ctx.beginPath();


    ctx.moveTo(
        x-43,
        y
    );

    ctx.lineTo(
        x-30,
        y
    );


    ctx.moveTo(
        x+30,
        y
    );

    ctx.lineTo(
        x+43,
        y
    );


    ctx.moveTo(
        x,
        y-43
    );

    ctx.lineTo(
        x,
        y-30
    );


    ctx.moveTo(
        x,
        y+30
    );

    ctx.lineTo(
        x,
        y+43
    );


    ctx.stroke();


    /*
    LABEL
    */

    ctx.font =
    "bold 16px -apple-system,Arial";

    ctx.textAlign =
    "center";


    ctx.fillText(
        "● AI 消失點",
        x,
        y-50
    );


    ctx.restore();

}


/* =========================================================
 DRAW DEBUG
========================================================= */

function drawDebug(){

    if(
        !debugResult ||
        !detectedPoint
    ){
        return;
    }


    /*
    先畫黃色道路線，
    再畫綠色 VP。
    */

    drawRoadLine(
        debugResult.left,
        detectedPoint,
        "L"
    );


    drawRoadLine(
        debugResult.right,
        detectedPoint,
        "R"
    );

}


/* =========================================================
 RESIZE
========================================================= */

function resizeOverlay(){

    var rect =
    overlay.getBoundingClientRect();


    var dpr =
    window.devicePixelRatio ||
    1;


    overlay.width =
    Math.round(
        rect.width*dpr
    );


    overlay.height =
    Math.round(
        rect.height*dpr
    );


    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

}


/* =========================================================
 LOOP
========================================================= */

function loop(){

    ctx.clearRect(
        0,
        0,
        overlay.clientWidth,
        overlay.clientHeight
    );


    drawDebug();

    drawVP();


    requestAnimationFrame(
        loop
    );

}


/* =========================================================
 ZOOM
========================================================= */

zoom.addEventListener(
    "input",
    async function(){

        var value =
        Number(
            this.value
        );


        zoomText.innerText =
        value.toFixed(1)+
        "×";


        /*
        Zoom 改變後，
        舊分析結果失效。
        */

        detectedPoint =
        null;

        debugResult =
        null;


        if(!stream){
            return;
        }


        var tracks =
        stream.getVideoTracks();


        if(
            tracks.length===0
        ){
            return;
        }


        var track =
        tracks[0];


        if(
            !track.getCapabilities
        ){
            return;
        }


        var capabilities =
        track.getCapabilities();


        if(
            !capabilities.zoom
        ){
            return;
        }


        try{

            var actualZoom =
            clamp(
                value,
                capabilities.zoom.min,
                capabilities.zoom.max
            );


            await track.applyConstraints({

                advanced:[
                    {
                        zoom:
                        actualZoom
                    }
                ]

            });

        }
        catch(error){

            console.log(
                "Zoom unsupported",
                error
            );

        }

    }
);


/* =========================================================
 ERROR
========================================================= */

window.onerror =
function(
    message,
    source,
    line
){

    console.log(
        message,
        source,
        line
    );


    messageEl.innerText =
    "⚠️ 程式錯誤："+
    message+
    "｜第"+
    line+
    "行";


    return false;

};


window.addEventListener(
    "unhandledrejection",
    function(event){

        console.log(
            event.reason
        );


        messageEl.innerText =
        "⚠️ 執行錯誤，請重新整理";

    }
);


/* =========================================================
 EVENTS
========================================================= */

window.addEventListener(
    "resize",
    resizeOverlay
);


window.addEventListener(
    "orientationchange",
    function(){

        setTimeout(
            resizeOverlay,
            250
        );

    }
);


/* =========================================================
 START
========================================================= */

startCamera();

requestAnimationFrame(
    loop
);

</script>
