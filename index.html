<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>構圖導航 V6.1</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

body{
    display:flex;
    flex-direction:column;
}

#cameraArea{
    position:relative;
    width:100%;
    flex:1;
    min-height:0;
    overflow:hidden;
    background:#111;
}

#video{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
}

#overlay{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
    z-index:5;
}

#info{
    position:absolute;
    top:14px;
    left:14px;
    max-width:270px;
    padding:13px 16px;
    border-radius:18px;
    background:rgba(0,0,0,.70);
    backdrop-filter:blur(7px);
    z-index:10;
}

#modeTitle{
    font-size:13px;
    opacity:.72;
    margin-bottom:4px;
}

#composition{
    font-size:23px;
    font-weight:800;
}

#desc{
    margin-top:5px;
    font-size:13px;
    line-height:1.45;
    opacity:.85;
}

#message{
    position:absolute;
    left:50%;
    bottom:14px;
    transform:translateX(-50%);
    width:92%;
    padding:12px;
    border-radius:17px;
    background:rgba(0,0,0,.78);
    text-align:center;
    font-size:14px;
    font-weight:700;
    z-index:10;
}

#version{
    position:absolute;
    left:7px;
    bottom:3px;
    font-size:10px;
    opacity:.55;
    z-index:20;
}

#controls{
    flex:0 0 auto;
    padding:9px 11px calc(11px + env(safe-area-inset-bottom));
    background:#000;
}

#modeRow{
    display:flex;
    gap:7px;
    overflow-x:auto;
    padding-bottom:8px;
    scrollbar-width:none;
}

#modeRow::-webkit-scrollbar,
#compositionRow::-webkit-scrollbar{
    display:none;
}

.modeBtn{
    flex:0 0 auto;
    min-width:67px;
    padding:8px 8px;
    border:0;
    border-radius:17px;
    background:#242424;
    color:#fff;
    font-size:12px;
    font-weight:700;
}

.modeBtn.active{
    background:#fff;
    color:#000;
}

.modeIcon{
    display:block;
    font-size:19px;
    margin-bottom:2px;
}

.autoBtn{
    background:#292929;
}

.autoBtn.active{
    background:#ffd400;
    color:#000;
}

#compositionRow{
    display:flex;
    gap:7px;
    overflow-x:auto;
    padding-bottom:8px;
}

.compBtn{
    flex:0 0 auto;
    padding:7px 12px;
    border-radius:17px;
    border:1px solid #444;
    background:#151515;
    color:#ddd;
    font-size:12px;
}

.compBtn.active{
    border-color:#ffd400;
    color:#ffd400;
}

#autoButton{
    width:100%;
    padding:12px;
    border:0;
    border-radius:24px;
    background:#fff;
    color:#000;
    font-size:16px;
    font-weight:800;
    margin-bottom:8px;
}

#bottomRow{
    display:flex;
    align-items:center;
    gap:7px;
}

.cameraBtn{
    flex:0 0 auto;
    padding:8px 11px;
    border:0;
    border-radius:18px;
    background:#292929;
    color:#fff;
    font-size:12px;
}

#zoomArea{
    flex:1;
    display:flex;
    align-items:center;
    gap:5px;
}

#zoom{
    flex:1;
    min-width:50px;
}

#zoomText{
    min-width:32px;
    font-size:11px;
}

#status{
    margin-top:6px;
    text-align:center;
    font-size:10px;
    opacity:.40;
}
</style>
</head>

<body>

<div id="cameraArea">

    <video id="video" autoplay playsinline muted></video>
    <canvas id="overlay"></canvas>

    <div id="info">
        <div id="modeTitle">✨ 自動構圖</div>
        <div id="composition">準備分析</div>
        <div id="desc">選擇拍攝模式，或使用自動構圖</div>
    </div>

    <div id="message">
        📷 對準想拍攝的畫面
    </div>

    <div id="version">V6.1</div>

</div>

<div id="controls">

    <div id="modeRow">

        <button class="modeBtn autoBtn active"
        onclick="selectMode('auto',this)">
            <span class="modeIcon">✨</span>自動
        </button>

        <button class="modeBtn"
        onclick="selectMode('landscape',this)">
            <span class="modeIcon">🏞️</span>風景
        </button>

        <button class="modeBtn"
        onclick="selectMode('street',this)">
            <span class="modeIcon">🏙️</span>街景
        </button>

        <button class="modeBtn"
        onclick="selectMode('portrait',this)">
            <span class="modeIcon">👤</span>人像
        </button>

        <button class="modeBtn"
        onclick="selectMode('night',this)">
            <span class="modeIcon">🌙</span>夜景
        </button>

        <button class="modeBtn"
        onclick="selectMode('indoor',this)">
            <span class="modeIcon">🏠</span>室內
        </button>

        <button class="modeBtn"
        onclick="selectMode('food',this)">
            <span class="modeIcon">🍜</span>美食
        </button>

        <button class="modeBtn"
        onclick="selectMode('macro',this)">
            <span class="modeIcon">🌸</span>近拍
        </button>

        <button class="modeBtn"
        onclick="selectMode('pet',this)">
            <span class="modeIcon">🐶</span>寵物
        </button>

        <button class="modeBtn"
        onclick="selectMode('product',this)">
            <span class="modeIcon">📦</span>商品
        </button>

    </div>

    <div id="compositionRow"></div>

    <button id="autoButton" onclick="runComposition()">
        ✨ 自動構圖
    </button>

    <div id="bottomRow">

        <button class="cameraBtn"
        onclick="changeCamera('user')">
            🤳 前鏡
        </button>

        <button class="cameraBtn"
        onclick="changeCamera('environment')">
            📷 後鏡
        </button>

        <div id="zoomArea">
            <span style="font-size:11px">倍率</span>

            <input id="zoom"
            type="range"
            min="1"
            max="3"
            step=".1"
            value="1">

            <span id="zoomText">1.0×</span>
        </div>

    </div>

    <div id="status">
        V6.1｜智慧構圖架構版
    </div>

</div>

<script>

/* =========================================================
   構圖導航 V6.1
   AI 字樣全面移除

   架構：
   自動 + 9 大拍攝模式

   V6.1：
   1. 六大模式擴充為九大模式
   2. 加入「自動」
   3. 建立各模式構圖知識庫
   4. 建立構圖推薦流程
   5. 保留相機 / Zoom / 輔助線
========================================================= */

var video=document.getElementById("video");
var overlay=document.getElementById("overlay");
var ctx=overlay.getContext("2d");
var messageEl=document.getElementById("message");
var modeTitle=document.getElementById("modeTitle");
var compositionEl=document.getElementById("composition");
var descEl=document.getElementById("desc");
var compositionRow=document.getElementById("compositionRow");
var zoom=document.getElementById("zoom");
var zoomText=document.getElementById("zoomText");

var stream=null;
var facing="environment";

var currentMode="auto";
var currentComposition=null;


/* =========================================================
   構圖知識庫
========================================================= */

var database={

landscape:{
    icon:"🏞️",
    name:"風景",
    default:"thirds",
    comps:[
        ["thirds","三分法","安排天空、地面與主要景物的比例"],
        ["golden","黃金比例","讓主要視覺重心落在自然舒適的位置"],
        ["leading","引導線","利用道路、河流或地形引導視線"],
        ["center","中央構圖","適合明確而突出的單一主體"],
        ["frame","框景","利用樹木或前景形成天然畫框"]
    ]
},

street:{
    icon:"🏙️",
    name:"街景",
    default:"leading",
    comps:[
        ["leading","引導線","利用道路與建築線條引導視線"],
        ["perspective","單點透視","利用收斂線條強化空間深度"],
        ["symmetry","對稱","適合左右結構明顯的街景"],
        ["thirds","三分法","讓主要街景主體避開死板置中"],
        ["diagonal","對角線","利用斜向結構增加動態感"]
    ]
},

portrait:{
    icon:"👤",
    name:"人像",
    default:"portraitThirds",
    comps:[
        ["portraitThirds","三分人像","將人物安排在三分位置"],
        ["portraitCenter","中央人像","適合正面人物與強烈視線"],
        ["lookSpace","視線留白","人物面向哪裡，就在前方保留空間"],
        ["fullbody","全身構圖","保留頭頂與腳部並避免關節裁切"],
        ["environment","環境人像","人物與背景共同說明場景"]
    ]
},

night:{
    icon:"🌙",
    name:"夜景",
    default:"thirds",
    comps:[
        ["thirds","三分夜景","平衡天空、建築與燈光"],
        ["leading","燈光引導","利用路燈或光軌引導視線"],
        ["reflection","倒影","利用水面或玻璃形成上下呼應"],
        ["symmetry","對稱","適合夜間建築與倒影"],
        ["center","中央構圖","突出單一夜景主體"]
    ]
},

indoor:{
    icon:"🏠",
    name:"室內",
    default:"symmetry",
    comps:[
        ["symmetry","對稱","保持左右空間平衡"],
        ["perspective","空間透視","利用牆面與走廊表現深度"],
        ["center","中央構圖","突出室內主要視覺中心"],
        ["thirds","三分法","安排家具與空間比例"],
        ["frame","門框構圖","利用門窗形成天然畫框"]
    ]
},

food:{
    icon:"🍜",
    name:"美食",
    default:"foodCenter",
    comps:[
        ["foodCenter","置中美食","適合單一主餐或餐盤"],
        ["foodThirds","三分美食","讓主餐與配菜形成平衡"],
        ["foodDiagonal","對角排列","適合多盤料理"],
        ["foodTop","俯拍構圖","適合桌面與多道料理"],
        ["fill","滿版特寫","強調食物細節與質感"]
    ]
},

macro:{
    icon:"🌸",
    name:"近拍",
    default:"macroThirds",
    comps:[
        ["macroThirds","近拍三分","將花朵或小物放在三分交叉點"],
        ["macroCenter","中央近拍","突出單一花朵或小型物件"],
        ["diagonal","對角線","利用枝葉或物體方向形成動態"],
        ["negative","留白","讓小型主體周圍保留乾淨空間"],
        ["fill","滿版特寫","靠近主體突出細節"]
    ]
},

pet:{
    icon:"🐶",
    name:"寵物",
    default:"petThirds",
    comps:[
        ["petThirds","眼睛三分","讓寵物眼睛靠近三分交叉點"],
        ["petCenter","中央萌拍","適合正面看鏡頭"],
        ["petLook","方向留白","在寵物面向方向保留空間"],
        ["petFull","全身構圖","完整保留身體與腳部"],
        ["petAction","動態留白","在移動方向預留畫面空間"]
    ]
},

product:{
    icon:"📦",
    name:"商品",
    default:"productCenter",
    comps:[
        ["productCenter","商品置中","適合單一商品展示"],
        ["productThirds","商品三分","適合帶背景的商品照片"],
        ["symmetry","對稱","適合幾何外型明確的商品"],
        ["product45","45°構圖","呈現商品正面與側面立體感"],
        ["foodTop","俯拍排列","適合多件商品平鋪"],
        ["negative","留白","保留文字或版面設計空間"]
    ]
}

};


/* =========================================================
   相機
========================================================= */

async function startCamera(){

    try{

        messageEl.innerText="📷 正在開啟相機...";

        if(stream){
            stream.getTracks().forEach(function(t){
                t.stop();
            });
        }

        stream=await navigator.mediaDevices.getUserMedia({
            video:{
                facingMode:{ideal:facing},
                width:{ideal:1280},
                height:{ideal:720}
            },
            audio:false
        });

        video.srcObject=stream;

        await video.play();

        resizeOverlay();

        messageEl.innerText="📷 對準想拍攝的畫面";

    }catch(e){

        console.log(e);

        if(e.name==="NotAllowedError"){
            messageEl.innerText="❌ 請允許網站使用相機";
        }
        else if(e.name==="NotFoundError"){
            messageEl.innerText="❌ 找不到可用相機";
        }
        else if(e.name==="NotReadableError"){
            messageEl.innerText="❌ 相機可能被其他程式占用";
        }
        else{
            messageEl.innerText="❌ 相機無法開啟";
        }
    }
}

async function changeCamera(mode){
    facing=mode;
    await startCamera();
}


/* =========================================================
   模式
========================================================= */

function selectMode(mode,button){

    currentMode=mode;

    document.querySelectorAll(".modeBtn")
    .forEach(function(b){
        b.classList.remove("active");
    });

    if(button){
        button.classList.add("active");
    }

    if(mode==="auto"){

        currentComposition=null;

        compositionRow.innerHTML="";

        modeTitle.innerText="✨ 自動構圖";
        compositionEl.innerText="準備分析";
        descEl.innerText="系統將依拍攝情境選擇合適的構圖方式";

        clearOverlay();

        messageEl.innerText=
        "📷 對準畫面後按「自動構圖」";

        return;
    }

    var d=database[mode];

    modeTitle.innerText=d.icon+" "+d.name+"模式";

    buildCompButtons();

    selectComposition(d.default);

    messageEl.innerText=
    "📷 "+d.name+"模式｜可手動選擇構圖";
}


/* =========================================================
   建立構圖按鈕
========================================================= */

function buildCompButtons(){

    compositionRow.innerHTML="";

    database[currentMode].comps
    .forEach(function(c){

        var b=document.createElement("button");

        b.className="compBtn";
        b.dataset.id=c[0];
        b.innerText=c[1];

        b.onclick=function(){
            selectComposition(c[0]);
        };

        compositionRow.appendChild(b);
    });
}


/* =========================================================
   選擇構圖
========================================================= */

function selectComposition(id){

    currentComposition=id;

    var d=database[currentMode];

    if(!d)return;

    var comp=d.comps.find(function(c){
        return c[0]===id;
    });

    if(!comp)return;

    compositionEl.innerText=comp[1];
    descEl.innerText=comp[2];

    document.querySelectorAll(".compBtn")
    .forEach(function(b){

        b.classList.toggle(
            "active",
            b.dataset.id===id
        );
    });

    drawComposition();
}


/* =========================================================
   自動構圖
========================================================= */

function runComposition(){

    /*
       V6.1 的自動入口。

       注意：
       目前不是假裝已經辨識場景。

       使用者選手動模式：
       → 推薦該模式的預設構圖。

       使用自動模式：
       → V6.2 再接入真正影像辨識。

       所以這一版不亂宣稱：
       「已辨識出街景」
    */

    if(currentMode==="auto"){

        modeTitle.innerText="✨ 自動構圖";

        compositionEl.innerText="自動辨識待啟用";

        descEl.innerText=
        "自動模式的場景辨識將在下一階段加入";

        messageEl.innerText=
        "👉 目前請先選擇風景、街景、人像等拍攝模式";

        clearOverlay();

        return;
    }

    var d=database[currentMode];

    selectComposition(d.default);

    var comp=d.comps.find(function(c){
        return c[0]===d.default;
    });

    messageEl.innerText=
    "✓ 推薦："+comp[1]+"｜依照輔助線調整畫面";
}


/* =========================================================
   Canvas
========================================================= */

function clearOverlay(){
    ctx.clearRect(
        0,0,
        overlay.clientWidth,
        overlay.clientHeight
    );
}

function setup(){

    ctx.strokeStyle="#ffd400";
    ctx.fillStyle="#2cff67";
    ctx.lineWidth=2.5;
    ctx.setLineDash([]);
}

function target(x,y){

    ctx.save();

    ctx.strokeStyle="#2cff67";
    ctx.fillStyle="#2cff67";
    ctx.lineWidth=3;

    ctx.beginPath();
    ctx.arc(x,y,11,0,Math.PI*2);
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(x,y,4,0,Math.PI*2);
    ctx.fill();

    ctx.restore();
}


/* =========================================================
   三分法
========================================================= */

function drawThirds(){

    var w=overlay.clientWidth;
    var h=overlay.clientHeight;

    setup();

    ctx.beginPath();

    ctx.moveTo(w/3,0);
    ctx.lineTo(w/3,h);

    ctx.moveTo(w*2/3,0);
    ctx.lineTo(w*2/3,h);

    ctx.moveTo(0,h/3);
    ctx.lineTo(w,h/3);

    ctx.moveTo(0,h*2/3);
    ctx.lineTo(w,h*2/3);

    ctx.stroke();

    target(w/3,h/3);
    target(w*2/3,h/3);
    target(w/3,h*2/3);
    target(w*2/3,h*2/3);
}


/* =========================================================
   黃金比例
========================================================= */

function drawGolden(){

    var w=overlay.clientWidth;
    var h=overlay.clientHeight;

    setup();

    var x1=w*.382;
    var x2=w*.618;
    var y1=h*.382;
    var y2=h*.618;

    ctx.beginPath();

    ctx.moveTo(x1,0);
    ctx.lineTo(x1,h);

    ctx.moveTo(x2,0);
    ctx.lineTo(x2,h);

    ctx.moveTo(0,y1);
    ctx.lineTo(w,y1);

    ctx.moveTo(0,y2);
    ctx.lineTo(w,y2);

    ctx.stroke();

    target(x1,y1);
    target(x2,y1);
}


/* =========================================================
   中央
========================================================= */

function drawCenter(){

    var w=overlay.clientWidth;
    var h=overlay.clientHeight;

    setup();

    ctx.beginPath();

    ctx.moveTo(w/2,0);
    ctx.lineTo(w/2,h);

    ctx.moveTo(0,h/2);
    ctx.lineTo(w,h/2);

    ctx.stroke();

    target(w/2,h/2);
}


/* =========================================================
   引導線
========================================================= */

function drawLeading(){

    var w=overlay.clientWidth;
    var h=overlay.clientHeight;

    setup();

    var vx=w*.5;
    var vy=h*.4;

    ctx.lineWidth=4;

    ctx.beginPath();

    ctx.moveTo(w*.08,h);
    ctx.lineTo(vx,vy);

    ctx.moveTo(w*.92,h);
    ctx.lineTo(vx,vy);

    ctx.stroke();

    target(vx,vy);
}


/* =========================================================
   單點透視
========================================================= */

function drawPerspective(){

    var w=overlay.clientWidth;
    var h=overlay.clientHeight;

    setup();

    var vx=w*.5;
    var vy=h*.42;

    var starts=[
        [0,h],
        [w*.25,h],
        [w*.75,h],
        [w,h],
        [0,h*.65],
        [w,h*.65]
    ];

    ctx.beginPath();

    starts.forEach(function(p){
        ctx.moveTo(p[0],p[1]);
        ctx.lineTo(vx,vy);
    });

    ctx.stroke();

    target(vx,vy);
}


/* =========================================================
   對稱
========================================================= */

function drawSymmetry(){

    var w=overlay.clientWidth;
    var h=overlay.clientHeight;

    setup();

    ctx.lineWidth=3;

    ctx.beginPath();
    ctx.moveTo(w/2,0);
    ctx.lineTo(w/2,h);
    ctx.stroke();

    ctx.setLineDash([8,8]);

    ctx.beginPath();

    ctx.moveTo(w*.2,h*.2);
    ctx.lineTo(w*.2,h*.8);

    ctx.moveTo(w*.8,h*.2);
    ctx.lineTo(w*.8,h*.8);

    ctx.stroke();

    ctx.setLineDash([]);
}


/* =========================================================
   對角線
========================================================= */

function drawDiagonal(){

    var w=overlay.clientWidth;
    var h=overlay.clientHeight;

    setup();

    ctx.lineWidth=3;

    ctx.beginPath();
    ctx.moveTo(0,h);
    ctx.lineTo(w,0);
    ctx.stroke();

    target(w*.62,h*.38);
}


/* =========================================================
   框景
========================================================= */

function drawFrame(){

    var w=overlay.clientWidth;
    var h=overlay.clientHeight;

    setup();

    ctx.strokeRect(
        w*.12,
        h*.13,
        w*.76,
        h*.74
    );

    target(w/2,h/2);
}


/* =========================================================
   人像
========================================================= */

function drawPortraitThirds(){

    drawThirds();

    var w=overlay.clientWidth;
    var h=overlay.clientHeight;

    ctx.save();

    ctx.strokeStyle="#2cff67";
    ctx.lineWidth=3;

    ctx.beginPath();
    ctx.ellipse(
        w*.36,h*.33,
        w*.10,h*.085,
        0,0,Math.PI*2
    );
    ctx.stroke();

    ctx.restore();
}

function drawPortraitCenter(){

    var w=overlay.clientWidth;
    var h=overlay.clientHeight;

    setup();

    ctx.strokeStyle="#2cff67";
    ctx.lineWidth=3;

    ctx.beginPath();
    ctx.ellipse(
        w*.5,h*.3,
        w*.11,h*.085,
        0,0,Math.PI*2
    );
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(w*.5,h*.39);
    ctx.lineTo(w*.5,h*.78);
    ctx.stroke();
}

function drawLookSpace(){

    var w=overlay.clientWidth;
    var h=overlay.clientHeight;

    drawThirds();

    ctx.save();

    ctx.strokeStyle="#2cff67";
    ctx.lineWidth=3;

    ctx.strokeRect(
        w*.18,h*.28,
        w*.24,h*.46
    );

    ctx.beginPath();
    ctx.moveTo(w*.43,h*.37);
    ctx.lineTo(w*.76,h*.37);
    ctx.stroke();

    ctx.restore();
}

function drawFullBody(){

    var w=overlay.clientWidth;
    var h=overlay.clientHeight;

    setup();

    ctx.strokeStyle="#2cff67";
    ctx.lineWidth=3;

    ctx.strokeRect(
        w*.36,h*.10,
        w*.28,h*.80
    );

    ctx.setLineDash([6,6]);

    ctx.beginPath();
    ctx.moveTo(0,h*.1);
    ctx.lineTo(w,h*.1);

    ctx.moveTo(0,h*.9);
    ctx.lineTo(w,h*.9);
    ctx.stroke();

    ctx.setLineDash([]);
}

function drawEnvironment(){
    drawPortraitThirds();
}


/* =========================================================
   倒影
========================================================= */

function drawReflection(){

    var w=overlay.clientWidth;
    var h=overlay.clientHeight;

    setup();

    ctx.lineWidth=3;

    ctx.beginPath();
    ctx.moveTo(0,h*.5);
    ctx.lineTo(w,h*.5);
    ctx.stroke();

    target(w*.5,h*.5);
}


/* =========================================================
   美食
========================================================= */

function drawFoodCenter(){

    var w=overlay.clientWidth;
    var h=overlay.clientHeight;

    setup();

    ctx.strokeStyle="#2cff67";
    ctx.lineWidth=3;

    ctx.beginPath();
    ctx.arc(
        w*.5,h*.5,
        Math.min(w,h)*.23,
        0,Math.PI*2
    );
    ctx.stroke();

    target(w*.5,h*.5);
}

function drawFoodThirds(){

    drawThirds();

    var w=overlay.clientWidth;
    var h=overlay.clientHeight;

    ctx.save();

    ctx.strokeStyle="#2cff67";
    ctx.lineWidth=3;

    ctx.beginPath();
    ctx.arc(
        w*.36,h*.62,
        Math.min(w,h)*.15,
        0,Math.PI*2
    );
    ctx.stroke();

    ctx.restore();
}

function drawFoodDiagonal(){

    var w=overlay.clientWidth;
    var h=overlay.clientHeight;

    setup();

    ctx.beginPath();
    ctx.moveTo(w*.1,h*.82);
    ctx.lineTo(w*.9,h*.18);
    ctx.stroke();

    var p=[
        [.25,.70],
        [.50,.50],
        [.75,.30]
    ];

    p.forEach(function(a){

        ctx.beginPath();
        ctx.arc(
            w*a[0],
            h*a[1],
            Math.min(w,h)*.085,
            0,Math.PI*2
        );
        ctx.stroke();
    });
}

function drawFoodTop(){
    drawFoodCenter();
}


/* =========================================================
   留白
========================================================= */

function drawNegative(){

    var w=overlay.clientWidth;
    var h=overlay.clientHeight;

    setup();

    ctx.setLineDash([7,7]);

    ctx.strokeRect(
        w*.08,
        h*.18,
        w*.35,
        h*.55
    );

    ctx.setLineDash([]);

    target(w*.30,h*.48);
}


/* =========================================================
   滿版
========================================================= */

function drawFill(){

    var w=overlay.clientWidth;
    var h=overlay.clientHeight;

    ctx.strokeStyle="#2cff67";

    ctx.strokeRect(
        w*.06,
        h*.06,

        h*.88
    );

/* =========================================================
   寵物
========================================================= */

function drawPetThirds(){

}

function drawPetCenter(){
    drawPortraitCenter();
}

function drawPetLook(){

}

function drawPetFull(){

}

function drawPetAction(){

}


/* =========================================================
   商品
========================================================= */

function drawProductCenter(){

    var w=overlay.clientWidth;
    var h=overlay.clientHeight;

    setup();

    ctx.strokeStyle="#2cff67";
    ctx.lineWidth=3;

    ctx.strokeRect(
        w*.28,
        h*.24,
        w*.44,
        h*.52
    );

    target(w*.5,h*.5);
}

function drawProductThirds(){

    drawThirds();

    var w=overlay.clientWidth;
    var h=overlay.clientHeight;

    ctx.save();

    ctx.strokeStyle="#2cff67";
    ctx.lineWidth=3;

    ctx.strokeRect(
        w*.18,

        w*.34,
        h*.40
    );

    ctx.restore();
}

function drawProduct45(){

    var w=overlay.clientWidth;
    var h=overlay.clientHeight;

    setup();

    ctx.strokeStyle="#2cff67";
    ctx.lineWidth=3;

    ctx.beginPath();

    ctx.moveTo(w*.30,h*.35);
    ctx.lineTo(w*.60,h*.28);
    ctx.lineTo(w*.72,h*.42);
    ctx.lineTo(w*.70,h*.70);
    ctx.lineTo(w*.40,h*.75);
    ctx.lineTo(w*.28,h*.60);
    ctx.closePath();

    ctx.stroke();

    target(w*.5,h*.5);
}


/* =========================================================
   DRAW ROUTER
========================================================= */

function drawComposition(){

    clearOverlay();

    switch(currentComposition){

        case "thirds":
            drawThirds(); break;

        case "golden":
            drawGolden(); break;

        case "leading":
            drawLeading(); break;

        case "center":
            drawCenter(); break;

        case "frame":
            drawFrame(); break;

        case "perspective":
            drawPerspective(); break;

        case "symmetry":
            drawSymmetry(); break;

        case "diagonal":
            drawDiagonal(); break;

        case "portraitThirds":
            drawPortraitThirds(); break;

        case "portraitCenter":
            drawPortraitCenter(); break;

        case "lookSpace":
            drawLookSpace(); break;

        case "fullbody":
            drawFullBody(); break;

        case "environment":
            drawEnvironment(); break;

        case "reflection":
            drawReflection(); break;

        case "foodCenter":
            drawFoodCenter(); break;

        case "foodThirds":
            drawFoodThirds(); break;

        case "foodDiagonal":
            drawFoodDiagonal(); break;

        case "foodTop":
            drawFoodTop(); break;

        case "fill":
            drawFill(); break;

        case "macroThirds":
            drawFoodThirds(); break;

        case "macroCenter":
            drawFoodCenter(); break;

        case "negative":
            drawNegative(); break;

        case "petThirds":
            drawPetThirds(); break;

        case "petCenter":
            drawPetCenter(); break;

        case "petLook":
            drawPetLook(); break;

        case "petFull":
            drawPetFull(); break;

        case "petAction":
            drawPetAction(); break;

        case "productCenter":
            drawProductCenter(); break;

        case "productThirds":
            drawProductThirds(); break;

        case "product45":
            drawProduct45(); break;
    }
}


/* =========================================================
   Resize
========================================================= */

function resizeOverlay(){

    var rect=overlay.getBoundingClientRect();
    var dpr=window.devicePixelRatio||1;

    overlay.width=Math.round(rect.width*dpr);
    overlay.height=Math.round(rect.height*dpr);

    ctx.setTransform(
        dpr,0,0,dpr,0,0
    );

    drawComposition();
}

window.addEventListener(
    "resize",
    resizeOverlay
);


/* =========================================================
   Zoom
========================================================= */

zoom.addEventListener(
"input",
async function(){

    var value=Number(this.value);

    zoomText.innerText=
    value.toFixed(1)+"×";

    if(!stream)return;

    var tracks=
    stream.getVideoTracks();

    if(!tracks.length)return;

    var track=tracks[0];

    if(!track.getCapabilities)return;

    var caps=
    track.getCapabilities();

    if(!caps.zoom)return;

    try{

        var z=Math.max(
            caps.zoom.min,
            Math.min(
                caps.zoom.max,
                value
            )
        );

        await track.applyConstraints({
            advanced:[{zoom:z}]
        });

    }catch(e){
        console.log("Zoom:",e);
    }
});


/* =========================================================
   INIT
========================================================= */

function init(){

    resizeOverlay();

    startCamera();
}

init();
