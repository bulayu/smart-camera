<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>MediaPipe 測試</title>

    <style>
        body {
            background: black;
            color: white;
            text-align: center;
            font-family: Arial;
            padding-top: 50px;
        }

        #status {
            font-size: 24px;
            margin: 20px;
        }

        #detail {
            font-size: 16px;
            padding: 20px;
            word-break: break-all;
        }
    </style>
</head>


<body>

<h2>阿策 AI 測試</h2>

<div id="status">
    MediaPipe 載入中...
</div>

<div id="detail"></div>


<script type="module">

const status =
    document.getElementById("status");

const detail =
    document.getElementById("detail");


try {

    status.innerText =
        "正在下載 AI 模組...";

    const vision =
        await import(
            "https://unpkg.com/@mediapipe/tasks-vision@0.10.35/vision_bundle.mjs"
        );

    status.innerText =
        "✅ MediaPipe 載入成功";

    detail.innerText =
        "FaceDetector 是否存在：" +
        (vision.FaceDetector ? "是" : "否");

}

catch(error) {

    status.innerText =
        "❌ MediaPipe 載入失敗";

    detail.innerText =
        error.name +
        "：" +
        error.message;

    console.error(error);
}

</script>

</body>
</html>
