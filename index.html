<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>AI 構圖助手 V5.3.1</title>

<style>

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    background:#000;
    color:white;
    overflow:hidden;
    font-family:Arial,sans-serif;
}

#cameraArea{
    position:relative;
    width:100%;
    height:72%;
    background:#111;
    overflow:hidden;
}

video{
    width:100%;
    height:100%;
    object-fit:cover;
}

canvas{
    position:absolute;
    left:0;
    top:0;
    width:100%;
    height:100%;
    pointer-events:none;
}

#info{

    position:absolute;

    top:20px;
    left:18px;

    background:rgba(0,0,0,.7);

    padding:14px 18px;

    border-radius:18px;

    z-index:5;

}

#score{

    font-size:42px;
    font-weight:bold;

}

#score small{

    font-size:17px;
    opacity:.7;

}

#composition{

    font-size:20px;
    font-weight:bold;

    margin-top:5px;

}

#desc{

    font-size:14px;
    opacity:.8;

    margin-top:5px;

}

#message{

    position:absolute;

    bottom:20px;

    left:50%;

    transform:translateX(-50%);

    width:90%;

    text-align:center;

    background:rgba(0,0,0,.75);

    padding:14px;

    border-radius:18px;

    font-size:17px;
    font-weight:bold;

    z-index:10;

}

#version{

    position:absolute;

    left:10px;

    bottom:5px;

    font-size:11px;

    opacity:.5;

    z-index:20;

}


#controls{

    height:28%;

    background:#000;

    padding:15px;

}


#cameraButtons{

    text-align:center;

    margin-bottom:12px;

}


button{

    color:white;

    border:none;

}


.cameraBtn{

    background:#292929;

    border-radius:22px;

    padding:11px 18px;

    margin:0 5px;

    font-size:15px;

}


#modes{

    display:flex;

    gap:8px;

    overflow-x:auto;

    margin-bottom:12px;

}


.mode{

    white-space:nowrap;

    background:#111;

    border:1px solid #555;

    border-radius:25px;

    padding:10px 17px;

    font-size:15px;

}


.mode.active{

    background:white;

    color:black;

    font-weight:bold;

}


#zoomRow{

    display:flex;

    align-items:center;

    gap:10px;

}

#zoom{

    flex:1;

}

</style>
</head>

<body>


<div id="cameraArea">

    <video
    id="video"
    autoplay
    playsinline
    muted>
    </video>

    <canvas id="overlay"></canvas>


    <div id="info">

        <div id="score">

            --

            <small>/100</small>

        </div>


        <div id="composition">

            等待分析

        </div>


        <div id="desc">

            先將鏡頭對準想拍的畫面

        </div>

    </div>


    <div id="message">

        按下面「✨ AI 自動」開始分析

    </div>


    <div id="version">

        V5.3.1

    </div>

</div>



<div id="controls">


    <div id="cameraButtons">

        <button
        class="cameraBtn"
        onclick="changeCamera('user')">

            🤳 前鏡頭

        </button>


        <button
        class="cameraBtn"
        onclick="changeCamera('environment')">

            📷 後鏡頭

        </button>

    </div>



    <div id="modes">


        <button
        id="autoBtn"
        class="mode active"
        onclick="selectMode('auto',this)">

            ✨ AI 自動

        </button>


        <button
        class="mode"
        onclick="selectMode('third',this)">

            # 三分法

        </button>


        <button
        class="mode"
        onclick="selectMode('center',this)">

            ◎ 居中

        </button>


        <button
        class="mode"
        onclick="selectMode('golden',this)">

            Φ 黃金比例

        </button>


        <button
        class="mode"
        onclick="selectMode('vshape',this)">

            V 型

        </button>


    </div>



    <div id="zoomRow">

        <span>倍率</span>

        <input
        id="zoom"
        type="range"
        min="1"
        max="3"
        step="0.1"
        value="1">

        <span id="zoomText">

            1.0×

        </span>

    </div>

</div>



<script>

const video =
document.getElementById("video");

const canvas =
document.getElementById("overlay");

const ctx =
canvas.getContext("2d");

const scoreBox =
document.getElementById("score");

const compositionBox =
document.getElementById("composition");

const descBox =
document.getElementById("desc");

const messageBox =
document.getElementById("message");

const zoom =
document.getElementById("zoom");

const zoomText =
document.getElementById("zoomText");


let stream = null;

let facingMode =
"environment";

let navigation =
false;

let selectedComposition =
null;

let demoScore =
55;


/* =========================

   CAMERA

========================= */

async function startCamera(){

    try{

        if(stream){

            stream
            .getTracks()
            .forEach(t=>t.stop());

        }


        stream =
        await navigator.mediaDevices
        .getUserMedia({

            video:{

                facingMode:{
                    ideal:facingMode
                }

            },

            audio:false

        });


        video.srcObject =
        stream;


        video.onloadedmetadata =
        function(){

            resizeCanvas();

        };


        messageBox.innerText =
        "按下面「✨ AI 自動」開始分析";


    }

    catch(err){

        console.log(err);

        messageBox.innerText =
        "❌ 鏡頭開啟失敗，請確認相機權限";

    }

}



async function changeCamera(mode){

    facingMode =
    mode;

    navigation =
    false;

    selectedComposition =
    null;

    compositionBox.innerText =
    "等待分析";

    scoreBox.innerHTML =
    `-- <small>/100</small>`;

    await startCamera();

}



/* =========================

   MODE BUTTON

========================= */

function selectMode(mode,button){


    document
    .querySelectorAll(".mode")
    .forEach(btn=>{

        btn.classList.remove(
            "active"
        );

    });


    button.classList.add(
        "active"
    );



    /* AI 自動 */

    if(mode === "auto"){

        runAI();

        return;

    }



    /* V 型手動 */

    if(mode === "vshape"){

        selectedComposition =
        "vshape";

        navigation =
        true;

        demoScore =
        60;


        compositionBox.innerText =
        "V 型構圖";


        descBox.innerText =
        "讓實景線條靠近白色 V 型虛線";


        messageBox.innerText =
        "📱 移動手機，讓景物線條貼近白色 V 線";

        return;

    }



    navigation =
    false;

    selectedComposition =
    null;


    compositionBox.innerText =
    "尚未完成";


    descBox.innerText =
    "此構圖導航後續加入";


    messageBox.innerText =
    "目前先測 AI 自動與 V 型導航";

}



/* =========================

   AI ANALYZE

========================= */

function runAI(){


    navigation =
    false;


    selectedComposition =
    null;


    compositionBox.innerText =
    "AI 分析中";


    descBox.innerText =
    "正在分析場景線條與消失點";


    scoreBox.innerHTML =
    `-- <small>/100</small>`;


    messageBox.innerText =
    "✨ AI 正在分析構圖...";


    /*
       故意延遲0.8秒，
       確認按鈕真的有作用
    */

    setTimeout(()=>{


        selectedComposition =
        "vshape";


        navigation =
        true;


        demoScore =
        58;


        compositionBox.innerText =
        "V 型構圖";


        descBox.innerText =
        "AI 建議使用 V 型構圖";


        scoreBox.innerHTML =
        `58 <small>/100</small>`;


        messageBox.innerText =
        "📱 移動手機，讓景物線條貼近白色 V 線";


    },800);

}



/* =========================

   CANVAS

========================= */

function resizeCanvas(){


    const rect =
    canvas.getBoundingClientRect();


    const dpr =
    window.devicePixelRatio || 1;


    canvas.width =
    rect.width * dpr;


    canvas.height =
    rect.height * dpr;


    ctx.setTransform(

        dpr,
        0,
        0,
        dpr,
        0,
        0

    );

}



function drawV(){


    const w =
    canvas.clientWidth;


    const h =
    canvas.clientHeight;


    const topY =
    h * 0.25;


    const bottomY =
    h * 0.78;


    const centerX =
    w * 0.50;


    const leftX =
    w * 0.15;


    const rightX =
    w * 0.85;



    let color =
    "rgba(255,255,255,.95)";


    if(demoScore >= 85){

        color =
        "#25ff5b";

    }

    else if(demoScore >= 70){

        color =
        "#ffd400";

    }



    ctx.save();


    ctx.strokeStyle =
    color;


    ctx.fillStyle =
    color;


    ctx.lineWidth =
    3;


    ctx.setLineDash([
        14,
        10
    ]);



    /* LEFT */

    ctx.beginPath();

    ctx.moveTo(
        leftX,
        topY
    );

    ctx.lineTo(
        centerX,
        bottomY
    );

    ctx.stroke();



    /* RIGHT */

    ctx.beginPath();

    ctx.moveTo(
        rightX,
        topY
    );

    ctx.lineTo(
        centerX,
        bottomY
    );

    ctx.stroke();



    ctx.setLineDash([]);



    /* 消失點 */

    ctx.beginPath();

    ctx.arc(

        centerX,
        bottomY,
        6,
        0,
        Math.PI*2

    );

    ctx.fill();



    /* 標題 */

    ctx.font =
    "bold 18px Arial";


    ctx.textAlign =
    "center";


    ctx.fillText(

        "V 型構圖",

        centerX,

        topY - 15

    );


    ctx.restore();

}



function drawLoop(){


    ctx.clearRect(

        0,
        0,
        canvas.clientWidth,
        canvas.clientHeight

    );


    if(
        navigation &&
        selectedComposition === "vshape"
    ){

        drawV();

    }


    requestAnimationFrame(
        drawLoop
    );

}



/* =========================

   ZOOM

========================= */

zoom.addEventListener(
"input",
async function(){


    const value =
    Number(this.value);


    zoomText.innerText =
    value.toFixed(1) + "×";


    if(!stream)
    return;


    const track =
    stream.getVideoTracks()[0];


    if(
        !track ||
        !track.getCapabilities
    )
    return;


    const cap =
    track.getCapabilities();


    if(!cap.zoom)
    return;


    try{

        await track.applyConstraints({

            advanced:[

                {
                    zoom:value
                }

            ]

        });

    }

    catch(e){

        console.log(
            "Zoom unsupported"
        );

    }

});



window.addEventListener(
"resize",
resizeCanvas
);



startCamera();

drawLoop();

</script>


</body>
</html>
