<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    color:#fff;
    font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;
}

body{
    display:flex;
    flex-direction:column;
}

/* ================= CAMERA ================= */

#cameraArea{
    position:relative;
    width:100%;
    flex:1;
    min-height:0;
    overflow:hidden;
    background:#111;
}

#video{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
}

#overlay{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
    z-index:5;
}

/* ================= MINI INFO ================= */

#miniInfo{
    position:absolute;
    top:max(8px,env(safe-area-inset-top));
    left:50%;
    transform:translateX(-50%);

    width:calc(100% - 28px);
    max-width:520px;
    height:42px;

    padding:0 14px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    border-radius:21px;

    background:rgba(0,0,0,.58);

    backdrop-filter:blur(7px);
    -webkit-backdrop-filter:blur(7px);

    z-index:10;
    pointer-events:none;
}

#miniLeft{
    min-width:0;
    display:flex;
    align-items:center;
    gap:7px;
    font-size:13px;
    font-weight:800;
    white-space:nowrap;
}

#miniMode{
    opacity:.72;
}

#miniComposition{
    overflow:hidden;
    text-overflow:ellipsis;
}

#miniStatus{
    flex:0 0 auto;
    margin-left:10px;
    font-size:11px;
    font-weight:800;
    color:#ffd400;
}

/* ================= MESSAGE ================= */

#message{
    position:absolute;

    left:50%;
    bottom:15px;

    transform:translateX(-50%);

    width:92%;
    max-width:600px;

    min-height:50px;

    padding:11px 14px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:18px;

    background:rgba(0,0,0,.78);

    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);

    text-align:center;

    font-size:16px;
    font-weight:850;

    z-index:10;
}

#version{
    position:absolute;
    left:7px;
    bottom:3px;
    font-size:10px;
    opacity:.55;
    z-index:20;
}

/* ================= CONTROLS ================= */

#controls{
    flex:0 0 auto;

    padding:
    9px 11px
    calc(11px + env(safe-area-inset-bottom));

    background:#000;
}

#modeRow,
#compositionRow{
    display:flex;
    gap:7px;
    overflow-x:auto;
    scrollbar-width:none;
}

#modeRow{
    padding-bottom:8px;
}

#compositionRow{
    padding-bottom:8px;
}

#modeRow::-webkit-scrollbar,
#compositionRow::-webkit-scrollbar{
    display:none;
}

.modeBtn{
    flex:0 0 auto;
    min-width:67px;
    padding:8px;
    border:0;
    border-radius:17px;
    background:#242424;
    color:#fff;
    font-size:12px;
    font-weight:700;
}

.modeBtn.active{
    background:#fff;
    color:#000;
}

.autoBtn.active{
    background:#ffd400;
    color:#000;
}

.modeIcon{
    display:block;
    font-size:19px;
    margin-bottom:2px;
}

.compBtn{
    flex:0 0 auto;

    padding:7px 12px;

    border-radius:17px;

    border:1px solid #444;

    background:#151515;

    color:#ddd;

    font-size:12px;
}

.compBtn.active{
    border-color:#ffd400;
    color:#ffd400;
}

#mainButton{
    width:100%;

    padding:12px;

    border:0;

    border-radius:24px;

    background:#fff;

    color:#000;

    font-size:16px;
    font-weight:800;

    margin-bottom:8px;
}

#bottomRow{
    display:flex;
    align-items:center;
    gap:7px;
}

.cameraBtn{
    flex:0 0 auto;

    padding:8px 11px;

    border:0;

    border-radius:18px;

    background:#292929;

    color:#fff;

    font-size:12px;
}

#zoomArea{
    flex:1;
    display:flex;
    align-items:center;
    gap:5px;
}

#zoom{
    flex:1;
    min-width:50px;
}

#zoomText{
    min-width:32px;
    font-size:11px;
}

#status{
    margin-top:6px;
    text-align:center;
    font-size:10px;
    opacity:.42;
}

body.environment-minimal #miniStatus{

body.environment-minimal #message{

}

}

  display:none; position:absolute; left:10px; right:10px; bottom:72px;
  z-index:60; background:rgba(10,10,10,.96); border:1px solid #333;
  border-radius:20px; padding:12px; box-shadow:0 8px 28px rgba(0,0,0,.45);
}
body.v67-drawer-open #v67ModeDrawer{display:block;}
body.v67-minimal .modes,
body.v67-minimal .submodes,
body.v67-minimal .cameraControls,
body.v67-minimal .zoomRow{display:none !important;}
body.v67-minimal #runBtn{display:none !important;}
@media (orientation: landscape){
  body.v67-minimal #message{
    max-width:58%; padding:9px 15px; font-size:16px;
  }
  body.v67-minimal #v67QuickBar{padding:5px 8px;}
  body.v67-minimal .v67QuickBtn{padding:7px 12px;font-size:13px;}
}



/* ===== V6.7.1 全螢幕取景 UI ===== */
body.v671-fullscreen #cameraArea{height:100dvh;flex:1 1 auto;}
body.v671-fullscreen #controls{display:none!important;}
body.v671-fullscreen #v67QuickBar{
  position:absolute;left:50%;bottom:max(10px,env(safe-area-inset-bottom));
  transform:translateX(-50%);z-index:50;background:rgba(0,0,0,.48);
  border:1px solid rgba(255,255,255,.14);border-radius:999px;
  padding:5px;gap:4px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  width:auto;max-width:calc(100% - 20px);
}
body.v671-fullscreen .v67QuickBtn{padding:8px 11px;font-size:12px;border:0;background:rgba(35,35,35,.88);white-space:nowrap;}
body.v671-fullscreen #v67ModeBtn{background:rgba(255,255,255,.92);color:#000;}
body.v671-fullscreen #message{
  bottom:62px;width:auto;max-width:82%;min-height:0;padding:8px 13px;
  border-radius:999px;font-size:14px;background:rgba(0,0,0,.62);white-space:nowrap;

body.v671-fullscreen #miniInfo{height:38px;top:max(7px,env(safe-area-inset-top));width:calc(100% - 24px);}
body.v671-fullscreen #version{bottom:58px;}
body.v671-fullscreen #v67ModeDrawer{
  display:none;position:fixed;left:8px;right:8px;bottom:max(8px,env(safe-area-inset-bottom));
  z-index:100;background:rgba(8,8,8,.96);border:1px solid #333;border-radius:22px;

body.v671-fullscreen.v67-drawer-open #v67ModeDrawer{display:block;}
body.v671-fullscreen.v67-drawer-open #v67QuickBar{display:none;}
body.v671-fullscreen #v67ModeHost #controls{display:block!important;background:transparent;padding:0;}
body.v671-fullscreen #v67ModeHost #mainButton{margin:4px 0 8px;}
body.v671-fullscreen #v67ModeHost #status{display:none;}
@media (orientation:landscape){
  body.v671-fullscreen #v67QuickBar{left:auto;right:max(8px,env(safe-area-inset-right));bottom:10px;transform:none;}
  body.v671-fullscreen #message{bottom:12px;left:max(8px,env(safe-area-inset-left));transform:none;max-width:48%;font-size:13px;}
  body.v671-fullscreen #version{bottom:4px;}
  body.v671-fullscreen #v67ModeDrawer{left:auto;width:min(430px,48vw);right:max(8px,env(safe-area-inset-right));top:8px;bottom:8px;max-height:none;}
}

/* =========================================================
   CAMERA
========================================================= */

async function startCamera(){

    try{

        messageEl.innerText=
        "📷 正在開啟相機...";


        if(stream){

            stream
            .getTracks()
            .forEach(
                track=>track.stop()
            );

        }


        stream=
        await navigator.mediaDevices
        .getUserMedia({

            video:{

                facingMode:{
                    ideal:facing
                },

                width:{
                    ideal:1280
                },

                height:{
                    ideal:720
                }

            },

            audio:false

        });


        video.srcObject=
        stream;


        await video.play();


        resizeOverlay();


        messageEl.innerText=
        "📷 對準想拍攝的畫面";

    }

    catch(error){

        console.log(error);


        if(
            error.name===
            "NotAllowedError"
        ){

            messageEl.innerText=
            "❌ 請允許網站使用相機";

        }

        else if(
            error.name===
            "NotFoundError"
        ){

            messageEl.innerText=
            "❌ 找不到可用相機";

        }

        else{

            messageEl.innerText=
            "❌ 相機無法開啟";

        }

    }

}


async function changeCamera(mode){

    facing=mode;

    portraitNavigation=false;

    resetTracking();

    await startCamera();

}

/* =========================================================
   FACE DETECTOR
========================================================= */

async function initFaceDetector(){

    if(detectorReady){

        return true;

    }


    miniStatus.innerText=
    "載入中…";


    try{

        const vision=
        await FilesetResolver
        .forVisionTasks(

            "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22-rc.20250304/wasm"

        );


        visionFileset=vision;

        faceDetector=
        await FaceDetector
        .createFromOptions(

            vision,

            {

                baseOptions:{

                    modelAssetPath:

                    "https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite"

                },

                runningMode:
                "VIDEO",

                minDetectionConfidence:
                0.45

            }

        );


        detectorReady=true;

        // 人物模型背景載入，不阻塞相機與原本的人臉導航
        initPersonDetectorInBackground();

        miniStatus.innerText=
        "● 已就緒";


        return true;

    }

    catch(error){

        console.error(
            "Face detector error",
            error
        );


        miniStatus.innerText=
        "載入失敗";


        messageEl.innerText=
        "❌ 人像辨識模組載入失敗";


        return false;

    }

}


/* =========================================================
   V6.6 PERSON DETECTOR (BACKGROUND)
========================================================= */

async function initPersonDetectorInBackground(){
    if(personDetector || personDetectorLoading || !visionFileset) return;
    personDetectorLoading=true;
    try{
        personDetector=await ObjectDetector.createFromOptions(visionFileset,{
            baseOptions:{
                modelAssetPath:"https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite0/int8/1/efficientdet_lite0.tflite"
            },
            runningMode:"VIDEO",
            scoreThreshold:0.25,
            maxResults:3
        });
    }catch(error){
        console.warn("Person detector unavailable; face tracking continues",error);
        personDetector=null;
    }finally{
        personDetectorLoading=false;
    }
}

async function runComposition(){
    document.body.classList.toggle("environment-minimal", currentComposition==="environment");

    if(
        currentMode===
        "portrait"
    ){

        const ok=
        await initFaceDetector();


        if(!ok){
            return;
        }


        /*
           每次重新按開始：

           解除上一次左右鎖定，
           下一張臉重新決定。
        */

        resetTracking();


        /*
           V6.4：
           保留使用者目前選擇的人像構圖。
           三分人像 = 左右目標鎖定導航
           中央人像 = 中央目標導航
        */

        if(
            currentComposition!=="portraitThirds" &&
            currentComposition!=="portraitCenter" &&
            currentComposition!=="fullbody" &&
            currentComposition!=="environment"
        ){
            currentComposition="portraitThirds";
        }


        portraitNavigation=true;


        miniComposition.innerText=
        currentComposition==="fullbody"
        ? "全身定位中"
        : (currentComposition==="environment" ? "環境人像定位中" : (currentComposition==="portraitCenter" ? "中央定位中" : "選擇位置中"));


        miniStatus.innerText=
        "● 分析中";


        messageEl.innerText=
        "👤 保持人物在畫面中";


        requestAnimationFrame(
            portraitLoop
        );


        return;

    }


    if(
        currentMode===
        "auto"
    ){

        messageEl.innerText=
        "👉 V6.7 請先測試人像模式";


        return;

    }


    const data=
    database[currentMode];


    selectComposition(
        data.default
    );


    messageEl.innerText=
    "✓ 推薦："+
    miniComposition.innerText;

}


/* =========================================================
   PORTRAIT LOOP
========================================================= */

function portraitLoop(){

    if(
        !portraitNavigation ||
        currentMode!=="portrait"
    ){

        return;

    }


    if(
        video.readyState<2 ||
        !faceDetector
    ){

        requestAnimationFrame(
            portraitLoop
        );

        return;

    }


    if(
        video.currentTime===
        lastVideoTime
    ){

        requestAnimationFrame(
            portraitLoop
        );

        return;

    }


    lastVideoTime=
    video.currentTime;


    if(detecting){

        requestAnimationFrame(
            portraitLoop
        );

        return;

    }


    detecting=true;


    try{

        // V6.6 環境人像：人物可站、坐、靠、斜躺；不要求頭到腳直立。
        // 優先使用人物框；人物模型漏抓時，以臉部位置維持環境人像導航。
        if(currentComposition==="environment"){
            let people=[];
            if(personDetector){
                try{
                    const personResult=personDetector.detectForVideo(video,performance.now());
                    people=chooseEnvironmentPeople(personResult && personResult.detections ? personResult.detections : []);
                }catch(personError){
                    console.warn("Environment people detection error",personError);
                }
            }

            if(people.length){
                missingFrames=0;
                lastPersonSeenAt=performance.now();
                updateTrackedEnvironmentGroup(people);
                drawEnvironmentNavigation();
            }else{
                let faceFallback=null;
                if(faceDetector){
                    try{
                        const faceResult=faceDetector.detectForVideo(video,performance.now());
                        if(faceResult && faceResult.detections && faceResult.detections.length){
                            faceFallback=chooseMainFace(faceResult.detections);
                        }
                    }catch(faceError){
                        console.warn("Environment face fallback error",faceError);
                    }
                }
                if(faceFallback){
                    missingFrames=0;
                    lastPersonSeenAt=performance.now();
                    trackedEnvironmentGroup=null;
                    environmentPersonCount=1;
                    updateTrackedEnvironmentFromFace(faceFallback);
                    drawEnvironmentNavigation();
                    miniStatus.innerText="● 臉部輔助追蹤";
                }else{
                    handleMissingEnvironmentPerson();
                }
            }
            detecting=false;
            requestAnimationFrame(portraitLoop);
            return;
        }

        // V6.6 全身構圖：直接以人物框導航，不依賴臉部位置。
        if(currentComposition==="fullbody"){
            let person=null;
            if(personDetector){
                try{
                    const personResult=personDetector.detectForVideo(video,performance.now());
                    person=chooseMainPerson(personResult && personResult.detections ? personResult.detections : []);
                }catch(personError){
                    console.warn("Fullbody person detection error",personError);
                }
            }

            if(person){
                missingFrames=0;
                lastPersonSeenAt=performance.now();
                lastPersonDetectionBox=person.boundingBox || null;
                updateTrackedPerson(person);
                drawFullBodyNavigation();
            }else{
                // V6.6：人物模型遠距漏抓時，立即嘗試用遠距臉部偵測維持全身追蹤。
                let faceFallback=null;
                if(faceDetector){
                    try{
                        const faceResult=faceDetector.detectForVideo(video,performance.now());
                        if(faceResult && faceResult.detections && faceResult.detections.length){
                            faceFallback=chooseMainFace(faceResult.detections);
                        }
                    }catch(faceError){
                        console.warn("Fullbody face fallback error",faceError);
                    }
                }
                if(faceFallback){
                    missingFrames=0;
                    lastPersonSeenAt=performance.now();
                    updateTrackedPersonFromFace(faceFallback);
                    drawFullBodyNavigation();
                    miniStatus.innerText="● 臉部輔助追蹤";
                }else{
                    handleMissingPerson();
                }
            }

            detecting=false;
            requestAnimationFrame(portraitLoop);
            return;
        }

        const result=
        faceDetector.detectForVideo(

            video,

            performance.now()

        );


        if(
            result &&
            result.detections &&
            result.detections.length>0
        ){

            missingFrames=0;


            const detection=
            chooseMainFace(
                result.detections
            );


            updateTrackedFace(
                detection
            );


            /*
               V6.3.2：

               第一次成功取得人物後
               才決定一次構圖位置。
            */

            if(
                !lockedTargetSide &&
                trackedFace
            ){

                if(currentComposition==="portraitCenter"){

                    lockedTargetSide="center";
                    targetReason="portrait-center";
                    stableStartTime=null;
                    completed=false;

                    miniComposition.innerText=
                    "中央人像";

                    miniStatus.innerText=
                    "● 已鎖定";

                }

                else{

                    lockTargetSide();

                }

            }


            drawPortraitNavigation();

        }

        else{

            // 遠距離臉抓不到時，人物偵測接手；模型尚未就緒則沿用 V6.4.1 防閃。
            let person=null;
            if(personDetector){
                try{
                    const personResult=personDetector.detectForVideo(video,performance.now());
                    person=chooseMainPerson(personResult && personResult.detections ? personResult.detections : []);
                }catch(personError){
                    console.warn("Person detection error",personError);
                }
            }

            if(person){
                missingFrames=0;
                updateTrackedFromPerson(person);

                if(!lockedTargetSide && trackedFace){
                    if(currentComposition==="portraitCenter"){
                        lockedTargetSide="center";
                        targetReason="portrait-center-person";
                    }else{
                        const w=overlay.clientWidth;
                        lockedTargetSide=Math.abs(trackedFace.x-w/3)<=Math.abs(trackedFace.x-w*2/3)?"left":"right";
                        targetReason="person-nearest-third";
                    }
                    stableStartTime=null;
                    completed=false;
                }

                drawPortraitNavigation();
                miniStatus.innerText="● 人物追蹤";
            }else{
                handleMissingFace();
            }

        }

    }

    catch(error){

        console.log(
            "Detection error",
            error
        );

    }


    detecting=false;


    requestAnimationFrame(
        portraitLoop
    );

}


/* =========================================================
   MAIN FACE
========================================================= */

function chooseMainFace(
    detections
){

    let best=
    detections[0];


    let bestArea=0;


    detections.forEach(

        detection=>{

            const box=
            detection.boundingBox;


            if(!box){
                return;
            }


            const area=
            box.width*
            box.height;


            if(area>bestArea){

                bestArea=area;

                best=detection;

            }

        }

    );


    return best;

}


/* =========================================================
   V6.6 FULL BODY TRACKING
========================================================= */

function updateTrackedPerson(detection){
    const b=detection && detection.boundingBox;
    if(!b) return;
    const p1=videoPointToScreen(b.originX,b.originY);
    const p2=videoPointToScreen(b.originX+b.width,b.originY+b.height);
    const np={
        x:(p1.x+p2.x)/2,
        y:(p1.y+p2.y)/2,
        w:Math.abs(p2.x-p1.x),
        h:Math.abs(p2.y-p1.y),
        left:Math.min(p1.x,p2.x),
        top:Math.min(p1.y,p2.y)
    };
    if(!trackedPerson){ trackedPerson=np; return; }
    const a=0.62;
    trackedPerson.x=trackedPerson.x*a+np.x*(1-a);
    trackedPerson.y=trackedPerson.y*a+np.y*(1-a);
    trackedPerson.w=trackedPerson.w*a+np.w*(1-a);
    trackedPerson.h=trackedPerson.h*a+np.h*(1-a);
    trackedPerson.left=trackedPerson.x-trackedPerson.w/2;
    trackedPerson.top=trackedPerson.y-trackedPerson.h/2;
}

function updateTrackedPersonFromFace(detection){
    const b=detection && detection.boundingBox;
    if(!b) return;
    const f1=videoPointToScreen(b.originX,b.originY);
    const f2=videoPointToScreen(b.originX+b.width,b.originY+b.height);
    const fx=(f1.x+f2.x)/2;
    const fy=(f1.y+f2.y)/2;
    const fw=Math.abs(f2.x-f1.x);
    const fh=Math.abs(f2.y-f1.y);

    // 有上一個人物框時，保留其人物/臉比例與寬高，僅用臉的位置校正人物中心。
    // 這樣往後退造成人物模型漏抓時，黃框不會突然消失或跳成錯誤尺寸。
    if(trackedPerson){
        const expectedFaceY=trackedPerson.y-trackedPerson.h*0.32;
        const dx=fx-trackedPerson.x;
        const dy=fy-expectedFaceY;
        const a=0.72;
        trackedPerson.x += dx*(1-a);
        trackedPerson.y += dy*(1-a);
        // 臉變小時，緩慢縮放人物框；限制單幀縮放，避免框突然跳動。
        const estimatedH=Math.max(fh*5.2, fh+20);
        const scaleTarget=Math.max(0.88,Math.min(1.12,estimatedH/Math.max(1,trackedPerson.h)));
        trackedPerson.h*=0.92+0.08*scaleTarget;
        trackedPerson.w*=0.92+0.08*scaleTarget;
        trackedPerson.left=trackedPerson.x-trackedPerson.w/2;
        trackedPerson.top=trackedPerson.y-trackedPerson.h/2;
        return;
    }

    // 若一開始人物模型就沒抓到，但臉抓得到，先建立保守的全身估算框。
    const h=overlay.clientHeight, w=overlay.clientWidth;
    const ph=Math.min(h*.78,Math.max(h*.34,fh*5.2));
    const pw=Math.min(w*.52,Math.max(fw*2.2,ph*.34));
    const py=fy+ph*.32;
    trackedPerson={x:fx,y:py,w:pw,h:ph,left:fx-pw/2,top:py-ph/2};
}

function drawFullBodyNavigation(){
    if(!trackedPerson) return;
    clearOverlay();
    const w=overlay.clientWidth, h=overlay.clientHeight;
    const p=trackedPerson;

    // V6.6：全身構圖改成「合理範圍」而不是要求人物貼滿綠框。
    // 建議視覺框約佔畫面 64% 高；實際人物高度 40%～78% 都視為合理距離。
    const targetX=w/2;
    const targetTop=h*.16;
    const targetBottom=h*.84;
    const targetH=targetBottom-targetTop;
    const targetY=(targetTop+targetBottom)/2;
    const targetW=w*.46;

    ctx.save();
    ctx.strokeStyle="#2cff67";
    ctx.lineWidth=3;
    ctx.setLineDash([10,8]);
    ctx.strokeRect(targetX-targetW/2,targetTop,targetW,targetH);
    ctx.setLineDash([]);
    ctx.font="bold 15px sans-serif";
    ctx.fillStyle="#2cff67";
    ctx.fillText("建議人物範圍",Math.max(8,targetX-targetW/2),Math.max(20,targetTop-8));
    ctx.restore();

    // 目前人物框。V6.6：限制繪圖座標在相機畫面附近，
    // 避免遠距 fallback 產生異常尺寸時，在畫面底部留下大量黃色線條。
    const rawLeft=p.x-p.w/2;
    const rawTop=p.y-p.h/2;
    const rawRight=p.x+p.w/2;
    const rawBottom=p.y+p.h/2;
    const boxFinite=[rawLeft,rawTop,rawRight,rawBottom,p.w,p.h].every(Number.isFinite);
    const boxReasonable=boxFinite && p.w>4 && p.h>8 && p.w<w*1.25 && p.h<h*1.25
        && rawRight>-w*.15 && rawLeft<w*1.15 && rawBottom>-h*.15 && rawTop<h*1.15;
    if(boxReasonable){
        const drawLeft=Math.max(1,rawLeft);
        const drawTop=Math.max(1,rawTop);
        const drawRight=Math.min(w-1,rawRight);
        const drawBottom=Math.min(h-1,rawBottom);
        if(drawRight>drawLeft && drawBottom>drawTop){
            ctx.save();
            ctx.beginPath();
            ctx.rect(0,0,w,h);
            ctx.clip();
            ctx.strokeStyle=completed?"#2cff67":"#ffd400";
            ctx.lineWidth=4;
            ctx.strokeRect(drawLeft,drawTop,drawRight-drawLeft,drawBottom-drawTop);
            ctx.restore();
        }
    }

    const personTop=p.y-p.h/2;
    const personBottom=p.y+p.h/2;
    const personHeightRatio=p.h/h;
    const dx=targetX-p.x;
    const dy=targetY-p.y;

    // 距離容許放寬：人物高度佔畫面 40%～78% 即可。
    // 同時確認頭、腳沒有太貼近畫面邊緣，避免「有抓到人但切頭/切腳」。
    const goodSize=personHeightRatio>=0.40 && personHeightRatio<=0.78;
    const fullBodySafe=personTop>=h*.035 && personBottom<=h*.965;
    const goodX=Math.abs(dx)<w*.10;
    const goodY=Math.abs(dy)<h*.12;
    const inside=goodX && goodY && goodSize && fullBodySafe;

    const now=performance.now();
    let stableElapsed=0;
    if(inside){
        if(stableStartTime===null) stableStartTime=now;
        stableElapsed=now-stableStartTime;
        if(stableElapsed>=REQUIRED_STABLE_MS) completed=true;
    }else if(!completed){
        stableStartTime=null;
    }
    if(completed && (!goodX || !goodY || personHeightRatio<0.36 || personHeightRatio>0.84 || !fullBodySafe)){
        completed=false;
        stableStartTime=null;
    }

    miniMode.innerText="👤 人像";
    miniComposition.innerText="全身構圖";

    if(completed){
        miniStatus.innerText="✓ 完成";
        messageEl.innerText="✓ 全身構圖完成";
        return;
    }

    if(inside){
        const step=Math.min(8,Math.max(1,Math.floor(stableElapsed/REQUIRED_STABLE_MS*8)+1));
        miniStatus.innerText="● 穩定中";
        messageEl.innerText="● 正在穩定位置 "+step+"/8";
        return;
    }

    miniStatus.innerText="● 人物追蹤";
    if(!fullBodySafe){

        else messageEl.innerText="↑ 稍微抬高｜保留腳下空間";
    }else if(!goodSize){

    }else if(!goodX){

    }else if(!goodY){

    }else{
        messageEl.innerText="👤 距離OK｜微調人物位置";
    }
}

/* V6.7：保留畫面中的主要人物，並將多人合併成一個群組框。 */

function v67IsLandscape(){
    return overlay.clientWidth>overlay.clientHeight;
}

function updateEnvironmentCountLock(count){
    const now=performance.now();
    if(count<=0) return;

    if(count!==environmentCountCandidate){
        environmentCountCandidate=count;
        environmentCountSince=now;
    }

    if(!environmentLockedCount && now-environmentCountSince>=ENV_COUNT_LOCK_MS){
        environmentLockedCount=count;
        environmentLastFullCountAt=now;
        return;
    }

    // 若穩定看到更多人，允許往上修正鎖定人數；不因瞬間漏抓往下降。
    if(environmentLockedCount && count>environmentLockedCount &&
       now-environmentCountSince>=ENV_COUNT_LOCK_MS){
        environmentLockedCount=count;
        environmentLastFullCountAt=now;
    }

    if(environmentLockedCount && count>=environmentLockedCount){
        environmentLastFullCountAt=now;
    }
}

function environmentCountComplete(){
    if(!environmentLockedCount) return false;
    return environmentPersonCount>=environmentLockedCount;
}

function chooseEnvironmentPeople(detections){
    const w=Math.max(1,video.videoWidth || 1);
    const h=Math.max(1,video.videoHeight || 1);
    const minArea=w*h*.004;
    const people=[];
    detections.forEach(d=>{
        const cat=d.categories && d.categories[0];
        const name=((cat && (cat.categoryName || cat.displayName)) || "").toLowerCase();
        const score=(cat && Number.isFinite(cat.score)) ? cat.score : 0;
        const b=d.boundingBox;
        if(name!=="person" || !b || score<.22) return;
        const area=b.width*b.height;
        if(area<minArea) return;
        people.push(d);
    });
    people.sort((a,b)=>(b.boundingBox.width*b.boundingBox.height)-(a.boundingBox.width*a.boundingBox.height));
    return people.slice(0,4);
}

function updateTrackedEnvironmentGroup(detections){
    if(!detections || !detections.length) return;

    let left=Infinity,top=Infinity,right=-Infinity,bottom=-Infinity;
    let valid=0;

    detections.forEach(d=>{
        const b=d && d.boundingBox;
        if(!b) return;
        const p1=videoPointToScreen(b.originX,b.originY);
        const p2=videoPointToScreen(b.originX+b.width,b.originY+b.height);
        const l=Math.min(p1.x,p2.x), t=Math.min(p1.y,p2.y);
        const r=Math.max(p1.x,p2.x), bt=Math.max(p1.y,p2.y);
        if(![l,t,r,bt].every(Number.isFinite)) return;
        left=Math.min(left,l); top=Math.min(top,t);
        right=Math.max(right,r); bottom=Math.max(bottom,bt);
        valid++;
    });

    if(!valid) return;

    const candidate={
        x:(left+right)/2,
        y:(top+bottom)/2,
        w:Math.max(8,right-left),
        h:Math.max(12,bottom-top),
        left:left,
        top:top
    };

    environmentPersonCount=valid;
    updateEnvironmentCountLock(valid);

    if(!trackedEnvironmentGroup){
        trackedEnvironmentGroup=candidate;
    }else{
        const a=.62;
        trackedEnvironmentGroup.x=trackedEnvironmentGroup.x*a+candidate.x*(1-a);
        trackedEnvironmentGroup.y=trackedEnvironmentGroup.y*a+candidate.y*(1-a);
        trackedEnvironmentGroup.w=trackedEnvironmentGroup.w*a+candidate.w*(1-a);
        trackedEnvironmentGroup.h=trackedEnvironmentGroup.h*a+candidate.h*(1-a);
        trackedEnvironmentGroup.left=trackedEnvironmentGroup.x-trackedEnvironmentGroup.w/2;
        trackedEnvironmentGroup.top=trackedEnvironmentGroup.y-trackedEnvironmentGroup.h/2;
    }

    /* 兼容原 V6.6 繪圖/導航結構 */
    trackedPerson={...trackedEnvironmentGroup};
}

function updateTrackedEnvironmentFromFace(detection){
    const b=detection && detection.boundingBox;
    if(!b) return;
    const center=videoPointToScreen(b.originX+b.width/2,b.originY+b.height/2);
    const edge=videoPointToScreen(b.originX+b.width,b.originY+b.height);
    const fw=Math.max(24,Math.abs(edge.x-center.x)*2);
    const fh=Math.max(24,Math.abs(edge.y-center.y)*2);
    const w=overlay.clientWidth,h=overlay.clientHeight;
    // 環境人像只需要人物的大致區域，不把臉硬估成直立全身。
    const ph=Math.min(h*.52,Math.max(h*.24,fh*3.4));
    const pw=Math.min(w*.46,Math.max(fw*2.0,ph*.48));
    const py=Math.min(h*.88,center.y+ph*.22);
    const candidate={x:center.x,y:py,w:pw,h:ph,left:center.x-pw/2,top:py-ph/2};
    if(!trackedPerson){ trackedPerson=candidate; return; }
    const a=.70;
    trackedPerson.x=trackedPerson.x*a+candidate.x*(1-a);
    trackedPerson.y=trackedPerson.y*a+candidate.y*(1-a);
    trackedPerson.w=trackedPerson.w*a+candidate.w*(1-a);
    trackedPerson.h=trackedPerson.h*a+candidate.h*(1-a);
    trackedPerson.left=trackedPerson.x-trackedPerson.w/2;
    trackedPerson.top=trackedPerson.y-trackedPerson.h/2;
}

function drawEnvironmentNavigation(){
    clearOverlay();
    if(!trackedPerson) return;

    const w=overlay.clientWidth,h=overlay.clientHeight,p=trackedPerson;
    const landscape=w>h;
    const isGroup=environmentPersonCount>=2 && trackedEnvironmentGroup;
    const ctx=overlay.getContext("2d");

    const left=p.x-p.w/2, right=p.x+p.w/2;
    const top=p.y-p.h/2, bottom=p.y+p.h/2;

    // 直/橫向分別計算安全邊界
    const safeX=w*(landscape?.035:.045);
    const safeTop=h*(landscape?.06:.055);
    const safeBottom=h*(landscape?.07:.055);
    const safeEdges=left>safeX && right<w-safeX && top>safeTop && bottom<h-safeBottom;

    // 橫向允許多人群組更寬
    const groupSpread=isGroup ? p.w/w : 0;
    const spreadLimit=landscape?.90:.82;
    const spreadOK=!isGroup || groupSpread<=spreadLimit;

    // 人物高度比例依方向調整
    const ratio=p.h/h;
    const minRatio=isGroup ? (landscape?.34:.24) : (landscape?.30:.22);
    const maxRatio=isGroup ? (landscape?.88:.76) : (landscape?.80:.62);
    const goodSize=ratio>=minRatio && ratio<=maxRatio;

    // 橫向多人較適合靠中央；直向環境人像仍保留左右留白
    let targetX;
    if(landscape && isGroup) targetX=w*.50;
    else{
        const leftTarget=w*.40,rightTarget=w*.60;
        targetX=Math.abs(p.x-leftTarget)<=Math.abs(p.x-rightTarget)?leftTarget:rightTarget;
    }
    const targetY=h*(landscape?.51:.50);
    const dx=targetX-p.x,dy=targetY-p.y;
    const goodX=Math.abs(dx)<w*(isGroup?.14:.11);
    const goodY=Math.abs(dy)<h*(isGroup?.16:.14);

    const countOK=environmentCountComplete();
    const allGood=countOK && safeEdges && spreadOK && goodSize && goodX && goodY;

    if(allGood){
        if(!stableStartTime) stableStartTime=performance.now();
        if(performance.now()-stableStartTime>=REQUIRED_STABLE_MS) completed=true;
    }else{
        stableStartTime=null;
        completed=false;
    }

    // 極簡單一群組框
    ctx.save();
    ctx.lineWidth=completed?2:3;
    ctx.strokeStyle=completed?"rgba(0,255,102,.55)":"#ffd400";
    ctx.setLineDash([]);
    const bx=Math.max(2,left),by=Math.max(2,top);
    const bw=Math.max(8,Math.min(w-4,right)-bx);
    const bh=Math.max(8,Math.min(h-4,bottom)-by);
    ctx.strokeRect(bx,by,bw,bh);
    if(!completed){
        ctx.fillStyle="#00ff66";
        ctx.beginPath(); ctx.arc(targetX,targetY,5,0,Math.PI*2); ctx.fill();
    }
    ctx.restore();

    miniMode.innerText="👤 人像";
    const shownCount=environmentLockedCount || environmentPersonCount;
    miniComposition.innerText=shownCount>=2 ? ("環境 "+shownCount+"人") : "環境人像";

    if(completed){
        miniStatus.innerText="✓ 完成";
        messageEl.innerText="✓ 構圖完成";
        return;
    }

    miniStatus.innerText=environmentPersonCount>=2 ? ("● "+environmentPersonCount+"人追蹤") : "● 人物追蹤";

    // 先確保完整人數，再談構圖
    if(environmentLockedCount && environmentPersonCount<environmentLockedCount){
        const missing=environmentLockedCount-environmentPersonCount;
        messageEl.innerText="👤 少 "+missing+" 人｜調整畫面";
    }else if(!environmentLockedCount){
        messageEl.innerText="● 確認人物中";
    }else if(!safeEdges){
        messageEl.innerText="↔ 人物離邊緣一點";
    }else if(!spreadOK){
        messageEl.innerText="↔ 人物靠近一些";
    }else if(!goodSize){
        messageEl.innerText=ratio<minRatio ? "↑ 靠近一點" : "↓ 退後一點";
    }else if(!goodX){
        messageEl.innerText=dx>0 ? "← 手機向左" : "→ 手機向右";
    }else if(!goodY){
        messageEl.innerText=dy>0 ? "↑ 稍微抬高" : "↓ 稍微降低";
    }else{
        const elapsed=stableStartTime ? performance.now()-stableStartTime : 0;
        const step=Math.min(8,Math.max(1,Math.floor((elapsed/REQUIRED_STABLE_MS)*8)+1));
        messageEl.innerText="● 穩定 "+step+"/8";
    }
}

function handleMissingEnvironmentPerson(){
    missingFrames++;
    const elapsed=lastPersonSeenAt ? performance.now()-lastPersonSeenAt : Infinity;
    if(trackedPerson && elapsed<=PERSON_HOLD_MS){
        if(!completed) stableStartTime=null;

    messageEl.innerText="👤 讓人物留在畫面中，不必站直或露出全身";
}

function chooseMainPerson(detections){

    detections.forEach(d=>{
        const cat=d.categories && d.categories[0];
        const name=((cat && (cat.categoryName || cat.displayName)) || "").toLowerCase();
        if(name!=="person" || !d.boundingBox) return;

function updateTrackedFromPerson(detection){
    const b=detection.boundingBox;
    if(!b) return;
    // 由人物框上方估算頭部中心，讓原本三分/中央導航邏輯可以直接沿用。
    const hx=b.originX+b.width*0.50;
    const hy=b.originY+b.height*0.18;
    const hw=Math.max(24,b.width*0.24);
    const hh=Math.max(24,b.height*0.18);
    const p1=videoPointToScreen(hx-hw/2,hy-hh/2);
    const p2=videoPointToScreen(hx+hw/2,hy+hh/2);
    const nf={x:(p1.x+p2.x)/2,y:(p1.y+p2.y)/2,w:Math.abs(p2.x-p1.x),h:Math.abs(p2.y-p1.y),direction:"front"};
    if(!trackedFace){ trackedFace=nf; return; }
    const a=0.58;
    trackedFace.x=trackedFace.x*a+nf.x*(1-a);
    trackedFace.y=trackedFace.y*a+nf.y*(1-a);
    trackedFace.w=trackedFace.w*a+nf.w*(1-a);
    trackedFace.h=trackedFace.h*a+nf.h*(1-a);
}

/* =========================================================
   TRACK FACE
========================================================= */

function updateTrackedFace(
    detection
){

    const box=
    detection.boundingBox;


    if(!box){
        return;
    }


    const p1=
    videoPointToScreen(

        box.originX,

        box.originY

    );


    const p2=
    videoPointToScreen(

        box.originX+
        box.width,

        box.originY+
        box.height

    );


    const newFace={

        x:
        (p1.x+p2.x)/2,

        y:
        (p1.y+p2.y)/2,

        w:
        Math.abs(
            p2.x-p1.x
        ),

        h:
        Math.abs(
            p2.y-p1.y
        ),

        direction:
        estimateFaceDirection(
            detection
        )

    };


    if(!trackedFace){

        trackedFace=
        newFace;

        return;

    }


    trackedFace.x=
    trackedFace.x*
    SMOOTHING+
    newFace.x*
    (1-SMOOTHING);


    trackedFace.y=
    trackedFace.y*
    SMOOTHING+
    newFace.y*
    (1-SMOOTHING);


    trackedFace.w=
    trackedFace.w*
    SMOOTHING+
    newFace.w*
    (1-SMOOTHING);


    trackedFace.h=
    trackedFace.h*
    SMOOTHING+
    newFace.h*
    (1-SMOOTHING);


    /*
       朝向仍持續更新，
       但 V6.3.2 不再使用它
       重新切換目標。
    */

    trackedFace.direction=
    newFace.direction;

}


/* =========================================================
   FACE DIRECTION
========================================================= */

function estimateFaceDirection(
    detection
){

    const kp=
    detection.keypoints;


    if(
        !kp ||
        kp.length<3
    ){

        return "front";

    }


    const eye1=
    kp[0];


    const eye2=
    kp[1];


    const nose=
    kp[2];


    if(
        !eye1 ||
        !eye2 ||
        !nose
    ){

        return "front";

    }


    const eyeCenter=
    (
        eye1.x+
        eye2.x
    )/2;


    const eyeDistance=
    Math.abs(
        eye1.x-
        eye2.x
    );


    if(
        eyeDistance<
        .001
    ){

        return "front";

    }


    const offset=
    (
        nose.x-
        eyeCenter
    )/
    eyeDistance;


    if(offset>.16){

        return "right";

    }


    if(offset<-.16){

        return "left";

    }


    return "front";

}


/* =========================================================
   V6.3.2 LOCK TARGET

   這個函式只會在
   lockedTargetSide === null
   時執行。

========================================================= */

function lockTargetSide(){

    if(
        lockedTargetSide ||
        !trackedFace
    ){

        return;

    }


    const w=
    overlay.clientWidth;


    /*
       1. 有明確臉部方向時：

       人朝右：
       人放左三分，
       右邊留空間。

       人朝左：
       人放右三分，
       左邊留空間。
    */


    if(
        trackedFace.direction===
        "right"
    ){

        lockedTargetSide=
        "left";


        targetReason=
        "face-right";

    }


    else if(
        trackedFace.direction===
        "left"
    ){

        lockedTargetSide=
        "right";


        targetReason=
        "face-left";

    }


    /*
       2. 正面人物：

       選擇距離目前人物
       最近的三分位置。

       這樣手機不用大幅移動。
    */

    else{

        const leftX=
        w/3;


        const rightX=
        w*2/3;


        const leftDistance=
        Math.abs(
            trackedFace.x-
            leftX
        );


        const rightDistance=
        Math.abs(
            trackedFace.x-
            rightX
        );


        if(
            leftDistance<=
            rightDistance
        ){

            lockedTargetSide=
            "left";


            targetReason=
            "nearest-left";

        }

        else{

            lockedTargetSide=
            "right";


            targetReason=
            "nearest-right";

        }

    }


    /*
       一旦到這裡：

       lockedTargetSide
       就不會再改。

       除非：
       重新按開始、
       切換模式、
       切換相機。
    */


    stableStartTime=
    null;


    completed=
    false;


    miniComposition.innerText=
    lockedTargetSide===
    "left"
    ?
    "左三分"
    :
    "右三分";


    miniStatus.innerText=
    "● 已鎖定";

}


/* =========================================================
   VIDEO → SCREEN
========================================================= */

function videoPointToScreen(
    x,
    y
){

    const vw=
    video.videoWidth;


    const vh=
    video.videoHeight;


    const sw=
    overlay.clientWidth;


    const sh=
    overlay.clientHeight;


    if(
        !vw ||
        !vh
    ){

        return{
            x:0,
            y:0
        };

    }


    const scale=
    Math.max(

        sw/vw,

        sh/vh

    );


    const renderedW=
    vw*scale;


    const renderedH=
    vh*scale;


    const cropX=
    (
        renderedW-
        sw
    )/2;


    const cropY=
    (
        renderedH-
        sh
    )/2;


    return{

        x:
        x*scale-
        cropX,

        y:
        y*scale-
        cropY

    };

}


/* =========================================================
   PORTRAIT NAVIGATION
========================================================= */

function drawPortraitNavigation(){

    if(
        !trackedFace ||
        !lockedTargetSide
    ){

        return;

    }


    clearOverlay();


    const w=
    overlay.clientWidth;


    const h=
    overlay.clientHeight;


    /*
       V6.3.2：

       這裡不再呼叫
       chooseTargetSide()。

       直接使用鎖定值。
    */

    const side=
    lockedTargetSide;


    /*
       V6.4 TARGET

       三分人像：
       維持 V6.3.2 左 / 右三分鎖定。

       中央人像：
       水平固定中央；
       垂直仍放在約上三分位置，
       讓人物臉部不會落到畫面正中央過低。
    */

    const isCenterPortrait=
    currentComposition==="portraitCenter" ||
    side==="center";


    const targetX=
    isCenterPortrait
    ?
    w/2
    :
    (
        side==="left"
        ?
        w/3
        :
        w*2/3
    );


    const targetY=
    isCenterPortrait
    ?
    h*.34
    :
    h/3;


    /* =====================================================
       GUIDE GRID
    ===================================================== */

    ctx.save();


    ctx.strokeStyle=
    "rgba(255,212,0,.42)";


    ctx.lineWidth=
    1.5;


    ctx.setLineDash(
        [7,7]
    );


    ctx.beginPath();


    if(isCenterPortrait){

        /* 中央人像：中央軸＋眼睛高度參考線 */

        ctx.moveTo(
            w/2,
            0
        );

        ctx.lineTo(
            w/2,
            h
        );


        ctx.moveTo(
            0,
            targetY
        );

        ctx.lineTo(
            w,
            targetY
        );

    }

    else{

        /* 三分人像：保留完整三分格 */

        ctx.moveTo(
            w/3,
            0
        );

        ctx.lineTo(
            w/3,
            h
        );


        ctx.moveTo(
            w*2/3,
            0
        );

        ctx.lineTo(
            w*2/3,
            h
        );


        ctx.moveTo(
            0,
            h/3
        );

        ctx.lineTo(
            w,
            h/3
        );


        ctx.moveTo(
            0,
            h*2/3
        );

        ctx.lineTo(
            w,
            h*2/3
        );

    }


    ctx.stroke();


    ctx.restore();


    /* =====================================================
       DISTANCE
    ===================================================== */

    const dx=
    targetX-
    trackedFace.x;


    const dy=
    targetY-
    trackedFace.y;


    const toleranceX=
    w*.075;


    const toleranceY=
    h*.065;


    const goodX=
    Math.abs(dx)<
    toleranceX;


    const goodY=
    Math.abs(dy)<
    toleranceY;


    const inside=
    goodX &&
    goodY;


    /* =====================================================
       STABILITY TIMER
    ===================================================== */

    const now=
    performance.now();


    let stableElapsed=0;


    if(inside){

        if(
            stableStartTime===
            null
        ){

            stableStartTime=
            now;

        }


        stableElapsed=
        now-
        stableStartTime;


        if(
            stableElapsed>=
            REQUIRED_STABLE_MS
        ){

            completed=
            true;

        }

    }

    else{

        if(!completed){

            stableStartTime=
            null;

            stableElapsed=
            0;

        }


        if(
            completed &&
            (
                Math.abs(dx)>
                toleranceX*
                COMPLETE_RELEASE_MULTIPLIER
                ||
                Math.abs(dy)>
                toleranceY*
                COMPLETE_RELEASE_MULTIPLIER
            )
        ){

            completed=
            false;


            stableStartTime=
            null;


            stableElapsed=
            0;

        }

    }


    /* =====================================================
       GREEN TARGET
    ===================================================== */

    ctx.save();


    ctx.strokeStyle=
    "#2cff67";


    ctx.fillStyle=
    "#2cff67";


    ctx.lineWidth=
    completed
    ?
    5
    :
    4;


    ctx.beginPath();


    ctx.arc(

        targetX,

        targetY,

        completed
        ?
        30
        :
        25,

        0,

        Math.PI*2

    );


    ctx.stroke();


    ctx.beginPath();


    ctx.arc(

        targetX,

        targetY,

        5,

        0,

        Math.PI*2

    );


    ctx.fill();


    ctx.restore();


    /* =====================================================
       FACE BOX
    ===================================================== */

    const boxX=
    trackedFace.x-
    trackedFace.w/2;


    const boxY=
    trackedFace.y-
    trackedFace.h/2;


    ctx.save();


    /*
       黃色 = 人物目前位置

       綠色 = 已經完成

       這樣使用者比較容易分辨
       「人物」和「目標」。
    */

    ctx.strokeStyle=
    completed
    ?
    "#2cff67"
    :
    "#ffd400";


    ctx.lineWidth=
    4;


    ctx.strokeRect(

        boxX,

        boxY,

        trackedFace.w,

        trackedFace.h

    );


    ctx.restore();


    /* =====================================================
       CONNECTION
    ===================================================== */

    if(
        !completed &&
        !inside
    ){

        ctx.save();


        ctx.strokeStyle=
        "#ffd400";


        ctx.lineWidth=
        3;


        ctx.setLineDash(
            [7,6]
        );


        ctx.beginPath();


        ctx.moveTo(

            trackedFace.x,

            trackedFace.y

        );


        ctx.lineTo(

            targetX,

            targetY

        );


        ctx.stroke();


        ctx.restore();

    }


    /* =====================================================
       TARGET LABEL
    ===================================================== */

    ctx.save();


    ctx.font=
    "bold 13px -apple-system,Arial";


    ctx.fillStyle=
    "#2cff67";


    ctx.textAlign=
    "center";


    ctx.fillText(

        isCenterPortrait
        ?
        "中央"
        :
        (
            side==="left"
            ?
            "左三分"
            :
            "右三分"
        ),

        targetX,

        targetY+48

    );


    ctx.restore();


    /* =====================================================
       MINI BAR
    ===================================================== */

    miniMode.innerText=
    "👤 人像";


    miniComposition.innerText=
    isCenterPortrait
    ?
    "中央人像"
    :
    (
        side==="left"
        ?
        "左三分"
        :
        "右三分"
    );


    /* =====================================================
       COMPLETE
    ===================================================== */

    if(completed){

        miniStatus.innerText=
        "● 穩定";


        messageEl.innerText=
        "✓ 構圖完成";


        return;

    }


    /* =====================================================
       COUNTDOWN
    ===================================================== */

    if(inside){

        const stableStep = Math.min(8, Math.max(1, Math.floor((stableElapsed / REQUIRED_STABLE_MS) * 8) + 1));


        miniStatus.innerText=
        "● 穩定中";


        messageEl.innerText=
        "● 正在穩定位置 "+ stableStep + "/8";


        return;

    }


    /* =====================================================
       NAVIGATION
    ===================================================== */

    miniStatus.innerText=
    "● 追蹤中";


    let horizontal="";

    let vertical="";


    if(!goodX){

        if(dx>0){

            horizontal=
            "← 手機向左";

        }

        else{

            horizontal=
            "→ 手機向右";

        }

    }


    if(!goodY){

        if(dy>0){

            vertical=
            "↑ 稍微抬高";

        }

        else{

            vertical=
            "↓ 稍微降低";

        }

    }


    let text="";


    if(
        horizontal &&
        vertical
    ){

        text=
        horizontal+
        "　"+
        vertical;

    }

    else{

        text=
        horizontal ||
        vertical ||
        "保持目前位置";

    }


    messageEl.innerText=
    text;

}


/* =========================================================
   MISSING FACE
========================================================= */

function handleMissingFace(){

    missingFrames++;


    /*
       短暫漏抓：

       保留：
       - 人物位置
       - 左右目標鎖定

       絕對不重新選邊。
    */

    if(
        trackedFace &&
        missingFrames<=
        MAX_MISSING_FRAMES
    ){

        if(!completed){

            stableStartTime=
            null;

        }


        drawPortraitNavigation();


        miniStatus.innerText=
        "● 追蹤保持";


        if(completed){

            messageEl.innerText=
            "✓ 構圖完成";

        }


        return;

    }


    /*
       人臉真的消失：

       V6.3.2 仍然保留
       lockedTargetSide。

       因為這一次構圖目標
       已經決定，不應因漏抓
       就換到另一側。
    */


    trackedFace=
    null;


    stableStartTime=
    null;


    completed=
    false;


    drawPortraitNoFace();


    miniMode.innerText=
    "👤 人像";


    miniComposition.innerText=
    lockedTargetSide
    ?
    (
        lockedTargetSide==="center"
        ?
        "中央人像"
        :
        (
            lockedTargetSide==="left"
            ?
            "左三分"
            :
            "右三分"
        )
    )
    :
    "尋找人物";


    miniStatus.innerText=
    "● 等待";


    messageEl.innerText=
    "👤 暫時找不到臉｜保持人物在畫面中";

}


/* =========================================================
   NO FACE
========================================================= */

function drawPortraitNoFace(){

    clearOverlay();


    const w=
    overlay.clientWidth;


    const h=
    overlay.clientHeight;


    ctx.save();


    ctx.strokeStyle=
    "#2cff67";


    ctx.lineWidth=
    3;


    ctx.setLineDash(
        [8,7]
    );


    /*
       已經鎖定：

       只顯示鎖定的那一側。

       還沒鎖定：

       左右都顯示。
    */


    if(
        lockedTargetSide===
        "left"
    ){

        ctx.beginPath();


        ctx.arc(

            w/3,

            h/3,

            25,

            0,

            Math.PI*2

        );


        ctx.stroke();

    }


    else if(
        lockedTargetSide===
        "center"
    ){

        ctx.beginPath();


        ctx.arc(

            w/2,

            h*.34,

            25,

            0,

            Math.PI*2

        );


        ctx.stroke();

    }


    else if(
        lockedTargetSide===
        "right"
    ){

        ctx.beginPath();


        ctx.arc(

            w*2/3,

            h/3,

            25,

            0,

            Math.PI*2

        );


        ctx.stroke();

    }


    else{

        ctx.beginPath();


        ctx.arc(

            w/3,

            h/3,

            25,

            0,

            Math.PI*2

        );


        ctx.stroke();


        ctx.beginPath();


        ctx.arc(

            w*2/3,

            h/3,

            25,

            0,

            Math.PI*2

        );


        ctx.stroke();

    }


    ctx.restore();

}


/* =========================================================
   BASIC DRAW
========================================================= */

function clearOverlay(){
    // V6.6：用實際 canvas 像素完整清除，避免 DPR/縮放後留下黃框殘影。
    ctx.save();
    ctx.setTransform(1,0,0,1,0,0);
    ctx.clearRect(0,0,overlay.width,overlay.height);
    ctx.restore();
}


function setup(){

    ctx.strokeStyle=
    "#ffd400";


    ctx.fillStyle=
    "#2cff67";


    ctx.lineWidth=
    2.5;


    ctx.setLineDash([]);

}


function target(x,y){

    ctx.save();


    ctx.strokeStyle=
    "#2cff67";


    ctx.fillStyle=
    "#2cff67";


    ctx.lineWidth=
    3;


    ctx.beginPath();


    ctx.arc(

        x,

        y,

        11,

        0,

        Math.PI*2

    );


    ctx.stroke();


    ctx.beginPath();


    ctx.arc(

        x,

        y,

        4,

        0,

        Math.PI*2

    );


    ctx.fill();


    ctx.restore();

}


/* =========================================================
   THIRDS
========================================================= */

function drawThirds(){

    const w=
    overlay.clientWidth;


    const h=
    overlay.clientHeight;


    setup();


    ctx.beginPath();


    ctx.moveTo(
        w/3,
        0
    );

    ctx.lineTo(
        w/3,
        h
    );


    ctx.moveTo(
        w*2/3,
        0
    );

    ctx.lineTo(
        w*2/3,
        h
    );


    ctx.moveTo(
        0,
        h/3
    );

    ctx.lineTo(
        w,
        h/3
    );


    ctx.moveTo(
        0,
        h*2/3
    );

    ctx.lineTo(
        w,
        h*2/3
    );


    ctx.stroke();


    target(
        w/3,
        h/3
    );


    target(
        w*2/3,
        h/3
    );


    target(
        w/3,
        h*2/3
    );


    target(
        w*2/3,
        h*2/3
    );

}


/* =========================================================
   GOLDEN
========================================================= */

function drawGolden(){

    const w=
    overlay.clientWidth;


    const h=
    overlay.clientHeight;


    setup();


    ctx.beginPath();


    ctx.moveTo(
        w*.382,
        0
    );

    ctx.lineTo(
        w*.382,
        h
    );


    ctx.moveTo(
        w*.618,
        0
    );

    ctx.lineTo(
        w*.618,
        h
    );


    ctx.moveTo(
        0,
        h*.382
    );

    ctx.lineTo(
        w,
        h*.382
    );


    ctx.moveTo(
        0,
        h*.618
    );

    ctx.lineTo(
        w,
        h*.618
    );


    ctx.stroke();

}


/* =========================================================
   CENTER
========================================================= */

function drawCenter(){

    const w=
    overlay.clientWidth;


    const h=
    overlay.clientHeight;


    setup();


    ctx.beginPath();


    ctx.moveTo(
        w/2,
        0
    );

    ctx.lineTo(
        w/2,
        h
    );


    ctx.moveTo(
        0,
        h/2
    );

    ctx.lineTo(
        w,
        h/2
    );


    ctx.stroke();


    target(
        w/2,
        h/2
    );

}


/* =========================================================
   LEADING
========================================================= */

function drawLeading(){

    const w=
    overlay.clientWidth;


    const h=
    overlay.clientHeight;


    setup();


    const vx=
    w*.5;


    const vy=
    h*.4;


    ctx.lineWidth=
    4;


    ctx.beginPath();


    ctx.moveTo(
        w*.08,
        h
    );

    ctx.lineTo(
        vx,
        vy
    );


    ctx.moveTo(
        w*.92,
        h
    );

    ctx.lineTo(
        vx,
        vy
    );


    ctx.stroke();


    target(
        vx,
        vy
    );

}


/* =========================================================
   PERSPECTIVE
========================================================= */

function drawPerspective(){

    const w=
    overlay.clientWidth;


    const h=
    overlay.clientHeight;


    setup();


    const vx=
    w*.5;


    const vy=
    h*.42;


    const starts=[

        [0,h],

        [w*.25,h],

        [w*.75,h],

        [w,h],

        [0,h*.65],

        [w,h*.65]

    ];


    ctx.beginPath();


    starts.forEach(

        p=>{

            ctx.moveTo(
                p[0],
                p[1]
            );


            ctx.lineTo(
                vx,
                vy
            );

        }

    );


    ctx.stroke();


    target(
        vx,
        vy
    );

}


/* =========================================================
   SYMMETRY
========================================================= */

function drawSymmetry(){

    const w=
    overlay.clientWidth;


    const h=
    overlay.clientHeight;


    setup();


    ctx.lineWidth=
    3;


    ctx.beginPath();


    ctx.moveTo(
        w/2,
        0
    );

    ctx.lineTo(
        w/2,
        h
    );


    ctx.stroke();


    ctx.setLineDash(
        [8,8]
    );


    ctx.beginPath();


    ctx.moveTo(
        w*.2,
        h*.2
    );

    ctx.lineTo(
        w*.2,
        h*.8
    );


    ctx.moveTo(
        w*.8,
        h*.2
    );

    ctx.lineTo(
        w*.8,
        h*.8
    );


    ctx.stroke();


    ctx.setLineDash([]);

}


/* =========================================================
   DIAGONAL
========================================================= */

function drawDiagonal(){

    const w=
    overlay.clientWidth;


    const h=
    overlay.clientHeight;


    setup();


    ctx.beginPath();


    ctx.moveTo(
        0,
        h
    );


    ctx.lineTo(
        w,
        0
    );


    ctx.stroke();


    target(
        w*.62,
        h*.38
    );

}


/* =========================================================
   FRAME
========================================================= */

function drawFrame(){

    const w=
    overlay.clientWidth;


    const h=
    overlay.clientHeight;


    setup();


    ctx.strokeRect(

        w*.12,

        h*.13,

        w*.76,

        h*.74

    );


    target(
        w/2,
        h/2
    );

}


/* =========================================================
   PORTRAIT TEMPLATES
========================================================= */

function drawPortraitThirds(){

    drawThirds();

}


function drawPortraitCenter(){

    drawCenter();

}


function drawFullBody(){

    const w=
    overlay.clientWidth;


    const h=
    overlay.clientHeight;


    setup();


    ctx.strokeStyle=
    "#2cff67";


    ctx.strokeRect(

        w*.36,

        h*.10,

        w*.28,

        h*.80

    );

}


/* =========================================================
   CIRCLE
========================================================= */

function drawCircle(){

    const w=
    overlay.clientWidth;


    const h=
    overlay.clientHeight;


    setup();


    ctx.strokeStyle=
    "#2cff67";


    ctx.lineWidth=
    3;


    ctx.beginPath();


    ctx.arc(

        w*.5,

        h*.5,

        Math.min(
            w,
            h
        )*.23,

        0,

        Math.PI*2

    );


    ctx.stroke();


    target(
        w*.5,
        h*.5
    );

}


/* =========================================================
   FILL
========================================================= */

function drawFill(){

    const w=
    overlay.clientWidth;


    const h=
    overlay.clientHeight;


    setup();


    ctx.strokeStyle=
    "#2cff67";


    ctx.lineWidth=
    4;


    ctx.strokeRect(

        w*.06,

        h*.06,

        w*.88,

        h*.88

    );

}


/* =========================================================
   DRAW ROUTER
========================================================= */

function drawComposition(){

    if(portraitNavigation){
        return;
    }


    clearOverlay();


    switch(
        currentComposition
    ){


        case "thirds":
        case "macroThirds":
        case "petThirds":
        case "productThirds":
        case "foodThirds":

            drawThirds();
            break;


        case "golden":

            drawGolden();
            break;


        case "leading":

            drawLeading();
            break;


        case "center":
        case "macroCenter":
        case "petCenter":
        case "productCenter":

            drawCenter();
            break;


        case "frame":

            drawFrame();
            break;


        case "perspective":

            drawPerspective();
            break;


        case "symmetry":

            drawSymmetry();
            break;


        case "diagonal":
        case "foodDiagonal":
        case "product45":

            drawDiagonal();
            break;


        case "portraitThirds":
        case "environment":
        case "lookSpace":

            drawPortraitThirds();
            break;


        case "portraitCenter":

            drawPortraitCenter();
            break;


        case "fullbody":
        case "petFull":
        case "petAction":
        case "petLook":

            drawFullBody();
            break;


        case "reflection":

            drawCenter();
            break;


        case "foodCenter":
        case "foodTop":

            drawCircle();
            break;


        case "fill":

            drawFill();
            break;


        case "negative":

            drawThirds();
            break;

    }

}


/* =========================================================
   RESIZE
========================================================= */

function resizeOverlay(){

    const rect=
    overlay.getBoundingClientRect();


    const dpr=
    window.devicePixelRatio ||
    1;


    overlay.width=
    Math.round(
        rect.width*dpr
    );


    overlay.height=
    Math.round(
        rect.height*dpr
    );


    ctx.setTransform(

        dpr,

        0,

        0,

        dpr,

        0,

        0

    );


    drawComposition();

}


window.addEventListener(
    "resize",
    resizeOverlay
);


/* =========================================================
   ZOOM
========================================================= */

zoom.addEventListener(

    "input",

    async function(){

        const value=
        Number(
            this.value
        );


        zoomText.innerText=
        value.toFixed(1)+
        "×";


        if(!stream){
            return;
        }


        const tracks=
        stream.getVideoTracks();


        if(!tracks.length){
            return;
        }


        const track=
        tracks[0];


        if(
            !track.getCapabilities
        ){

            return;

        }


        const caps=
        track.getCapabilities();


        if(!caps.zoom){
            return;
        }


        try{

            const z=
            Math.max(

                caps.zoom.min,

                Math.min(

                    caps.zoom.max,

                    value

                )

            );


            await track
            .applyConstraints({

                advanced:[
                    {
                        zoom:z
                    }
                ]

            });

        }

        catch(error){

            console.log(
                "Zoom",
                error
            );

        }

    }

);


/* =========================================================
   EXPOSE
========================================================= */

window.selectMode=
selectMode;


window.changeCamera=
changeCamera;


window.runComposition=
runComposition;


/* =========================================================
   INIT
========================================================= */

resizeOverlay();

startCamera();

</script>

function gray(){if(!video||video.readyState<2)return null;wx.drawImage(video,0,0,TW,TH);const im=wx.getImageData(0,0,TW,TH).data,g=new Uint8Array(TW*TH);for(let i=0,j=0;i<im.length;i+=4,j++)g[j]=(im[i]*3+im[i+1]*6+im[i+2])>>3;return g;}
function makeTpl(g,cx,cy){const a=new Uint8Array((R*2+1)*(R*2+1));let k=0;for(let y=-R;y<=R;y++)for(let x=-R;x<=R;x++)a[k++]=g[(cy+y)*TW+cx+x];return a;}
function score(g,cx,cy){let k=0,sum=0;for(let y=-R;y<=R;y+=2)for(let x=-R;x<=R;x+=2){sum+=Math.abs(g[(cy+y)*TW+cx+x]-tpl[(y+R)*(R*2+1)+(x+R)]);k++;}return sum/k;}
function analyzeScene(g){
  let sx=0,sy=0,sw=0; const E=[0,0,0];
  for(let y=6;y<TH-6;y+=2){for(let x=6;x<TW-6;x+=2){
    const i=y*TW+x;
    const e=Math.abs(g[i+1]-g[i-1])+Math.abs(g[i+TW]-g[i-TW]);
    if(e<30)continue;
    // V7.3.2：不再偏袒畫面中央，讓左/中/右真正參與決策
    const vertical=1-Math.min(.35,Math.abs(y-TH*.52)/(TH*.52)*.22);
    const w=e*vertical;
    sx+=x*w; sy+=y*w; sw+=w;
    E[Math.min(2,Math.floor(x/(TW/3)))]+=w;
  }}
  if(!sw)return{x:.5,y:.52,E:[1,1,1]};
  return{x:Math.max(.15,Math.min(.85,sx/sw/TW)),y:Math.max(.22,Math.min(.78,sy/sw/TH)),E};
}
function chooseTarget(a){
  const E=a.E, total=E[0]+E[1]+E[2]||1;
  const shares=E.map(v=>v/total);
  const candidates=[
    {x:.333,name:'左三分'},
    {x:.500,name:'中央構圖'},
    {x:.667,name:'右三分'}
  ];
  // V7.3.2：先判斷「目前位置」與三個標準構圖位置的差異，
  // 不再用「主視覺在哪邊，就把綠框放同一邊」的舊規則。
  // 中央構圖只有畫面中央能量明顯較強時才加分；左右三分則依主視覺距離評估。
  const centerDominant=shares[1] > Math.max(shares[0],shares[2])*1.13;
  const scored=candidates.map(c=>{
    let score=Math.abs(a.x-c.x);
    if(c.x===.5){
      score += centerDominant ? -.055 : .035;
    }else{
      // 非對稱場景稍微偏好三分法，但不強迫跨到另一側。
      const side=c.x<.5?0:2;
      score -= Math.max(0,shares[side]-shares[1])*.10;
    }
    return {...c,score};
  }).sort((u,v)=>u.score-v.score);
  let best=scored[0];
  const currentDist=Math.abs(a.x-best.x);
  const alreadyGood=currentDist<.055;
  decisionInfo={
    label:best.name,
    xPct:Math.round(a.x*100),
    energy:shares.map(v=>Math.round(v*100)),
    alreadyGood,
    deltaPct:Math.round(currentDist*100)
  };
  return{x:best.x,y:.50,name:best.name,alreadyGood};
}
function acquire(g){const a=analyzeScene(g);pos={x:a.x,y:a.y};let cx=Math.round(pos.x*TW),cy=Math.round(pos.y*TH);cx=Math.max(R,Math.min(TW-R-1,cx));cy=Math.max(R,Math.min(TH-R-1,cy));tpl=makeTpl(g,cx,cy);target=chooseTarget(a);tracking=true;lost=0;}
function search(g,cx,cy,range,step){let best=null;for(let y=Math.max(R,cy-range);y<=Math.min(TH-R-1,cy+range);y+=step)for(let x=Math.max(R,cx-range);x<=Math.min(TW-R-1,cx+range);x+=step){const sc=score(g,x,y);if(!best||sc<best.s)best={x,y,s:sc};}return best;}
function track(g){let cx=Math.round(pos.x*TW),cy=Math.round(pos.y*TH);let best=search(g,cx,cy,24,2);if((!best||best.s>=44)&&lost>=2)best=search(g,TW>>1,TH>>1,Math.max(TW,TH),3);if(best&&best.s<48){pos.x=.62*pos.x+.38*(best.x/TW);pos.y=.62*pos.y+.38*(best.y/TH);tracking=true;lost=0;}else{lost++;tracking=false;}}
function rr(c,x,y,w,h,r){c.beginPath();if(c.roundRect)c.roundRect(x,y,w,h,r);else c.rect(x,y,w,h);c.stroke();}
function inside(w,h){return tracking&&Math.abs(target.x-pos.x)<.065&&Math.abs(target.y-pos.y)<.055;}
function freeze(msg='✓ 構圖完成｜可以拍照'){frozen=true;active=true;tracking=true;badge.textContent=msg;draw();}
function draw(){if(!ctx||!overlay)return;const w=overlay.clientWidth,h=overlay.clientHeight;ctx.clearRect(0,0,w,h);if(!active)return;const bw=Math.min(w*.34,190),bh=Math.min(h*.28,260),gx=target.x*w,gy=target.y*h,px=pos.x*w,py=pos.y*h;ctx.save();ctx.lineWidth=4;ctx.font='700 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif';ctx.textAlign='center';ctx.strokeStyle='#25ff72';ctx.setLineDash([12,10]);rr(ctx,gx-bw/2,gy-bh/2,bw,bh,8);ctx.setLineDash([]);ctx.fillStyle='#25ff72';ctx.fillText('AI 建議位置｜'+target.name,gx,gy-bh/2-12);ctx.strokeStyle='#fff';rr(ctx,px-bw/2,py-bh/2,bw,bh,8);ctx.fillStyle='#fff';ctx.fillText(frozen?'目前位置｜已鎖定':(tracking?'目前位置':'目前位置｜重新搜尋中'),px,py-bh/2-12);if(!frozen){if(tracking){const dx=target.x-pos.x,dy=target.y-pos.y;let t=[];if(Math.abs(dx)>.05)t.push(dx>0?'→':'←');if(Math.abs(dy)>.045)t.push(dy>0?'↓':'↑');badge.textContent=t.length?('AI：'+decisionInfo.label+'｜目前 X='+decisionInfo.xPct+'%｜差 '+decisionInfo.deltaPct+'%｜白框往 '+t.join(' ')):'AI：'+decisionInfo.label+'｜目前 X='+decisionInfo.xPct+'%｜✓ 對準中';}else badge.textContent=lost<12?'重新搜尋目前位置…':'追蹤暫失｜再按智慧構圖重新開始';}ctx.restore();}
function loop(){if(active&&!frozen){const g=gray();if(g&&tpl){track(g);if(inside(overlay.clientWidth,overlay.clientHeight)){freeze();return;}draw();}}requestAnimationFrame(loop);}
function start(){
  const token=++analysisToken;
  active=false; frozen=false; tracking=false; lost=0; tpl=null;
  if(ctx&&overlay)ctx.clearRect(0,0,overlay.clientWidth,overlay.clientHeight);
  badge.style.display='block'; badge.textContent='AI 分析中…';
  setTimeout(()=>{
    if(token!==analysisToken)return;
    const g=gray(); active=true;
    if(g){
      acquire(g);
      badge.textContent='AI：'+decisionInfo.label+'｜目前 X='+decisionInfo.xPct+'%｜差 '+decisionInfo.deltaPct+'%';
      draw();
      if(target.alreadyGood){freeze('✓ 目前構圖已合適｜可以拍照');return;}
    }else{
      pos={x:.5,y:.52}; target={x:.5,y:.50,name:'中央構圖'};
      decisionInfo={label:'中央構圖',xPct:50,energy:[0,0,0]};
      tracking=false;
    }
    draw();
  },140);
}
function init(){video=document.getElementById('video');area=document.getElementById('cameraArea');if(!video||!area)return;overlay=document.createElement('canvas');overlay.id='v73Overlay';badge=document.createElement('div');badge.id='v73Badge';area.style.position='relative';area.appendChild(overlay);area.appendChild(badge);ctx=overlay.getContext('2d');fit();addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,250));const quick=document.getElementById('v67StartBtn');if(quick){quick.onclick=(e)=>{e.preventDefault();e.stopPropagation();start();};quick.textContent='✨ 智慧構圖';}const main=document.getElementById('mainButton');if(main){main.removeAttribute('onclick');main.onclick=(e)=>{e.preventDefault();e.stopPropagation();start();};main.textContent='✨ 智慧構圖';}const st=document.getElementById('status');if(st)st.textContent='V7.3.2｜構圖差異決策版';loop();}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>setTimeout(init,0));else setTimeout(init,0);
})();
</script>
