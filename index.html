<script>

/* =========================================
   V5.7.1 目標硬鎖版
========================================= */

const video =
document.getElementById("video");

const overlay =
document.getElementById("overlay");

const ctx =
overlay.getContext("2d");

const ac =
document.getElementById("analysisCanvas");

const ax =
ac.getContext(
    "2d",
    {willReadFrequently:true}
);

const scoreEl =
document.getElementById("score");

const compositionEl =
document.getElementById("composition");

const descEl =
document.getElementById("desc");

const messageEl =
document.getElementById("message");

const zoom =
document.getElementById("zoom");

const zoomText =
document.getElementById("zoomText");


let stream = null;

let facing = "environment";

/*
★ V5.7.1 最重要的變數

targetGuide：
AI第一次分析後存進來。

存完以後，
除非再次按 AI 自動，
否則任何程式都不准修改它。
*/

let targetGuide = null;

let lockedMode = null;

let navigation = false;

let currentScore = 0;

let analyzing = false;



/* =========================================
   CAMERA
========================================= */

async function startCamera(){

    try{

        if(stream){

            stream
            .getTracks()
            .forEach(t=>t.stop());

        }


        stream =
        await navigator.mediaDevices
        .getUserMedia({

            video:{

                facingMode:{
                    ideal:facing
                },

                width:{
                    ideal:1280
                },

                height:{
                    ideal:720
                }

            },

            audio:false

        });


        video.srcObject =
        stream;


        await video.play();


        resizeOverlay();


        resetAnalysis();

    }

    catch(error){

        console.error(error);

        messageEl.innerText =
        "❌ 相機無法開啟";

    }

}



async function changeCamera(mode){

    facing = mode;

    await startCamera();

}



/* =========================================
   RESET
========================================= */

function resetAnalysis(){

    targetGuide = null;

    lockedMode = null;

    navigation = false;

    currentScore = 0;

    analyzing = false;


    scoreEl.innerHTML =
    `-- <small>/100</small>`;


    compositionEl.innerText =
    "等待分析";


    descEl.innerText =
    "先固定鏡頭，再按 AI 自動";


    messageEl.innerText =
    "✨ 按 AI 自動分析目前畫面";

}



/* =========================================
   BUTTON STYLE
========================================= */

function activateButton(button){

    document
    .querySelectorAll(".mode")
    .forEach(b=>{

        b.classList.remove(
            "active"
        );

    });


    button.classList.add(
        "active"
    );

}



/* =========================================
   AI AUTO
========================================= */

function runAI(button){

    if(analyzing)
    return;


    activateButton(button);


    if(video.readyState < 2){

        messageEl.innerText =
        "鏡頭還沒準備完成";

        return;

    }


    /*
    ★ 再按一次AI，
    才允許解除舊目標。
    */

    targetGuide = null;

    navigation = false;

    analyzing = true;


    compositionEl.innerText =
    "AI 分析中";


    descEl.innerText =
    "正在尋找主要透視線";


    scoreEl.innerHTML =
    `-- <small>/100</small>`;


    messageEl.innerText =
    "✨ 手機先不要動，正在鎖定構圖...";


    /*
    取5幀。

    不直接選其中一幀，
    而是找多幀共同的消失點。
    */

    let results = [];

    let count = 0;


    const timer =
    setInterval(()=>{

        const result =
        analyzePerspective();


        if(result){

            results.push(result);

        }


        count++;


        if(count >= 5){

            clearInterval(timer);

            analyzing = false;

            lockStableTarget(
                results
            );

        }

    },140);

}



/* =========================================
   LOCK STABLE TARGET
========================================= */

function lockStableTarget(results){

    if(results.length < 2){

        failPerspective();

        return;

    }


    /*
    先依消失點位置找中位數。

    這比直接拿最高 confidence
    更不容易被單一錯誤幀影響。
    */

    const xs =
    results
    .map(r=>r.vx)
    .sort((a,b)=>a-b);


    const ys =
    results
    .map(r=>r.vy)
    .sort((a,b)=>a-b);


    const medianX =
    xs[
        Math.floor(xs.length/2)
    ];


    const medianY =
    ys[
        Math.floor(ys.length/2)
    ];


    /*
    找離中位消失點最近的一幀。
    */

    let best = null;

    let bestDistance = Infinity;


    for(const r of results){

        const dx =
        r.vx - medianX;


        const dy =
        r.vy - medianY;


        const distance =
        Math.hypot(
            dx,
            dy
        );


        if(distance < bestDistance){

            bestDistance =
            distance;

            best =
            r;

        }

    }


    if(!best){

        failPerspective();

        return;

    }


    /*
    ★★★ HARD LOCK ★★★

    建立全新的純數值物件。

    不保留任何分析物件 reference。

    從這行之後，
    analyzePerspective()
    再怎麼運算，
    都不可能改到 targetGuide。
    */

    targetGuide = {

        type:
        best.type,

        confidence:
        Number(best.confidence),

        vx:
        Number(best.vx),

        vy:
        Number(best.vy),

        left:{

            x:
            Number(best.left.x),

            y:
            Number(best.left.y)

        },

        right:{

            x:
            Number(best.right.x),

            y:
            Number(best.right.y)

        }

    };


    /*
    再凍結物件。

    如果後面不小心寫：
    targetGuide.vx = xxx

    也不應該改掉。
    */

    Object.freeze(
        targetGuide.left
    );

    Object.freeze(
        targetGuide.right
    );

    Object.freeze(
        targetGuide
    );


    lockedMode =
    targetGuide.type;


    navigation = true;


    /*
    這版先固定顯示70分。

    因為現在測的是：
    「線會不會固定」。

    不讓即時分數干擾測試。
    */

    currentScore = 70;


    updateLockedUI();


    console.log(
        "V5.7.1 HARD LOCK:",
        targetGuide
    );

}



/* =========================================
   FAIL
========================================= */

function failPerspective(){

    targetGuide = null;

    lockedMode = null;

    navigation = false;

    currentScore = 0;


    scoreEl.innerHTML =
    `-- <small>/100</small>`;


    compositionEl.innerText =
    "未找到明確透視";


    descEl.innerText =
    "沒有足夠穩定的左右收斂線";


    messageEl.innerText =
    "📱 換個角度後，再按 AI 自動";

}



/* =========================================
   MANUAL MODE
========================================= */

function manualMode(mode,button){

    activateButton(button);


    /*
    手動模式也只分析一次。
    */

    const result =
    analyzePerspective();


    if(!result){

        failPerspective();

        return;

    }


    targetGuide = {

        type:mode,

        confidence:
        Number(result.confidence),

        vx:
        Number(result.vx),

        vy:
        Number(result.vy),

        left:{

            x:
            Number(result.left.x),

            y:
            Number(result.left.y)

        },

        right:{

            x:
            Number(result.right.x),

            y:
            Number(result.right.y)

        }

    };


    Object.freeze(
        targetGuide.left
    );

    Object.freeze(
        targetGuide.right
    );

    Object.freeze(
        targetGuide
    );


    lockedMode = mode;

    navigation = true;

    currentScore = 70;


    updateLockedUI();

}



/* =========================================
   PERSPECTIVE ANALYSIS
========================================= */

function analyzePerspective(){

    const W = ac.width;

    const H = ac.height;


    ax.drawImage(
        video,
        0,
        0,
        W,
        H
    );


    const image =
    ax.getImageData(
        0,
        0,
        W,
        H
    );


    const data =
    image.data;


    const gray =
    new Float32Array(
        W*H
    );


    for(
        let i=0;
        i<W*H;
        i++
    ){

        const p = i*4;


        gray[i] =

        data[p]*.299

        +

        data[p+1]*.587

        +

        data[p+2]*.114;

    }



    /*
    Sobel
    */

    const edge =
    new Float32Array(
        W*H
    );


    const direction =
    new Float32Array(
        W*H
    );


    let strengths = [];


    for(
        let y=1;
        y<H-1;
        y++
    ){

        for(
            let x=1;
            x<W-1;
            x++
        ){

            const p =
            y*W+x;


            const gx =

            -gray[p-W-1]

            +

            gray[p-W+1]

            -

            2*gray[p-1]

            +

            2*gray[p+1]

            -

            gray[p+W-1]

            +

            gray[p+W+1];


            const gy =

            -gray[p-W-1]

            -

            2*gray[p-W]

            -

            gray[p-W+1]

            +

            gray[p+W-1]

            +

            2*gray[p+W]

            +

            gray[p+W+1];


            const magnitude =
            Math.hypot(
                gx,
                gy
            );


            edge[p] =
            magnitude;


            direction[p] =
            normalizeAngle(

                Math.atan2(
                    gy,
                    gx
                )

                +

                Math.PI/2

            );


            strengths.push(
                magnitude
            );

        }

    }



    strengths.sort(
        (a,b)=>a-b
    );


    const threshold =

    strengths[
        Math.floor(
            strengths.length*.92
        )
    ]

    || 80;



    /*
    每格只取一條最強斜線
    */

    const cell = 10;

    let candidates = [];


    for(
        let cy=0;
        cy<H;
        cy+=cell
    ){

        for(
            let cx=0;
            cx<W;
            cx+=cell
        ){

            let bestMag = 0;

            let bx = 0;

            let by = 0;

            let ba = 0;


            for(
                let y=cy;
                y<Math.min(
                    cy+cell,
                    H
                );
                y++
            ){

                for(
                    let x=cx;
                    x<Math.min(
                        cx+cell,
                        W
                    );
                    x++
                ){

                    const p =
                    y*W+x;


                    const mag =
                    edge[p];


                    if(
                        mag < threshold
                    )
                    continue;


                    const a =
                    direction[p];


                    const aa =
                    Math.abs(a);


                    /*
                    排除接近水平
                    與垂直線
                    */

                    if(
                        aa < .18
                        ||
                        aa > 1.38
                    )
                    continue;


                    if(
                        mag > bestMag
                    ){

                        bestMag = mag;

                        bx = x;

                        by = y;

                        ba = a;

                    }

                }

            }


            if(bestMag > 0){

                candidates.push({

                    x:bx,

                    y:by,

                    angle:ba,

                    strength:
                    bestMag

                });

            }

        }

    }


    if(
        candidates.length < 8
    ){

        return null;

    }



    /*
    求候選線交點
    */

    const gridW = 24;

    const gridH = 18;


    const votes =
    new Float32Array(
        gridW*gridH
    );


    let pairs = [];


    for(
        let i=0;
        i<candidates.length;
        i++
    ){

        for(
            let j=i+1;
            j<candidates.length;
            j++
        ){

            const A =
            candidates[i];


            const B =
            candidates[j];


            const diff =
            Math.abs(

                normalizeAngle(
                    A.angle -
                    B.angle
                )

            );


            if(diff < .32)
            continue;


            const point =
            intersectAngleLines(
                A,
                B
            );


            if(!point)
            continue;


            /*
            排除太低的假消失點
            */

            if(
                point.x < 0
                ||
                point.x > W
                ||
                point.y < H*.10
                ||
                point.y > H*.76
            )
            continue;


            /*
            必須分居交點左右
            */

            const opposite =

            (
                A.x < point.x
                &&
                B.x > point.x
            )

            ||

            (
                B.x < point.x
                &&
                A.x > point.x
            );


            if(!opposite)
            continue;


            const spread =
            Math.abs(
                A.x-B.x
            );


            if(
                spread < W*.12
            )
            continue;


            const gx =
            Math.floor(
                point.x/W*gridW
            );


            const gy =
            Math.floor(
                point.y/H*gridH
            );


            if(
                gx<0
                ||
                gx>=gridW
                ||
                gy<0
                ||
                gy>=gridH
            )
            continue;


            const weight =

            Math.sqrt(
                A.strength*
                B.strength
            )

            *

            Math.min(
                1,
                spread/(W*.5)
            );


            votes[
                gy*gridW+gx
            ] +=
            weight;


            pairs.push({

                x:
                point.x,

                y:
                point.y,

                weight:
                weight

            });

        }

    }


    if(
        pairs.length < 4
    ){

        return null;

    }



    /*
    找票數最高區
    */

    let bestIndex = 0;


    for(
        let i=1;
        i<votes.length;
        i++
    ){

        if(
            votes[i] >
            votes[bestIndex]
        ){

            bestIndex = i;

        }

    }


    const bgx =
    bestIndex % gridW;


    const bgy =
    Math.floor(
        bestIndex/gridW
    );


    let cluster = [];


    for(
        const p of pairs
    ){

        const gx =
        Math.floor(
            p.x/W*gridW
        );


        const gy =
        Math.floor(
            p.y/H*gridH
        );


        if(
            Math.abs(
                gx-bgx
            ) <= 1
            &&
            Math.abs(
                gy-bgy
            ) <= 1
        ){

            cluster.push(p);

        }

    }


    if(
        cluster.length < 3
    ){

        return null;

    }



    /*
    加權平均消失點
    */

    let sx = 0;

    let sy = 0;

    let sw = 0;


    for(
        const p of cluster
    ){

        sx +=
        p.x*p.weight;


        sy +=
        p.y*p.weight;


        sw +=
        p.weight;

    }


    const vx =
    sx/sw;


    const vy =
    sy/sw;



    /*
    找左右主線
    */

    let bestLeft = null;

    let bestRight = null;

    let bestLeftScore = 0;

    let bestRightScore = 0;


    for(
        const c of candidates
    ){

        const d =
        distanceToLine(
            vx,
            vy,
            c
        );


        if(
            d > W*.055
        )
        continue;


        const horizontal =
        Math.abs(
            c.x-vx
        );


        const vertical =
        Math.abs(
            c.y-vy
        );


        if(
            horizontal < W*.10
            &&
            vertical < H*.10
        )
        continue;


        const score =

        c.strength

        *

        (
            1 +
            horizontal/W
        )

        *

        (
            1 +
            vertical/H
        );


        if(c.x < vx){

            if(
                score >
                bestLeftScore
            ){

                bestLeftScore =
                score;

                bestLeft =
                c;

            }

        }

        else{

            if(
                score >
                bestRightScore
            ){

                bestRightScore =
                score;

                bestRight =
                c;

            }

        }

    }


    if(
        !bestLeft
        ||
        !bestRight
    ){

        return null;

    }



    /*
    V / 倒V
    */

    const averageY =

    (
        bestLeft.y +
        bestRight.y
    ) / 2;


    const type =

    averageY > vy

    ?

    "inverseV"

    :

    "v";



    const concentration =
    cluster.length /
    pairs.length;


    const sideBalance =

    Math.min(
        bestLeftScore,
        bestRightScore
    )

    /

    Math.max(
        bestLeftScore,
        bestRightScore
    );


    let confidence =

    .25

    +

    Math.min(
        .40,
        concentration*2.5
    )

    +

    sideBalance*.30;


    if(
        vy < H*.65
    ){

        confidence += .08;

    }


    confidence =
    Math.max(
        0,
        Math.min(
            .98,
            confidence
        )
    );


    return{

        type:type,

        confidence:
        confidence,

        vx:
        vx/W,

        vy:
        vy/H,

        left:{

            x:
            bestLeft.x/W,

            y:
            bestLeft.y/H

        },

        right:{

            x:
            bestRight.x/W,

            y:
            bestRight.y/H

        }

    };

}



/* =========================================
   INTERSECTION
========================================= */

function intersectAngleLines(
    A,
    B
){

    const adx =
    Math.cos(A.angle);


    const ady =
    Math.sin(A.angle);


    const bdx =
    Math.cos(B.angle);


    const bdy =
    Math.sin(B.angle);


    const denominator =

    adx*bdy

    -

    ady*bdx;


    if(
        Math.abs(
            denominator
        ) < .0001
    ){

        return null;

    }


    const dx =
    B.x-A.x;


    const dy =
    B.y-A.y;


    const t =

    (
        dx*bdy

        -

        dy*bdx
    )

    /

    denominator;


    return{

        x:
        A.x +
        t*adx,

        y:
        A.y +
        t*ady

    };

}



/* =========================================
   DISTANCE
========================================= */

function distanceToLine(
    px,
    py,
    line
){

    const dx =
    Math.cos(
        line.angle
    );


    const dy =
    Math.sin(
        line.angle
    );


    return Math.abs(

        (px-line.x)*(-dy)

        +

        (py-line.y)*dx

    );

}



/* =========================================
   ANGLE
========================================= */

function normalizeAngle(a){

    while(
        a > Math.PI/2
    ){

        a -= Math.PI;

    }


    while(
        a < -Math.PI/2
    ){

        a += Math.PI;

    }


    return a;

}



/* =========================================
   LOCKED UI
========================================= */

function updateLockedUI(){

    scoreEl.innerHTML =
    `${currentScore}
    <small>/100</small>`;


    if(
        lockedMode ===
        "inverseV"
    ){

        compositionEl.innerText =
        "▽ 倒 V・透視";


        descEl.innerText =
        "目標消失點已鎖定";

    }

    else{

        compositionEl.innerText =
        "V 型構圖";


        descEl.innerText =
        "目標消失點已鎖定";

    }


    messageEl.innerText =
    "🔒 目標已固定，移動手機測試";

}



/* =========================================
   CANVAS
========================================= */

function resizeOverlay(){

    const rect =
    overlay.getBoundingClientRect();


    const dpr =
    window.devicePixelRatio || 1;


    overlay.width =
    rect.width*dpr;


    overlay.height =
    rect.height*dpr;


    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

}



/* =========================================
   DRAW LOCKED GUIDE
========================================= */

function drawLockedGuide(){

    if(!targetGuide)
    return;


    const w =
    overlay.clientWidth;


    const h =
    overlay.clientHeight;


    /*
    ★ 只讀 targetGuide

    這個 function
    完全不呼叫影像分析。
    */

    const vx =
    targetGuide.vx*w;


    const vy =
    targetGuide.vy*h;


    const left =
    extendLine(

        vx,
        vy,

        targetGuide.left.x*w,

        targetGuide.left.y*h,

        4.5

    );


    const right =
    extendLine(

        vx,
        vy,

        targetGuide.right.x*w,

        targetGuide.right.y*h,

        4.5

    );


    ctx.save();


    /*
    V5.7.1 固定白色。

    不因分數變色，
    先確認位置是否真的鎖死。
    */

    ctx.strokeStyle =
    "rgba(255,255,255,.95)";


    ctx.fillStyle =
    "#35ff68";


    ctx.lineWidth = 3;


    ctx.setLineDash([
        13,
        9
    ]);


    /*
    LEFT
    */

    ctx.beginPath();


    ctx.moveTo(
        vx,
        vy
    );


    ctx.lineTo(
        left.x,
        left.y
    );


    ctx.stroke();



    /*
    RIGHT
    */

    ctx.beginPath();


    ctx.moveTo(
        vx,
        vy
    );


    ctx.lineTo(
        right.x,
        right.y
    );


    ctx.stroke();



    /*
    消失點
    */

    ctx.setLineDash([]);


    ctx.beginPath();


    ctx.arc(
        vx,
        vy,
        7,
        0,
        Math.PI*2
    );


    ctx.fill();



    ctx.strokeStyle =
    "#35ff68";


    ctx.lineWidth = 2;


    ctx.beginPath();


    ctx.arc(
        vx,
        vy,
        15,
        0,
        Math.PI*2
    );


    ctx.stroke();



    ctx.font =
    "bold 14px Arial";


    ctx.textAlign =
    "center";


    ctx.fillStyle =
    "#35ff68";


    ctx.fillText(
        "🔒 目標點",
        vx,
        vy-23
    );


    ctx.restore();

}



/* =========================================
   EXTEND
========================================= */

function extendLine(
    x1,
    y1,
    x2,
    y2,
    scale
){

    return{

        x:
        x1 +
        (x2-x1)*scale,

        y:
        y1 +
        (y2-y1)*scale

    };

}



/* =========================================
   DRAW LOOP

   ★★★ 注意 ★★★

   V5.7.1 這裡完全沒有：
   analyzePerspective()

   所以畫面更新時，
   不可能重新算消失點。
========================================= */

function loop(){

    ctx.clearRect(

        0,
        0,

        overlay.clientWidth,

        overlay.clientHeight

    );


    if(
        navigation
        &&
        targetGuide
    ){

        drawLockedGuide();

    }


    requestAnimationFrame(
        loop
    );

}



/* =========================================
   ZOOM
========================================= */

zoom.addEventListener(
"input",
async function(){

    const value =
    Number(
        this.value
    );


    zoomText.innerText =
    value.toFixed(1)
    +
    "×";


    if(!stream)
    return;


    const track =
    stream
    .getVideoTracks()[0];


    if(
        !track
        ||
        !track.getCapabilities
    )
    return;


    const cap =
    track.getCapabilities();


    if(!cap.zoom)
    return;


    try{

        await track.applyConstraints({

            advanced:[
                {
                    zoom:value
                }
            ]

        });

    }

    catch(error){

        console.log(
            "Zoom unsupported"
        );

    }

});



window.addEventListener(
    "resize",
    resizeOverlay
);



startCamera();


requestAnimationFrame(
    loop
);

</script>
