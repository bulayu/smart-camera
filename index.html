<!DOCTYPE html>
<html lang="zh-TW">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               user-scalable=no,
               viewport-fit=cover">

<title>智慧構圖助手 V5.1</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    background: black;
    color: white;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        Arial,
        sans-serif;

    text-align: center;
}

#topBar {
    padding-top:
        max(
            8px,
            env(safe-area-inset-top)
        );

    padding-bottom: 6px;
}

#title {
    font-size: 19px;
    font-weight: 600;
}

#status {
    min-height: 18px;

    margin-top: 4px;

    font-size: 13px;

    color: #aaaaaa;
}


/* ==================================
   相機區
================================== */

#cameraBox {
    position: relative;

    width: 100%;
    max-width: 900px;

    margin: auto;

    background: #111;

    overflow: hidden;
}

#camera {
    display: block;

    width: 100%;
    height: auto;
}

#overlay {
    position: absolute;

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    pointer-events: none;
}


/* ==================================
   按鈕
================================== */

#controls {
    padding:
        10px 4px
        calc(
            15px +
            env(safe-area-inset-bottom)
        );
}

button {
    border: none;

    border-radius: 12px;

    padding: 11px 15px;

    margin: 4px;

    font-size: 16px;

    background: #292929;

    color: white;
}

.cameraButton {
    min-width: 118px;
}

#shutterButton {
    width: 72px;
    height: 72px;

    padding: 0;

    margin: 9px 12px;

    border-radius: 50%;

    border: 4px solid white;

    background: #222;

    font-size: 29px;
}


/* ==================================
   照片預覽
================================== */

#photoPreview {
    display: none;

    width: 170px;
    max-width: 45%;

    margin-bottom: 20px;

    border-radius: 10px;

    border: 2px solid white;
}

#photoCanvas,
#analysisCanvas {
    display: none;
}

</style>

</head>


<body>


<div id="topBar">

    <div id="title">
        📷 智慧構圖助手
    </div>

    <div id="status">
        AI 載入中...
    </div>

</div>


<div id="cameraBox">

    <video
        id="camera"
        autoplay
        muted
        playsinline>
    </video>

    <canvas id="overlay"></canvas>

</div>


<div id="controls">

    <button
        class="cameraButton"
        onclick="openFrontCamera()">
        🤳 前鏡頭
    </button>

    <button
        class="cameraButton"
        onclick="openRearCamera()">
        📷 後鏡頭
    </button>

    <br>

    <button
        id="shutterButton"
        onclick="takePhoto()">
        📸
    </button>

    <button onclick="stopCamera()">
        關閉
    </button>

</div>


<img id="photoPreview">


<canvas id="photoCanvas"></canvas>

<canvas id="analysisCanvas"></canvas>



<script type="module">

import {

    FaceDetector,
    ObjectDetector,
    FilesetResolver

}
from
"https://unpkg.com/@mediapipe/tasks-vision@0.10.35/vision_bundle.mjs";


/* =====================================================
   AI
===================================================== */

let faceDetector = null;

let objectDetector = null;

let aiReady = false;


/* =====================================================
   相機
===================================================== */

let stream = null;

let cameraRunning = false;

let currentMode =
    "environment";

let frontDeviceId =
    "";

let rearDeviceId =
    "";

let cameraSession =
    0;


/* =====================================================
   執行時間
===================================================== */

let lastVideoTime =
    -1;

let lastRearAnalysis =
    0;

let lastSceneAnalysis =
    0;


/* =====================================================
   目標框

   這次不再只用一個點。

   改成真正的：
   x / y / width / height
===================================================== */

let targetRect = null;

let smoothRect = null;


/* =====================================================
   綠色判斷
===================================================== */

let okCounter =
    0;

let compositionOK =
    false;


/* =====================================================
   鎖定構圖

   避免人物稍微移動，
   目標框就左右亂跳。
===================================================== */

let lockedSide =
    "";

let sideLockUntil =
    0;

const SIDE_LOCK_TIME =
    4500;


/* =====================================================
   場景推薦位置鎖定
===================================================== */

let sceneTargetUntil =
    0;


/* =====================================================
   HTML
===================================================== */

const video =
    document.getElementById(
        "camera"
    );


const overlay =
    document.getElementById(
        "overlay"
    );


const ctx =
    overlay.getContext(
        "2d"
    );


const statusText =
    document.getElementById(
        "status"
    );


const photoCanvas =
    document.getElementById(
        "photoCanvas"
    );


const photoCtx =
    photoCanvas.getContext(
        "2d"
    );


const photoPreview =
    document.getElementById(
        "photoPreview"
    );


const analysisCanvas =
    document.getElementById(
        "analysisCanvas"
    );


const analysisCtx =
    analysisCanvas.getContext(

        "2d",

        {
            willReadFrequently:
                true
        }

    );


/* =====================================================
   載入 AI
===================================================== */

async function loadAI() {

    try {

        statusText.innerText =
            "正在載入 AI...";


        const vision =
            await FilesetResolver
                .forVisionTasks(

                "https://unpkg.com/@mediapipe/tasks-vision@0.10.35/wasm"

            );


        /*
        前鏡頭：
        人臉偵測
        */

        faceDetector =
            await FaceDetector
                .createFromOptions(

                vision,

                {

                    baseOptions: {

                        modelAssetPath:

                        "https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite"

                    },

                    runningMode:
                        "VIDEO",

                    minDetectionConfidence:
                        0.55

                }

            );


        /*
        後鏡頭：
        人、車、狗、貓...
        */

        objectDetector =
            await ObjectDetector
                .createFromOptions(

                vision,

                {

                    baseOptions: {

                        modelAssetPath:

                        "https://storage.googleapis.com/mediapipe-tasks/object_detector/efficientdet_lite0_uint8.tflite"

                    },

                    runningMode:
                        "VIDEO",

                    scoreThreshold:
                        0.45,

                    maxResults:
                        6

                }

            );


        aiReady =
            true;


        statusText.innerText =
            "✅ AI 已準備完成";

    }

    catch(error) {

        console.error(
            error
        );


        statusText.innerText =
            "❌ AI 載入失敗";

    }

}


/* =====================================================
   找前 / 後鏡頭
===================================================== */

async function prepareCameraDevices() {

    try {

        const tempStream =
            await navigator.mediaDevices
                .getUserMedia({

                    video: true,

                    audio: false

                });


        tempStream
            .getTracks()
            .forEach(

                track =>
                    track.stop()

            );


        const devices =
            await navigator.mediaDevices
                .enumerateDevices();


        const cameras =
            devices.filter(

                device =>
                    device.kind ===
                    "videoinput"

            );


        frontDeviceId =
            "";

        rearDeviceId =
            "";


        for (
            const camera
            of cameras
        ) {

            const name =
                (
                    camera.label ||
                    ""
                )
                .toLowerCase();


            /*
            前鏡頭
            */

            if (
                !frontDeviceId
                &&
                (
                    name.includes("front")
                    ||
                    name.includes("user")
                    ||
                    name.includes("前")
                )
            ) {

                frontDeviceId =
                    camera.deviceId;

            }


            /*
            後鏡頭
            */

            const isRear =

                name.includes("back")

                ||

                name.includes("rear")

                ||

                name.includes("environment")

                ||

                name.includes("後");


            /*
            優先正常廣角鏡頭
            */

            const specialLens =

                name.includes("ultra")

                ||

                name.includes("tele")

                ||

                name.includes("zoom");


            if (
                !rearDeviceId
                &&
                isRear
                &&
                !specialLens
            ) {

                rearDeviceId =
                    camera.deviceId;

            }

        }


        /*
        找不到一般後鏡頭，
        再退而求其次。
        */

        if (
            !rearDeviceId
        ) {

            for (
                const camera
                of cameras
            ) {

                const name =
                    (
                        camera.label ||
                        ""
                    )
                    .toLowerCase();


                if (
                    name.includes("back")
                    ||
                    name.includes("rear")
                    ||
                    name.includes("後")
                ) {

                    rearDeviceId =
                        camera.deviceId;

                    break;

                }

            }

        }

    }

    catch(error) {

        console.log(
            error
        );

    }

}


/* =====================================================
   開前鏡頭
===================================================== */

async function openFrontCamera() {

    await openCamera(
        "user"
    );

}


/* =====================================================
   開後鏡頭
===================================================== */

async function openRearCamera() {

    await openCamera(
        "environment"
    );

}


/* =====================================================
   開相機
===================================================== */

async function openCamera(
    mode
) {

    if (!aiReady) {

        alert(
            "AI 還在載入，請稍等一下"
        );

        return;

    }


    if (
        !frontDeviceId
        &&
        !rearDeviceId
    ) {

        statusText.innerText =
            "正在取得相機權限...";


        await prepareCameraDevices();

    }


    cameraSession++;


    const thisSession =
        cameraSession;


    cameraRunning =
        false;


    stopCurrentStream();


    try {

        let constraints;


        if (
            mode === "user"
            &&
            frontDeviceId
        ) {

            constraints = {

                video: {

                    deviceId: {

                        exact:
                            frontDeviceId

                    }

                },

                audio:
                    false

            };

        }


        else if (
            mode === "environment"
            &&
            rearDeviceId
        ) {

            constraints = {

                video: {

                    deviceId: {

                        exact:
                            rearDeviceId

                    }

                },

                audio:
                    false

            };

        }


        else {

            constraints = {

                video: {

                    facingMode: {

                        exact:
                            mode

                    }

                },

                audio:
                    false

            };

        }


        stream =
            await navigator.mediaDevices
                .getUserMedia(
                    constraints
                );

    }

    catch(error) {

        try {

            stream =
                await navigator.mediaDevices
                    .getUserMedia({

                        video: {

                            facingMode:
                                mode

                        },

                        audio:
                            false

                    });

        }

        catch(error2) {

            statusText.innerText =
                "❌ 無法開啟相機";

            return;

        }

    }


    video.srcObject =
        stream;


    await video.play();


    currentMode =
        mode;


    cameraRunning =
        true;


    resetComposition();


    statusText.innerText =

        mode === "user"

        ?

        "🤳 前鏡頭"

        :

        "📷 後鏡頭";


    requestAnimationFrame(

        () =>
            cameraLoop(
                thisSession
            )

    );

}


/* =====================================================
   重設
===================================================== */

function resetComposition() {

    lastVideoTime =
        -1;


    lastRearAnalysis =
        0;


    lastSceneAnalysis =
        0;


    targetRect =
        null;


    smoothRect =
        null;


    okCounter =
        0;


    compositionOK =
        false;


    lockedSide =
        "";


    sideLockUntil =
        0;


    sceneTargetUntil =
        0;

}


/* =====================================================
   關閉目前串流
===================================================== */

function stopCurrentStream() {

    if (stream) {

        stream
            .getTracks()
            .forEach(

                track =>
                    track.stop()

            );


        stream =
            null;

    }

}


/* =====================================================
   關閉相機
===================================================== */

function stopCamera() {

    cameraSession++;


    cameraRunning =
        false;


    stopCurrentStream();


    video.srcObject =
        null;


    resetComposition();


    ctx.clearRect(

        0,
        0,

        overlay.width,
        overlay.height

    );


    statusText.innerText =
        "相機已關閉";

}


/* =====================================================
   主循環
===================================================== */

function cameraLoop(
    session
) {

    if (
        session !==
        cameraSession
    ) {

        return;

    }


    if (!cameraRunning) {

        return;

    }


    if (
        video.readyState >= 2
        &&
        video.videoWidth > 0
        &&
        video.videoHeight > 0
    ) {

        if (
            currentMode ===
            "user"
        ) {

            processFront();

        }

        else {

            processRear();

        }

    }


    smoothGuideRect();


    drawGuideRect();


    requestAnimationFrame(

        () =>
            cameraLoop(
                session
            )

    );

}


/* =====================================================
   前鏡頭

   自拍依然使用人臉位置。

   但容許範圍比以前大很多。
===================================================== */

function processFront() {

    if (
        video.currentTime ===
        lastVideoTime
    ) {

        return;

    }


    lastVideoTime =
        video.currentTime;


    let result;


    try {

        result =
            faceDetector.detectForVideo(

                video,

                performance.now()

            );

    }

    catch(error) {

        return;

    }


    if (
        !result.detections
        ||
        result.detections.length === 0
    ) {

        return;

    }


    /*
    找最大臉
    */

    let best =
        null;


    let bestArea =
        0;


    for (
        const detection
        of result.detections
    ) {

        const box =
            detection.boundingBox;


        const area =
            box.width *
            box.height;


        if (
            area >
            bestArea
        ) {

            bestArea =
                area;


            best =
                box;

        }

    }


    if (!best) {

        return;

    }


    const width =
        video.clientWidth;


    const height =
        video.clientHeight;


    const sx =
        width /
        video.videoWidth;


    const sy =
        height /
        video.videoHeight;


    const faceX =

        (
            best.originX +
            best.width / 2
        )

        *
        sx;


    const faceY =

        (
            best.originY +
            best.height / 2
        )

        *
        sy;


    /*
    自拍目標區
    */

    setSideLock(
        faceX,
        width
    );


    const centerX =

        lockedSide === "left"

        ?

        width * 0.36

        :

        width * 0.64;


    targetRect = {

        x:
            centerX -
            width * 0.16,

        y:
            height * 0.13,

        width:
            width * 0.32,

        height:
            height * 0.42

    };


    /*
    自拍 OK：
    臉只要在合理區域
    就變綠。
    */

    const dx =
        Math.abs(
            faceX -
            centerX
        );


    const dy =
        Math.abs(
            faceY -
            height * 0.34
        );


    const ok =

        dx <
        width * 0.12

        &&

        dy <
        height * 0.15;


    updateOK(
        ok
    );

}


/* =====================================================
   後鏡頭
===================================================== */

function processRear() {

    const now =
        performance.now();


    /*
    不用每一 frame 都跑 AI。
    */

    if (
        now -
        lastRearAnalysis
        <
        280
    ) {

        return;

    }


    lastRearAnalysis =
        now;


    let result =
        null;


    try {

        result =
            objectDetector.detectForVideo(

                video,
                now

            );

    }

    catch(error) {

        console.log(
            error
        );

    }


    const subject =
        chooseMainSubject(
            result
        );


    if (subject) {

        /*
        最重要：
        person 走人物專用演算法
        */

        if (
            subject.category ===
            "person"
        ) {

            processPerson(
                subject
            );

        }

        else {

            processObject(
                subject
            );

        }


        return;

    }


    /*
    沒辨識到東西
    → 風景構圖
    */

    processScene();

}


/* =====================================================
   選主要主體
===================================================== */

function chooseMainSubject(
    result
) {

    if (
        !result
        ||
        !result.detections
        ||
        result.detections.length === 0
    ) {

        return null;

    }


    let best =
        null;


    let bestScore =
        -Infinity;


    const frameArea =

        video.videoWidth *
        video.videoHeight;


    for (
        const detection
        of result.detections
    ) {

        const box =
            detection.boundingBox;


        if (!box) {

            continue;

        }


        const category =
            detection.categories?.[0];


        const confidence =
            category?.score || 0;


        const areaRatio =

            (
                box.width *
                box.height
            )

            /
            frameArea;


        /*
        太小的不當主角
        */

        if (
            areaRatio <
            0.012
        ) {

            continue;

        }


        const cx =

            box.originX +
            box.width / 2;


        const cy =

            box.originY +
            box.height / 2;


        const nx =

            cx /
            video.videoWidth;


        const ny =

            cy /
            video.videoHeight;


        const distance =

            Math.hypot(

                nx - 0.5,

                ny - 0.5

            );


        /*
        人物稍微加權。

        因為有人時，
        通常人比較可能是主角。
        */

        const personBonus =

            category?.categoryName ===
            "person"

            ?

            0.25

            :

            0;


        const score =

            areaRatio *
            3

            +

            confidence

            +

            personBonus

            -

            distance *
            0.20;


        if (
            score >
            bestScore
        ) {

            bestScore =
                score;


            best = {

                box:
                    box,

                category:
                    category?.categoryName || "",

                confidence:
                    confidence

            };

        }

    }


    return best;

}


/* =====================================================
   ★ V5.1 核心
   人物整體構圖

   不再看一個中心點。

   會看：
   - 頭頂空間
   - 腳部空間
   - 人物大小
   - 左右位置
===================================================== */

function processPerson(
    subject
) {

    const width =
        video.clientWidth;


    const height =
        video.clientHeight;


    const sx =
        width /
        video.videoWidth;


    const sy =
        height /
        video.videoHeight;


    const box =
        subject.box;


    const x =
        box.originX *
        sx;


    const y =
        box.originY *
        sy;


    const w =
        box.width *
        sx;


    const h =
        box.height *
        sy;


    const personCenterX =
        x +
        w / 2;


    const personBottom =
        y +
        h;


    /*
    人物佔畫面的高度比例
    */

    const heightRatio =

        h /
        height;


    /*
    鎖定左 / 右位置

    不讓框一直左右跳。
    */

    setSideLock(

        personCenterX,
        width

    );


    let centerX;


    /*
    如果人物本來就很靠中央，
    使用居中構圖。

    否則使用左右三分附近。
    */

    if (
        Math.abs(
            personCenterX -
            width / 2
        )
        <
        width * 0.10
    ) {

        centerX =
            width * 0.50;

    }

    else {

        centerX =

            lockedSide === "left"

            ?

            width * 0.35

            :

            width * 0.65;

    }


    /*
    ==================================
    全身人物
    ==================================

    人的高度大於畫面約 52%
    */

    if (
        heightRatio >=
        0.52
    ) {

        targetRect = {

            x:
                centerX -
                width * 0.18,

            y:
                height * 0.07,

            width:
                width * 0.36,

            height:
                height * 0.86

        };


        /*
        綠色條件：

        1.
        人物左右大致合理

        2.
        頭頂不要切掉

        3.
        腳不要切掉

        4.
        人不要太小
        */

        const horizontalOK =

            Math.abs(

                personCenterX -
                centerX

            )
            <
            width * 0.13;


        /*
        頭頂位置：

        允許 0 ~ 26% 畫面高度。
        */

        const headOK =

            y >
            -height * 0.03

            &&

            y <
            height * 0.26;


        /*
        腳底：

        允許落在
        畫面的約 72% ~ 100%。
        */

        const feetOK =

            personBottom >
            height * 0.72

            &&

            personBottom <
            height * 1.02;


        /*
        人物尺寸合理
        */

        const sizeOK =

            heightRatio >
            0.48

            &&

            heightRatio <
            0.98;


        updateOK(

            horizontalOK
            &&
            headOK
            &&
            feetOK
            &&
            sizeOK

        );

    }


    /*
    ==================================
    半身人物
    ==================================
    */

    else if (
        heightRatio >=
        0.30
    ) {

        targetRect = {

            x:
                centerX -
                width * 0.20,

            y:
                height * 0.10,

            width:
                width * 0.40,

            height:
                height * 0.65

        };


        const horizontalOK =

            Math.abs(

                personCenterX -
                centerX

            )
            <
            width * 0.14;


        const headOK =

            y >
            -height * 0.03

            &&

            y <
            height * 0.28;


        const sizeOK =

            heightRatio >
            0.28

            &&

            heightRatio <
            0.75;


        updateOK(

            horizontalOK
            &&
            headOK
            &&
            sizeOK

        );

    }


    /*
    ==================================
    人物比較遠
    ==================================
    */

    else {

        targetRect = {

            x:
                centerX -
                width * 0.17,

            y:
                height * 0.19,

            width:
                width * 0.34,

            height:
                height * 0.48

        };


        const horizontalOK =

            Math.abs(

                personCenterX -
                centerX

            )
            <
            width * 0.15;


        const verticalOK =

            y >
            height * 0.05

            &&

            personBottom <
            height * 0.92;


        updateOK(

            horizontalOK
            &&
            verticalOK

        );

    }

}


/* =====================================================
   左右位置鎖定
===================================================== */

function setSideLock(

    subjectX,
    width

) {

    const now =
        performance.now();


    if (
        lockedSide
        &&
        now <
        sideLockUntil
    ) {

        return;

    }


    if (
        subjectX <
        width / 2
    ) {

        lockedSide =
            "left";

    }

    else {

        lockedSide =
            "right";

    }


    sideLockUntil =

        now +
        SIDE_LOCK_TIME;

}


/* =====================================================
   一般物件構圖

   車 / 狗 / 貓 / 椅子等。
===================================================== */

function processObject(
    subject
) {

    const width =
        video.clientWidth;


    const height =
        video.clientHeight;


    const sx =
        width /
        video.videoWidth;


    const sy =
        height /
        video.videoHeight;


    const box =
        subject.box;


    const x =
        box.originX *
        sx;


    const y =
        box.originY *
        sy;


    const w =
        box.width *
        sx;


    const h =
        box.height *
        sy;


    const cx =
        x +
        w / 2;


    const cy =
        y +
        h / 2;


    setSideLock(
        cx,
        width
    );


    /*
    常見動物
    */

    const livingThings = [

        "dog",
        "cat",
        "bird",
        "horse",
        "cow",
        "sheep"

    ];


    let centerX;


    if (
        Math.abs(
            cx -
            width / 2
        )
        <
        width * 0.08
    ) {

        centerX =
            width * 0.50;

    }

    else {

        centerX =

            lockedSide === "left"

            ?

            width * 0.38

            :

            width * 0.62;

    }


    let centerY;


    if (
        livingThings.includes(
            subject.category
        )
    ) {

        centerY =
            height * 0.43;

    }

    else {

        centerY =
            height * 0.50;

    }


    const guideWidth =

        Math.max(

            width * 0.25,

            Math.min(

                width * 0.42,

                w * 1.30

            )

        );


    const guideHeight =

        Math.max(

            height * 0.20,

            Math.min(

                height * 0.48,

                h * 1.30

            )

        );


    targetRect = {

        x:
            centerX -
            guideWidth / 2,

        y:
            centerY -
            guideHeight / 2,

        width:
            guideWidth,

        height:
            guideHeight

    };


    /*
    一般物件的 OK
    不需要精準重疊。

    只要中心進入
    目標框較大的合理區。
    */

    const horizontalOK =

        Math.abs(
            cx -
            centerX
        )
        <
        guideWidth *
        0.48;


    const verticalOK =

        Math.abs(
            cy -
            centerY
        )
        <
        guideHeight *
        0.55;


    updateOK(

        horizontalOK
        &&
        verticalOK

    );

}


/* =====================================================
   無明確主體：
   風景構圖
===================================================== */

function processScene() {

    const now =
        performance.now();


    if (
        now -
        lastSceneAnalysis
        <
        500
    ) {

        return;

    }


    lastSceneAnalysis =
        now;


    /*
    還在鎖定期間，
    目標框不要一直跳。
    */

    if (
        targetRect
        &&
        now <
        sceneTargetUntil
    ) {

        compositionOK =
            false;

        return;

    }


    const w =
        120;


    const h =
        80;


    analysisCanvas.width =
        w;


    analysisCanvas.height =
        h;


    analysisCtx.drawImage(

        video,

        0,
        0,

        w,
        h

    );


    const image =
        analysisCtx.getImageData(

            0,
            0,

            w,
            h

        );


    const data =
        image.data;


    const gray =
        new Float32Array(
            w * h
        );


    /*
    RGB → 灰階
    */

    for (
        let y = 0;
        y < h;
        y++
    ) {

        for (
            let x = 0;
            x < w;
            x++
        ) {

            const i =

                (
                    y * w +
                    x
                )

                *
                4;


            gray[
                y * w +
                x
            ] =

                data[i] *
                0.299

                +

                data[i + 1] *
                0.587

                +

                data[i + 2] *
                0.114;

        }

    }


    /*
    畫面切成 5 × 5

    找細節 / 對比
    最明顯的位置。
    */

    let bestCol =
        2;


    let bestRow =
        2;


    let bestEnergy =
        -1;


    const cols =
        5;


    const rows =
        5;


    for (
        let row = 0;
        row < rows;
        row++
    ) {

        for (
            let col = 0;
            col < cols;
            col++
        ) {

            const startX =
                Math.floor(
                    col *
                    w /
                    cols
                );


            const endX =
                Math.floor(
                    (col + 1) *
                    w /
                    cols
                );


            const startY =
                Math.floor(
                    row *
                    h /
                    rows
                );


            const endY =
                Math.floor(
                    (row + 1) *
                    h /
                    rows
                );


            let energy =
                0;


            for (
                let yy = startY + 1;
                yy < endY - 1;
                yy += 2
            ) {

                for (
                    let xx = startX + 1;
                    xx < endX - 1;
                    xx += 2
                ) {

                    const center =

                        gray[
                            yy * w +
                            xx
                        ];


                    const right =

                        gray[
                            yy * w +
                            xx + 1
                        ];


                    const below =

                        gray[
                            (yy + 1) *
                            w +
                            xx
                        ];


                    energy +=

                        Math.abs(

                            center -
                            right

                        )

                        +

                        Math.abs(

                            center -
                            below

                        );

                }

            }


            /*
            稍微降低正中央，
            避免所有風景都叫你置中。
            */

            if (
                col === 2
                &&
                row === 2
            ) {

                energy *=
                    0.82;

            }


            if (
                energy >
                bestEnergy
            ) {

                bestEnergy =
                    energy;


                bestCol =
                    col;


                bestRow =
                    row;

            }

        }

    }


    const width =
        video.clientWidth;


    const height =
        video.clientHeight;


    /*
    將找到的視覺重心
    吸附到比較自然的構圖位置。
    */

    let centerX;


    if (
        bestCol <= 1
    ) {

        centerX =
            width * 0.382;

    }

    else if (
        bestCol >= 3
    ) {

        centerX =
            width * 0.618;

    }

    else {

        centerX =
            width * 0.50;

    }


    let centerY;


    if (
        bestRow <= 1
    ) {

        centerY =
            height * 0.38;

    }

    else if (
        bestRow >= 3
    ) {

        centerY =
            height * 0.62;

    }

    else {

        centerY =
            height * 0.50;

    }


    targetRect = {

        x:
            centerX -
            width * 0.14,

        y:
            centerY -
            height * 0.11,

        width:
            width * 0.28,

        height:
            height * 0.22

    };


    /*
    風景沒有明確主體，
    所以目前不強制變綠。

    目標框單純作為
    AI 建議視覺位置。
    */

    compositionOK =
        false;


    sceneTargetUntil =

        now +
        4000;

}


/* =====================================================
   OK 狀態

   以前要一直精準對準。

   現在只要連續 2 次
   落在合理構圖範圍
   就變綠。

   更容易成功。
===================================================== */

function updateOK(
    ok
) {

    if (ok) {

        okCounter +=
            1;

    }

    else {

        okCounter -=
            1;

    }


    okCounter =
        Math.max(

            0,

            Math.min(
                6,
                okCounter
            )

        );


    compositionOK =

        okCounter >=
        2;

}


/* =====================================================
   讓目標框平滑
===================================================== */

function smoothGuideRect() {

    if (!targetRect) {

        return;

    }


    if (!smoothRect) {

        smoothRect = {

            x:
                targetRect.x,

            y:
                targetRect.y,

            width:
                targetRect.width,

            height:
                targetRect.height

        };


        return;

    }


    /*
    新位置 18%
    舊位置 82%

    不會突然瞬移。
    */

    smoothRect.x =

        smoothRect.x *
        0.82

        +

        targetRect.x *
        0.18;


    smoothRect.y =

        smoothRect.y *
        0.82

        +

        targetRect.y *
        0.18;


    smoothRect.width =

        smoothRect.width *
        0.82

        +

        targetRect.width *
        0.18;


    smoothRect.height =

        smoothRect.height *
        0.82

        +

        targetRect.height *
        0.18;

}


/* =====================================================
   畫目標框

   仍然只有一個框。

   白色 = 建議位置
   綠色 = 構圖已合理
===================================================== */

function drawGuideRect() {

    const width =
        video.clientWidth;


    const height =
        video.clientHeight;


    overlay.width =
        width;


    overlay.height =
        height;


    ctx.clearRect(

        0,
        0,

        width,
        height

    );


    if (!smoothRect) {

        return;

    }


    /*
    避免框跑出畫面
    */

    let x =
        smoothRect.x;


    let y =
        smoothRect.y;


    let w =
        smoothRect.width;


    let h =
        smoothRect.height;


    x =
        Math.max(
            8,
            Math.min(
                width - w - 8,
                x
            )
        );


    y =
        Math.max(
            8,
            Math.min(
                height - h - 8,
                y
            )
        );


    ctx.strokeStyle =

        compositionOK

        ?

        "#48ff70"

        :

        "rgba(255,255,255,0.92)";


    ctx.lineWidth =

        compositionOK

        ?

        5

        :

        3;


    ctx.shadowColor =
        "rgba(0,0,0,0.75)";


    ctx.shadowBlur =
        5;


    /*
    只畫四個角，
    不用整個框把畫面遮住。
    */

    drawCornerFrame(

        x,
        y,
        w,
        h

    );


    ctx.shadowBlur =
        0;

}


/* =====================================================
   四角框
===================================================== */

function drawCornerFrame(

    x,
    y,
    width,
    height

) {

    const corner =

        Math.min(
            width,
            height
        )

        *
        0.23;


    ctx.beginPath();


    /*
    左上
    */

    ctx.moveTo(
        x + corner,
        y
    );

    ctx.lineTo(
        x,
        y
    );

    ctx.lineTo(
        x,
        y + corner
    );


    /*
    右上
    */

    ctx.moveTo(
        x + width - corner,
        y
    );

    ctx.lineTo(
        x + width,
        y
    );

    ctx.lineTo(
        x + width,
        y + corner
    );


    /*
    左下
    */

    ctx.moveTo(
        x,
        y + height - corner
    );

    ctx.lineTo(
        x,
        y + height
    );

    ctx.lineTo(
        x + corner,
        y + height
    );


    /*
    右下
    */

    ctx.moveTo(
        x + width - corner,
        y + height
    );

    ctx.lineTo(
        x + width,
        y + height
    );

    ctx.lineTo(
        x + width,
        y + height - corner
    );


    ctx.stroke();

}


/* =====================================================
   拍照
===================================================== */

function takePhoto() {

    if (
        !cameraRunning
        ||
        video.videoWidth === 0
    ) {

        alert(
            "請先開啟相機"
        );

        return;

    }


    photoCanvas.width =
        video.videoWidth;


    photoCanvas.height =
        video.videoHeight;


    /*
    只拍原始照片。

    AI 目標框不會拍進去。
    */

    photoCtx.drawImage(

        video,

        0,
        0,

        photoCanvas.width,
        photoCanvas.height

    );


    const imageData =
        photoCanvas.toDataURL(

            "image/jpeg",

            0.94

        );


    photoPreview.src =
        imageData;


    photoPreview.style.display =
        "inline-block";


    statusText.innerText =
        "📸 拍照完成";

}


/* =====================================================
   HTML 按鈕
===================================================== */

window.openFrontCamera =
    openFrontCamera;


window.openRearCamera =
    openRearCamera;


window.takePhoto =
    takePhoto;


window.stopCamera =
    stopCamera;


/* =====================================================
   啟動
===================================================== */

loadAI();

</script>
